        },
        {
          "name": "audit_dark_patterns",
          "title": "Dark patterns",
          "description": "Audit screen copy, HTML or a public URL for deceptive-design (dark pattern) signals: confirmshaming, forced continuity and hard-to-cancel flows, pre-selected options, false urgency and fake scarcity, misdirection by visual weight, hidden costs, trick questions and double negatives, nagging, forced action or registration, disguised ads, obstruction, and social proof without a source. Give text (one string per line, optional prefixes like button:, link:, checkbox:), and/or html, and/or url. Markup signals include checked inputs, a prominent accept button beside a quiet decline link, countdown timers and cancel flows longer than sign-up flows. Each finding has severity, the evidence string and a fix, and echoes frameworks in general terms (FTC negative option guidance, EU Digital Services Act and Consumer Rights Directive, CPRA). Signals for review, not a legal finding.",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "Page or component HTML, to catch checked inputs, timers and control styling",
                "type": "string"
              },
              "text": {
                "description": "Screen copy and control labels, one per line, with optional prefixes such as button:, link:, checkbox:, text:. You can describe flows too: 'signup: 2 steps', 'cancel: 6 steps'.",
                "type": "string"
              },
              "url": {
                "description": "Public page to fetch and check (static HTML only)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e48c89636e80c8e811805524544d88ceddcddb989b0f7eff91298943f4708eb"
        },
        {
          "name": "audit_email_accessibility",
          "title": "Email accessibility audit",
          "description": "Accessibility audit of marketing or transactional email HTML. Pass the full source as `html`. Checks layout tables missing role=presentation, missing lang and title, images without alt or with decorative alt mistakes, image-only emails and likely text in images, vague link text such as \"click here\", font sizes under 14px, low-contrast inline color pairs, missing preheader, fixed width over 600px, heading structure, color-scheme declaration, estimated tap-target height of table-built buttons, and reading-order risks in multi-column tables. Email clients differ and this reads markup only: it does not render the email, resolve <style> classes for color, or confirm a plain-text alternative. Each finding names the WCAG criterion and a fix.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "html": {
                "description": "The full HTML source of the email.",
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
