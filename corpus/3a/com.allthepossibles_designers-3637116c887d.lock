        },
        {
          "name": "audit_icon_set",
          "title": "Icon set audit",
          "description": "Audits a set of inline SVG icons. Pass `icons` as markup containing one <svg> (or <symbol>) per icon. Reports mixed viewBox sizes, missing viewBox, non-square boxes, width and height ratios that disagree with the viewBox, mixed outline and solid styles, stroke widths and linecap or linejoin that vary, hard-coded colors instead of currentColor, icons neither aria-hidden nor named (WCAG 1.1.1), icons with both, ids repeated across icons, path points outside the viewBox, and icons that fill the artboard very differently from the median. Path extents use command endpoints only and only <path> data. Stroke and grid expectations are conventions. Static; nothing is rendered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "icons": {
                "description": "Markup with several <svg> elements.",
                "type": "string"
              }
            },
            "required": ["icons"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13a6c5a0fc8e7fb242c691cb211b61675f88de6dcc19f90ccf1c395d72220c0f"
        },
        {
          "name": "audit_motion_css",
          "title": "Motion CSS audit",
          "description": "Audit pasted CSS for motion problems. Pass `css` (stylesheet text with @keyframes, animation and transition rules). Optional flash data you measured or know from the design: `flashes_per_second`, `flash_area_percent` (share of the screen that flashes). Flags: animation or transition of layout properties (width, height, top, left, margin, padding, font-size and similar, which force layout), paint-heavy properties, `transition: all`, animations or transitions with no matching prefers-reduced-motion rule, infinite animations with no animation-play-state or pause control in the CSS (WCAG 2.2.2), long durations, and flashing risk against WCAG 2.3.1 (more than three flashes in any one second, unless the flashing area is small). Flash rate from CSS is estimated from the animation duration and cannot see luminance change. Static analysis only.",
          "inputSchema": {
            "properties": {
              "css": {
                "description": "CSS to audit",
                "type": "string"
              },
              "flash_area_percent": {
                "description": "Share of screen that flashes, 0 to 100",
                "type": "number"
              },
              "flashes_per_second": {
                "description": "Flashes per second, if known",
                "type": "number"
              }
            },
            "required": ["css"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
