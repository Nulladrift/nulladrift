          "digest": "sha256:5707810b231f2405a6ee7e7cb96066a1f3ba26255c07c3bb03002cd459645d04"
        },
        {
          "name": "audit_token_scales",
          "title": "Token scale audit",
          "description": "Audit the scales behind a set of design values. Pass `css` (free), a public `url` (Pro), or `values` (JSON with any of colors, fontSizes, spacing, radii; each a list of strings, or {value, count} objects). Reports: colors within deltaE 2 of a more used color (with the one to keep), font sizes, spacing and radii within 1px of each other, values that sit off the detected 4px or 8px grid, gaps between steps, values used exactly once, and a proposed consolidated scale with a table mapping every changed old value to its new value. Mappings snap to the nearest standard step and should be checked on screen before applying.",
          "inputSchema": {
            "properties": {
              "css": {
                "description": "CSS text to read (a stylesheet, or several concatenated). Free up to 100,000 characters; Pro up to 2,000,000.",
                "type": "string"
              },
              "url": {
                "description": "Pro only. Public page whose linked and inline stylesheets are fetched (up to 12 sheets, 5 MB).",
                "type": "string"
