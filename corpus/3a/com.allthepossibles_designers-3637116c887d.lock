      "instructions": "Checks, expert prompts and reference resources for designers working with AI. Start with the getting_started tool or prompt. Tools do the things models do badly (contrast maths, page accessibility audits, slop signals, lint for feedback, research questions and tracking plans, sample sizes). Prompts give you the method for critiques, heuristic evaluations, accessibility reviews, microcopy, research plans, handoff and more; they say which tools to call and how to use the Figma MCP when given a Figma link. Pro adds site crawls, token matrices, scored reports and playbooks. Everything else works without a key. When a tool answers with a notice about Pro, a daily cap or missing input, show that notice to the person as written: it says what happened and how to continue. Tool inputs are processed in memory and not stored, except project context a Pro key saves on purpose; the full data-handling statement is at https://allthepossibles.com/trust.",
      "tools": [
        {
          "name": "alt_text_quality",
          "title": "Alt text quality",
          "description": "Reads alt text on a page. Pass a public `url` or `html`. Counts every img element (not a sample) and states how many it read and how many it skipped as aria-hidden or presentational. Flags missing alt, file names and camera names (IMG_1234, Name_With_Underscores.jpg), alt equal to the file stem, placeholder words, \"image of\" openers, fallback patterns such as \"Title, picture\", duplicate alt text across different images, alts over 150 characters, and empty alt inside a link that has no other text. Also checks og:image:alt and twitter:image:alt (missing, empty, or poor). Tells you if the page was cut off. Reads delivered markup only: script-added images, CSS backgrounds and inline SVG are not seen, and it cannot judge whether a clean description is accurate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "html": {
                "description": "HTML source to check instead of a URL.",
                "type": "string"
              },
              "url": {
                "description": "A public page URL to fetch.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9747b09057f8c69667f3f1e1fae4fd495b2f22f8dc3e19f53caf948df0f36f82"
        },
        {
          "name": "analyse_card_sort",
          "title": "Card sort analyzer",
          "description": "Analyze an open card sort (method after Donna Spencer, Card Sorting). Pass `participants`: an array with one entry per person, each a map of group name to a list of cards (or {id, groups: {...}}). Accepts 3 to 60 participants and 5 to 100 distinct cards. Returns a similarity matrix (percent of participants who grouped each pair), agreement per card pair, suggested categories from average-linkage hierarchical clustering cut at `threshold` percent agreement (default 50), cards with low agreement, and a table of the group labels people used with how many used each. Card names match case-insensitively; labels match on letters and digits only, so synonyms stay separate. Fewer than about 15 participants triggers a caution. It does not explain why people grouped cards, so follow up with interviews.",
          "inputSchema": {
            "properties": {
              "participants": {
                "description": "One entry per participant: {\"Group name\": [\"card\", ...]} or {id, groups}.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "threshold": {
                "description": "Cluster cut-off as percent agreement, 10 to 95. Default 50.",
                "type": "number"
              }
            },
            "required": ["participants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2bd52c717ebaf6455f9aa28a762b2dc90dfde0604541417cb27e5acd292a5789"
        },
        {
          "name": "approx_print_colour",
          "title": "Screen and print color approximation",
          "description": "Approximate between sRGB and CMYK. Pass `value` as hex (#1a2b3c), rgb(26,43,60) or cmyk(60,40,40,100). Returns the other model by a plain formula (K = 1 - max(R,G,B); C = (1 - R - K) / (1 - K); and R = 255 x (1 - C)(1 - K) back), total ink, and gamut cautions. This ships NO Pantone or other licensed color data: if you pass a spot name such as 'PANTONE 485 C', it tells you to look the value up in your licensed swatch book or Adobe's libraries and paste the RGB or CMYK here. APPROXIMATION ONLY: real conversion needs an ICC profile and the paper; the printed color will differ. Proof it.",
          "inputSchema": {
            "properties": {
              "value": {
                "description": "Hex, rgb() or cmyk()",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
