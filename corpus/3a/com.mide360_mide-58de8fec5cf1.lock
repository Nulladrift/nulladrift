          "title": "Buscar en el contenido de MIDE",
          "description": "Busca en los vídeos gratuitos de MIDE (transcripciones) y en la web de Mide360. Devuelve fragmentos breves con título, extracto y enlace (al minuto exacto del vídeo de YouTube o a la página web).",
