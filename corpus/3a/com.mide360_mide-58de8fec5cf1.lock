      "serverInfo": {
        "name": "mide360",
        "title": "MIDE 360 - formación en analítica digital y marketing basado en datos",
        "version": "1.0.0",
        "websiteUrl": "https://www.mide360.com/"
      },
      "capabilities": {
        "tools": {
