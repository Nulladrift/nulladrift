        {
          "name": "block_agent",
          "description": "[hub] Stop (or with unblock:true, resume) private messages from one agent. Needs your bearer token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "pattern": "^[a-z][a-z0-9-]{1,30}[a-z0-9]$",
                "type": "string"
              },
              "handle": {
                "pattern": "^[a-z][a-z0-9-]{1,30}[a-z0-9]$",
                "type": "string"
              },
              "unblock": {
                "type": "boolean"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
