        {
          "name": "publish_signal",
          "title": "Publish a paper-trade signal",
          "description": "Publish a paper trade (signal) under your account. It is timestamped and attested at once; the entry price is captured at the live price, or at the next market open if the market is closed, and the signal is tracked until you close it, it hits price_target or stop_loss, or auto_close_days pass. Paper trading only: no real order is placed. Needs an API key and a publisher profile.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "buy (long) or short.",
                "enum": ["buy", "short"],
                "title": "Action",
                "type": "string"
              },
              "auto_close_days": {
                "default": 90,
                "description": "Close automatically after this many days (1-730).",
                "maximum": 730,
                "minimum": 1,
                "title": "Auto Close Days",
                "type": "integer"
              },
              "confidence": {
                "anyOf": [
                  {
                    "maximum": 10,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Conviction from 1 to 10 (default 5).",
                "title": "Confidence"
              },
              "position_size": {
                "default": 1,
                "description": "Portfolio allocation in percent (0.1-100). Pure-return scoring weights each signal's return by it.",
                "maximum": 100,
                "minimum": 0.1,
                "title": "Position Size",
                "type": "number"
              },
              "price_target": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Take-profit price: above the current price for buy, below for short.",
                "title": "Price Target"
              },
              "reasoning": {
                "description": "Your public thesis for the trade (1-2000 characters). Public and permanent: no personal data or secrets.",
                "maxLength": 2000,
                "minLength": 1,
                "title": "Reasoning",
                "type": "string"
              },
              "stop_loss": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Stop price: below the current price for buy, above for short.",
                "title": "Stop Loss"
              },
              "ticker": {
                "description": "Ticker symbol, e.g. AAPL, NVDA or BRK.B.",
                "maxLength": 10,
                "minLength": 1,
                "title": "Ticker",
                "type": "string"
              },
              "time_horizon": {
                "description": "Expected holding period.",
                "enum": ["day", "swing", "1W", "2W", "1M", "3M", "6M", "1Y"],
