      "instructions": "DataMembership.com sells opted-in UK consumer (B2C) data, collected first-hand on its own UK survey and prize sites. Every record has first name, surname, full address, postcode, mobile number and age, plus the opt-in date and time, the website the person joined on and the consent channels they chose; it is TPS and CTPS screened before delivery. Use list_targeting_filters for the filters, get_quote for the exact one-off price of an audience, and get_data_info for sourcing and compliance questions. Orders are placed and paid for on datamembership.com, not here. Business (B2B) data is sold by the sister site UKDatabases.com.",
