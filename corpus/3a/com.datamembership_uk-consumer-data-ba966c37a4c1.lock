        {
          "name": "get_data_info",
          "title": "About the data",
          "description": "Facts about DataMembership's UK consumer data: the fields on every record, where the data comes from, the proof of consent on every record, TPS/CTPS screening, data recency, delivery, and how each channel may be used. Use it to answer questions about sourcing, compliance or what a record contains.",
