        {
          "name": "foliade_create_shelf",
          "title": "Create a private shelf",
          "description": "Creates a shelf as a draft. The Distributeur plan is required; nothing is published automatically.",
          "inputSchema": {
            "$defs": {
              "ShelfPatch": {
                "additionalProperties": false,
                "properties": {
                  "accent": {
                    "default": null,
                    "pattern": "^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                    "title": "Accent",
                    "type": "string"
                  },
                  "badge": {
                    "default": null,
                    "title": "Badge",
                    "type": "boolean"
                  },
                  "collections": {
                    "default": null,
                    "title": "Collections",
                    "type": "boolean"
                  },
                  "contact": {
                    "default": null,
                    "maxLength": 320,
                    "minLength": 0,
                    "title": "Contact",
                    "type": "string"
                  },
                  "fond": {
                    "default": null,
                    "pattern": "^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                    "title": "Fond",
                    "type": "string"
                  },
                  "intro": {
                    "default": null,
                    "maxLength": 2000,
                    "minLength": 0,
                    "title": "Intro",
                    "type": "string"
                  },
                  "layout": {
                    "default": null,
                    "enum": ["grille", "rayonnage", "liste", "coverflow", "vedette", "kiosque"],
                    "title": "Layout",
                    "type": "string"
                  },
                  "nom": {
                    "default": null,
                    "maxLength": 160,
                    "minLength": 1,
                    "title": "Nom",
                    "type": "string"
                  },
                  "ouverture": {
                    "default": null,
                    "enum": ["page", "onglet"],
                    "title": "Ouverture",
                    "type": "string"
                  },
                  "pied": {
                    "default": null,
                    "maxLength": 300,
                    "minLength": 0,
                    "title": "Pied",
                    "type": "string"
                  },
                  "planche": {
                    "default": null,
                    "enum": ["noyer", "chene", "ebene", "verre", "metal", "beton", "couleur"],
                    "title": "Planche",
                    "type": "string"
                  },
                  "planche_couleur": {
                    "default": null,
                    "pattern": "^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                    "title": "Planche Couleur",
                    "type": "string"
                  },
                  "police_texte": {
                    "default": null,
                    "maxLength": 80,
                    "minLength": 0,
                    "title": "Police Texte",
                    "type": "string"
                  },
                  "police_titre": {
                    "default": null,
                    "maxLength": 80,
                    "minLength": 0,
                    "title": "Police Titre",
                    "type": "string"
                  },
                  "recherche": {
                    "default": null,
                    "title": "Recherche",
                    "type": "boolean"
                  },
                  "surtitre": {
                    "default": null,
                    "maxLength": 160,
                    "minLength": 0,
                    "title": "Surtitre",
                    "type": "string"
                  },
                  "taille_couv": {
                    "default": null,
                    "enum": ["petite", "moyenne", "grande"],
                    "title": "Taille Couv",
                    "type": "string"
                  },
                  "texte": {
                    "default": null,
                    "pattern": "^(?:|#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})$",
                    "title": "Texte",
                    "type": "string"
                  },
                  "titre": {
                    "default": null,
                    "maxLength": 240,
                    "minLength": 0,
                    "title": "Titre",
                    "type": "string"
