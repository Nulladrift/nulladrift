        {
          "name": "update_quote",
          "title": "Update quote details",
          "description": "Adds or changes details on a quote. Objects merge; lists replace whole.\n\n    data uses these keys (field_guide lists every accepted field and value):\n    - applicants: list of every person in the household. Exactly one has relationToInsured INSURED.\n      Each needs firstName, lastName, dateOfBirth, sex, maritalStatus; drivers also need isDriver true\n      and driverDetails.licenseState. Lists replace whole, so always resend everyone.\n    - auto: residenceType, priorInsurance, vehicles (list; each needs a vin, or year+make+model+subModel\n      from lookup_vehicle, plus ownershipStatus, primaryUse, annualMileage).\n    - home: coverage.dwellingCoverage (estimated rebuild cost in dollars), property (yearBuilt,\n      squareFootage, constructionType, roofMaterial, roofUpdateYear, ...), utilities, underwriting, claims.\n    - Top level: dateOfBirth, lengthAtCurrentAddress, email, phone, primaryAddress.\n    Coverage limits are set by the agency and cannot be sent here.\n    Returns a short summary of what is on file and the remaining missing items.",
          "inputSchema": {
            "properties": {
              "data": {
                "additionalProperties": true,
                "title": "Data",
                "type": "object"
