        {
          "name": "request_service_change",
          "title": "Request a service change",
          "description": "Current clients only. Sends a service request to a licensed Hutsenpiller agent (add or change a\n    vehicle or driver, mortgagee or lienholder, home coverage, a coverage or billing question, a\n    document, a cancellation or an account review). It creates a ticket; it never changes the\n    policy. The agent follows up by the next business day. message: 10 to 2000 characters.",
