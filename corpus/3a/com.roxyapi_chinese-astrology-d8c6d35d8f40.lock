        {
          "name": "post_chinese_astrology_bazi_luck_pillars",
          "title": "Calculate luck pillars - BaZi Da Yun ten-year cycle API",
          "description": "Calculate the da yun luck pillars, the ten-year periods a BaZi chart walks through after birth. Returns the direction the sequence runs, the age it begins at with the day count behind that age, each ten-year pillar with the Ten God relation its stem holds to the natal Day Master, and an optional year-by-year annual overlay. Direction follows the classical rule: a male born in a yang-stem year and a female born in a yin-stem year run forward through the sexagenary cycle, the other two combinations run backward. Built for astrology apps, life-timing features, and agents that need a reproducible forecast spine.",
          "inputSchema": {
            "examples": [
              {
                "date": "1990-06-15",
                "gender": "male",
                "time": "14:30:00",
                "timezone": "America/New_York"
              }
            ],
            "properties": {
              "annualFromYear": {
                "description": "First Gregorian year of the annual pillar overlay. Omit it to leave annualPillars out of the response entirely. The annual pillar is the year the chart is currently walking through, read against the ten-year luck pillar underneath it.",
                "example": 2026,
                "maximum": 2649,
                "minimum": 1551,
                "type": "integer"
              },
              "annualYears": {
                "default": 10,
                "description": "How many consecutive years the annual overlay covers, 1 to 20. Ignored unless annualFromYear is present.",
                "example": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "count": {
                "default": 8,
                "description": "How many ten-year luck pillars to return, 1 to 12. Eight covers eighty years from the start age, which reaches past a normal lifetime for most start ages.",
                "example": 8,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "date": {
                "description": "Birth date in YYYY-MM-DD format. Sets the year, month and day pillars. The year pillar turns at Beginning of Spring rather than on 1 January, and the month pillar turns at each of the twelve minor solar terms rather than at a calendar month boundary.",
                "example": "1990-06-15",
                "format": "date",
                "type": "string"
              },
              "dayBoundary": {
                "default": "split-zi",
                "description": "Which instant starts the sexagenary DAY, which only matters for a birth between 23:00 and 23:59. \"midnight\" is the classical position of the Ming compendium San Ming Tong Hui: the day turns at 00:00 and 23:00 to 23:59 is the late zi hour of the day that is ending, so the hour stem is taken from that day. \"early-zi\" turns the whole day at 23:00, the practice in Hong Kong, Taiwan and much of South East Asia. \"split-zi\" is the compromise most software implements and the default here: the day still turns at 00:00, but the hour stem is taken from the next day. The three give three different answers for a late-evening birth and identical answers for every other birth.",
                "enum": ["split-zi", "midnight", "early-zi"],
                "example": "split-zi",
                "type": "string"
              },
              "gender": {
                "description": "Subject sex, used only to pick the luck-pillar direction: a male born in a yang-stem year and a female born in a yin-stem year run forward through the sexagenary cycle, and the other two combinations run backward. It affects nothing else in the response.",
                "enum": ["male", "female"],
                "example": "male",
                "type": "string"
              },
              "hourClock": {
                "default": "clock",
                "description": "Which clock the day boundary and the hour branch are read from, so a correction that carries a birth across midnight moves the day pillar with the hour. \"clock\" is civil time exactly as a birth certificate records it, which is what most calculators use and the default here. \"local-mean\" shifts to the mean sun over the birth longitude, a correction of up to 59 minutes at the edge of a wide time zone. \"solar\" adds the equation of time on top of that, up to a further 16 minutes. Both non-civil options need \"longitude\" in the request and return 400 without it.",
                "enum": ["clock", "local-mean", "solar"],
                "example": "clock",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
