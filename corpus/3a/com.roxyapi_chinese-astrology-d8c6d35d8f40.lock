        {
          "name": "get_chinese_astrology_calendar_solar_terms_year",
          "title": "List the 24 solar terms - Jie Qi calendar API with exact instants",
          "description": "Return all 24 solar terms of a year as astronomical instants rather than dates, each computed from the moment the sun reaches its exact apparent longitude at 15 degree steps. The year is the SOLAR year, which opens at Li Chun in early February, so Minor Cold and Major Cold, the last two terms, are dated in the January of the following Gregorian year. Every instant is returned twice, once in UTC and once at the UTC+8 reference meridian the Chinese calendar is defined on. Built for calendar apps, festival scheduling, and any BaZi feature that has to place a birth on the correct side of a term boundary.",
          "inputSchema": {
            "examples": [
              {
                "year": 2026
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "year": {
                "description": "Solar year, 1900 to 2100. The year opens at Li Chun rather than on 1 January, so its last two terms fall in the following January.",
                "example": 2026,
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "referenceOffset": {
                "type": "number"
              },
              "terms": {
                "items": {
                  "properties": {
                    "chinese": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "instantUtc": {
                      "type": "string"
                    },
