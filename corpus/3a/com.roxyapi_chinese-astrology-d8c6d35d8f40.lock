                    }
                  },
                  "required": ["chinese", "id", "instantUtc", "localDate", "localTime", "longitude", "name", "pinyin", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              },
              "year": {
                "type": "number"
              }
