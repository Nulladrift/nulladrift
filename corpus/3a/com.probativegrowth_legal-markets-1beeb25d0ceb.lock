                "type": "string"
              },
              "places": {
                "description": "States (TX, Florida) or counties (48201, \"Cook County, IL\")",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "practice": {
                "description": "Practice id (personal-injury, truck-accidents, employment-law…",
