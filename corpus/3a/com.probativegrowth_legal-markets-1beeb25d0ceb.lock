        "title": "Probative legal-market research",
        "version": "1.5.1",
        "description": "Read-only, with sources: Legal-market research for one place and practice area: demand (court filings, crashes, complaints, enforcement), lawyer supply, Spanish-language demand and ad rules, joined from every open dataset by county, state and practice, each figure with its source, version and DOI.",
