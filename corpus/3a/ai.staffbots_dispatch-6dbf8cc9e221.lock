        {
          "name": "book_demo_request",
          "title": "Request a StaffBots demo or walkthrough",
          "description": "Collect a demo or walkthrough request (name, email, company, message, plan interest) and email it to hello@staffbots.ai. When email is not configured, the request is stored for the team instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "Company or trade name, if any.",
                "type": "string"
              },
              "email": {
                "description": "The requester's email address.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "What they want to see or ask.",
                "type": "string"
              },
              "name": {
                "description": "The requester's name.",
                "minLength": 1,
                "type": "string"
              },
              "plan_interest": {
                "description": "Plan they are interested in, if known: starter, dispatch, biab, reseller, or supervisor.",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
