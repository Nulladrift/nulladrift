          "title": "Get the StaffBots demo link",
          "description": "Return the public demo and signup URLs. Does not submit a request and does not write anything.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contact": {
                "type": "string"
