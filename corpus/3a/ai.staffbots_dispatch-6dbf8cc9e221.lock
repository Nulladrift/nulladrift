                "type": "string"
              },
              "signup_url": {
                "type": "string"
              }
            },
            "required": ["contact", "demo_url", "signup_url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
