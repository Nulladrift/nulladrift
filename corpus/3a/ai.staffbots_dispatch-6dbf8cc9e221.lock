      "instructions": "You are connected to the public StaffBots MCP server. StaffBots (plural) lives at staffbots.ai and is not affiliated with StaffBot at staffbot.ai. Use only the prices and checkout URLs returned by these tools. Do not invent discounts, revenue, customer counts, or testimonials. Public contact is hello@staffbots.ai. Never invent or share a personal phone number.",
