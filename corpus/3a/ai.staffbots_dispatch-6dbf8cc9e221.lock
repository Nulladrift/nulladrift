        {
          "name": "recommend_plan",
          "title": "Recommend a StaffBots plan",
          "description": "Recommend a StaffBots plan from business type, optional team size, and needs (dispatch, support, scheduling, lead follow-up, admin, reseller). Returns a rationale, checkout URL, and optional Human Supervisor add-on. Does not invent discounts.",
