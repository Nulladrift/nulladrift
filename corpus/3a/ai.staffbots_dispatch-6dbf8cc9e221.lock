              "business_type": {
                "description": "What kind of business this is, e.g. delivery, logistics, home services, agency, reseller, or a short description.",
                "minLength": 1,
                "type": "string"
              },
              "needs": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Needed roles or jobs: dispatch, support, scheduling, lead follow-up, admin, and/or reseller."
