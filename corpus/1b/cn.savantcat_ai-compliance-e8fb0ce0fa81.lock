      "serverInfo": {
        "name": "savantcat-ai-compliance",
        "title": "合尘猫 · 中国 AI 合规与备案知识库",
        "version": "1.1.1",
        "description": "《生成式人工智能服务管理暂行办法》等法规的逐条要求与备案路径，含 filing_route 应办事项清单。",
        "websiteUrl": "https://savantcat.cn/mcp-compliance"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "合尘猫 · 中国 AI 合规与备案知识库。收录《生成式人工智能服务管理暂行办法》《人工智能生成合成内容标识办法》《互联网信息服务深度合成管理规定》《互联网信息服务算法推荐管理规定》的逐条要求，回答「要不要备案」「要不要标注 AI 生成」「AI 客服上线前要做什么」「用第三方大模型 API 义务在谁身上」这类问题。所有结论均标注法规条文依据，并用 filing_route 给出应办事项清单。",
      "tools": [
        {
          "name": "filing_route",
          "description": "判断一项 AI 服务要办哪些手续（备案/安全评估/标识），逐条给出法规依据。\n\n    Args:\n        public_facing: 是否面向中国境内公众提供服务（仅内部使用请传 false）\n        generates_content: 是否能生成文本/图片/音频/视频等内容\n        edits_face_or_voice: 是否提供人脸、人声等生物识别信息编辑功能（换脸、AI 配音、数字人）\n        only_internal_use: 是否仅企业内部使用、不对外提供\n    ",
          "inputSchema": {
            "properties": {
              "edits_face_or_voice": {
                "default": false,
                "title": "Edits Face Or Voice",
                "type": "boolean"
              },
              "generates_content": {
                "default": true,
                "title": "Generates Content",
                "type": "boolean"
              },
              "only_internal_use": {
                "default": false,
                "title": "Only Internal Use",
                "type": "boolean"
              },
              "public_facing": {
                "default": true,
                "title": "Public Facing",
                "type": "boolean"
              }
            },
            "title": "filing_routeArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "filing_routeOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f649f862624cc81cc58996eb2d5a1d6de878e9415cfdc98e396f52c0a70cdf1f"
        },
        {
          "name": "get_article",
          "description": "按条号取某部法规的条文**逐字原文**，并附内容指纹与官方原文链接。\n\n    与 get_requirement 的分工：get_requirement 按「问题」取整条合规要求（含结论与落地动作）；\n    get_article 按「条号」取条文原文，用于逐字核对、引用与溯源。\n\n    Args:\n        law: 法规名或集群标识。可写全称（《生成式人工智能服务管理暂行办法》）、\n             简称（标识办法 / 算法推荐规定）或 cluster\n             （genai-interim / ai-content-label / deep-synthesis / algo-recommendation）\n        article: 条号，支持「第十条」「10」「第10条」三种写法\n    ",
          "inputSchema": {
            "properties": {
              "article": {
                "title": "Article",
                "type": "string"
              },
              "law": {
                "title": "Law",
                "type": "string"
              }
            },
            "required": ["article", "law"],
            "title": "get_articleArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_articleOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f260454c3d57c7940ee5cffaefd67d91647e5e2482729303c3d60fee4f24a3d"
        },
        {
          "name": "get_requirement",
          "description": "按 slug 取一条合规要求的完整内容（正文 + 依据条文 + 落地动作 + 常见追问）。\n\n    Args:\n        slug: 条目标识，先用 list_topics 或 search_compliance 取得\n    ",
          "inputSchema": {
            "properties": {
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_requirementArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_requirementOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a555f67338a0a649b9391bb8af2aef89ca2df8be0d8375e80ba5c5ec32467e0d"
        },
        {
          "name": "list_topics",
          "description": "列出全部合规条目的标题清单。\n\n    Args:\n        cluster: 可选，按集群过滤。可选值 genai-interim(生成式AI暂行办法) /\n                 ai-content-label(AI生成合成内容标识) / deep-synthesis(深度合成) /\n                 algo-recommendation(算法推荐与备案) / filing-practice(备案实操)\n    ",
          "inputSchema": {
            "properties": {
              "cluster": {
                "default": "",
                "title": "Cluster",
                "type": "string"
              }
            },
            "title": "list_topicsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
