        },
        {
          "name": "search_articles",
          "description": "在**某一部法规内部**按关键词检索条文，返回命中条号 + 条文摘录。\n\n    用途：已经知道是哪部法规，要定位「哪一条讲了这件事」。\n\n    Args:\n        law: 法规名或集群标识（同 get_article 的 law 参数）\n        keywords: 检索词，如「训练数据 合法来源」「标识 元数据」「备案 十日」\n        top_k: 返回条数，默认 5\n    ",
          "inputSchema": {
            "properties": {
              "keywords": {
                "title": "Keywords",
                "type": "string"
              },
              "law": {
                "title": "Law",
                "type": "string"
              },
              "top_k": {
                "default": 5,
                "title": "Top K",
                "type": "integer"
              }
            },
            "required": ["keywords", "law"],
            "title": "search_articlesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_articlesOutput",
            "type": "object"
          },
          "annotations": {
