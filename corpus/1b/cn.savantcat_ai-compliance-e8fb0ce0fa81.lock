        {
          "name": "self_check",
          "description": "按场景出合规自查清单：把命中条目的「落地动作」汇总成可勾选待办，并列出条文依据。\n\n    Args:\n        scope: 场景或关键词，如「AI 客服」「营销文案 标注」「小程序 上架」「全量」；\n               留空则返回全量自查清单\n    ",
          "inputSchema": {
