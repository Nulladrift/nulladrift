              "query": {
                "description": "What to price, in words: 'claude opus', 'h100', 'llama 3.3 70b', 'ovhcloud vps-1'",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "best_priceArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best price right now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b667aba48b92e51a31ac5bad16ca5b04389823910269ff3cd5877d4feb3689ca"
