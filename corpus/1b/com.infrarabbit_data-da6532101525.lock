        {
          "name": "cheapest_for_spec",
          "title": "Cheapest for a spec",
          "description": "Cheapest active SKUs meeting a minimum spec, ranked by list price only (no sponsorship, no affiliate weighting), excl. VAT (VAT-inclusive plans are ranked after removing their stated VAT rate). Starts with a short `answer` sentence (human names, price excl. VAT in the row's own currency, term, read date, source), then compact rows; each row carries price_excl_vat, source_class and, for GPUs, gpu_count and price_per_gpu_hour. Only first-party prices rank (the provider's own page or API); resellers, community catalogues (models.dev, LiteLLM, OpenRouter) and marketplaces take part only with include_community=true. gpu and vps default to commitment=on-demand: spot, reserved, committed, dynamic and community-cloud prices are left out unless commitment says otherwise. category vps|gpu|llm; vcpu, ram_gb, disk_gb minimums; gpu model substring (e.g. H100; with a memory size such as A100-80GB the card must state exactly that memory); region 'eu' for EU-deployable; currency USD|EUR for the ranking (rank.value is in that currency, rank.native_value in the row's own). verbose=true adds the full ranking method, every row field and the coverage gaps.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "vps",
                "description": "vps, gpu or llm",
                "title": "Category",
                "type": "string"
              },
              "commitment": {
                "default": "on-demand",
                "description": "gpu and vps only. Default on-demand: standing list prices with no term and no interruption. spot, reserved, commit, dynamic or community select those rows; any shows every commitment (each row carries extra.commitment).",
                "enum": ["on-demand", "spot", "reserved", "commit", "dynamic", "community", "any"],
                "title": "Commitment",
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "USD or EUR (ranking currency)",
                "title": "Currency",
                "type": "string"
              },
              "disk_gb": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum disk in GB",
                "title": "Disk Gb"
              },
              "gpu": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "GPU model substring, e.g. H100",
                "title": "Gpu"
              },
              "gpu_count": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum GPUs per instance",
                "title": "Gpu Count"
              },
              "include_community": {
                "default": false,
                "description": "Also rank resellers (Amazon Bedrock, Azure ...), community catalogues (models.dev, LiteLLM, OpenRouter) and marketplaces; each row says source_class. Off by default: only the provider's own list prices rank.",
                "title": "Include Community",
                "type": "boolean"
              },
              "include_region_unstated": {
                "default": false,
                "description": "vps with a region filter only. A plan whose source states no region is never guessed into the place: it is left out of the rows, counted in region_unstated (count, and the cheapest of them). 1 = rank those plans with the others (the compare page's region_unknown=1).",
                "title": "Include Region Unstated",
                "type": "boolean"
              },
              "include_stale": {
                "default": false,
                "description": "Also rank plans whose price is not verified (stale): after every current one, each flagged stale. Off by default.",
                "title": "Include Stale",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Maximum rows, 1 to 50",
                "title": "Limit",
                "type": "integer"
              },
              "listing": {
                "default": "current",
                "description": "Listing filter, default current: only plans on the provider's public price page or product API count. all includes catalog-only and vanished plans (each row carries listing_status).",
                "enum": ["current", "all", "listed", "catalog_only", "vanished", "unknown"],
                "title": "Listing",
                "type": "string"
              },
              "provider": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Provider slug to restrict to",
                "title": "Provider"
              },
              "ram_gb": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum RAM in GB",
                "title": "Ram Gb"
              },
              "region": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "'eu' for EU-deployable, 'us', 'asia', a country code such as nl or de (the places of the compare page), or a provider region code",
                "title": "Region"
              },
              "vcpu": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum vCPUs",
                "title": "Vcpu"
              },
              "verbose": {
                "default": false,
                "description": "true = the full ranking method, every field of every row and the coverage gaps",
                "title": "Verbose",
                "type": "boolean"
              }
            },
            "title": "cheapest_for_specArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest for a spec"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dafc0117b28f99ab8bd1ac79b064528b62c734d323a88a6a4ae8294b1ec69445"
        },
