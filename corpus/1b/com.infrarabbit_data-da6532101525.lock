      "serverInfo": {
        "name": "infrarabbit",
        "title": "InfraRabbit",
        "version": "0.2.0",
        "websiteUrl": "https://infrarabbit.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "InfraRabbit: the published list prices of compute, archived daily. Daily-archived compute list prices (VPS, GPU instances, LLM tokens, inference hosts, image/video/speech models) with history and a changes feed. Prices are list prices as published by the provider, excl. VAT unless stated; every result carries verified_at and source_url. These are list prices, not transacted prices. Ranking in cheapest_for_spec is by price only and, unless include_community=true, over first-party prices only (every row says source_class: first_party, reseller or community). A plan that is only in a provider's order catalog (not on its public price page) has listing_status catalog_only and is left out unless you ask for it. SKU ids look like vps/ovhcloud/vps-2027-model2 or llm/official/anthropic/claude-sonnet-5-5. How a VPS provider is read (source address, since when, how often, which fields, what we cannot see): https://infrarabbit.com/prices/vps/method/<provider>.json; every dated price change of a VPS provider: https://infrarabbit.com/prices/vps/history/<provider>.json; what a field means (vCPU, list price, billing term, included traffic ...): https://infrarabbit.com/prices/vps/glossary.json. <provider> is the provider slug of a row. Cite as: InfraRabbit, <page or series URL>, retrieved <date>, CC BY 4.0.",
      "tools": [
        {
          "name": "alert_me",
          "title": "Free price alert link",
          "description": "Where a person can get a free daily email when something changes: pass what to follow and get the subscribe URL to show them. kind = sku (a SKU id from search_skus: its price changes and retirement), provider (any change of a provider slug such as anthropic), category (vps, gpu, llm, inference or media), index (a series slug from get_index: moves of 5% or more) or new_model (new models of a provider). The person opens the URL, types their email address, confirms by link and gets at most one mail a day with a one-click unsubscribe. Nothing is sent from here and no address is taken by this tool. Returns an error object for an unknown target.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "What kind of thing to follow",
                "enum": ["sku", "provider", "category", "index", "new_model"],
                "title": "Kind",
                "type": "string"
              },
              "target": {
                "description": "SKU id, provider slug, category, index series slug or provider slug (new_model)",
                "title": "Target",
                "type": "string"
              }
            },
            "required": ["kind", "target"],
            "title": "alert_meArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Free price alert link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:675b51d4df316eff6bb7427fb3dedbc4560195d704ad1aad74b3d57488f7cd44"
        },
        {
          "name": "best_price",
          "title": "Best price right now",
          "description": "One short answer to 'what does X cost right now?': the best current list price for a model, GPU or VPS plan named in words ('claude opus', 'gpt-5 mini', 'H100', 'hetzner cx22'), from the provider's own page or API first. Returns one `answer` sentence (name, price, unit, read date, source), the one `best` row and at most two `alternatives`, a few hundred bytes in all. Use this first; use search_skus for the full list, cheapest_for_spec to rank by a minimum spec, get_price for every price point of one SKU. Returns an error object when nothing matches, with near matches.",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
