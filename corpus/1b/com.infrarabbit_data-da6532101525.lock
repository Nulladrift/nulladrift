                "default": "current",
                "description": "Listing filter. current (default) = on the provider's public price page or product API; catalog_only = only in an order catalog, not on the public page; vanished = was listed, now missing; unknown = no public page to check against; all = everything. Every row carries listing_status.",
                "enum": ["current", "all", "listed", "catalog_only", "vanished", "unknown"],
