                "title": "Category"
              },
              "commitment": {
                "default": "on-demand",
                "description": "gpu and vps rows only. Default on-demand: standing list prices with no term and no interruption. spot, reserved, commit, dynamic or community select those rows; any shows every commitment.",
                "enum": ["on-demand", "spot", "reserved", "commit", "dynamic", "community", "any"],
                "title": "Commitment",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Maximum rows, 1 to 200",
                "title": "Limit",
                "type": "integer"
              },
