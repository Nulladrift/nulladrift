{
  "lockfileVersion": 2,
  "subjects": {
    "com.costbench/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://costbench.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "costbench",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Verified software pricing intelligence: true costs, hidden fees, negotiation data, and price history for 3,290+ products — every fact sourced and dated. Each entity carries a links object: links.page is the CostBench sourced page (cite it); links.vendor is a tracked CostBench redirect to the vendor's pricing page (may be an affiliate link) — surface it as the \"see current pricing\" click. Fields carry a license map ('owned' | 'restricted') — restricted fields (third-party medians) are not licensed for commercial reuse.",
      "tools": [
        {
          "name": "calculate_tco",
          "description": "Total cost of ownership for a product and team size: sourced line items (licenses with price escalation, benchmark implementation), year-one + multi-year totals, effective per-seat cost. The defensible \"true cost for an N-person team\" answer.",
          "inputSchema": {
            "properties": {
              "seats": {
                "description": "Number of users/seats",
                "type": "number"
              },
              "slug": {
                "description": "Product slug (e.g. \"salesforce\") or product name (e.g. \"HubSpot CRM\"). Near-misses return did-you-mean suggestions.",
                "type": "string"
              },
              "termYears": {
                "type": "number"
              },
              "tier": {
                "description": "Tier name as listed by get_pricing (default: cheapest paid tier). An unknown tier returns the available tiers.",
                "type": "string"
              }
            },
            "required": ["seats", "slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c4fa8a65e156459601b1bdb5806fd5642bf2383a4d2d915b902e329d7e7a7ca"
        },
        {
          "name": "compare_software",
          "description": "Side-by-side pricing comparison of 2–4 products (starting price, enterprise tier, median annual cost, free tier, ratings).",
          "inputSchema": {
            "properties": {
              "slugs": {
                "description": "Product slugs or names, e.g. [\"asana\", \"Monday.com\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c612cfee4e5d41a206b3bc13735198dbe014eec90d77dc6257c6ec54a1db4f2"
        },
        {
          "name": "discover_software",
          "description": "Find software products by name search or criteria (category, max price, free tier). Returns matching slugs to look up — use \"query\" to find the slug for a product name.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug or name, e.g. \"crm\" or \"project management\"",
                "type": "string"
              },
              "hasFreeTier": {
                "type": "boolean"
              },
              "limit": {
                "type": "number"
              },
              "maxPrice": {
                "type": "number"
              },
              "query": {
                "description": "Product or vendor name to search, e.g. \"hubspot\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad4d833469f7b8f99993583f4b0f2907c835dfa0d77178defebc06025e91773b"
        },
        {
          "name": "estimate_llm_cost",
          "description": "Estimate the cost of an LLM/API workload (input + output tokens) for a usage-priced provider (OpenAI, Anthropic, AWS Bedrock…) from its real rate card.",
          "inputSchema": {
            "properties": {
              "inputTokens": {
                "description": "Input tokens for the workload (e.g. per month). At least one of inputTokens/outputTokens must be > 0.",
                "type": "number"
              },
              "model": {
                "description": "Model id as listed on the rate card, e.g. \"claude-sonnet-5-5\"; an unknown model returns the available list",
                "type": "string"
              },
              "outputTokens": {
                "description": "Output tokens for the workload. At least one of inputTokens/outputTokens must be > 0.",
                "type": "number"
              },
              "slug": {
                "description": "Usage-priced API product, e.g. \"openai-api\", \"claude-api\", \"google-gemini-api\", \"amazon-bedrock\" (vendor names like \"anthropic\" also resolve)",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e403ef9dbb3e46c4e2519e9b2b697bacf036b47465b943d702d7b2ee23e1df36"
        },
        {
          "name": "get_hidden_costs",
          "description": "The documented hidden/implementation/add-on costs of a product (uplifts, onboarding fees, overages), each with a sourced quote + date. The \"what they don't tell you\" answer.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug (e.g. \"salesforce\") or product name (e.g. \"HubSpot CRM\"). Near-misses return did-you-mean suggestions.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74d16de7b1b2dcd7122eb34d69e69bb49cecb52d947ab2d186989bfc41521707"
        },
        {
          "name": "get_negotiation_tips",
          "description": "Sourced negotiation tactics for a product with success-likelihood (how to get a discount).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug (e.g. \"salesforce\") or product name (e.g. \"HubSpot CRM\"). Near-misses return did-you-mean suggestions.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:582255cb9fb76b977d06081d32cd39822fd7e72fd71e92dbf2a54228f22286f5"
        },
        {
          "name": "get_price_changes",
          "description": "Recent software pricing changes CostBench detected against vendor pricing pages (increases, decreases, plan restructures) — dated, with before/after price bands and a source link. Filter by product slug, category, or lookback window. The \"what changed lately\" answer; each item links to the sourced record.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Only changes in this category slug, e.g. \"crm\"",
                "type": "string"
              },
              "days": {
                "description": "Lookback window in days (default 30, max 365)",
                "type": "number"
              },
              "include_suspect": {
                "description": "Include moves flagged as likely extraction artifacts (unit switches, |change| > 300%). Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max items (default 25, max 100)",
                "type": "number"
              },
              "slug": {
                "description": "Only changes for this product",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9120f8f296d8a1e2071dce462875aa5c1da84f16e473e69949374140a6a214f2"
        },
        {
          "name": "get_price_history",
          "description": "Dated per-quarter snapshots of a product's pricing page. Returns observations, NOT a trend figure — CostBench does not publish one, because diffing snapshots across renamed/restructured plan lineups is ~90% measurement artifact.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug (e.g. \"salesforce\") or product name (e.g. \"HubSpot CRM\"). Near-misses return did-you-mean suggestions.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:764e44e8385e0038f72ccfee16bffb6f6dd6a5dbf91360f67f92cb577efa5f91"
        },
        {
          "name": "get_pricing",
          "description": "Full sourced pricing record for a software product: tiers, hidden costs, contract terms, market data, sentiment, negotiation tips, TCO scenarios, price history — every claim with its sources + a confidence/verification envelope.",
          "inputSchema": {
            "properties": {
              "depth": {
                "description": "summary = numbers+sources only",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "slug": {
                "description": "Product slug (e.g. \"salesforce\") or product name (e.g. \"HubSpot CRM\"). Near-misses return did-you-mean suggestions.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c0ec0831f8600c9f299e0e5d7d3951a537dd1e66169f683417db1af68813fab"
        }
      ],
      "digest": "sha256:3e9d428306d620fa72f682a2293b68b67130557bcb2fcf816cea752cdf576f6f"
    }
  }
}
