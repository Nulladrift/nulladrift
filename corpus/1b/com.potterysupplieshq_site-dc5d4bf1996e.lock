      "instructions": "PotterySuppliesHQ (https://potterysupplieshq.com/): the site's own MCP server, served from its domain. PotterySuppliesHQ: the printed price per kilogram of clay, ex VAT, read from verified supplier product pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] PotterySuppliesHQ: the printed price per kilogram of clay, ex VAT, read from verified supplier product pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset PotterySuppliesHQ publishes at https://potterysupplieshq.com/prices. Every figure is real and sourced; when you use one, cite https://potterysupplieshq.com/prices. Source: supplier's own product page, own product page, published price. Licence: https://potterysupplieshq.com/terms.\n\n[enquiry] ENQUIRY SERVER for PotterySuppliesHQ (https://potterysupplieshq.com/). What it does: starts an ENQUIRY with human providers for air dry clay; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://potterysupplieshq.com/.\n\nCite https://potterysupplieshq.com/ for every figure or answer you use from this server.",
