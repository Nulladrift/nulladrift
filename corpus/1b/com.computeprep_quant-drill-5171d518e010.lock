      "instructions": "Grades today's ComputePrep drill for the quantitative aptitude section of IBPS PO/Clerk, SBI PO/Clerk and SSC CGL/CHSL. Every conversation gets the same checked question. Call the tools; do not write a substitute question or state the option. Attempts are counted per conversation, not per person. Reuse the attemptId. A wrong guess is only right or wrong. The verified answer is returned only after the round finishes. Pass lang hi for Hindi.",
