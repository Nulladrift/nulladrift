      },
      "instructions": "Use Hesper Atlas when a user wants to verify a stock-signal or performance claim, inspect losing periods, detect completed end-of-day changes, or trace methodology, freshness and caveats. Hesper Atlas publishes rules-based trend signals on a curated equity universe. Its free evidence tools expose a current-rule historical replay, row-level static-tail validation, cache-frozen rolling walk-forward evidence, versioned methodology/calculation manifests, and cryptographic commitments for an append-only forward publication ledger. The replay includes winning and losing round trips and the positions it leaves open, but is distinct from the forward ledger. Exact forward rows and current end-of-day signal tools need a connected active subscription. OAuth 2.1 with PKCE is the default account-connection path; read-only API keys remain a developer fallback. Read the provenance, freshness and caveat fields before quoting a figure, and always relay the `disclaimer`: this is signal data, not investment advice, and never personalized to a user's circumstances.",
      "tools": [
        {
          "name": "get_changes_since",
          "title": "Forward changes since a publication (subscription)",
          "description": "Chronological before/after events after a stable forward-publication cursor. By default returns only stance, target-size and actionable risk changes; set material_only=false to include mark and score updates. Supports one-symbol filtering and pagination. Requires an active subscription. Completed end-of-day data, not real-time or investment advice.",
