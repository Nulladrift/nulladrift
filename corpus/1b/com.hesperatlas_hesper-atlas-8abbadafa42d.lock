        {
          "name": "list_forward_publications",
          "title": "Forward publication commitments",
          "description": "Use when a user asks what Hesper Atlas actually published, when it was committed, what changed, or whether forward history is mature enough to evaluate. Returns public append-only manifests for end-of-day signal publications: stable publication id, publication time, market-data as-of date, scan schema, record counts, previous-publication link and a SHA-256 commitment over the exact frozen agent-facing signal rows. A compact summary separates snapshot revisions from distinct market dates and explicitly refuses to calculate performance from commitments. The manifests prove what was committed without exposing the paid current signal book. The ledger begins at deployment; there is no fabricated historical backfill. Signal data, not investment advice.",
