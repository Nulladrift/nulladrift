        {
          "name": "get_walk_forward_evidence",
          "title": "Rolling walk-forward evidence",
          "description": "Use when a user asks for stricter time-ordered evidence, weak years, benchmark underperformance, or a check against look-ahead. Returns the committed cache-frozen annual walk-forward artifact. Each year's candidate is selected using only earlier observations and then traded for the next calendar year with next-open execution and costs. Returns the content-derived evidence id, input hash manifest, aggregate results, and paged per-symbol/year rows. Weak periods and underperformance versus buy-and-hold are retained. Set artifact to 'pooled_selection' for the class-pooled selection audit (per-name and pooled rule selection both converge to the untuned class engine) or 'model_portfolio' for the monthly walk-forward of the shipped model-portfolio construction (12-1 momentum top 10/20 among engine-long quality stocks, every risk profile, benchmarks, monthly picks, broad-universe check). Historical validation, not live performance or advice.",
