{
  "lockfileVersion": 2,
  "subjects": {
    "com.lookupd/lookupd": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.lookupd.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lookupd",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "lookupd finds MCP servers, skills and agents for a task. Results are provisional (no outcome evidence yet). Lookups are free. Make up one random session id per conversation and pass it, with the conversation's domain, on every call; after a task uses any MCP server, report_outcome (when listed) records whether it worked. Data: Official MCP Registry (CC0) mirrored by lookupd.",
      "tools": [
        {
          "name": "find_capability",
          "title": "Find a capability",
          "description": "Find MCP servers that provide a capability for a task. Pass a short capability phrase (e.g. \"read Linear issues\"), not the user's full request. Results are ranked provisionally (no outcome evidence yet) and each includes an install snippet for the given runtime. lookupd.verification is \"verified\" (with lookupd.publisher, the proven domain or GitHub owner) when the publisher claimed the listing. `featured` is reserved for labeled placement and empty: placement is not offered, and `results` are never reordered or filtered by payment. Lookups are free. The response carries `lookup_id`: quote it on report_outcome, with the same `session` id and `domain`, so the outcome ties to this exact search.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "capability": {
                "description": "Optional capability tag from lookupd's taxonomy to prefer",
                "enum": ["web-search", "web-fetch", "browser-automation", "scraping", "http-api", "pdf-extract", "document-ocr", "docs-office", "spreadsheets", "file-system", "git", "github", "gitlab", "code-execution", "code-search", "ci-cd", "kubernetes", "cloud-aws", "cloud-gcp", "cloud-azure", "database-sql", "database-nosql", "vector-search", "memory", "monitoring", "logs", "security-scan", "auth-identity", "email", "calendar", "chat-slack", "chat-discord", "chat-teams", "issue-tracking", "project-management", "notion", "crm", "payments", "ecommerce", "finance-market", "maps-geo", "weather", "translation", "speech", "image-generation", "video", "music", "other"],
                "type": "string"
              },
              "domain": {
                "description": "What the conversation is about, from the fixed list",
                "enum": ["software-engineering", "devops-cloud", "data-analytics", "finance", "legal-compliance", "sales-crm", "marketing", "customer-support", "hr-recruiting", "operations", "research", "education", "healthcare", "ecommerce", "design-media", "personal", "other"],
                "type": "string"
              },
              "kind": {
                "description": "Only mcp_server in this release",
                "enum": ["mcp_server"],
                "type": "string"
              },
              "max_results": {
                "description": "Default 5",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "runtime": {
                "description": "Caller's runtime; selects the install snippet",
                "enum": ["claude-code", "codex", "claude-desktop", "cursor", "vscode", "generic"],
                "type": "string"
              },
              "session": {
                "description": "A random id you make up once per conversation (8-64 letters, digits, _ or -; never derived from the user, project or machine) and repeat on every lookupd call in it, report_outcome included",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "task": {
                "description": "Short capability phrase, 1-200 characters",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "verified_only": {
                "description": "Only verified (registered) publishers",
                "type": "boolean"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bb09a4c4c6487b49ccd7cc9c0c310663aff3edf0e019964e960b2a4ac61eaa41"
        },
        {
          "name": "get_entry",
          "title": "Get an entry",
          "description": "Full details for one entry: raw server.json, install snippets for the runtime, lookupd metadata. Pass the registry name (e.g. io.github.acme/linear-mcp), or, for a server already in your MCP config, its remote url or its npm/PyPI package; that finds the registry name to use with report_outcome. When several entries launch the same url or package, `matches` lists them all, most likely first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "What the conversation is about, from the fixed list",
                "enum": ["software-engineering", "devops-cloud", "data-analytics", "finance", "legal-compliance", "sales-crm", "marketing", "customer-support", "hr-recruiting", "operations", "research", "education", "healthcare", "ecommerce", "design-media", "personal", "other"],
                "type": "string"
              },
              "name": {
                "description": "Registry name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "package": {
                "description": "npm or PyPI package from the MCP config, e.g. @acme/pdf-mcp",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "runtime": {
                "enum": ["claude-code", "codex", "claude-desktop", "cursor", "vscode", "generic"],
                "type": "string"
              },
              "session": {
                "description": "A random id you make up once per conversation (8-64 letters, digits, _ or -; never derived from the user, project or machine) and repeat on every lookupd call in it, report_outcome included",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "url": {
                "description": "Remote URL from the MCP config",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b746bc2abbfa728d5f4f5f8b4e24129d07703b6f67c7d4450e13f09693820805"
        },
        {
          "name": "health",
          "title": "Health of an entry",
          "description": "Probe status of an entry: whether its remote endpoint is up, needs a login (auth_required), is down or dead, with 7-day uptime, median latency, tool count and the last probe. Stdio-only servers are not_probeable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "What the conversation is about, from the fixed list",
                "enum": ["software-engineering", "devops-cloud", "data-analytics", "finance", "legal-compliance", "sales-crm", "marketing", "customer-support", "hr-recruiting", "operations", "research", "education", "healthcare", "ecommerce", "design-media", "personal", "other"],
                "type": "string"
              },
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "session": {
                "description": "A random id you make up once per conversation (8-64 letters, digits, _ or -; never derived from the user, project or machine) and repeat on every lookupd call in it, report_outcome included",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:794bb3404f12a3ef7d3fd9064598bca7d58c0222a02198fd06de522b3c042380"
        },
        {
          "name": "report_outcome",
          "title": "Report an outcome",
          "description": "After a task used an MCP server, report once per server whether it worked: servers found via lookupd in this conversation and servers already installed alike. `entry` is the registry name; for an installed server, get it from get_entry with the server's url or package (skip the report if there is no entry). `success` is required. Workflow fields, all optional: `session` (a random id you make up once per conversation, 8-64 letters, digits, _ or -, never derived from the user, project or machine; repeat it on every report in the conversation), `step` (the order in which this server was first used in the conversation, from 1), `tool` (the tool you used most on it, by name), `domain` (what the conversation is about, from the fixed list), `found_via` (lookupd or installed), `lookup_id` (the lookup_id from the find_capability response that found this server, so the outcome ties to that exact search). Structured fields only (entry, success, capability_tag, latency_bucket, runtime, error_class, session, step, tool, domain, found_via, lookup_id); never task text, prompts or paths. Rankings improve from these reports.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "capability_tag": {
                "enum": ["web-search", "web-fetch", "browser-automation", "scraping", "http-api", "pdf-extract", "document-ocr", "docs-office", "spreadsheets", "file-system", "git", "github", "gitlab", "code-execution", "code-search", "ci-cd", "kubernetes", "cloud-aws", "cloud-gcp", "cloud-azure", "database-sql", "database-nosql", "vector-search", "memory", "monitoring", "logs", "security-scan", "auth-identity", "email", "calendar", "chat-slack", "chat-discord", "chat-teams", "issue-tracking", "project-management", "notion", "crm", "payments", "ecommerce", "finance-market", "maps-geo", "weather", "translation", "speech", "image-generation", "video", "music", "other"],
                "type": "string"
              },
              "domain": {
                "enum": ["software-engineering", "devops-cloud", "data-analytics", "finance", "legal-compliance", "sales-crm", "marketing", "customer-support", "hr-recruiting", "operations", "research", "education", "healthcare", "ecommerce", "design-media", "personal", "other"],
                "type": "string"
              },
              "entry": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "error_class": {
                "enum": ["auth", "timeout", "schema", "tool_error", "other"],
                "type": "string"
              },
              "found_via": {
                "enum": ["lookupd", "installed"],
                "type": "string"
              },
              "latency_bucket": {
                "enum": ["lt1s", "lt5s", "lt30s", "gte30s"],
                "type": "string"
              },
              "lookup_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "runtime": {
                "enum": ["claude-code", "codex", "claude-desktop", "cursor", "vscode", "generic"],
                "type": "string"
              },
              "session": {
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "step": {
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "success": {
                "type": "boolean"
              },
              "tool": {
                "pattern": "^[A-Za-z0-9_.-]{1,120}$",
                "type": "string"
              }
            },
            "required": ["entry", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b883505cc021b843a12aeab65afdef91022b394d0d8a0017593529e78b8e2c7e"
        }
      ],
      "digest": "sha256:7f1615d3b682fae59e945e135737bcb2be6300fe94d9f53788dcba0347948339"
    }
  }
}
