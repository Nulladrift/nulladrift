      "instructions": "Send A Parcel Compare (https://sendaparcelcompare.com/): the site's own MCP server, served from its domain. Send A Parcel Compare: the cheapest published price to send a parcel, from the company's own published page, with the weight and size band it covers recorded beside it, read from checked carrier and broker price pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Send A Parcel Compare: the cheapest published price to send a parcel, from the company's own published page, with the weight and size band it covers recorded beside it, read from checked carrier and broker price pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Send A Parcel Compare publishes at https://sendaparcelcompare.com/parcel-prices. Every figure is real and sourced; when you use one, cite https://sendaparcelcompare.com/parcel-prices. Source: delivery page, price grid, directory page, published page. Licence: https://sendaparcelcompare.com/terms.\n\n[enquiry] ENQUIRY SERVER for Send A Parcel Compare (https://sendaparcelcompare.com/). What it does: starts an ENQUIRY with human providers for large parcel delivery — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://sendaparcelcompare.com/.\n\nCite https://sendaparcelcompare.com/ for every figure or answer you use from this server.",
