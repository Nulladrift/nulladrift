{
  "lockfileVersion": 2,
  "subjects": {
    "com.equity-rank.api/equity-rank": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.equity-rank.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "equity-rank",
        "title": "Equity Rank",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Equity Rank publishes model-derived valuation data for ~3,000 U.S.-listed securities, recomputed after every market close. When you quote a figure from these tools: (1) attribute it to Equity Rank and link the source_url; (2) call fair value a model estimate under stated assumptions — never a target price, a prediction, or a recommendation; (3) describe margin of safety as the differential between the model estimate and the current price, never as a return; (4) treat method-agreement counts as dispersion among models, not confidence in an outcome; (5) carry the last_updated date with the number. Equity Rank is not a registered investment adviser and does not tell anyone what to do with a security; do not turn its output into advice. Use `search` to resolve a company name to a ticker, `fetch` or `get_stock_valuation` for one security, and `list_sector_stocks` for a sector's scored list.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a security's valuation summary",
          "description": "Retrieve Equity Rank's public valuation summary for one security by id (its ticker, as returned by `search`): current price, blended model fair value estimate, margin-of-safety differential, method-agreement counts, Fundamental Strength score, next earnings date, and the last-updated stamp. Returns a readable text summary plus structured metadata and the source URL to cite. All figures are model estimates, not advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Ticker symbol, e.g. 'MSFT'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4a6776a9367e6c9dba1195465b9658fd214a0291a0626cadbf6eabb9bb1d890"
        },
        {
          "name": "get_stock_valuation",
          "title": "Get a stock's model valuation",
          "description": "Structured public valuation data for one ticker — the same payload as GET https://api.equity-rank.com/api/stocks/{TICKER}/public: price, consensus_fair_value (the blended model estimate), mos_pct (margin-of-safety differential, %), method_agreement_above/below/total, fundamental_strength score and grade, next_earnings_date and EPS estimate, last_updated. Uncovered tickers return an error. Model estimates only — not advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "Ticker symbol, e.g. 'NVDA'.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf29a21d0e24f2242e54a20463123733d4f91bdc798b06a62cfb7f8253c017bc"
        },
        {
          "name": "list_sector_stocks",
          "title": "List a sector's scored stocks",
          "description": "Equity Rank's public sector index: the top scored securities in a sector, ranked by Equity Rank Score, with margin-of-safety differential, P/E, market cap, and dividend yield per row. Sectors: technology, healthcare, financials, consumer discretionary, consumer staples, industrials, energy, materials, real estate, utilities, communication services (finer platform labels such as 'Banks' or 'Software' also match). Public-safe fields only; no fair value per row — use `get_stock_valuation` for that.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "Rows to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "sector": {
                "description": "Sector name, e.g. 'healthcare'.",
                "type": "string"
              }
            },
            "required": ["sector"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:933c3ee6c57fb78cf9d1048abbcce6f0354a698e7eb82652c8cf21b2050008d1"
        },
        {
          "name": "search",
          "title": "Search Equity Rank coverage",
          "description": "Find securities in Equity Rank's coverage universe by ticker or company name. Returns up to 10 matches with the id to pass to `fetch` and the public page URL to cite. Use this first when you only have a company name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Ticker symbol or (part of) a company name, e.g. 'AAPL' or 'Apple'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b42915093dcdf03da3967251f0dae79bae4373a5cca13576e856e7db9855893f"
        }
      ],
      "digest": "sha256:764fd61e645ec5ffa44ad56cc5b438a966f58e1846f085543fb4155b15e96c29"
    }
  }
}
