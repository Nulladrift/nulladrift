        "type": "http",
        "url": "https://markdownlogic.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05", "2026-07-28"]
      },
      "serverInfo": {
        "name": "Markdown Logic anonymous conversion",
        "version": "0.1.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {}
        },
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Anonymous conversion is available only when tools/list advertises convert_markdown. It requires no account, OAuth, token or browser challenge. It accepts supplied source only, never fetches URLs, and returns an embedded file. Machine limits: 128 KiB Markdown, 512 KiB request, 2 MiB output; quota/busy refusals must not be retried in a loop. Temporary busy holds expire after 60 seconds without cancelling rendering; no strict global concurrency guarantee is made. Browser conversion at https://markdownlogic.com/ has its separate existing Turnstile and limits. Versioned workflow guidance is available through skills/list and resources/read: skill://markdown-logic/public/public-conversion-help/SKILL.md, skill://markdown-logic/public/public-markdown-conversion/SKILL.md. Skill/resource reads provide instructions only when your host loads them; they add no tools, authorization or scopes.",
      "tools": [
        {
          "name": "convert_markdown",
          "description": "Convert the complete supplied Markdown into PDF, DOCX, HTML or EPUB anonymously. No URL fetch, project access, account or OAuth grant. Limits: 128 KiB UTF-8 Markdown, 512 KiB request, 2 MiB file. Returns an embedded base64 file, not a hosted download. Existing renderer formatting/image limits apply; DOCX uses image placeholders.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "maxLength": 120,
                "type": "string"
              },
              "format": {
                "enum": ["pdf", "docx", "html", "epub"],
                "type": "string"
              },
              "images": {
                "additionalProperties": {
                  "maxLength": 524288,
                  "type": "string"
                },
                "description": "Optional relative-path keys and embedded PNG/JPEG/GIF data URLs. No remote URLs. Existing decode/pixel budgets may replace an image with its alt text.",
                "maxProperties": 16,
                "type": "object"
              },
              "markdown": {
                "description": "Full source, at most 131072 UTF-8 bytes. Never truncate to meet limits.",
                "maxLength": 131072,
                "minLength": 1,
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "properties": {
                  "font": {
                    "enum": ["inter", "lato", "pt-sans", "merriweather", "source-serif", "crimson"],
                    "type": "string"
                  },
                  "fontSize": {
                    "maximum": 18,
                    "minimum": 8,
                    "type": "number"
                  },
                  "headerTitle": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "margins": {
                    "enum": ["narrow", "normal", "wide"],
                    "type": "string"
                  },
                  "numberedHeadings": {
                    "type": "boolean"
                  },
                  "orientation": {
                    "enum": ["portrait", "landscape"],
                    "type": "string"
                  },
                  "pageNumbers": {
                    "type": "boolean"
                  },
                  "pageSize": {
                    "enum": ["A4", "Letter", "Legal"],
                    "type": "string"
                  },
                  "tableOfContents": {
                    "type": "boolean"
                  },
                  "theme": {
                    "enum": ["light", "academic", "minimal", "ocean", "forest", "sunset"],
                    "type": "string"
                  },
                  "titlePage": {
                    "type": "boolean"
                  },
                  "watermark": {
                    "maxLength": 80,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["format", "markdown"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert Markdown"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d2543f58e0be42d36372a4e85aa2781f5add45e3f3cabce27b5fb1edad2b97bb"
        }
      ],
      "resources": [
        {
          "uri": "skill://markdown-logic/public/public-conversion-help/SKILL.md",
