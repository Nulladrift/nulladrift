{
  "lockfileVersion": 2,
  "subjects": {
    "ai.omnitravel/travelmcp-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://omnitravel.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "travelmcp-directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Directory of MCP servers, agent skills and APIs for the travel industry, published by OmniTravel. Use search_travel_tools to find tools by topic (hotel ID mapping, room type mapping, rates, scraping, browser automation), get_tool_details for the full record including setup documentation, and list_categories to see how the directory is organised.",
      "tools": [
        {
          "name": "get_tool_details",
          "title": "Get a listing in full",
          "description": "Fetch one directory listing by slug, including its full description, install snippet and setup documentation. Use the slug returned by search_travel_tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Listing slug, for example \"room-matching-api\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e55d117c7e6f90c4df11ac292ee4e3d57863988c025fc44458fa4ac0513d9fda"
        },
        {
          "name": "list_categories",
          "title": "List directory categories",
          "description": "List every category in the directory with its slug and how many listings it holds. Travel-specific categories such as hotel ID mapping and room type mapping are marked as pinned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5fc9d15599613d2b00766423c41602bbd6ab76ba6bd44b40209f39f43edd7395"
        },
        {
          "name": "search_travel_tools",
          "title": "Search travel MCP tools",
          "description": "Search the OmniTravel directory of MCP servers, agent skills and APIs for travel technology. Returns matching tools with their tagline, category, author and URL. Typo-tolerant full-text search.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category slug filter, for example \"hotel-id-mapping\" or \"web-scraping\"",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search phrase, for example \"hotel id mapping\" or \"browser automation\"",
                "type": "string"
              },
              "type": {
                "description": "Restrict to one kind of listing",
                "enum": ["mcp_server", "agent_skill", "client", "api"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:47e5f98e63c4a9f67f93d6ce4941ada4e91a62f512865e2671e4e563a9b283c0"
        }
      ],
      "digest": "sha256:8359635da069f72f52fd201270fe773476ab7c322c35d23cbf8a44cdcda79602"
    }
  }
}
