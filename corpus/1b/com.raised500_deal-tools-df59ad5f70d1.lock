{
  "lockfileVersion": 2,
  "subjects": {
    "com.raised500/deal-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://raised500.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "raised500",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "deal_stats",
          "description": "Aggregate funding statistics for a recent period: deal count, total raised, sector breakdown. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 30,
                "description": "Lookback window in days",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7166bb3eaf3fd7d7fedc9f41a0b0dc640397cfb5954012970fb202cac3da3957"
        },
        {
          "name": "raise_lookup",
          "description": "Look up whether a specific company recently raised funding, with the verified record. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Company name or domain",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f202a9ffbf00a9ae58f779c6fea4eb06e772eb0b259d63d84faae2de6423e23"
        },
        {
          "name": "recent_raises",
          "description": "Startups and companies that raised funding recently, verified against public filings and press. Answers questions like 'who raised this week' or 'fintech companies that just raised'. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 7,
                "description": "Lookback window in days",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "min_amount_usd": {
                "default": 0,
                "description": "Minimum raise size in USD",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sector": {
                "default": "all",
                "description": "Sector filter",
                "enum": ["tech", "healthcare", "fintech", "energy", "consumer", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6f91b353cb1373e9f713518860ba14aedfecf186878c1704cb3a822045cdf5e"
        }
      ],
      "digest": "sha256:03d0739672137f2dc999d376ffffa57c965952abafeb69489829cd036a1a5f74"
    }
  }
}
