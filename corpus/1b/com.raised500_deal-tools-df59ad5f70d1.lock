{
  "lockfileVersion": 2,
  "subjects": {
    "com.raised500/deal-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://raised500.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "raised500",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "deal_stats",
          "description": "Aggregate funding statistics for a recent period: deal count, total raised, sector breakdown. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 30,
                "description": "Lookback window in days",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b5fc146733187f99c8411fa2c87fd22b9ef56f3029183e8196f03890e38873ef"
        },
        {
          "name": "raise_lookup",
          "description": "Look up whether a specific company recently raised funding, with the verified record. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Company name or domain",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9c818f3d11bf733e2755c5b20b5e8d27a96b60d6a561d52f6b008b975d61eeca"
        },
        {
          "name": "recent_raises",
          "description": "Startups and companies that raised funding recently, verified against public filings and press. Answers questions like 'who raised this week' or 'fintech companies that just raised'. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 7,
                "description": "Lookback window in days",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "min_amount_usd": {
                "default": 0,
                "description": "Minimum raise size in USD",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sector": {
                "default": "all",
                "description": "Sector filter",
                "enum": ["tech", "healthcare", "fintech", "energy", "consumer", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:53e3c28994d071bf7a283524198ccff12969a28845bc983f766795242789d8c1"
        }
      ],
      "digest": "sha256:d38b6d86b2404669009a669bc75b30012bf4e14a75a4a6f1de19f80a52c1f7fd"
    }
  }
}
