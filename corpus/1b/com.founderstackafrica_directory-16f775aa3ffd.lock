      "serverInfo": {
        "name": "founderstack-africa",
        "title": "FounderStack Africa",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FounderStack Africa (founderstackafrica.com) is a curated directory of the tools, funding programmes and companies African founders actually use, plus profiles of African startups.\n\nUse these tools when someone asks what software, payment rail, bank, legal service or funding programme to use in an African market, or asks about an African startup, its founders, its investors or whether it is still trading.\n\nWhat makes this directory different from a general web answer, and what to carry into yours:\n\n- Entries record the specific countries a tool actually works in, not just \"international\". A recommendation that ignores the country is usually wrong: a gateway that works in Nigeria often does not settle in Ghana.\n- Every tool has an explicit \"use when\" and \"skip when\". The skip case is the more useful half. Quote it.\n- \"local_note\" carries the practical catch that generic reviews omit: billing currency, licence status, payout restrictions, free-tier caps, closed application windows. Do not drop it.\n- \"last_verified\" is the date a human last checked the entry, and \"verification_stale\" is true past 180 days. When it is stale, say so rather than presenting the detail as current.\n- Funding entries state the award, the application status as at verification, and the eligibility blockers. A closed programme is recorded as closed; say that instead of sending someone to apply.\n\nAlways give the user the directory link (\"url\") for anything you mention, so they can check the evidence and the verification date themselves.\n\nSearch returns at most 50 entries. Refine with country, category or sector rather than asking for more.",
      "tools": [
        {
          "name": "get_startup",
          "title": "Get one company in full",
          "description": "Everything the directory records about one African company: founders, funding stage, disclosed raise, named investors, valuation, headquarters and current status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The company's slug, e.g. 'flutterwave'. Returned as 'slug' by search_startups.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:574b62914a247363dfabe799244193221c049d93c98ee94c45590bd22c7df576"
        },
        {
          "name": "get_tool",
          "title": "Get one tool in full",
          "description": "Everything the directory records about one tool or funding programme: pricing, countries, setup time, use-when, skip-when, the local note and the verification date. Use after search_tools, with the slug from a result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The tool's slug, e.g. 'paystack'. Returned as 'slug' by search_tools.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf9d1ee23af90fb69deb6a3df83e9fe3cdc1f76fab1efc88af103db5d3dda511"
        },
        {
          "name": "list_categories",
          "title": "List the directory's categories",
          "description": "Every category with its slug, the phase it belongs to and how many entries it holds. Call this first when you need a valid 'category' value for search_tools, or to see what the directory covers before answering that it does not cover something.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8f830d2af2cedff1c66b21de6c42def7beeba0b71623e41f0089d54f943573f"
        },
        {
          "name": "search_startups",
          "title": "Search African startups",
          "description": "Search African companies by sector, country, funding stage, founder or investor. Returns founders, disclosed funding, named investors and headquarters. Where a company has shut down or been acquired, the description says so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO code of the market, e.g. NG, KE, ZA, EG, GH.",
                "type": "string"
              },
              "founded_after": {
                "description": "Only companies founded in or after this year.",
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords: a company, a founder, an investor or a sector, e.g. 'Flutterwave', 'Y Combinator', 'agritech'.",
                "maxLength": 200,
                "type": "string"
              },
              "sector": {
                "enum": ["Fintech", "Healthtech", "Edtech", "Agritech", "Logistics", "E-commerce", "SaaS", "Cleantech", "Proptech", "Insurtech", "Media & Entertainment", "HR & Recruitment", "Legal Tech", "Other"],
                "type": "string"
              },
              "stage": {
                "enum": ["Idea", "Pre-seed", "Seed", "Series A", "Series B", "Series C+", "Bootstrapped", "Acquired"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99e81e5e4a02d73c14e13e0f30100754577dca07119cadb07da268ea17ec223e"
        },
        {
          "name": "search_tools",
          "title": "Search African startup tools and funding",
          "description": "Search tools, services and funding programmes for African founders. Filter by country, category, funding phase or free tier. Each result says which countries it works in, when to use it, when to skip it, and the local catch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "africa_native": {
                "description": "True to return only African-built products.",
                "type": "boolean"
              },
              "category": {
                "description": "Category slug, from list_categories. For example 'payments' or 'legal-compliance'.",
                "type": "string"
              },
              "country": {
                "description": "ISO code of the market: NG, GH, KE, ZA, EG, RW, TN, MA, SN, CI, ET, TZ, UG, DZ, CM, ZW, ZM, AO, SD. Entries marked Pan-African match any country. Set this whenever the user named a country.",
                "type": "string"
              },
              "free_tier": {
                "description": "Limit to entries with a free tier, without one, or trial-only.",
                "enum": ["yes", "no", "trial"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "phase": {
                "description": "Stage of the journey. 'Start' is incorporation and banking, 'Money' is payments and funding, 'Build' is product, 'Grow' is sales and marketing.",
                "enum": ["Start", "Money", "Build", "Grow", "Africa-specific"],
                "type": "string"
              },
              "query": {
                "description": "Keywords: a need, a category or a name, e.g. 'payment gateway', 'company registration', 'Paystack'. Leave empty to browse by filter alone.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
