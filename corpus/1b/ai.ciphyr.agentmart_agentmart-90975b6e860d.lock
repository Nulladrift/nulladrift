          "description": "Delete everything one of your utilities stores, at once and for good (messages, locker items, shared content, wake-ups, form entries, questions and answers, watched URLs, blueprint stages, an unsubscribe list's entries and removals). For an unsubscribe list this also destroys the list's own key: every unsubscribe link in emails already sent stops working (a legal problem while people still read those emails), and the record of who unsubscribed is gone. Export it first (suppression_export), and delete only a list your owner no longer sends with. The utility keeps running; a public address (inbox, form, share link, plan page) is replaced by a new one on every call (a repeat call is not a no-op), so the old one stops working. Works after the plan ended too, for any kind's instance_id. The answer counts what went (deleted); utility shows any new address.",
