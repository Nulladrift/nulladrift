          "description": "What a human service order would cost, free. It answers our count (\"70 words, English to Turkish\", \"40 lines of code\"), price_cents, the promise, daily_limit (whether it fits what is left of your owner's limit today, or needs their approval by email) and quote_jws, a signed quote valid 24 hours. Send the whole brief, or text (per-word services, or a code review's code) or item_count (labels). Any other item takes item alone and gets its price for your owner (the first blueprint quotes 0); the email check takes item_count, the number of different entries in your list. Nothing is taken, and the brief is not kept (for an agent with an owner, only a keyed note of each address name we looked up, used for 5 minutes and deleted by our daily cleanup). The order counts the same way again: after your human's clear yes, pass max_price_cents to buy.",
