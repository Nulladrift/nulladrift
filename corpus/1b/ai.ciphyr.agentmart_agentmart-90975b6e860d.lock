        {
          "name": "inbox_pro_set",
          "title": "Set webhook inbox pro forwarding, signature checks and handshakes",
          "description": "Set your webhook inbox pro plan (instance_id: its ipr_ id; inbox_pro_get shows the settings first): inbox_instance_id (the inbox to upgrade; its address stays), forward, verify, handshakes. Fields left out stay; forward or verify null turns it off. Moving the plan to another inbox turns off verify, handshakes and forward unless this call sets them again. A forward url must prove it is yours by answering our check POST. The forwarding key comes back once, as forward_secret: keep it to check our forwards; rotate_forward_secret replaces it.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "inbox_instance_id": "inb_exampleexampleexample2",
                "instance_id": "ipr_exampleexampleexample2",
                "verify": {
                  "preset": "github",
                  "secret": "example-secret"
                }
              }
            ],
            "properties": {
              "forward": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "url": {
                        "description": "Public https URL.",
                        "maxLength": 2048,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Where to forward every message; null turns it off."
              },
              "handshakes": {
                "additionalProperties": false,
                "description": "Answer the Slack, Zoom or Meta URL checks.",
                "properties": {
                  "meta_verify_token": {
                    "anyOf": [
                      {
                        "maxLength": 256,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Answer Meta's GET hub.challenge when hub.verify_token equals this (8 to 256 characters). null turns it off."
                  },
                  "slack": {
                    "description": "Answer Slack's url_verification (needs verify preset slack).",
                    "type": "boolean"
                  },
                  "zoom": {
                    "description": "Answer Zoom's endpoint.url_validation (needs verify preset zoom).",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "inbox_instance_id": {
                "description": "The inbox to upgrade (one of yours).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "instance_id": {
                "description": "Utility instance id from buy or list_utilities.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "passport_token": {
                "description": "Your amp_ token, only if you have no app sign-in and cannot send a header.",
                "maxLength": 200,
                "type": "string"
              },
              "rotate_forward_secret": {
                "const": true,
                "description": "true: a new forwarding key (returned once).",
                "type": "boolean"
              },
              "verify": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "algorithm": {
                        "description": "hmac only, default sha256.",
                        "enum": ["sha256", "sha512", "sha1"],
                        "type": "string"
                      },
                      "encoding": {
                        "description": "hmac only, default hex.",
                        "enum": ["hex", "base64"],
                        "type": "string"
                      },
                      "forward_only_verified": {
                        "description": "true: forward only messages whose signature verified; the rest stay in the inbox (forward status skipped, not_verified).",
                        "type": "boolean"
                      },
                      "header": {
                        "description": "hmac only: the signature header.",
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "prefix": {
                        "description": "hmac only: text before the signature, for example \"sha256=\".",
                        "maxLength": 20,
                        "type": "string"
                      },
                      "preset": {
                        "description": "The sender: github, stripe, slack or zoom, or hmac for any other sender that signs with HMAC.",
                        "enum": ["github", "stripe", "slack", "zoom", "hmac"],
                        "type": "string"
                      },
                      "reject_unverified": {
                        "description": "true: a message that fails is refused with 401 and not stored.",
                        "type": "boolean"
                      },
                      "secret": {
                        "description": "The sender's signing secret (stored encrypted, never shown).",
                        "maxLength": 256,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["preset", "secret"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Sender signature check; null turns it off."
              }
            },
            "required": ["instance_id"],
            "type": "object"
          },
