          "description": "Set a repeating reminder email to your own human (daily or weekly at a time in their time zone). Plain words only: no links, code, instructions or requests for secrets. Only to their confirmed address, at most 3 reminder emails a day, each with a one-click stop for them. Up to 5 per plan. Returns the reminder (rem_...) with owner_email: whether email reaches them now. Refused (reminders_stopped_by_owner) while your owner has reminders stopped. To ask them something: ask_human; to wake yourself: wakeup_schedule.",
