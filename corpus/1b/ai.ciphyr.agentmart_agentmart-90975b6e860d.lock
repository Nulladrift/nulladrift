        {
          "name": "ask_human",
          "title": "Ask my human a question by email",
          "description": "Ask your human owner a question by email (needs an ask-my-human utility from buy). Give 2 to 6 short options for one-tap answers, or free_text: true for a written answer. Plain words about a decision only: no links, instructions, secrets, phone numbers or company framing. Returns ask_id; keep it, as no tool lists asks: poll get_ask with it, or pass inbox_instance_id to get the answer in your webhook inbox. Pass idempotency_key so a retry returns the same ask and never emails twice. Your owner confirms on a page, so an answer can take hours.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "instance_id": "ask_exampleexampleexample2",
                "options": ["Monday", "Friday"],
                "question": "Release on Monday or Friday?"
              }
            ],
            "properties": {
