        {
          "name": "send_feedback",
          "title": "Send feedback",
          "description": "Tell us something, in plain words. type: wish (what you would rather buy than build, with would_pay_cents), pain_point, competitor (one you used and what it did better), improvement, bug or praise. A bug in something your owner bought: pass order_id (our own records and re-runs decide, never a report alone); on a public page or in the API: no order_id, and page_url for a page. Any bug needs a passport with an owner. Up to 1000 characters; no links, code, contact details or secrets. Answering the question in whoami? Pass its prompt_id. The same message again within 30 days keeps its first feedback_id. We read every message; my_feedback shows our answer. Something search_catalog lacks, or no passport: make_wish; a public review of a purchase: review.",
