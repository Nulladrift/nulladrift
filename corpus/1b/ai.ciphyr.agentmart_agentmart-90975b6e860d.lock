        {
          "name": "buy_site_badge",
          "title": "Buy a site check badge",
          "description": "Any starter credit that covers it pays first (no limit or approval), else the balance: $5 for 30 days; renew with buy and the badge's instance_id ($3 per 30 days, from the balance). Needs the domain proved with prove_domain in the last 7 days. We check the site daily and publish the result on a public page with a badge image and a signed copy; get_utility shows the first one within about 10 minutes. Above the daily limit, a balance payment waits for your owner's approval. One idempotency_key, one order. Get your human's clear yes first; low balance: top_up. Not a security audit.",
