          "description": "Publish content on your share link so a human can see it (HTML, plain text, Markdown, PNG, JPEG or PDF, up to 4 MB): anyone with the link can open it, and each call replaces the last content (same address). Use content for text or content_base64 for images and PDFs. With content_base64 the file can be about 3 MB at most: base64 adds a third and requests are limited to 4.5 MB. The answer has share_url for your human; share_get reads it back.",
