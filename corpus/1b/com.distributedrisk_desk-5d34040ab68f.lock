      },
      "serverInfo": {
        "name": "distributed-risk-desk",
        "title": "Distributed Risk desk",
        "version": "1.7.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to the Distributed Risk public desk and the official US record behind it. Desk notes are short reads on official actions (designations, general licenses, advisories, dates that turn), each citing the record and naming the readers it is for: list_notes for what is current (a page at a time, by topic or reader), search_notes to find a name, list, country or date, get_note for one note with its sources. The official record, read from the government sources directly: search_screening_lists (OFAC, BIS and State screening lists), list_ofac_actions, search_kev (CISA Known Exploited Vulnerabilities), search_federal_register, list_travel_advisories, get_reference_rates (New York Fed EFFR, SOFR and related rates) and get_treasury_yields (Treasury par yield curve). Each answer links the source and says when it was read. Cyber: get_cve (one CVE in full: the CVE.org record, CISA's exploitation call and KEV listing, FIRST's EPSS estimate), list_cyber_advisories (CISA alerts, joint advisories, ICS advisories), list_cyber_incident_filings (incidents public companies report to the SEC on Form 8-K) and list_ai_stack_vulnerabilities (new advisories and malicious-package reports against agent frameworks, LLM gateways, MCP, model serving and ML platforms). Dependencies: check_dependencies takes the packages a codebase installs — as a list, or as a lockfile or SBOM pasted whole — and returns every advisory OSV.dev holds against those exact versions, with the fixing version, CISA's exploitation listing and the EPSS estimate. list_new_vulnerabilities is what is new across GitHub's reviewed advisories, NVD's CVE feed and CISA's KEV additions, exploited first. EPSS is a model estimate, and OSV.dev, the GitHub Advisory Database and NVD are the vulnerability record rather than government action; all are labeled where they appear. A version no advisory covers is not a version shown to be safe. A list match is a lead to check against the official entry, not a determination; no match is not a clearance. Decision support from official public sources. Not a legal determination of sanctions, travel, or cyber status. Readers own their compliance obligations.",
      "tools": [
        {
          "name": "check_dependencies",
          "title": "Check dependencies against the vulnerability record",
          "description": "Which of these package versions have a known vulnerability. Give packages directly (ecosystem, name, version), or paste a lockfile or SBOM as manifest and it is read for you: package-lock.json, pnpm-lock.yaml, yarn.lock, requirements.txt, poetry.lock, Pipfile.lock, go.mod, go.sum, Cargo.lock, Gemfile.lock, composer.lock, packages.lock.json, gradle.lockfile, cyclonedx, spdx, purls. Each version is checked against OSV.dev, which aggregates GitHub's reviewed advisories, the Go and PyPI databases, RustSec and OpenSSF's malicious-package reports across npm, PyPI, Go, Maven, crates.io, NuGet, RubyGems, Packagist and more. Every hit comes back with its severity, the CVEs it is known by, the versions that fix it, whether CISA lists it as exploited with the federal due date, and FIRST's EPSS estimate. Exploited packages come first, then malicious packages, then severity. A version with no hit is a version no advisory in those databases covers; that is not a statement that it is safe. Only resolved versions are read: a file of ranges (package.json, Pipfile, pom.xml) cannot be checked, so pass the lockfile beside it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "The manifest's filename, when you have it. Without it the format is read from the content.",
                "maxLength": 200,
                "type": "string"
              },
              "kev_only": {
                "default": false,
                "description": "true: only advisories CISA lists as exploited.",
                "type": "boolean"
              },
              "limit": {
                "default": 40,
                "description": "How many affected packages to return. The counts cover all of them.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "manifest": {
                "description": "The contents of a lockfile or SBOM. Use this or packages.",
                "maxLength": 1000000,
                "type": "string"
              },
              "packages": {
                "description": "The packages to check, as installed. Use this or manifest.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ecosystem": {
                      "description": "The ecosystem, as OSV names it.",
                      "enum": ["CRAN", "GitHub Actions", "Go", "Hackage", "Hex", "Maven", "NuGet", "Packagist", "Pub", "PyPI", "RubyGems", "SwiftURL", "crates.io", "npm"],
                      "type": "string"
                    },
                    "name": {
                      "description": "The package name: lodash, requests, github.com/gin-gonic/gin, org.apache.logging.log4j:log4j-core.",
                      "maxLength": 220,
                      "minLength": 1,
                      "type": "string"
                    },
                    "version": {
                      "description": "The exact installed version, not a range.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["ecosystem", "name", "version"],
                  "type": "object"
                },
                "maxItems": 600,
                "type": "array"
              },
              "severity_min": {
                "description": "Only this severity and above. Malicious packages and anything CISA lists as exploited are always returned.",
                "enum": ["low", "moderate", "high", "critical"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
