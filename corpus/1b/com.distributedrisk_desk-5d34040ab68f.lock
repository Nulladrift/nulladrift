        {
          "name": "list_new_vulnerabilities",
          "title": "New vulnerabilities: GitHub, NVD and CISA KEV",
          "description": "What is new across the three vulnerability feeds, exploited first, then by severity, then newest: GitHub's reviewed advisories (the affected package range and the first patched version), NVD's newly published CVE records (software no package ecosystem carries, with NIST's scoring), and the CVEs CISA added to its Known Exploited Vulnerabilities catalog. A KEV addition keeps its own date: it is CISA saying this one is being exploited now, often long after the CVE was published. A CVE that GitHub and NVD both published in the window appears once, from GitHub. For CISA's alerts and joint advisories rather than vulnerabilities, use list_cyber_advisories.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai_stack": {
                "description": "true: only entries that name AI or agent software. false: only entries that do not.",
                "type": "boolean"
              },
              "ecosystem": {
                "description": "One package ecosystem, as GitHub names it. GitHub only; NVD and KEV are skipped when it is set.",
                "enum": ["actions", "composer", "erlang", "go", "maven", "npm", "nuget", "other", "pip", "pub", "rubygems", "rust", "swift"],
                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find: NVD searches its records, GitHub and KEV entries are matched on summary, package, vendor and product.",
                "maxLength": 200,
                "type": "string"
              },
              "severity": {
                "description": "This severity band only. GitHub and NVD; KEV, which does not rate severity, is skipped when it is set.",
                "enum": ["low", "medium", "high", "critical"],
                "type": "string"
              },
              "since": {
                "description": "Dated on or after this day (YYYY-MM-DD). Default 7 days ago.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "source": {
                "description": "Which feeds to read. Default all three. A source that cannot honour a filter is skipped and named in the answer.",
                "items": {
                  "enum": ["github", "nvd", "cisa_kev"],
                  "type": "string"
                },
                "type": "array"
              },
              "until": {
                "description": "Dated on or before this day. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
