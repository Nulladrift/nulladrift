        {
          "name": "list_ai_stack_vulnerabilities",
          "title": "AI and agent stack: new advisories",
          "description": "New advisories against the software AI agents run on, newest and most severe first: agent frameworks (LangChain, LlamaIndex, CrewAI, n8n, Langflow), LLM gateways (LiteLLM), MCP servers and SDKs, model serving (vLLM, Ollama), ML platforms (MLflow, Ray, Jupyter), model libraries, AI apps and coding agents. Malicious-package reports (a compromised or lookalike release) come first. CISA KEV entries in the same stack are included. Each with package, severity, fixed versions, CVEs, EPSS and the advisory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_kev": {
                "default": true,
                "description": "Include CISA KEV entries for AI-stack products added in the window.",
                "type": "boolean"
              },
              "kind": {
                "enum": ["malicious_package", "vulnerability"],
                "type": "string"
              },
              "layer": {
                "description": "One layer of the stack.",
                "enum": ["agent_framework", "llm_gateway", "mcp", "model_serving", "ml_platform", "model_library", "ai_app", "coding_agent", "gpu_infra", "ai_assistant", "ai_systems"],
                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "package": {
                "description": "One package name, for example litellm or @modelcontextprotocol/sdk.",
                "maxLength": 120,
                "type": "string"
              },
              "since": {
                "description": "Advisories dated on or after this day (YYYY-MM-DD). Default 14 days ago; reaches back 30 days.",
