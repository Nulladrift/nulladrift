{
  "lockfileVersion": 2,
  "subjects": {
    "com.compatsy/3d-printing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://compatsy.com/3d-printing/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "compatsy-compare",
        "title": "compatsy compare",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Look up printer, nozzle, hotend, build plate, filament, enclosure products: search, specs with sources, side-by-side comparison, fit checks and live stock with verified prices. Fit verdicts cite the rule id and rules version that decided them; unknown means a needed spec is missing. Other sections have their own MCP servers: Home espresso at https://compatsy.com/home-espresso/mcp. Links are affiliate links; we may earn a commission. The default link is the lowest in-stock USD price regardless of commission.",
      "tools": [
        {
          "name": "check_fit",
          "title": "Check fit",
          "description": "Does this part fit that machine? Returns a verdict with the rule id and version that decided it, or the missing fields. Example: {\"subject_id\":\"e3d-v6-1-75mm-brass-nozzles-0-40mm-1-75mm\",\"target_id\":\"prusa-mk4s\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "subject_id": {
                "description": "Part id or slug",
                "type": "string"
              },
              "target_id": {
                "description": "Id or slug of the machine the part goes on",
                "type": "string"
              }
            },
            "required": ["subject_id", "target_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check fit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6df8aac665ec53f3dcc7e09172f2a907d0787b6ed03d279bdbc5ac9fae66332d"
        },
        {
          "name": "check_stock",
          "title": "Check stock and price",
          "description": "Availability and price per merchant, re-verified live when the data is over an hour old. Example: {\"product_id\":\"e3d-v6-1-75mm-brass-nozzles-0-40mm-1-75mm\",\"merchant_id\":\"e3d-online-com\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "merchant_id": {
                "type": "string"
              },
              "product_id": {
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check stock and price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:814189a4565190639a53dbc939b5d414a763de19fefdb8d702936109f0f8399e"
        },
        {
          "name": "compare",
          "title": "Compare products",
          "description": "Side-by-side spec table with offers and the fields that differ. Pass 2-10 product_ids, or a category with filters. Example: {\"product_ids\":[\"prusa-core-one\",\"bambu-lab-p1s\"]}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "filters": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    }
                  ]
                },
                "description": "Needs category. Spec field -> exact value, e.g. {\"material\":\"brass\"}; an unknown field or value is an error listing the valid ones",
                "type": "object"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "product_ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25edf6f5f64bda3c3cbbb307a41c5d995fafa1cc8935d1cb19f745a29f072b8a"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Full specs with per-field confidence and source, every offer with verified time, 30/90-day price range, and the top fits per category with counts. Example: {\"product_id\":\"prusa-mk4s\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fits_limit": {
                "description": "Fits listed per category (default 10; 0 = counts only). For one pair use check_fit",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "product_id": {
                "description": "Product id or slug",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1560e47e330868dace84915d70f81f7490f491fdf55118966b013910160c1642"
        },
        {
          "name": "report_issue",
          "title": "Report a data issue",
          "description": "Flag a wrong spec, price or fit verdict. Reports never edit facts; two independent reports mark a fact disputed. Example: {\"entity_type\":\"product\",\"entity_id\":\"prusa-mk4s\",\"field\":\"nozzle_thread\",\"claim\":\"MK4S uses the Nextruder thread\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim": {
                "maxLength": 500,
                "type": "string"
              },
              "entity_id": {
                "maxLength": 120,
                "type": "string"
              },
              "entity_type": {
                "enum": ["product", "offer", "fit"],
                "type": "string"
              },
              "field": {
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["claim", "entity_id", "entity_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report a data issue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e140692e3dba2fe5fa011eb0f6929d84a1d06ed3c658561202fc5984090e7a8f"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Find products by name or by category and spec filters; returns key specs and the best in-stock offer. Example: {\"query\":\"hardened 0.4\",\"category\":\"nozzle\",\"limit\":5}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "filters": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    }
                  ]
                },
                "description": "Needs category. Spec field -> exact value, e.g. {\"material\":\"brass\"}; an unknown field or value is an error listing the valid ones",
                "type": "object"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3408e15ca806ae36039e38edfdd35bbc97fffc92355111a6b92c701686cbbfc"
        }
      ],
      "digest": "sha256:5158fcee7d6bea417bae5be4e045a6af647fd5a45bcc407154aec391120f2852"
    }
  }
}
