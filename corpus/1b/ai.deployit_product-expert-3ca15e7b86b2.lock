  "subjects": {
    "ai.deployit/product-expert": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.deployit.ai/demo"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "deployit-deployit-demo",
        "title": "DeployIt — DeployIt demo",
        "version": "2.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DeployIt answers questions about the code of DeployIt demo.\nCaller profile: public demo. Tools: server_info, ask_code, recent_changes.\nCall server_info first if you doubt the freshness of the code index or want the counters.\nThis server never shows code, file paths nor people's names.",
      "tools": [
        {
          "name": "ask_code",
          "title": "Ask about the code",
          "description": "Ask a question about the company's code and get an answer verified against its live source code and git history: product behavior, features, settings, limits, error messages, recent changes.\n\nDURATION: a fresh investigation takes 20-60 seconds. Repeated questions without `context` are served from cache at once; the cache resets when the code changes.\n\nIF IT TIMES OUT: the investigation keeps running. Ask the IDENTICAL question again about a minute later.\n\nSTATUS (also in structuredContent.status): verified = confirmed in the code; backend_only = exists server-side without a visible UI path; not_found = searched, it does NOT exist; unknown = could not conclude, do not relay as fact.\n\nLIMITS: read-only. Some topics may be refused for your profile. On the free plan, 15 questions per week per company; cached answers never count.\n\nAnswers never contain code nor file paths.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional context from your conversation (symptoms, what was tried…). Never cached: omit it for generic questions.",
                "maxLength": 4000,
                "type": "string"
              },
              "depth": {
                "description": "quick (default): up to about a minute. thorough: digs deeper; may be capped by the profile.",
                "enum": ["quick", "thorough"],
                "type": "string"
              },
              "question": {
                "description": "The question about the code, as specific as possible. Identical wording hits the cache: after a timeout, repeat it verbatim.",
                "maxLength": 2000,
                "minLength": 3,
                "type": "string"
              },
              "repository": {
                "description": "Restrict to one repository of your access (\"owner/repo\" or its short name).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answer": {
                "type": "string"
              },
              "repositories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "served_from_cache": {
                "type": "boolean"
              },
              "sources": {
                "additionalProperties": false,
                "properties": {
                  "commits": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "repository": {
                          "type": "string"
                        },
                        "sha": {
                          "type": "string"
                        }
                      },
                      "required": ["repository", "sha"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "commits_count": {
                    "type": "number"
                  },
                  "files": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "path": {
                          "type": "string"
                        },
                        "repository": {
                          "type": "string"
                        }
                      },
                      "required": ["path", "repository"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "files_count": {
                    "type": "number"
                  }
                },
                "required": ["commits_count", "files_count"],
                "type": "object"
              },
              "status": {
                "enum": ["verified", "backend_only", "not_found", "unknown"],
                "type": "string"
              }
            },
            "required": ["answer", "repositories", "served_from_cache", "sources", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0cf749de9b600670dc71271c23b1aa5dc364aa17a0b02fd423b16147e343c83d"
        },
        {
          "name": "recent_changes",
          "title": "Recent changes",
          "description": "What landed on the tracked branches over the last days (14 by default, 90 at most), grouped into deliveries (one per PR, else per day, module and type of change), most recent first. Facts only: no person is named.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "1 to 90, default 14",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "repository": {
                "description": "repository name (org/repo), among the repositories of your access",
                "maxLength": 255,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "computed_at": {
                "type": ["string", "null"]
              },
              "deliveries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "commits": {
                      "type": "number"
                    },
                    "date": {
                      "type": "string"
                    },
                    "hotfix": {
                      "type": "boolean"
                    },
                    "modules": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "pr": {
                      "type": ["number", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["commits", "date", "hotfix", "modules", "pr", "title", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "first_computation_in_progress": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "read_until": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["name", "read_until"],
                  "type": "object"
                },
                "type": "array"
              },
              "from": {
                "type": "string"
              },
              "timezone": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "totals": {
                "additionalProperties": false,
                "properties": {
                  "commits": {
                    "type": "number"
                  },
                  "deliveries": {
                    "type": "number"
                  },
                  "prs": {
                    "type": "number"
                  }
                },
                "required": ["commits", "deliveries", "prs"],
                "type": "object"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["computed_at", "deliveries", "first_computation_in_progress", "from", "timezone", "to", "totals", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6d9a40a125ea9979c5ffc91c29e00c7bb89ee8802f7dd4289cf286ed22d47a4f"
        },
        {
