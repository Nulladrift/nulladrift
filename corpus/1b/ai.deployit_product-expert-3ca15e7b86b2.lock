      },
      "transport": {
        "type": "http",
        "url": "https://mcp.deployit.ai/demo"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "deployit-demo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "ask_product_expert",
          "title": "Ask the product expert",
          "description": "Ask a question about \"deployit\" and get an answer verified against its live source code and git history. Use it for anything about product behavior, features, settings, limits, error messages, or recent changes.\n\nHOW IT WORKS AND HOW LONG IT TAKES: the expert genuinely investigates — it searches and reads the product's real source code before answering. A fresh investigation takes 20-60 SECONDS. Do not give up early, and if a human is waiting, tell them the verified answer may take up to a minute. Repeated questions asked without `context` are served from cache in under a second; the cache resets whenever the product's code changes.\n\nIF IT TIMES OUT: you get an error saying the expert could not finish in time. The investigation KEEPS RUNNING in the background — re-ask the IDENTICAL question (same wording, no `context`) about a minute later and the finished answer is served instantly from cache. Retry with the same words; rephrasing restarts the investigation.\n\nREADING THE ANSWER: it ends with a Sources block (the files and commits actually consulted) and a Verification status carrying both confidence and polarity:\n- verified: confirmed in the code — safe to relay.\n- backend_only: the capability exists server-side but has no visible UI path.\n- not_found: searched, and it does NOT exist — a factual \"no\", relayable as such.\n- unknown: the expert could not conclude — do NOT relay as fact; consider retrying with depth \"thorough\".\n\nLIMITS: strictly read-only — it can never change anything. Some topics may be refused by the project's policy. A monthly question quota may apply (the error message says so when reached; cached answers never count). At most 60 requests per minute per access key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional context from your own conversation with the end user (symptoms, plan, what they tried…). Makes the answer more targeted, but context-carrying questions are never cached — omit it for generic questions.",
                "type": "string"
              },
              "depth": {
                "description": "quick (default): up to ~1 minute of investigation, right for support questions. thorough: digs much deeper for hard questions — expect the timeout-then-retry-from-cache flow.",
                "enum": ["quick", "thorough"],
                "type": "string"
              },
              "question": {
                "description": "The question about the product, as specific as possible. Identical wording hits the cache — when retrying after a timeout, repeat the question verbatim.",
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9538503a429123d3dcdbd4eb90e7bb013f4a9f971323d0d7ceb7fd554d4ff747"
        },
        {
          "name": "get_recent_changes",
          "title": "Recent product changes",
          "description": "Instant list of recent changes to \"deployit\" — the semantic changelog derived from its commits. No AI processing: responds in under a second, costs nothing, and never counts against any quota. Use this FIRST for \"what changed\", \"what's new\", \"since when\" questions; escalate to ask_product_expert only when you need an investigated answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days back (default 14, max 90).",
                "maximum": 90,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:30f37e789dff41796c8cc954361abf8996e1f18f36384811e78c0a9234e5f242"
        },
        {
          "name": "server_info",
          "title": "Server info",
          "description": "Describe this MCP server: which product it answers for, which repositories back it, and how fresh the underlying code index is. Instant (no AI). Call it once at the start of a session to confirm you are talking to the right product — if the index is stale or still building, say so instead of trusting deep answers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
