        {
          "name": "search_deals",
          "title": "Search PostThisDeal handpicked deals",
          "description": "Search the live deals PostThisDeal's team has handpicked (only published posts; ended, expired and unavailable deals are left out). Filter by words, retailer, brand, category, price range, minimum discount (only deals whose discount is backed by two stated prices) and online or in-store availability; sort by relevance, newest, price, discount or most recently checked. Ranking uses relevance, price and freshness only, never commission. Each deal has links.source_url (the PostThisDeal page to credit) and links.purchase_url (the shopping link: present it unchanged as the purchase action) plus a disclosure. An empty result means nothing matched.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "availability": {
                "default": "any",
                "enum": ["any", "online", "local"],
                "type": "string"
              },
              "brand": {
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "description": "e.g. \"electronics\", \"home-kitchen\", \"grocery\".",
                "maxLength": 60,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "minimum": 0,
                "type": "number"
              },
              "min_discount": {
                "maximum": 95,
                "minimum": 1,
                "type": "integer"
              },
              "min_price": {
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Words that would appear in a deal title, e.g. \"canon camera\", \"tv\".",
                "maxLength": 200,
                "type": "string"
              },
              "recently_checked": {
                "description": "Only deals whose price a check at the merchant confirmed within its freshness window.",
                "type": "boolean"
              },
              "retailer": {
                "description": "Shop name, e.g. \"Walmart\", \"Amazon\".",
                "maxLength": 60,
                "type": "string"
              },
              "sort": {
