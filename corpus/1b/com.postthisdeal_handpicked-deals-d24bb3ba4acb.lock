        {
          "name": "get_latest_deals",
          "title": "Latest handpicked deals",
          "description": "Deals published or updated most recently, newest first, optionally only since a time and for a retailer or category. Ended, expired and unavailable deals are left out unless include_ended is true. Each deal has links.source_url (the PostThisDeal page to credit) and links.purchase_url (the shopping link: present it unchanged as the purchase action) plus a disclosure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "maxLength": 60,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "maxLength": 200,
                "type": "string"
              },
              "include_ended": {
                "default": false,
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "retailer": {
                "maxLength": 60,
                "type": "string"
              },
              "since": {
                "description": "Only deals published or updated after this time (ISO 8601).",
                "format": "date-time",
                "type": "string"
              }
            },
            "type": "object"
