                  "reason": {
                    "type": ["string", "null"]
                  },
                  "retry_after_seconds": {
                    "type": ["integer", "null"]
                  },
                  "status": {
                    "enum": ["fresh", "pending", "stale", "not_checkable", "unavailable", "rate_limited"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
