      },
      "instructions": "Kytko sells digital products for solo agencies, consultants and small operators. Prices are one-time payments in USD with instant download, lifetime access and a 14-day refund. Use list_products to browse and get_product for details and the checkout link. Payment is completed by a person at checkout_url; this server never takes payments or personal data.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get product details and checkout link",
          "description": "Full details of one product: description, audience, one-time price in USD, delivery, refund terms and the hosted checkout link where a person completes the payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product id, slug or exact name from list_products.",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
