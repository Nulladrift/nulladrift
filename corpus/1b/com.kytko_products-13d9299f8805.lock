        },
        {
          "name": "list_products",
          "title": "List Kytko digital products",
          "description": "List Kytko digital products for solo agencies, consultants and small operators (AI agent prompts, n8n workflows, Notion templates, Custom GPT configurations, contract templates). Optional filters: free-text query, category, maximum price in USD.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
