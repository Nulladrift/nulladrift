          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Home-improvement cost estimates for US homes. Call list_services first if unsure what is supported. estimate_project needs only square footage, room count and the services; pass zip_code (or state) whenever known so labor is priced for the right metro area or state. Use check_quote when a homeowner has a contractor's price and wants to know if it is reasonable, and compare_tiers to show what economy, mid-range and premium quality would cost. Present results as ranges and repeat the disclaimer: these are planning estimates, not bids.",
      "tools": [
        {
          "name": "check_quote",
          "title": "Check whether a contractor quote is fair",
          "description": "Compare a contractor's quoted price with BidBud's likely range for the same scope.\n\n    Prices the scope at economy, mid-range and premium quality and judges the\n    quote against the likely range (confidence band) of the quality level being\n    compared. Verdicts: \"low\" (below the range: ask what is excluded), \"fair\",\n    \"high\" (above the range but within premium pricing) and \"very_high\" (above\n    even the premium range).\n\n    When to use: a homeowner has a contractor's price and asks whether it is\n    reasonable.\n    Limits: judges the price only, not the contractor, workmanship or exact\n    materials; US residential homes only; a planning comparison, not an\n    appraisal or a bid.\n\n    Args:\n        quoted_price: The contractor's total price in USD for the listed services.\n        home_sqft: Finished square footage of the home.\n        num_rooms: Number of rooms.\n        services: The services the quote covers.\n        quality_tier: Quality level the quote is for: \"economy\", \"medium\"\n            (mid-range, default) or \"high\" (premium).\n        zip_code: US ZIP code of the property, for regional labor pricing.\n        state: Two-letter state code, used when the ZIP is unknown.\n        stories: Above-grade stories (1, 1.5, 2 or 3; default 1).\n        flooring_type: For flooring quotes: carpet, tile, vinyl, hardwood or mix.\n        num_windows: For window quotes: number of windows being replaced.\n        roof_pitch: Roof slope if known: low, standard, steep or very_steep.\n        roof_shape: gable, hip or complex.\n        home_type: detached, townhouse_end, townhouse_middle or condo.\n        year_built: Year the home was built (before 1978 adds lead-safe work practices).\n    ",
          "inputSchema": {
            "properties": {
              "flooring_type": {
                "anyOf": [
                  {
                    "enum": ["carpet", "tile", "vinyl", "hardwood", "mix"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Flooring Type"
              },
              "home_sqft": {
                "title": "Home Sqft",
                "type": "integer"
              },
              "home_type": {
                "anyOf": [
                  {
                    "enum": ["detached", "townhouse_end", "townhouse_middle", "condo"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Home Type"
              },
              "num_rooms": {
                "title": "Num Rooms",
                "type": "integer"
              },
              "num_windows": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Num Windows"
              },
              "quality_tier": {
                "default": "medium",
                "enum": ["economy", "medium", "high"],
                "title": "Quality Tier",
                "type": "string"
              },
              "quoted_price": {
                "title": "Quoted Price",
                "type": "number"
              },
              "roof_pitch": {
                "anyOf": [
                  {
                    "enum": ["low", "standard", "steep", "very_steep"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Roof Pitch"
              },
              "roof_shape": {
                "anyOf": [
                  {
                    "enum": ["gable", "hip", "complex"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Roof Shape"
              },
              "services": {
                "items": {
                  "enum": ["painting", "exterior_painting", "drywall", "electrical", "roofing", "flooring", "windows", "cleaning", "pressure_washing", "gutter_cleaning", "junk_removal", "handyman", "pest_control"],
                  "type": "string"
                },
                "title": "Services",
                "type": "array"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "State"
              },
              "stories": {
                "anyOf": [
                  {
                    "enum": [1, 1.5, 2, 3]
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stories"
              },
              "year_built": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Year Built"
              },
              "zip_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Zip Code"
              }
            },
            "required": ["home_sqft", "num_rooms", "quoted_price", "services"],
