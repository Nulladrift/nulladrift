      "serverInfo": {
        "name": "bidbud-estimating",
        "title": "BidBud Estimating",
        "version": "1.2.0",
        "description": "Home-improvement cost estimates for US homes: itemized, regionally priced estimates, economy/mid-range/premium comparisons, 'is this quote fair?' checks and permit guidance. Read-only; no account needed. Privacy policy: https://www.bidbudai.com/privacy",
        "websiteUrl": "https://www.bidbudai.com",
        "icons": [
          {
            "src": "https://www.bidbudai.com/bidbud-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
