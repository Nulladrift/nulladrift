        {
          "name": "estimate_project",
          "title": "Estimate a home-improvement project",
          "description": "Estimate the cost of one or more home-improvement services for a US home.\n\n    When to use: the homeowner wants to know what a job should cost, for\n    example before asking contractors for bids.\n    Limits: US residential homes only, one property per call. A planning\n    estimate from national cost data with metro-area or state labor rates, not\n    a bid; actual prices depend on the site, the scope and the local market.\n\n    Args:\n        home_sqft: Finished square footage of the home (200-20000).\n        num_rooms: Number of rooms (1-50). Used to derive wall area.\n        services: Services to price, e.g. [\"painting\", \"roofing\"].\n        quality_tier: \"economy\", \"medium\" (mid-range) or \"high\" (premium).\n        zip_code: 5-digit US ZIP code of the property. Applies metro-area (or\n            state) labor-rate adjustments; strongly recommended.\n        state: Two-letter state code, used when the ZIP is unknown.\n        stories: Above-grade stories (1, 1.5, 2 or 3; default 1). Drives roof\n            area, siding area and gutter length for exterior services.\n        flooring_type: For flooring only: carpet, tile, vinyl, hardwood or mix.\n        num_windows: For windows only: actual window count, if known.\n        ceiling_height_ft: Override the default 8.5 ft ceiling height.\n        roof_sqft: Override the roof area derived from home size.\n        include_permits: Add estimated permit fees as separate lines.\n        include_contingency: Add a 10% contingency line for conditions found on site.\n        include_line_items: Include itemized quantities and unit costs.\n        roof_pitch: Roof slope if known: low, standard, steep or very_steep.\n            Steep roofs add area and a steep-slope labor surcharge.\n        roof_shape: gable, hip or complex; sets the gutter/eave length.\n        home_type: detached, townhouse_end, townhouse_middle or condo; shared\n            walls reduce siding, trim and gutters (condo exteriors are flagged\n            as usually the HOA's responsibility).\n        year_built: Year the home was built. Before 1978 adds EPA lead-safe\n            (RRP) work practices to painting, windows and drywall.\n        Each property detail you pass narrows the likely range for the\n        services it affects.\n\n    Returns totals per service, a confidence range, the main assumptions, and\n    questions to ask the homeowner that would tighten the estimate.\n    ",
          "inputSchema": {
            "properties": {
              "ceiling_height_ft": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Ceiling Height Ft"
              },
              "flooring_type": {
                "anyOf": [
                  {
                    "enum": ["carpet", "tile", "vinyl", "hardwood", "mix"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Flooring Type"
              },
              "home_sqft": {
                "title": "Home Sqft",
                "type": "integer"
              },
              "home_type": {
                "anyOf": [
                  {
                    "enum": ["detached", "townhouse_end", "townhouse_middle", "condo"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Home Type"
              },
              "include_contingency": {
                "default": false,
                "title": "Include Contingency",
                "type": "boolean"
              },
              "include_line_items": {
                "default": true,
                "title": "Include Line Items",
                "type": "boolean"
              },
              "include_permits": {
                "default": false,
                "title": "Include Permits",
                "type": "boolean"
              },
              "num_rooms": {
                "title": "Num Rooms",
                "type": "integer"
              },
              "num_windows": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Num Windows"
              },
              "quality_tier": {
                "default": "medium",
                "enum": ["economy", "medium", "high"],
                "title": "Quality Tier",
                "type": "string"
              },
              "roof_pitch": {
                "anyOf": [
                  {
                    "enum": ["low", "standard", "steep", "very_steep"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Roof Pitch"
              },
              "roof_shape": {
                "anyOf": [
                  {
                    "enum": ["gable", "hip", "complex"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Roof Shape"
              },
              "roof_sqft": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Roof Sqft"
              },
              "services": {
                "items": {
                  "enum": ["painting", "exterior_painting", "drywall", "electrical", "roofing", "flooring", "windows", "cleaning", "pressure_washing", "gutter_cleaning", "junk_removal", "handyman", "pest_control"],
                  "type": "string"
