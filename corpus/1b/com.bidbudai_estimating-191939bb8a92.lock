        {
          "name": "get_permit_guidance",
          "title": "Get permit guidance",
          "description": "Say whether each service typically needs a building permit, with typical\n    fees, and (when a state is given) the state's building code, code authority\n    and contractor licensing resources.\n\n    When to use: the homeowner asks whether a job needs a permit, or how to\n    check a contractor's license in their state.\n    Limits: typical requirements only; local rules vary, so confirm with the\n    local building department. General guidance, not legal advice.\n\n    Args:\n        services: Services being planned, e.g. [\"roofing\", \"electrical\"].\n        state: Two-letter US state code, e.g. \"PA\".\n    ",
          "inputSchema": {
            "properties": {
