        {
          "name": "compare_tiers",
          "title": "Compare quality tiers",
          "description": "Price the same project at economy, mid-range and premium quality side by side.\n\n    When to use: the homeowner asks \"what's the difference between a basic and a\n    high-end job?\" or wants to choose a budget level.\n    Limits: US residential homes only; tiers reflect typical materials and labor\n    at each level, not specific products or brands; planning estimates, not bids.\n\n    Args:\n        home_sqft: Finished square footage of the home (200-20000).\n        num_rooms: Number of rooms (1-50).\n        services: Services to price, e.g. [\"flooring\", \"painting\"].\n        zip_code: 5-digit US ZIP code of the property, for regional labor pricing.\n        state: Two-letter state code, used when the ZIP is unknown.\n        stories: Above-grade stories (1, 1.5, 2 or 3; default 1).\n        flooring_type: For flooring only: carpet, tile, vinyl, hardwood or mix.\n        num_windows: For windows only: actual window count, if known.\n        include_permits: Add estimated permit fees.\n        include_contingency: Add a 10% contingency allowance.\n\n    Returns the total for each tier, a per-service breakdown for each tier, and\n    each service's totals across the three tiers.\n    ",
          "inputSchema": {
            "properties": {
              "flooring_type": {
                "anyOf": [
                  {
                    "enum": ["carpet", "tile", "vinyl", "hardwood", "mix"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Flooring Type"
              },
              "home_sqft": {
                "title": "Home Sqft",
                "type": "integer"
              },
              "include_contingency": {
                "default": false,
                "title": "Include Contingency",
                "type": "boolean"
              },
              "include_permits": {
                "default": false,
                "title": "Include Permits",
                "type": "boolean"
              },
              "num_rooms": {
                "title": "Num Rooms",
                "type": "integer"
              },
              "num_windows": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Num Windows"
              },
              "services": {
                "items": {
                  "enum": ["painting", "exterior_painting", "drywall", "electrical", "roofing", "flooring", "windows", "cleaning", "pressure_washing", "gutter_cleaning", "junk_removal", "handyman", "pest_control"],
                  "type": "string"
                },
                "title": "Services",
                "type": "array"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "State"
              },
              "stories": {
                "anyOf": [
                  {
                    "enum": [1, 1.5, 2, 3]
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stories"
              },
              "zip_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Zip Code"
              }
            },
            "required": ["home_sqft", "num_rooms", "services"],
            "title": "compare_tiersArguments",
            "type": "object"
