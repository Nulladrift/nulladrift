{
  "lockfileVersion": 2,
  "subjects": {
    "com.fileustaxes/fileustaxes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fileustaxes.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fileustaxes",
        "title": "File US Taxes",
        "version": "1.0.0",
        "websiteUrl": "https://fileustaxes.com/agents/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "File US Taxes prepares federal tax returns (residents of all 50 states and Washington, DC, and US citizens abroad) in English and Spanish. A tax preparer reviews every return. Use check_eligibility and get_prices freely. Start a sign-up only when the person asks and agrees; client sign-ups are open at the portal. Never send Social Security numbers, tax documents or account numbers to any tool. Identity, consent, engagement-letter signing and payment stay with the person, in the client portal.",
      "tools": [
        {
          "name": "ask_tiny",
          "title": "Ask Tiny (FAQ)",
          "description": "Answer a general question about File US Taxes from the approved FAQ library only (no generated answers). Returns matching FAQ answers with a link to the FAQ and to the Tiny chat page, or a fallback when nothing matches. Do not send personal or tax details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "en or es. Default en.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "question": {
                "description": "A general question, for example: how much does it cost?",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ccf8ea376ef636cc64de7d068f7abc3982e7a9eb6906db0e04769a00738417a1"
        },
        {
          "name": "check_eligibility",
          "title": "Check eligibility",
          "description": "Check whether File US Taxes can prepare a federal return. Pass a two-letter US state code of the person's residence, or abroad=true for a US citizen living abroad. Returns eligible true or false. Does not take or return tax or identity data.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["state"]
              },
              {
                "required": ["abroad"]
              }
            ],
            "properties": {
              "abroad": {
                "description": "true only when the person is a US citizen living outside the United States. The preparer confirms identity and U.S. tax residency status later.",
                "type": "boolean"
              },
              "state": {
                "description": "Two-letter US state code of the person's residence, for example CA. Omit when abroad is true.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1593d5df4c64a280684d50d5947bfc58b42e4ca7b4b2944f88f2845062a54f8"
        },
        {
          "name": "get_prices",
          "title": "Get prices",
          "description": "Return the fixed USD prices for federal return preparation, with early and regular rates, the no-meeting and 30-minute-meeting options, and the early-rate end date. Same data as fileustaxes.com/services.json and /pricing/.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "en or es. Default en.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7eb63de0eab76499849d2cd3c8254c47796885c09be8a22da49c82aab8d04ead"
        },
        {
          "name": "start_signup",
          "title": "Start a sign-up",
          "description": "Record a sign-up request for the 2027 season and return the portal sign-up link (client sign-ups are open). Only call after the person has typed their own name and email and said yes; set consent to true only then. Do not put tax documents, Social Security numbers or account numbers in any field. Identity checks, the engagement letter, consent to file and payment are done by the person in the client portal, never by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["state"]
              },
              {
                "required": ["abroad"]
              }
            ],
            "properties": {
              "abroad": {
                "description": "true only when the person is a US citizen living outside the United States. The preparer confirms identity and U.S. tax residency status later.",
                "type": "boolean"
              },
              "consent": {
                "description": "Must be true, and only after the person agrees to start a sign-up.",
                "type": "boolean"
              },
              "email": {
                "description": "The person's email address, as they typed it.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "filing_type": {
                "description": "Their filing situation.",
                "enum": ["individual", "married", "self-employed", "business", "abroad", "other"],
                "type": "string"
              },
              "lang": {
                "description": "en or es. Default en.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "meeting": {
                "description": "no-meeting, meeting (30 minutes with the preparer), or unsure. Default unsure.",
                "enum": ["no-meeting", "meeting", "unsure"],
                "type": "string"
              },
              "name": {
                "description": "The person's name, as they typed it.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code of the person's residence, for example CA. Omit when abroad is true.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["consent", "email", "filing_type", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:49b9c8a1b151d6da0c4ab57c1306497d88b5d1e3b11fe050d7036d2556a35850"
        }
      ],
      "digest": "sha256:b588b548c3bd0e5d84ff205a30523a9abc04ce79187995af73f4d594315a23fe"
    }
  }
}
