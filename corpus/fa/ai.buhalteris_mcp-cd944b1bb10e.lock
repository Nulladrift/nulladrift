        {
          "name": "search_guides",
          "title": "Search buhalteris.ai guides (gidų paieška)",
          "description": "Keyword search over the 39 Lithuanian guides on buhalteris.ai about small partnerships (mažoji bendrija, MB), individual activity (individuali veikla, IV), business certificates (verslo liudijimas), VAT (PVM), income tax (GPM), the tax-free amount (NPD), health and social insurance (PSD, VSD), founding a company, bank accounts and accounting prices. Query in Lithuanian for the best match; diacritics and word endings do not matter (\"mokesciai\" finds \"mokesčių\"). It matches words in the title, description, summary and FAQ questions; it is not a semantic search. Returns each guide's URL, summary, checked date, status and primary sources, best match first. status is \"patikrinta\" (checked against the sources), \"atnaujinama\" (being updated) or \"hipotezė\" (a hypothesis, not confirmed). Read the full text with get_guide.",
          "inputSchema": {
