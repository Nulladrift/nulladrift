        {
          "name": "calculate_individual_activity_tax",
          "title": "Individual activity tax calculator (individualios veiklos mokesčiai)",
          "description": "Annual taxes of a self-employed person in Lithuania working under an individual activity certificate (individuali veikla pagal pažymą, IV): income tax (GPM) with its credit, and Sodra contributions (VSD, PSD). Use for \"kiek mokesčių nuo individualios veiklos pajamų\", \"IV mokesčiai\", \"GPM, VSD ir PSD nuo pajamų\". Row ids: pelnas (profit), gpm-baze (income tax base), kreditas (income tax credit), gpm (income tax), sodros-baze (contribution base), vsd (social insurance), psd-nuo-pajamu (health insurance on income), psd-minimumas (monthly health insurance minimum), psd (health insurance payable), viso (GPM + VSD + PSD).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "additional_pension": {
                "description": "true when the person pays the additional pension accumulation contribution (papildomas pensijų kaupimas). Omitted: false.",
                "type": "boolean"
              },
              "expense_method": {
                "description": "\"actual\": deduct the expenses given in `expenses` (faktinės išlaidos). \"flat_30\": deduct a flat 30 percent of income instead (30 % išlaidų). Omitted: actual.",
                "enum": ["actual", "flat_30"],
                "type": "string"
              },
              "expenses": {
                "description": "Deductible expenses for the year (leidžiami atskaitymai), without VSD and PSD: the calculator subtracts those itself. Only with expense_method \"actual\"; must not exceed income. Omitted: 0. In euros, at most 2 decimal places.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "health_insured_elsewhere": {
                "description": "true when a job or the state already covers health insurance (PSD jau dengia darbas arba valstybė): the monthly PSD minimum is then not counted, PSD on income still is. Omitted: false.",
                "type": "boolean"
              },
              "income": {
                "description": "Income from the activity for the year (pajamos). In euros, at most 2 decimal places.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "months": {
                "description": "Months of activity in the year (veiklos mėnesiai per metus); the monthly health insurance minimum is counted for each. Omitted: 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "year": {
                "description": "Tax year (metai): 2026 or 2027. Omit it to use the current year in Vilnius time, as the site's calculators do.",
                "enum": [2026, 2027],
                "type": "integer"
              }
            },
            "required": ["income"],
            "type": "object"
          },
