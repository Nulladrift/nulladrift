        {
          "name": "get_guide",
          "title": "Read a buhalteris.ai guide (gido tekstas)",
          "description": "The full text of one buhalteris.ai guide as Markdown (Lithuanian), with its canonical URL, checked and updated dates, status, primary sources and FAQ. Give the slug from search_guides (for example \"patarimai/npd-2027\"), the page URL or its .md URL. status is \"patikrinta\" (checked against the sources), \"atnaujinama\" (being updated) or \"hipotezė\" (a hypothesis, not confirmed). A few guides are built from data components; for those `body` is null, `bodyNote` says why, and the rendered text is at `markdownUrl`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
