        {
          "name": "calculate_salary",
          "title": "Salary calculator (atlyginimo skaičiuoklė)",
          "description": "Lithuanian employment salary (darbo užmokestis pagal darbo sutartį): from gross (bruto, \"ant popieriaus\") to net (į rankas) or from net to gross, with income tax (GPM), the tax-free amount (NPD), employee and employer Sodra contributions (VSD, PSD) and the total cost to the employer (darbo vietos kaina). Use for \"kiek į rankas nuo bruto\", \"kiek kainuoja darbuotojas\", \"alga ant popieriaus\". Not for payouts to a member of a small partnership (MB narys). Row ids: bruto (gross), npd (tax-free amount applied), gpm (income tax), pensija, liga, motinyste, psd, kaupimas (employee contributions), darbuotojo-imokos (employee contributions total), i-rankas (net pay), nedarbas, nelaimingi, garantinis, ilgalaikis (employer contributions), darbdavio-imokos (employer contributions total), grindys-darbuotojo and grindys-darbdavio (minimum-contribution top-up, only below the minimum wage), darbo-vietos-kaina (total employer cost).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "additional_pension": {
                "description": "true when the employee pays the additional pension accumulation contribution (papildomas pensijų kaupimas). Omitted: false.",
                "type": "boolean"
              },
              "amount": {
                "description": "Monthly salary: gross or net, as `direction` says. In euros, at most 2 decimal places.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "contract": {
                "description": "Employment contract type: open_ended (neterminuota) or fixed_term (terminuota). It changes the employer's unemployment insurance rate. Omitted: open_ended.",
                "enum": ["open_ended", "fixed_term"],
                "type": "string"
              },
              "direction": {
                "description": "\"gross\": amount is the gross salary (bruto), compute net. \"net\": amount is the net pay (į rankas), compute gross.",
                "enum": ["gross", "net"],
                "type": "string"
              },
              "minimum_floor_waived": {
                "description": "true when the minimum-contribution floor (Sodros įmokų „grindys“) does not apply this month. The site lists the cases: another job, a pension, age under 24, 0–55 percent work capacity, or a maternity, paternity or childcare benefit. It matters only below the minimum monthly wage (MMA). Omitted: false.",
                "type": "boolean"
              },
              "year": {
                "description": "Tax year (metai): 2026 or 2027. Omit it to use the current year in Vilnius time, as the site's calculators do.",
                "enum": [2026, 2027],
                "type": "integer"
              }
            },
            "required": ["amount", "direction"],
            "type": "object"
          },
