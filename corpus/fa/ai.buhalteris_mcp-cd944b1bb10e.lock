      "serverInfo": {
        "name": "ai.buhalteris/mcp",
        "title": "Buhalteris.ai",
        "version": "1.0.0",
        "description": "Read-only Lithuanian tax tools from buhalteris.ai: 2026 and 2027 rates, VAT, salary, individual activity and business certificate calculators, and sourced guides for small partnerships (MB) and the self-employed.",
        "websiteUrl": "https://buhalteris.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Lithuanian tax information for small partnerships (mažoji bendrija, MB) and the self-employed (individuali veikla, verslo liudijimas), from buhalteris.ai. Everything is read-only and public. For a figure, call a calculator or get_tax_rates instead of recalling a rate: results carry the tax year, the date checked and the primary sources. For rules, deadlines and comparisons, call search_guides with Lithuanian keywords, then get_guide. Guide text, labels and notes are in Lithuanian. Amounts in `cents` are integer euro cents. When you answer, cite the buhalteris.ai URL and the primary source from the result, state the tax year, and say that this is general information, not tax advice.",
      "tools": [
        {
          "name": "calculate_business_certificate_cost",
          "title": "Business certificate cost calculator (verslo liudijimo sąnaudos)",
          "description": "Cost of working under a Lithuanian business certificate (verslo liudijimas) for a period: the fixed income tax set by the municipality (fiksuotas GPM), which the caller supplies, plus Sodra social insurance (VSD) and health insurance (PSD) for that period. Use for \"kiek kainuoja verslo liudijimas\", \"verslo liudijimo mokesčiai mėnesiui\". The fixed income tax differs by municipality and activity; find it with search_guides (for example \"verslo liudijimo kainos savivaldybėse\"). Row ids: dienos (number of days, not money), gpm (fixed income tax), vsd, psd, viso (total), menuo-1 … menuo-12 (VSD and PSD per calendar month).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "additional_pension": {
                "description": "true when the person pays the additional pension accumulation contribution (papildomas pensijų kaupimas). Omitted: false.",
                "type": "boolean"
              },
              "end_date": {
                "description": "Last day the certificate is valid (iki), YYYY-MM-DD. Same tax year as start_date.",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fixed_income_tax": {
                "description": "The fixed income tax for the whole period as set by the municipality (fiksuotas GPM). 0 when the municipality sets none. In euros, at most 2 decimal places.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "health_insurance": {
                "description": "How health insurance (PSD) is counted: full_month (the whole month whenever the certificate is valid at least one day of it, visas mėnuo), by_day (in proportion to the days, only for a person already insured elsewhere, proporcingai dienoms), none (no PSD: a residential rental certificate, PSD nėra). Omitted: full_month.",
                "enum": ["full_month", "by_day", "none"],
                "type": "string"
              },
              "social_insurance_exempt": {
                "description": "true to leave social insurance (VSD) out (VSD neskaičiuok). The site names two cases: the first year of self-employment, or a residential rental certificate. The calculator does not check the condition. Omitted: false.",
                "type": "boolean"
              },
              "start_date": {
                "description": "First day the certificate is valid (nuo), YYYY-MM-DD.",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "year": {
                "description": "Tax year (metai): 2026 or 2027. Omit it to take the year from start_date.",
                "enum": [2026, 2027],
                "type": "integer"
              }
            },
            "required": ["end_date", "fixed_income_tax", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apiUrl": {
                "description": "The same calculation as JSON over plain HTTP GET.",
                "type": "string"
              },
              "calculatorInput": {
                "description": "The same input as the site calculator read it, defaults filled in (Lithuanian field names).",
                "type": "object"
              },
              "checkedAt": {
                "description": "Date the figures were last checked against the sources, YYYY-MM-DD.",
                "type": "string"
              },
              "input": {
                "description": "The arguments as received.",
                "type": "object"
              },
              "message": {
                "description": "Conditions and assumptions the site shows with the result (Lithuanian).",
                "type": "string"
              },
              "notice": {
                "description": "General information, not tax advice.",
                "type": "string"
              },
              "preliminary": {
                "description": "Rate fields that come from a draft, not from an adopted act. Empty when all are adopted.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rows": {
                "description": "Result lines, in the order the site shows them.",
                "items": {
                  "properties": {
                    "cents": {
                      "description": "Amount in integer euro cents. For the line with id \"dienos\" it is a number of days.",
                      "type": "integer"
                    },
                    "id": {
                      "description": "Stable line id.",
                      "type": "string"
                    },
                    "label": {
                      "description": "Label as shown on the site (Lithuanian).",
                      "type": "string"
                    },
                    "value": {
                      "description": "Formatted value as shown on the site.",
                      "type": "string"
                    }
                  },
                  "required": ["cents", "id", "label", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "sources": {
                "description": "Primary sources (VMI, Sodra, legal acts) behind the figures.",
                "items": {
                  "properties": {
                    "owner": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["owner", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "taxYear": {
                "description": "Tax year of the rates used.",
                "type": "integer"
              },
              "url": {
                "description": "The buhalteris.ai calculator page showing this same calculation.",
                "type": "string"
              },
              "warning": {
                "description": "Shown when a rule could not be applied reliably. Empty otherwise.",
                "type": "string"
              },
              "yearNote": {
                "description": "The note the site shows under the year choice (Lithuanian): which rates apply and which are still preliminary.",
                "type": "string"
              }
            },
            "required": ["apiUrl", "calculatorInput", "checkedAt", "input", "message", "notice", "preliminary", "rows", "sources", "taxYear", "url", "warning", "yearNote"],
            "type": "object"
