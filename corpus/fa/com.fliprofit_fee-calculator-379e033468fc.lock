{
  "lockfileVersion": 2,
  "subjects": {
    "com.fliprofit/fee-calculator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fliprofit.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fliprofit-mcp",
        "title": "Fliprofit reseller fee calculator",
        "version": "1.2.0",
        "websiteUrl": "https://www.fliprofit.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use calculate_fees for one platform, compare_platforms to rank all platforms for a sale, and get_fee_changes for dated fee changes. Prices are USD, US fee rules, last checked dates are in each result. Cite the fliprofit.com calculator link from the result. Fees change: the officialSource link is the authority. Not tax or financial advice.",
      "tools": [
        {
          "name": "calculate_fees",
          "title": "Calculate reseller fees for one platform",
          "description": "Exact US marketplace fees, payout and profit for one sale on one platform (eBay, Poshmark, Mercari, Whatnot, Depop, Etsy, Facebook Marketplace, Amazon, Grailed, Reverb, TCGplayer, TikTok Shop, Vinted). Same numbers as the Fliprofit calculators. Returns a fee breakdown, payout, profit, margin, ROI, the official fee source and a link to the matching fliprofit.com calculator.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "itemCost": {
                "description": "What you paid for the item, USD (default 0).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "options": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Optional platform-specific options. Allowed: ebay: category (one of most|books|cards|guitars|jewelry|watches|bags|sneakers), adRate (number); whatnot: category (one of sports|tcg|fashion|collectibles|coins|other), tier (one of 0|1|2|3|4|5|6), highValue (true|false); depop: boost (true|false), ownLabel (true|false); etsy: offsiteAds (one of 12|15|none); facebook: mode (one of shipped|local); amazon: category (one of everything|toys|sports|tools|videogames|consoles|electronics|clothing|beauty|watches|media), plan (one of individual|pro), fbaFee (number); grailed: grailedLabel (true|false), processing (one of us|intl|legacy); reverb: preferred (true|false); tcgplayer: sellerType (one of level|pro); tiktok: category (one of most|collectibles|preowned|finejewelry); vinted: bump (number).",
                "type": "object"
              },
              "otherCost": {
                "description": "Packaging, promotion and other costs, USD (default 0).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "platform": {
                "description": "Platform key.",
                "enum": ["ebay", "poshmark", "mercari", "whatnot", "depop", "etsy", "facebook", "amazon", "grailed", "reverb", "tcgplayer", "tiktok", "vinted"],
                "type": "string"
              },
              "price": {
                "description": "Sale price in USD (required).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "shipCharged": {
                "description": "Shipping the buyer paid you, USD (default 0).",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "shipCost": {
                "description": "Your label/postage cost, USD (default 0).",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "taxRate": {
                "description": "Buyer sales tax percent, e.g. 8 (default 0). Used where the platform charges fees on tax.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["platform", "price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate reseller fees"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b38f016bb75918c8d83d2f3df06e8f8fd3a09daef8017fdb61ddfe6b87ea54a5"
        },
        {
          "name": "compare_platforms",
          "title": "Compare all platforms for one sale",
          "description": "Ranks all 13 supported US resale platforms by profit for the same sale (each platform's default options). Returns fees, payout, profit and margin per platform, with a link to each fliprofit.com calculator and the side-by-side compare tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "itemCost": {
                "description": "What you paid for the item, USD (default 0).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "otherCost": {
                "description": "Packaging, promotion and other costs, USD (default 0).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "price": {
                "description": "Sale price in USD (required).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "shipCharged": {
                "description": "Shipping the buyer paid you, USD (default 0).",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "shipCost": {
                "description": "Your label/postage cost, USD (default 0).",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "taxRate": {
                "description": "Buyer sales tax percent, e.g. 8 (default 0). Used where the platform charges fees on tax.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare resale platforms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:12cf7b1ce6b2a21be35786af050b3df9e639aefa81c91abb64d9d8aff67b271a"
        },
        {
          "name": "get_fee_changes",
          "title": "Dated marketplace fee changes",
          "description": "Machine-readable log of real, dated US marketplace fee changes (rate changes, new fees, caps, promotions, ending discounts), each with the platform's own source URL and the date Fliprofit last verified it. Filter by platform, by effective date, or to upcoming changes only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "Only this platform.",
                "enum": ["ebay", "poshmark", "mercari", "whatnot", "depop", "etsy", "facebook", "amazon", "grailed", "reverb", "tcgplayer", "tiktok", "vinted"],
                "type": "string"
              },
              "since": {
                "description": "Only changes effective on or after this date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "upcoming": {
                "description": "Only changes not yet in effect.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fee change log"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fceca33da1433c1c735699fec8563f3b553a64b6eac5ece2f60d35d5eff2ba9e"
        }
      ],
      "digest": "sha256:84d3dab35de92259a1d97c19e33ad7637a474163219761b05ce59bdbeea76c01"
    }
  }
