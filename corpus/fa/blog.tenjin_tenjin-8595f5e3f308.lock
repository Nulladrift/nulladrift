              },
              "shelf": {
                "description": "Resolve against one shelf instead of the public marketplace, named `<org>/<shelf>` (e.g. `backtrack/backtrack`). Requires a signature: unsigned or badly signed is 401, and a shelf your wallet cannot reach is 404, identical to one that does not exist. The envelope is unchanged; only the corpus moves.",
                "pattern": "^[a-z0-9-]{2,32}\\/[a-z0-9-]{2,32}$",
