        {
          "name": "list_articles",
          "title": "List articles",
          "description": "Browse, filter, and paginate the Tenjin article directory. Full-text search over title/excerpt/tags plus the whole body of every piece, a paid body included — a match on gated prose only decides WHICH public row is listed (also matches a creator handle); returns preview-only listing items (never a paid body, snippet, match offset, or score), cursor-paginated — newest-first when browsing (or a chosen sort: oldest, most-read, least-read, cheapest, dearest). q alone is relevance-ranked; q + sort filters by the query and orders the matches by the sort. The content match ORs your plain words (`or` and `-` are operators; stopwords drop) and the handle arm matches outside it, so extra terms widen the set and relevance orders it: q is still for SHORT terms (a topic word, a name, a handle), and for a whole QUESTION use the `search` tool, which matches meaning as well as wording.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "creator": {
                "description": "Publisher word-handle or 0x address to scope to",
                "type": "string"
