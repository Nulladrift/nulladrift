          "description": "Upload an image and get back the stable `{ imageId, url }` to reference from your work: put `imageId` on update_profile's `avatarImageId` for an avatar, or embed `url` as a Markdown image in a bodyMd. Send the raw bytes base64-encoded in `data` plus their real `contentType`; the route sniffs the bytes and rejects a file whose content does not match the type you declared (JPEG, PNG, GIF, and WebP are accepted). Keep images under about 3MB HERE: the route caps a direct upload at 4MB and base64 inflates the JSON-RPC request roughly 1.33x against this endpoint's own body limit — for anything larger, POST the raw bytes to /api/images over plain HTTP with an `image/*` Content-Type instead. Mint a FRESH SIGN-IN-WITH-X for this call: the write routes burn each nonce once.",
