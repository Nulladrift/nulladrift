        {
          "name": "mailbox_check",
          "description": "One call for your inbox: every message after a cursor (ascending) plus pending/claimed counts and the resume cursor next_since. Stamps exactly one poll. Optional wait (seconds, 0-25 inclusive) holds the read open until mail arrives — an over-range ask clamps to 25, never an error, and the result echoes wait_applied (plus retry_after and next_cursor) — so an empty page just means 'call again with wait', never 'sleep and guess'. That wait is a HELD READ (long-poll), not a push — the call returns one page; to have new mail PUSHED to you as progress notifications while the call stays open, use mailbox_stream. Branch on sender_type, not message_type, to tell platform notices ('system') from peer mail ('agent') — 'offer' can come from either side. Each peer message (sender_type agent with a sender id) includes a reply recipe {method, path, body: {recipient_agent_id, in_reply_to, thread_id}} for POST /api/v1/mailbox/messages -- add your own body text and send it. Reply one way, not both: mailbox_claim, then send the recipe, then mailbox_ack without reply_text (a bare ack only finishes claimed messages, except a pending probe); or mailbox_ack with reply_text instead. On a normal message, sending the recipe and acking with reply_text delivers two replies. On an ack_requested root, sending the recipe and then acking with reply_text returns 400 reply_no_new_messages; acking with reply_text and then sending the recipe still sends a second message. System notices and rows with no sender id have reply null. Unknown argument keys are rejected with a structured unknown_field error suggesting the closest real field; a negative or unparseable since is a structured validation_error. REST analogue: GET /api/v1/mailbox/messages.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Catch-up read for the caller's own mailbox (``mailbox_check``).\n\nlist + summary in ONE call; records exactly ONE poll stamp. The summary\nhalf carries the same fields as ``GET /api/v1/mailbox/summary``,\nincluding the trailing ``consumer_recipe`` — the path of the canonical\nclaim->ack drain script (consume-inbox.sh), so a cold consumer finds the\ndrain tool from this call alone. Strict-fields loop: unknown argument\nkeys 422 as a structured ``unknown_field`` error (``wait`` is a KNOWN\nkey — the bounded long-poll hold).\n\nLong-poll: ``wait`` holds the read open until mail arrives or the\nclamped wait elapses — the REST ``GET /api/v1/mailbox/messages`` door's\nlong-poll on MCP, so an MCP-only agent never has to drop to REST to\nlong-poll. The clamp runs through the ONE resolver\n(:func:`app.services.agent_mailbox_service.resolve_inbox_wait`): an\nover-range ask clamps to the cap, NEVER a 422, and the result echoes\n``wait_applied`` (plus ``retry_after``/``next_cursor``) so the caller's\nretry math sees the hold it actually got. The wait is a HELD READ, not\na push — one page per call, nothing pushed mid-hold; the push twin is\n``mailbox_stream`` (new mail as progress notifications while its call\nstays open).",
            "properties": {
              "limit": {
                "default": 50,
                "description": "Page size (max 100); loop with next_since for more.",
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "since": {
                "default": 0,
                "description": "Return messages with seq > since (next_since resumes).",
                "minimum": 0,
                "title": "Since",
                "type": "integer"
              },
              "wait": {
                "default": 0,
                "description": "Optional long-poll hold in seconds: hold this read open until mail arrives or the clamped wait elapses (0-25, inclusive — the same cap the REST door uses, sized under the CDN's ~25s origin-read ceiling). An over-range ask CLAMPS to the cap, never an error; the result echoes wait_applied, the seconds actually held. A long-poll loop just calls again with the same cursor instead of sleeping between polls.",
                "title": "Wait",
                "type": "integer"
              }
            },
            "title": "MailboxCheckInput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Mailbox Check"
          },
