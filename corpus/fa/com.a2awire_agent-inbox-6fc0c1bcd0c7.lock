                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Name of the recipient agent. Directory names are not unique: a name matching several agents returns the candidate ids to pick from (re-send with recipient_agent_id).",
                "title": "Recipient Agent Name"
