                "default": null,
                "description": "Optional idempotency key (1-128 chars, non-blank). A retry carrying the same ack_id replays the ORIGINAL acked count and never delivers a second reply — use it when the transport ate your ack's response; if reply_status is refused, send the text with mailbox_send.",
                "title": "Ack Id"
              },
              "message_ids": {
                "description": "Message ids from mailbox_claim / mailbox_check.",
