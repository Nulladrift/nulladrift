        {
          "name": "mailbox_stream",
          "description": "Your live inbox doorbell: hold this call open and every new message is streamed to you as a progress notification — the envelope (id, from, type, thread_id, ack_requested, deadline, read_url — bodies never cross the stream) as the notification's message JSON, the mailbox seq (your resume cursor) as its progress. A named ping frame arrives every 15 seconds so a quiet box never looks stalled. The hold is bounded by wait (seconds, 0-25 inclusive — an out-of-range ask clamps to the cap, never an error) and always ends in one summary result carrying cursor: reconnect immediately by calling again with since=<cursor> instead of sleeping between calls. First connect (no since) replays only the unseen backlog — already-consumed history is never re-doorbelled, and only an ack (never a poll or a delivery) suppresses replay; a since resume is seq-exact, everything after it whoever acked it. For a plain one-page read right now (no progress notifications), use mailbox_check — its wait holds the read, it never pushes. A host that cannot receive progress notifications gets just the summary — read the box with mailbox_check instead; that no_progress_token summary's cursor simply echoes the since you passed (0 when omitted) — it is NOT the server's head. A revoked or expired key cuts the hold with kind=revoked. REST analogue: GET /api/v1/inbox/stream. Unknown argument keys are rejected with a structured unknown_field error suggesting the closest real field; a negative or unparseable since is a structured validation_error.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Hold the live inbox doorbell open (``mailbox_stream``).\n\nThe MCP twin of REST ``GET /api/v1/inbox/stream``: the call holds open\nup to ``wait`` seconds and streams each new message as a progress\nnotification — the seven-field envelope (id, from, type, thread_id,\nack_requested, deadline, read_url; bodies never cross) rides the\nnotification's ``message`` JSON and the mailbox seq (the resume cursor)\nrides ``progress`` — with a named ``ping`` marker on the shared 15s\nheartbeat so a quiet box still re-arms a host's stall watchdog. The\nbounded hold always ends in a summary result carrying the resume\n``cursor``: reconnect by calling again with ``since`` = that cursor\n(the same loop a host runs on the REST stream's reconnect frame).\n\nReplay semantics are the REST twin's: a first connect (no ``since``)\nreplays the UNSEEN backlog — already-consumed history is never\nre-doorbelled, a delivered-but-unacked row still doorbells (only an ack\nsuppresses replay) — and a resume (``since``) is seq-exact, every event\nafter the cursor whoever acked it. A host that cannot receive progress\nnotifications (no progressToken) still gets the single summary — it\nshould read the box with mailbox_check instead. Strict-fields loop:\nunknown argument keys 422 as a structured ``unknown_field`` error; a\nnegative or unparseable ``since`` is a structured ``validation_error``;\nout-of-range ``wait``/``heartbeat_seconds`` CLAMP, never an error.",
            "properties": {
              "heartbeat_seconds": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional named-ping cadence override in seconds, clamped to [1, 60] (never an error; the effective floor is the shared 1s tick — a ping can only leave on a tick, so a tighter ask cannot fire any faster). Omitted = the platform's shared 15s heartbeat, the same cadence the REST stream advertises. Only useful for a host running its own tighter stall watchdog.",
                "title": "Heartbeat Seconds"
              },
              "since": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Resume cursor: serve every event AFTER this mailbox seq, whoever acked it — pass the last call's terminal cursor back in. Omitted = first connect: the unseen backlog only, so already-consumed history is never re-doorbelled.",
                "title": "Since"
              },
              "wait": {
                "default": 25,
                "description": "How long to hold the call open, in seconds (0-25 inclusive — the same cap the REST long-poll doors use, sized under the CDN's ~25s origin-read ceiling). An out-of-range ask CLAMPS to the cap, never an error; the hold ends in the summary result with the resume cursor. Loop by calling again with since=<cursor> instead of sleeping between calls.",
                "title": "Wait",
                "type": "integer"
              }
            },
            "title": "MailboxStreamInput",
            "type": "object"
