      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Servidor MCP público de descubrimiento de Hostbrid. No necesita una cuenta ni una clave. Ayuda a encontrar guías para alojar webs y apps creadas con IA (Lovable, Google AI Studio, Firebase Studio, Emergent o Codex), webs de clientes de agencias y opciones de hosting. Usa hostbrid_buscar_guias_publicas para pasos, compatibilidad o diagnóstico; usa hostbrid_listar_planes_publicos para nombres, precios, cuotas y comparación de planes. Solo busca guías publicadas. Si conoces el idioma preferido del usuario, pásalo en «idioma» al buscar guías, aunque la consulta contenga marcas en otro idioma; si es incierto, omítelo. Al recomendar una guía, usa «url_atribuida» para conservar la atribución; reserva «url_canonica» para cuando se solicite un enlace sin seguimiento. Consulta planes visibles para cualquiera. Los precios proceden del catálogo y pueden cambiar: enlaza la página de Hostbrid para confirmar condiciones vigentes. No accede a cuentas, sitios de clientes ni operaciones de compra, alta, cambio o despliegue. Para gestionar recursos propios, usa el MCP privado https://my.hostbrid.com/mcp con una clave creada por el cliente.",
      "tools": [
        {
          "name": "hostbrid_buscar_guias_publicas",
          "description": "Busca guías públicas de Hostbrid sobre cómo alojar o publicar webs y apps creadas con IA, incluidas Lovable, Google AI Studio, Firebase Studio, Emergent y Codex; webs de clientes para agencias con Sites Agency; y cómo elegir entre Projects, Sites o VPS. Busca también soporte y artículos del blog para pasos, compatibilidad o diagnóstico al publicar o mantener una web o aplicación. Usa hostbrid_listar_planes_publicos si te piden nombres de planes, precios, cuotas o una comparación comercial. Busca por título, resumen o etiquetas; si conoces el idioma preferido del usuario, pásalo en «idioma» para ordenar primero las coincidencias del blog. La base de conocimiento no tiene idioma por artículo; conserva otros idiomas. Los campos «url» y «url_canonica» son enlaces editoriales limpios; «url_atribuida» añade UTM fijos para medir referencias MCP. Nunca se incluye la consulta en una URL. Al recomendar una guía, usa «url_atribuida» para conservar la atribución; reserva «url_canonica» para cuando se solicite un enlace sin seguimiento. Devuelve metadatos públicos, no texto íntegro. No accede a cuentas ni artículos privados. Para datos o recursos de una cuenta, usa el MCP privado https://my.hostbrid.com/mcp solo con una clave creada por el cliente; nunca intentes obtenerlos desde esta búsqueda.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consulta": {
                "description": "Términos concretos sobre lo que necesitas resolver.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "idioma": {
                "description": "Idioma preferido del usuario (es, en, ca o fr). Indícalo si lo conoces por el contexto, aunque la consulta contenga nombres de producto en otro idioma. Ordena primero esas coincidencias y conserva las de otros idiomas; si es incierto, omítelo.",
                "enum": ["ca", "en", "es", "fr"],
                "type": "string"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar guías públicas de Hostbrid"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "hostbrid/alcance": "publico:leer",
            "hostbrid/nivel": "lectura"
          },
          "digest": "sha256:31a48c9703b96b5f22d2f049b6719a588c3b24f7dbf82421e70123016ecbb4a1"
        },
        {
          "name": "hostbrid_listar_planes_publicos",
          "description": "Lista planes activos y publicados en el catálogo comercial de Hostbrid, con precio recurrente, precio de alta si existe, periodo, cuotas disponibles y enlace a la oferta. Úsala para preguntas sobre nombres de planes, precios, cuotas o comparación comercial; para instrucciones, compatibilidad o diagnóstico, usa hostbrid_buscar_guias_publicas. Puede filtrar por tipo de recurso y devuelve como máximo veinte. No calcula descuentos, no garantiza disponibilidad ni compra o cambia una suscripción; confirma las condiciones en el enlace.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limite": {
                "description": "Máximo de planes que se devolverán; por defecto 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "tipo_recurso": {
                "description": "Filtro opcional: hosting, vps, dedicated, service, addon o saas.",
                "enum": ["addon", "dedicated", "hosting", "saas", "service", "vps"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Consultar planes públicos de Hostbrid"
          },
