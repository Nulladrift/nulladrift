        {
          "name": "check_item_availability",
          "title": "Check item availability",
          "description": "Check whether an item is currently available: status, who holds it, where it is, how many tickets are open on it, how many of its maintenance checks are overdue and how many active orders request it. Status defect or in_repair, an open ticket other than a maintenance check that is not yet due, overdueMaintenance > 0 or requestedInOrders > 0 each make assign_item answer requiresAcknowledgment when it sets a holder. For quantity-tracked items the result also carries totalQuantity and distribution: one row per stocked level, locations AND people holding stock, with { locationId, name, kind: location|person, quantity, available, reserved?, minStock?, isLow? }, the same row shape transfer_stock and adjust_stock return after a write. available = quantity minus what active orders reserved, floored at 0; isLow compares AVAILABLE against that level's threshold, so a full shelf with heavy reservations IS low. minStock and isLow appear together and only where a threshold exists: an absent isLow means no threshold is set there, not that the level is healthy. reserved is absent when 0; person rows carry neither (orders deliver to places, and person-held stock cannot carry a threshold). locationId is the id adjust_stock, set_min_stock and transfer_stock take. Units inside containers (a bag, a vehicle compartment) are not in distribution: they come under packed, one row per container and compartment { containerId, containerName, containerPath?, compartmentName?, quantity, effectiveLocationName?, effectiveHolderName? } (absent when none), and totalQuantity counts them. Packed units are moved in the app's stock section; transfer_stock and adjust_stock work on places and people only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "itemId": {
                "description": "Item id",
                "type": "string"
              }
            },
            "required": ["itemId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "available": {
                "description": "Status available AND nobody currently holds it",
                "type": "boolean"
              },
              "currentHolderName": {
                "description": "Who holds it now",
                "type": "string"
              },
              "currentLocationName": {
                "description": "Where it is now",
                "type": "string"
              },
              "distribution": {
                "description": "Per-holder stock — quantity-tracked items only. One row per stocked level, locations AND people, each carrying its resource id so no search_resources lookup is needed.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "available": {
                      "description": "Freely usable stock: quantity minus reserved, floored at 0. Always present",
                      "type": "number"
                    },
                    "isLow": {
                      "description": "True when available < minStock. Present only alongside minStock — absent means no threshold is set here, NOT that the level is healthy",
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "\"location\" or \"person\" (a person holding pool stock)",
                      "type": "string"
                    },
                    "locationId": {
                      "description": "Resource id of this place — pass it straight to adjust_stock, set_min_stock or transfer_stock (no search_resources round-trip needed)",
                      "type": "string"
                    },
                    "locationName": {
                      "description": "DEPRECATED — the same string as `name`, kept only for clients whose tool list froze before the rename",
                      "type": "string"
                    },
                    "minStock": {
                      "description": "Restock threshold here (absent when none is set)",
                      "type": "number"
                    },
                    "name": {
                      "description": "Location or person name",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Physical stock on hand here",
                      "type": "number"
                    },
                    "reserved": {
                      "description": "Of that, promised to active orders (absent when 0)",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "itemId": {
                "description": "Item id",
                "type": "string"
              },
              "name": {
                "description": "Item name",
                "type": "string"
              },
              "openTickets": {
                "description": "Open tickets on this item",
                "type": "number"
              },
              "overdueMaintenance": {
                "description": "Overdue maintenance checks; with any, assign_item answers requiresAcknowledgment when it sets a holder",
                "type": "number"
              },
              "packed": {
                "description": "Units inside containers (a bag, a vehicle compartment) — quantity-tracked items only, absent when none. Not in distribution; their place follows the container",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "compartmentName": {
                      "description": "The compartment of the container these units sit in (absent = directly in the container)",
                      "type": "string"
                    },
                    "containerId": {
                      "description": "Item id of the container holding these units",
                      "type": "string"
                    },
                    "containerName": {
                      "description": "Container name",
                      "type": "string"
                    },
                    "containerPath": {
                      "description": "Names of the containers this container sits in, outermost first, each followed by the compartment the next one sits in (absent when none)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "effectiveHolderName": {
                      "description": "Who has the container now, followed through its containers",
                      "type": "string"
                    },
                    "effectiveLocationName": {
                      "description": "Where the container is now, followed through its containers",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Units inside this container",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "requestedInOrders": {
                "description": "Active orders that requested this item but have not picked it",
                "type": "number"
              },
              "status": {
                "description": "Condition (see search_items)",
                "type": "string"
              },
              "totalQuantity": {
                "description": "Pool total — quantity-tracked items only. Counts places, people AND units inside containers",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check item availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7c3b52d283a1d619261437fde860b614ea3afd70b2a556bea7e0bc8ecef0d3c3"
        },
        {
          "name": "create_account",
          "title": "Create an account",
          "description": "Create a Mango Inventory account in the user's name. Works without an account. Needs the user's name, email address and organization name; language, organization type and currency are optional. Mango Inventory sends ONE email to the address; its button confirms the address and signs the user in. The call returns no password, key or link. Once the address is confirmed, any account tool (for example get_setup_status) brings up the client's normal sign-in step (in Claude Code: /mcp), and after it every tool works. Until the button is pressed nothing can be done in the account, and an account that is never confirmed does nothing. The answer is the same whether or not the address already had an account; a refusal names its reason (invalid or disposable address, a domain that receives no mail, an invalid name, a rate limit). Idempotent: a repeat for the same address creates no second account. On a signed-in connection it answers signedIn and creates nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "Their currency, if known: chf (default), eur, gbp or usd.",
                "enum": ["chf", "eur", "gbp", "usd"],
                "type": "string"
              },
              "email": {
                "description": "The user's email address, as given.",
                "maxLength": 254,
                "minLength": 3,
                "type": "string"
              },
              "language": {
                "description": "Their language for the email and the app: en (default), de, fr, it or es.",
                "enum": ["en", "de", "fr", "it", "es"],
                "type": "string"
              },
              "name": {
                "description": "The user's name, as given. Up to 100 characters.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "orgName": {
                "description": "The organization's name, as given. Up to 100 characters.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "orgType": {
                "description": "The kind of organization, if known (as in check_fit).",
                "enum": ["school", "company", "publicAdmin", "publicWorks", "club", "other"],
                "type": "string"
              }
            },
            "required": ["email", "name", "orgName"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "next": {
                "description": "What happened and the next step",
                "type": "string"
              },
              "refused": {
                "type": "string"
              },
              "status": {
                "description": "accepted · refused · signedIn",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
