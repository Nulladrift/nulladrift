          "name": "plan_import",
          "title": "Plan an import (dry run)",
          "description": "Dry-run an import of a whole list with the product's own importer (the same one the app's import screen uses); it writes NOTHING. Arguments: the data rows (cells as strings, header row left out) and one `columns` entry per cell position with its target: name, description, category, homeLocation, currentLocation, responsiblePerson, currentHolder, blueprintName (an item model, by name), container (the item this row's item sits in: a vehicle, case or cart, named by the name or code of ANOTHER ROW of this file or of an existing item; a vehicle is an item with its own row, never a location), compartment (its compartment, e.g. «GR1», «Fahrerhaus»; created on the container when missing), code (a printed code or serial, the lasting way to tell identical pieces apart), quantity / minStock (stock items), trackingMode (quantity, menge, stückzahl, stueckzahl, bestand, pool (stock: a count of identical pieces) or serialized, serialisiert, einzeln, einzelstück, einzelstueck, unit (single pieces); a quantity or minStock value alone already makes a stock item), status, a fieldDefId from get_item_requirements or \"field:<label>\"; null skips a column. Categories and locations are matched by name, paths split by `separator` (\"Fahrzeuge/Anhänger\"); a name that matches nothing is listed under toCreate and would be created by the import itself (a typo shows up there too). scaffold_categories creates categories and typed fields beforehand, scaffold_models item models. Dates as \"YYYY-MM-DD\" or \"DD.MM.YYYY\" only: other forms are dropped (see problems). Rows without a code are matched to existing items BY NAME, so every code-less name must be unique in the file, one stock article in several places aside (e.g. «Helm TLF», «Helm KLF» for two helmets). Single items are packed into their container; a stock row's count goes into it. One stock article in several places: one row per place, all with the SAME name (and the same code, if it has one), each with its own container, compartment and count; at most one of them without a container, whose count is the stock at the item's home. They become ONE stock item: the dry run shows the row without a container (else the first) as create and the others as place, and lists each article's places and total under stockGroups. Identical single pieces are not grouped: each needs its own name or code. The result says per row what would be created, updated or skipped, every value that would be dropped and why, what would be placed in which container and compartment and which compartments would be created, blockers that must be fixed first, columns the organization's plan cannot import, and whether the import lands past the plan's item allowance (allowed once: after that no published item can be added until the organization upgrades). It returns a planHash, which run_import takes with the same arguments. At most 1000 rows per call; the app's import screen takes longer lists as a CSV file. entity \"persons\" or \"locations\" imports people or places instead (targets: name, parentPath, email). Any member can plan; running needs the manager role.",
