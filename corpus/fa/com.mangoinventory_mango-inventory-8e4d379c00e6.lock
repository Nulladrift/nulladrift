              "orders": {
                "description": "The orders, active first",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "assigneeName": {
                      "description": "Who handles it",
                      "type": "string"
                    },
                    "closedAt": {
                      "description": "Epoch milliseconds",
                      "type": "number"
                    },
                    "closedAtIso": {
                      "description": "When the order was closed, ISO-8601 UTC timestamp",
