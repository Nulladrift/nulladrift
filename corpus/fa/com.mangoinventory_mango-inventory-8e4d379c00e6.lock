        {
          "name": "list_activity",
          "title": "List activity",
          "description": "The organization's audit trail — the answer to \"what changed on this item?\", \"what did somebody do last week?\", \"who moved this and when?\". Newest first, one merged feed over item, ticket and order events: assignments, moves, status and category changes, renames, quantity adjustments and stock moves, pack/unpack, code attach/detach, custom-field edits, ticket transitions and checklist results, order transitions. Narrow it with `itemId` (that one item's history), `actorUserId` (one person — ids come from list_members), `sources` ([\"items\"], [\"tickets\"], [\"orders\"]) and a date window: pass `since` / `until` as calendar days (\"2026-08-01\"), `until` included. This server has no timezone and does no conversion, so a bare day is the safe form; the legacy `dateFrom` / `dateTo` epochs still work, pass exactly one of each pair. Each row is one flat sentence: `atIso` when, `actorName` who (`viaAgent: true` = they did it through an AI agent), `type` what happened, `subject` what it happened to, `field` which attribute — the org's own label for a custom field — and `from` / `to` the two ends of the change, with `amount` where a number moved. Give your user the row's `webUrl`, not the ids: those are machine handles for your follow-up calls. A row marked `featureLocked: true` belongs to a module this organization's plan does not include (maintenance, orders) — it is kept because history is a record, but it carries NO `webUrl` and there is nothing to open: say that this activity sits in a module their plan does not cover, rather than offering a link or claiming the record is missing. Ask for `limit` 20 (default, max 50) and page with `nextCursor` rather than pulling a big window at once — the trail can be long. A filtered page can come back EMPTY while `isDone` is false: the filters run after the page is cut, so an empty page means \"nothing matched HERE\", not \"nothing left\" — keep paging with `nextCursor` until `isDone` is true before telling your user there is no history. Requires the manager role: the org-wide trail is an admin surface, so tell a plain member to ask a manager instead of retrying.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "actorUserId": {
                "description": "Only this person's actions — the userId from list_members",
                "type": "string"
              },
              "cursor": {
                "description": "The `nextCursor` from a previous call — pages further back in time",
                "type": "string"
              },
              "dateFrom": {
                "description": "Lower bound as epoch milliseconds. Prefer `since` — pass exactly one of the two",
                "type": "number"
              },
              "dateTo": {
                "description": "Upper bound as epoch milliseconds. Prefer `until` — pass exactly one of the two",
                "type": "number"
              },
              "itemId": {
                "description": "Only this item's history (implies sources: [\"items\"])",
                "type": "string"
              },
              "limit": {
                "description": "Rows per page, default 20, max 50",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "since": {
                "description": "Only events from this calendar day onward, \"YYYY-MM-DD\". Prefer this over dateFrom — a bare day has no timezone to get wrong, and this server does none of that conversion for you",
                "type": "string"
              },
              "sources": {
                "description": "Which records to read events from; omit for all three",
                "items": {
                  "enum": ["items", "tickets", "orders"],
                  "type": "string"
                },
                "type": "array"
              },
              "types": {
                "description": "Only these ITEM event types — e.g. [\"assigned\", \"moved\", \"status_changed\", \"quantity_adjusted\", \"custom_field_changed\"]. An unknown value returns an error naming the whole valid set. Does not filter ticket or order rows",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "until": {
                "description": "Only events up to and INCLUDING this calendar day, \"YYYY-MM-DD\". Prefer this over dateTo",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "events": {
                "description": "The trail, newest first",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "actorName": {
                      "description": "Who did it",
                      "type": "string"
                    },
                    "amount": {
                      "description": "How many moved — stock moves and order lines",
                      "type": "number"
                    },
                    "at": {
                      "description": "Epoch milliseconds",
                      "type": "number"
                    },
                    "atIso": {
                      "description": "When it happened, ISO-8601 UTC timestamp — read THIS one; the server does no timezone conversion",
                      "type": "string"
                    },
                    "featureLocked": {
                      "description": "Present and true when this event belongs to a module the organization's plan does not include (e.g. maintenance or orders). The row is shown because history is a record, but it carries NO webUrl — tell the user this activity is in a module their plan does not include rather than offering to open it. Absent = a normal row",
                      "type": "boolean"
                    },
                    "field": {
                      "description": "Which attribute changed — the organization's own label for a custom field, the checklist line for a ticket check, the item name on an order line",
                      "type": "string"
                    },
                    "from": {
                      "description": "The value before, already rendered: a name, a status, a number, or a calendar day. Absent when there was none",
                      "type": "string"
                    },
                    "itemId": {
                      "description": "Item id — for follow-up calls",
                      "type": "string"
                    },
                    "kind": {
                      "description": "Which record the event belongs to: \"item\", \"ticket\" or \"order\"",
                      "type": "string"
                    },
                    "note": {
                      "description": "The note the actor left, when any",
                      "type": "string"
                    },
                    "orderId": {
                      "description": "Order id — for follow-up calls",
                      "type": "string"
                    },
                    "primaryCode": {
                      "description": "The item's printed asset code",
                      "type": "string"
                    },
                    "subject": {
                      "description": "What it happened to: the item or model name, the ticket title, or the order's request text. \"—\" when the record has since been deleted (the row is kept — an audit trail must not lie by omission)",
                      "type": "string"
                    },
                    "ticketId": {
                      "description": "Ticket id — for follow-up calls",
                      "type": "string"
                    },
                    "to": {
                      "description": "The value after, same rendering. Absent when it was cleared",
                      "type": "string"
                    },
                    "type": {
                      "description": "What happened: assigned | moved | status_changed | renamed | category_changed | quantity_adjusted | stock_moved | contained | removed | code_attached | custom_field_changed | ticket and order transitions | …",
                      "type": "string"
                    },
                    "viaAgent": {
                      "description": "Present and true when they did it through an AI agent. Absent = they did it themselves in the app",
                      "type": "boolean"
                    },
                    "webUrl": {
                      "description": "Link to the record in the web app — give your user THIS, never the raw ids. Absent on featureLocked rows, which have nowhere to link to",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "isDone": {
                "description": "True = this was the last page; there is nothing older to fetch. An EMPTY `events` array while this is false is normal on a filtered read — the filters are applied after the page is cut, so that page simply held no matching rows: keep paging with `nextCursor` instead of concluding there is no history",
                "type": "boolean"
              },
              "nextCursor": {
                "description": "Pass back as `cursor` for the next page further back in time. Present only while isDone is false",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b1903ef5fff11ec260bcf9dbe7036638829fefacd5eb0046ed548b3d4794ada3"
        },
        {
          "name": "list_comments",
          "title": "List comments",
          "description": "Read the comments on exactly ONE of an item, a ticket or an order — the same one-target shape add_comment takes, so reading back what you just wrote is a one-word swap. Newest first, capped at 50 (`truncated` says the cap was hit). Use it before commenting to see whether the question was already answered, to follow a handover thread on an order, and to verify your own write. Each comment carries `authorName`, the `text`, `createdAt` with its UTC ISO twin `createdAtIso` — read the ISO one; this server has no timezone and does no timezone conversion — and `editedAt` when it was changed after posting. `viaAgent: true` marks a comment that an AI agent wrote on that person's behalf — your own comments through this connection carry it; its absence means the person typed it themselves, and the distinction is worth stating when you summarize a thread. You see exactly the comments the connected user sees in the app: order comments need them to be a participant (requester, assignee or an order manager).",
