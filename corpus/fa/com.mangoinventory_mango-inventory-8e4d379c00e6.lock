            "openai/toolInvocation/invoking": "Fetching item…",
            "securitySchemes": [
              {
                "scopes": ["read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/item-card.html"
            }
          },
          "digest": "sha256:307649052f628b1026a3fb1ae3cb4130f36c9e9c41995c06dd06b40c2044bef3"
