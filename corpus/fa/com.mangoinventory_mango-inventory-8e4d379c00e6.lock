        {
          "name": "create_ticket",
          "title": "Create ticket",
          "description": "Create a defect or maintenance ticket on an item. The organization's default assignee rules apply, and the assignee is emailed straight away. setItemStatus also sets the item's condition in the same call (like the web report form, where a defect report usually marks the item \"defect\"); members may use it, unlike set_item_status. With clientRequestId a repeated call returns the existing ticket instead of a duplicate; without it every call creates a new ticket. Quantity-tracked items take no tickets (refused with quantityItem).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clientRequestId": {
                "description": "A unique id for this request (e.g. a UUID). A repeated call with the SAME id returns the existing ticket instead of creating a duplicate; a new id creates a new ticket.",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "itemId": {
                "description": "Item id",
                "type": "string"
              },
              "priority": {
                "enum": ["low", "normal", "high"],
                "type": "string"
              },
              "setItemStatus": {
                "description": "Also set the item's condition in the same operation; absent = the item status stays unchanged. set_item_status covers the other status changes.",
                "enum": ["defect", "in_repair"],
                "type": "string"
              },
              "title": {
                "description": "Short ticket title",
                "type": "string"
