              "language": {
                "description": "Language of the help-page links: en (default), de, fr, it or es.",
                "enum": ["en", "de", "fr", "it", "es"],
                "type": "string"
              },
              "needs": {
                "description": "The needs, as keys from this list (keys of things that are not built are valid; the answer says which are not): items_fields = Items with categories and their own fields; item_models = Item models: many pieces of one article, with sizes or variants; qr_labels_scanning = Printable QR labels and scanning with the phone; checkout_return = Check-out and return to people, places or teams; people_places = People, rooms, buildings, sites and teams; containers = Containers: vehicles, cases, carts and their contents; kit_lists = Kit lists: what belongs in a vehicle, case or bag; quantities_stock = Consumables and stock counted in quantities, with minimum levels; orders_reservations = Orders and reservations: people request items, someone hands them out; defects_tickets = Defect reports and tickets; maintenance_inspections = Maintenance and safety inspections on a schedule, with checklists; stocktaking = Stocktaking: counting everything by scan; history = History: who had what, and when; receipt_confirmation = Receipt confirmation: the person confirms they received an item; import_export = Import from Excel or CSV, export to Excel, CSV or a ZIP; single_sign_on = Single sign-on with Microsoft or Google; directory_sync = Directory sync: people and groups from Microsoft Entra or Google Workspace; roles_permissions = Fine-grained roles and field visibility for larger teams; mobile_app = An app for the phone; notifications = Notifications by email and on the phone; languages = The app in German, English, French, Italian or Spanish; ai_assistant = Working through an AI assistant (ChatGPT, Claude, Copilot or another MCP client); offline = Working without an internet connection; gps_tracking = GPS or live location tracking; erp_accounting_sync = A link to an ERP, accounting or other business system; signatures = Signatures on hand-over; wash_cycles = Counting wash cycles of textiles; key_cabinet = Key management with a key cabinet or locking plan; selling_goods = Stock of goods you sell: a shop, sales or invoicing.",
                "items": {
                  "enum": ["items_fields", "item_models", "qr_labels_scanning", "checkout_return", "people_places", "containers", "kit_lists", "quantities_stock", "orders_reservations", "defects_tickets", "maintenance_inspections", "stocktaking", "history", "receipt_confirmation", "import_export", "single_sign_on", "directory_sync", "roles_permissions", "mobile_app", "notifications", "languages", "ai_assistant", "offline", "gps_tracking", "erp_accounting_sync", "signatures", "wash_cycles", "key_cabinet", "selling_goods"],
                  "type": "string"
                },
                "maxItems": 60,
                "type": "array"
              },
              "orgType": {
                "description": "school, company, publicAdmin (public administration), publicWorks (public works, utilities, fire brigades), club, or other.",
                "enum": ["school", "company", "publicAdmin", "publicWorks", "club", "other"],
                "type": "string"
              },
              "otherNeeds": {
                "description": "Needs that fit no key, in the user's words, without names: up to 5, each up to 200 characters. The team reads them.",
                "items": {
                  "maxLength": 4000,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "people": {
                "description": "About how many people will use it or hold items.",
                "maximum": 10000000,
