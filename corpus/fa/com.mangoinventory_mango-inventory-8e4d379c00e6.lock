          "name": "tell_us",
          "title": "Message the Mango Inventory team",
          "description": "Pass a message to the Mango Inventory team: what a visitor came for, or what is missing. Works without an account; signed-in connections have send_feedback. Takes the need in a few words, what was missing, the outcome and, with source \"user\", the user's own words. The text is stored for the team as written, with Mango Inventory keys and tokens redacted and control characters stripped; over the public rate limits a message is answered as received but not stored. Answers { received: true } with a short note. Not idempotent: each call is a new message.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lookingFor": {
                "description": "What the user was looking for, paraphrased, without names. Up to 300 characters.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "missing": {
                "description": "What was missing or unclear for them. Up to 1000 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "model": {
                "description": "The AI model sending it, if known. Up to 80 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "outcome": {
                "description": "foundIt = Mango Inventory covers it; partly = some of it; notHere = it does not.",
                "enum": ["foundIt", "partly", "notHere"],
                "type": "string"
              },
              "source": {
                "description": "agent (default) = the agent's own summary; user = the user asked for it to be passed on.",
                "enum": ["agent", "user"],
                "type": "string"
              },
              "userWords": {
                "description": "Only with source \"user\": their words, without names. Up to 300 characters.",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["lookingFor"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "note": {
                "type": "string"
              },
              "received": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
