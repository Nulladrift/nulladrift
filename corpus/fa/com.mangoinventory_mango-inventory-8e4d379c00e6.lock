      "serverInfo": {
        "name": "mango-inventory",
        "title": "Mango Inventory — inventory management",
        "version": "2.35.3",
        "description": "Inventory management for organizations with a lot of inventory: equipment, tools, machines, IT devices, vehicles and stock. Set up, import a whole list and run the daily work.",
        "websiteUrl": "https://mangoinventory.com/en/ai-agents",
        "icons": [
          {
            "src": "https://mcp.mangoinventory.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mango Inventory is inventory management for organizations with a lot of inventory: equipment, tools, machines, IT devices, vehicles and the stock and consumables around them. Signed in, you act for the person who connected, in one organization: every call has their permissions, and every write is logged under their name, with \"(via AI agent)\".\n\nNot signed in yet? check_fit, quote, find_docs, tell_us and create_account work without an account; any other tool makes the client ask for sign-in.\n\nHow the data works:\n- Records are the organization's register, shown to its members as fact. Values are stored exactly as passed; optional fields may stay empty, and an item draft (isDraft) may lack required values.\n- A date field holds a calendar day. A month or a year alone is not a day: it fits a text field.\n- The server has no time zone and converts none. Date arguments take a plain day (\"2026-08-11\") or a timestamp with an offset; every returned date comes as epoch and ISO twin.\n- create_item, create_ticket and create_order take a clientRequestId: a repeated call with the same id returns the existing record instead of a duplicate. create_category, create_location, create_person, create_field_def and create_team take none: a repeated call creates a second record.\n- Database ids are handles for tool calls. Items carry a printed code (primaryCode); records carry webUrl, their page in the web app.\n\nSetting up an organization: get_setup_template serves starting structures per kind of organization, with the questions that shape a setup. scaffold_categories, scaffold_locations and scaffold_models return a dry run without confirm: true, so one call previews a whole tree and the same call with confirm: true commits it.\n\nImporting a list (a spreadsheet, a CSV, a pasted table): plan_import is a dry run of the product's importer that writes nothing and says per row what would be created, updated, skipped or dropped; run_import commits the same rows with the planHash plan_import returned, as one batch. Categories with typed fields (scaffold_categories) and item models for articles in sizes (scaffold_models) can be created before the import; plan_import lists the category and location names the import would create itself under toCreate, and archive_category archives unused starter categories. Vehicles, cases and carts are items with their own row, not locations; the rows of what sits inside name them in a container column. While an organization is within its free 50 items, an import may cross that allowance and comes in whole, but it is the last one: afterwards no published item can be added until the organization upgrades.\n\nFeedback: send_feedback reaches the Mango Inventory team, who read the stored reports to fix these tools: a tool that failed unexpectedly, an answer that made no sense, something missing, a workaround, or a message the user wants passed on.\n\nFinding things: inventory_overview answers \"what do we own, how many, what is broken\"; list_resources and search_resources find places and people; get_setup_status shows the configuration; search_items takes printed codes (\"BM-002\") and short name stems. An item's status is its condition; check_item_availability says whether it is free to hand out. get_item and show_items are the only tools with item photos. \"me\" means the connected user wherever a tool takes a person.\n\nApp only, no tool here: recording a maintenance check, editing maintenance plans.",
      "tools": [
        {
          "name": "add_comment",
          "title": "Add comment",
          "description": "Leave a comment on exactly ONE of an item, a ticket or an order: exactly one of itemId / ticketId / orderId plus the text (\"note on the beamer: lamp flickers\"). The comment appears in that record's activity timeline under the connected user's name, marked \"(via AI agent)\", and notifies the people involved (item holder and responsible person, ticket reporter and assignee, order participants). Order comments require being an order participant (requester, assignee or an order manager). Plain text only: @-mentions are not supported. list_comments reads the thread back with the same one target id. Not idempotent: a repeated call posts a second comment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "itemId": {
                "description": "Item id (exactly one target)",
                "type": "string"
              },
              "orderId": {
                "description": "Order id (exactly one target)",
                "type": "string"
              },
              "text": {
                "description": "The comment text (plain text)",
                "type": "string"
              },
