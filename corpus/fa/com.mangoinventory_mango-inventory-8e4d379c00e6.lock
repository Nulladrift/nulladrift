                "type": "boolean"
              },
              "acknowledgeSafetyItemIds": {
                "description": "Pass the ids from itemsWithIssues ONLY after your user explicitly confirmed handing those items out from a previous requiresAcknowledgment result",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "acknowledgeUnusableItemIds": {
                "description": "Pass the unusable item ids ONLY after your user explicitly confirmed them from a previous requiresAcknowledgment result",
                "items": {
                  "type": "string"
                },
                "type": "array"
