        {
          "name": "update_ticket",
          "title": "Update ticket",
          "description": "Update a ticket: change its status (open, in_progress, done, wontfix) and/or edit title, description, priority or due date. Closing = status done (resolved) or wontfix (won't be handled); when closing you may pass restoreItemStatus: true to set the item back to \"available\" in the same call (typical after a repair). For the due date pass `dueDate` as a calendar day (\"2026-08-11\") — that is the form that cannot be shifted; `dueAt` (epoch milliseconds) still works for older clients, pass exactly one of the two, and null on either clears the date. Changes appear in the ticket's timeline under your user's name. Only the assignee, reporter or a manager can update a ticket. Find tickets with list_tickets; the result is the updated ticket in the same row shape list_tickets returns, `createdAt`, `reporterName` and the ISO date twins included. Confirm the change to your user with the ticket title and its `webUrl` link, not with the raw id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "New description, or null to clear",
                "type": ["string", "null"]
              },
              "dueAt": {
                "description": "Due date as epoch milliseconds at UTC midnight of the day, or null to clear. Prefer `dueDate` — pass exactly one of the two",
                "type": ["number", "null"]
              },
              "dueDate": {
                "description": "Due date as a calendar day, \"YYYY-MM-DD\" (e.g. \"2026-08-11\"), or null to clear. THIS is the form to use: it has no timezone to get wrong. A full timestamp is accepted only WITH an explicit offset (\"2026-08-11T00:00:00+02:00\") and the server takes the calendar day as seen in that offset — it does no timezone conversion of its own, so an offset-less timestamp is refused rather than guessed. Passing both dueAt and dueDate is an error",
                "type": ["string", "null"]
              },
              "priority": {
                "anyOf": [
                  {
                    "enum": ["low", "normal", "high"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "New priority, or null to clear"
              },
              "restoreItemStatus": {
                "description": "When closing: also set the item back to \"available\" (typical after a repair)",
                "type": "boolean"
              },
              "status": {
                "description": "New status — done = resolved, wontfix = closed without handling",
                "enum": ["open", "in_progress", "done", "wontfix"],
                "type": "string"
              },
              "ticketId": {
                "description": "Ticket id (find with list_tickets)",
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["ticketId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "assigneeName": {
                "description": "Who it is assigned to",
                "type": "string"
              },
              "closedAt": {
                "description": "Close time, epoch milliseconds",
                "type": "number"
              },
              "closedAtIso": {
                "description": "The same moment as an ISO-8601 UTC timestamp",
                "type": "string"
              },
              "createdAt": {
                "description": "When the ticket was reported, epoch milliseconds — the \"since when is it broken?\" answer, and what \"newest first\" sorts on",
                "type": "number"
              },
              "createdAtIso": {
                "description": "The same moment as an ISO-8601 UTC timestamp — read THIS one; the server does no timezone conversion",
                "type": "string"
              },
              "dueAt": {
                "description": "Due date, epoch milliseconds",
                "type": "number"
              },
              "dueAtIso": {
                "description": "The due date as a plain calendar day, \"YYYY-MM-DD\". A DAY, not a moment: the server does no timezone conversion, so do not re-zone it into the previous evening",
                "type": "string"
              },
              "id": {
                "description": "Ticket id",
                "type": "string"
              },
              "itemName": {
                "description": "The item the ticket is about",
                "type": "string"
              },
              "primaryCode": {
                "description": "The item's printed asset code",
                "type": "string"
              },
              "priority": {
                "description": "low | normal | high",
                "type": "string"
              },
              "reporterName": {
                "description": "Who reported it. Absent when nobody did — a maintenance plan minted the ticket, or it came from a logged-out QR report",
                "type": "string"
              },
              "status": {
                "description": "Ticket status: open | in_progress | done | wontfix",
                "type": "string"
              },
              "title": {
                "description": "Ticket title",
                "type": "string"
              },
              "type": {
                "description": "Ticket type: defect | maintenance | …",
                "type": "string"
              },
              "webUrl": {
                "description": "Link to this ticket in the web app — give your user THIS, never the raw `id` (that is a machine handle for your next call). Absent when the deployment has no public address",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:ea50f4a3c55bf15270b7fe821709164383af184b8b0c42dd7ebe57caba49c201"
        }
