        {
          "name": "update_item",
          "title": "Update item",
          "description": "Update an inventory item: rename, edit the description (null clears it), and set custom field values (keys = fieldDefId from get_item_requirements; null clears a value). State a one-sentence summary of the edit and get your user's OK BEFORE calling — then call once; unchanged values are skipped silently and every real change lands in the item's activity timeline under your user's name. If the edit would clear required values the call returns { missingFields } and changes NOTHING — ask your user and retry. Items that belong to a model cannot be renamed here (the model owns the name). NOT for: category changes (app), status (set_item_status), location/holder (assign_item), stock amounts (transfer_stock). Requires the manager role.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "customFields": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    },
                    {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": "Field values keyed by fieldDefId (from get_item_requirements); null clears a value. Dates as a plain calendar day \"YYYY-MM-DD\" (a full timestamp works too, but only WITH an explicit offset — this server has no timezone and does no conversion), selects as one of the listed options, multiselect as an ARRAY of option strings, currency as a plain number in the field's own currency (see its currencyCode; default CHF), url as a full http(s) link (protocol added when missing).",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "description": {
                "description": "New description, or null to clear",
                "type": ["string", "null"]
              },
              "itemId": {
                "description": "Item id",
                "type": "string"
              },
              "name": {
                "description": "New item name",
                "type": "string"
              }
            },
            "required": ["itemId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "category": {
                "description": "Category name",
                "type": "string"
              },
              "compartment": {
                "additionalProperties": {},
                "description": "The compartment of that container the item sits in (absent = directly in the container)",
                "properties": {
                  "id": {
                    "description": "Compartment id",
                    "type": "string"
                  },
                  "name": {
                    "description": "Compartment name",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "container": {
                "additionalProperties": {},
                "description": "The container this item is packed into, if any",
