        {
          "name": "list_orders",
          "title": "List orders",
          "description": "List orders (material/item requests) in the organization, newest first, grouped by active vs closed. Order managers see all orders; other members see only orders they requested or are assigned to (the result field `isManager` tells you which view you got). Each order row: id, status, requester, deliver-to target, the free-text request, the requested lines (a specific item, any instance of a model (`modelId`), any item of a category (`categoryId`), or free text; each with its `quantity` where one was given — \"5 Packungen Kopierpapier\" is quantity 5), `neededByAt` (when the requester needs it, absent when they did not say) and the assignee. Every date comes twice — the epoch and its ISO twin: `neededByAtIso` is a plain calendar day (\"2026-08-11\"), `createdAtIso` / `closedAtIso` are UTC instants. Read the ISO one to your user; this server does no timezone conversion, so never re-zone a calendar day. Status values: \"open\" = requested, nobody has started fulfilling it; \"in_fulfillment\" = an order manager is working on it; \"fulfilled\" (delivered), \"rejected\" (declined by a manager) and \"cancelled\" (withdrawn by the requester) are closed. Filter with `status`, or omit it to get all orders — \"open orders\" in the everyday sense usually means open + in_fulfillment. `status` scopes the READS themselves, so it genuinely reaches older orders of that status instead of narrowing an already-capped page. An order has no printed code and its `id` is a machine handle for your next call — when you name an order to your user, give them the `webUrl` link with the requester and the request text, never the raw id. If the result field `truncated` is true the organization has more orders than returned — do not treat the list as complete. The caps: the newest 100 per ACTIVE status (open, in_fulfillment), the newest 50 per CLOSED status (fulfilled, rejected, cancelled), and the closed rows are then cut to 50 in total. Narrowing with `status` is what actually gets you past them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "status": {
                "description": "Only return orders with this status (omit to return all)",
                "enum": ["open", "in_fulfillment", "fulfilled", "rejected", "cancelled"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "isManager": {
                "description": "False means you only see your own orders",
                "type": "boolean"
              },
              "orders": {
                "description": "The orders, active first",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "assigneeName": {
                      "description": "Who handles it",
                      "type": "string"
                    },
                    "closedAt": {
                      "description": "Epoch milliseconds",
                      "type": "number"
                    },
                    "closedAtIso": {
                      "description": "When the order was closed, ISO-8601 UTC timestamp",
                      "type": "string"
                    },
                    "createdAt": {
                      "description": "Epoch milliseconds",
                      "type": "number"
                    },
                    "createdAtIso": {
                      "description": "When the order was placed, ISO-8601 UTC timestamp",
                      "type": "string"
                    },
                    "id": {
                      "description": "Order id",
                      "type": "string"
                    },
                    "neededByAt": {
                      "description": "When the requester needs it, epoch milliseconds at UTC midnight. Absent when they did not say",
                      "type": "number"
                    },
                    "neededByAtIso": {
                      "description": "The needed-by date as a plain calendar day, \"YYYY-MM-DD\" — read THIS one. A DAY, not a moment: the server does no timezone conversion, so do not re-zone it",
                      "type": "string"
                    },
                    "rejectReason": {
                      "description": "Why it was declined",
                      "type": "string"
                    },
                    "request": {
                      "description": "Free-text request",
                      "type": "string"
                    },
                    "requestedItems": {
                      "description": "Requested lines: an item, a model (any instance), a category (any item in it) or free text",
                      "items": {
                        "additionalProperties": {},
                        "properties": {
                          "categoryId": {
                            "description": "Category line: any item of this category, subcategories included — the store picks which",
                            "type": "string"
                          },
                          "description": {
                            "description": "Free-text line (no item attached)",
                            "type": "string"
                          },
                          "itemId": {
                            "description": "Requested item id",
                            "type": "string"
                          },
                          "modelId": {
                            "description": "Model line: any instance of this model — the store picks which",
                            "type": "string"
                          },
                          "name": {
                            "description": "Name of the requested item, model or category as it was when ordered",
                            "type": "string"
                          },
                          "quantity": {
                            "description": "How many were asked for on that line (\"5 Packungen Kopierpapier\" = 5). Absent when the requester named no amount — on BOTH item and free-text lines",
                            "type": "number"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "requesterName": {
                      "description": "Who asked",
                      "type": "string"
                    },
                    "status": {
                      "description": "open | in_fulfillment | fulfilled | rejected | cancelled",
                      "type": "string"
                    },
                    "target": {
                      "additionalProperties": {},
                      "description": "Where the order delivers to",
                      "properties": {
                        "id": {
                          "description": "Target resource id",
                          "type": "string"
                        },
                        "name": {
                          "description": "Target name",
