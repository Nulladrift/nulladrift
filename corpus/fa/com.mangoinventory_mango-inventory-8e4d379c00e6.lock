        {
          "name": "adjust_stock",
          "title": "Adjust stock",
          "description": "Correct a quantity-tracked item's stock at ONE location: \"we used up 12 batteries\", \"50 arrived\", \"recounted: there are 7\". Exactly one of delta (relative: negative = used up, positive = received) or setTo (absolute recount). kind states the intent (usage | receipt | correction; inferred from the argument shape when absent); reason is a short note for the activity timeline. A negative delta past the location's unreserved stock is rejected (the error names the amounts); a setTo recount always records the count, even below reservations. A restock task opens automatically when a location's AVAILABLE stock (on hand minus what active orders reserved) drops below its threshold, so a location can be low with a full shelf. The result returns every stocked level as distribution: { locationId, name, kind: location|person, quantity, available, reserved?, minStock?, isLow? }, the same row shape check_item_availability returns, so isLow shows whether this adjustment took the location under its threshold. transfer_stock moves stock between locations; serialized items change through assign_item and set_item_status. Requires the manager role. Not idempotent: a repeated delta applies twice (a repeated setTo does not change the count again).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "delta": {
                "description": "Relative change: negative = used up, positive = received (exactly one of delta/setTo)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "itemId": {
                "description": "Item id (must be a quantity-tracked item)",
                "type": "string"
              },
              "kind": {
                "description": "Intent for the activity timeline; inferred from the argument shape when absent",
                "enum": ["usage", "receipt", "correction"],
                "type": "string"
              },
              "locationId": {
                "description": "Location (or stock-holding person) resource id, from search_resources or check_item_availability's distribution",
                "type": "string"
              },
              "reason": {
                "description": "Short reason, shown in the item's activity timeline",
                "type": "string"
              },
              "setTo": {
                "description": "Absolute recount — the new quantity at this location",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["itemId", "locationId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "distribution": {
                "description": "Every stocked level after the change — the SAME row shape check_item_availability returns",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "available": {
                      "description": "Freely usable stock: quantity minus reserved, floored at 0. Always present",
                      "type": "number"
                    },
                    "isLow": {
                      "description": "True when available < minStock. Present only alongside minStock — absent means no threshold is set here, NOT that the level is healthy",
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "\"location\" or \"person\" (a person holding pool stock)",
                      "type": "string"
                    },
                    "locationId": {
                      "description": "Resource id of this place — pass it straight to adjust_stock, set_min_stock or transfer_stock (no search_resources round-trip needed)",
                      "type": "string"
                    },
                    "locationName": {
                      "description": "DEPRECATED — the same string as `name`, kept only for clients whose tool list froze before the rename",
                      "type": "string"
                    },
                    "minStock": {
                      "description": "Restock threshold here (absent when none is set)",
                      "type": "number"
                    },
                    "name": {
                      "description": "Location or person name",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Physical stock on hand here",
                      "type": "number"
                    },
                    "reserved": {
                      "description": "Of that, promised to active orders (absent when 0)",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "itemId": {
                "description": "Item id",
                "type": "string"
              },
              "name": {
                "description": "Item name",
                "type": "string"
              },
              "newLevelQuantity": {
                "description": "The adjusted location's stock after the change",
                "type": "number"
              },
              "totalQuantity": {
                "description": "Pool total after the change",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Adjust stock"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f805d6ab17414eb32c62e318ab494c50ce56a1043c332913abe026603369789c"
        },
        {
          "name": "archive_category",
          "title": "Archive unused category",
          "description": "Archive a category that nothing uses, e.g. a starter category the organization does not need. Refused, with nothing written, while anything still uses it: items (drafts too), sub-categories, item models, fields defined on it, a maintenance plan that selects it, or an item kit that lists it; the answer names what. An archived category leaves every list and picker, and the app has no way to bring it back. Repeating the call on an archived category answers alreadyArchived and writes nothing. Requires the manager role.",
