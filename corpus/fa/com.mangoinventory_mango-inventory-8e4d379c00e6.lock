                "description": "Your user's email address, as they gave it.",
                "maxLength": 254,
                "minLength": 3,
                "type": "string"
              },
              "language": {
                "description": "Their language for the email and the app: en (default), de, fr, it or es.",
                "enum": ["en", "de", "fr", "it", "es"],
                "type": "string"
              },
              "name": {
                "description": "Your user's name, as they gave it. Up to 100 characters.",
                "maxLength": 4000,
