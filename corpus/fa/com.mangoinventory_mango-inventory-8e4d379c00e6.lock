      "serverInfo": {
        "name": "mango-inventory",
        "title": "Mango Inventory — inventory management",
        "version": "2.31.1",
        "description": "Inventory management for organizations with a lot of inventory: equipment, tools, machines, IT devices, vehicles and stock. Set up, import a whole list and run the daily work.",
        "websiteUrl": "https://mangoinventory.com/en/ai-agents",
        "icons": [
          {
            "src": "https://mcp.mangoinventory.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mango Inventory is inventory management for organizations with a lot of inventory: equipment, tools, machines, IT devices, vehicles and the stock and consumables around them. Signed in, you act for the person who connected, in one organization: every call has their permissions, and every write is logged under their name, with \"(via AI agent)\".\n\nNot signed in yet? check_fit, quote, find_docs, tell_us and create_account work without an account; any other tool makes your client ask your user to sign in.\n\nRules that always hold:\n- NEVER invent data: no made-up names, dates, prices, serial numbers or counts. What your user or their file does not say stays empty. Keep their names, spelling and words; fix only obvious typos, and say which.\n- Keep a date at the precision it was given: a month or a year alone is not a day, so ask your user how to store it, or keep the original text in a text field, and say which you did.\n- Never write against a guessed record: if a search is ambiguous, narrow it or ask. Pass a fresh clientRequestId on every create; a retry with the same id returns the existing record.\n- Database ids are handles for your next call, never for a person: name items by their printed code, tickets and orders by their title and webUrl link.\n- We have no time zone, you know your user's: write a plain day (\"2026-08-11\") or a timestamp with an offset, and read out the ISO twin of a date.\n\nSetting up an organization: let your user TALK for a few minutes first — what they manage, their rooms and buildings, the people. NEVER write on the first message. Call get_setup_template, propose a structure in their words, and wait for their OK. scaffold_categories, scaffold_locations and scaffold_models return a dry run and write only with confirm: true, so one OK covers a whole tree.\n\nImporting a list (a spreadsheet, a CSV, a pasted table): read the WHOLE file and tell your user what you found — kinds of things, single pieces vs counts of identical pieces, places, people, dates, how many items. Propose the shape and get their OK; then create the categories and fields (scaffold_categories) and an item model per article that comes in sizes (scaffold_models) BEFORE the import, and offer to archive starter categories they do not use (archive_category). Vehicles, cases and carts are items with their own row, never locations; the rows of what sits inside name them in a container column. Then plan_import (a dry run, writes nothing), show your user what will be created and what will NOT come in, get ONE explicit OK, and run_import with the same rows. Put everything into ONE import: while an organization is within its free 50 items, an import may cross that allowance and comes in whole, but it is the last one — afterwards no item can be added until the organization upgrades.\n\nFeedback: when a tool fails unexpectedly, answers in a way you cannot make sense of, lacks something your user needed, or makes you work around it — or when your user asks you to tell us something — call send_feedback once for that task, without names or secrets, then carry on with the task. Mistakes you simply corrected need no report.\n\nFinding things: inventory_overview answers \"what do we own, how many, what is broken\"; list_resources and search_resources find places and people; get_setup_status shows the configuration; search_items takes printed codes (\"BM-002\") and short name stems. An item's status is its condition: call check_item_availability before you assign or promise one. When your user wants to SEE or CHOOSE items, use get_item or show_items (the only tools with photos). \"me\" means the key owner wherever a tool takes a person.\n\nApp only, no tool here: recording a maintenance check, editing maintenance plans. Point your user to the app.",
      "tools": [
        {
          "name": "add_comment",
          "title": "Add comment",
          "description": "Leave a comment on exactly ONE of an item, a ticket or an order — pass exactly one of itemId / ticketId / orderId plus the text (\"note on the beamer: lamp flickers\"). The comment appears in that record's activity timeline under your user's name marked \"(via AI agent)\", and notifies the involved people (item holder/responsible, ticket reporter/assignee, order participants). Order comments require being an order participant (requester, assignee or an order manager). @-mentions are not supported through this tool yet — plain text only. Read the conversation back with list_comments, which takes the same one target id — use it to check whether a question was already answered before adding another note, and to verify a comment you just posted. State the comment text and get your user's OK BEFORE calling. Not idempotent: a retry posts a second comment — after a timeout, read list_comments before retrying.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "itemId": {
                "description": "Item id (exactly one target)",
                "type": "string"
              },
              "orderId": {
                "description": "Order id (exactly one target)",
                "type": "string"
              },
              "text": {
                "description": "The comment text (plain text)",
                "type": "string"
              },
              "ticketId": {
                "description": "Ticket id (exactly one target)",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
