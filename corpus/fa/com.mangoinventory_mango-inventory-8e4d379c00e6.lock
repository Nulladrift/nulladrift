              },
              "contentsCount": {
                "description": "Direct contents count — containers only",
                "type": "number"
              },
              "currentHolder": {
                "additionalProperties": {},
                "description": "Person currently holding it",
                "properties": {
                  "archived": {
                    "const": true,
                    "description": "The referenced resource is archived",
                    "type": "boolean"
                  },
                  "id": {
                    "description": "Resource id",
                    "type": "string"
                  },
                  "name": {
                    "description": "Resource name",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "currentLocation": {
                "additionalProperties": {},
                "description": "Where the item is now",
                "properties": {
                  "archived": {
