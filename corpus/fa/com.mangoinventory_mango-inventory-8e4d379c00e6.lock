                "description": "The new comment's id",
                "type": "string"
              },
              "target": {
                "description": "\"item\", \"ticket\" or \"order\"",
                "type": "string"
              },
              "viaAgent": {
                "description": "True — the comment is marked as written via AI agent",
                "type": "boolean"
              }
            },
            "type": "object"
