        {
          "name": "list_activity",
          "title": "List activity",
          "description": "The organization's audit trail: \"what changed on this item?\", \"what did somebody do last week?\", \"who moved this and when?\". Newest first, one merged feed over item, ticket and order events: assignments, moves, status and category changes, renames, quantity adjustments and stock moves, pack/unpack, code attach/detach, custom-field edits, ticket transitions and checklist results, order transitions. Filters: `itemId` (that one item's history), `actorUserId` (one person; ids from list_members), `sources` ([\"items\"], [\"tickets\"], [\"orders\"]), `types` (item event types) and a date window: `since` / `until` as calendar days (\"2026-08-01\"), `until` included. The server has no timezone and does no conversion; the legacy `dateFrom` / `dateTo` epochs still work, exactly one of each pair. Each row is one flat sentence: `atIso` when, `actorName` who (`viaAgent: true` = done through an AI agent), `type` what happened, `subject` what it happened to, `field` which attribute (the org's own label for a custom field), `from` / `to` the two ends of the change, `amount` where a number moved, and `webUrl`, the record's page in the web app. A row with `featureLocked: true` belongs to a module the organization's plan does not include (maintenance, orders): it is kept because history is a record, and it has no `webUrl`, since there is nothing to open. `limit` is 20 by default, max 50; `nextCursor` pages further back. The filters run after a page is cut, so a filtered page can be EMPTY while `isDone` is false: that page held no match, and older pages may; `isDone: true` means nothing older is left. Requires the manager role.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "actorUserId": {
                "description": "Only this person's actions: the userId from list_members",
                "type": "string"
              },
              "cursor": {
                "description": "The `nextCursor` of a previous call; pages further back in time",
                "type": "string"
              },
              "dateFrom": {
                "description": "Lower bound as epoch milliseconds (legacy form of `since`; exactly one of the two)",
                "type": "number"
              },
              "dateTo": {
                "description": "Upper bound as epoch milliseconds (legacy form of `until`; exactly one of the two)",
                "type": "number"
              },
              "itemId": {
                "description": "Only this item's history (implies sources: [\"items\"])",
                "type": "string"
              },
              "limit": {
                "description": "Rows per page, default 20, max 50",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "since": {
                "description": "Only events from this calendar day onward, \"YYYY-MM-DD\". The server has no timezone and does no conversion",
                "type": "string"
              },
              "sources": {
                "description": "Which records to read events from; absent = all three",
                "items": {
                  "enum": ["items", "tickets", "orders"],
                  "type": "string"
                },
                "type": "array"
              },
              "types": {
                "description": "Only these ITEM event types — e.g. [\"assigned\", \"moved\", \"status_changed\", \"quantity_adjusted\", \"custom_field_changed\"]. An unknown value returns an error naming the whole valid set. Does not filter ticket or order rows",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "until": {
                "description": "Only events up to and INCLUDING this calendar day, \"YYYY-MM-DD\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "events": {
                "description": "The trail, newest first",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "actorName": {
                      "description": "Who did it",
                      "type": "string"
                    },
                    "amount": {
                      "description": "How many moved — stock moves and order lines",
                      "type": "number"
                    },
                    "at": {
                      "description": "Epoch milliseconds",
                      "type": "number"
                    },
                    "atIso": {
                      "description": "When it happened, ISO-8601 UTC timestamp — read THIS one; the server does no timezone conversion",
                      "type": "string"
                    },
                    "featureLocked": {
                      "description": "Present and true when this event belongs to a module the organization's plan does not include (e.g. maintenance or orders). The row is shown because history is a record, but it carries NO webUrl: there is nothing to open. Absent = a normal row",
                      "type": "boolean"
                    },
                    "field": {
                      "description": "Which attribute changed — the organization's own label for a custom field, the checklist line for a ticket check, the item name on an order line",
                      "type": "string"
                    },
                    "from": {
                      "description": "The value before, already rendered: a name, a status, a number, or a calendar day. Absent when there was none",
                      "type": "string"
                    },
                    "itemId": {
                      "description": "Item id — for follow-up calls",
                      "type": "string"
                    },
                    "kind": {
                      "description": "Which record the event belongs to: \"item\", \"ticket\" or \"order\"",
                      "type": "string"
                    },
                    "note": {
                      "description": "The note the actor left, when any",
                      "type": "string"
                    },
                    "orderId": {
                      "description": "Order id — for follow-up calls",
                      "type": "string"
                    },
                    "primaryCode": {
                      "description": "The item's printed asset code",
                      "type": "string"
                    },
                    "subject": {
                      "description": "What it happened to: the item or model name, the ticket title, or the order's request text. \"—\" when the record has since been deleted (the row is kept — an audit trail must not lie by omission)",
                      "type": "string"
                    },
                    "ticketId": {
                      "description": "Ticket id — for follow-up calls",
                      "type": "string"
                    },
                    "to": {
                      "description": "The value after, same rendering. Absent when it was cleared",
                      "type": "string"
                    },
                    "type": {
                      "description": "What happened: assigned | moved | status_changed | renamed | category_changed | quantity_adjusted | stock_moved | contained | removed | code_attached | custom_field_changed | ticket and order transitions | …",
                      "type": "string"
                    },
                    "viaAgent": {
                      "description": "Present and true when they did it through an AI agent. Absent = they did it themselves in the app",
                      "type": "boolean"
                    },
                    "webUrl": {
                      "description": "Link to the record in the web app, for a person to open; the ids are handles for tool calls. Absent on featureLocked rows, which have nowhere to link to",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "isDone": {
                "description": "True = this was the last page; there is nothing older to fetch. An EMPTY `events` array while this is false is normal on a filtered read — the filters are applied after the page is cut, so that page simply held no matching rows, and older pages (`nextCursor`) may",
                "type": "boolean"
              },
              "nextCursor": {
                "description": "The `cursor` value for the next page further back in time. Present only while isDone is false",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List activity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["read"],
                "type": "oauth2"
              }
            ]
          },
