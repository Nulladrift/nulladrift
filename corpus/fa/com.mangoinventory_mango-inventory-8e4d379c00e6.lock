          "description": "What would Mango Inventory cost? Works without an account. Pass how many items they want to track and, if you know them, their needs (the same keys as check_fit) and a currency. The answer names the plan that covers the needs, its monthly price for that many items (per started 1,000 items, cancel any month), what the next plan adds, and whether the inventory fits the 50 items that are free to try. Quote the numbers as given; do not compute your own.",
