        {
          "name": "adjust_stock",
          "title": "Adjust stock",
          "description": "Correct a quantity-tracked item's stock at ONE location — \"we used up 12 batteries\", \"50 arrived\", \"recounted: there are 7\". Pass EXACTLY ONE of delta (relative: negative = used up, positive = received) or setTo (absolute recount). kind states the intent (usage | receipt | correction; inferred from the argument shape when omitted); reason is a short note for the activity timeline. Negative deltas past the location's unreserved stock are rejected (the error names the amounts) — a setTo recount always records reality, even below reservations. A restock task opens automatically when a location's AVAILABLE stock — on hand minus what is reserved for active orders — drops below its threshold, so a location can be low even with a full shelf. The result echoes every stocked level as distribution: { locationId, name, kind: location|person, quantity, available, reserved?, minStock?, isLow? } — the SAME row shape check_item_availability returns — so isLow tells you straight away whether this adjustment pushed the location under its threshold, without a second read. State a one-sentence summary and get your user's OK BEFORE calling. NOT for: moving stock between locations (transfer_stock), serialized items (assign_item / set_item_status). Requires the manager role. Not idempotent: a retried delta applies twice — after a timeout, check the returned numbers instead of retrying blindly.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "delta": {
                "description": "Relative change: negative = used up, positive = received (exactly one of delta/setTo)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "itemId": {
                "description": "Item id (must be a quantity-tracked item)",
                "type": "string"
              },
              "kind": {
                "description": "Intent for the activity timeline; inferred from the argument shape when omitted",
                "enum": ["usage", "receipt", "correction"],
                "type": "string"
              },
              "locationId": {
                "description": "Location (or stock-holding person) resource id — find with search_resources or check_item_availability's distribution",
                "type": "string"
              },
              "reason": {
                "description": "Short reason, shown in the item's activity timeline",
                "type": "string"
              },
              "setTo": {
                "description": "Absolute recount — the new quantity at this location",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["itemId", "locationId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "distribution": {
                "description": "Every stocked level after the change — the SAME row shape check_item_availability returns",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "available": {
                      "description": "Freely usable stock: quantity minus reserved, floored at 0. Always present — this is the number to act on",
                      "type": "number"
                    },
                    "isLow": {
                      "description": "True when available < minStock. Present only alongside minStock — absent means no threshold is set here, NOT that the level is healthy",
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "\"location\" or \"person\" (a person holding pool stock)",
                      "type": "string"
                    },
                    "locationId": {
                      "description": "Resource id of this place — pass it straight to adjust_stock, set_min_stock or transfer_stock (no search_resources round-trip needed)",
                      "type": "string"
                    },
                    "locationName": {
                      "description": "DEPRECATED — the same string as `name`, kept only for clients whose tool list froze before the rename. Read `name`",
                      "type": "string"
                    },
                    "minStock": {
                      "description": "Restock threshold here (absent when none is set)",
                      "type": "number"
                    },
                    "name": {
                      "description": "Location or person name",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Physical stock on hand here",
                      "type": "number"
                    },
                    "reserved": {
                      "description": "Of that, promised to active orders (absent when 0)",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "itemId": {
                "description": "Item id",
                "type": "string"
              },
              "name": {
                "description": "Item name",
                "type": "string"
              },
              "newLevelQuantity": {
                "description": "The adjusted location's stock after the change",
                "type": "number"
              },
              "totalQuantity": {
                "description": "Pool total after the change",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
