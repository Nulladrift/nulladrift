                  "properties": {
                    "header": {
                      "description": "The column's header as in the file",
                      "type": "string"
                    },
                    "target": {
                      "description": "Import target (see the tool description), a field definition id, \"field:<label>\", or null to skip the column",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["header", "target"],
                  "type": "object"
                },
                "type": "array"
              },
              "entity": {
                "description": "What the rows are: \"items\" (default), \"persons\" (people) or \"locations\" (places)",
                "enum": ["items", "persons", "locations"],
                "type": "string"
              },
              "fileName": {
                "description": "Your user's file name (shown in the app's import history), e.g. Inventar 2024.xlsx",
                "type": "string"
              },
              "keepOrder": {
                "description": "Items are imported last row first by default, so the file's first row is the newest item and the app's list opens on it; true keeps the file order",
                "type": "boolean"
              },
              "rows": {
                "description": "The data rows you built from your user's file, cells as strings, header row left out. At most 1000 rows per call",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "separator": {
                "description": "Path separator in category and location cells (default \"/\": \"Fahrzeuge/Anhänger\")",
                "type": "string"
              }
            },
            "required": ["columns", "fileName", "rows"],
            "type": "object"
          },
