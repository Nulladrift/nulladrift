                "properties": {
                  "archived": {
                    "const": true,
                    "description": "The referenced resource is archived",
                    "type": "boolean"
                  },
                  "id": {
                    "description": "Resource id",
                    "type": "string"
                  },
                  "name": {
                    "description": "Resource name",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "id": {
