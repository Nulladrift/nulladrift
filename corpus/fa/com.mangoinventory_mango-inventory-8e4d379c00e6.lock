        {
          "name": "search_items",
          "title": "Search items",
          "description": "Search inventory items. `search` matches exact item codes and barcode labels first (e.g. \"BM-002\" printed on an asset tag), then names: word-prefix (\"Lap\" matches all laptops) plus an accent-insensitive substring pass (\"stuhl\" finds \"Stühle\" and \"Bürostuhl\"). The query is never shortened, so \"Stühle\" does not find \"Bürostuhl\": a shorter stem matches more. An empty result [] means no match. Filters, combinable with `search` and with each other: currentHolderId (a person resource id, or \"me\" for the connected user), categoryId, currentLocationId, status. categoryId and currentLocationId include the whole subtree by default (a top-level category returns its subcategories' items, a building its rooms' items); categoryMatch / currentLocationMatch \"exact\" limits the match to that node. Every non-draft item has a category; inventory_overview returns the category tree and list_resources the location and people trees whose node ids these filters take. No arguments lists the newest items. In results, `status` is the item's CONDITION (available = not defect/lost/retired), so an available item may still be borrowed (`currentHolder`). A row without `trackingMode` is one physical item; a \"quantity\" row is a stock pool whose count is `quantity`. `primaryCode` is the code printed on the asset tag, the one way to tell two identical models apart. `webUrl` / `listUrl` open the record and the filtered list in the web app. Rows carry no photo: get_item (one item) and show_items (a picker of several) return photos. Drafts (unreviewed captures, `isDraft`) are personal: results include only the connected user's own drafts, never another user's (admins included), not even by exact code or id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categoryId": {
                "description": "Filter by category id. Includes the whole subtree by default — see categoryMatch",
                "type": "string"
              },
              "categoryMatch": {
                "description": "How categoryId matches. \"subtree\" (default) = that category AND all its subcategories, which is almost always what a person means. \"exact\" = only items filed directly on that category",
                "enum": ["subtree", "exact"],
                "type": "string"
              },
              "currentHolderId": {
                "description": "Filter by current holder: a person resource id, or the literal \"me\" for the connected user",
                "type": "string"
              },
              "currentLocationId": {
                "description": "Filter by current location: a location resource id. Includes the whole subtree by default — see currentLocationMatch",
                "type": "string"
              },
              "currentLocationMatch": {
                "description": "How currentLocationId matches. \"subtree\" (default) = that place AND everything inside it, so a building returns its rooms' items. \"exact\" = only items sitting on that place itself",
                "enum": ["subtree", "exact"],
                "type": "string"
              },
              "page": {
                "description": "0-based page index",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "pageSize": {
                "description": "Items per page, max 50 (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Item code (exact match, e.g. BM-002) or name words (word-prefix plus accent-insensitive substring)",
                "type": "string"
              },
              "status": {
                "description": "Filter by condition. \"available\" means not defect/lost/retired — the item may still be borrowed.",
                "enum": ["available", "in_repair", "defect", "lost", "retired"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "currencySums": {
                "description": "Per-currency-field totals over EVERY matching row, not just this page — the answer to \"what is this worth\". Absent when the org has no currency field. A lower bound while `truncated` is true",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "currencyCode": {
                      "description": "ISO code, e.g. CHF",
                      "type": "string"
                    },
                    "fieldDefId": {
                      "description": "Field definition id",
                      "type": "string"
                    },
                    "label": {
                      "description": "Field label as the org named it",
                      "type": "string"
                    },
                    "total": {
                      "description": "Sum over ALL matching rows",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "items": {
                "description": "The matching items",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "category": {
                      "description": "Category name",
                      "type": "string"
                    },
                    "compartment": {
                      "additionalProperties": {},
                      "description": "The compartment of that container the item sits in (absent = directly in the container)",
                      "properties": {
                        "id": {
                          "description": "Compartment id",
                          "type": "string"
                        },
                        "name": {
                          "description": "Compartment name",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "container": {
                      "additionalProperties": {},
                      "description": "The container this item is packed into, if any",
                      "properties": {
                        "id": {
                          "description": "Container item id",
                          "type": "string"
                        },
                        "name": {
                          "description": "Container item name",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "contentsCount": {
                      "description": "Direct contents count — containers only",
                      "type": "number"
                    },
                    "currentHolder": {
                      "additionalProperties": {},
                      "description": "Person currently holding it",
                      "properties": {
                        "archived": {
                          "const": true,
                          "description": "The referenced resource is archived",
                          "type": "boolean"
                        },
                        "id": {
                          "description": "Resource id",
                          "type": "string"
                        },
                        "name": {
                          "description": "Resource name",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "currentLocation": {
                      "additionalProperties": {},
                      "description": "Where the item is now",
                      "properties": {
                        "archived": {
                          "const": true,
                          "description": "The referenced resource is archived",
                          "type": "boolean"
                        },
                        "id": {
                          "description": "Resource id",
                          "type": "string"
                        },
                        "name": {
                          "description": "Resource name",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "description": {
                      "description": "Item description",
                      "type": "string"
                    },
                    "effectiveHolder": {
                      "description": "Holder followed through the container chain",
                      "type": "string"
                    },
                    "effectiveLocation": {
                      "description": "Location followed through the container chain",
                      "type": "string"
                    },
                    "homeLocation": {
                      "additionalProperties": {},
                      "description": "Where the item belongs",
                      "properties": {
                        "archived": {
                          "const": true,
                          "description": "The referenced resource is archived",
                          "type": "boolean"
                        },
                        "id": {
                          "description": "Resource id",
                          "type": "string"
                        },
                        "name": {
                          "description": "Resource name",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "id": {
                      "description": "Item id",
                      "type": "string"
                    },
                    "isDraft": {
                      "description": "Present and true only for an unfinished draft capture",
                      "type": "boolean"
                    },
                    "modelId": {
                      "description": "The item's model — pass it as create_order lines[].modelId to order any instance of this model",
                      "type": "string"
                    },
                    "modelName": {
                      "description": "The model's name",
                      "type": "string"
                    },
                    "name": {
                      "description": "Item name",
                      "type": "string"
                    },
                    "primaryCode": {
                      "description": "The code printed on the item's asset tag — how a human tells two identical models apart. Absent when no code is attached",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "How many this row stands for — only on quantity-tracked pools. To count a pool, SUM this; to count serialized items, count rows",
                      "type": "number"
                    },
                    "responsiblePerson": {
                      "additionalProperties": {},
                      "description": "Person responsible",
                      "properties": {
                        "archived": {
                          "const": true,
                          "description": "The referenced resource is archived",
                          "type": "boolean"
                        },
                        "id": {
                          "description": "Resource id",
                          "type": "string"
                        },
                        "name": {
                          "description": "Resource name",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "status": {
                      "description": "Condition: available | in_repair | defect | lost | retired (\"available\" means not defect/lost/retired — the item may still be borrowed)",
                      "type": "string"
                    },
                    "trackingMode": {
                      "description": "\"quantity\" for a stock pool counted by amount. Absent = a serialized item, i.e. this row IS one physical thing",
                      "type": "string"
                    },
                    "webUrl": {
                      "description": "Link to this item in the web app, for a person to open. Absent when the deployment has no public address configured",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "listUrl": {
                "description": "Link that opens this same result in the web app. Absent when the filter combination has no list-URL form, or when the deployment has no public address",
                "type": "string"
              },
              "matchedBy": {
                "description": "\"code\" when the query resolved as an exact asset code",
                "type": "string"
              },
              "note": {
                "description": "Why an empty result is empty (e.g. no linked person for \"me\")",
                "type": "string"
              },
              "totalCount": {
                "description": "Total matches (a lower bound when `truncated` is true)",
                "type": "number"
              },
              "truncated": {
                "description": "The server scan hit its cap — narrow the search",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
