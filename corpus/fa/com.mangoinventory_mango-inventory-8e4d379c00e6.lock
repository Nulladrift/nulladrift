        {
          "name": "check_item_availability",
          "title": "Check item availability",
          "description": "Check whether an item is currently available: status, who holds it, where it is, how many tickets are open on it, how many of its maintenance checks are overdue and how many active orders request it (status defect or in_repair, an open ticket other than a maintenance check that is not yet due, overdueMaintenance > 0 or requestedInOrders > 0 means assign_item will require an acknowledgment). For quantity-tracked items the result additionally carries totalQuantity and distribution: one row per stocked level — locations AND people holding stock — with { locationId, name, kind: location|person, quantity, available, reserved?, minStock?, isLow? }, the SAME row shape transfer_stock and adjust_stock echo after a write. available = quantity minus what active orders reserved, floored at 0; isLow compares AVAILABLE against that level's threshold, so a full shelf with heavy reservations IS low. minStock and isLow appear together and only where a threshold exists — an absent isLow means no threshold is set there, not that the level is healthy; reserved is absent when 0; person rows carry neither (orders deliver to places, and person-held stock cannot carry a threshold). locationId is the id adjust_stock, set_min_stock and transfer_stock take, so no search_resources lookup is needed after this call. Units that sit inside containers (a bag, a vehicle compartment) are NOT in distribution: they come under packed, one row per container and compartment { containerId, containerName, containerPath?, compartmentName?, quantity, effectiveLocationName?, effectiveHolderName? } (absent when none), and totalQuantity counts them. Packed units are moved in the app's stock section; transfer_stock and adjust_stock work on places and people only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "itemId": {
                "description": "Item id",
                "type": "string"
              }
            },
            "required": ["itemId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "available": {
                "description": "Status available AND nobody currently holds it",
                "type": "boolean"
              },
              "currentHolderName": {
                "description": "Who holds it now",
                "type": "string"
              },
              "currentLocationName": {
                "description": "Where it is now",
                "type": "string"
              },
              "distribution": {
                "description": "Per-holder stock — quantity-tracked items only. One row per stocked level, locations AND people, each carrying its resource id so no search_resources lookup is needed.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "available": {
                      "description": "Freely usable stock: quantity minus reserved, floored at 0. Always present — this is the number to act on",
                      "type": "number"
                    },
                    "isLow": {
                      "description": "True when available < minStock. Present only alongside minStock — absent means no threshold is set here, NOT that the level is healthy",
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "\"location\" or \"person\" (a person holding pool stock)",
                      "type": "string"
                    },
                    "locationId": {
                      "description": "Resource id of this place — pass it straight to adjust_stock, set_min_stock or transfer_stock (no search_resources round-trip needed)",
                      "type": "string"
                    },
                    "locationName": {
                      "description": "DEPRECATED — the same string as `name`, kept only for clients whose tool list froze before the rename. Read `name`",
                      "type": "string"
                    },
                    "minStock": {
                      "description": "Restock threshold here (absent when none is set)",
                      "type": "number"
                    },
                    "name": {
                      "description": "Location or person name",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Physical stock on hand here",
                      "type": "number"
                    },
                    "reserved": {
                      "description": "Of that, promised to active orders (absent when 0)",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "itemId": {
                "description": "Item id",
                "type": "string"
              },
              "name": {
                "description": "Item name",
                "type": "string"
              },
              "openTickets": {
                "description": "Open tickets on this item",
                "type": "number"
              },
              "overdueMaintenance": {
                "description": "Overdue maintenance checks — assign_item will ask to confirm",
                "type": "number"
              },
              "packed": {
                "description": "Units inside containers (a bag, a vehicle compartment) — quantity-tracked items only, absent when none. Not in distribution; their place follows the container",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "compartmentName": {
                      "description": "The compartment of the container these units sit in (absent = directly in the container)",
                      "type": "string"
                    },
                    "containerId": {
                      "description": "Item id of the container holding these units",
                      "type": "string"
                    },
                    "containerName": {
                      "description": "Container name",
                      "type": "string"
                    },
                    "containerPath": {
                      "description": "Names of the containers this container sits in, outermost first, each followed by the compartment the next one sits in (absent when none)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "effectiveHolderName": {
                      "description": "Who has the container now, followed through its containers",
                      "type": "string"
                    },
                    "effectiveLocationName": {
                      "description": "Where the container is now, followed through its containers",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Units inside this container",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "requestedInOrders": {
                "description": "Active orders that requested this item but have not picked it",
                "type": "number"
              },
              "status": {
                "description": "Condition (see search_items)",
                "type": "string"
              },
              "totalQuantity": {
                "description": "Pool total — quantity-tracked items only. Counts places, people AND units inside containers",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:5042f97d725c03c53e84fd1bfc37588cbdc8aad9bc287870c24f9d4ba18d267d"
        },
        {
          "name": "create_account",
          "title": "Create an account for your user",
          "description": "Create a Mango Inventory account for your user, in their name. Works without an account. Use it only when your user asked for an account and gave you their name, their email address and the name of their organization; never guess any of them. Mango Inventory sends them ONE email; when they press its button, the address is confirmed and they are signed in. You get no password or key. After they confirmed, call any account tool (for example get_setup_status): your client shows its normal sign-in step (in Claude Code: run /mcp), your user approves, and you continue with every tool. Until they press the button nothing can be done in the account, and if they never do, nothing happens. Pass their language for the email and the app.",
          "inputSchema": {
