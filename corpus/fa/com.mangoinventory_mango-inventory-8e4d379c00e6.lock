        {
          "name": "quote",
          "title": "Price for Mango Inventory",
          "description": "The price of Mango Inventory. Works without an account. Takes how many items will be tracked and, optionally, the needs (the same keys as check_fit) and a currency. The answer names the plan that covers the needs, its monthly price for that many items, what the next plan adds, and whether the inventory fits the 50 items that are free to try. The server computes every number from the current price list.",
          "inputSchema": {
