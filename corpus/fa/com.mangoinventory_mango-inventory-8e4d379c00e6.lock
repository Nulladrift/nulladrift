                "type": "string"
              },
              "customFields": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    },
                    {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  ]
                },
                "description": "Field values keyed by fieldDefId (from get_item_requirements). Dates as a plain calendar day \"YYYY-MM-DD\" (a full timestamp works too, but only WITH an explicit offset — this server has no timezone and does no conversion), selects as one of the listed options, multiselect as an ARRAY of option strings, currency as a plain number in the field's own currency (see its currencyCode; default CHF), url as a full http(s) link (protocol added when missing).",
