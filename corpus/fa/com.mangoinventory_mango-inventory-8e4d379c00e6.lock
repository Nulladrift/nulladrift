        {
          "name": "send_feedback",
          "title": "Tell the Mango Inventory team",
          "description": "Tell the Mango Inventory team what did not work well for you here, so we can fix it. Mango Inventory is AI-first: anything a person can do in the app should be easy for you through these tools. Call this once per task when one of our tools failed unexpectedly, gave an answer or error you could not make sense of, lacked something your user needed, or made you use a workaround — and when your user asks you to pass something on to us (then set source to \"user\" and quote them in userWords). Do not call it for a mistake you simply corrected (a wrong id, a missing argument), or when everything worked. Describe the problem with our tools, not the conversation: paraphrase the goal, and leave out names of people, addresses and secrets. It is a side note: after it, carry on with your user's task.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "goal": {
                "description": "What your user wanted, paraphrased, without names. Up to 300 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "impact": {
                "description": "What it did to the task: blocked = it could not be done; worked_around = done another way; friction = done, but harder than it should be; none = no effect (an idea).",
                "enum": ["blocked", "worked_around", "friction", "none"],
                "type": "string"
              },
              "kind": {
                "description": "missing = a capability your user needed does not exist; broken = a tool failed or gave a wrong result; confusing = a description, answer or error misled you; idea = a suggestion, often your user's.",
                "enum": ["missing", "broken", "confusing", "idea"],
                "type": "string"
              },
              "model": {
                "description": "Which AI you are, if you know (e.g. the model name). Up to 80 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "source": {
                "description": "agent (default) = you noticed it; user = your user asked you to pass this on.",
                "enum": ["agent", "user"],
                "type": "string"
              },
              "suggestion": {
                "description": "What would have made it easy. Up to 500 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "summary": {
                "description": "One sentence: what did not work. Up to 200 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "tool": {
                "description": "The tool involved, e.g. run_import. Up to 60 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "userWords": {
                "description": "Only with source \"user\": their words, without names. Up to 300 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "whatHappened": {
                "description": "The error text, what you expected and what you got. Up to 1000 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "workaround": {
                "description": "What you did instead, if anything. Up to 500 characters.",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["goal", "impact", "kind", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "note": {
                "description": "What to do next: carry on with your user's task",
                "type": "string"
              },
              "received": {
                "description": "True — the report was taken (also when it was not stored)",
                "type": "boolean"
              },
              "shortened": {
                "description": "Fields the server cut to their stated limit",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "throttled": {
                "description": "True when this credential sent several reports recently; this one was not stored. Do not send more today",
                "type": "boolean"
              }
            },
            "type": "object"
          },
