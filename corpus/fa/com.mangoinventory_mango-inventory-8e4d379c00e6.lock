        {
          "name": "transfer_stock",
          "title": "Transfer stock",
          "description": "Move an amount of a quantity-tracked item's stock from one location to another (e.g. 3 packs of printer paper from the storeroom to room 201). Only works on quantity-tracked items — for serialized items use assign_item. Find location ids with search_resources, or read them off check_item_availability's distribution. Returns every stocked level after the move as distribution: { locationId, name, kind: location|person, quantity, available, reserved?, minStock?, isLow? } — the SAME row shape check_item_availability returns, so you see immediately whether the move left either end low (isLow counts AVAILABLE stock, i.e. on hand minus what orders reserved). Amounts reserved for orders or exceeding the source location's stock are rejected. If the result is { requiresAcknowledgment: true, warnings } the item has overdue maintenance or the status defect or in_repair — confirm with your user that the stock should be moved anyway, then retry the SAME call with acknowledgeWarnings: true. Never pass acknowledgeWarnings without that explicit user confirmation. Requires the manager role. Repeating the same call moves stock again — do not retry blindly after a success.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "acknowledgeWarnings": {
                "description": "Pass true ONLY after your user explicitly confirmed the warnings from a previous requiresAcknowledgment result",
                "type": "boolean"
              },
              "amount": {
                "description": "How many units to move (integer, at least 1)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "fromLocationId": {
                "description": "Source location resource id (where the stock is now)",
                "type": "string"
              },
              "itemId": {
                "description": "Item id (must be a quantity-tracked item)",
                "type": "string"
              },
              "toLocationId": {
                "description": "Destination location resource id",
                "type": "string"
              }
            },
            "required": ["amount", "fromLocationId", "itemId", "toLocationId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "distribution": {
                "description": "Every stocked level after the move — the SAME row shape check_item_availability returns",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "available": {
                      "description": "Freely usable stock: quantity minus reserved, floored at 0. Always present — this is the number to act on",
                      "type": "number"
                    },
                    "isLow": {
                      "description": "True when available < minStock. Present only alongside minStock — absent means no threshold is set here, NOT that the level is healthy",
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "\"location\" or \"person\" (a person holding pool stock)",
                      "type": "string"
                    },
                    "locationId": {
                      "description": "Resource id of this place — pass it straight to adjust_stock, set_min_stock or transfer_stock (no search_resources round-trip needed)",
                      "type": "string"
                    },
                    "locationName": {
                      "description": "DEPRECATED — the same string as `name`, kept only for clients whose tool list froze before the rename. Read `name`",
                      "type": "string"
                    },
                    "minStock": {
                      "description": "Restock threshold here (absent when none is set)",
                      "type": "number"
                    },
                    "name": {
                      "description": "Location or person name",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Physical stock on hand here",
                      "type": "number"
                    },
                    "reserved": {
                      "description": "Of that, promised to active orders (absent when 0)",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "instruction": {
                "description": "What to confirm with your user and how to retry",
                "type": "string"
              },
              "itemId": {
                "description": "Item id",
                "type": "string"
              },
              "name": {
                "description": "Item name",
                "type": "string"
              },
              "requiresAcknowledgment": {
                "description": "Present and true when nothing was written and a human confirmation is required — retry the SAME call with the acknowledge flag named in `instruction`",
                "type": "boolean"
              },
              "totalQuantity": {
                "description": "Pool total after the move",
                "type": "number"
              },
              "warnings": {
                "description": "Overdue maintenance behind a requires-ack round"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
