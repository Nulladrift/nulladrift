        {
          "name": "cancel_order",
          "title": "Cancel order",
          "description": "Cancel (withdraw) an order. Only the requester can cancel their OWN order, and only while it is still open; once fulfillment has started the requester cannot cancel it; an order manager can still decline it (reject_order). Releases any reserved stock. Irreversible: a closed order cannot be reopened.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "orderId": {
                "description": "Order id (from list_orders)",
                "type": "string"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "closedAt": {
                "description": "Close time, epoch milliseconds",
                "type": "number"
              },
              "closedAtIso": {
                "description": "The same moment as an ISO-8601 UTC timestamp — read THIS one; the server does no timezone conversion",
                "type": "string"
              },
              "orderId": {
                "description": "Order id",
                "type": "string"
              },
              "status": {
                "description": "open | in_fulfillment | fulfilled | rejected | cancelled",
                "type": "string"
              },
              "targetName": {
                "description": "Who/where the order delivers to",
                "type": "string"
              },
