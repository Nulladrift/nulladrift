        {
          "name": "update_ticket",
          "title": "Update ticket",
          "description": "Update a ticket: change its status (open, in_progress, done, wontfix) and/or edit title, description, priority or due date. Closing = status done (resolved) or wontfix (will not be handled); restoreItemStatus: true on a close also sets the item back to \"available\" (typical after a repair). The due date is `dueDate`, a calendar day (\"2026-08-11\"); the legacy `dueAt` epoch still works; exactly one of the two, and null on either clears the date. Status and due-date changes appear in the ticket's timeline under the connected user's name. Only the reporter, the assignee (or a member of the assigned team) or a ticket manager (responsibleForTickets) can update it; viewers never can. Ticket ids come from list_tickets. Returns the updated ticket in the list_tickets row shape (`createdAt`, `reporterName`, `webUrl` and the ISO date twins included). Idempotent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "New description, or null to clear",
                "type": ["string", "null"]
              },
              "dueAt": {
                "description": "Due date as epoch milliseconds at UTC midnight of the day, or null to clear (legacy form of `dueDate`; exactly one of the two)",
                "type": ["number", "null"]
              },
              "dueDate": {
                "description": "Due date as a calendar day, \"YYYY-MM-DD\" (e.g. \"2026-08-11\"), or null to clear. A full timestamp is accepted only WITH an explicit offset (\"2026-08-11T00:00:00+02:00\"), and the server takes the calendar day as seen in that offset; it does no timezone conversion of its own, so an offset-less timestamp is refused. Passing both dueAt and dueDate is an error",
                "type": ["string", "null"]
              },
              "priority": {
                "anyOf": [
                  {
                    "enum": ["low", "normal", "high"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "New priority, or null to clear"
              },
              "restoreItemStatus": {
                "description": "When closing: also set the item back to \"available\" (typical after a repair)",
                "type": "boolean"
              },
              "status": {
                "description": "New status — done = resolved, wontfix = closed without handling",
                "enum": ["open", "in_progress", "done", "wontfix"],
                "type": "string"
              },
              "ticketId": {
                "description": "Ticket id (from list_tickets)",
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["ticketId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "assigneeName": {
                "description": "Who it is assigned to",
                "type": "string"
              },
              "closedAt": {
                "description": "Close time, epoch milliseconds",
                "type": "number"
              },
              "closedAtIso": {
                "description": "The same moment as an ISO-8601 UTC timestamp",
                "type": "string"
              },
              "createdAt": {
                "description": "When the ticket was reported, epoch milliseconds — the \"since when is it broken?\" answer, and what \"newest first\" sorts on",
                "type": "number"
              },
              "createdAtIso": {
                "description": "The same moment as an ISO-8601 UTC timestamp — read THIS one; the server does no timezone conversion",
                "type": "string"
              },
              "dueAt": {
                "description": "Due date, epoch milliseconds",
                "type": "number"
              },
              "dueAtIso": {
                "description": "The due date as a plain calendar day, \"YYYY-MM-DD\". A DAY, not a moment: the server does no timezone conversion",
                "type": "string"
              },
              "id": {
                "description": "Ticket id",
                "type": "string"
              },
              "itemName": {
                "description": "The item the ticket is about",
                "type": "string"
              },
              "primaryCode": {
                "description": "The item's printed asset code",
                "type": "string"
              },
              "priority": {
                "description": "low | normal | high",
                "type": "string"
              },
              "reporterName": {
                "description": "Who reported it. Absent when nobody did — a maintenance plan minted the ticket, or it came from a logged-out QR report",
                "type": "string"
              },
              "status": {
                "description": "Ticket status: open | in_progress | done | wontfix",
                "type": "string"
              },
              "title": {
                "description": "Ticket title",
                "type": "string"
              },
              "type": {
                "description": "Ticket type: defect | maintenance | …",
                "type": "string"
              },
              "webUrl": {
                "description": "Link to this ticket in the web app, for a person to open; `id` is the handle for tool calls. Absent when the deployment has no public address",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update ticket"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
