        {
          "name": "check_fit",
          "title": "Check whether Mango Inventory fits",
          "description": "Whether Mango Inventory fits an organization. Works without an account. Takes what is known: the kind of organization, about how many items and people, the needs as keys from the list, and other needs as free text. The answer says what is covered (each with its help page), what is not built and what exists instead, notes about size, the monthly price of the plan that covers the needs when itemCount is given, and the next step.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
