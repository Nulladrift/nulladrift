        {
          "name": "transfer_stock",
          "title": "Transfer stock",
          "description": "Move an amount of a quantity-tracked item's stock from one place or person to another (e.g. 3 packs of printer paper from the storeroom to room 201, or 5 markers to a teacher). Quantity-tracked items only; assign_item moves serialized items. Location and person ids come from search_resources or from check_item_availability's distribution. Returns every stocked level after the move as distribution: { locationId, name, kind: location|person, quantity, available, reserved?, minStock?, isLow? }, the same row shape check_item_availability returns, so isLow shows whether either end is now low (isLow counts AVAILABLE stock: on hand minus what orders reserved). Amounts reserved for orders or exceeding the source location's stock are rejected. When the item has overdue maintenance the call writes nothing and returns { requiresAcknowledgment: true, warnings }; the same call with acknowledgeWarnings: true performs it. Requires the manager role. Not idempotent: a repeated call moves the stock again.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "acknowledgeWarnings": {
                "description": "true performs the call despite the warnings a previous requiresAcknowledgment result named",
                "type": "boolean"
              },
              "amount": {
                "description": "How many units to move (integer, at least 1)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "fromLocationId": {
                "description": "Source location or person resource id (where the stock is now)",
                "type": "string"
              },
              "itemId": {
                "description": "Item id (must be a quantity-tracked item)",
                "type": "string"
              },
              "toLocationId": {
                "description": "Destination location or person resource id",
                "type": "string"
              }
            },
            "required": ["amount", "fromLocationId", "itemId", "toLocationId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "distribution": {
                "description": "Every stocked level after the move — the SAME row shape check_item_availability returns",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "available": {
                      "description": "Freely usable stock: quantity minus reserved, floored at 0. Always present",
                      "type": "number"
                    },
                    "isLow": {
                      "description": "True when available < minStock. Present only alongside minStock — absent means no threshold is set here, NOT that the level is healthy",
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "\"location\" or \"person\" (a person holding pool stock)",
                      "type": "string"
                    },
                    "locationId": {
                      "description": "Resource id of this place — pass it straight to adjust_stock, set_min_stock or transfer_stock (no search_resources round-trip needed)",
                      "type": "string"
                    },
                    "locationName": {
                      "description": "DEPRECATED — the same string as `name`, kept only for clients whose tool list froze before the rename",
                      "type": "string"
                    },
                    "minStock": {
                      "description": "Restock threshold here (absent when none is set)",
                      "type": "number"
                    },
                    "name": {
                      "description": "Location or person name",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Physical stock on hand here",
                      "type": "number"
                    },
                    "reserved": {
                      "description": "Of that, promised to active orders (absent when 0)",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "instruction": {
                "description": "Which acknowledge flag performs the call",
                "type": "string"
              },
              "itemId": {
                "description": "Item id",
                "type": "string"
              },
              "name": {
                "description": "Item name",
                "type": "string"
              },
              "requiresAcknowledgment": {
                "description": "Present and true when nothing was written because of what this result names; the SAME call with the acknowledge flag named in `instruction` performs it",
                "type": "boolean"
              },
              "totalQuantity": {
                "description": "Pool total after the move",
                "type": "number"
              },
              "warnings": {
                "description": "Overdue maintenance behind a requires-ack round"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
