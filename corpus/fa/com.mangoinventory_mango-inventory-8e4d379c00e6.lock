        {
          "name": "create_order",
          "title": "Create order",
          "description": "Create an order — a request for items or material (any member can order; order managers fulfill). Put what you need into `lines`, one entry per thing, each with an optional `quantity`: \"Bestell 5 Packungen Kopierpapier\" is one line { description: \"Packungen Kopierpapier\", quantity: 5 }, a specific inventory item goes in as { itemId, quantity } instead (find ids with search_items), \"any two of this drill model\" as { modelId, quantity: 2 } (search_items rows carry the modelId), and \"any five from this category\" as { categoryId, quantity: 5 } (category ids from get_item_requirements) — for a model or category the store picks the concrete items, and ordering one with nothing free is allowed. `request` is the free-text framing around it (\"für das Schulzimmer 201\"), and at least one of request / lines / itemIds must be there. `neededBy` is when your user needs it — YOU resolve \"bis Dienstag\" to a calendar day and pass it as \"2026-08-11\". Only you know your user's timezone: this server has none and does no conversion, so a bare day is the safe form, and a full timestamp is accepted only WITH an explicit offset (\"2026-08-11T00:00:00+02:00\"). The legacy `neededByAt` epoch still works for older clients — pass exactly one of the two. The result echoes back `neededByAtIso`, the day that actually landed, so read it out to confirm the arithmetic was yours and it was right. `deliverToResourceId` is the person or location the items should go to (find ids with search_resources); omit it to deliver to yourself. Tell your user about the new order with its `webUrl` link — `orderId` is a machine handle for your follow-up calls, not something to read aloud. Recommended: pass a fresh `clientRequestId` (e.g. a UUID) with every new order — retrying with the SAME id returns the existing order instead of creating a duplicate.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clientRequestId": {
                "description": "Optional but recommended: a unique id you generate for this request (e.g. a UUID). If the call times out or you retry, pass the SAME id — you'll get the existing order back instead of creating a duplicate. Use a fresh id for each new order.",
                "type": "string"
              },
              "deliverToResourceId": {
                "description": "Person or location resource id to deliver to; defaults to you",
                "type": "string"
              },
              "itemIds": {
                "description": "Shorthand for quantity-less inventory item lines; equivalent to lines: [{ itemId }]. Prefer `lines` when a quantity matters",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lines": {
                "description": "The requested lines, one entry per thing you need — each a specific inventory item, any instance of a model, any item of a category, or free text, each with an optional quantity",
                "items": {
                  "properties": {
                    "categoryId": {
                      "description": "Any item of this category, subcategories included, the store picks which (a category id from get_item_requirements) — e.g. \"5 Stichsägeblätter\"",
                      "type": "string"
                    },
                    "description": {
                      "description": "Free text for something that is not in the inventory, e.g. \"Packungen Kopierpapier\"",
                      "type": "string"
                    },
                    "itemId": {
                      "description": "This one inventory item (an id from search_items) — exactly one of itemId / modelId / categoryId / description per line",
                      "type": "string"
                    },
                    "modelId": {
                      "description": "Any instance of this model, the store picks which (the modelId of a search_items row) — e.g. \"2 Akku-Bohrschrauber\" when it does not matter which two",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "How many (a whole number ≥ 1). Meaningful for material and stock, not for one serialized machine — leave it off there",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "neededBy": {
                "description": "When the requester needs it, as a calendar day: \"YYYY-MM-DD\" (e.g. \"2026-08-11\"). THIS is the form to use — a bare day has no timezone to get wrong. Your user says \"bis Dienstag\"; only YOU know which calendar day that is and which timezone they are in, because this server has no timezone and does no conversion. A full timestamp is accepted only WITH an explicit offset (\"2026-08-11T00:00:00+02:00\"), whose calendar day is then taken as seen in that offset; an offset-less timestamp is refused rather than guessed. Passing both neededByAt and neededBy is an error",
                "type": "string"
              },
              "neededByAt": {
                "description": "When the requester needs it, as epoch milliseconds at UTC midnight of that day. Prefer `neededBy` — pass exactly one of the two",
                "type": "number"
              },
              "request": {
                "description": "Free-text description of what you need (at least one of request/lines/itemIds is required)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "neededByAt": {
                "description": "The needed-by date that actually landed, epoch milliseconds. Absent when none was passed",
                "type": "number"
              },
              "neededByAtIso": {
                "description": "The same date as a plain calendar day, \"YYYY-MM-DD\" — read THIS back to your user, the date was YOUR arithmetic. A DAY, not a moment: the server does no timezone conversion",
                "type": "string"
              },
              "orderId": {
                "description": "The new order's id",
                "type": "string"
              },
              "status": {
                "description": "Order status",
                "type": "string"
              },
              "targetName": {
                "description": "Who/where it delivers to",
                "type": "string"
              },
              "webUrl": {
                "description": "Link to the new order in the web app — give your user THIS, never the raw `orderId` (that is a machine handle for your next call)",
                "type": "string"
              }
            },
            "type": "object"
          },
