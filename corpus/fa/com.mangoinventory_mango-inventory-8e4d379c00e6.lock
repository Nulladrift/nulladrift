        {
          "name": "fulfill_order",
          "title": "Fulfill order",
          "description": "Mark an order as fulfilled (delivered); order managers only. Fulfilling transfers reserved stock to the order's target. Three checks answer { requiresAcknowledgment: true, ... } and write nothing; the same call with the named acknowledgment performs it: requested lines that are short (an item line never picked, or a model or category line with fewer picked items than its quantity) come back as `uncovered` (acknowledgeIncomplete: true); picked items that are meanwhile lost/retired come back as `unusableItems` (acknowledgeUnusableItemIds takes their ids); picked items with open issues (status defect or in_repair, an open ticket, or an overdue maintenance check) come back as `itemsWithIssues`, each with its status, the first issue's title and the count (acknowledgeSafetyItemIds). Fails on already-closed orders. Irreversible: a closed order cannot be reopened.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "acknowledgeIncomplete": {
                "description": "true closes the order despite the uncovered lines a previous requiresAcknowledgment result named",
                "type": "boolean"
              },
              "acknowledgeSafetyItemIds": {
                "description": "The ids from a previous result's itemsWithIssues; the items are handed out despite their issues",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "acknowledgeUnusableItemIds": {
                "description": "The unusable item ids a previous requiresAcknowledgment result named; the order closes despite them",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "orderId": {
                "description": "Order id (from list_orders)",
                "type": "string"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "closedAt": {
                "description": "Close time, epoch milliseconds",
                "type": "number"
              },
              "closedAtIso": {
                "description": "The same moment as an ISO-8601 UTC timestamp — read THIS one; the server does no timezone conversion",
                "type": "string"
              },
              "instruction": {
                "description": "Which acknowledge flag performs the call",
                "type": "string"
              },
              "itemsWithIssues": {
                "description": "Picked items with open issues: status defect or in_repair, an open ticket, or an overdue maintenance check",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "count": {
                      "description": "Open tickets plus overdue checks on the item",
                      "type": "number"
                    },
                    "itemId": {
                      "description": "Item id",
                      "type": "string"
                    },
                    "name": {
                      "description": "Item name",
                      "type": "string"
                    },
                    "status": {
                      "description": "defect | in_repair, when the status is one of the two",
                      "type": "string"
                    },
                    "title": {
                      "description": "The first open ticket's or overdue check's title",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "orderId": {
                "description": "Order id",
                "type": "string"
              },
              "requiresAcknowledgment": {
                "description": "Present and true when nothing was written because of what this result names; the SAME call with the acknowledge flag named in `instruction` performs it",
                "type": "boolean"
              },
              "status": {
                "description": "open | in_fulfillment | fulfilled | rejected | cancelled",
                "type": "string"
              },
              "targetName": {
                "description": "Who/where the order delivers to",
                "type": "string"
              },
              "uncovered": {
                "description": "Requested lines that are short: item lines never picked; model and category lines with `filled` of `required` picked"
