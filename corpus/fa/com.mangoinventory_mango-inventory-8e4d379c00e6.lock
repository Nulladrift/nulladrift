                            "description": "Value type — immutable after creation. currency = money amount (numeric value, rendered code-first like CHF 1'200.50; without currencyCode a new field gets the organization's default currency); url = http(s) link (clickable in the app); multiselect = several options at once (value is an array of option strings)",
