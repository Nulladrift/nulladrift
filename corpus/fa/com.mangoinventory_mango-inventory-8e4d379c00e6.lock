                "type": "boolean"
              },
              "planHash": {
                "description": "Pass to run_import with the SAME arguments; it changes when the rows or the organization's answers change",
                "type": "string"
              },
              "problems": {
                "description": "Every row that does not simply create an item cleanly: dropped values, skipped rows, updates of existing items",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "disposition": {
                      "type": "string"
                    },
                    "issues": {
                      "items": {
                        "additionalProperties": {},
                        "properties": {
                          "code": {
                            "description": "The importer's issue code, e.g. invalidValue (the value is dropped), missingCategory (row skipped), containerNotFound (the row imports unplaced)",
                            "type": "string"
