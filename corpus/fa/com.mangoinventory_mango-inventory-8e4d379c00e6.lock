        {
          "name": "cancel_order",
          "title": "Cancel order",
          "description": "Cancel (withdraw) an order — only the requester can cancel their OWN order, and only while it is still open (once fulfillment started, coordinate via the app instead). Releases any reserved stock.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "orderId": {
                "description": "Order id (find with list_orders)",
                "type": "string"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "closedAt": {
                "description": "Close time, epoch milliseconds",
                "type": "number"
              },
              "closedAtIso": {
