                    "defaultFieldValues": {
                      "description": "Values every new piece of this model gets (only values your user gave you)",
                      "items": {
                        "properties": {
                          "field": {
                            "description": "A field id (from get_item_requirements) or \"field:<label>\"",
                            "type": "string"
                          },
                          "value": {
                            "description": "The value as text: a date as \"YYYY-MM-DD\" (a calendar day, no time zone to convert), a number as \"12.5\", a select value as one of its options, a multi-select value as several of its options separated by \";\" (\"HDMI; VGA\" — not commas: an option name may itself contain a comma)",
                            "type": "string"
                          }
                        },
                        "required": ["field", "value"],
                        "type": "object"
                      },
                      "type": "array"
