        {
          "name": "scaffold_categories",
          "title": "Scaffold category tree",
          "description": "Create a whole category tree WITH custom field definitions in one call — the setup power tool. PROTOCOL (designed for spoken dialogue): 1) call get_setup_status, then invite your user to just talk for a few minutes about what they manage; 2) draft the tree yourself from what you heard — expand ranges and enumerations yourself, keep it as lean as their reality; 3) call this tool WITHOUT confirm: you get a dry-run plan and NOTHING is written — per node it says created vs already-exists (same-name nodes at the same tree position are reused, never duplicated); 4) mirror the plan back in your user's words and get ONE explicit OK; 5) retry the SAME call with confirm: true — the whole tree commits atomically. parentName references another entry in the SAME call (names unique per call; include existing parents as entries, they are matched and reused). Each category may carry `fields` (custom field definitions) and defaultHomeLocationName (an existing location's exact name). orgWideFields apply to ALL items. A field whose label already exists at the same scope is reused; a type mismatch is reported as a conflict and skipped on commit. Requires the manager role.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
