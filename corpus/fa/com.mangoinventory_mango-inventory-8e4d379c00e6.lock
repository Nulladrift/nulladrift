        {
          "name": "send_feedback",
          "title": "Tell the Mango Inventory team",
          "description": "Send a report about these tools to the Mango Inventory team, who read the stored reports to fix the tools: a tool that failed unexpectedly, an answer or error that made no sense, something the user needed that no tool offers, a workaround that was needed, or a message the user asked to pass on (source \"user\", their words in userWords). The report is stored and, within daily mail caps, emailed to the team as written, with Mango Inventory keys, tokens and bearer headers redacted and control characters stripped. Over 5 reports an hour or 20 a day per credential (40 a day per organization) a report is answered as received but not stored (`throttled: true`). A field over its stated length is cut (`shortened`); only a field over 4,000 characters is refused. Not idempotent: each call is a new report. Works on read-only connections; it changes none of the organization's data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "goal": {
                "description": "What the user wanted, paraphrased, without names. Up to 300 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "impact": {
                "description": "What it did to the task: blocked = it could not be done; worked_around = done another way; friction = done, but harder than it should be; none = no effect (an idea).",
                "enum": ["blocked", "worked_around", "friction", "none"],
                "type": "string"
              },
              "kind": {
                "description": "missing = a capability the user needed does not exist; broken = a tool failed or gave a wrong result; confusing = a description, answer or error was misleading; idea = a suggestion.",
                "enum": ["missing", "broken", "confusing", "idea"],
                "type": "string"
              },
              "model": {
                "description": "The AI model sending the report, if known. Up to 80 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "source": {
                "description": "agent (default) = the agent noticed it; user = the user asked for it to be passed on.",
                "enum": ["agent", "user"],
                "type": "string"
              },
              "suggestion": {
                "description": "What would have made it easy. Up to 500 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "summary": {
                "description": "One sentence: what did not work. Up to 200 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "tool": {
                "description": "The tool involved, e.g. run_import. Up to 60 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "userWords": {
                "description": "Only with source \"user\": their words, without names. Up to 300 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "whatHappened": {
                "description": "The error text, what was expected and what came back. Up to 1000 characters.",
                "maxLength": 4000,
                "type": "string"
              },
              "workaround": {
                "description": "What was done instead, if anything. Up to 500 characters.",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["goal", "impact", "kind", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "note": {
                "description": "A short acknowledgment",
                "type": "string"
              },
              "received": {
                "description": "True — the report was taken (also when it was not stored)",
                "type": "boolean"
              },
              "shortened": {
                "description": "Fields the server cut to their stated limit",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "throttled": {
                "description": "True when this credential or organization is over its report limit; this report was not stored, and reports over the limit are not stored",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Tell the Mango Inventory team"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
