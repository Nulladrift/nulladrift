        {
          "name": "scaffold_models",
          "title": "Scaffold item models",
          "description": "Create item models («Modelle») in one call — one model per article type whose pieces share a name and settings: «Arbeitshose» in sizes XS to 8XL, or 16 identical radios. Same contract as scaffold_categories: WITHOUT confirm you get a dry-run plan and nothing is written; after your user's ONE explicit OK, retry the SAME call with confirm: true. Per model: name, categoryId, and how its pieces are named — nameSuffix \"none\" (every piece carries the model's name), \"text\" (each piece keeps its own suffix from its row: «Funkgerät 3») or \"field\" with nameSuffixFieldId (a select, text or number field: «Arbeitshose XL»); variantValues, the values a field may take on this model (the sizes it exists in — only values from your user's file); defaultFieldValues, the values every new piece gets (only values your user gave you). An existing model of the same name is reused, never duplicated; one whose settings differ (category, name suffix, allowed values, or a default you name) is reported as a conflict and left as it is. Models are created last-to-first, so the app's model list opens on your first one. Then import the pieces with plan_import, with the model's name in a blueprintName column and the size in its field's column. No pictures here: your user adds a model picture in the app. Requires the manager role.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirm": {
                "description": "Pass true ONLY after your user explicitly confirmed the previewed plan",
