        {
          "name": "scaffold_models",
          "title": "Scaffold item models",
          "description": "Create item models («Modelle») in one call: one model per article type whose pieces share a name and settings, e.g. «Arbeitshose» in sizes XS to 8XL, or 16 identical radios. Same contract as scaffold_categories: without confirm: true it is a dry run that writes nothing; the SAME call with confirm: true commits. Per model: name, categoryId, and how its pieces are named: nameSuffix \"none\" (every piece carries the model's name), \"text\" (each piece keeps its own suffix from its row: «Funkgerät 3») or \"field\" with nameSuffixFieldId (a select, text or number field: «Arbeitshose XL»); variantValues, the values a field may take on this model (the sizes it exists in); defaultFieldValues, the values every new piece gets. An existing model of the same name is reused, never duplicated; one whose settings differ (category, name suffix, allowed values, or a named default) is reported as a conflict and left as it is. Models are created last to first, so the app's model list opens on the first one. plan_import adds the pieces: the model's name in a blueprintName column and the size in its field's column. Model pictures are added in the app. At most 50 models per call. Requires the manager role. Idempotent: a repeated commit reuses every model.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirm": {
                "description": "true commits the plan; absent or false = dry run, nothing written",
                "type": "boolean"
              },
              "models": {
                "description": "The models, at most 50 per call",
                "items": {
                  "properties": {
                    "categoryId": {
                      "description": "Category id (from scaffold_categories or get_item_requirements)",
                      "type": "string"
                    },
                    "defaultFieldValues": {
                      "description": "Values every new piece of this model gets",
                      "items": {
                        "properties": {
                          "field": {
                            "description": "A field id (from get_item_requirements) or \"field:<label>\"",
                            "type": "string"
                          },
                          "value": {
                            "description": "The value as text: a date as \"YYYY-MM-DD\" (a calendar day, no time zone to convert), a number as \"12.5\", a select value as one of its options, a multi-select value as several of its options separated by \";\" (\"HDMI; VGA\" — not commas: an option name may itself contain a comma)",
                            "type": "string"
                          }
                        },
                        "required": ["field", "value"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "description": "Model name (unique within this call)",
                      "type": "string"
                    },
                    "nameSuffix": {
                      "description": "How its pieces are named: \"none\" = the model name, \"text\" = each piece its own suffix, \"field\" = the value of nameSuffixFieldId. Default \"none\" (\"field\" when nameSuffixFieldId is set)",
                      "enum": ["none", "text", "field"],
                      "type": "string"
                    },
                    "nameSuffixFieldId": {
                      "description": "A field id (from get_item_requirements) or \"field:<label>\" — a select, text or number field of the category whose value ends each piece's name",
                      "type": "string"
                    },
                    "variantValues": {
                      "description": "Allowed values per field — the sizes or variants",
                      "items": {
                        "properties": {
                          "field": {
                            "description": "A field id (from get_item_requirements) or \"field:<label>\"",
                            "type": "string"
                          },
                          "values": {
                            "description": "The values this field may take on the model (select: its options)",
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["field", "values"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["categoryId", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "committed": {
                "description": "True = the plan was executed",
                "type": "boolean"
              },
              "instruction": {
                "description": "Preview mode: what the same call with confirm: true would do",
                "type": "string"
              },
              "models": {
                "description": "One row per model, in the order of the request",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "action": {
                      "description": "\"create\", \"existing\" (same name, reused), \"conflict\" (same name, other settings — left unchanged) or \"invalid\" (skipped)",
                      "type": "string"
                    },
                    "code": {
                      "description": "Why an invalid row is invalid (the app's code)",
                      "type": "string"
                    },
                    "detail": {
                      "description": "How to fix an invalid row",
                      "type": "string"
                    },
                    "differences": {
                      "description": "What differs on a conflict row",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "field": {
                      "description": "The field the code is about",
                      "type": "string"
                    },
                    "modelId": {
                      "description": "The model's id — created (commit) or existing",
                      "type": "string"
                    },
                    "name": {
                      "description": "Model name",
                      "type": "string"
                    },
                    "webUrl": {
