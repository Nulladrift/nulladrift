                      "type": "string"
                    },
                    "name": {
                      "description": "Resource name",
                      "type": "string"
                    },
                    "parentId": {
                      "description": "The parent resource's id (absent at the top level) — what create_location / create_person take as `parentId`",
                      "type": "string"
                    },
                    "path": {
                      "description": "Ancestor NAMES, root→parent (e.g. [\"Schulhaus B\", \"1. Obergeschoss\"]); empty at the top level. When several rows share a name, this is what tells them apart — read it out and let your user pick instead of guessing",
