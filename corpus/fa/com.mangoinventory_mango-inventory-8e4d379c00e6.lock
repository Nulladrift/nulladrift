            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compartment": {
                "description": "Compartment of the container, by name (case-insensitive) or id; null = directly in the container, outside any compartment. Absent = the current compartment (same container) or directly in another container",
                "type": ["string", "null"]
              },
              "containerId": {
                "description": "Item id of the container to pack it into",
