{
  "lockfileVersion": 2,
  "subjects": {
    "com.motorsingh/used-cars": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.motorsingh.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "motorsingh",
        "title": "MotorSingh Used Cars India",
        "version": "1.0.0",
        "websiteUrl": "https://www.motorsingh.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search ~1.5M used cars for sale across India (prices in INR). Use search_used_cars with city/make/model/price/year filters; use find_city if a city name is not recognised. Always share the listing `url` or `search_page_url` with the user so they can see photos and contact the seller.",
      "tools": [
        {
          "name": "find_city",
          "title": "Find a city",
          "description": "Look up Indian cities, localities or states by partial or misspelt name. Ranked best first (exact, starts-with, contains, typo; then by number of listings). Pass a returned slug as `city` to search_used_cars.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Part of the city name, e.g. \"navi\".",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d350ebd5c581e2aebe6f544be78e1130cffc0ad505b4be948630c99468c909bc"
        },
        {
          "name": "get_listing",
          "title": "Get one listing",
          "description": "Full details for one listing by id (from search_used_cars), including the seller description.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Listing id.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7f9314d2ef0a10824ea51c1e7c4790959df367d02654dc4bcf77bd23ca837ec4"
        },
        {
          "name": "search_used_cars",
          "title": "Search used cars in India",
          "description": "Search used cars for sale in India. All filters optional. Returns total count, listings (title, price in INR, year, kms, fuel, transmission, city, image, url) and a search_page_url with the full results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City, locality or state, e.g. \"Pune\", \"Koramangala, Bangalore\", \"Kerala\". Spelling mistakes are tolerated; check place_match in the result to see what was matched. Omit for all of India.",
                "type": "string"
              },
              "fuel": {
                "enum": ["petrol", "diesel", "cng", "electric", "lpg"],
                "type": "string"
              },
              "limit": {
                "description": "Results to return (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Brand, e.g. \"Hyundai\", \"Maruti Suzuki\", \"Mercedes-Benz\".",
                "type": "string"
              },
              "max_kms": {
                "description": "Maximum kilometres driven.",
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in INR (e.g. 1000000 = 10 lakh).",
                "type": "integer"
              },
              "max_year": {
                "description": "Newest model year.",
                "type": "integer"
              },
              "min_price": {
                "description": "Minimum price in INR (e.g. 300000 = 3 lakh).",
                "type": "integer"
              },
              "min_year": {
                "description": "Oldest model year, e.g. 2018.",
                "type": "integer"
              },
              "model": {
                "description": "Model, e.g. \"Creta\", \"Swift\", \"Innova Crysta\".",
                "type": "string"
              },
              "offset": {
                "description": "Pagination offset.",
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "description": "Default newest.",
                "enum": ["newest", "price_asc", "price_desc", "year_desc"],
                "type": "string"
              },
              "transmission": {
                "enum": ["manual", "automatic"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5031f7126b901a0dd148b758fa1180b18b5ee3b9ab583138484944e36693767"
        }
      ],
      "digest": "sha256:9e108e688c632f6b70a937f9e033ddd22bb0a31766de594949207f6a58262fe7"
    }
  }
}
