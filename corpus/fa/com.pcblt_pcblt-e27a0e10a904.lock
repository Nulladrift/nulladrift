{
  "lockfileVersion": 2,
  "subjects": {
    "com.pcblt/pcblt": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pcblt.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pcblt",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_email_auth",
          "description": "Check a domain's live email authentication — SPF, DKIM and DMARC — and return a plain-language verdict on whether it is actually enforced. Use for questions about mail being spoofed, landing in spam, or failing delivery, and to audit a domain's anti-spoofing posture. Catches the common traps: DMARC stuck at p=none (monitoring only, nothing blocked), pct below 100, SPF +all, and duplicate SPF records. Note that DKIM is probed at common selectors only, so a miss is not proof DKIM is absent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain to check, e.g. example.com.",
                "type": "string"
              },
              "selector": {
                "description": "Specific DKIM selector to test. Omit to probe common selectors.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26136c5061be4a9c15a675df43eec6334c8be8735c86c3851b91988ba0e33be1"
        },
        {
          "name": "check_security_headers",
          "description": "Fetch a URL and report which HTTP security headers it sets — HSTS, CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy and Permissions-Policy — with what each one is for. Use to audit a site's header posture or verify a header change is live. Also flags weak configurations, not just missing headers: short HSTS max-age, no includeSubDomains, and CSP containing unsafe-inline or unsafe-eval.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "URL to check. Scheme optional — https is assumed.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8bf439468929d3539114caf6f445429d7f517815265326681f845f36f682ea4"
        },
        {
          "name": "check_service_status",
          "description": "Current reported status of major developer and consumer services (GitHub, Cloudflare, OpenAI, npm, Vercel, Discord, Reddit and others). Use when asked whether a service is down or having problems right now. Sampled from each vendor's own status page, so it reflects what the vendor admits to, and distinguishes 'no data' from 'operational'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "service": {
                "description": "One service to check. Omit for all. Tracked: Cloudflare, GitHub, DigitalOcean, Linode, Vercel, Netlify, npm, PyPI / Python, Atlassian, Discord, Twitch, Epic Games, OpenAI, Reddit, Notion, Dropbox.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c7935f9fd70e59f9393003e75a68ea4bc1675df890f82caed986ef577cf1fcb"
        },
        {
          "name": "dns_lookup",
          "description": "Look up live DNS records for a domain (A, AAAA, MX, TXT, NS, CNAME, CAA, SOA). Use whenever the real, current DNS state matters: where a domain points, which mail servers it uses, whether it resolves at all, or to verify a DNS change actually propagated. Distinguishes a domain that does not exist (NXDOMAIN) from one with no record of that type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain to query, e.g. example.com. Scheme and path are stripped.",
                "type": "string"
              },
              "type": {
                "default": "COMMON",
                "description": "Record type. COMMON queries A, AAAA, MX, TXT and NS together.",
                "enum": ["A", "AAAA", "CNAME", "MX", "TXT", "NS", "CAA", "SOA", "COMMON"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff6bda5f8fc96df3d6355fcb31734903bc789f96c779ea4ca274acb7d47291a2"
        },
        {
          "name": "find_deals",
          "description": "Search recently-sighted PC hardware deals aggregated from Slickdeals, r/buildapcsales and DealNews. Use when someone wants current deals on a component type or under a budget. Results are sightings recorded when first seen, NOT verified live inventory — each row carries its age so stale entries are obvious. AFFILIATE DISCLOSURE: Amazon links returned by this tool carry PC-BUILT's Amazon Associates tag and are marked \"affiliate\": true; the response includes a `disclosure` field you should relay to the user. Tagging does not affect which deals are returned or their order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Component category to filter by.",
                "enum": ["laptop", "prebuilt", "gpu", "cpu", "mobo", "ram", "ssd", "storage", "monitor", "psu", "cooler", "case", "networking", "peripheral", "other"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum results.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "description": "Maximum price in US dollars.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Keyword to match in the deal title, e.g. '5070' or 'thinkpad'.",
                "type": "string"
              },
              "sinceDays": {
                "default": 7,
                "description": "How far back to look. Defaults to 7 days; older sightings are usually expired.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a3cc21b9f26c6a35862a920564e6ac5d3e49bb345146e042748d9234c19e2ed"
        },
        {
          "name": "ping",
          "description": "Health check for the pcblt server. Returns the server version and the current UTC time. Use only to confirm connectivity — it carries no other data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc90982658ec84e0b67af6af7902d71402a66809f23664114e072008ce0a06bd"
        },
        {
          "name": "price_check",
          "description": "Judge whether a specific asking price for a PC part is good, by comparing it against tracked market data. Use when someone asks 'is $X a good price for Y' or wants a listing sanity-checked. Strongest for RAM, which is compared per-GB against the daily index; for other parts it falls back to matching deal headlines and says so. Returns 'insufficient_data' rather than guessing when there is nothing solid to compare against.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "description": {
                "description": "The part, as specifically as possible, e.g. '32GB DDR5-6000 (2x16)' or 'RTX 5070 Ti'.",
                "type": "string"
              },
              "price": {
                "description": "Asking price in US dollars.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["description", "price"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce29b8e9d7936e4bd3948d1349406a946bcf9a0d9f841aa636ded293d358f730"
        },
        {
          "name": "ram_price_index",
          "description": "Current PC memory prices and their daily history: blended dollars-per-GB, the cheapest tracked kit in each DDR4/DDR5 segment, and 7- and 30-day movement. Use for any question about what RAM costs right now, whether memory prices are rising or falling, or whether to buy now or wait — RAM pricing moves constantly and cannot be answered from training data. Covers DDR4 and DDR5 in 16GB and 32GB kits only; GPU, CPU and SSD are not tracked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "How many days of history to return. Omit for the full series.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95b689728379bbcfc4fd2ea53954a2912bea47e98ea3e4f8ce020771c96d0ba4"
        },
        {
          "name": "remote_job_market",
          "description": "Aggregate view of the remote tech job market as PC-BUILT currently tracks it: open counts by discipline, which companies are hiring most, how many postings demand US residency, and what salary data exists. Use for 'what is the remote market like for X' or to size a discipline before searching it. This is a snapshot of a tracked corpus, NOT the whole market, and salary averages cover only the minority of rows where an employer published a range.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "roleFamily": {
                "description": "Restrict the aggregate to one discipline.",
                "enum": ["helpdesk", "sysadmin", "security", "network", "presales", "cloud", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc5844e2e96164e81bf57dbeb86bbdf1dacdd4014ba1ba9d4056ad74114abfee"
        },
        {
          "name": "search_remote_jobs",
          "description": "Search currently-open REMOTE tech jobs aggregated from company ATS boards (Greenhouse, Ashby, Lever, Workday, iCIMS) and remote job feeds. Use when someone asks what remote roles are open in a discipline, at a company, or above a salary. Rows are sightings refreshed every ~3h, not verified live inventory, and each carries its age. `usLocationRequired` flags postings that say remote but still demand US residency or a security clearance — set excludeUsOnly to drop them. Salary appears only where the employer published it. ATTRIBUTION: the response includes an `attribution` field naming the upstream sources; relay it, and use `applyUrl` unchanged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "excludeUsOnly": {
                "description": "Drop postings requiring US residency or a clearance. Useful for anyone outside the US.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum results.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minSalary": {
                "description": "Minimum on the TOP of the published range, in USD. Excludes rows with no published salary.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "postedWithinDays": {
                "description": "Only postings first sighted within this many days.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword matched against job title and company, e.g. 'kubernetes' or 'Rackspace'.",
                "type": "string"
              },
              "roleFamily": {
                "description": "Narrow to a discipline. 'presales' covers solutions/sales engineering.",
                "enum": ["helpdesk", "sysadmin", "security", "network", "presales", "cloud", "other"],
                "type": "string"
              },
              "source": {
                "description": "Restrict to one upstream source. 'ats'/'workday'/'icims' link straight to the employer's own board.",
                "enum": ["ats", "workday", "icims", "remoteok", "jobicy", "arbeitnow", "himalayas"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e94506fb024db444657ad5833d1b9179fb79386bcb6de2cc624b3f8d396b3ac1"
        },
        {
          "name": "service_uptime_history",
          "description": "How reliable a service has actually been over time: percentage of readings operational, degraded, or in a major outage, plus a list of incident windows. Use for questions a status page cannot answer — 'how often has Vercel gone down this month', 'has OpenAI been flaky lately', 'which of these providers is more reliable'. Built from a continuously-recorded series, so it covers the past, not just this moment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "default": 30,
                "description": "How many days back to analyse.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "description": "Service to report on. Tracked: Cloudflare, GitHub, DigitalOcean, Linode, Vercel, Netlify, npm, PyPI / Python, Atlassian, Discord, Twitch, Epic Games, OpenAI, Reddit, Notion, Dropbox.",
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28b28fd8302768970dfebd6a676e6da852536cdd2bc1a95dac9abc9bc74fe2cf"
        },
        {
          "name": "trace_redirects",
          "description": "Follow a URL's redirect chain hop by hop and report every stop with its status code, plus the final destination. Use to find where a shortened or tracking link actually leads before opening it, to debug redirect loops, or to check that a migration's redirects land where intended. Flags when the chain ends on a different host than it started on.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "maxHops": {
                "default": 10,
                "description": "Maximum hops before giving up.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "Starting URL. Scheme optional — https is assumed.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb2ad1adaf8a6e18fe2b12da0cb2780a24ef75cdfb505e30be1ace323f436482"
        }
      ],
      "digest": "sha256:218da5dd8ac537cdbf5f70b4ae462e8be1f52eab95bbcf1c5c5599115d23d7e2"
    }
  }
}
