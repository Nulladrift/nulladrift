      "capabilities": {
        "tools": {}
      },
      "instructions": "Docs for the Datasource Wholesale Background Check API (REST + JSON, API key auth; test https://sandbox.datasourcecorp.app, production https://api.datasourcecorp.app). Start with search_docs or list_operations; get_operation gives an operation's parameters, request and response fields and JSON examples; get_error explains an error code; get_webhook a webhook payload; get_guide_section reads the integration guide. This is the production server: docs only. To try requests, connect to https://sandbox.datasourcecorp.app/mcp with a pk_test_ key.",
      "tools": [
        {
          "name": "get_error",
          "title": "Get an error code",
          "description": "One error code from the error catalog: its HTTP status, what it means, what to do, and whether a retry is safe. Pass the `code` from a problem details body (e.g. client_not_found).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The error `code`, e.g. client_not_found.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an error code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
