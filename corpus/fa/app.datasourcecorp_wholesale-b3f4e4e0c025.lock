        },
        {
          "name": "get_operation",
          "title": "Get one API operation",
          "description": "Full details of one API operation: description, parameters, request body fields, every response and JSON examples (the same text as its section of /llms-full.txt). Pass its operationId from list_operations (e.g. GetCheck), or 'METHOD /path'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "operationId": {
