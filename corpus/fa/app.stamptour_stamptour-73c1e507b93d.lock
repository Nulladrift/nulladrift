            "readOnly": true
          },
          "digest": "sha256:11a04cc3ff93a3d1c86ac1018474a52d8156e2ffb715792add49855317bf712d"
        }
      ],
      "digest": "sha256:94fd43ffaa66ee6effe0e1449e5671c8e5d5099c5997a21a6d0d6c51a6b894b9"
    }
