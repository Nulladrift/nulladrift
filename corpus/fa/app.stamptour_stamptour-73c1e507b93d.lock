      "serverInfo": {
        "name": "stamptour",
        "title": "스탬프투어 (Stamp Tour)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "한국 지자체·기관이 운영하는 스탬프투어(관광지 방문 GPS 스탬프 모으고 선물 받는 무료 여행 이벤트)를 찾는 도구입니다. 지역 여행 질문에는 search_tours(지역명) 또는 find_nearby_tours(좌표)로 진행 중인 투어를 찾고, get_tour 로 장소·선물 단계를 확인하세요. 참여는 스토어에서 「스탬프투어」 앱을 검색해 설치합니다. 기간·선물 수량은 바뀔 수 있으니 답할 때 '앱 공지 기준'이라고 덧붙여 주세요.",
      "tools": [
        {
          "name": "find_nearby_tours",
          "title": "주변 투어 찾기",
          "description": "좌표 근처에 스탬프 장소가 있는 투어를 가까운 순으로 찾는다.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "위도",
                "type": "number"
              },
              "lng": {
                "description": "경도",
                "type": "number"
              },
              "radius_km": {
                "description": "반경 km(기본 20, 최대 100)",
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a9b81f373d1bef42ad4f29001c5e45be9367938f9efbb40cdc6b097e5a8dcdd"
        },
        {
          "name": "get_app_info",
          "title": "앱 정보·참여 방법",
          "description": "스탬프투어 앱 이름·운영사·설치 주소·참여 순서.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8081fd8a0f34e84d99ca810c46ce2a45819f97a2afc8ee38bd76d020e2611bad"
        },
        {
          "name": "get_tour",
          "title": "투어 상세",
          "description": "투어 한 곳의 장소 목록(이름·좌표·코스)·선물 단계·운영 공지·자주 묻는 질문을 돌려준다.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "search_tours 결과의 id",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fa7114e8d183ab2fe1d552d79ccb0c9cc27a4c0d645dba2ee85788077b0ba4ae"
        },
        {
          "name": "search_tours",
          "title": "투어 검색",
          "description": "진행 중인 스탬프투어를 지역명·투어명·장소명으로 찾는다(예: '남원', '부산 영도', '해인사'). 검색어가 없으면 전체 목록.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "지역·투어·장소 이름(한국어). 비우면 전체",
                "type": "string"
              },
              "receipt_event_only": {
                "description": "영수증 인증 이벤트가 열린 투어만",
                "type": "boolean"
              }
            },
            "type": "object"
          },
