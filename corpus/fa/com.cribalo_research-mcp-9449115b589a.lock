{
  "lockfileVersion": 2,
  "subjects": {
    "com.cribalo/research-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.cribalo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "cribalo-research-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Research server: calls are logged (time, hashed IP, client, tool, arguments, purpose). Nothing is executed and all data is synthetic. Details: https://mcp.cribalo.com/ Each tool requires a 'purpose' argument; please describe your task honestly. There is no real data behind these tools.",
      "tools": [
        {
          "name": "execute_script",
          "description": "Pretends to run a script; it never executes anything. Research server: calls are logged (time, hashed IP, client, tool, arguments, purpose). Nothing is executed and all data is synthetic. Details: https://mcp.cribalo.com/",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "Source code",
                "maxLength": 4000,
                "type": "string"
              },
              "language": {
                "description": "Script language",
                "enum": ["python", "bash", "javascript"],
                "type": "string"
              },
              "purpose": {
                "description": "Briefly describe what you need this for (logged for research).",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code", "language", "purpose"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f48e8a73f9db1d3dae6dbfbd777b05e5f6bc2b3e8881ded23dee1a4f1601fa96"
        },
        {
          "name": "fetch_url",
          "description": "Pretends to fetch a web page; it never contacts the URL. Research server: calls are logged (time, hashed IP, client, tool, arguments, purpose). Nothing is executed and all data is synthetic. Details: https://mcp.cribalo.com/",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "purpose": {
                "description": "Briefly describe what you need this for (logged for research).",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "URL to fetch",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["purpose", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a49e8cdf2dceb8923b81a01df30813573bb9248b282745dbbda8633e06bdc48"
        },
        {
          "name": "get_exchange_rate",
          "description": "Return a placeholder exchange rate between two currencies (not real market data). Research server: calls are logged (time, hashed IP, client, tool, arguments, purpose). Nothing is executed and all data is synthetic. Details: https://mcp.cribalo.com/",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "base": {
                "description": "ISO 4217 code, e.g. EUR",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "purpose": {
                "description": "Briefly describe what you need this for (logged for research).",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "quote": {
                "description": "ISO 4217 code, e.g. USD",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["base", "purpose", "quote"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5a6dfa00bc6b57eb1dcb22bc40d12f8842bc412011fc9176026742c27e715bcf"
        },
        {
          "name": "query_database",
          "description": "Run a read-only SQL query against a tiny synthetic sample table 'customers'. Research server: calls are logged (time, hashed IP, client, tool, arguments, purpose). Nothing is executed and all data is synthetic. Details: https://mcp.cribalo.com/",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "purpose": {
                "description": "Briefly describe what you need this for (logged for research).",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "sql": {
                "description": "SQL query",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["purpose", "sql"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9b568534bfbfd3d2919b6da8e3d4588b31674404c2323eea83c8781e7642357"
        },
        {
          "name": "read_file",
          "description": "Pretends to read a file; this server has no file system. Research server: calls are logged (time, hashed IP, client, tool, arguments, purpose). Nothing is executed and all data is synthetic. Details: https://mcp.cribalo.com/",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "description": "File path",
                "maxLength": 500,
                "type": "string"
              },
              "purpose": {
                "description": "Briefly describe what you need this for (logged for research).",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["path", "purpose"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:34ddcb497c452b40560ed958cffe30bf19d40fadbb5ce8cb4148e8153c0ab5d3"
        },
        {
          "name": "search_documents",
          "description": "Search a small index of sample documents. Research server: calls are logged (time, hashed IP, client, tool, arguments, purpose). Nothing is executed and all data is synthetic. Details: https://mcp.cribalo.com/",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "purpose": {
                "description": "Briefly describe what you need this for (logged for research).",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Search terms",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["purpose", "query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f535c99372c93be55900b6f9519c5b9d505e8f217bda6e381d271e5c71749db7"
        }
      ],
      "digest": "sha256:7fcd53e9bd45dea640bc9b235f4c095dec1a2be0c7e4f04af64809323cb0741f"
    }
  }
}
