        {
          "name": "estimate_startup_costs",
          "title": "Estimate startup costs",
          "description": "Adds up one-time startup costs and monthly costs and works out cash left and months of runway (cash left divided by monthly costs, rounded down to 0.1, assuming no sales). Same formula as https://profitdrawer.com/tools/startup-cost-calculator.html. Optional preset with example amounts: Cleaning, Lawn care, Vending machine, Food truck, Any business; cost lists you pass replace the preset lines. Preset amounts are rough examples, not quotes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "monthly_costs": {
                "description": "Monthly costs [{label, amount}] in USD. Replaces the preset monthly lines.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "USD",
                      "minimum": 0,
                      "type": "number"
                    },
                    "label": {
                      "maxLength": 60,
                      "type": "string"
                    }
                  },
                  "required": ["amount"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "one_time_costs": {
                "description": "One-time costs [{label, amount}] in USD. Replaces the preset one-time lines.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "USD",
                      "minimum": 0,
                      "type": "number"
                    },
                    "label": {
                      "maxLength": 60,
                      "type": "string"
                    }
                  },
                  "required": ["amount"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "preset": {
                "description": "Example cost lines from the website calculator.",
                "enum": ["Cleaning", "Lawn care", "Vending machine", "Food truck", "Any business"],
                "type": "string"
              },
              "starting_cash": {
                "description": "Starting cash in USD. Default 0.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
