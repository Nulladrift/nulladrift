        {
          "name": "calculate_price_per_job",
          "title": "Calculate price per job",
          "description": "Works out a price for one service job: cost = hours x hourly pay + materials + travel + monthly overhead / jobs per month; price = cost / (1 - profit margin). Also returns profit per job, monthly revenue and break-even jobs per month. Same formula as https://profitdrawer.com/tools/price-per-job-calculator.html. Margins above 95% are treated as 95%.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hourly_rate": {
                "description": "Your pay per hour in USD.",
                "minimum": 0,
                "type": "number"
              },
              "hours": {
                "description": "Hours one job takes.",
                "minimum": 0,
                "type": "number"
              },
              "jobs_per_month": {
                "description": "Jobs expected per month; the overhead is shared across them. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "materials": {
                "description": "Materials per job in USD. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "monthly_overhead": {
                "description": "Monthly overhead (insurance, phone, software, ...) in USD. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "profit_margin_percent": {
                "description": "Profit margin as a percent of the price, for example 20.",
                "minimum": 0,
                "type": "number"
              },
              "travel": {
                "description": "Travel cost per job in USD. Default 0.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["hourly_rate", "hours", "profit_margin_percent"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "breakeven": {
                "type": "string"
              },
              "breakeven_jobs": {
                "type": ["integer", "null"]
              },
              "citations": {
