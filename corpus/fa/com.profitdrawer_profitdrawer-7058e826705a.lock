      "instructions": "Read-only data published by ProfitDrawer (https://profitdrawer.com): questions and answers about small business bookkeeping, taxes and money; the product list with prices and formats; IRS datasets (tax deadlines, standard mileage rates); and four calculators (startup costs, price per job, loan payoff, self-employed tax set-aside) that use the same formulas as the tools on https://profitdrawer.com/tools/. Each result includes its source URL.",
      "tools": [
        {
          "name": "calculate_loan_payoff",
          "title": "Calculate loan payoff",
          "description": "Works out how many months a loan takes to pay off and the total interest, month by month (one month of interest = APR / 12 is added, then the payment is taken off), and what an optional extra monthly payment saves in interest and time. Same method as https://profitdrawer.com/tools/loan-payoff-calculator.html. A close estimate; lenders can differ slightly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apr_percent": {
                "description": "Annual interest rate (APR) in percent, for example 6.",
                "minimum": 0,
                "type": "number"
              },
              "balance": {
                "description": "Loan balance in USD.",
                "minimum": 0,
                "type": "number"
              },
              "extra_payment": {
                "description": "Optional extra payment each month in USD.",
                "minimum": 0,
                "type": "number"
              },
              "monthly_payment": {
                "description": "Monthly payment in USD.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["apr_percent", "balance", "monthly_payment"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "citations": {
