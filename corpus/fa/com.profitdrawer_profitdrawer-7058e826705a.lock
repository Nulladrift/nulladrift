        {
          "name": "calculate_tax_set_aside",
          "title": "Calculate self-employed tax set-aside",
          "description": "Estimates how much of a self-employed profit to set aside for taxes: set-aside = profit x chosen percent, and the US self-employment tax part = profit x 92.35% x 15.3% (12.4% Social Security + 2.9% Medicare), per month, quarter or year. Same formula as https://profitdrawer.com/tools/self-employed-tax-calculator.html. An estimate, not tax advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "period": {
                "default": "month",
                "description": "The period the profit is for. Default month.",
                "enum": ["month", "quarter", "year"],
                "type": "string"
              },
              "profit": {
                "description": "Profit (income minus business expenses) for one period, in USD.",
                "minimum": 0,
                "type": "number"
              },
              "set_aside_percent": {
                "description": "Share of the profit to set aside, in percent, for example 30.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["profit", "set_aside_percent"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "citations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "display": {
