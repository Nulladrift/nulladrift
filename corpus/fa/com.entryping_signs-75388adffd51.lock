{
  "lockfileVersion": 2,
  "subjects": {
    "com.entryping/signs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://entryping.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "entryping-signs",
        "title": "EntryPing sign makers",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use list_signs to find a printable sign maker, then make_sign_link to get a link with the wording filled in. The person opens the link, edits any line and sees the preview free. Printing and PDF export require EntryPing Pro, so say that when you share a link.",
      "tools": [
        {
          "name": "list_signs",
          "title": "Find a sign maker",
          "description": "Lists EntryPing printable sign makers (closed, out to lunch, holiday closings, out of order, meeting in progress, QR code signs and more) with each one's default wording. Pass a few words to narrow the list.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Words to match against sign names, for example \"thanksgiving\" or \"out of order\". Leave out to list every sign.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a sign maker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d5ce8718305f471f6fb91bcd94c39e644932951cbc2a430e71e7d687e84e26f"
        },
        {
          "name": "make_sign_link",
          "title": "Make a sign link",
          "description": "Returns a link that opens an EntryPing sign maker with the wording already filled in. The person can edit every line and preview free; printing and PDF export require EntryPing Pro. Nothing is saved.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "The business name to print on the sign.",
                "maxLength": 200,
                "type": "string"
              },
              "head": {
                "description": "The large main line, for example \"Closed for Thanksgiving\".",
                "maxLength": 200,
                "type": "string"
              },
              "note": {
                "description": "One sentence under the main lines, such as a phone number or where to leave deliveries.",
                "maxLength": 200,
                "type": "string"
              },
              "slug": {
                "description": "Which sign maker, from list_signs, for example \"closed-for-thanksgiving\".",
                "type": "string"
              },
              "style": {
                "description": "Layout. Leave out to keep the sign's own.",
                "enum": ["bold", "clean", "notice", "clock", "hours"],
                "type": "string"
              },
              "sub": {
                "description": "A short label before the time, for example \"Open again\".",
                "maxLength": 200,
                "type": "string"
              },
              "time": {
                "description": "A time or date, for example \"Friday at 9\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a sign link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8969449faf1484c8fbea73bbcef31976d3e1a5a364aa359f57ac8fb4d67d8fb"
        }
      ],
      "digest": "sha256:6b42aad34885dee69acf71eaf0bfc9a956850f15e741bc2fe31bde721d5df99a"
    }
  }
}
