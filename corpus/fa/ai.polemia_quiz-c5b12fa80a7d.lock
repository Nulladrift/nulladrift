{
  "lockfileVersion": 2,
  "subjects": {
    "ai.polemia/quiz": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://polemia.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "polemia",
        "title": "Polemia",
        "version": "1.0.0",
        "websiteUrl": "https://polemia.ai"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Polemia (https://polemia.ai) is a free live quiz game played on phones: one person hosts, everyone else joins with a short code, no sign-up. Use create_quiz when the user wants a new quiz on a topic for a class, party, team or pub quiz; give them BOTH links it returns (host_url for whoever runs the game, join_url or the code for the players). Use find_quizzes first when a ready-made quiz would do. Use daily_question for Polemia's one question of the day for the whole world.",
      "tools": [
        {
          "name": "create_quiz",
          "title": "Make a Polemia quiz",
          "description": "Make a new live multiple-choice quiz on Polemia about any topic, ready to play on phones with a join code. Use it when the user wants a quiz, trivia game or icebreaker for a class, party, family, team or pub quiz. Takes 10 to 60 seconds. Returns join_url and code (for the players), host_url (for the person running the game: opening it makes that browser the host, and it works once), qr_url (a QR code image of the join link) and how_it_works, a short explanation of the game. Always give the user both host_url and join_url. \"facts\" quizzes have right answers; \"opinions\" quizzes are scored by what the majority picks. Topics that target people, politics, war or adult material are refused.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "for_children_under": {
                "description": "Make every question suitable for children under this age.",
                "maximum": 17,
                "minimum": 3,
                "type": "integer"
              },
              "kind": {
                "default": "facts",
                "description": "\"facts\": questions with a right answer. \"opinions\": fun questions where the most popular answer scores.",
                "enum": ["facts", "opinions"],
                "type": "string"
              },
              "language": {
                "description": "Write the quiz in this language (BCP-47, e.g. \"es\", \"de\", \"pt-BR\"). Leave out to use the language the topic is written in.",
                "type": "string"
              },
              "questions": {
                "default": 10,
                "description": "How many questions, 1 to 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "What the quiz is about, e.g. \"volcanoes\", \"Harry Potter\", \"the human body for 9 year olds\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "The join code players type at polemia.ai.",
                "type": "string"
              },
              "host_link_expires_at": {
                "format": "date-time",
                "type": "string"
              },
              "host_url": {
                "format": "uri",
                "type": "string"
              },
              "how_it_works": {
                "type": "string"
              },
              "join_url": {
                "format": "uri",
                "type": "string"
              },
              "kind": {
                "enum": ["facts", "opinions"],
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "qr_url": {
                "format": "uri",
                "type": "string"
              },
              "questions": {
                "type": "integer"
              },
              "topic": {
                "type": "string"
              }
            },
            "required": ["code", "host_link_expires_at", "host_url", "how_it_works", "join_url", "kind", "language", "qr_url", "questions", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Make a Polemia quiz"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b634d7afb86a8b8fb338fa644c6745847038aee02bffcfdeba18200f862cdb99"
        },
        {
          "name": "daily_question",
          "title": "Polemia question of the day",
          "description": "Today's Polemia question: one opinion question a day, answered anonymously by people all over the world. Free. Use it when the user wants a question of the day, a conversation starter, or to see what the world thinks. Returns the question, its answer options and answer_url, where the user votes and then sees everyone's results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Show the question in this language when a translation exists (BCP-47). Default English.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer_url": {
                "format": "uri",
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "how_it_works": {
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "options": {
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "past_results_url": {
                "format": "uri",
                "type": "string"
              },
              "question": {
                "type": ["string", "null"]
              }
            },
            "required": ["answer_url", "date", "how_it_works", "language", "options", "past_results_url", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Polemia question of the day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59b0d05ebeb96548d1b732f727cc4990c72633c9f222686c1b71a3bf99447ee9"
        },
        {
          "name": "find_quizzes",
          "title": "Find ready-made Polemia quizzes",
          "description": "Search Polemia's free public library of ready-made quizzes. Instant and free. Use it when the user wants a quiz on a common topic and does not need a new one written. Returns up to 10 quizzes, each with a title, question count, kind, language and play_url (the quiz's page, where the user starts a live game with it).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Only quizzes in this language (BCP-47). Leave out for every language.",
                "type": "string"
              },
              "query": {
                "description": "A word or two about the topic, e.g. \"space\", \"football\", \"Christmas\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "browse_url": {
                "format": "uri",
                "type": "string"
              },
              "how_it_works": {
                "type": "string"
              },
              "quizzes": {
                "items": {
                  "properties": {
                    "for_children_under": {
                      "type": ["integer", "null"]
                    },
                    "kind": {
                      "enum": ["facts", "opinions"],
                      "type": "string"
                    },
                    "language": {
                      "type": "string"
                    },
                    "play_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "questions": {
                      "type": "integer"
                    },
                    "sample_question": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["kind", "language", "play_url", "questions", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "How many quizzes match in all.",
                "type": "integer"
              }
            },
            "required": ["browse_url", "how_it_works", "quizzes", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find ready-made Polemia quizzes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7124ae4e59d0c85d3743a148dcca176e9f408fa9052d0a77b6a90314c3c614da"
        }
      ],
      "digest": "sha256:fc9ff2b967a73bad9eea68a372b4e01880399acaec0a536181c7a0b369ca27c5"
    }
  }
}
