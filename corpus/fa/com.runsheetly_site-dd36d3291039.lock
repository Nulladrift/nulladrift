          },
          "digest": "sha256:6303ebfdc59e2677e142c5d70880581c4d4dae637163d57ee2b1ae9327ca6081"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Runsheetly dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
