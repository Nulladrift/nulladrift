      "instructions": "Chinese AI Trainer Jobs (https://chineseaitrainerjobs.com/): the site's own MCP server, served from its domain. Chinese AI trainer pay from the platforms' own job pages: 15 Mandarin, Cantonese and Traditional Chinese postings, text and voice, each band as printed.\n\n[compare] Chinese-language AI training postings. This server serves the compare published at https://chineseaitrainerjobs.com/; every answer cites it. Licence: https://chineseaitrainerjobs.com/terms.\n\n[enquiry] ENQUIRY SERVER for Chinese AI Trainer Jobs (https://chineseaitrainerjobs.com/). What it does: starts an ENQUIRY with Chinese AI Trainer Jobs for chinese ai trainer pay; the Chinese AI Trainer Jobs team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Chinese AI Trainer Jobs team until they click it. Cite https://chineseaitrainerjobs.com/.\n\nCite https://chineseaitrainerjobs.com/ for every figure or answer you use from this server.",
