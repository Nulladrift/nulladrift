      "serverInfo": {
        "name": "com.halowerk/buyers",
        "title": "HALOWERK Developer Tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Five pay-per-use tools. Send x402 v2 PaymentPayload in params._meta[\"x402/payment\"]. Prices are in USDC on Base. See https://halowerk.com/buyers/README.md.",
      "tools": [
        {
          "name": "domain_profile",
          "description": "Get technology, DNS, mail security, TLS and hosting findings in one domain profile. 0.035 USDC per request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name only, for example example.com; no URL, port or path.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "example": {
              "domain": "example.com"
            },
            "payment": "x402-v2"
          },
          "digest": "sha256:07d9163a27985974af7b40f1e6a29ea4a3ab9978905938b0cca83d403d5dfa2d"
        },
        {
          "name": "email_batch",
          "description": "Check email syntax, domain routing and disposable-address signals in one batch. 0.0006 USDC per address, minimum 0.001 USDC per request; up to 100 addresses.",
          "inputSchema": {
            "properties": {
              "emails": {
                "description": "Between 1 and 100 addresses. Billed at 0.0006 USDC per address with a 0.001 USDC minimum charge.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "smtp_check": {
                "default": false,
                "description": "Ask for an optional SMTP probe. Off by default, heavily throttled, one attempt per target and never retried. Without it the verdict of a routable address stays \"unknown\".",
                "type": "boolean"
              }
            },
            "required": ["emails"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "example": {
              "emails": ["not-an-email", "also-not-an-email"],
              "smtp_check": false
            },
            "payment": "x402-v2"
          },
          "digest": "sha256:bf6422d869658e6b237ee9f370fc14374a3ab101da91f242154262b7d872f43a"
        },
        {
          "name": "ip_reputation",
          "description": "Screen one IP for reputation risks for 0.001 USDC, or check a batch of up to 100 IPs for 0.050 USDC.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "anyOf": [
                  {
                    "properties": {
                      "ip": {
                        "type": "string"
                      },
                      "ips": {
                        "description": "Stapel bis 25 Adressen",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "ips": {
                        "items": {
                          "maxLength": 45,
                          "minLength": 2,
                          "type": "string"
                        },
                        "maxItems": 100,
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["ips"],
                    "type": "object"
                  }
                ]
              },
              "mode": {
                "enum": ["single", "batch"],
                "type": "string"
              }
            },
            "required": ["input", "mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "example": {
              "input": {
                "ip": "1.1.1.1"
              },
              "mode": "single"
            },
            "payment": "x402-v2"
          },
          "digest": "sha256:ef0f6c1956e5379081b265bcd5048b314bcf15a4ec93e7d7d50979140bb7520b"
        },
        {
          "name": "speech_to_text",
          "description": "Turn audio into timestamped text with optional speaker separation. Transcription: 0.020 USDC; speaker separation: 0.025 USDC per started minute (1–30).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "confidence_threshold": {
                        "default": 0.7,
                        "description": "Words below this confidence are listed separately as the passages worth checking.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "duration_minutes": {
                        "description": "Length of the recording in started minutes — this is what you are billed for. A longer file is refused with its real length and nothing is charged; a shorter one costs what you declared, and the answer says how much less it would have been.",
                        "maximum": 30,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "include_words": {
                        "default": true,
                        "description": "Return every word with its timestamp. Off returns only the text, paragraphs and utterances.",
                        "type": "boolean"
                      },
                      "language": {
                        "description": "BCP-47 code such as de, en, es. \"multi\" enables multilingual recognition and is billed at the provider's higher rate. Omit to let the recogniser detect the language.",
                        "maxLength": 12,
                        "type": "string"
                      },
                      "source": {
                        "additionalProperties": false,
                        "description": "The recording. Either url or content_base64.",
                        "properties": {
                          "content_base64": {
                            "description": "The file inline, base64. Larger files must come by url.",
                            "maxLength": 12000000,
                            "type": "string"
                          },
                          "filename": {
                            "maxLength": 260,
                            "type": "string"
                          },
                          "url": {
                            "description": "Public http(s) URL of the audio or video file.",
                            "maxLength": 2048,
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    },
                    "required": ["duration_minutes", "source"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "confidence_threshold": {
                        "default": 0.7,
                        "description": "Words below this confidence are listed separately.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "duration_minutes": {
                        "description": "Length of the recording in started minutes — this is what you are billed for. A longer file is refused with its real length and nothing is charged.",
                        "maximum": 30,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "include_turn_text": {
                        "default": true,
                        "description": "Include the text of each turn. Off returns only the timeline and the figures.",
                        "type": "boolean"
                      },
                      "language": {
                        "description": "BCP-47 code such as de, en. \"multi\" enables multilingual recognition at the provider's higher rate. Omit to detect.",
                        "maxLength": 12,
                        "type": "string"
                      },
                      "source": {
                        "additionalProperties": false,
                        "description": "The recording. Either url or content_base64.",
                        "properties": {
                          "content_base64": {
                            "description": "The file inline, base64.",
                            "maxLength": 12000000,
                            "type": "string"
                          },
                          "filename": {
                            "maxLength": 260,
                            "type": "string"
                          },
                          "url": {
                            "description": "Public http(s) URL of the audio or video file.",
                            "maxLength": 2048,
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    },
                    "required": ["duration_minutes", "source"],
                    "type": "object"
                  }
                ]
              },
              "mode": {
                "enum": ["stt", "diarize"],
                "type": "string"
              }
            },
            "required": ["input", "mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "example": {
              "input": {
                "duration_minutes": 1,
                "language": "en",
                "source": {
                  "url": "https://halowerk.com/buyers/example.wav"
                }
              },
              "mode": "diarize"
            },
            "payment": "x402-v2"
          },
          "digest": "sha256:52c78c9d9813e76294ae7861f8b8a000f69f012545ec6876fb25fc7eae8f0308"
        },
        {
          "name": "technology_stack",
          "description": "Detect a website’s CMS, frameworks and hosting technology for integration planning. 0.005 USDC per request.",
          "inputSchema": {
            "properties": {
              "refresh": {
                "default": false,
                "description": "Bypass the 24 hour cache and fetch the origin again. Same price.",
                "type": "boolean"
              },
              "render": {
                "default": false,
                "description": "Render the page in a headless browser before matching. Off by default: plain delivery is faster, cheaper on the origin and enough for almost every site. Turn it on for pages that build their markup entirely in JavaScript.",
                "type": "boolean"
              },
              "url": {
                "description": "Absolute http or https URL. Only the host matters for the cache; a path is followed but never probed separately.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "example": {
              "url": "https://example.com/"
            },
            "payment": "x402-v2"
          },
          "digest": "sha256:dcf9177c7a467511e00fedbdfec401fa7b223117306efe1d15ff7c424a9c2dfc"
        }
      ],
      "digest": "sha256:67400758653dfeb5ed60c64e61ff0c95c53267f86f9c83af62de4865743224e9"
    }
