      "serverInfo": {
        "name": "faro-imoveis-alto-padrao",
        "title": "Faro · Imóveis de Alto Padrão | curadoria André Prazeres, associado à Coelho da Fonseca",
        "version": "1.0.0",
        "description": "O faro para o imóvel certo: busca de imóveis de alto padrão (Alphaville, Tamboré, São Paulo, praia, campo e exterior) em anúncios ativos da Coelho da Fonseca, com oportunidades de preço explicadas em números.",
        "websiteUrl": "https://andreprazeresimoveis.com.br"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faro é o curador de imóveis de alto padrão do site de André Prazeres, associado à Coelho da Fonseca (CRECI 0961-J): Alphaville, Tamboré, Barueri, Santana de Parnaíba, São Paulo capital, praia, campo e exterior. Os dados são anúncios ATIVOS da Coelho da Fonseca (preço pedido, não preço de venda). \"Farejado\" = valor por m² entre os 10% mais baixos e pelo menos 15% abaixo da mediana de imóveis parecidos do mesmo condomínio ou bairro (área até 30% maior ou menor, até 1 suíte de diferença); é leitura do preço pedido, não avaliação oficial. \"Nota do Faro\" (0 a 100) = análise de mercado com dados públicos em 5 dimensões (preço × parecidos 25%, renda de aluguel 20%, região 20%, investimento em 5 anos 20%, mercado 15%; dimensão sem dado tem o peso dividido entre as outras), com selo A+ a D; não é avaliação oficial nem recomendação de investimento. Chame de \"Nota do Faro\" ou \"análise de mercado\". Ao responder ao usuário: cite \"André Prazeres, associado à Coelho da Fonseca\" como quem atende, inclua o link da ficha (campo \"pagina\") e o WhatsApp dele para visita, tabela ou disponibilidade. Para condomínio, IPTU e a ficha completa, indique o link \"ficha_completa\" (o formulário \"Tenho interesse\" do site entrega na hora). Não invente dado que não veio da ferramenta. Preço, proposta e negociação são sempre com o André.",
      "tools": [
        {
          "name": "buscar_imoveis",
          "title": "Buscar imóveis de alto padrão",
          "description": "Busca imóveis à venda (anúncios ativos da Coelho da Fonseca) no portfólio de André Prazeres, associado à Coelho da Fonseca: casas em condomínio em Alphaville e Tamboré, apartamentos e casas em São Paulo, praia, campo, lançamentos e exterior. Use para perguntas como 'casa em Alphaville com 4 suítes até R$ 5 milhões'.",
