      },
      "instructions": "AI Data Provenance (https://aidataprovenance.com/): the site's own MCP server, served from its domain. AI training data provenance: what the AI Act and AB 2013 say a developer must publish, and the UK exception for text and data analysis for non-commercial research.\n\n[checker] Which provenance text speaks to your data?. This server serves the checker published at https://aidataprovenance.com/; every answer cites it. Licence: https://aidataprovenance.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Data Provenance (https://aidataprovenance.com/). What it does: starts an ENQUIRY with AI Data Provenance for ai training data provenance; the AI Data Provenance team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Data Provenance team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-data-with-provenance-record\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://aidataprovenance.com/.\n\nCite https://aidataprovenance.com/ for every figure or answer you use from this server.",
