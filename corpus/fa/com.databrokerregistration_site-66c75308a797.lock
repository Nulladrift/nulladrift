      "instructions": "Data Broker Registration (https://databrokerregistration.com/): the site's own MCP server, served from its domain. Data broker registration in California and Texas: who has to register, the annual fees and the daily fines, from the statutes and regulators' pages read 2026-11-06.\n\n[checker] Data broker registration check. This server serves the checker published at https://databrokerregistration.com/; every answer cites it. Licence: https://databrokerregistration.com/terms.\n\n[enquiry] ENQUIRY SERVER for Data Broker Registration (https://databrokerregistration.com/). What it does: starts an ENQUIRY with Data Broker Registration for data broker registration; the Data Broker Registration team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Data Broker Registration team until they click it. Cite https://databrokerregistration.com/.\n\nCite https://databrokerregistration.com/ for every figure or answer you use from this server.",
