      },
      "transport": {
        "type": "http",
        "url": "https://anymark.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "anymark",
        "title": "Anymark",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_logo_name",
          "title": "Check a name for a logo",
          "description": "Checks how a business name will read on a logo and suggests a shorter logo version when the name has a legal ending (Inc, LLC), a web address, a generic company word (Group, Solutions) or a word for what the business sells. The rules come from a study of about 1,000 well-designed brand logos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_type": {
                "description": "tech for software and tech products, other for everything else",
                "enum": ["tech", "other"],
                "type": "string"
              },
              "name": {
                "description": "The business name as typed",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a name for a logo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b5e0c925b18abbfa50f418c55ec73ef29852304ad485c256590002e18b49102"
        },
        {
          "name": "create_logo_previews",
          "title": "Create logo previews",
          "description": "Shows 6 logo previews for a business, made from Anymark's designer templates with the business name set in each: icon logos picked for the business description, and letter logos built on the name's first letter, each with why it fits. Each preview links to the Anymark editor, where the logo can be customized. Previews are not licensed for use until the logo is bought on Anymark. `page` (1-5) shows further previews for the same business.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "The name exactly as it should appear on the logo",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "description": "What the business does, in a sentence or two",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Which page of previews, 1 by default",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "style": {
                "description": "Optional look to favor",
                "enum": ["classic", "modern", "playful"],
                "type": "string"
              }
            },
            "required": ["business_name", "description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create logo previews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://anymark/logo-previews.html"
            },
            "ui/resourceUri": "ui://anymark/logo-previews.html"
          },
          "digest": "sha256:8329fa2eb00af3ff730d8687726433e5d31165447531fccf2f1024a97a17e0df"
        }
      ],
      "resources": [
        {
          "uri": "ui://anymark/logo-previews.html",
          "name": "Logo previews",
          "description": "Cards for create_logo_previews",
