      },
      "instructions": "Sign in at https://crawdar.com/account to create an API key. Keys share 25 free fresh searches daily; cached results and polling are free. At most two fresh searches run concurrently. Use start_lead_search for queued work, poll the same job, and honor Retry-After rather than launching duplicate searches. Save lists at https://crawdar.com/lists. Browse opt-in demand and provider profiles at https://crawdar.com/network and the shared problem graph at https://crawdar.com/graph. These are reported observations, not endorsements or funded work. Maintain private opportunity research at https://crawdar.com/workspaces with account-linked keys; read revision before changes. Public complaints do not prove purchase intent.  Use sandbox_businesses to test your integration for free. Use research_businesses for a quick qualified-prospect brief. Use start_lead_search then get_lead_search for progress, cursor pagination, refinement, and export. Read prospectStatus, criteria, whyMatch, and contactRoute before acting. Compact results expose sourceUrls; full REST and sandbox results retain evidence[].url. If a job returns retryable true, call retry_lead_search. Keep jobToken private and inspect diagnostics before treating zero results as exhaustive.",
