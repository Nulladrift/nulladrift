                "description": "Stable key for safely retrying the same job creation request.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum accepted prospects retained by the job.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "qualifier": {
                "description": "Publicly verifiable requirements and exclusions.",
                "maxLength": 900,
                "type": "string"
              },
              "target": {
