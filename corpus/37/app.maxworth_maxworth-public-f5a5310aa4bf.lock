            "readOnly": true
          },
          "digest": "sha256:d39671c700cc78f02c2432bd85f65ee3a485ec572ca04afa836fa921b480b812"
        },
        {
          "name": "list_credits",
          "title": "List a card's statement credits with reset dates",
          "description": "Only the dollar credits on a card: value per year, per-cycle cap, cycle, whether an annual credit resets January 1 or on the card anniversary, and enrollment. Use for \"when does the X credit reset\" questions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "card": {
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Restrict to one market: us, ca (Canada) or au (Australia).",
                "enum": ["us", "ca", "au"],
                "type": "string"
              }
            },
            "required": ["card"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3910eae3ad8283c537e62379cb15f3640aa888657c4a6f385b0670c22043ab7d"
        },
        {
          "name": "search",
          "title": "Search MaxWorth",
          "description": "Search every public MaxWorth page: credit card pages (US, Canada, Australia), one page per statement credit, and all guides, reviews and news articles. Returns ids to pass to fetch. Use for open-ended questions; the dedicated tools (get_card, list_credits, search_cashback_portals, search_card_offers) answer structured questions faster.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Search query, e.g. \"Amex Platinum hotel credit\" or \"best credit card tracker apps\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f809b7a2b4e42bdd2f08fe0028ef2aea9541af92aa1c1ed14ad92f047968500"
        },
        {
          "name": "search_card_offers",
          "title": "Live Amex / Chase card-linked offers",
          "description": "Card-linked merchant offers (Amex Offers, Chase Offers) that are live today, as seen by MaxWorth browser-extension users: merchant, the deal, fine print, latest expiry seen, and which cards it has appeared on. Filter by issuer, merchant, card, expiry window or popularity; with no filters it returns an overview. Offers are targeted per account: a card listed means several users saw the offer on that card, not that every cardholder has it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "card": {
                "description": "List offers seen on one card, e.g. \"Chase Sapphire Preferred\" or \"Amex Gold\"",
                "minLength": 2,
                "type": "string"
              },
              "expiring_within_days": {
                "description": "Only offers whose latest seen expiry is within this many days",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "issuer": {
                "enum": ["amex", "chase"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "merchant": {
                "description": "Store or brand, e.g. \"nike\", \"hilton\", \"youtube\"",
                "minLength": 2,
                "type": "string"
              },
              "popular_only": {
                "description": "Only offers MaxWorth flags as popular",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:019d0fe7c8058744ff87d063bd231a3bba5857132d4d5606676817fd3164f247"
        },
        {
          "name": "search_cards",
          "title": "Search credit cards",
          "description": "Find credit cards in the MaxWorth catalogue by name or issuer (US, Canada, Australia). Returns name, issuer, annual fee and the canonical page URL to cite.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Restrict to one market: us, ca (Canada) or au (Australia).",
                "enum": ["us", "ca", "au"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Card name or part of it, e.g. \"sapphire reserve\", \"amex gold\", \"aeroplan\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88fb8691ef5b7aa38caa19bf49e67f41788cf19ba95dbb9dd14cbe9e784ec8a9"
        },
        {
          "name": "search_cashback_portals",
          "title": "Cashback portal rates for a store",
          "description": "Current shopping-portal cashback / miles / points rates for an online store (Rakuten, TopCashback, airline and bank malls), checked daily by MaxWorth. Returns each portal's rate and the comparison page URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 1,
                "description": "How many matching stores to return",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "store": {
                "description": "Store name or domain, e.g. \"nike\", \"bestbuy.com\"",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66cd587a03febb1767752e344b00f230db968e7b468073e962eeb9ef15ec41fa"
        }
      ],
