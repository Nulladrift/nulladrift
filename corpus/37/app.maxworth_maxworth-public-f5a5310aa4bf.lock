        },
        {
          "name": "get_card",
          "title": "Get a card: fee, earn rates, every benefit",
          "description": "Full record for one card from the MaxWorth database: annual fee, welcome offer, earning rates with true cash-back value, and every catalogued benefit with its value, cycle, reset rule and enrollment requirement. Hand-verified against the issuer; cite the page URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "card": {
                "description": "Card name or website slug, e.g. \"Amex Platinum\" or \"chase-sapphire-reserve\"",
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Restrict to one market: us, ca (Canada) or au (Australia).",
                "enum": ["us", "ca", "au"],
                "type": "string"
              }
            },
            "required": ["card"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
