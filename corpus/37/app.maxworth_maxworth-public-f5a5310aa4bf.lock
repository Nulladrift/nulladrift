        },
        {
          "name": "credit_deadline_report",
          "title": "Credit Deadline Report 2026 (MaxWorth data)",
          "description": "Headline figures from MaxWorth's open data report on what US cardholders track: cards and fees per user, recurring credits and deadlines per year, most-skipped credits, logged-use index. Percentages and medians only, CC BY 4.0. Cite the report URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
