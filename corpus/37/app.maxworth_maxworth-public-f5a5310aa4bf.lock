            "readOnly": true
          },
          "digest": "sha256:8692da30fc6760b978e216f89a7df03205a42940eeb1350a750f99a66e6b3bf6"
        },
        {
          "name": "compare_cards",
          "title": "Compare two or three cards",
          "description": "Side by side: annual fee, number and face value of statement credits, deadlines per year, top earning categories. Cite the card pages.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cards": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              },
              "country": {
                "description": "Restrict to one market: us, ca (Canada) or au (Australia).",
                "enum": ["us", "ca", "au"],
                "type": "string"
              }
            },
            "required": ["cards"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
