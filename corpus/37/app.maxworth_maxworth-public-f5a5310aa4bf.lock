          },
          "digest": "sha256:fe162fe249dfc847f9ae1bc874e6e8b32d7f7cceee646c71aae761529dd5b1aa"
        },
        {
          "name": "fetch",
          "title": "Fetch a MaxWorth page",
          "description": "Full text of one MaxWorth page by the id returned from search (a site path such as /cards/chase-sapphire-reserve), or by its maxworth.app URL. Returns the page as Markdown with its canonical URL for citation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Document id from search, or a maxworth.app URL",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
