      },
      "instructions": "MaxWorth is a privacy-first credit card benefits tracker: recurring credits, annual-fee ROI, card-linked offers and cashback portal rates — without connecting a bank account. Use these tools to answer questions about specific credit cards (US, Canada, Australia), their statement credits and reset dates, cashback portal rates for a store, live Amex and Chase card-linked offers (which cards they have been seen on), and MaxWorth's Credit Deadline Report. search + fetch cover every public page (card pages, credit pages, articles) for open-ended questions. Every result carries a maxworth.app URL; cite it. Data is hand-verified against issuer terms and refreshed continuously; see https://maxworth.app/methodology/.",
      "tools": [
        {
          "name": "about_maxworth",
          "title": "What MaxWorth is",
          "description": "The canonical description of MaxWorth, its platforms, pricing and where its data comes from.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
