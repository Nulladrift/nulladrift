{
  "lockfileVersion": 2,
  "subjects": {
    "com.quorumz.api/sense": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.quorumz.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "quorumz",
        "title": "Quorumz Sense",
        "version": "1.0.0",
        "description": "Geo-tagged world news for agents: stories split into viewpoints, with support counts.",
        "websiteUrl": "https://sense.quorumz.com/agents"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Quorumz: current, geo-tagged world news for agents. Each story is a quorum: the distinct viewpoints being expressed about it, each with a summary and a support_count split into media, social and on-the-ground posts. Alpha events flag stories ahead of the wider press.\n\nUse it when a user asks what is happening, or what people are saying, about a country, a conflict or a public story; wants the positions on a story rather than one headline; or wants an early signal. Not for general web search.\n\nTools: search_quorums ($0.01 per quorum), list_alpha_events ($0.02 per event), list_news ($0.005 per article), get_quorum ($0.01), get_article ($0.005), and sample_quorum (free, no key). country is an ISO 3166 alpha-2 code; pass next_cursor back as cursor for older records. An empty page is free and an unknown id is not charged.\n\nAccess: send a Quorumz API key on this connection as the header Authorization: Bearer <key>. Get one at https://sense.quorumz.com/agents/keys: the first 100 calls within 7 days are free, then prepaid credits by card or PayPal at the prices above. Without an account, pay per call in USDC with x402 on the REST routes under https://api.quorumz.com/api/agent/v1. Docs: https://sense.quorumz.com/agents/docs",
      "tools": [
        {
          "name": "get_article",
          "title": "Get one article",
          "description": "One news article by article_id (the id of a list_news record) with all the quorums on its story. Costs $0.005; an unknown id is not charged. Needs the Quorumz API key on this connection (Authorization: Bearer <key>); the first 100 calls within 7 days are free.",
          "inputSchema": {
            "properties": {
              "article_id": {
                "description": "The id of a list_news record.",
                "maxLength": 200,
                "minLength": 1,
                "title": "Article Id",
                "type": "string"
              }
            },
            "required": ["article_id"],
            "title": "get_articleArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_articleDictOutput",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c9a10b8b403cf865d7bbf12f8daca3ba78d35c9cb3df2153e81f9d50fa791fc"
        },
        {
          "name": "get_quorum",
          "title": "Get one quorum",
          "description": "One quorum by quorum_id, with every viewpoint and its support. A quorum is one news story split into the distinct viewpoints being expressed about it: each viewpoint has a label, a summary and a support_count of the posts behind it, split into media, socials and iwitness (on-the-ground reports). Costs $0.01; an unknown id is not charged. Needs the Quorumz API key on this connection (Authorization: Bearer <key>); the first 100 calls within 7 days are free.",
          "inputSchema": {
            "properties": {
              "quorum_id": {
                "description": "A quorum_id from another record.",
                "maxLength": 200,
                "minLength": 1,
                "title": "Quorum Id",
                "type": "string"
              }
            },
            "required": ["quorum_id"],
            "title": "get_quorumArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_quorumDictOutput",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2dcdf66676fd32643c76d0422e33aa4d1a624ba1d6cfdcdc5119b3ccac1de9a"
        },
        {
          "name": "list_alpha_events",
          "title": "List alpha events",
          "description": "Alpha events: stories flagged ahead of the wider press, newest first. Each event has a country, coordinates, an alpha_kind, an alpha_score, the rationale, and the quorum on the story when one exists. Filter by country or by a geohash map cell. Costs $0.02 per event returned; an empty page is free. Needs the Quorumz API key on this connection (Authorization: Bearer <key>); the first 100 calls within 7 days are free.",
          "inputSchema": {
            "properties": {
              "cell": {
                "anyOf": [
                  {
                    "pattern": "^[0-9bcdefghjkmnpqrstuvwxyz]{3,5}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Geohash map cell of precision 3 to 5 (e.g. sy10, around Beirut), to keep only events inside it.",
                "title": "Cell"
              },
              "country": {
                "anyOf": [
                  {
                    "pattern": "^[A-Za-z]{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO 3166 alpha-2 country code, e.g. LB. Omit for the whole world.",
                "title": "Country"
              },
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "next_cursor of the previous page, to read older records. Omit for the newest.",
                "title": "Cursor"
              },
              "limit": {
                "default": 1,
                "description": "Records per page, 1 to 50. Every record returned is charged.",
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              }
            },
            "title": "list_alpha_eventsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "list_alpha_eventsDictOutput",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ecb102a34d3030eac32117e59438779d7a013d40d68b6e519ce62e005ed894d"
        },
        {
