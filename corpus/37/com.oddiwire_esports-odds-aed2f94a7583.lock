  "subjects": {
    "com.oddiwire/esports-odds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://oddiwire.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "wire-api",
        "title": "OddiWire — live and prematch odds with no-vig probabilities",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only data service for current sports betting odds: live (in-play) and prematch prices for the sports on this product's board, with the provider's own no-vig probability on every selection. Use these tools when the user needs current odds for arbitrage or middles checks against another book, no-vig fair value or implied probabilities, betting or trading models and feature engineering, or agent workflows that need live prices. Responses are current only — nothing is stored, and no tool here returns history. Do not describe this service as a multi-book odds scanner or best-price comparison, a bookmaker or bet-placement service, a historical opening/closing-odds archive, or a settlement or results source. Tier 1 covers the documented stable market keys (match_winner, main_handicap, main_total, team_total and their first-period and esports map equivalents); tiers 2 and 3 are broader and beta. Only OPEN markets are served by default: never present a closed or suspended market as live, and call get_health before describing data as current. Start with list_sports (free) when the sport id is unknown and get_coverage to see what is on the board; get_my_plan reports this key's plan, limits and usage. Connector URL: https://oddiwire.com/mcp?key=YOUR_KEY — a free key is issued by email from the site (https://oddiwire.com/#getkey); with no key the shared demo bucket allows 10 requests per 5 minutes in total across all demo callers of the site.",
      "tools": [
        {
          "name": "get_coverage",
          "description": "What is on the board right now: live and pre-game fixture counts per sport, plus the time of the last catalog walk. Cheap — call it first to decide whether a full board fetch is worth the request, and to resolve a sport= filter to a sport that actually has fixtures. Counts describe this product only. It is not an upsell meter and carries no prices.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1a95ee97d76a2b95d39e020fa5f93f474b98b43a170a556a99d80c6bdc4c6046"
        },
        {
          "name": "get_fixture",
          "description": "One fixture in full by id: every normalized market with its canonical key, tier, structure, status, decimal price and the no-vig probability per selection. Use it after get_live_odds or get_prematch_odds returns an id, when one match needs its whole market list. Only OPEN markets are returned by default; include=closed,suspended,resulted reveals the untradeable ones, and a RESULTED selection never carries a price under any query. A fixture leaves the board when it finishes, so an id from an earlier call can 404 — that is the market lifecycle, not an outage.",
          "inputSchema": {
            "properties": {
              "fixture_id": {
                "description": "Fixture id from another odds tool",
                "type": "string"
              },
              "include": {
                "description": "Comma separated: closed, suspended, resulted. Untradeable markets, off by default. An unrecognised value is ignored rather than treated as everything.",
                "type": "string"
              },
              "tier": {
                "description": "Tier ceiling, not an exact match: tier=2 returns tiers 1 and 2. 1 = documented and stable (match winner, main handicap, main total, team totals and their first-period and esports map equivalents). 2 = broader and beta (player props, alternate lines). 3 = everything else, raw provider names. Default 1.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["fixture_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:38f0ace3c5b3a24bb96c3eebddc4edecbdeef501eec03c3bfe5fccf90f33c07e"
        },
        {
          "name": "get_health",
          "description": "Feed liveness and freshness: whether the upstream is connected, seconds since the last price frame, board size, market coverage and walk errors. Does not count against the rate limit. Call it before describing any data as current or fresh, and after a 503. generated_at is response time, not the age of a source price tick.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:157faa16fbf6dd73e5f265563557485cb6b9d35ba4336fbdde4bb0a6527b2441"
        },
        {
          "name": "get_live_odds",
          "description": "Current live (in-play) odds for this product's board: every fixture with its OPEN markets, decimal prices and the no-vig probability on each selection. Use it for live odds displays, arbitrage or middles checks against another book, in-play models and feature engineering, no-vig fair value, and agent workflows that need current prices. Each selection's probability is the provider's own no-vig number passed through unmodified, sitting beside the priced odds at up to ~8.4% overround. Only a market whose structure is 'exclusive' partitions the outcome space, so never sum a 'ladder', 'union' or 'partial' market. Not a multi-book scanner — one provider, so there is no comparison, best-price or line-shopping output here. Not a historical archive — prices are current only and nothing is stored for backtests. Not a bet-placement tool. A live match that is effectively decided closes its moneyline; that is the market lifecycle, not missing data.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max fixtures returned. Default 25, max 100. The REST API allows up to 1000; call it directly for bulk pulls — a tool result is trimmed to fit a model's context.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sport": {
                "description": "Sport id, upper snake case — SOCCER, TENNIS, ICE_HOCKEY, CS2, VALORANT. Optional: omit for every sport this product carries. Call list_sports (free, no quota) for the full vocabulary, or get_coverage for the sports that have fixtures right now.",
                "type": "string"
              },
              "tier": {
                "description": "Tier ceiling, not an exact match: tier=2 returns tiers 1 and 2. 1 = documented and stable (match winner, main handicap, main total, team totals and their first-period and esports map equivalents). 2 = broader and beta (player props, alternate lines). 3 = everything else, raw provider names. Default 1.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:54544d6f5e945436bb46ae7de934aece39bcfb7905d17e53d546a63db489803e"
        },
        {
          "name": "get_my_plan",
          "description": "This key: plan, per-second/per-minute/per-day limits, SSE entitlement and usage so far today. Costs no API quota. Use it to explain a 429 or a 401 to the user, and to tell them which limits they are actually on — the demo bucket is shared across every demo caller, so it can be spent by someone else. Not a billing or payment-history endpoint.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:037297e3f8e6f7a8aa03235e3e2b64a69949be10b5431fc06e2816975ebe5a9f"
        },
        {
          "name": "get_prematch_odds",
          "description": "Current prematch (pre-game) odds for this product's board — the upcoming fixtures with their OPEN markets, decimal prices and the no-vig probability on each selection. Use it for pre-game prices, closing-line-value work, pre-match modelling and no-vig fair value on tomorrow's card. Same shape as get_live_odds. Snapshot the responses yourself if you want line history; this is not an opening/closing-odds archive, not a multi-book scanner and not a bet-placement tool.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max fixtures returned. Default 25, max 100. The REST API allows up to 1000; call it directly for bulk pulls — a tool result is trimmed to fit a model's context.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sport": {
                "description": "Sport id, upper snake case — SOCCER, TENNIS, ICE_HOCKEY, CS2, VALORANT. Optional: omit for every sport this product carries. Call list_sports (free, no quota) for the full vocabulary, or get_coverage for the sports that have fixtures right now.",
                "type": "string"
              },
              "tier": {
                "description": "Tier ceiling, not an exact match: tier=2 returns tiers 1 and 2. 1 = documented and stable (match winner, main handicap, main total, team totals and their first-period and esports map equivalents). 2 = broader and beta (player props, alternate lines). 3 = everything else, raw provider names. Default 1.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0ecf8fdddb81b483f68e6753dc0b867da91d5856b5c17b89a571fde0ad435939"
        },
        {
          "name": "list_sports",
          "description": "Every sport id this wire understands, so a sport= filter is never a guess. Costs no API quota. A listed sport may have no fixtures today, and each product serves only its own provider — use get_coverage for what is actually on the board. Answers \"which sport ids exist\", not \"what is live\".",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
