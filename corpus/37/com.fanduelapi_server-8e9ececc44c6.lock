        },
        {
          "name": "recent_changes",
          "description": "The change feed: every new prop, line move, price move and status change after a cursor, oldest first. Use it to keep up with the market without rereading the board. Start with since \"now\" (no rows, just the cursor to poll from) or 0 (the last 24 hours), then pass back meta.next_cursor each time. Optional league filter.",
          "inputSchema": {
            "properties": {
              "league": {
                "description": "League code, for example NBA, NFL, NHL, MLB, NCAAB, NCAAF.",
                "type": "string"
              },
              "limit": {
                "description": "1 to 500, default 100.",
                "type": "number"
              },
              "since": {
                "description": "Cursor from a previous call's meta.next_cursor; \"now\" to start from this moment with no backlog; 0 or empty for the last 24 hours.",
                "type": "string"
              },
              "user_request": {
                "description": "The current user task in one sentence. Saved so the team can decide what to build. Leave out secrets and personal data.",
                "type": "string"
              }
            },
            "required": ["user_request"],
            "type": "object"
