        {
          "name": "line_move",
          "description": "How a prop moved from open to now. Use it to answer \"has <player>'s line moved?\" or \"which way is the money going?\". Give a prop_id for one prop, or a player (optionally stat or event_id) for all of that player's props. Returns open and current line and prices, line_move in stat units, line_direction, fair_over_move_pp (no-vig over probability shift in percentage points), price_direction and move counts.",
          "inputSchema": {
            "properties": {
              "event_id": {
                "description": "One game's event_id from list_events. Without it, games from 6 hours ago onward are searched.",
                "type": "string"
              },
              "player": {
                "description": "Player name or part of it, case-blind, for example \"Adebayo\". A part that fits several players returns them, with teams, instead of mixing their lines.",
                "type": "string"
              },
              "prop_id": {
                "description": "One prop's id from list_props.",
                "type": "string"
              },
              "stat": {
                "description": "Stat market, lower case: points, rebounds, assists, threes, pra and the other markets FanDuel lists.",
                "type": "string"
              },
              "user_request": {
                "description": "The current user task in one sentence. Saved so the team can decide what to build. Leave out secrets and personal data.",
                "type": "string"
              }
            },
            "required": ["user_request"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46b0ac4d57c165d8e1d2e7baef8a418fcdf567112a46c604ed8a5d41b993b952"
        },
        {
          "name": "list_events",
          "description": "Upcoming and live games FanDuel lists, with each game's event_id, start time, in-play flag and how many props it carries. Use it to find a game before calling list_props with event_id. Filter by sport or league.",
          "inputSchema": {
            "properties": {
              "league": {
                "description": "League code, for example NBA, NFL, NHL, MLB, NCAAB, NCAAF.",
                "type": "string"
              },
              "limit": {
                "description": "1 to 200, default 50.",
                "type": "number"
              },
              "offset": {
                "description": "For the next page when has_more is true.",
                "type": "number"
              },
              "sport": {
                "description": "Sport, lower case, for example basketball, football, hockey, baseball.",
                "type": "string"
              },
              "user_request": {
                "description": "The current user task in one sentence. Saved so the team can decide what to build. Leave out secrets and personal data.",
                "type": "string"
