          },
          "digest": "sha256:2a3ec73a90b06671640b94038b0e6cb681d251e0376d4011bc5f996c04b45b1d"
        },
        {
          "name": "list_props",
          "description": "Current FanDuel player prop lines and prices. Use it to answer \"what is the line for <player> <stat>?\" or to scan a game or league board. Each prop has line, over and under prices in American and decimal odds, status, and a move summary from open. Filter by player, stat, sport, league or event_id.",
          "inputSchema": {
            "properties": {
              "event_id": {
                "description": "One game's event_id from list_events. Without it, games from 6 hours ago onward are searched.",
                "type": "string"
              },
              "league": {
                "description": "League code, for example NBA, NFL, NHL, MLB, NCAAB, NCAAF.",
                "type": "string"
              },
              "limit": {
                "description": "1 to 200, default 50.",
                "type": "number"
              },
              "offset": {
                "description": "For the next page when has_more is true.",
                "type": "number"
              },
              "player": {
                "description": "Player name or part of it, case-blind, for example \"Adebayo\". A part that fits several players returns them, with teams, instead of mixing their lines.",
                "type": "string"
              },
              "sport": {
                "description": "Sport, lower case, for example basketball, football, hockey, baseball.",
                "type": "string"
              },
              "stat": {
                "description": "Stat market, lower case: points, rebounds, assists, threes, pra and the other markets FanDuel lists.",
                "type": "string"
              },
              "status": {
                "description": "Default: everything except removed.",
                "enum": ["open", "suspended", "closed", "removed", "any"],
                "type": "string"
              },
              "team": {
                "description": "Team abbreviation, for example MIA. Picks one of two players who share a name.",
                "type": "string"
              },
              "updated_since": {
                "description": "ISO 8601 time: only props whose line, price or status changed after it.",
                "type": "string"
              },
              "user_request": {
                "description": "The current user task in one sentence. Saved so the team can decide what to build. Leave out secrets and personal data.",
                "type": "string"
              }
            },
            "required": ["user_request"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5036696e67a0032fc4ec33309ba575fc6c9475bd6a78e26125fa3f45454065cb"
        },
