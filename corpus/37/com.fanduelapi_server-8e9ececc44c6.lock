        {
          "name": "line_move",
          "description": "How a prop moved from open to now. Use it to answer \"has <player>'s line moved?\" or \"which way is the money going?\". Give a prop_id for one prop, or a player (optionally stat or event_id) for all of that player's props. Returns open and current line and prices, line_move in stat units, line_direction, fair_over_move_pp (no-vig over probability shift in percentage points), price_direction and move counts. A default call costs 3 credits (table: https://fanduelapi.com/credits).",
