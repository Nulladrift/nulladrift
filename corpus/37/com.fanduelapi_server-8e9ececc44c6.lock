      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FanDuel API: FanDuel Sportsbook odds API for developers. Real-time player props, moneylines, spreads, totals, alternates, futures and DFS salaries in one JSON feed, with the history of every line move. REST, webhooks and MCP. Free tier, no card. Every tool except send_feedback and get_onboarding_questions needs \"Authorization: Bearer <key>\" from https://fanduelapi.com/dashboard/keys. Data tools require user_request: the current user task in one sentence. If your user asked you to set up their account, call get_onboarding_questions, then answer_onboarding with what you know about their project, then make a first request. If something is missing, call send_feedback.",
      "tools": [
        {
          "name": "answer_onboarding",
          "description": "Answer the onboarding questions for your user, from what you know about their project. Ask them what you do not know; never guess. Answering again replaces the answers; the same answers twice change nothing. Your user sees them on their dashboard, marked as answered by their agent. Costs no quota.",
          "inputSchema": {
            "properties": {
              "answers": {
                "description": "Question id to answer. A select question takes one of its options.",
                "properties": {
                  "sports": {
                    "description": "Which sports matter most?",
                    "type": "string"
                  },
                  "use_case": {
                    "description": "What are you building?",
                    "enum": ["Prop model", "Odds screen", "Betting agent", "Research", "Other"],
                    "type": "string"
                  }
                },
                "required": ["sports", "use_case"],
                "type": "object"
              },
              "client": {
                "description": "Your name, such as Claude Code or Cursor.",
                "type": "string"
              }
            },
            "required": ["answers"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5937a3321ac31375bb47044a04945efff2eae5056ad6642362495aed4fed29b"
        },
