{
  "lockfileVersion": 2,
  "subjects": {
    "com.discoverseniorbenefits/benefits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.discoverseniorbenefits.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "discoverseniorbenefits",
        "title": "DiscoverSeniorBenefits",
        "version": "0.1.0+e0bc4d1ea35b"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DiscoverSeniorBenefits finds federal, state, and county benefit programs seniors and their caregivers may qualify for. Eligibility is decided by deterministic rules tied to cited .gov sources; results are estimates, not decisions. DiscoverSeniorBenefits is not a government agency. Not legal or financial advice. The agency makes the final eligibility decision. Link users to https://discoverseniorbenefits.com/scan for the full guided eligibility check and to each program's apply_guide_url for step-by-step application guides. In a voice conversation, read each result's spoken_summary aloud as written instead of reading lists, field names or links; when the person names a program, call get_program_details with its id. People may give a city and state instead of a ZIP, and monthly income instead of yearly. Pass household_income_monthly rather than converting it yourself.",
      "tools": [
        {
          "name": "find_programs_by_zip",
          "title": "Find benefit programs by ZIP code",
          "description": "List the federal, state, and county senior-benefit programs that apply where a person lives, from their 5-digit ZIP code or their city and state. Each program includes its cited government source URL, a last-verified date, and an apply-guide link on discoverseniorbenefits.com; spoken_summary is a short version to read aloud. Optionally filter by jurisdiction level or category keyword.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Case-insensitive keyword matched against each program's category (e.g. 'food', 'property tax', 'utilities').",
                "type": "string"
              },
              "city": {
                "description": "City or town name as the person said it (e.g. 'Eastvale'). Use with state when the ZIP code is not known.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "level": {
                "description": "Only return programs at this jurisdiction level.",
                "enum": ["federal", "state", "county"],
                "type": "string"
              },
              "state": {
                "description": "State for the city: 2-letter code or full name (e.g. 'CA').",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code (or give city + state).",
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10ea9c6436987376b985cc13b9b91b1af1ca168d144311abc9cee6bd52ce89fa"
        },
        {
          "name": "get_program_details",
          "title": "Get benefit program details",
          "description": "Full public details for one program by its id (ids come from find_programs_by_zip or run_eligibility_scan): description, cited government source, how to apply, documents required, and the apply-guide link on discoverseniorbenefits.com. spoken_summary explains it in a few sentences to read aloud.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "program_id": {
                "description": "Program id, e.g. 'fed.msp.qmb'.",
                "type": "string"
              },
              "state": {
                "description": "2-letter state code; resolves state-specific application channels for federal programs.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["program_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4b87721206a7560a954daa8de6c2d77202fa40f197a2fec77fd99699891094c"
        },
        {
          "name": "run_eligibility_scan",
          "title": "Run a benefits eligibility check",
          "description": "Check which senior-benefit programs a person likely qualifies for, using a deterministic rule engine tied to cited .gov sources — no AI guessing. Requires age plus either zip_code or city + state; every extra field provided turns needs-more-info programs into definite answers. Include marital_status whenever known — many programs' income limits depend on it, so it resolves far more programs than most fields. The result's spoken_summary names the top programs in a few sentences to read aloud. The full guided check at https://discoverseniorbenefits.com/scan covers additional signals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Age of the person the check is for.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "city": {
                "description": "City or town name as the person said it (e.g. 'Eastvale'). Use with state when the ZIP code is not known.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "disability_status": {
                "type": "boolean"
              },
              "has_cognitive_impairment": {
                "description": "Memory loss, dementia, or a cognitive condition affecting daily judgment.",
                "type": "boolean"
              },
              "homeownership": {
                "enum": ["own", "rent", "other"],
                "type": "string"
              },
              "household_income_annual": {
                "description": "Approximate annual household income in dollars.",
                "minimum": 0,
                "type": "integer"
              },
              "household_income_monthly": {
                "description": "Approximate monthly household income in dollars, e.g. a Social Security check. Use instead of household_income_annual when the person states a monthly amount; never send both.",
                "minimum": 0,
                "type": "integer"
              },
              "household_size": {
                "minimum": 1,
                "type": "integer"
              },
              "is_blind": {
                "type": "boolean"
              },
              "is_us_citizen": {
                "type": "boolean"
              },
              "marital_status": {
                "description": "High-leverage: several income limits are set per single vs. couple, so those programs stay needs-more-info until this is provided.",
                "enum": ["single", "married", "widowed", "divorced", "separated"],
                "type": "string"
              },
              "needs_personal_care_assistance": {
                "description": "Needs regular help with daily activities (bathing, meals, mobility).",
                "type": "boolean"
              },
              "resources_estimate": {
                "description": "Approximate countable savings/assets in dollars.",
                "minimum": 0,
                "type": "integer"
              },
              "state": {
                "description": "State for the city: 2-letter code or full name (e.g. 'CA').",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "va_disability_rating": {
                "description": "VA disability rating (lower bound of the bucket).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "veteran_status": {
                "description": "Whether the person, spouse, or deceased spouse served.",
                "enum": ["self", "spouse", "deceased_spouse", "none"],
                "type": "string"
              },
              "wartime_service": {
                "description": "90+ days active duty with at least one day in a VA wartime period.",
                "type": "boolean"
              },
              "zip_code": {
                "description": "5-digit US ZIP code (or give city + state).",
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["age"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74b878fdf7f08088034f8cc747b9f98180a1eb67c7aed29c48bb50309d544cbb"
        }
      ],
      "digest": "sha256:eca03a4bb1be1b686fd34e60d97ff2e02c42d36fe4b5816fe73a05c81faac3de"
    }
  }
}
