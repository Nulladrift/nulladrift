{
  "lockfileVersion": 2,
  "subjects": {
    "com.discoverseniorbenefits/benefits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.discoverseniorbenefits.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "discoverseniorbenefits",
        "title": "DiscoverSeniorBenefits",
        "version": "0.1.0+f2bfbb442fae"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DiscoverSeniorBenefits finds federal, state, and county benefit programs seniors and their caregivers may qualify for. Eligibility is decided by deterministic rules tied to cited .gov sources; results are estimates, not decisions. DiscoverSeniorBenefits is not a government agency. Not legal or financial advice. The agency makes the final eligibility decision. Link users to https://discoverseniorbenefits.com/scan for the full guided eligibility check and to each program's apply_guide_url for step-by-step application guides.",
      "tools": [
        {
          "name": "find_programs_by_zip",
          "title": "Find benefit programs by ZIP code",
          "description": "List the federal, state, and county senior-benefit programs that apply where a person lives, from their 5-digit ZIP code. Each program includes its cited government source URL, a last-verified date, and an apply-guide link on discoverseniorbenefits.com. Optionally filter by jurisdiction level or category keyword.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Case-insensitive keyword matched against each program's category (e.g. 'food', 'property tax', 'utilities').",
                "type": "string"
              },
              "level": {
                "description": "Only return programs at this jurisdiction level.",
                "enum": ["federal", "state", "county"],
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code.",
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3066f7b269bfe529e8b87d2977ac2d16296b51a0b09806ca7b286b09484f4b8"
        },
        {
          "name": "get_program_details",
          "title": "Get benefit program details",
          "description": "Full public details for one program by its id (ids come from find_programs_by_zip or run_eligibility_scan): description, cited government source, how to apply, documents required, and the apply-guide link on discoverseniorbenefits.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "program_id": {
                "description": "Program id, e.g. 'fed.msp.qmb'.",
                "type": "string"
              },
              "state": {
                "description": "2-letter state code; resolves state-specific application channels for federal programs.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["program_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea026d2542eaa40183ca8a8d65f89035db53f68e60d0ab7d5d8cc98bc2ac1453"
        },
        {
          "name": "run_eligibility_scan",
          "title": "Run a benefits eligibility check",
          "description": "Check which senior-benefit programs a person likely qualifies for, using a deterministic rule engine tied to cited .gov sources — no AI guessing. Only age and zip_code are required; every extra field provided turns needs-more-info programs into definite answers. Include marital_status whenever known — many programs' income limits depend on it, so it resolves far more programs than most fields. The full guided check at https://discoverseniorbenefits.com/scan covers additional signals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Age of the person the check is for.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "disability_status": {
                "type": "boolean"
              },
              "has_cognitive_impairment": {
                "description": "Memory loss, dementia, or a cognitive condition affecting daily judgment.",
                "type": "boolean"
              },
              "homeownership": {
                "enum": ["own", "rent", "other"],
                "type": "string"
              },
              "household_income_annual": {
                "description": "Approximate annual household income in dollars.",
                "minimum": 0,
                "type": "integer"
              },
              "household_size": {
                "minimum": 1,
                "type": "integer"
              },
              "is_blind": {
                "type": "boolean"
              },
              "is_us_citizen": {
                "type": "boolean"
              },
              "marital_status": {
                "description": "High-leverage: several income limits are set per single vs. couple, so those programs stay needs-more-info until this is provided.",
                "enum": ["single", "married", "widowed", "divorced", "separated"],
                "type": "string"
              },
              "needs_personal_care_assistance": {
                "description": "Needs regular help with daily activities (bathing, meals, mobility).",
                "type": "boolean"
              },
              "resources_estimate": {
                "description": "Approximate countable savings/assets in dollars.",
                "minimum": 0,
                "type": "integer"
              },
              "va_disability_rating": {
                "description": "VA disability rating (lower bound of the bucket).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "veteran_status": {
                "description": "Whether the person, spouse, or deceased spouse served.",
                "enum": ["self", "spouse", "deceased_spouse", "none"],
                "type": "string"
              },
              "wartime_service": {
                "description": "90+ days active duty with at least one day in a VA wartime period.",
                "type": "boolean"
              },
              "zip_code": {
                "description": "5-digit US ZIP code.",
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["age", "zip_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d88d7cce03b839b57e47d6f03761ffeae44d984bfd30121ff8f95fe1dbaa547"
        }
      ],
      "digest": "sha256:255bffc128abeef300d35c0e761dcb2dbe5e372957b6dcb4d7bb087fc847acfd"
    }
  }
}
