      "serverInfo": {
        "name": "smklog-quotes",
        "title": "SMKlog Parcel Shipping Rates",
        "version": "1.5.0",
        "description": "Live USPS, UPS, FedEx and DHL Express shipping rates for a parcel sent from a US address — inside the US, or to Canada, the UK, Germany or Australia — described in plain words. No scale, no account and no API key. Also reports how a checkout it prepared is going, tracks shipments bought on SMKlog and serves a monthly US parcel shipping price index.",
        "websiteUrl": "https://smklog.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/tasks": {}
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ten tools. get_parcel_quote returns live shipping rates for a single parcel sent from a US origin — inside the US, or to Canada, the UK, Germany or Australia — across USPS, UPS and FedEx (plus DHL Express to Germany and Australia), from a plain-words item description (or exact dimensions). create_checkout_link turns one shipment into a prefilled checkout URL where the human pays for the shipping label; hand it the quote_id from get_parcel_quote and it reuses that quote instead of spending a second carrier call, and it returns a session_id. get_checkout_status takes that session_id and reports whether the human has paid and whether the label exists, with the tracking number once it does. get_refund_status takes the same session_id and says whether the payment was refunded, how much and why; cancel_checkout_link withdraws a session the human has not opened yet. track_parcel reports delivery status and scan events for a shipment whose label was bought on smklog.com. get_price_index returns the monthly SMKlog parcel shipping price index (a six-box basket priced to five US cities) for reference answers — reading it spends no quote allowance. Three reference tools answer shipping questions from the rules SMKlog applies, with no carrier call and no quote allowance: calculate_billable_weight shows the weight USPS, UPS and FedEx bill for a box (the 139 dimensional rule) and whether it fits parcel limits; get_holiday_shipping_deadlines lists the carriers’ own send-by dates for the holidays; get_shipping_restrictions lists what SMKlog will not ship and the lithium battery rules. Quotes are rate limited and cost real money to produce — call get_parcel_quote once per shipment, not per variation. SMKlog sells parcel labels only: a shipment past parcel limits or described as a pallet or freight load comes back as mode not_a_parcel with no rates (SMKlog does not arrange pallet or freight shipments), and more than one box comes back as mode multiple_boxes — one label per box, so quote each box on its own. Prices are checkout totals with the SMKlog fee inside; the fee is itemized only on the checkout receipt, and where the carrier publishes a counter price for the same parcel it is returned beside the rate so you can show what the person saves. Labels are purchased at https://smklog.com/assets/calculator.",
      "tools": [
        {
          "name": "calculate_billable_weight",
          "title": "Billable weight of a box",
          "description": "The weight USPS, UPS and FedEx bill for a box: dimensional weight (L x W x H / 139) against actual weight, rounded as each carrier rounds, and the parcel and USPS limits it meets. Explains why a big light box costs more and how small a box would bill at its real weight. A calculation only: no carrier call, no quote allowance, nothing stored; get_parcel_quote prices the box live.\n\nParameter rules:\n- length_in, width_in, height_in, weight_lb: all required, above 0, at most 1000.\n- USPS: sides rounded up, 139 only above 1728 cubic inches; UPS and FedEx: nearest inch, every box.\n- Weights round up to a whole pound; USPS prices under 1 lb by the ounce.\n- Limits: parcel 150 lb, 108 in longest side, 165 in length plus girth; USPS 70 lb, 130 in (Ground Advantage) or 108 in (Priority Mail).",
          "inputSchema": {
            "properties": {
              "height_in": {
                "description": "Box height, inches",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "length_in": {
                "description": "Box length, inches",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "weight_lb": {
                "description": "Packed weight, pounds",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "width_in": {
                "description": "Box width, inches",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              }
            },
            "required": ["height_in", "length_in", "weight_lb", "width_in"],
            "type": "object"
          },
          "outputSchema": {
            "description": "How USPS, UPS and FedEx bill one box, and the limits it meets.",
            "properties": {
              "actual_weight_lb": {
                "description": "Packed weight sent, pounds",
                "type": "number"
              },
              "box_in": {
                "description": "Sides rounded up to whole inches, longest first",
                "items": {
                  "type": "integer"
                },
                "maxItems": 3,
                "minItems": 3,
                "type": "array"
              },
              "carriers": {
                "description": "USPS, UPS and FedEx, in that order",
                "items": {
                  "properties": {
                    "billable_weight_lb": {
                      "description": "The larger of the rounded actual and dimensional weights",
                      "type": "integer"
                    },
                    "billed_by_size": {
                      "description": "True when the dimensional weight is larger",
                      "type": "boolean"
                    },
                    "carrier": {
                      "enum": ["USPS", "UPS", "FedEx"],
                      "type": "string"
                    },
                    "cubic_inches": {
                      "description": "L x W x H after that rounding",
                      "type": "integer"
                    },
                    "dimensional_weight_lb": {
                      "description": "Cubic inches / 139, rounded up; null when USPS bills by weight alone (1728 cubic inches or less)",
                      "type": ["integer", "null"]
                    },
                    "note": {
                      "description": "USPS under 1 lb: priced by the ounce",
                      "type": "string"
                    },
                    "rule": {
                      "description": "The rule applied, in a sentence",
                      "type": "string"
                    },
                    "side_rounding": {
                      "description": "Per-side rounding before multiplying",
                      "enum": ["up", "nearest"],
                      "type": "string"
                    }
                  },
                  "required": ["billable_weight_lb", "billed_by_size", "carrier", "cubic_inches", "dimensional_weight_lb", "rule", "side_rounding"],
                  "type": "object"
                },
                "type": "array"
              },
              "hint": {
                "description": "Box-size advice when the box bills 2 lb or more above its weight; else null",
                "type": ["string", "null"]
              },
              "length_plus_girth_in": {
                "description": "Longest side plus twice the other two, sides rounded up",
                "type": "integer"
              },
              "limits": {
                "properties": {
                  "parcel_rule": {
                    "description": "The parcel limits in a sentence",
                    "type": "string"
                  },
                  "usps_ground_advantage": {
                    "description": "At most 70 lb and 130 in of length plus girth",
                    "type": "boolean"
                  },
                  "usps_priority_mail": {
                    "description": "At most 70 lb and 108 in of length plus girth",
                    "type": "boolean"
                  },
                  "within_parcel_limits": {
                    "description": "Fits the parcel limits in parcel_rule",
                    "type": "boolean"
                  }
                },
                "required": ["parcel_rule", "usps_ground_advantage", "usps_priority_mail", "within_parcel_limits"],
                "type": "object"
              },
              "note": {
                "description": "What decides: the carrier’s own measurement at acceptance",
                "type": "string"
              },
              "rounded_weight_lb": {
                "description": "Packed weight rounded up to a whole pound, at least 1",
                "type": "integer"
              }
            },
            "required": ["actual_weight_lb", "box_in", "carriers", "hint", "length_plus_girth_in", "limits", "note", "rounded_weight_lb"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Billable weight of a box"
          },
          "behavior": {
