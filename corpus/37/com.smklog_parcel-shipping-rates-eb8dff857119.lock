        {
          "name": "cancel_checkout_link",
          "title": "Cancel a checkout session",
          "description": "Cancels a create_checkout_link session the human has not opened yet: its handoff link stops binding a checkout, and get_checkout_status answers session_cancelled from then on. Nothing has been paid at that stage, so nothing is refunded and no human is needed. Once the human opens checkout the call is refused with session_in_checkout and the checkout stands: an unpaid one expires on its own, a paid one is refunded by SMKlog support and get_refund_status follows it. Idempotent: cancelling a cancelled session answers the same. No carrier call, no quote allowance.\n\nParameter rules:\n- session_id is the as_ plus UUID id from create_checkout_link.\n- An unknown, malformed or expired id answers session_not_found.\n- From checkout_started on: session_in_checkout, and nothing changes.\n- To try again, call create_checkout_link for a new session.\n- 60 calls an hour per client, shared with get_checkout_status.",
          "inputSchema": {
            "properties": {
              "session_id": {
                "description": "The session_id from create_checkout_link.",
                "pattern": "^as_[A-Za-z0-9-]{8,80}$",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The session, now cancelled.",
            "properties": {
              "amount": {
                "description": "The amount the session was anchored to, USD",
                "type": "number"
              },
              "cancelled_at": {
                "description": "When it was cancelled, ISO 8601",
                "type": "string"
              },
              "checkout": {
                "description": "Always null: no checkout was opened",
                "type": "null"
              },
              "created_at": {
                "description": "When create_checkout_link made the session, ISO 8601",
                "type": "string"
              },
              "currency": {
                "description": "ISO currency, USD",
                "type": "string"
              },
              "expires_at": {
                "description": "When the session would have stopped answering, ISO 8601",
                "type": "string"
              },
              "next": {
                "description": "What, if anything, the agent should do now",
                "type": "string"
              },
              "quote_reused": {
                "type": "boolean"
              },
              "service": {
                "description": "The service the session was anchored to",
                "type": "string"
              },
              "session_id": {
                "description": "The session cancelled",
                "type": "string"
              },
              "status": {
                "enum": ["cancelled"],
                "type": "string"
              }
            },
            "required": ["cancelled_at", "session_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel a checkout session"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8c0a28a881739f7e4e4d80c2737ee7711a0e362936abff9e55c6f3ced3fc34b2"
        },
        {
          "name": "create_checkout_link",
          "title": "Create a payment session for a shipping label",
          "description": "Turns a decided shipment into a payment session: the amount and a handoff URL to prefilled SMKlog checkout. Pass quote_id from get_parcel_quote: its price is reused, no second carrier call. Keep the returned session_id for get_checkout_status. It never charges: the human confirms contents and consents, then pays on the page.\n\nSide effects: writes a 30-day session record; not idempotent, two calls make two sessions. No session for a non-parcel, several boxes, or an installed lithium battery crossing a border.\n\nParameter rules:\n- A valid quote_id overrides product, from_zip, to_zip, to_country and quantity; service still applies.\n- An expired quote_id reprices from the fields, or fails with missing_required_fields without them.\n- service is a case-insensitive fragment of the display name; no match anchors the quote's first rate, not always the cheapest.\n- from_zip: 5-digit US ZIP; to_zip follows to_country (US, CA, GB, DE, AU).\n- International: customs on the page; the recipient pays duty.",
          "inputSchema": {
            "properties": {
              "from_zip": {
                "description": "Origin US ZIP code, 5 digits. Required unless quote_id is given.",
                "type": "string"
              },
              "product": {
                "description": "Plain-words item description. Required unless quote_id is given.",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "How many of the item ship together. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "quote_id": {
                "description": "The quote_id returned by a previous get_parcel_quote call. Valid for 15 minutes.",
                "type": "string"
              },
              "service": {
                "description": "Service to anchor the amount to, e.g. \"USPS Ground Advantage\". Omitted or unmatched, the amount anchors the quote's first rate, top of the best-value ranking rather than the cheapest; the human can still pick any service on the page.",
                "type": "string"
              },
              "to_country": {
                "default": "US",
                "description": "Two-letter destination country: US (default), CA, GB, DE, AU.",
                "enum": ["US", "CA", "GB", "DE", "AU"],
                "type": "string"
              },
              "to_zip": {
                "description": "Destination postal code: a 5-digit ZIP for the US, or the destination country's own postal code. Required unless quote_id is given.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "description": "A payment session, not a charge: the amount and the handoff URL where the human pays. The amount is a live quote at this moment, not a hold or a reservation, and no money moves until the human completes the page.",
            "properties": {
              "amount": {
                "description": "Live-quoted checkout total for the anchored service, USD",
                "type": "number"
              },
              "currency": {
                "description": "ISO currency, USD",
                "type": "string"
              },
              "handoff_url": {
                "description": "Opens the SMKlog checkout prefilled with this shipment",
                "type": "string"
              },
              "identified_product_title": {
                "description": "What the estimator understood the item to be",
                "type": "string"
              },
              "intent": {
                "description": "Always \"session\" — this tool never charges",
                "type": "string"
              },
              "method": {
                "description": "Payment rails behind the checkout, e.g. stripe, card",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "Standing caveats: live quote, human confirms consents and pays",
                "type": "string"
              },
              "quote_reused": {
                "description": "True when the amount came from a quote_id you supplied, so no carrier call was spent. False when this tool priced the shipment live -- either because no quote_id was given, or because the one given had expired.",
                "type": "boolean"
              },
              "service": {
                "description": "The service the amount is anchored to",
                "type": "string"
              },
              "session_id": {
                "description": "Handle for get_checkout_status, shaped as_ plus a UUID, good for 30 days. Null only when the session record could not be stored.",
                "type": ["string", "null"]
              }
            },
            "required": ["amount", "currency", "handoff_url", "intent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a payment session for a shipping label"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:842351444153ad179b5a48b414600e5e6eb58806a122b5e27c5cbdb5227f0cde"
        },
        {
          "name": "get_checkout_status",
          "title": "Check a checkout session",
          "description": "Reports where a create_checkout_link session stands: whether the human opened checkout, paid, and whether the label exists, with the tracking number once it does. Reads SMKlog's own records only: no carrier call, no quote allowance, nothing changes. Poll minutes apart: nothing moves until the human acts.\n\nStatuses, in order: awaiting_checkout, checkout_started, paid (label not bought yet), label_ready (tracking_number present; pass it to track_parcel), delivered, refunded.\n\nParameter rules:\n- session_id is the as_ plus UUID id from create_checkout_link; no order id, email or quote_id works.\n- A session lives 30 days; an unknown, malformed or expired id answers session_not_found.\n- The answer never carries names, addresses or emails; whoever holds the session_id can read the tracking number.\n- A manual-review request is not a checkout: the status stays awaiting_checkout.\n- 60 checks an hour per client.",
          "inputSchema": {
            "properties": {
              "session_id": {
                "description": "The session_id from create_checkout_link.",
                "pattern": "^as_[A-Za-z0-9-]{8,80}$",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The stage of the checkout this session led to, derived from the order record.",
            "properties": {
              "amount": {
                "description": "The amount the session was anchored to, USD",
                "type": "number"
              },
              "checkout": {
                "description": "The checkout the human started, null while awaiting_checkout",
                "properties": {
                  "carrier": {
                    "description": "USPS, UPS, FedEx or DHL",
                    "type": ["string", "null"]
                  },
                  "delivered_at": {
                    "type": ["string", "null"]
                  },
                  "estimated_delivery": {
                    "type": ["string", "null"]
                  },
                  "label_ready": {
                    "type": "boolean"
                  },
                  "order_id": {
                    "description": "SMKlog order id, the reference for support",
                    "type": "string"
                  },
                  "paid": {
                    "type": "boolean"
                  },
                  "refunded": {
                    "type": "boolean"
                  },
                  "service": {
                    "description": "The service the human actually chose",
                    "type": ["string", "null"]
                  },
                  "started_at": {
                    "description": "When the checkout was created",
                    "type": "string"
                  },
                  "tracking_number": {
                    "description": "Present from label_ready on",
                    "type": ["string", "null"]
                  },
                  "tracking_status": {
                    "description": "Latest carrier status when known",
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "created_at": {
                "description": "When create_checkout_link made the session, ISO 8601",
                "type": "string"
              },
              "currency": {
                "description": "ISO currency, USD",
                "type": "string"
              },
              "expires_at": {
                "description": "When the session stops answering, ISO 8601",
                "type": "string"
              },
              "next": {
                "description": "What, if anything, the agent should do now",
                "type": "string"
              },
              "quote_reused": {
                "description": "Whether the session reused a quote_id",
                "type": "boolean"
              },
              "service": {
                "description": "The service the session was anchored to",
                "type": "string"
              },
              "session_id": {
                "description": "The session asked about",
                "type": "string"
              },
              "status": {
                "description": "Stage, in that order",
                "enum": ["awaiting_checkout", "checkout_started", "paid", "label_ready", "delivered", "refunded"],
                "type": "string"
              }
            },
            "required": ["session_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a checkout session"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4657f3d1258ca40df7a63d54d7cd66342c7a3a5490f583c6b286df41d16bb702"
        },
        {
