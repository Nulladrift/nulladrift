        {
          "name": "get_parcel_quote",
          "title": "Get live parcel shipping rates from a US origin",
          "description": "Live parcel rates from a US origin: USPS, UPS, FedEx; DHL Express to DE and AU. Describe the item to estimate the box, or give exact dimensions and weight. Up to five services, each a total with the SMKlog fee inside (itemized only on the checkout receipt). To buy on smklog.com: quote_id to create_checkout_link. Typical prices: get_price_index (free).\n\nParameter rules:\n- weight_lb, length_in, width_in, height_in count only as a set of four above zero, else the box is estimated.\n- One label per box: units that fit one box are priced as that box; more boxes or a quantity above 1 sent with exact dimensions: multiple_boxes.\n- Over 150 lb, 108 in longest side or 165 in length plus girth, or pallet or freight: mode not_a_parcel.\n- product: the item, up to 200 characters; a bare route, weight or question: product_not_recognized.\n- from_zip: a real 5-digit US ZIP, else invalid_us_zip.\n- to_country: US, CA, GB, DE or AU, else international_unsupported_online; to_zip follows it.\n- 80 calls an hour per client.",
          "inputSchema": {
            "properties": {
              "from_zip": {
                "description": "Origin US ZIP code, 5 digits.",
                "type": "string"
              },
              "height_in": {
                "description": "Packed box height, inches.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "length_in": {
                "description": "Packed box length, inches.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "product": {
                "description": "Plain-words item description, e.g. \"65 inch flat screen TV in original box\".",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "How many of the item ship together.",
                "minimum": 1,
                "type": "integer"
              },
              "to_country": {
                "default": "US",
                "description": "Two-letter destination country: US (default), CA, GB, DE, AU.",
                "enum": ["US", "CA", "GB", "DE", "AU"],
                "type": "string"
              },
              "to_zip": {
                "description": "A 5-digit ZIP for the US, else the country's postal code, e.g. M5V 2T6 (Toronto), SW1A 1AA (London).",
                "type": "string"
              },
              "weight_lb": {
                "description": "Packed weight, pounds.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "width_in": {
                "description": "Packed box width, inches.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["from_zip", "product", "to_zip"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Live rates; when rates is empty, mode says why.",
            "properties": {
              "mode": {
                "description": "parcel_label_ready when rates are listed; otherwise not_a_parcel, multiple_boxes or parcel_restricted",
                "type": "string"
              },
              "package": {
                "description": "The packed box the rates were computed for",
                "type": "object"
              },
              "quote_id": {
                "description": "Valid 15 minutes; pass it to create_checkout_link to skip a second carrier call. Null when no rate came back or it could not be stored.",
                "type": "string"
              },
              "rates": {
                "description": "Up to five services. Not cheapest first: ranked by checkout total in cents plus 175 per business day in transit (30 when none is quoted), lowest first; a rate with a carrier counter price may lead a near-tie within 50 cents or 2 percent. Sort by amount yourself for the cheapest.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Checkout total, USD, SMKlog fee inside",
                      "type": "number"
                    },
                    "carrier": {
                      "description": "USPS, UPS, FedEx or DHL",
                      "type": "string"
                    },
                    "currency": {
                      "description": "ISO currency, USD",
                      "type": "string"
                    },
                    "delivery_days": {
                      "description": "Business days in transit, if quoted",
                      "type": ["integer", "null"]
                    },
                    "delivery_estimated_date": {
                      "description": "Estimated delivery date, if quoted",
                      "type": ["string", "null"]
                    },
                    "delivery_window": {
                      "description": "e.g. \"2-5 business days\"",
                      "type": ["string", "null"]
                    },
                    "retail_amount": {
                      "description": "Carrier counter price, USD; 0 when not published",
                      "type": "number"
                    },
                    "service": {
                      "description": "Service name without the carrier prefix",
                      "type": "string"
                    },
                    "service_label": {
                      "description": "Full display name, carrier included",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "carrier", "service"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["rates"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get live parcel shipping rates from a US origin"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dc74a56df4a8c60b2e3bebd3aa7faac57800c3ad2e1e3d4ea8609bcf91afa288"
        },
        {
          "name": "get_price_index",
          "title": "US parcel shipping price index",
          "description": "The SMKlog parcel shipping price index: a monthly repriced basket of six common boxes (1 to 20 lb) shipped from Newark, NJ to five US cities, quoted through the same live USPS, UPS and FedEx pipeline that prices real shipments. Returns the cheapest purchasable service per box and lane with every rate behind it, plus basket averages. Reference data for questions like \"what does shipping a shoebox cost in the US right now\" — reading it spends no quote allowance. For a price on a specific shipment, call get_parcel_quote instead. Parameter rules: month names one published issue as YYYY-MM; issues exist from 2026-07 onward, one per month, and omitting month returns the newest. A month with no issue answers issue_not_found together with available_months, so one miss lists every valid value; anything not shaped YYYY-MM answers invalid_month. Every issue prices the same boxes and lanes, so two months compare cell for cell.",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "Issue month as YYYY-MM. Omit for the newest published issue.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "One published issue of the index: the cheapest service per box and lane with every rate behind it.",
            "properties": {
              "basket_average": {
                "description": "Mean of the cheapest rate across all thirty cells, USD",
                "type": ["number", "null"]
              },
              "captured_on": {
                "description": "The date every price in this issue was captured",
                "type": "string"
              },
              "carrier_wins": {
                "description": "How many cells each carrier priced cheapest",
                "type": ["object", "null"]
              },
              "cells": {
                "description": "One entry per box and destination",
                "items": {
                  "properties": {
                    "box": {
                      "description": "Basket carton, e.g. \"Book box\"",
                      "type": "string"
                    },
                    "cheapest": {
                      "description": "The lowest-priced purchasable service for this cell",
                      "type": "object"
                    },
                    "dims": {
                      "description": "Packed dimensions, inches",
                      "type": "string"
                    },
                    "services": {
                      "description": "Every purchasable service for this cell, cheapest first",
                      "type": "array"
                    },
                    "to": {
                      "description": "Destination city",
                      "type": "string"
                    },
                    "to_zip": {
                      "description": "Destination ZIP",
                      "type": "string"
                    },
                    "weight": {
                      "description": "Packed weight, pounds",
                      "type": "string"
                    }
                  },
                  "required": ["box", "cheapest", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "label": {
                "description": "Issue month spelled out, e.g. \"August 2026\"",
                "type": "string"
              },
              "methodology": {
                "description": "How the numbers are produced",
                "type": "string"
              },
              "month": {
                "description": "Issue month, YYYY-MM",
                "type": "string"
              },
              "origin": {
                "description": "Origin of every lane, Newark NJ (07102)",
                "type": "string"
              },
              "page": {
                "description": "The published issue page on smklog.com",
                "type": "string"
              }
            },
            "required": ["captured_on", "cells", "month"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "US parcel shipping price index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90a08ba42a1c735225d44494f71ffbf8276ece08fb0f42cc23546aa2957da2cf"
        },
        {
          "name": "get_refund_status",
          "title": "Refund status of a checkout session",
          "description": "Says whether the payment behind a create_checkout_link session was refunded, how much and why. Status: not_paid (nothing to refund), none (paid, not refunded), requested (a refund is under way), under_review (an unused non-USPS label, decided by an operator), declined (the label was scanned, so the carrier refused the refund), partially_refunded or refunded; with amount_paid, amount_refunded, reason (unused_label: the automatic refund of a never-scanned label; other) and the refund policy in force. Unused USPS labels are refunded automatically; this tool only reads, it never starts a refund. SMKlog records only: no carrier call, no quote allowance.\n\nParameter rules:\n- session_id is the as_ plus UUID id from create_checkout_link; no order id or email works.\n- An unknown, malformed or expired id answers session_not_found.\n- It reports on the checkout get_checkout_status reports.\n- No names, addresses, emails or card details.\n- 60 checks an hour per client, shared with get_checkout_status.",
          "inputSchema": {
            "properties": {
              "session_id": {
                "description": "The session_id from create_checkout_link.",
                "pattern": "^as_[A-Za-z0-9-]{8,80}$",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Where the refund of the payment behind this session stands, from SMKlog order records.",
            "properties": {
              "amount_paid": {
                "description": "USD; 0 while not_paid",
                "type": "number"
              },
              "amount_refunded": {
                "description": "USD refunded so far",
                "type": "number"
              },
              "currency": {
                "description": "ISO currency, USD",
                "type": "string"
              },
              "next": {
                "description": "What, if anything, the agent should do now",
                "type": "string"
              },
              "order_id": {
                "description": "SMKlog order id, the reference for support; null before checkout",
                "type": ["string", "null"]
              },
              "policy": {
                "description": "The refund policy in force",
                "type": "string"
              },
              "reason": {
                "enum": ["unused_label", "other", null],
                "type": ["string", "null"]
              },
              "requested_at": {
                "description": "When the automatic unused-label refund was requested, ISO 8601",
                "type": ["string", "null"]
              },
              "session_id": {
                "description": "The session asked about",
                "type": "string"
              },
              "status": {
                "enum": ["not_paid", "none", "requested", "under_review", "declined", "partially_refunded", "refunded"],
                "type": "string"
              }
            },
            "required": ["amount_paid", "amount_refunded", "currency", "next", "policy", "session_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Refund status of a checkout session"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b58ef026ff56bc155c837e8ebf106228d76d138fe8d3c42c6fc48f697206c04b"
        },
        {
          "name": "get_shipping_restrictions",
          "title": "Shipping restrictions and battery rules",
          "description": "What SMKlog will not ship and what ships only with conditions: prohibited categories (weapons, drugs, counterfeit goods, money and valuables, living and perishable contents, dangerous goods, controlled exports), restricted ones (batteries, medicine, chemicals and aerosols, regulated natural products, age-restricted goods), the lithium battery rules the checkout applies (installed: UN3481 mark, ground; power banks: UN3480, ground only, up to 100 Wh and 5 lb; larger or lithium-metal batteries reviewed by hand), how to describe an item, and the international rules. The policy published at smklog.com/shipping-restrictions. No carrier call, no quote allowance.\n\nParameter rules:\n- No parameters.\n- A policy reference, not a verdict on one item: get_parcel_quote and the checkout check each item, by name too.\n- The lists are examples, not complete; carrier and destination rules can be stricter.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "description": "What SMKlog will not ship and what ships only with conditions, as published at https://smklog.com/shipping-restrictions, with the lithium battery rules the checkout applies.",
            "properties": {
              "batteries": {
                "description": "The lithium battery rules, case by case",
                "items": {
                  "properties": {
                    "case": {
                      "type": "string"
                    },
                    "rule": {
                      "type": "string"
                    }
                  },
                  "required": ["case", "rule"],
                  "type": "object"
                },
                "type": "array"
              },
              "carrier_rules_control": {
                "description": "Who decides acceptance",
                "type": "string"
              },
              "descriptions": {
                "description": "How to describe an item",
                "type": "string"
              },
              "how_smklog_checks": {
                "description": "When SMKlog checks an item",
                "type": "string"
              },
              "international": {
                "description": "Destinations and the customs declaration",
                "type": "string"
              },
              "policy_page": {
                "description": "The published policy",
                "format": "uri",
                "type": "string"
              },
              "prohibited": {
                "description": "Categories refused outright, with examples",
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "examples": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "examples"],
                  "type": "object"
                },
                "type": "array"
              },
              "restricted": {
                "description": "Categories that ship only with conditions, or that the online checkout may refuse",
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "examples": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "examples"],
                  "type": "object"
                },
                "type": "array"
              },
              "restricted_handling": {
                "description": "What a restricted item may need",
                "type": "string"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["batteries", "carrier_rules_control", "descriptions", "how_smklog_checks", "international", "policy_page", "prohibited", "restricted", "restricted_handling", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Shipping restrictions and battery rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:924f5c4a3ae22d661031b12901ec007c0c5b3ef57aa82052af2c265ea52182bf"
        },
        {
          "name": "track_parcel",
          "title": "Track a SMKlog shipment",
          "description": "Track a shipment whose label was bought on smklog.com, by carrier tracking number: the current status, the latest scan events (newest first, up to eight) and the estimated delivery date when the carrier gives one. SMKlog labels only: not a universal tracker, so another seller's number answers not-found. Spends no quote allowance. Once a create_checkout_link session reaches label_ready, get_checkout_status hands back this number.\n\nParameter rules:\n- tracking_number is the only key; no order id or email.\n- It is matched after removing spaces and hyphens, ignoring case.\n- Typical shapes: USPS 20 to 22 digits (13 characters ending in US for international), UPS 1Z plus 16 characters, FedEx 12 to 22 digits.\n- Under 6 characters after cleanup: tracking_number_required. A number SMKlog never sold: 404 tracking_not_found.",
          "inputSchema": {
            "properties": {
              "tracking_number": {
                "description": "Carrier tracking number from the SMKlog receipt or label page",
                "type": "string"
              }
            },
            "required": ["tracking_number"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Current delivery status plus the scan timeline, newest first.",
            "properties": {
              "events": {
                "description": "Scan events, newest first, up to eight",
                "items": {
                  "properties": {
                    "city": {
                      "description": "Scan city",
                      "type": "string"
                    },
                    "datetime": {
                      "description": "Scan timestamp",
                      "type": "string"
                    },
                    "message": {
                      "description": "What the carrier reported",
                      "type": "string"
                    },
                    "state": {
                      "description": "Scan state",
                      "type": "string"
                    },
                    "status": {
                      "description": "Machine status at this scan",
                      "type": "string"
                    },
                    "status_label": {
                      "description": "Human-readable status",
                      "type": "string"
                    },
                    "zip": {
                      "description": "Scan ZIP",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "tracking": {
                "properties": {
                  "carrier": {
                    "description": "USPS, UPS, FedEx or DHL",
                    "type": "string"
                  },
                  "delivered_at": {
                    "description": "Delivery timestamp once delivered",
                    "type": "string"
                  },
                  "estimated_delivery": {
                    "description": "Estimated delivery date when the carrier reports one",
                    "type": "string"
                  },
                  "last_event_at": {
                    "description": "Timestamp of the latest scan",
                    "type": "string"
                  },
                  "status": {
                    "description": "Machine status, e.g. in_transit, delivered",
                    "type": "string"
                  },
                  "status_detail": {
                    "description": "Carrier detail when reported",
                    "type": "string"
                  },
                  "status_label": {
                    "description": "Human-readable status",
                    "type": "string"
                  },
                  "tracking_code": {
                    "description": "The carrier tracking number",
                    "type": "string"
                  },
                  "updated_at": {
                    "description": "When this record last changed",
                    "type": "string"
                  }
                },
                "required": ["status", "tracking_code"],
                "type": "object"
              }
            },
            "required": ["events", "tracking"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Track a SMKlog shipment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c62ca6324f1a0ea4ed251d62641ec4fb7f74c464faf705efbed7cce560aeb10e"
        }
