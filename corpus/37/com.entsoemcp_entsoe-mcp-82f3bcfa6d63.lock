        {
          "name": "get_outages",
          "title": "Get generation outages",
          "description": "Generation-unit unavailability events (UMM).\n\n`start`/`end` default to UTC; `start` inclusive, `end` EXCLUSIVE. An\noutage is returned if it overlaps the window. Pass `tz=\"local\"` or an\nIANA name to interpret start/end as wall-clock in that timezone.\nEach row is one unit's availability step, from its document's latest\nrevision. ENTSO-E lists some outages under several documents with\nidentical rows; each such row is served once, and `copies` counts the\ndocuments that filed it. A unit can still have several overlapping\nrows that differ. To total unavailable MW, count each unit once per\ninstant (its largest unavailable MW), not the sum of its rows.\nA zone whose outage feed stopped upstream (GB, 2021-06-15) carries\n`series_ended`: outages announced since then are missing, though older\ndocuments may still schedule events into the window.",
