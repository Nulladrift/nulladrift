        {
          "name": "get_series",
          "title": "Get a time series",
          "description": "Generic time-series query for ANY registered series endpoint.\n\nOne tool covers every (non-outage) endpoint in the registry, so adding\na new dataset (call `list_endpoints()` to see the current 14) gets an\nMCP surface automatically — no new tool to learn.\n\nArgument shape adapts to the endpoint:\n  • single-zone (day_ahead_price, actual_load, generation_per_type, …)\n    → pass `zone=\"DE_LU\"`\n  • cross-zone  (crossborder_flow, scheduled_exchanges,\n                 net_transfer_capacity_dayahead)\n    → pass `from_zone=\"DE_LU\"` AND `to_zone=\"FR\"`\n  • psr-dependent (generation_per_type, wind_solar_forecast,\n                   installed_generation_capacity)\n    → optionally filter via `psr_types=[\"solar\",\"wind_onshore\"]`\n\n`start`/`end`: UTC by default; `start` inclusive, `end` EXCLUSIVE\n(for \"all of April 2026\" use end=2026-05-01). Pass `tz=\"local\"` or an\nIANA name to interpret as wall-clock in that timezone.\n\n`aggregation`: 'raw' (default — native PT15M/PT60M per endpoint),\n'hourly' (AVG over quarters → one row per hour, useful for the\ngrowing list of PT15M-stored endpoints like DE_LU day_ahead_price),\n'daily', or 'monthly'. For day-ahead prices specifically the auction\nstill clears hourly even where stored at PT15M, so AVG=any-quarter;\nSUM would 4× over-count.\n\nCurrency: price columns keep `_eur_` in their names for stability. An\nendpoint whose rows carry a `currency` column (day-ahead and intraday\nprices, the A81/A15 capacity prices, activated_balancing_price,\nimbalance_prices) labels each row (PLN, HUF, RON, CZK, GBP, …) and the\nresponse `unit` follows it; `unit` is null when the window mixes\ncurrencies (`mixed_currency`) or, for activated_balancing_price and\nimbalance_prices, holds rows of unknown currency\n(`currency_unknown_rows`). Never average a price across rows with\ndifferent `currency`.\n\nSplit periods: when a response carries `split_periods`, some periods hold\nmore than one row — different published series told apart by the listed\ncolumns (activated_balancing_price: `product`, e.g. CZ/SK mFRR standard\nA01 vs specific A02; or `currency`). Never average across them. Keep one\nwith `filters={\"product\": [\"A01\"]}` — `filters` takes any categorical\ncolumn of the endpoint (`{column: [values]}`).\n\nProcess types: activated balancing prices are one endpoint per ENTSO-E\nprocessType (activated_balancing_price = A16 realised; _mfrr_scheduled =\nA60, _mfrr_direct = A61, _afrr_local = A68) — different prices for the\nsame period, never to be merged. `related_series` names the siblings\nholding data for the zone.\n\nEnded series: a window reaching past the day a series stopped upstream\n(a zone that left ENTSO-E, a frozen archive, a series that ended) carries\n`series_ended` — the last day, why, and `successors`: the endpoints that\ncarry it on, each with a ready `call` and a `note` on how it differs. GB\nday-ahead after 2020-12-31 → day_ahead_price_imrp (GBP/MWh); GB\ngeneration after 2021-06-15 → generation_mix (NESO).\n\nOutage-family endpoints (different schema) stay on `get_outages()`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aggregation": {
                "default": "raw",
                "type": "string"
              },
              "end": {
                "type": "string"
              },
              "endpoint": {
                "type": "string"
              },
              "filters": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "from_zone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "psr_types": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "start": {
                "type": "string"
              },
              "to_zone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "tz": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "zone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["end", "endpoint", "start"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a time series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3b56f64922cd5568c7a1787ea04a6cbf822cb888a10cef4039ef25af02ad5a3d"
        },
        {
          "name": "get_tb_spread",
          "title": "Get top-bottom spread",
          "description": "Top-Bottom (TBx) spread — daily battery-arbitrage benchmark.\nTBx = sum(top X priced hours) − sum(bottom X priced hours) over the\nday-ahead clearing prices for `zone` on `date`. The day is the SDAC\nmarket day (23/25 hours on DST-transition days). `date` must be a\nbare YYYY-MM-DD — time-bearing strings are rejected.\nReturns both `spread` (<currency>/MW/day) and `mean_spread`\n(<currency>/MWh = spread/X) in the zone's trading currency — see the\nresponse `currency`/`unit` (EUR for euro zones; GB=GBP).\nCommon X: 1, 2, 4. A day past the zone's day-ahead series end (GB after\n2020-12-31) answers with `series_ended`, naming the endpoint that carries\nthe prices on.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "type": "string"
              },
              "x": {
                "default": 2,
                "type": "integer"
              },
              "zone": {
                "type": "string"
              }
            },
            "required": ["date", "zone"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get top-bottom spread"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:81c553fa63d6e076cac1bf60fc9d76ea9a5d19b8262d801c9a3754775d6b9c0b"
        },
        {
