                    "const": true,
                    "type": "boolean"
                  },
                  "rules": {
                    "items": {
                      "properties": {
                        "detail": {
                          "type": "string"
                        },
                        "id": {
                          "type": "string"
                        },
                        "outcome": {
                          "enum": ["pass", "fail", "skip"],
                          "type": "string"
                        },
                        "severity": {
                          "enum": ["error", "warn", "info"],
