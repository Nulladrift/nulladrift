        {
          "name": "dispatch.order",
          "title": "Create a dispatch work order",
          "description": "Create a field-service order and return its status URL. HTTP 201 returns a created order; HTTP 202 returns an order accepted_pending_fulfilment with fulfilled=false. Order creation requires a provisioned integration key through x-api-key. MCP also accepts that key through Authorization: Bearer; direct REST order creation requires x-api-key. A self-serve OAuth token authenticates but is not entitled to create orders: HTTP 402 payment_required (JSON-RPC -32002 over MCP). Anonymous callers receive HTTP 401 with WWW-Authenticate. To be provisioned, POST JSON to https://steadywrk.app/api/integration-key-request or use https://steadywrk.app/developers/keys and a person reviews each request. Email fallback: hello@steadywrk.app.",
          "inputSchema": {
            "properties": {
              "callback_url": {
                "format": "uri",
                "type": "string"
              },
              "description": {
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "location": {
                "properties": {
                  "address": {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "city": {
                    "maxLength": 255,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "state": {
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "zip": {
                    "maxLength": 10,
                    "type": "string"
                  }
                },
                "required": ["state"],
                "type": "object"
              },
              "nte_cents": {
                "maximum": 5000000,
                "minimum": 2500,
                "type": "integer"
              },
              "reference_id": {
                "maxLength": 255,
                "type": "string"
              },
              "test_mode": {
                "description": "true: a test booking with your STEADYWRK key (any key, including the free one). Answered whether orders are open or not, marked test: true; nothing is dispatched, matched or charged.",
                "type": "boolean"
              },
              "trade": {
                "description": "Trade code, as listed by dispatch.index (e.g. plumbing, hvac, electrical).",
                "type": "string"
              },
              "urgency": {
                "default": "routine",
                "enum": ["emergency", "urgent", "routine", "scheduled"],
                "type": "string"
              }
            },
            "required": ["description", "location", "trade"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A recorded work order — fulfilled (contractor matched, HTTP 201) or accepted_pending_fulfilment (no contractor yet, HTTP 202) — or a business/entitlement error passthrough.",
            "oneOf": [
              {
                "properties": {
                  "accepted": {
                    "const": true,
                    "type": "boolean"
                  },
                  "created": {
                    "const": true,
                    "type": "boolean"
                  },
                  "fulfilled": {
                    "type": "boolean"
                  },
                  "fulfilment": {
                    "description": "Present only when fulfilled=false.",
                    "properties": {
                      "assigned": {
                        "const": false,
                        "type": "boolean"
                      },
                      "detail": {
                        "type": "string"
                      },
                      "escalation_contact": {
                        "type": "string"
                      },
                      "reason": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "order": {
                    "additionalProperties": true,
                    "properties": {
                      "assigned_contractor_ref": {
                        "type": ["string", "null"]
                      },
                      "created_at": {
                        "type": "string"
                      },
                      "estimated_response_minutes": {
                        "type": ["number", "null"]
                      },
                      "id": {
                        "type": "string"
                      },
                      "location": {
                        "type": "object"
                      },
                      "quoted_cost_cents": {
                        "type": ["integer", "null"]
                      },
                      "quoted_cost_usd": {
                        "type": ["string", "null"]
                      },
                      "status": {
                        "enum": ["pending_dispatch", "accepted_pending_fulfilment", "test_accepted"],
                        "type": "string"
                      },
                      "trade": {
                        "type": "string"
                      },
                      "urgency": {
                        "enum": ["emergency", "urgent", "routine", "scheduled"],
                        "type": "string"
                      }
                    },
                    "required": ["created_at", "id", "location", "status", "trade", "urgency"],
                    "type": "object"
                  },
                  "tracking": {
                    "properties": {
                      "auth": {
                        "type": "string"
                      },
                      "status_url": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                },
                "required": ["accepted", "created", "fulfilled", "order", "tracking"],
                "type": "object"
              },
              {
                "additionalProperties": true,
                "description": "Business/rate-limit/entitlement error passthrough.",
                "properties": {
                  "error": {
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
