                        "type": "string"
                      },
                      "generated_at": {
                        "type": "string"
                      },
                      "location": {
                        "type": "object"
                      },
                      "trade": {
                        "type": "string"
                      },
                      "urgency": {
                        "enum": ["emergency", "urgent", "routine", "scheduled"],
                        "type": "string"
                      },
                      "valid_for_minutes": {
