        {
          "name": "agentic.readiness_probe",
          "title": "Inspect storefront readiness",
          "description": "Run a one-time readiness check on a public storefront and return a score, a grade and per-check results (UCP and ACP discovery files, product schema, robots rules, answer-engine maps). The result is a dated snapshot of public files, not an attested Store Guard grade. Input: url, a public storefront URL or domain (up to 255 characters; local, private and numeric hosts are refused). Each run may store a public snapshot record, at most one per host per UTC day, linked in the response. The response also lists Store Guard and sample-report links under `next`. Rate-limited per caller. No API key required.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Public storefront URL or domain",
                "maxLength": 255,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Either a successful probe (ok=true, report + demo) or a business error (e.g. missing url) — never a fabricated report.",
            "oneOf": [
              {
                "properties": {
                  "demo": {
                    "properties": {
                      "hashSnippet": {
                        "type": "string"
                      },
                      "id": {
                        "type": "string"
                      },
                      "permalink": {
                        "type": "string"
                      },
                      "persisted": {
                        "type": "boolean"
                      },
                      "verifyPath": {
                        "type": "string"
                      }
                    },
                    "required": ["hashSnippet", "id", "permalink", "persisted", "verifyPath"],
                    "type": "object"
                  },
                  "ok": {
                    "const": true,
                    "type": "boolean"
                  },
                  "report": {
                    "properties": {
                      "checks": {
                        "items": {
                          "properties": {
                            "detail": {
                              "type": "string"
                            },
                            "id": {
                              "type": "string"
                            },
                            "label": {
                              "type": "string"
                            },
                            "status": {
                              "enum": ["pass", "warn", "fail", "skip"],
                              "type": "string"
                            }
                          },
                          "required": ["detail", "id", "label", "status"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "grade": {
                        "enum": ["A", "B", "C", "D", "F"],
                        "type": "string"
                      },
                      "host": {
                        "type": "string"
                      },
                      "next": {
                        "properties": {
                          "flagship": {
                            "type": "string"
                          },
                          "sample": {
                            "type": "string"
                          },
                          "storeGuardBuy": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "origin": {
                        "type": "string"
                      },
                      "probedAt": {
                        "type": "string"
                      },
                      "score": {
                        "type": "number"
                      },
                      "summary": {
                        "type": "string"
                      }
                    },
                    "required": ["checks", "grade", "host", "next", "origin", "probedAt", "score", "summary"],
                    "type": "object"
                  }
                },
                "required": ["demo", "ok", "report"],
                "type": "object"
              },
              {
                "additionalProperties": true,
                "description": "Business error — e.g. missing/invalid url argument, rate limit.",
                "properties": {
                  "error": {
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Inspect storefront readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
