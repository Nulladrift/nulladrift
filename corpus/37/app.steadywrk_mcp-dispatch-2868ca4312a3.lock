            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "estimated": {
                "description": "False only when every goal-fulfillment rate is backed by fresh, sufficient production telemetry. A rate without such telemetry is null, not an estimate.",
                "type": "boolean"
              },
              "goal_fulfillment": {
                "additionalProperties": true,
                "description": "Each rate is a live measurement or null. Null means unavailable (see provenance.by_field), not zero.",
