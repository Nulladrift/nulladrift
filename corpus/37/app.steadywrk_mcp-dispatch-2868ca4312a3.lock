        {
          "name": "dispatch.index",
          "title": "Read the dispatch trade catalog",
          "description": "Return the catalog of 8 dispatch trade verticals. Per trade: the BLS OES hourly WAGE benchmark (medianRateDollars/p25/p75 — what a technician earns, NOT a price) alongside billedHourlyRateRoutineDollars, a modeled customer hourly estimate at routine urgency. Estimates are not observed transaction prices or binding quotes. No API key required.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
