      "instructions": "STEADYWRK Dispatch MCP over Streamable HTTP. Call tools/list to enumerate. Read the steadywrk://docs/quickstart resource for a working call per tool; prompts/list offers ready-made workflows. agentic.readiness_probe takes a public storefront URL or domain (argument: url), needs no key, and returns a dated snapshot, not an attested grade. Example call: POST https://steadywrk.app/api/mcp {\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"agentic.readiness_probe\",\"arguments\":{\"url\":\"https://example.com\"}}}. dispatch.quote and dispatch.order require the CLIENT to send its own integration key as x-api-key (or Authorization: Bearer); without one they return HTTP 401 with WWW-Authenticate and JSON-RPC error -32001. Request an integration key: POST JSON to https://steadywrk.app/api/integration-key-request (GET it for the fields), or use https://steadywrk.app/developers/keys and a person reviews each request. Email fallback: hello@steadywrk.app. For dispatch.quote: Over MCP, without a key, add contact_email (and optionally contact_name and company) and the request is filed for a person to answer by email. When OAuth is enabled, a self-serve token is accepted by dispatch.quote but is NOT entitled to dispatch.order, which is the billable tool: it answers HTTP 402 payment_required (JSON-RPC -32002) until an integration key is provisioned for you; request one at https://steadywrk.app/api/integration-key-request. Keyless callers can use dispatch.estimate (public rate card). dispatch.evals is public, no-auth. Read its per-field provenance and methodology; it is self-reported, not an independent audit.",
      "tools": [
        {
          "name": "acp.validate",
          "title": "Validate a store's ACP discovery file",
          "description": "Free validator for a store's Agentic Commerce Protocol (ACP) discovery file at /.well-known/acp.json. Pass url to fetch a public store's file, or document to check pasted JSON. Returns a verdict, every rule result, and a fix list: each failed rule with the change that fixes it. Reads one public file, stores nothing, calls no checkout endpoint. No API key required.",
          "inputSchema": {
            "description": "Send exactly one of url or document.",
            "properties": {
              "document": {
                "description": "The discovery document's JSON text, checked without any fetch",
                "maxLength": 262144,
                "type": "string"
              },
              "url": {
                "description": "Public store URL or domain, e.g. shop.example.com",
                "maxLength": 255,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Either a validation (ok=true) or a business error (bad arguments, rate limit) — never a fabricated report.",
            "oneOf": [
              {
                "properties": {
                  "errors": {
                    "type": "integer"
                  },
                  "fixes": {
                    "description": "Failed rules, errors first, each with the change that fixes it.",
                    "items": {
                      "properties": {
                        "fix": {
                          "type": "string"
                        },
                        "rule": {
                          "type": "string"
                        },
                        "severity": {
                          "enum": ["error", "warn", "info"],
                          "type": "string"
                        }
                      },
                      "required": ["fix", "rule", "severity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "host": {
                    "type": "string"
                  },
                  "kind": {
                    "const": "acp",
                    "type": "string"
                  },
                  "next": {
                    "properties": {
                      "fullCheckPage": {
                        "type": "string"
                      },
                      "fullCheckTool": {
                        "type": "string"
                      },
                      "validator": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "ok": {
                    "const": true,
                    "type": "boolean"
                  },
                  "rules": {
                    "items": {
                      "properties": {
                        "detail": {
                          "type": "string"
                        },
                        "id": {
                          "type": "string"
                        },
                        "outcome": {
                          "enum": ["pass", "fail", "skip"],
                          "type": "string"
                        },
                        "severity": {
                          "enum": ["error", "warn", "info"],
                          "type": "string"
                        }
                      },
                      "required": ["detail", "id", "outcome", "severity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "source": {
                    "type": "string"
                  },
                  "specVersion": {
                    "type": "string"
                  },
                  "summary": {
                    "type": "string"
                  },
                  "verdict": {
                    "enum": ["valid", "invalid", "absent", "unreachable"],
                    "type": "string"
                  },
                  "warnings": {
                    "type": "integer"
                  }
                },
                "required": ["errors", "fixes", "kind", "next", "ok", "rules", "verdict", "warnings"],
                "type": "object"
              },
              {
                "additionalProperties": true,
                "description": "Business error — e.g. missing or conflicting arguments, invalid url, rate limit.",
                "properties": {
                  "error": {
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate a store's ACP discovery file"
          },
          "behavior": {
            "destructive": false,
