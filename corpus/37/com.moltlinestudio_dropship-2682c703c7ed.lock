      },
      "instructions": "Dropshipping unit economics over MCP. Free: margin_check, lead_time, sku_map_check, price_ladder. Premium (license): moq_planner, returns_impact. Arithmetic on your own numbers: no supplier API, no store connection, no account.",
      "tools": [
        {
          "name": "lead_time",
          "title": "Lead Time",
          "description": "Turn supplier and transit times into a date you can promise. FREE.\n\nAdds a buffer, because the number a supplier quotes is their best case and\nthe date you publish is a commitment. Typical input {\"supplier_days\": 3,\n\"transit_days\": 12, \"order_date\": \"2026-08-20\"} returns {\"total_days\": 17,\n\"delivery_date\": \"2026-09-06\", \"promise_date\": \"2026-09-09\",\n\"advice\": \"...\"}.\n\nUse when writing a shipping policy or answering \"when will it arrive\".\nNot for what the shipping costs: that is the shipping server. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"order_date must be YYYY-MM-DD, e.g. 2026-08-20\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buffer_days": {
                "default": 2,
                "description": "Extra days added before the date you publish. Default 2.",
                "minimum": 0,
                "type": "integer"
              },
              "order_date": {
                "default": "",
                "description": "Start date as YYYY-MM-DD, e.g. \"2026-08-20\". Defaults to\ntoday when omitted.",
                "type": "string"
              },
              "supplier_days": {
                "description": "Days from your order to the supplier despatching it.",
                "minimum": 0,
                "type": "integer"
              },
              "transit_days": {
                "description": "Days in transit from despatch to the customer.",
                "minimum": 0,
                "type": "integer"
              },
              "working_days_only": {
                "default": false,
                "description": "When true, count supplier and transit days as\nMonday-Friday only. Default false.",
                "type": "boolean"
              }
            },
            "required": ["supplier_days", "transit_days"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lead Time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:9d1838ea8aa3a98953532b98bc4570fd50ff564e9b59471f1c592e593957521a"
        },
        {
          "name": "margin_check",
          "title": "Margin Check",
          "description": "Show what one sale actually leaves after every cost. FREE.\n\nSubtracts supplier cost, shipping, payment fees, the ad spend that found\nthe buyer, and anything else, then reports the break-even price so you\nknow how much room there is. Typical input {\"sell_price\": 39.99,\n\"supplier_cost\": 12.4, \"shipping_cost\": 4.2, \"ad_cost_per_order\": 9}\nreturns {\"revenue\": 39.99, \"total_cost\": 27.06, \"profit\": 12.93,\n\"margin_pct\": 32.33, \"markup_pct\": 222.5, \"break_even_price\": 27.06,\n\"biggest_cost\": \"supplier_cost\"}.\n\nUse before listing a product. Not for a whole tiered price list (that is\nprice_ladder) and not for the effect of returns, which is returns_impact. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ad_cost_per_order": {
                "default": 0,
                "description": "Blended acquisition cost per order. Default 0,\nbut leaving it at 0 is the most common way this maths lies.",
                "minimum": 0,
                "type": "number"
              },
              "other_cost": {
                "default": 0,
                "description": "Anything else per order: packaging inserts, app fees,\nsupport time. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "payment_fee_fixed": {
                "default": 0.3,
                "description": "Processor fixed fee per transaction. Default 0.30.",
                "minimum": 0,
                "type": "number"
              },
              "payment_fee_pct": {
                "default": 2.9,
                "description": "Processor percentage fee. Default 2.9 (a common\npublished rate, not a statement about your account).",
                "minimum": 0,
                "type": "number"
              },
              "sell_price": {
                "description": "What the customer pays, excluding tax. Must be above 0.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "shipping_cost": {
                "default": 0,
                "description": "Shipping you absorb per order. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "supplier_cost": {
                "description": "What the supplier charges you per unit.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["sell_price", "supplier_cost"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Margin Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a8c5799ba841b330e2580bdca06f2de40f7bfa4ee364a56792e56795391641f5"
        },
        {
          "name": "moq_planner",
          "title": "Moq Planner",
          "description": "Decide how much to order against demand, lead time and the cash you have. PREMIUM (license).\n\nA minimum order quantity is a cash-flow decision disguised as a purchasing\none. Typical input {\"unit_cost\": 4.2, \"moq\": 500, \"monthly_demand\": 120,\n\"cash_available\": 3000, \"lead_time_days\": 45} returns {\"moq_cost\": 2100.0,\n\"months_of_cover\": 4.17, \"affordable\": true, \"cash_after\": 900.0,\n\"reorder_point_units\": 236, \"verdict\": \"...\"}.\n\nUse before committing to a supplier's minimum. Not for the margin each\nunit earns: that is margin_check. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cash_available": {
                "description": "Cash you can commit to stock right now.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "lead_time_days": {
                "default": 30,
                "description": "Days from placing the order to stock being sellable.\nDefault 30.",
                "minimum": 0,
                "type": "integer"
              },
              "monthly_demand": {
                "description": "Units you expect to sell per month. Must be above 0.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "moq": {
                "description": "The supplier's minimum order quantity, in units.",
                "minimum": 1,
                "type": "integer"
              },
              "safety_weeks": {
                "default": 2,
                "description": "Weeks of demand held as buffer against a late delivery.\nDefault 2.",
                "minimum": 0,
                "type": "number"
              },
              "unit_cost": {
                "description": "Cost per unit at the MOQ. Must be above 0.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["cash_available", "monthly_demand", "moq", "unit_cost"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Moq Planner"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:7f13d2f92a54811feeccf37acdbc2fc15c841336da50cd1d6788704a50550e87"
        },
        {
          "name": "price_ladder",
          "title": "Price Ladder",
          "description": "Work backwards from the margin you want to the price you must charge. FREE.\n\nSolves for price including the percentage fee, which is why it is not\nsimply cost divided by one minus margin. Typical input {\"supplier_cost\":\n12.4, \"target_margins_pct\": [30, 40, 50], \"shipping_cost\": 4.2} returns\n{\"rows\": [{\"target_margin_pct\": 30, \"price\": 25.99, \"total_cost\": 17.65,\n\"profit\": 8.34, \"actual_margin_pct\": 32.07}, ...]}.\n\nUse when setting a price list. Not for checking one price you already have:\nthat is margin_check. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"target_margins_pct must contain at least one margin\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "charm_ending": {
                "default": ".99",
                "description": "Force prices to end in these cents, e.g. \".99\". Pass an\nempty string for exact prices. Default \".99\".",
                "type": "string"
              },
              "payment_fee_fixed": {
                "default": 0.3,
                "description": "Processor fixed fee. Default 0.30.",
                "minimum": 0,
                "type": "number"
              },
              "payment_fee_pct": {
                "default": 2.9,
                "description": "Processor percentage fee. Default 2.9.",
                "minimum": 0,
                "type": "number"
              },
              "shipping_cost": {
                "default": 0,
                "description": "Shipping you absorb per order. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "supplier_cost": {
                "description": "Per-unit cost from the supplier. Must be above 0.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "target_margins_pct": {
                "description": "Margins to solve for, e.g. [30, 40, 50]. Each\nmust be above 0 and below 100.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["supplier_cost", "target_margins_pct"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price Ladder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:21fa688e23958364d5dcb99a18fd2a4c1d51cb0047fa41f6accb11a91cd2ce6e"
        },
        {
          "name": "returns_impact",
          "title": "Returns Impact",
          "description": "Show what a return rate does to a margin that looked fine. PREMIUM (license).\n\nA 10% return rate does not cost 10% of profit. A returned order gives back\nthe refund, adds inbound shipping, and recovers only the goods, never the\nadvertising that found the buyer. Typical input {\"sell_price\": 39.99,\n\"unit_profit\": 13.23, \"unit_cost\": 12.4, \"return_rate_pct\": 8,\n\"restock_pct\": 70, \"return_shipping\": 6} returns {\"cost_per_return\":\n37.31, \"effective_profit\": 10.25, \"profit_lost_pct\": 22.56,\n\"break_even_return_rate_pct\": 35.46}.\n\nUse when a category's returns are high enough to argue about. Not for the\npre-returns margin itself: that is margin_check. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "refund_pct": {
                "default": 100,
                "description": "Percentage of the sale price refunded, e.g. 100 for a\nfull refund or 80 when a restocking fee is kept. Default 100.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "restock_pct": {
                "default": 0,
                "description": "Percentage of returned units resellable at full price.\nDefault 0, the conservative case.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "return_rate_pct": {
                "description": "Percentage of orders returned, e.g. 8.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "return_shipping": {
                "default": 0,
                "description": "What an inbound return costs you. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "sell_price": {
                "description": "Price the customer paid.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unit_cost": {
                "description": "What the goods themselves cost you, the only part a\nrestocked unit gives back. Advertising and fees do not return.",
                "minimum": 0,
                "type": "number"
              },
              "unit_profit": {
                "description": "Profit on one kept sale, from margin_check. May be\nnegative, which the result will make obvious.",
                "type": "number"
              }
            },
            "required": ["return_rate_pct", "sell_price", "unit_cost", "unit_profit"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Returns Impact"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:cccdb1df7225114258efd888681b779ccb3a4957d1034fa495726861d59a532a"
        },
        {
          "name": "sku_map_check",
          "title": "Sku Map Check",
          "description": "Find the breaks in a supplier-to-store SKU map before they ship. FREE.\n\nTwo store SKUs pointing at one supplier SKU is usually intentional; two\nsupplier SKUs claiming one store SKU is not, and it sends the wrong item.\nTypical input {\"mapping\": {\"STORE-1\": \"SUP-A\", \"STORE-2\": \"SUP-A\",\n\"STORE-3\": \"\"}} returns {\"ok\": false, \"count\": 3, \"empty_targets\":\n[\"STORE-3\"], \"shared_supplier_skus\": {\"SUP-A\": [\"STORE-1\", \"STORE-2\"]},\n\"whitespace_issues\": []}.\n\nUse before importing a mapping or handing one to a fulfilment app. Not for\nvalidating Shopify's CSV columns: that is the shopify server. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"mapping must contain at least one store SKU\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mapping": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Store SKU to supplier SKU, e.g. {\"STORE-1\": \"SUP-A\"}. At\nleast one entry.",
                "type": "object"
              }
            },
            "required": ["mapping"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sku Map Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:5c4140e16cee4d4ebee8185e1d49d554179664fdae5683c6bc45fc61481a4e85"
        }
      ],
      "digest": "sha256:f940a731514f31ea0ddd6b10c7b9c0d206193277b3003ea070262797e0c8f722"
    }
  }
