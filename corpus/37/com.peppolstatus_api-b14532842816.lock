        {
          "name": "get_participants_mix",
          "description": "Get a filtered participant breakdown\n\nThe participant set broken down by country, entity type, NACE Rev. 2.1 division, size class, region and serving Access Point, over a FILTERED slice — so a breakdown stays true while the list is cut down. The filters are the same names and shapes as `GET /v1/participants`.\n\nTWO SOURCES, one shape, named by `source`. A request that narrows on NOTHING is answered from the hourly rollup (`source: \"rollup\"`, with `refreshed_at`) — the whole-network breakdown, no scan. A request that narrows is computed live (`source: \"slice\"`).\n\nBOUNDED BY DESIGN. A live slice is computed only while it is narrow (under an internal cap of 10,000 participants). A slice wider than the cap, or a request carrying a filter this endpoint cannot express (`doctype`, `transport_profile`, `q`, `host`, `sub_provider`), answers `degraded: true` with every mix null — never a wrong number and never an error. Callers fall back to the whole-network breakdown on `GET /v1/stats/participants`.\n\nCounts are sparse the same way the rollup facets are: company enrichment covers a handful of registers, so every mix except `country_mix` sums BELOW `participant_count` and the un-enriched remainder is derived from the total rather than served as a bucket. `ap_mix` names the busiest Access Point Seats and folds the rest into one `__other__` bucket.",
          "inputSchema": {
            "properties": {
              "ap": {
                "description": "Comma-array of serving Access Point SeatIDs (`PBE000123,PNO000456`).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "description": "Comma-array of ISO-3166-1 alpha-2 country codes. Matched on the participant's card country, falling back to the country its ICD prefix implies — the same rule `country_mix` buckets on.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "entity_type": {
                "description": "Comma-array of company legal-form families (`company`,`natural_person`,`association`,`public`), from the company-register enrichment denormalized onto the participant.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "not_country": {
                "description": "Comma-array of country codes (`NO,SE`) to EXCLUDE. Rows with no value are KEPT — excluding a value never drops the un-enriched remainder. Combines with its include twin: `?region=NO-03&not_region=NO-32` applies both.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "not_entity_type": {
