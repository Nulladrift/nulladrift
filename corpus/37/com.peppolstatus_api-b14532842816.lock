        {
          "name": "get_doctype_family_countries",
          "description": "A family's receivers by country\n\nOne document family's receiving participants sliced by ISO-3166 alpha-2 country (issue #652), each with its share of the family total. The country is derived from the participant identifier's ICD; unresolved identifiers bucket as `ZZ`. An unknown family returns an empty `countries` array. Keyless-cacheable.",
          "inputSchema": {
            "properties": {
              "family": {
                "description": "The doctype family name (e.g. `Invoice`, `Order`, `Credit Note`).",
                "type": "string"
              }
            },
            "required": ["family"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
