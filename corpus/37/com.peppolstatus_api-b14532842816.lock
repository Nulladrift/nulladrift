          "description": "List the latest De-registered IDs\n\nThe De-registered IDs of `/v1/stats/deregistered` (same population, same daily rollup) with the newest leave date: at most 1000, newest first, cursor-paginated. Each item is a `/v1/participants` list item plus `left_at`, the close of its latest registration.\n\n`left_at` is recorded about 3 days after the true leave, and a date before 2026-08-02 is not reliable. An ID that is registered again since the rollup run is left out, so a page can be shorter than `total` says. `/v1/participants?registered=false` is a wider list: it also holds the never-registered IDs, which are not de-registered.",
