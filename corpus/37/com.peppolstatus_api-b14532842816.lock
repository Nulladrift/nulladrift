        {
          "name": "list_cohort_move_participants",
          "description": "List participants in a bulk AP migration\n\nThe drill-down: the participant IDs behind one cohort, oldest observation day first. A cohort's membership is DEFINED as the mover events its provider pair and day range select, so this list is always in step with the cohort's counts. Cursor-paginated on (day, value).\n\n`id` is the request-lifetime handle from `GET /v1/stats/cohort-moves`. The detector re-clusters the trailing window on every run, so a handle whose cohort boundaries have since shifted answers 404 rather than a stale list — re-read the feed instead of persisting ids.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor returned as `next_cursor` by the previous page.",
                "type": "string"
              },
              "id": {
                "description": "The cohort handle: 16 lowercase hex characters.",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Page size, clamped to [1, 200]. Defaults to 50.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
