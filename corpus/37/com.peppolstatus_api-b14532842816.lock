        {
          "name": "get_network_stats",
          "description": "Get the network-level statistics\n\nHow the whole network moves: Movers (AP) and Movers (SMP), Cross-border moves, Bulk moves, Joiners, Leavers and Net growth, the Leaver rate (annualized), Concentration (AP) and Concentration (SMP) (HHI, top 5, top 10), Concentration per country, Foreign-served participants and penetration. Each flow statistic gives its count over the last 7 and 30 days, the 7-day mean and the change against the period before.\n\nEvery rate is of the registered-participant count at the START of its period (`base`, the end of `base_day`) and is returned beside its absolute count. A day with no completed change scan is a gap: `gap_days` counts them, and moves found after a gap are counted on the next scan day. A 7-day mean is the mean over the scanned days of its window; a gap day is in neither the sum nor the divisor, and a window of gap days only has no mean (null). The series starts 2026-08-02; a window that would open earlier is clamped to it. `as_of` is the last complete UTC day and every flow period ends there. Concentration, Foreign-served participants and penetration are snapshots: each is the latest stored value and carries its own `day`, which can be one day after `as_of`.\n\n`concentration_by_country` gives, per country, how the Peppol IDs of that country are shared over the providers that serve it: the HHI, the effective number of providers (10000 / HHI), the largest provider with its share, the top-4 and top-10 shares and the number of providers above 1%. The basis is the provider rosters (certificate seats); Vendors are not counted. Only a country with 8 or more providers is returned.\n\nThe headline numbers are free. The organic/bulk split, the cross-border split, the bulk share, penetration and the 30-day trends are returned for a Market key only (see `x-required-tier` on the fields); the body is private to the caller.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dff55530057a1bb89a75d9a48ec3796ceb97eb4aedf9a2087f0f0012124bae3c"
        },
        {
          "name": "get_network_stats_history",
          "description": "Get one network-level statistic as a daily series\n\nOne point for every UTC day of the window. `stat` is required. A flow statistic (`ap_switching` = Movers (AP), `cross_border` = Cross-border moves, `smp_switching` = Movers (SMP), `growth` = Net growth with Joiners and Leavers) carries per day its counts (`values`), the registered-participant count at the start of the day (`base`), the first key as a percentage of that base (`pct`) and its 7-day mean (`mean_7d`). For `cross_border`, `base` is all AP moves of the day and `pct` is the cross-border share of them. A day with no completed change scan has `gap: true` and `values: null` — a gap is never 0. The 7-day mean is the mean over the scanned days of `day − 6 .. day`: a gap day is in neither the sum nor the divisor, and the mean is null when all are gaps. It is the same figure as `trend_30d` of `/v1/network/stats`. For `growth`, a gap day keeps `joiners` and nulls `leavers` and `net`. A stock statistic (`concentration_ap` = Concentration (AP), `concentration_ap_country` = Concentration per country, `concentration_smp` = Concentration (SMP), `foreign_served` = Foreign-served participants, `penetration`) carries `values`, null on a day with no snapshot; `foreign_served` also carries `base`, the registered participants of that day. `concentration_ap`, `concentration_ap_country`, `foreign_served` and `penetration` have no history before their first snapshot. A day with no snapshot is absent, not 0. The series starts 2026-08-02.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Inclusive lower bound (YYYY-MM-DD UTC). Defaults to 90 days ago; clamped to 2026-08-02.",
                "format": "date",
                "type": "string"
              },
              "stat": {
                "description": "REQUIRED. The statistic to return: `ap_switching` (keys total, organic, bulk, platform), `cross_border` (cross, same, unknown, strict_cross, strict_unknown), `smp_switching` (total), `growth` (net, joiners, leavers), `concentration_ap` / `concentration_smp` (cr5_pct, cr10_pct, hhi, total, providers), `concentration_ap_country` (per country with 8 or more providers: hhi, effective_providers, leader_pct, top4_pct, top10_pct, providers_over_1pct, providers, total), `foreign_served` (pct, foreign, domestic, unknown) or `penetration` (per country: pct, on_peppol, universe).",
                "enum": ["ap_switching", "cross_border", "smp_switching", "growth", "concentration_ap", "concentration_ap_country", "concentration_smp", "foreign_served", "penetration"],
                "type": "string"
              },
              "to": {
                "description": "Inclusive upper bound (YYYY-MM-DD UTC). Defaults to yesterday, the last complete day.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e8848ed4a4736884326fd8b0cf6ceb862e8548337754320c8f6914e24d64ecb"
        },
