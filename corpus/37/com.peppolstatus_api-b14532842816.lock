      "serverInfo": {
        "name": "peppolstatus",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only access to live Peppol network data, mirroring the public /v1 REST API — participants, providers, access points, SMPs, hosts, uptime, incidents, anomalies, change events, adoption statistics, and SML zone status. Every tool is read-only. The keyless (free) tools cover network health, participant statistics, SML status, a single participant record lookup, and the dashboard summary; the other tools require an API key (Authorization or X-API-Key header) from a Network or Market plan with the API & MCP access add-on — without one they return a 403 pointing to https://peppolstatus.com/pricing/. A key also raises rate limits. Prefer specific filters and small limits — responses are paginated, so page through large result sets with the returned next_cursor. Use is governed by the Terms of Service at https://peppolstatus.com/terms/.",
      "tools": [
        {
          "name": "get_access_point",
          "description": "Get an access point\n\nOne Provider's detail: display name, verified flag, member seats (each with its embedded provider or unverified cert-CN), roster size, and the country + document-scheme composition of its roster. A request for a STALE key (a seat since curated, so its old unverified key left the directory) resolves to the current Provider; the returned `key` is always the canonical current one. `software` groups the Provider's sighted hosts by registrable domain with the crawled identity of each, and `hostname_count` / `smp_hostname_count` give the true totals behind the capped `hostnames` / `smp_hostnames` samples. `smp_tenants` lists the Access Points (seats) that serve the participants on this Provider's SMP hosts — on a multi-tenant SMP most of the hosted footprint belongs to other APs — with `smp_tenant_count` / `smp_tenant_other` / `smp_tenant_no_ap` so the rows add up to `hosted_participant_count` (both come from the same rollup run); `smp_hosted_by` is the reverse: other providers' SMPs that carry this AP's participants. Each `sub_providers` bucket names its Vendor (`name`) and links to the Vendor's row (`vendor_key`).\n\nA Vendor key (`v-<slug>`) returns the Vendor detail instead and needs a Market-tier key: the Providers it connects through (`via`), its participants and Companies, the signals that back the row, and the composition of its roster. A Vendor has no Seats, no certificate and no hosts of its own.",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "The provider key (e.g. `c-tickstar`, `o-teamleader-nv-1f3a2b9c`), or a Vendor key (`v-exact`).",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:65c8fefae357b6c7ee9d9c7e1712b8cae5e6a50b34bc3f43bbecbeffab3f6f91"
        },
        {
          "name": "get_access_point_churn",
          "description": "Get an access point's churn\n\nAn Access Point's joiner / mover / leaver activity over a period: a daily category series with derived net growth, period totals, and the 'won from / lost to' counterpart breakdown. Joiners are first-ever serving seats (from 2026-08-02 onward, first-full-deep-sweep completion); movers change Provider (both sides resolved to the current identity); leavers deregister while served. Defaults to the trailing 30 days.\n\nA Vendor key (`v-<slug>`) returns the same shape for the Vendor, from a daily comparison of its membership. Movement is counted from `churn_since`; there is no history before it. A counterpart is a Provider or another Vendor (`kind`). `match_totals` and the `newly_matched` / `no_longer_matched` series count membership changes with no real event behind them (a signal appeared or disappeared): they are a data-quality figure, not movement, and are never in `net_growth`.\n\nFor a Provider key, `counterpart_flow` gives each mover side (out, in) its top counterpart with its share and the effective number of counterparts, over the requested period. The share is null under 25 movers on that side and the effective number under 100. A Vendor key has no `counterpart_flow`.\n\nPLATFORM MOVES. A mover is a platform move when the platform that serves the participant stayed and only the certificate Seat changed: it is not a customer decision. The verdict is per DIRECTED provider pair (from → to), over all its movers since 2026-08-02, with one of two reasons (`same_host`, `sub_provider`): at least 90% of the movers whose endpoint host can be compared (5 or more, and at least 50% of all movers of the pair) kept their endpoint host, or at least 90% of 25 or more movers still carry, at the new provider, the sub-provider brand of the provider they left. It is a CURRENT judgment, computed again on every rollup cycle. For a Provider key, the movers of a platform-move pair are in `platform_won` / `platform_lost` of the counterpart and not in its `won` / `lost`; the flag is per direction (counterpart → Provider, Provider → counterpart). `totals.platform_in` / `totals.platform_out` are their sums. `totals.movers_in`, `totals.movers_out`, `net_growth` and the daily series still count all movers. A Vendor key is not changed: its counterparts have no platform fields.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Inclusive period start, `YYYY-MM-DD` UTC. Defaults to 29 days before `to`.",
                "format": "date",
                "type": "string"
              },
              "key": {
                "description": "The Provider key (e.g. `c-tickstar`), or a Vendor key (`v-exact`).",
                "type": "string"
              },
              "to": {
                "description": "Inclusive period end, `YYYY-MM-DD` UTC. Defaults to today.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2b5d9296b7ebdb26027d656ebf5522d8fb6803f1c4222a399468cc336da82c3f"
        },
        {
          "name": "get_access_point_roster_mix",
          "description": "Get a filtered access point roster breakdown\n\nThe five roster breakdowns of `GET /v1/aps/{key}` (country, entity type, NACE Rev. 2.1 division, size class, region) recomputed over a FILTERED slice of the roster, so a breakdown stays true while the roster is cut down. The filters are the same names and shapes as `GET /v1/participants`, scoped to this provider's seats.\n\nBOUNDED BY DESIGN. The breakdowns are computed only when the filtered slice is narrow (under an internal cap of 10,000 participants). A request that narrows on nothing, that carries a filter this endpoint cannot express (`doctype`, `transport_profile`, `q`, `host`, `sub_provider`, `postcode`, `provenance`, `vat_liable`), or whose slice is too wide answers `degraded: true` with every mix null — never a wrong number and never an error. Callers fall back to the stored whole-roster mixes on `GET /v1/aps/{key}`.\n\nCounts are sparse the same way the stored mixes are: company enrichment covers a handful of registers, so every mix except `country_mix` sums BELOW `participant_count` and the un-enriched remainder is derived from the total rather than served as a bucket.\n\nA Vendor key (`v-<slug>`) answers the same question over the Vendor's roster and needs a Market-tier key. `seat` then selects one Seat the Vendor connects through.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Comma-array of ISO-3166-1 alpha-2 country codes. Matched on the participant's card country, falling back to the country its ICD prefix implies — the same rule the stored `country_mix` buckets on.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "entity_type": {
                "description": "Comma-array of company legal-form families (`company`, `natural_person`, `association`, `public`).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "key": {
                "description": "The provider key (e.g. `c-tickstar`, `o-teamleader-nv-1f3a2b9c`), or a Vendor key (`v-exact`).",
                "type": "string"
              },
              "not_country": {
                "description": "Comma-array of country codes (`NO,SE`) to EXCLUDE. Rows with no value are KEPT — excluding a value never drops the un-enriched remainder. Combines with its include twin: `?region=NO-03&not_region=NO-32` applies both.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "not_entity_type": {
                "description": "Comma-array of company legal-form families (`company`,`natural_person`,`association`,`public`) to EXCLUDE. Rows with no value are KEPT — excluding a value never drops the un-enriched remainder. Combines with its include twin: `?region=NO-03&not_region=NO-32` applies both.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "not_region": {
                "description": "Comma-array of company seat region codes (`NO-32,BE-BRU`) to EXCLUDE. Rows with no value are KEPT — excluding a value never drops the un-enriched remainder. Combines with its include twin: `?region=NO-03&not_region=NO-32` applies both.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "not_sector": {
                "description": "Comma-array of 2-digit NACE Rev. 2.1 divisions (`47,62`) to EXCLUDE. Rows with no value are KEPT — excluding a value never drops the un-enriched remainder. Combines with its include twin: `?region=NO-03&not_region=NO-32` applies both.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "not_size": {
                "description": "Comma-array of company size band codes (as stored: `21,NN`; FR and NO only) to EXCLUDE. Rows with no value are KEPT — excluding a value never drops the un-enriched remainder. Combines with its include twin: `?region=NO-03&not_region=NO-32` applies both.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "region": {
                "description": "Comma-array of company seat region codes (`NO-32,BE-BRU`).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "registered": {
                "description": "Restrict to participants present (`true`) or absent (`false`) in the Peppol Directory.",
                "type": "boolean"
              },
              "scheme": {
                "description": "Comma-array of Peppol identifier schemes.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "seat": {
                "description": "Scope the slice to ONE member seat of this provider. A seat that is not a member answers an empty (not degraded) slice. Single-valued.",
                "type": "string"
              },
              "sector": {
                "description": "Comma-array of 2-digit NACE Rev. 2.1 divisions (`47,62`).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "size": {
                "description": "Comma-array of company size classes (as stored).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "smp": {
                "description": "Comma-array of SMP hostnames serving the participant.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d80229fa1546a4cfed202ec52c1c053bffb6e39c12b268dc5580a4490ab91d64"
        },
        {
          "name": "get_adoption",
          "description": "Get a country's adoption aggregates\n\nPeppol adoption for one country as one bare object: headline totals (universe, on_peppol, penetration), the single-dimension cuts (sector with a NACE Rev. 2.1 section rollup (A–V), region, FR-only département, size class (FR and NO), BE-only province + postcode + mandate scope, legal-form family, and company age), the same categorical cuts cross-tabbed by company-age band (`cuts_by_age`), and the trend (monthly new adopters plus per-run penetration history). Region cells carry ISO 3166-2 (BE, NO, SK) / INSEE région (FR) codes and sector cells the NACE Rev. 2.1 division code, so the choropleth joins geometry with no string matching. Numerator cells below 10 matched companies are suppressed (`on_peppol`/`penetration` null, `suppressed` true); denominators are never suppressed. Cached for a day (data moves monthly).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country code — `be`, `fr`, `sk`, `no`, `se`, `fi` or `si`.",
                "enum": ["be", "fr", "sk", "no", "se", "fi", "si"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5133cf7e7acf46b09f703977f0efa741f1553b0661e5ef039eb0c37e8b9ddb52"
        },
        {
          "name": "get_anomaly",
          "description": "Get an anomaly\n\nOne anomaly by its stable content-derived key.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The stable anomaly key.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1c2d0dc86e539535b429cb048c6c70a9ffcc0711066261a04724139e63a4a497"
        },
        {
          "name": "get_compliance_stats",
          "description": "Network compliance landscape\n\nThe free compliance landscape (issue #692): per-country error rates — the share of a country's registered participants that break at least one published Peppol rule — and the per-rule breakdown of every open finding. Counts ONLY: no participant, seat or hostname appears here; the participant-level records are `GET /v1/compliance/findings` (Network tier). Read from the pre-computed compliance rollup tables and edge-cached. Keyless-cacheable.\n\nPass `country` to scope the whole body to one country (issue #716): the same shape, with `countries` holding that one cell, `rules` its own breakdown, each rule's `share` a share of THAT country's open findings, and the code echoed back in `country`. A country scope is how a structural national pattern is told apart from a real problem — AU and NZ, for example, break `not_in_peppol_directory` almost everywhere because A-NZ PINT participants are absent from the European Peppol Directory by design.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Scope the landscape to one ISO 3166-1 alpha-2 country (or `ZZ`, the bucket for findings whose subject resolves to no country). A country the rollup has not seen returns an empty landscape, not an error.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9426ed703f412a96785bc5499810b33befcdfcc2f411c3478fb43f8a5973b582"
        },
        {
          "name": "get_compliance_stats_history",
          "description": "Network compliance trend\n\nThe network compliance picture over time: one point per UTC day the rollup ran, carrying that day's participant denominator, affected participants, error rate and open findings by grade. The series starts the day the rollup first ran. Keyless-cacheable.\n\nPass `country` for one country's trend (issue #716) — the same series shape, restricted to that country and echoed back in `country`. The per-country series starts the day the country rollup first ran, which is later than the network one.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Scope the trend to one ISO 3166-1 alpha-2 country (or `ZZ`). A country the rollup has not seen returns an empty series, not an error.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "from": {
                "description": "Inclusive lower bound (YYYY-MM-DD UTC). Defaults to 90 days ago.",
                "format": "date",
                "type": "string"
              },
              "to": {
                "description": "Inclusive upper bound (YYYY-MM-DD UTC). Defaults to today.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ec18824ddc2e8184f65dcf8c7432f57fd142bcac313bbf3a2019a70dbd1d85f3"
        },
        {
          "name": "get_country_churn",
          "description": "Per-country participant churn\n\nNew (joiner) vs departed (leaver) participants for one country, as a daily series and an all-time monthly rollup, from the hourly churn rollup. A valid but unknown country returns empty arrays. Keyless-cacheable.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Two-letter country code (ISO 3166-1 alpha-2), case-insensitive.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "from": {
                "description": "Inclusive lower bound of the daily series (YYYY-MM-DD UTC). Defaults to 30 days ago.",
                "format": "date",
                "type": "string"
              },
              "to": {
                "description": "Inclusive upper bound of the daily series (YYYY-MM-DD UTC). Defaults to today.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:11d419b48736c4f780e5c45c5423ddf646b78eb4aeb1f547efcb5c858bb6b83d"
        },
        {
          "name": "get_country_providers",
          "description": "Providers serving a country\n\nThe Access Points serving one country, ranked two ways from the hourly rollup: `providers` by participant (Peppol-ID) count, and `providers_by_company` by the number of DISTINCT organizations (real businesses) each serves (issue #467). Each row's `key` is the `/v1/aps/{key}` handle and `share` is that provider's fraction of the country's AP-served total for its metric. `company_coverage` (0..1) is how much ID→organization dedup the market shows — ~0 (and `providers_by_company` empty) for markets without register enrichment, meaningfully positive for BE/FR. A valid but unknown country returns empty lists. Keyless-cacheable.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Two-letter country code (ISO 3166-1 alpha-2), case-insensitive.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23bc3ffd4860e23567f1dea6faab79a2995ce155118b891745479a1ded7a59bd"
        },
        {
          "name": "get_deregistered_company_stats",
          "description": "Get the company breakdown of the De-registered IDs\n\nWho left: the De-registered IDs of `/v1/stats/deregistered` (same population, same daily rollup, same `deregistered` total) by company profile, register status, lifetime, re-activation and leftovers.\n\n`entity_type`, `sector`, `size` and `region` come from the company register (BE, FR, NO, SE, FI and SI only) and cover the `enriched` IDs: the cells of each of the four add up to `enriched`, with the key `unknown` for an enriched ID that has no value in that breakdown. Each cell carries `base`, the registered IDs in the same cell, so the two mixes can be compared. `company_status` is the status of the company in its register now: `active` (still in business, gone from Peppol), `ceased`, or `unmatched` (no register match). `lifetime` is the time from the join date to the de-registration; `unknown` holds the IDs with no usable join date or a leave before 2026-08-02. `leftovers` counts the De-registered IDs that still have a Peppol Directory entry (`directory_card`). `reactivation` is the share of the IDs de-registered since 2026-08-02 that are registered again.\n\nA count below 10 is withheld (`count: null`, `suppressed: true`), and so is a cell with a registered base from 1 to 9 (`base: null` too). When one cell alone of a breakdown is withheld, the next-smallest cell is withheld with it, so that it cannot be had back by subtraction (not for `leftovers`, which is part of no total). Counts only: no company and no natural person is named.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:82d057613db7a10738ea7602cffba61a3c73fabcba2509d944c5033857385d72"
        },
        {
          "name": "get_deregistered_stats",
          "description": "Get the De-registered overview\n\nThe participants that left the network. A De-registered ID is a participant that is not registered now AND has at least one closed registration row. An ID that was never observed registered (not scanned yet, or never in the SML) is not de-registered: it is counted apart in `never_registered` and is in no other number here. `leavers` is the sub-count of the De-registered IDs that left while a Provider served them.\n\n`deregistered`, `share_pct` and `countries` are the stock of the daily rollup (`as_of`). `flow` and `weekly` are the leave flow from the network growth series of `/v1/network/stats`, to the last complete UTC day: `flow.d7` and `flow.d30` are the same counts as `leavers.last_7d` and `leavers.last_30d` there. A day with no completed change scan is a gap: its de-registrations are counted on the next scanned day, so a period sums all its days and `gap_days` only marks it. A period or a week of gap days only has `leavers: null` — a gap is never 0. Joiners do not depend on the change scan, so a gap day keeps them. `annualized_leave_rate_pct` is the Leaver rate (annualized), the same figure as `leavers.annualized_pct` of `/v1/network/stats`: the 30-day leavers as a percentage of the registered participants at the start of the period, × 365 / the days of the period. Leave dates are reliable from 2026-08-02 (`reliable_from`); a period that would open earlier is clamped to it, and the weekly trend starts there. The event date of a de-registration is about 3 days after the true leave (3 consecutive scans without the ID).\n\nFree. The company breakdown of the same population is `/v1/stats/deregistered/companies` (Market).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ab34d06b4779f923ea591b705cd2a2e170317a8aea50fef65b64952fc7b7809e"
        },
        {
          "name": "get_doctype_family",
          "description": "Doctypes within a family\n\nThe concrete document types within one family (issue #647): each doctype's local name, version, participant count, and share of the family. An unknown family returns an empty `doctypes` array. Keyless-cacheable.",
