        {
          "name": "list_smps",
          "description": "List SMPs\n\nThe SMP directory: every current SMP hostname with the seat(s) and provider that sign its metadata, busiest first. A hostname is listed if it currently homes participants (from the participant rollup's `smp` facet) or carries an open `smp-signing` certificate. `participant_count` comes from that bounded top-N facet, so a hostname with a signing cert but outside the top-N carries a null count (unknown), not zero. The provider is resolved from the most-recent open signing cert with the precedence curated mapping (verified) → unverified cert-CN — the same as `/v1/aps`. `provider` is who OPERATES the host; `owner` names the party the curated registry says OWNS it, and is set only when that is a different party (a shared registry SMP served under another party's cert), else null. Not paginated (the envelope's `next_cursor` is always null).",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Cap on returned rows (non-negative integer). Defaults to all.",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Case-insensitive substring filter on the SMP hostname.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:24b5f18893f57440a5c1331ea941dc58e246139d5dfa19c23cfb9dc9a0c35dbd"
        },
        {
          "name": "list_software",
          "description": "List the software library (Market)\n\nThe software catalogue's PRODUCT taxonomy joined to what the network shows: for every engine, its display name, vendor, category and homepage, the current host count broken down by observed role, when it was first and last seen, a compliance signal for the seats running it, and a host-count trend of up to 90 UTC days.\n\nEvery catalogue engine appears, including one the network does not currently show (`hosts: 0`, a flat trend) — the library is the catalogue, not only today's sightings. `category` is the vendor's own framing; `roles` is the OBSERVED fact and is the one to trust where the two disagree.\n\n`compliance.seats_linked` is deliberately not called \"owned\": an engine → seat link is MANY-TO-MANY, so a seat whose hosts run two engines is counted under both and its findings appear under both. Summing `open_findings` across engines therefore OVER-COUNTS the network total; the figure answers \"how much compliance debt sits behind this engine\", never \"who is to blame\". `compliance` is null when no seat is linked to the engine, and `snapshot_date` always travels with the numbers because the daily rollup can be a day stale.\n\n`lanes[]` (issue #798) reports each tracked upstream LANE of the engine — a lane is not an engine: `oxalis` covers three independent release ladders — with its `latest_release` and the `hosts_current` / `hosts_behind` / `hosts_unknown` split of the hosts running it (all three null when any is below 10). `advisories` summarises the live advisories published for the product by CVSS severity. Both are NULL — never `[]` or zero counts — for the engines the catalogue tracks no upstream feed for. Market tier.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 90,
                "description": "Trend window in trailing UTC days, 1..90 (default 90). The ceiling is part of the contract — `days` can only narrow the window, never widen it.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:82d8d75c844952ed1fcfd589d0e6b9cf048cf5a99373a9e1a0569c00cad2dd0f"
        }
