        {
          "name": "list_access_point_churn_participants",
          "description": "List participants behind a churn category\n\nThe drill-down: the participant IDs behind one churn category count for this Provider over the period, newest observation day first. `counterpart` narrows a mover category to the participants won from or lost to one Provider. Cursor-paginated in pages of at most 500: follow `next_cursor` until it is null. A Vendor key (`v-<slug>`) lists the Vendor's events, also accepts `newly_matched` and `no_longer_matched`, and adds `counterpart_kind` to each item. `category` takes a comma list, or `net` for the four net-growth categories: the items come in the order joiner, mover_in, mover_out, leaver (then newly_matched, no_longer_matched), each category newest day first, and every item names its `category`. `day` is the short form of `from` = `to` = that day. The counts are of participant IDs, not companies: group on `company_key` to count companies.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "The churn categories to expand: one of `joiner`, `mover_in`, `mover_out`, `leaver`, `newly_matched`, `no_longer_matched`, a comma list of them (`joiner,leaver`), or `net` for `joiner,mover_in,mover_out,leaver`. `newly_matched` and `no_longer_matched` are valid for a Vendor key only (and are never in `net`); with a Provider key they are a 400.",
                "pattern": "^[a-z_]+(,[a-z_]+)*$",
                "type": "string"
              },
              "counterpart": {
                "description": "Filter to one counterpart Provider key: the Provider the participants were won from (`mover_in`) or lost to (`mover_out`). Allowed with the two mover categories only. For a Vendor key the counterpart can also be a Vendor key. An unknown key returns an empty list.",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque pagination cursor returned as `next_cursor` by the previous page.",
                "type": "string"
              },
              "day": {
                "description": "One UTC day, `YYYY-MM-DD`: the short form of `from` = `to` = `day`. A 400 together with `from` or `to`.",
                "format": "date",
                "type": "string"
              },
              "from": {
                "description": "Inclusive period start, `YYYY-MM-DD` UTC.",
                "format": "date",
                "type": "string"
              },
              "key": {
                "description": "The Provider key, or a Vendor key (`v-<slug>`).",
                "type": "string"
              },
              "limit": {
                "default": 500,
                "description": "Page size, clamped to [1, 500]. Defaults to 500 (20 through MCP).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Inclusive period end, `YYYY-MM-DD` UTC.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["category", "key"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f4a6cbea54f27cf63a3b3362703b67ff70f5f09398d74ebc8ada1ab1bb0ef8b"
        },
        {
          "name": "list_access_points",
          "description": "List access points\n\nThe Access Point directory: every Provider in its serving role, with its member seats and roster size (current participant count), busiest first. A Provider is resolved from each seat with the precedence curated mapping (verified) → exact signing-cert `O=` string (unverified) → bare SeatID. Not paginated (the envelope's `next_cursor` is always null). Pass `?country=CC` to compare providers within one market instead of network-wide. Every item carries the windowed net growth; a MARKET-tier key additionally gets the four churn components behind each net (`joiners`, `movers_in`, `movers_out`, `leavers` × 7d/30d/90d), which a lower-tier key simply does not receive.\n\n`kind` selects the row kinds. The default is `provider`, and the list is then Provider rows only. A Vendor is a curated software or service brand that connects its customers through the Seats of one or more Providers; `kind=vendor` returns the Vendor rows and `kind=all` returns both, each item marked by `kind`. A Vendor's participants are always also in the count of the Provider that serves them: never add Provider rows and Vendor rows into one total, share or rank.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Scope the returned figures to one market: an ISO 3166-1 alpha-2 code (e.g. `BE`), case-insensitive. Anything that is not exactly two letters is a 400. When set, every item additionally carries `country_roster`, `country_orgs` and `country_net_7d|30d|90d`; the network-wide fields are unchanged. A MARKET-tier key additionally gets the scoped churn components `country_joiners|movers_in|movers_out|leavers_7d|30d|90d`. A Vendor row carries `country_roster` and `country_orgs` only: there is no country-scoped Vendor movement.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "kind": {
                "default": "provider",
                "description": "Which row kinds to return. `provider` (default): Provider rows only. `vendor`: Vendor rows only. `all`: both, sorted together by `participant_count`. `vendor` and `all` need a MARKET-tier key; a lower-tier key gets a 403, never a list without the Vendors. Any other value is a 400.",
                "enum": ["provider", "vendor", "all"],
