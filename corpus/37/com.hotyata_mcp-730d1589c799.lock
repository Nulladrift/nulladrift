        {
          "name": "search_real_estate",
          "description": "Search verified real estate listings in Batumi and Tbilisi (apartments, houses, commercial).\n<hints>\n- Returns compact objects with price_usd, price_sqm_usd, area_sqm, rooms, renovation_status, construction_stage, seller_type, heating_type, gas_status, is_heritage_zone, cadastral_code, year_built, developer_name, sea_view, distance_to_sea_m, has_gas, pets_allowed, no_summer_increase, address, latitude, longitude, photos, source_url, and canonical_url.\n- Also returns top-level shortlist_url (single link opening these exact returned properties on Hotyata's split-screen map) and web_search_url (link to all matching results on the map). Always share shortlist_url or web_search_url with the user so they can view all listings on one map in a single click.\n- When presenting results as a numbered list (#1, #2, ...), keep the same order as returned — the embedded interactive map widget numbers pins #1, #2, ... to match your text list.\n- Geo search: Use bbox='min_lng,min_lat,max_lng,max_lat' or [min_lng, min_lat, max_lng, max_lat] to search within a map rectangle.\n- Batumi districts: 'Old Batumi', 'Rustaveli', 'Khimshiashvili' (New Boulevard), 'Bagrationi', 'Javakhishvili', 'Agmashenebeli', 'Airport', 'Tamar', 'Makhinjauri', 'Gonio', 'Kvariati', 'Chakvi', 'Kobuleti'.\n- Tbilisi districts: 'Vake', 'Saburtalo', 'Vera', 'Mtatsminda', 'Chugureti' (Marjanishvili), 'Didube', 'Avlabari', 'Ortachala', 'Isani', 'Samgori', 'Gldani', 'Didi Dighomi', 'Old Tbilisi'.\n- Use sort='cheapest' or 'cheapest_sqm' to find the best deals without fetching multiple pages.\n- Use fields=['id','title','price_usd','price_sqm_usd','area_sqm','district','canonical_url'] to minimize token usage.\n- Filter by source channel/portal/group using sources=['facebook marketplace'], ['ss.ge', 'myhome.ge'], ['@batumiarendachat'], or Facebook group URLs ['https://www.facebook.com/groups/278563704483455/']. Unmonitored sources return an error.\n</hints>",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bbox": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  }
                ],
                "description": "Bounding box rectangle: 'min_lng,min_lat,max_lng,max_lat' or [min_lng, min_lat, max_lng, max_lat]"
              },
