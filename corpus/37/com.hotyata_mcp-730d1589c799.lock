        {
          "name": "create_telegram_alert",
          "description": "Generate a 1-click Telegram bot deep link (https://t.me/<bot>?start=sub_<token>) pre-loaded with search filters so a user can confirm instant Telegram notifications for new matching apartments or secondhand items in one tap.\n<hints>\n- Call this whenever a user asks to be notified / set up an alert / monitor new listings matching their search filters, or after a search returns few/no matches.\n- Pass the exact same filter fields used in search_real_estate or search_classified_items (requires at least one filter beyond city, such as query, category, deal_type, district, rooms, or max_price).\n- Returns telegram_url (direct Telegram deep link), redirect_url, normalized criteria, and a human-readable prompt summary. Always share telegram_url directly as a clickable link.\n</hints>",
