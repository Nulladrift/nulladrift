        {
          "name": "search_classified_items",
          "description": "Search deduplicated secondhand marketplace goods (electronics, monitors, routers, keyboards, heaters, furniture, vehicles, household items) aggregated across Telegram channels in Batumi and Tbilisi.\n<hints>\n- Powered by multilingual synonym expansion + semantic vector search: English queries (e.g. '4K monitor', 'WiFi router', 'electric heater', 'mechanical keyboard') automatically match Russian, English, and Georgian ads.\n- Avoid overly restrictive 'category' values unless needed; keyword query alone searches across all categories with hybrid semantic ranking.\n- Use sort='cheapest' to find lowest-priced items.\n</hints>",
          "inputSchema": {
