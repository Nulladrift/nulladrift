        {
          "name": "execute_code_mode",
          "description": "Execute a JavaScript snippet inside an isolated QuickJS WASM sandbox with direct synchronous/async access to the Hotyata SDK (`sdk`).\nUse this \"MCP Code Mode\" tool whenever you need to run multi-step queries, compare multiple categories/districts/stages, join complexes with properties, filter or aggregate results, and return only a compact final summary in a single round-trip.\n\nAvailable global `sdk` methods inside your script (can be called with or without `await`):\n- `sdk.searchProperties(params)` -> `{ total, page, limit, properties: [...] }`\n- `sdk.getPropertyStats(params)` -> `{ city, deal_type, group_by, total_matching_listings, groups: [...] }`\n- `sdk.getProperty(idOrArrayOfIds)` -> property details object or `{ properties: [...] }`\n- `sdk.searchComplexes(params)` -> `{ total, page, limit, complexes: [...] }`\n- `sdk.getComplex(idOrArrayOfIds)` -> complex details object or `{ complexes: [...] }`\n- `sdk.searchItems(params)` -> `{ total, page, limit, items: [...] }`\n- `sdk.getItem(idOrArrayOfIds)` -> item details object or `{ items: [...] }`\n- `sdk.createTelegramAlert(filterParams)` -> `{ telegram_url, redirect_url, prompt, criteria, subscription_type, expires_in }`\n\n<examples>\n// Example 1: Compare renovation status & off-plan (katlavan) sale dynamics in Batumi\nconst byRenovation = sdk.getPropertyStats({ city: \"batumi\", deal_type: \"sale\", group_by: \"renovation_status\" });\nconst byStage = sdk.getPropertyStats({ city: \"batumi\", deal_type: \"sale\", group_by: \"construction_stage\" });\nreturn { byRenovation: byRenovation.groups, byStage: byStage.groups };\n\n// Example 2: Multi-search classifieds and return top 3 cheapest per item type\nconst queries = [\"4K monitor\", \"router\", \"electric heater\", \"mechanical keyboard\"];\nreturn queries.map(q => {\n  const res = sdk.searchItems({ query: q, sort: \"cheapest\", limit: 3 });\n  return { query: q, total: res.total, cheapest: res.items.map(i => ({ id: i.id, title: i.title, price_gel: i.price_gel, price_usd: i.price_usd, url: i.canonical_url })) };\n});\n</examples>\n<hints>\n- Write a function body ending with a `return ...;` statement.\n- Maximum 15 SDK calls per execution. Memory limit: 32MB, CPU timeout: 5s.\n</hints>",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "JavaScript function body to execute in the sandbox. Must return a JSON-serializable value via `return ...`.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
