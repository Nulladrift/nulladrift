      "serverInfo": {
        "name": "aeo-inspector",
        "version": "2.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AEO Inspector: can AI answer engines crawl, read and cite a website? scan_site ($0.05) crawls up to 10 pages and returns a 100-point AEO score, an AI crawler access score (0-100: which of 21 AI crawlers can read the page, are blocked by robots.txt or a firewall, or get an empty JavaScript shell), an agent-ready score (0-100: llms.txt, MCP server card, OpenAPI, x402, machine-readable pricing, Web Bot Auth, each with a paste-ready fix), prioritized fixes, AI-crawler robots.txt rules, firewall checks, schema validation, entity and freshness signals, one live Perplexity question and ready-to-paste fixes (llms.txt, robots.txt, JSON-LD). full_report ($9) asks ChatGPT, Microsoft Copilot, Gemini, Claude, Grok, Google AI Overviews, Google AI Mode, Perplexity, Meta AI, DeepSeek, Qwen, Mistral, GLM, MiniMax, Exa Answer and You.com five category questions, 3 times each, and returns mention rate, citations, competitor share and cited sources (2-4 minutes; not charged unless at least 12 of 16 engines answer). domain_report ($2, when enabled) runs a site security audit (TLS, DNS/DNSSEC/CAA, domain expiry, SPF/DMARC/DKIM/MTA-STS, security headers, security.txt) plus the AEO deep scan for one domain and returns both grades and one merged, priority-sorted fix list with a verify command for each; not charged if any part can't run. pricing is free. Pay with x402 v2 (USDC on Base) in _meta['x402/payment']. Invalid input or failures are not charged.",
      "tools": [
        {
          "name": "domain_report",
          "description": "One-domain report: runs the OrionCMD site audit (TLS from CT logs, DNS/DNSSEC/CAA, RDAP expiry, SPF/DMARC/DKIM/MTA-STS, security headers, security.txt) and the AEO Inspector deep scan (AI crawler access, bot-vs-browser diff, agent-ready checks) for one domain. Returns both grades and one merged, priority-sorted fixes list (paste-ready DNS records, registrar steps, robots.txt/llms.txt/JSON-LD) with a shell command to verify each, plus a report_url kept 30 days. Not charged if any part can't run. Costs $2 USDC per call via x402 (payment in _meta[\"x402/payment\"]); invalid input or a failed run returns an error and is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "Website or page URL, e.g. example.com",
                "maxLength": 2048,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "One-domain security + AEO report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 2
          },
          "digest": "sha256:98dad5fb74075ee1005dab0427cac7a834d4226074beb8aba649b44c1ad2f66f"
        },
        {
          "name": "full_report",
          "description": "16-engine AI visibility report: five category questions, each asked 3 times (240 answers), to ChatGPT, Microsoft Copilot, Gemini, Claude, Grok, Google AI Overviews, Google AI Mode, Perplexity, Meta AI, DeepSeek, Qwen, Mistral, GLM, MiniMax, Exa Answer and You.com. Returns per-engine answers, mention rate, citations of the site (own domain in the returned sources), a visibility score, competitor share of mentions (overall and per engine), the sources engines cited, and a report_url. Takes 2-4 minutes. Not charged unless at least 12 of 16 engines answer. Costs $9 USDC per call via x402 (payment in _meta[\"x402/payment\"]); invalid input or a failed run returns an error and is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Optional: brand name to look for (default: detected from the page)",
                "maxLength": 60,
                "type": "string"
              },
              "topic": {
                "description": "Optional: what the site offers, used in the questions (default: the page's meta description)",
                "maxLength": 220,
                "type": "string"
              },
              "url": {
                "description": "Website or page URL, e.g. example.com",
                "maxLength": 2048,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "16-engine AI visibility report"
          },
          "behavior": {
