      "instructions": "Validate single or bulk (up to 100) email addresses in sub-80ms using zero-SMTP DNS-over-HTTPS MX/SPF/DMARC resolution, 121K+ disposable domain detection, role-account screening, typo correction, and RDAP domain age. Handshake and tools/list are free; pass x-api-key (bv_live_...) for tools/call. Claim 3,000 Free Credits (1,500 validations) at https://bulkemailvalidation.com/signup.",
      "tools": [
        {
          "name": "audit_domain_deliverability",
          "title": "Domain MX, SPF, DMARC, BIMI, MTA-STS & RDAP Age Deliverability Audit",
          "description": "Run a complete outbound & inbound email authentication audit for any domain: MX records & mail provider, SPF record validity & DNS lookup budget, DMARC enforcement policy (none/quarantine/reject), BIMI/MTA-STS/TLS-RPT readiness, RDAP domain age & registrar, deliverability grade (A+–F), and actionable remediation recommendations. Cost: 5 Credits / domain.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name to audit (e.g. \"vercel.com\", \"stripe.com\").",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "Response status code (0 indicates success).",
                "type": "number"
              },
              "data": {
                "description": "Full domain email authentication and deliverability posture audit.",
                "properties": {
                  "bimi": {
                    "description": "BIMI brand indicator record presence and raw value.",
                    "type": "object"
                  },
                  "deliverability_grade": {
                    "description": "Deliverability letter grade (A+ to F).",
                    "type": "string"
                  },
                  "deliverability_score": {
                    "description": "Overall domain deliverability score from 0 to 100.",
                    "type": "number"
                  },
                  "dmarc": {
                    "description": "Parsed _dmarc record, enforcement policy (none/quarantine/reject), and reporting URIs.",
                    "type": "object"
                  },
                  "domain": {
                    "description": "Normalized domain name audited.",
                    "type": "string"
                  },
                  "has_mx": {
                    "description": "Whether valid MX records are published.",
                    "type": "boolean"
                  },
                  "mail_provider": {
                    "description": "Detected enterprise mail provider.",
                    "type": "string"
                  },
                  "mta_sts": {
                    "description": "MTA-STS policy record presence and raw value.",
                    "type": "object"
                  },
                  "mx_records": {
                    "description": "Sorted MX records with priority and exchange hostname.",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "rdap": {
                    "description": "RDAP creation timestamp, domain age in days, and registrar.",
                    "type": "object"
                  },
                  "recommendations": {
                    "description": "Actionable remediation recommendations.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "spf": {
                    "description": "Parsed SPF record, validity, all-qualifier, and DNS lookup count.",
                    "type": "object"
                  },
                  "tls_rpt": {
                    "description": "SMTP TLS Reporting record presence and raw value.",
                    "type": "object"
                  }
                },
                "required": ["deliverability_grade", "deliverability_score", "dmarc", "domain", "has_mx", "mail_provider", "spf"],
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
