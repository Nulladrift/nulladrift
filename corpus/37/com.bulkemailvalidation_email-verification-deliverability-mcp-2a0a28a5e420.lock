        {
          "name": "validate_emails_bulk",
          "title": "Bulk Email Validation Batch (Up to 100 Emails / Call)",
          "description": "Validate up to 100 email addresses in a single high-speed batch with parallel domain DNS/RDAP deduplication. Returns batch summary metrics (valid, invalid, disposable, risky_role, corporate_count, avg_quality_score) plus full per-email verdicts. Cost: 2 Credits / email validated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "emails": {
                "description": "Array of 1–100 email addresses to validate in a single call.",
                "items": {
                  "description": "Single email address in the batch.",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["emails"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "Response status code (0 indicates success).",
                "type": "number"
              },
              "data": {
                "description": "Batch validation summary and individual email verdicts.",
                "properties": {
                  "results": {
                    "description": "Ordered list of per-email validation objects.",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "summary": {
                    "description": "Aggregated counts and average quality score for the batch.",
                    "properties": {
                      "avg_quality_score": {
                        "description": "Mean quality score (0–100) across the batch.",
                        "type": "number"
                      },
                      "disposable": {
                        "description": "Count of disposable/burner emails.",
                        "type": "number"
                      },
                      "invalid": {
                        "description": "Count of invalid emails.",
                        "type": "number"
                      },
                      "risky_role": {
                        "description": "Count of role-based or newly registered risk emails.",
                        "type": "number"
                      },
                      "total": {
                        "description": "Total emails evaluated.",
                        "type": "number"
                      },
                      "valid": {
                        "description": "Count of deliverable emails.",
                        "type": "number"
                      }
                    },
                    "required": ["avg_quality_score", "disposable", "invalid", "risky_role", "total", "valid"],
                    "type": "object"
                  }
                },
                "required": ["results", "summary"],
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
