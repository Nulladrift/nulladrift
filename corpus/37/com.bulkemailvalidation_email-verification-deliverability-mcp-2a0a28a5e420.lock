          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "Response status code (0 indicates success).",
                "type": "number"
              },
              "data": {
                "description": "Disposable, role-account, and typo screening verdict.",
                "properties": {
                  "did_you_mean": {
                    "description": "Suggested correction for misspelled common domains.",
                    "type": ["string", "null"]
                  },
                  "disposable_rule": {
                    "description": "Matched exact or wildcard disposable list rule.",
                    "type": ["string", "null"]
                  },
                  "domain": {
                    "description": "Normalized ASCII domain evaluated.",
                    "type": "string"
                  },
                  "email": {
                    "description": "Email address checked, if supplied.",
                    "type": ["string", "null"]
                  },
                  "is_corporate_domain": {
                    "description": "True if the domain is neither disposable nor consumer webmail.",
                    "type": "boolean"
                  },
                  "is_disposable": {
                    "description": "True if the domain is a known disposable/burner email provider.",
                    "type": "boolean"
                  },
                  "is_free_email": {
                    "description": "True if the domain is a consumer webmail provider.",
                    "type": "boolean"
                  },
                  "is_role_account": {
                    "description": "True if the local part is a role-based mailbox.",
                    "type": "boolean"
                  },
                  "recommended_action": {
                    "description": "Recommended signup/outbound policy action.",
                    "enum": ["allow", "review", "block"],
                    "type": "string"
                  }
                },
                "required": ["domain", "is_disposable", "is_role_account", "recommended_action"],
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
