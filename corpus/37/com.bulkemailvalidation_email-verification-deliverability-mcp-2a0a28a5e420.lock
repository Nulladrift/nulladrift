        {
          "name": "check_disposable_and_role_email",
          "title": "Disposable Burner Domain, Role-Account & Typo Trap Filter",
          "description": "Ultra-fast sub-10ms filter checking an email or domain against 121,900+ disposable/burner email domains, wildcard traps, role-based inboxes (admin@, support@, noreply@, billing@), free webmail vs corporate domain classification, and common typo suggestions. Cost: 1 Credit / call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Optional domain name to check directly if full email is omitted.",
                "type": "string"
              },
              "email": {
                "description": "Email address to screen (e.g. \"signup@mailinator.com\" or \"support@vercel.com\").",
                "type": "string"
              }
            },
            "type": "object"
