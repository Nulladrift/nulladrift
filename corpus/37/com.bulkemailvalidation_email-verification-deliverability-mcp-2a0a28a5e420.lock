        {
          "name": "validate_email",
          "title": "Deep Single Email Validation (Syntax, MX/SPF/DMARC, 121K Disposable DB, Role & RDAP Age)",
          "description": "Validate a single email address in sub-80ms with zero SMTP probing: checks RFC-5322 syntax & punycode, live DNS-over-HTTPS MX/SPF/DMARC records, mail provider classification (Google Workspace, Microsoft 365, Proofpoint, Mimecast), 121,900+ disposable/burner domains, role-based inboxes, Levenshtein typo correction (did_you_mean), corporate vs free-webmail flag, and live RDAP domain creation age. Cost: 2 Credits / email ($0.15/1K on Starter, $0.08/1K Business).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email address to validate (e.g. \"founder@stripe.com\", \"qa@mailinator.com\").",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "Response status code (0 indicates success).",
                "type": "number"
              },
              "data": {
                "description": "Structured email hygiene and deliverability verdict.",
                "properties": {
                  "deliverability_grade": {
                    "description": "Letter grade from A+ to F.",
                    "type": "string"
                  },
                  "did_you_mean": {
                    "description": "Levenshtein typo correction suggestion, if detected.",
                    "type": ["string", "null"]
                  },
                  "dmarc_policy": {
                    "description": "DMARC enforcement policy (reject, quarantine, none, missing).",
                    "type": "string"
                  },
                  "domain_created_at": {
                    "description": "ISO-8601 domain creation timestamp from RDAP.",
                    "type": ["string", "null"]
                  },
                  "email": {
                    "description": "Original email address submitted.",
                    "type": "string"
                  },
                  "has_mx": {
                    "description": "Whether the domain publishes live MX records.",
                    "type": "boolean"
                  },
                  "is_corporate_domain": {
                    "description": "Whether the email belongs to a corporate B2B domain rather than free webmail.",
                    "type": "boolean"
                  },
                  "is_disposable": {
                    "description": "Whether the domain matches the 121K+ disposable/burner database.",
                    "type": "boolean"
                  },
                  "is_role_account": {
                    "description": "Whether the local part is a shared role address (e.g. admin@, support@).",
                    "type": "boolean"
                  },
                  "mail_provider": {
                    "description": "Detected mail hosting provider (e.g. Google Workspace, Microsoft 365).",
                    "type": "string"
                  },
                  "normalized_email": {
                    "description": "Canonical lowercased email address.",
                    "type": "string"
                  },
                  "quality_score": {
                    "description": "Deliverability quality score from 0 to 100.",
                    "type": "number"
                  },
                  "smtp_probe_performed": {
                    "description": "Always false; zero outbound Port-25 SMTP probing.",
                    "type": "boolean"
                  },
                  "spf_valid": {
                    "description": "Whether the domain has a valid SPF record.",
                    "type": "boolean"
                  },
                  "sub_status": {
                    "description": "Granular reason code (e.g. deliverable_mx, disposable_trap, invalid_syntax, no_mx_dead_domain, role_account).",
                    "type": "string"
                  },
                  "syntax_valid": {
                    "description": "Whether the email passes RFC-5322 syntax validation.",
                    "type": "boolean"
                  },
                  "verdict": {
                    "description": "Primary validation verdict.",
                    "enum": ["valid", "invalid", "disposable", "risky_role"],
                    "type": "string"
                  }
                },
                "required": ["email", "has_mx", "is_disposable", "is_role_account", "quality_score", "sub_status", "verdict"],
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
