        {
          "name": "get_activity",
          "title": "Get one activity",
          "description": "Returns one activity with its category, location, website, admission, contactInfo, source and commercial.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activityId": {
                "description": "The id of an activity, as returned by list_activities.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "siteSlug": {
                "description": "The siteSlug of a Booking Bench site, as returned by list_sites.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["activityId", "siteSlug"],
            "type": "object"
