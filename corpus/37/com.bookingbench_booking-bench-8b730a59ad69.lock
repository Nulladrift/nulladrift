          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:59ba2d306996e13d4452057d7f802fd7c861e6063b3edd0798968f4cb65d6ce9"
        },
        {
          "name": "list_properties",
          "title": "Search a site for units open on given dates",
          "description": "Lists the units on one Booking Bench site that can be booked for a stay: open every night and within the unit's minimum stay, maximum stay, arrival and departure rules and guest capacity. checkIn and checkOut are required. guests defaults to 2, and the answer says when the default was used. Optional filters: city (a town on that site), minBedrooms, minBathrooms, amenities (all must be listed), petsAllowed. sort is fit (smallest unit that sleeps the party, then bedrooms, then name; the default), price, or name. No result is ranked by payment. Each result has propertyId, name, city, state, sleeps, bedrooms, bathrooms and averageNightlyRate (per night over the stay, before cleaning fee and taxes). The answer gives returned, totalMatches (or totalMatchesAtLeast when not every unit was checked), nextCursor, refinements (unused filters with how many units would remain) and notes. More than 10 matches return the best 5. Availability is up to 5 minutes old; get_quote is live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amenities": {
                "description": "Amenity names the unit must list, for example \"Hot tub\". Matched ignoring case.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "checkIn": {
                "description": "Arrival date as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Departure date as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "city": {
                "description": "Only units in this town on the site, for example the matchedCity from list_sites.",
                "maxLength": 100,
                "type": "string"
              },
              "cursor": {
                "description": "The nextCursor from an earlier answer to the same search, unchanged.",
                "maxLength": 400,
                "type": "string"
              },
              "guests": {
                "description": "Number of guests. Default 2.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "How many results to return, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "minBathrooms": {
                "description": "Minimum number of bathrooms.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "minBedrooms": {
                "description": "Minimum number of bedrooms.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "petsAllowed": {
                "description": "True returns only units that allow pets.",
                "type": "boolean"
              },
              "siteSlug": {
                "description": "The siteSlug of a Booking Bench site, as returned by list_sites.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
                "type": "string"
              },
              "sort": {
                "description": "Result order. Default fit.",
                "enum": ["fit", "price", "name"],
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "siteSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search a site for units open on given dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a9cc9fc1927bd4d1125084b7c3d635fbed99b5b13534c2dec3247e151b5e41f3"
        },
        {
          "name": "list_sites",
          "title": "Find Booking Bench sites near a city",
          "description": "Lists live Booking Bench sites that have rental units in or near a destination city in the United States, nearest first, five per page. `city` is the destination the traveler names, never the traveler's own location. Each result has siteSlug, siteName, matchedCity, distanceMiles (straight-line, whole miles, between town centers), the cities the site has units in, and numberOfProperties. The answer states how many sites match in all (totalMatches) and gives nextCursor when more exist. Sites at the same distance are ordered by a daily rotation. A city name used in several states returns candidates; a misspelling returns suggestions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "The destination city name, for example \"Deadwood\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "description": "The nextCursor from an earlier answer to the same search, unchanged.",
                "maxLength": 400,
                "type": "string"
              },
              "limit": {
                "description": "How many results to return, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "radiusMiles": {
                "description": "Search radius in miles, 1 to 50. Default 15.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "US state name or two-letter abbreviation, for example \"SD\".",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Booking Bench sites near a city"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e7a3ff03c6e567637164b6eb7caef6ec7a6f19b7b99c192812f7e82db6da8644"
        }
      ],
      "digest": "sha256:1c2b675db6ef204219d3ab331cbacd439808d157da640a0fe8f6e46bbf20be11"
    }
