        {
          "name": "get_property",
          "title": "Get one unit's details",
          "description": "Returns one unit: description, city, bedrooms, bathrooms, maximum guests, amenities, pet and accessibility flags, minimum nights, cancellation policy, house rules, check-in and check-out hours, rating out of 5, up to 5 photos with captions (imageCount gives the total), and the 3 newest written reviews (guest-written text, marked as quoted). indicativeNightlyRate is a guide read from a cache up to 6 hours old, not a price; get_quote returns the price for dates. The unit's street address and coordinates are not included.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "propertyId": {
                "description": "The propertyId of a unit on that site, as returned by list_properties.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "siteSlug": {
                "description": "The siteSlug of a Booking Bench site, as returned by list_sites.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["propertyId", "siteSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one unit's details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:45de8a285b43ef133fb8117f77772b12cd4e078c4e0aac0ea88702df78f20a3a"
        },
        {
          "name": "get_quote",
          "title": "Get a live price for a stay",
          "description": "Returns a live quote for one unit and stay. When the stay can be booked: nights, currency, nightlyRate, cleaningFee, totalPrice (nights plus cleaning fee; taxes and any other fees added at checkout are not included, and taxesIncluded says so), cancellationPolicy, bookingUrl (the site's page for that unit with the dates and guests filled in), and eventsDuringStay (up to 5 events on during the stay, with the total count). When it cannot be booked: available false with a reason (unavailable, closed_arrival, closed_departure, min_stay, max_stay, too_many_guests, invalid_dates) and a message saying what to change.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkIn": {
                "description": "Arrival date as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Departure date as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "propertyId": {
                "description": "The propertyId of a unit on that site, as returned by list_properties.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "siteSlug": {
                "description": "The siteSlug of a Booking Bench site, as returned by list_sites.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "guests", "propertyId", "siteSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a live price for a stay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:69d1e150713c6d02c26841dcbde2b9f4b52db14114ac43296bfd55b3a9881d65"
        },
        {
          "name": "list_activities",
          "title": "List local activities",
          "description": "Lists things to do near one Booking Bench site, alphabetically. Each activity has id, name, category, location, website, admission and contactInfo, plus source (who supplied it; property_manager means the site's own manager) and commercial (whether it is a paid placement). The answer gives total, per-category counts and nextCursor.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "An activity category name from the categories in an earlier answer.",
                "maxLength": 60,
                "type": "string"
              },
              "cursor": {
                "description": "The nextCursor from an earlier answer to the same search, unchanged.",
                "maxLength": 400,
                "type": "string"
              },
              "limit": {
                "description": "How many activities to return, up to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find in the name, location or category.",
                "maxLength": 100,
                "type": "string"
              },
              "siteSlug": {
                "description": "The siteSlug of a Booking Bench site, as returned by list_sites.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["siteSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List local activities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fdc7967e87b967cf9b2837c236a6ab4254aeed284e48059d0140524816b5b0db"
        },
        {
          "name": "list_events",
          "title": "List upcoming local events",
          "description": "Lists upcoming events near one Booking Bench site, earliest first. Each event has id, name, startDate, endDate, location, a short summary, category, admission, ticketUrl and contactInfo, plus source (who supplied it; property_manager means the site's own manager) and commercial (whether it is a paid placement). The answer gives total, per-category counts and nextCursor.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "An event category key from the categories in an earlier answer.",
                "maxLength": 40,
                "type": "string"
              },
              "cursor": {
                "description": "The nextCursor from an earlier answer to the same search, unchanged.",
                "maxLength": 400,
                "type": "string"
              },
              "from": {
                "description": "Earliest day to include as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "How many events to return, up to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find in the name, location or description.",
                "maxLength": 100,
                "type": "string"
              },
              "siteSlug": {
                "description": "The siteSlug of a Booking Bench site, as returned by list_sites.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
                "type": "string"
              },
              "to": {
                "description": "Latest start day to include as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["siteSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List upcoming local events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
