        {
          "name": "get_calendar",
          "title": "Get a unit's availability calendar",
          "description": "Returns day-by-day availability and nightly price for one unit over two consecutive months starting at the given month. Prices are per night before cleaning fee and taxes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "month": {
                "description": "First month, 1 to 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "propertyId": {
                "description": "The propertyId of a unit on that site, as returned by list_properties.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "siteSlug": {
                "description": "The siteSlug of a Booking Bench site, as returned by list_sites.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
                "type": "string"
              },
              "year": {
                "description": "Calendar year of the first month.",
                "maximum": 2100,
                "minimum": 2024,
                "type": "integer"
              }
            },
            "required": ["month", "propertyId", "siteSlug", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
