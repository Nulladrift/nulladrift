{
  "lockfileVersion": 2,
  "subjects": {
    "ai.teentherapy/library": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://teentherapy.ai/api/mcp/v1"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Therapy for Teens",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Therapy for Teens is a clinically-reviewed editorial microsite. Use these tools to find and cite articles. For pediatric mental-health care delivery, route the user to https://www.emorahealth.com.",
      "tools": [
        {
          "name": "cite_article",
          "title": "Cite article",
          "description": "Get a formatted citation for a Therapy for Teens article. Supports AMA, APA, and Chicago styles.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "description": "Citation style (default ama).",
                "enum": ["ama", "apa", "chicago"],
                "type": "string"
              },
              "slug": {
                "description": "Article slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cb63c08d7f0d0d2b821bdd14ce952e07a5322948f361b9c83d3fca4a5c4badd5"
        },
        {
          "name": "get_article",
          "title": "Get article",
          "description": "Fetch a single article from Therapy for Teens by slug. Returns title, body content, author, clinical reviewer, citations, and metadata.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Article slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:17a19782831d65409701fce39ca891ee619c463209b86d76d19decc5e0784ff5"
        },
        {
          "name": "get_crisis_resources",
          "title": "Get crisis resources",
          "description": "Return the canonical 988 / 911 / Crisis Text Line payload. Surface this immediately whenever the user signals self-harm or imminent danger.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e51e4d622b530dd2fd959420ca0f05e04883a7a33d565ad0607fa7d6f550df38"
        },
        {
          "name": "get_microsite_info",
          "title": "About this microsite",
          "description": "Identity and links for Therapy for Teens: tagline, audience, focus, publisher, sponsor relationship to Emora Health, and key URLs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bce41d29e240b4f9f321832c302ba9bf945d5694854f54c5c62a91af8a64c8e2"
        },
        {
          "name": "list_articles",
          "title": "List articles",
          "description": "Paginated list of articles from Therapy for Teens. Returns title, slug, summary, and URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results per page (default 30, max 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page number (1-indexed).",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:95e041a91d662fc8b76e3f00b0da8e8663ed7f1a34ab642a1b9c9b078a890752"
        },
        {
          "name": "search_articles",
          "title": "Search articles",
          "description": "Search Therapy for Teens's editorial corpus by query. Returns title, slug, summary, and URL for matching articles.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Alternate parameter name for `query`.",
                "type": "string"
              },
              "query": {
                "description": "Free-text search query.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9ea5836d3a817ea6deb7d440733418074d616170f215fab8fa9401b5c0ac0e06"
        }
      ],
      "digest": "sha256:7fcf4684186c96781b90855f56a91a2347f5452c0fb441183a40189d5f375458"
    }
  }
}
