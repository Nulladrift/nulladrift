{
  "lockfileVersion": 2,
  "subjects": {
    "ch.drivelab/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://drivelab.ch/wp-json/drivelab-mcp/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "drivelab-booking",
        "title": "DriveLab Booking",
        "version": "1.0.0",
        "websiteUrl": "https://drivelab.ch/fahrschule/zuerich/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find public DriveLab driving lessons and group courses in Switzerland. DE/EN interface language is separate from teaching_language. Availability is a snapshot, never a reservation. Course waiting lists are not confirmed seats. Complete booking, personal details, terms and payment only through the returned existing booking URL. Do not collect personal, licence or payment data in these tools. For customers with an existing lesson package, use the existing customer panel to redeem it rather than purchasing again. Unknown or stale availability must be reported as such.",
      "tools": [
        {
          "name": "get_lesson_availability",
          "title": "Check lesson availability",
          "description": "Read actual free appointment slots for a public instructor/service pair returned by search_driving_lessons. Up to seven days from start_date, within the next 90 days. Times are Europe/Zurich. A slot is not held; the existing website rechecks it during booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "instructor_id": {
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Response and checkout language; does not filter the teaching language. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "service_id": {
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "Local calendar date YYYY-MM-DD in Europe/Zurich.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["instructor_id", "service_id", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check lesson availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:e26f6d7585bdd93962fe9393dcab66e1ba59c9177a0590bf56ee9a138002f1c9"
        },
        {
          "name": "list_course_locations",
          "title": "List group-course coverage",
          "description": "List towns with published upcoming DriveLab group-course listings and the WAB partner calendars supported by search_courses. Listing a town is not a promise of free seats.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Response and checkout language; does not filter the teaching language. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List group-course coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:d7fb9cf50419ba5831d4bd061cc0bdb274e3a0770c3412a9c60c9e818d50f075"
        },
        {
          "name": "search_courses",
          "title": "Find group courses",
          "description": "Find upcoming VKU, first aid/Nothelfer or WAB courses by town, with teaching language, prices, all sessions, availability and existing booking links. list_course_locations gives coverage. WAB can use existing partner booking calendars; unknown/stale availability is explicitly labelled. Does not reserve or pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Swiss town name or canonical town slug, for example Zürich, zuerich, Zug, Luzern.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "course_type": {
                "enum": ["vku", "first_aid", "wab"],
                "type": "string"
              },
              "from_date": {
                "description": "Local calendar date YYYY-MM-DD in Europe/Zurich.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "language": {
                "description": "Response and checkout language; does not filter the teaching language. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "teaching_language": {
                "description": "Only offers taught in this language. Omit to see all teaching languages.",
                "enum": ["de", "en", "fr", "it"],
                "type": "string"
              }
            },
            "required": ["city", "course_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find group courses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:0b40cdd1f70801a38a550102368ad008cb3afbfba3479efc0a4eba5bfa5b5651"
        },
        {
          "name": "search_driving_lessons",
          "title": "Find driving lessons",
          "description": "Find published driving-school profiles and bookable individual services for a Swiss town. Reuses DriveLab location coverage and ordering. Prices are per listed service; fees and final total are checked on the website. Use get_lesson_availability with returned instructor_id and service_id for free slots. Does not book.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["all", "auto", "motorcycle", "trailer"],
                "type": "string"
              },
              "city": {
                "description": "Swiss town name or canonical town slug, for example Zürich, zuerich, Zug, Luzern.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "description": "Response and checkout language; does not filter the teaching language. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "teaching_language": {
                "description": "Only offers taught in this language. Omit to see all teaching languages.",
                "enum": ["de", "en", "fr", "it"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find driving lessons"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:a1e4b1f9f0da3031921735c2780229cac12797a93503f12650875267f66cf089"
        }
      ],
      "digest": "sha256:235b44cdb5843ae8be986678255b39e882200861bc430d0963a025d98dc79088"
    }
  }
}
