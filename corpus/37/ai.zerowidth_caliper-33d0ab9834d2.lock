        {
          "name": "caliper_datasets_generate",
          "title": "Generate a Caliper dataset from a flow (spends credit)",
          "description": "Creates a NEW dataset of model-written items — Q&A by default, or scripted sequences / simulated people via `shape` — pass flowId and the generator reads the flow's prompt, mode, and schema to write realistic cases for THAT flow; `description` adds guidance (or stands alone when there's no flow). Use this when the user wants test cases fast and has none; prefer caliper_datasets_create with hand-written items when real scenarios are already in hand (Compass pages, a transcript). This SPENDS workspace inference credit (one generator call), so it sits behind the approval gate: say so and expect `needs_confirmation`. Returns the dataset summary; read the items with caliper_datasets_get and tell the user to review them before trusting an eval built on them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "count": {
                "description": "Items to generate, 1-50. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "datasetDescription": {
                "description": "Description stored on the dataset.",
                "maxLength": 2000,
                "type": "string"
              },
              "description": {
                "description": "What the target system does / what to cover. Required (≥10 chars) when flowId is omitted; optional guidance otherwise.",
                "maxLength": 4000,
                "type": "string"
              },
              "disposition": {
                "description": "With shape `simulated`: how every generated person behaves — a preset id (genuine, pressure, confused, impatient, vague, non-native) or free text. Omit to let the generator vary it from person to person.",
                "maxLength": 2000,
                "type": "string"
              },
              "expectedStyle": {
                "description": "With outputsMode `expected`: `verbatim` literal reference answers (default) or `conditions` — what a correct answer must do, when there's no single right wording.",
                "enum": ["verbatim", "conditions"],
                "type": "string"
              },
              "flowId": {
                "description": "Workbench flow to generate cases for (from workbench_flows_list). Required unless description is given.",
                "type": "string"
              },
              "outputsMode": {
                "description": "What each generated item carries beyond the input: `expected` (golden answers — eval-ready, the default), `none` (inputs only — for a spec others fill in), `captured` (sample answers to rate in a review).",
                "enum": ["none", "expected", "captured"],
                "type": "string"
              },
              "presetId": {
                "description": "Framing preset. Default `blank`; the others bias every item toward that attack class.",
                "enum": ["blank", "adversarial", "prompt-injection", "jailbreak", "multilingual"],
                "type": "string"
              },
              "shape": {
                "description": "What each generated item is: `qa` (one input, the default), `sequence` (2-6 scripted user turns the model answers one at a time, with expectedResponse + expectedBehavior), or `simulated` (a person Caliper plays adaptively: goal, persona, disposition, expectedBehavior). outputsMode applies to `qa` only.",
                "enum": ["qa", "sequence", "simulated"],
                "type": "string"
              },
              "title": {
                "description": "Dataset name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "visibility": {
                "description": "Who can see it: PRIVATE (only the user), WORKSPACE (every member, the default), or SHARED (specific people, granted afterwards). Say 'make it private' → PRIVATE.",
                "enum": ["PRIVATE", "WORKSPACE", "SHARED"],
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Generate a Caliper dataset from a flow (spends credit)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:74c1af4f993969b4ef45ee9785da4ec962abf7926babae26a56e04019f1cb3ba"
        },
        {
