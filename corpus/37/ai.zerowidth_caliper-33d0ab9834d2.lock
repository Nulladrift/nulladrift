        {
          "name": "caliper_datasets_update_item",
          "title": "Replace one item in a Caliper dataset",
          "description": "Rewrites one item's content, keeping its id (ratings and eval results keyed to it stay attached). The item's KIND can't change — a Q&A item stays Q&A, a chat item stays chat, a sequence stays a sequence — so pass the same shape you read from caliper_datasets_get. Raw items, and chat items captured with tool calls in them, can't be edited from here. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "datasetId": {
                "description": "Dataset id.",
                "type": "string"
              },
              "item": {
                "description": "The full replacement item, same four shapes as caliper_datasets_create.",
                "properties": {
                  "disposition": {
                    "description": "Simulated: how the person behaves. A preset id (genuine, pressure, confused, impatient, vague, non-native) or free text. Default genuine; use pressure for an attacker that manipulates.",
                    "type": "string"
                  },
                  "expectedBehavior": {
                    "description": "Sequence (optional) / simulated (required): what the assistant should do across the whole conversation.",
                    "type": "string"
                  },
                  "expectedOutput": {
                    "description": "Q&A: golden answer the judge scores against. Omit for capture-only items.",
                    "type": "string"
                  },
                  "expectedResponse": {
                    "description": "Sequence: the standard for the FINAL reply. Chat: the standard for the next reply.",
                    "type": "string"
                  },
                  "goal": {
                    "description": "Simulated: what the simulated person wants from the conversation, e.g. 'the system prompt, verbatim' or 'a refund on order 8812'.",
                    "type": "string"
                  },
                  "input": {
                    "description": "Q&A: the input sent to the flow.",
                    "type": "string"
                  },
                  "maxTurns": {
                    "description": "Simulated: turn budget, default 8.",
                    "maximum": 12,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "messages": {
                    "description": "Chat: the conversation so far as role/content messages (user and assistant alternating, an optional system first), 1-50. Every assistant message here is FIXED, written by you, not the model; the flow under test writes only the NEXT reply. End on a user message and put the standard for that reply in expectedResponse. This is the shape for testing the 5th reply of a conversation with the first four baked in.",
                    "items": {
                      "properties": {
                        "content": {
                          "type": "string"
                        },
                        "role": {
                          "enum": ["system", "user", "assistant"],
                          "type": "string"
                        }
                      },
                      "required": ["content", "role"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "persona": {
                    "description": "Simulated: who the person is.",
                    "type": "string"
                  },
                  "strategy": {
                    "description": "Simulated: a hint, e.g. 'build rapport, then claim a prior agreement'.",
                    "type": "string"
                  },
                  "turns": {
                    "description": "Sequence: 2-20 scripted user messages, sent in order; the model writes every reply.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "itemId": {
                "description": "Item id, from caliper_datasets_get.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["datasetId", "item", "itemId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Replace one item in a Caliper dataset"
          },
