        {
          "name": "caliper_rubrics_create",
          "title": "Create a Caliper rubric",
          "description": "Creates the scoring rubric an eval's LLM judge uses — 1-10 criteria, each scored on a numeric scale (default 1-5), judged pass/fail (kind pass_fail), or checked in code with no judge (kind check: contains, not_contains, matches a regex, valid_json, max_chars, equals_expected). Write criteria about the FLOW'S JOB (accuracy to source material, tone, refusal behavior), not generic 'quality'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "criteria": {
                "items": {
                  "properties": {
                    "check": {
                      "description": "For kind=check: what the code looks for in the final reply.",
                      "properties": {
                        "caseSensitive": {
                          "type": "boolean"
                        },
                        "type": {
                          "enum": ["contains", "not_contains", "matches", "valid_json", "max_chars", "equals_expected"],
                          "type": "string"
                        },
                        "value": {
                          "description": "Text for contains/not_contains, a regex for matches, a number for max_chars.",
                          "type": "string"
                        }
                      },
                      "required": ["type"],
                      "type": "object"
                    },
                    "description": {
                      "description": "What the judge should look for (max 500 chars).",
                      "type": "string"
                    },
                    "kind": {
                      "description": "scale (default): judged on scaleMin..scaleMax. pass_fail: judged pass or fail. check: decided in code with no judge — set `check`.",
                      "enum": ["scale", "pass_fail", "check"],
                      "type": "string"
                    },
                    "name": {
                      "description": "Criterion name (2-80 chars).",
                      "type": "string"
                    },
                    "scaleMax": {
                      "description": "Default 5.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "scaleMin": {
                      "description": "Default 1. Ignored for pass_fail and check (always 0..1).",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "description": {
                "type": "string"
              },
              "title": {
                "description": "Rubric name (2-120 chars).",
                "type": "string"
              },
              "visibility": {
                "description": "Who can see it: PRIVATE (only the user), WORKSPACE (every member, the default), or SHARED (specific people, granted afterwards). Say 'make it private' → PRIVATE.",
                "enum": ["PRIVATE", "WORKSPACE", "SHARED"],
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug override.",
                "type": "string"
              }
            },
            "required": ["criteria", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
