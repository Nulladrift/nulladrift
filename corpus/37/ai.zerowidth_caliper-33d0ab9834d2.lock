        {
          "name": "caliper_evals_create",
          "title": "Create a Caliper eval",
          "description": "Binds a dataset + rubric to something under test as a repeatable eval — THE LAST SETUP STEP before scoring. Two targets: a Workbench flow (pass flowId; Caliper runs inference itself, then caliper_evals_run scores it), or 'external' (target: 'external'; the user's own model runs elsewhere and their script submits outputs through the public API, usually from CI — see the docs guide 'Run evals in CI'). For an external eval, hand back the eval id and tell the user to create a workspace API key with the ci_evals preset in their workspace settings; keys can't be minted from here. flowStage 'draft' evals the live draft (pre-publish); 'published' (default) evals the latest published revision at run time, or one pinned with flowRevisionId. Reuse an existing rubric from caliper_rubrics_list when one already scores this job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "datasetId": {
                "description": "Dataset of test items.",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "externalLabel": {
                "description": "External evals only: what produces the outputs, e.g. 'CI' or 'prod pipeline'. Free text, shown on the eval.",
                "maxLength": 120,
                "type": "string"
              },
              "flowId": {
                "description": "Workbench flow id to evaluate. Required unless target is 'external'.",
                "type": "string"
              },
              "flowRevisionId": {
                "description": "Published-stage evals only: pin to one published revision (id from workbench_flows_revisions_list). Omit to always eval the latest published version at run time.",
                "type": "string"
              },
              "flowStage": {
                "description": "Which stage to run against. Use 'draft' while iterating pre-publish. Default 'published'.",
                "enum": ["draft", "published"],
                "type": "string"
              },
              "rubricId": {
                "description": "Rubric the judge scores with.",
                "type": "string"
              },
              "scenarioId": {
                "description": "Workbench-flow evals: run every item as this scenario (one of the flow's, from workbench_flows_scenarios_list), so the flow's variables hold that person's values. A run can pick another with caliper_evals_run's scenarioId. Without one, variables run empty unless an item sets them.",
                "type": "string"
              },
              "target": {
                "description": "'workbench_flow' (default; needs flowId) or 'external' (the user's own model; outputs arrive through the public API).",
                "enum": ["workbench_flow", "external"],
                "type": "string"
              },
              "title": {
                "description": "Eval name (2-120 chars).",
                "type": "string"
              },
              "visibility": {
                "description": "Who can see it: PRIVATE (only the user), WORKSPACE (every member, the default), or SHARED (specific people, granted afterwards). Say 'make it private' → PRIVATE.",
                "enum": ["PRIVATE", "WORKSPACE", "SHARED"],
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug override.",
                "type": "string"
              }
            },
            "required": ["datasetId", "rubricId", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a Caliper eval"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:902fef5d953848b64b051d337db17b4e1799fd79fe9d3cf2eb6c02b213dac7ed"
        },
