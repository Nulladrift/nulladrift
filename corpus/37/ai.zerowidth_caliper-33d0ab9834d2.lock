        {
          "name": "caliper_evals_update",
          "title": "Update a Caliper eval (metadata, schedule, alerts)",
          "description": "Changes an eval's title, description, visibility, schedule (interval + time anchor), runOnPublish (queue a run whenever the flow publishes), regressionThreshold (score drop vs the previous run that triggers an alert; null = off), or scenarioId (the scenario runs use). Pass only what changes. The dataset, rubric snapshot, and target are fixed at creation — create a new eval to change those. Scheduled and on-publish runs spend credit on their own, so state that plainly when turning them on. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "New description; null clears it."
              },
              "evalId": {
                "description": "Eval id, from caliper_evals_list.",
                "type": "string"
              },
              "regressionThreshold": {
                "anyOf": [
                  {
                    "maximum": 1,
                    "minimum": 0.01,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Score drop vs the previous run that raises an alert, on the 0–1 score scale (0.1 = 10 points); null turns alerts off."
              },
              "runOnPublish": {
                "description": "Run whenever the targeted flow publishes a version.",
                "type": "boolean"
              },
              "scenarioId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Workbench-flow evals: the scenario every run uses unless a run picks another (one of the flow's, from workbench_flows_scenarios_list); null clears it."
              },
              "scheduleDayOfWeek": {
                "anyOf": [
                  {
                    "maximum": 6,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Weekly only: 0 = Sunday … 6 = Saturday."
              },
              "scheduleInterval": {
                "anyOf": [
                  {
                    "enum": ["hourly", "daily", "weekly"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Run cadence; null clears the schedule. Each scheduled run spends credit — say so."
              },
              "scheduleTime": {
                "anyOf": [
                  {
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Daily/weekly anchor, HH:MM 24-hour in scheduleTimezone. Null = one interval from now."
              },
              "scheduleTimezone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "IANA timezone for scheduleTime, e.g. America/Chicago."
              },
              "title": {
                "description": "New name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "visibility": {
                "description": "Who can see it: PRIVATE (only the user), WORKSPACE (every member, the default), or SHARED (specific people, granted afterwards). Say 'make it private' → PRIVATE.",
                "enum": ["PRIVATE", "WORKSPACE", "SHARED"],
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["evalId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update a Caliper eval (metadata, schedule, alerts)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
