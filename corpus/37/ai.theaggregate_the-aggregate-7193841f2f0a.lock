      },
      "transport": {
        "type": "http",
        "url": "https://theaggregate.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "the-aggregate",
        "title": "The Aggregate: LLM benchmark aggregate",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools over The Aggregate: Aggregate Ratings fitted across public LLM benchmark leaderboards, updated daily (about_the_aggregate reports the current coverage counts). Start with get_leaderboard, get_model or search_benchmarks. When citing numbers, credit \"The Aggregate (theaggregate.ai)\" plus the upstream leaderboard linked in each result.",
      "tools": [
        {
          "name": "about_the_aggregate",
          "title": "About The Aggregate",
          "description": "What this data is: the published rating method, current coverage counts, update cadence, and how to cite it.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About The Aggregate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd53b709a294a052c5d72ebd93a3bffe1bc093dbcbc3261943a2ec625e99da1f"
        },
        {
          "name": "compare_models",
          "title": "Compare models",
          "description": "Head-to-head between 2-4 models: aggregate ranks, rating gap with a significance note based on the standard errors, and notable benchmarks they share.",
          "inputSchema": {
            "properties": {
              "models": {
                "description": "Two to four model names or slugs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb2e287b552d122182bcc5a0fe79e725e07691620654ca15925f10fa1fc91a37"
        },
        {
          "name": "get_benchmark",
          "title": "Benchmark detail",
          "description": "One benchmark in depth: what it measures, the original source leaderboard URL, IRT stats (difficulty, noise, model coverage), skill weights, and the current top models on it.",
          "inputSchema": {
            "properties": {
              "benchmark": {
                "description": "Benchmark name or slug, e.g. \"Aider polyglot\".",
                "type": "string"
              },
              "top": {
                "description": "How many top models to list (1-50, default 10).",
                "type": "number"
              }
            },
            "required": ["benchmark"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Benchmark detail"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d6724c23088cc75b09bd3820f0b0d18588c6406f4af64144b0c1a82fb317c73"
        },
        {
          "name": "get_leaderboard",
          "title": "Aggregate leaderboard",
          "description": "Top of the cross-benchmark aggregate ranking: published Aggregate Ratings combine public benchmark evidence on one scale (call about_the_aggregate for the current coverage and method). One row per model by default, fused across reasoning-effort settings. Supports paging via limit/offset.",
          "inputSchema": {
            "properties": {
              "include_variants": {
                "description": "Rank each reasoning-effort variant separately (e.g. \"Claude Opus 4.6 (High)\") instead of one fused row per model. Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Rows to return (1-100, default 25).",
                "type": "number"
              },
              "offset": {
                "description": "Rows to skip from the top (default 0).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Aggregate leaderboard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f78b7eb3da5f01bcef56af5c92f2064287e070aabb5f34d717dbb5b3d75deb2"
        },
        {
          "name": "get_model",
          "title": "Model profile",
          "description": "One model in depth: aggregate rank, Aggregate Rating with standard error, provider, what it is, cost per task where known, and its most notable benchmark results (with percentiles).",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model name or slug, e.g. \"Claude Opus 4.5\" or \"gpt-5-5\".",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Model profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43392100fca626b5cc99d47f731d55067b9dff3ac43dcdc0165915da79844f89"
        },
        {
          "name": "get_prediction_duel",
          "title": "Prediction duel standings",
          "description": "Guesswork — the public prediction duel: every day frontier LLMs and The Aggregate's own IRT model predict newly scraped benchmark scores before seeing them, and the errors are scored. Returns the current monthly standings, wins and losses included.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prediction duel standings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0021977eebc6800014adfe4f5d031fca096375bd6d29d7bf26edec490f88384"
        },
        {
          "name": "search_benchmarks",
          "title": "Search benchmarks",
          "description": "Find benchmarks in the aggregate by (partial) name. Returns model coverage, difficulty on the rating scale, and the benchmark page URL.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (1-25, default 10).",
                "type": "number"
              },
              "query": {
                "description": "Benchmark name fragment, e.g. \"swe-bench\" or \"arena\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d47a81afdbaba231af631af94a1c09d173795db3e984eee03ba8dee5c131fb74"
        },
        {
          "name": "search_models",
          "title": "Search models",
          "description": "Find ranked models by (partial) name or provider. Returns rank, Aggregate Rating and the model page URL. One row per model by default, fused across reasoning-effort settings.",
          "inputSchema": {
            "properties": {
              "include_variants": {
                "description": "Return each reasoning-effort variant separately (e.g. \"Claude Opus 4.6 (High)\") instead of one fused row per model. Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (1-25, default 10).",
                "type": "number"
              },
              "query": {
                "description": "Model or provider name fragment, e.g. \"opus\" or \"deepseek\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search models"
          },
          "behavior": {
            "destructive": false,
