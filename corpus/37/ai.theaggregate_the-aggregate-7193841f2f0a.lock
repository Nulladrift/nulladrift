          },
          "digest": "sha256:511a36d494f81e118dc5c08c9ff1e2f1f959e55846385e1398d00fd2f5fdac3c"
        }
      ],
      "digest": "sha256:d3712e14d9f656e48b51c6bc44b3da5ab70cf190b66082d185379fbb13004602"
    }
  }
