        {
          "name": "search_family_insurance_plans",
          "title": "Price a verified Atlas Travel family",
          "description": "Price WorldTrips Atlas Travel visitor insurance for a family (non-U.S. citizens traveling to the U.S.) — a verified base premium only when the pinned carrier rate card is intact and the website's family total for identical inputs agrees with it to the cent. Returns per-traveler age-band daily rates, the family total, and a prefilled compare link; otherwise an explicit needs_clarification, unsupported_composition, stale, price_discrepancy or unavailable status plus the compare link. Base premium in USD only — the carrier may add taxes and fees, confirms final price and eligibility, and the tool never buys a plan or takes payment details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "deductible": {
                "description": "Deductible in USD — only the pinned card columns are supported.",
                "enum": [0, 250],
                "type": "integer"
              },
              "destination_country": {
                "description": "ISO 3166-1 alpha-2 destination. Must be US for the verified Atlas America slice; omit and the tool asks instead of guessing.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "end_date": {
                "description": "Last day of coverage as YYYY-MM-DD; at least one day after start_date.",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "max_coverage": {
                "description": "Coverage maximum in USD — only the pinned card columns are supported.",
                "enum": [50000, 100000],
                "type": "integer"
              },
              "product": {
                "description": "The only verified product: WorldTrips Atlas Travel (Atlas America).",
                "enum": ["atlas_travel"],
                "type": "string"
              },
              "residence_citizenship": {
                "description": "ISO 3166-1 alpha-2 country all travelers share as residence AND citizenship. Must not be the US or a US territory; omit and the tool asks instead of guessing.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "start_date": {
                "description": "First day of coverage as YYYY-MM-DD; today (UTC) or later.",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "travelers": {
                "description": "The family to price: exactly one self, at most one spouse, and up to five children. Ages are whole years on the coverage start date — no dates of birth.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "age": {
                      "description": "The traveler's age in whole years on the coverage start date.",
                      "maximum": 120,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "relation": {
                      "enum": ["self", "spouse", "child"],
                      "type": "string"
                    }
                  },
                  "required": ["age", "relation"],
                  "type": "object"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["deductible", "end_date", "max_coverage", "product", "start_date", "travelers"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "base_premium": {
                "properties": {
                  "amount": {
                    "type": "string"
                  },
                  "currency": {
                    "const": "USD"
                  },
                  "days": {
                    "type": "integer"
                  }
                },
                "required": ["amount", "currency", "days"],
                "type": "object"
              },
              "compare_page_url": {
                "type": "string"
              },
              "coverage_days": {
                "type": "integer"
              },
              "coverage_maximum_usd": {
                "type": "integer"
              },
              "deductible_usd": {
                "type": "integer"
              },
              "end_date": {
                "type": "string"
              },
              "excluded": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "family_pricing": {
                "const": "carrier_verified"
              },
              "missing": {
