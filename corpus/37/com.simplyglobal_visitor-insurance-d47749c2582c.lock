        {
          "name": "get_visitor_insurance_plan_details",
          "title": "Compare plan benefits side by side",
          "description": "Compare visitor insurance plan benefits side by side for up to 4 plan_ids returned by search_visitor_insurance_plans. Returns the compare page's benefit rows and highlights per plan, plus the brochure link when available. Default sections can be narrowed with the sections input. Pass the same deductible_usd you used in search_visitor_insurance_plans so the benefits and link match that option; without it, details describe the plan's default option ($250 deductible when offered, else the lowest).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "deductible_usd": {
                "description": "Optional exact deductible in USD (for example 250 for $250); picks the option the benefits and link describe.",
                "minimum": 0,
                "type": "integer"
              },
              "plan_ids": {
                "description": "One to four plan_id values from search_visitor_insurance_plans.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "sections": {
                "description": "Benefit sections to include. Default: all five sections.",
                "items": {
                  "enum": ["summary", "outpatient", "inpatient", "other_medical", "non_medical"],
                  "type": "string"
                },
                "type": "array"
              },
              "trip": {
                "additionalProperties": false,
                "properties": {
                  "coverage_area": {
                    "default": "worldwide_including_us_canada",
                    "description": "Worldwide coverage that includes the US and Canada (default), or US-only coverage.",
                    "enum": ["worldwide_including_us_canada", "us_only"],
                    "type": "string"
                  },
                  "end_date": {
                    "description": "Last day of coverage as YYYY-MM-DD; at least one day after start_date.",
                    "format": "date",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "start_date": {
                    "description": "First day of coverage as YYYY-MM-DD; today (UTC) or later.",
                    "format": "date",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "traveler_age": {
                    "description": "The traveler's age in whole years on the coverage start date; carriers price by that age.",
                    "maximum": 99,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["end_date", "start_date", "traveler_age"],
                "type": "object"
              }
            },
            "required": ["plan_ids", "trip"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "const": "USD"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "plans": {
                "items": {
                  "properties": {
                    "benefits_note": {
                      "type": "string"
                    },
                    "benefits_shown_for": {
                      "properties": {
                        "coverage_maximum_usd": {
                          "type": ["integer", "null"]
                        },
                        "deductible_usd": {
                          "type": ["integer", "null"]
                        },
                        "plan_id": {
                          "type": "string"
                        }
                      },
                      "required": ["coverage_maximum_usd", "deductible_usd", "plan_id"],
                      "type": "object"
                    },
                    "brochure_url": {
                      "type": "string"
                    },
                    "company": {
                      "type": ["string", "null"]
                    },
                    "compare_page_url": {
                      "type": "string"
                    },
                    "groups": {
                      "items": {
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "rows": {
                            "items": {
                              "properties": {
                                "definition": {
                                  "type": "string"
