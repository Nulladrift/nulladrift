                        "heading": {
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["heading", "text"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "required": ["excerpt_scope", "text"],
                "type": "object"
              },
              "canonical_path": {
                "type": "string"
              },
              "citations": {
                "items": {
