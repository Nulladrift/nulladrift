                "const": "carrier_published_rate_card"
              },
              "source_effective": {
                "const": "2025-05-29"
              },
              "source_sha256": {
                "const": "c354316421ce2126f5869c698ba9d388a94b6e6fa07bb0eb253de8f8adf340db"
