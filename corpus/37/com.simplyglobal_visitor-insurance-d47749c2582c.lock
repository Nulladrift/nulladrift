                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["answer_eligible", "canonical_path", "kind", "page_url", "review_state", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "topic": {
                "enum": ["cost", "coverage", "eligibility", "claims", "extension", "terms"]
              },
              "total": {
