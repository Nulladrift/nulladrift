        {
          "name": "search_insurance_guides",
          "title": "Find published visitor-insurance guides and FAQs",
          "description": "Find published SimplyGlobal visitor-insurance guides and FAQs for a traveler's question. Each result carries the canonical link, review state and source-check date; answer_eligible=true marks a completed licensed review whose excerpt text may be quoted, while answer_eligible=false results are navigation links only and must not be quoted. Results are paginated with page and page_size; a query with no match returns suggestions and related navigation instead of composed text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "page": {
                "default": 1,
                "description": "Result page to return, starting at 1 (default 1).",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 5,
                "description": "Results per page, from 1 to 10 (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The traveler's question or topic in plain words, 2 to 200 characters.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "topic": {
                "description": "Optional topic filter narrowing the search.",
                "enum": ["cost", "coverage", "eligibility", "claims", "extension", "terms"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "no_match": {
                "properties": {
                  "related_navigation": {
                    "items": {
                      "properties": {
                        "answer_eligible": {
                          "type": "boolean"
                        },
                        "canonical_path": {
                          "type": "string"
                        }
                      },
                      "required": ["answer_eligible", "canonical_path"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "suggestions": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["related_navigation", "suggestions"],
                "type": "object"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "page": {
                "type": "integer"
              },
              "page_count": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "answer_eligible": {
                      "type": "boolean"
                    },
                    "canonical_path": {
                      "type": "string"
                    },
