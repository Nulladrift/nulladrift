                  "type": "object"
                },
                "type": "array"
              },
              "review": {
                "properties": {
                  "reviewed_at": {
                    "type": "string"
                  },
                  "reviewer": {
                    "properties": {
                      "credential": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": ["credential", "name"],
                    "type": "object"
                  },
