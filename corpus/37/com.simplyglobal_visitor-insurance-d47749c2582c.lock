      "instructions": "SimplyGlobal visitor insurance, United States. search_visitor_insurance_plans: one traveler. search_family_insurance_plans: verified Atlas base premium before fees. get_visitor_insurance_plan_details (max 4 ids). search_insurance_guides/read_insurance_guide: pending links only. get_plan_service_links: official carrier links only. Ages on coverage start date. Insurers set prices; policy wording decides coverage. Buy only at compare_page_url; no payment details without the traveler's approval.",
      "tools": [
        {
          "name": "get_plan_service_links",
          "title": "Find official claim, provider, policy-document and policy-service pages",
          "description": "Return the insurer's official public pages for a visitor insurance plan: where to file a claim, the in-network provider search, or the verified published policy specimen — currently published for Atlas Travel and Patriot America Lite. For other plans, ask the insurer for the applicable document. The tool can also return where to extend or cancel an existing policy on the carrier's own site. Verified extension/cancellation navigation today covers Atlas Travel (extend and cancel) and Patriot America Lite (cancel only); other plans return a general sign-in or contact entry — the insurer may still offer the action. Locate the plan by plan_id from search_visitor_insurance_plans, or by carrier and plan_name; a carrier alone is not enough for an action route. For policy_cancellation, first confirm the traveler means ending a policy they already hold — a question about trip-cancellation coverage or benefits is a different request and belongs in search_insurance_guides. Returns links only: it cannot extend or cancel a policy, file a claim, report claim status, judge coverage or eligibility, confirm a doctor's network participation, sign in, or look up any private order or personal record.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "carrier": {
                "description": "The insurer. Optional with plan_id; narrows plan_name lookup.",
                "enum": ["img", "worldtrips", "trawick_international"],
                "type": "string"
              },
              "plan_id": {
                "description": "A plan_id returned by search_visitor_insurance_plans or get_visitor_insurance_plan_details; resolves the carrier and plan name by itself.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "plan_name": {
                "description": "The plan's display name, for example 'Atlas Travel'.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "service": {
                "description": "Which official destination to return. Use policy_extension or policy_cancellation only for a request about an existing policy — never for a trip-cancellation coverage or benefit question.",
                "enum": ["file_a_claim", "find_in_network_provider", "policy_specimen", "policy_extension", "policy_cancellation"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "items": {
                  "properties": {
                    "kind": {
                      "enum": ["member_portal", "contact_carrier"]
                    },
