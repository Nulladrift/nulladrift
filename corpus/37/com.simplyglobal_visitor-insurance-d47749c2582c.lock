                        "required": ["label", "rows", "section"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "highlights": {
                      "items": {
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "value": {
                            "type": "string"
