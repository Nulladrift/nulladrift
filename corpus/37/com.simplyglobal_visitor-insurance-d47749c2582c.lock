                },
                "type": "array"
              },
              "per_traveler": {
                "items": {
                  "properties": {
                    "age": {
                      "type": "integer"
                    },
                    "age_band": {
                      "type": "string"
                    },
                    "daily_rate_usd": {
                      "type": "string"
                    },
                    "premium_usd": {
                      "type": "string"
                    },
                    "relation": {
                      "enum": ["self", "spouse", "child"]
                    }
                  },
                  "required": ["age", "age_band", "daily_rate_usd", "premium_usd", "relation"],
                  "type": "object"
                },
                "type": "array"
              },
              "product": {
                "type": "string"
              },
              "question": {
                "type": "string"
              },
              "reasons": {
