        {
          "name": "read_insurance_guide",
          "title": "Read an approved insurance guide answer",
          "description": "Read approved answer text for one published SimplyGlobal guide by canonical_path, with its review state, review and source-check dates, and citations. Only guides with an accepted licensed review return answer text; pending pages return status navigate_only with a link, retired paths return unavailable, and stale sources return stale. Pass question to read one FAQ entry by its exact question text. The prices-by-age guide never returns price numbers — current checked prices stay on the live page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "canonical_path": {
                "description": "The guide's canonical path as returned by search_insurance_guides, for example /insurance/visitor-insurance-cost.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "question": {
                "description": "Optional exact FAQ question text to read a single answer instead of the whole guide.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["canonical_path"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "properties": {
                  "excerpt_scope": {
                    "type": "string"
                  },
                  "faq": {
                    "items": {
                      "properties": {
                        "answer": {
                          "type": "string"
                        },
                        "question": {
                          "type": "string"
                        }
                      },
                      "required": ["answer", "question"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "question": {
                    "type": "string"
                  },
                  "sections": {
                    "items": {
