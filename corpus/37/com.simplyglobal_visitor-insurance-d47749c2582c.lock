        {
          "name": "search_visitor_insurance_plans",
          "title": "Search visitor insurance plans and prices",
          "description": "Search SimplyGlobal visitor insurance plans and prices for one traveler. Returns each plan family with its price, coverage maximum, deductible, the compare_page_url the traveler can open, and the exact option to choose on that page. Plans that do not offer a requested coverage maximum or deductible are listed in not_offered with their available options; when the compare page's default card for a plan's coverage range is a different option, the plan is flagged with page_default_differs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "coverage_maximum_usd": {
                "description": "Optional exact coverage maximum in USD (for example 100000 for $100,000). Only plans offering exactly that maximum are returned.",
                "minimum": 1,
                "type": "integer"
              },
              "deductible_usd": {
                "description": "Optional exact deductible in USD (for example 250 for $250).",
                "minimum": 0,
                "type": "integer"
              },
              "plan_type": {
                "default": "all",
                "description": "The plan-type label shown on the SimplyGlobal compare page.",
                "enum": ["all", "comprehensive", "limited"],
                "type": "string"
              },
              "trip": {
                "additionalProperties": false,
                "properties": {
                  "coverage_area": {
                    "default": "worldwide_including_us_canada",
                    "description": "Worldwide coverage that includes the US and Canada (default), or US-only coverage.",
                    "enum": ["worldwide_including_us_canada", "us_only"],
                    "type": "string"
                  },
                  "end_date": {
                    "description": "Last day of coverage as YYYY-MM-DD; at least one day after start_date.",
                    "format": "date",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "start_date": {
                    "description": "First day of coverage as YYYY-MM-DD; today (UTC) or later.",
                    "format": "date",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "traveler_age": {
                    "description": "The traveler's age in whole years on the coverage start date; carriers price by that age.",
                    "maximum": 99,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["end_date", "start_date", "traveler_age"],
                "type": "object"
              }
            },
            "required": ["trip"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "const": "USD"
              },
              "not_offered": {
                "items": {
                  "properties": {
                    "available_coverage_maximums_usd": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "available_deductibles_usd": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "company": {
                      "type": ["string", "null"]
                    },
                    "plan_name": {
                      "type": "string"
                    }
                  },
                  "required": ["available_coverage_maximums_usd", "available_deductibles_usd", "company", "plan_name"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "plan_count": {
                "type": "integer"
              },
              "plans": {
                "items": {
                  "properties": {
                    "available_coverage_maximums_usd": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "available_deductibles_usd": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "company": {
                      "type": ["string", "null"]
                    },
                    "compare_page_url": {
                      "type": "string"
                    },
                    "coverage_maximum_usd": {
                      "type": ["integer", "null"]
                    },
                    "deductible_usd": {
                      "type": ["integer", "null"]
                    },
                    "note": {
                      "type": "string"
                    },
                    "page_default_differs": {
                      "type": "boolean"
                    },
                    "plan_id": {
                      "type": "string"
                    },
                    "plan_name": {
                      "type": "string"
                    },
                    "plan_type": {
                      "enum": ["comprehensive", "limited"]
                    },
                    "price_display": {
                      "type": "string"
                    },
                    "price_usd": {
                      "type": "string"
                    },
                    "select_on_page": {
                      "properties": {
                        "coverage_maximum_usd": {
                          "type": ["integer", "null"]
                        },
                        "deductible_usd": {
                          "type": ["integer", "null"]
                        }
                      },
                      "required": ["coverage_maximum_usd", "deductible_usd"],
                      "type": "object"
                    },
                    "underwriter": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["available_coverage_maximums_usd", "available_deductibles_usd", "company", "compare_page_url", "coverage_maximum_usd", "deductible_usd", "plan_id", "plan_name", "plan_type", "price_display", "price_usd", "select_on_page", "underwriter"],
                  "type": "object"
                },
                "type": "array"
              },
              "quote_issued_at": {
                "type": "string"
              },
              "trip": {
