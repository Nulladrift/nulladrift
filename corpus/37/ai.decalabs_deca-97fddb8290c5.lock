  "subjects": {
    "ai.decalabs/deca": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.decalabs.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "deca",
        "title": "DECA Labs",
        "version": "1.4.0",
        "websiteUrl": "https://app.decalabs.ai/docs"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DECA is an agentic incubator. Its agents read what is rising in the app stores, write product ideas from it, and test them with ten days of real ads. Use get_signals for the demand patterns, get_ideas for ideas worth testing with their evidence, get_my_ideas (with an API key) for the ideas written for the user's own workspace, and quote_test for the price of a test: only the ad budget, at cost, in USDC on Base, with options sized to the idea. start_test pays a quote over x402 (call it without payment first to get the request); get_test follows it. Errors come back as JSON with a code, a message and what to do next.",
      "tools": [
        {
          "name": "cancel_test",
          "title": "Cancel a test",
          "description": "Cancel a test that is still in review, before its ads run. The whole budget is refunded to the paying wallet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "Needed when the test was paid without a key.",
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:de0fec0afbd581a5245a879d092b2f29b1b802a5e9efff773ffb1f20fae9deac"
        },
        {
          "name": "get_ideas",
          "title": "Product ideas",
          "description": "Consumer product ideas DECA's engine wrote from the demand signals and judged worth testing, best first, each with the apps and posts it rests on and its expected sign-up rate. Ideas another founder is testing are not shown. Pass id to read one idea. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "One idea's id, to read only that idea. Optional.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many to return, 1 to 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear in the idea. Optional.",
                "type": "string"
              },
              "verdict": {
                "description": "Only ideas the judge rated this way. Optional.",
                "enum": ["go", "maybe"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4669cefa393bafa866d88acde4894374e85171e050ae40a6cdc7a9a9a557998c"
        },
        {
          "name": "get_my_ideas",
          "title": "Ideas for your workspace",
          "description": "The ideas DECA's engine wrote for your own workspace from what it knows about you (set in the dashboard under Settings → Your radar), each with why it is yours, and the day's public ideas it picked for you. Needs an API key; a key sees only its own workspace. Read only: it never asks the engine to write more. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include": {
                "default": "all",
                "description": "Ideas written for you, the day's picks for you, or both. Default both.",
                "enum": ["all", "written", "picks"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many of each to return, 1 to 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6638f397a5b01d6e4e90eaa43632cfda82b75a0e6667ab9d617a5b9fe90d3526"
        },
        {
          "name": "get_signals",
          "title": "Demand signals",
          "description": "Today's demand patterns from DECA's radar: groups of apps climbing the App Store and Google Play charts, with what people say and want about them and the public posts behind it. Every chart fact names its store category and country. Free. Updated daily.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "heat": {
                "description": "Only patterns people are talking about this much. Optional.",
                "enum": ["rising", "steady"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many to return, 1 to 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear in the pattern, its apps or what people say. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:594780ed613e84a399878ce2c65bdaacc21a5555232e524ead47c7d8980ab922"
        },
        {
          "name": "get_test",
          "title": "Read a test",
          "description": "A paid test's state and everything in it: payment, review, the pass line, progress and the result. Readable with the key it was paid with, or its access_token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "The access_token start_test returned, when the test was paid without a key.",
                "type": "string"
              },
              "id": {
                "description": "The test's id.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecd52c925ac425129f4512910cf414f0437557cd96e61c7f783af01b2fb4a01b"
        },
        {
          "name": "list_my_tests",
          "title": "Your tests",
          "description": "Every test paid with this API key's workspace, newest first. Needs a key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b8e26d596fd745b0d8f3392a03a87fad6e12a44311538d03cab39ce9fc17b42"
        },
        {
          "name": "quote_test",
          "title": "Price a demand test",
          "description": "The price of testing an idea with ten days of real ads, before anything is paid. You pay only the ad budget, at cost, in USDC on Base; there is no fee. The budget is sized to the idea: several options (signal, clear read, market comparison, or your own budget), each with its expected visits, the number of confirmed sign-ups it must reach to pass, and what it can and cannot tell. Use an idea_id from get_ideas or describe your own idea. The quote is valid for 30 minutes. Free; nothing is charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_usd": {
                "description": "A budget of your own to price alongside the options, between 250 and 2000. Optional.",
                "type": "number"
              },
              "idea": {
                "additionalProperties": false,
                "description": "Your own idea, when it is not from get_ideas. It is never published.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "pitch": {
                    "description": "Who it is for and what it does for them, in a few sentences.",
                    "type": "string"
                  }
                },
                "required": ["pitch"],
                "type": "object"
              },
              "idea_id": {
                "description": "An idea's id from get_ideas.",
                "type": "string"
              },
              "markets": {
                "description": "Where the ads run. Default: US, GB, CA.",
                "items": {
                  "enum": ["US", "GB", "CA"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fcbca9a919250c568987eeda0f95b5f9c51c3d1e029354b588dc4d1ae691efbb"
        },
        {
          "name": "start_test",
          "title": "Pay for a test",
          "description": "Pay for one option of a quote and open the test. The price is the option's ad budget in USDC on Base, paid over x402. Call it first without `payment`: the answer is an x402 payment request for the exact amount. Pay it with an x402 client and call again with the payment as `payment` (the base64 PAYMENT-SIGNATURE value). A person reviews every test before its ads run; a declined test is refunded in full. Use sandbox: true to try the whole flow on Base Sepolia with test USDC; a sandbox test runs no ads and moves through its states in minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Any string. Sending the same one again returns the same test and never charges twice.",
                "type": "string"
              },
              "option": {
                "description": "Which of the quote's options to pay for. Default signal.",
                "enum": ["signal", "clear", "compare", "yours"],
                "type": "string"
              },
              "payment": {
                "description": "The x402 payment, base64, as an x402 client creates it. Leave out to get the payment request.",
                "type": "string"
              },
              "quote_id": {
                "description": "The quote_id from quote_test. Quotes hold for 30 minutes.",
                "type": "string"
              },
              "sandbox": {
                "description": "Base Sepolia and test USDC; no ads run. Default false.",
                "type": "boolean"
              },
              "webhook_url": {
                "description": "A public https address told of every change, signed with the webhook_secret returned once.",
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6fcfcb37bc14126bb2f51fc46cb09f509fd9f724713da5cc4e0a5f6e23b85bf"
        }
      ],
      "digest": "sha256:6fe12e054fa55e1d080c1c572fbbcba796480f92db5256fbb1ff7fa06a086940"
    }
  }
}
