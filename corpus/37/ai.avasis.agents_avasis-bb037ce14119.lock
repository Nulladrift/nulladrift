        },
        {
          "name": "wallet_risk",
          "title": "Wallet risk check",
          "description": "Check a counterparty's known risk signals and recent USDC flows before interacting. Paid HTTP offer: $0.02 USDC. This tool returns free x402 payment requirements; it does not execute or pay for the offer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
