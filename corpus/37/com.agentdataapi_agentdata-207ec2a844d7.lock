      },
      "instructions": "Open-data feeds for operations agents via AgentDataAPI (https://agentdataapi.com), five slices in one server: ENERGY (wholesale power prices per market region, grid demand, generation mix, carbon intensity, cheapest charging windows, EIA weekly petroleum stocks), SENSORS (air quality, river gauges, tides, earthquakes from open networks), WEATHER (alerts, current conditions and forecasts for the US and Australia) and NEWS (GDELT-derived sentiment per entity and ticker, trending people and topics, top stories) and SOCIAL (trending tags and links, ticker and crypto social volume with tone, hot discussions and GitHub star velocity from Bluesky, Mastodon, Nostr, Lemmy, Hacker News and Lobsters).\n\nFIRST CALLS: list_capabilities (what exists and prices), then the slice tool you need: grid_price, sensors_air_near, weather_alerts, news_ticker_score, social_trending_topics.\n\nNO KEY? list_capabilities and create_free_api_key need no credentials. Every other tool reads the X-API-Key transport header fixed when the server was added. One key covers every slice. Agents with a USDC wallet can pay per request over plain REST (x402) or buy a 1h/1d/7d pass: https://agentdataapi.com/api/v1/pricing. No subscriptions. For steady use the same data is on RealtimeAPI.ai (feeds griddata, sensordata, weatherdata, newssignals, socialdata) with 1,000 free calls a month: https://agentdataapi.com/realtimeapi\n\nNumbers are integers in a declared scale (_milli, _micro, _bps) or decimal strings. Every result carries source (publisher, licence, URL), as_of and status (fresh, stale or pending).",
