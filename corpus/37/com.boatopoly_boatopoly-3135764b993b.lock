{
  "lockfileVersion": 2,
  "subjects": {
    "com.boatopoly/boatopoly": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://boatopoly.com/functions/v1/ai-import-mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "boatopoly",
        "title": "Boatopoly",
        "version": "1.11.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Boatopoly is a boat marketplace. To import a seller's boats: call get_import_guide (with the language of the conversation) for the format, read the boats from the seller's documents, then call submit_boats with at most 100 boats per call and give the seller the link it returns. The seller checks the boats there and creates the drafts; nothing is published by this server. To find boats for a buyer or a dealer: call search_boats with what they look for (type, manufacturer, price, length, year, country), get_boat for the details of one, and give them the links; they contact the seller on the advert page.",
      "tools": [
        {
          "name": "get_boat",
          "title": "Details of a boat on Boatopoly",
          "description": "Returns the details of one boat for sale on Boatopoly: price, dimensions, year, engines, equipment notes, the description (in the language of the conversation when the seller has one), photos and the link to the advert. Give the advert number (e.g. 30012) or the link that search_boats returned. The buyer contacts the seller on the advert page; this tool sends no message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "boat": {
                "description": "The advert number (e.g. \"30012\") or the link of the advert.",
                "type": "string"
              },
              "language": {
                "description": "The language of the conversation with the seller: German (de), English (en), Spanish (es), Czech (cs), French (fr), Italian (it), Dutch (nl), Polish (pl), Croatian (hr), Slovenian (sl), Latvian (lv), Swedish (sv), Portuguese (pt), Danish (da), Norwegian (no), Finnish (fi), Greek (el), Turkish (tr) or Hungarian (hu) (default English). The answers and the links to Boatopoly come in this language.",
                "enum": ["de", "en", "es", "cs", "fr", "it", "nl", "pl", "hr", "sl", "lv", "sv", "pt", "da", "no", "fi", "el", "tr", "hu"],
                "type": "string"
              }
            },
            "required": ["boat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Details of a boat on Boatopoly"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b428a0661e5d53ff401cfa86fdde3415ebb015e2f0c4268e6577aaf74daed341"
        },
        {
          "name": "get_import_guide",
          "title": "Boatopoly import guide",
          "description": "Returns how to describe boats for Boatopoly: the fields of one boat with their units, the boat types with their current categories, the allowed values and an example. Call it once before handing boats over.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "The language of the conversation with the seller: German (de), English (en), Spanish (es), Czech (cs), French (fr), Italian (it), Dutch (nl), Polish (pl), Croatian (hr), Slovenian (sl), Latvian (lv), Swedish (sv), Portuguese (pt), Danish (da), Norwegian (no), Finnish (fi), Greek (el), Turkish (tr) or Hungarian (hu) (default English). The answers and the links to Boatopoly come in this language.",
                "enum": ["de", "en", "es", "cs", "fr", "it", "nl", "pl", "hr", "sl", "lv", "sv", "pt", "da", "no", "fi", "el", "tr", "hu"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Boatopoly import guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:328676d12798e9057caf64a0de4459d1b85d0bd6c698dcc49dcd4cde48c1d69e"
        },
        {
          "name": "search_boats",
          "title": "Search boats for sale on Boatopoly",
          "description": "Searches the boats for sale on Boatopoly (active adverts) with the filters of the website's search: words (manufacturer, model, words of the title or description, or an advert number), the boat type, the manufacturer, the model, new or used, the country, the price in euros, the length in metres and the year built. Returns the matching boats (price, length, year, place, the link to each advert) and the number of matches, at most 20 per call; get_boat gives the details of one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "boat_type": {
                "description": "The boat type: power = Motor boat, sail = Sailboat, small = Small boat, vessel = Vessel, other-boats = Other boats, trailer = Trailer, motor = Motor, equipment = Equipment, moorings = Moorings, other-equipment = Other equipment.",
                "enum": ["power", "sail", "small", "vessel", "other-boats", "trailer", "motor", "equipment", "moorings", "other-equipment"],
                "type": "string"
              },
              "condition": {
                "description": "New or used boats only.",
                "enum": ["new", "used"],
                "type": "string"
              },
              "country": {
                "description": "The country of the boat as ISO 3166-1 alpha-2 code, several separated by commas, e.g. \"DE\" or \"HR,IT,GR\".",
                "type": "string"
              },
              "language": {
                "description": "The language of the conversation with the seller: German (de), English (en), Spanish (es), Czech (cs), French (fr), Italian (it), Dutch (nl), Polish (pl), Croatian (hr), Slovenian (sl), Latvian (lv), Swedish (sv), Portuguese (pt), Danish (da), Norwegian (no), Finnish (fi), Greek (el), Turkish (tr) or Hungarian (hu) (default English). The answers and the links to Boatopoly come in this language.",
                "enum": ["de", "en", "es", "cs", "fr", "it", "nl", "pl", "hr", "sl", "lv", "sv", "pt", "da", "no", "fi", "el", "tr", "hu"],
                "type": "string"
              },
              "length_max": {
                "description": "Longest length in metres.",
                "minimum": 0,
                "type": "number"
              },
              "length_min": {
                "description": "Shortest length in metres.",
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "How many boats (default 10, at most 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "The manufacturer (yard, brand), e.g. \"Bavaria\", \"Beneteau\", \"Sea Ray\".",
                "type": "string"
              },
              "model": {
                "description": "The model, or a part of it, e.g. \"Cruiser 34\".",
                "type": "string"
              },
              "offset": {
                "description": "Skip this many matches: the next page of the same search.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "price_max": {
                "description": "Highest price in euros.",
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Lowest price in euros.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Words to look for, e.g. \"Bavaria Cruiser 34\" or \"catamaran\"; or an advert number.",
                "type": "string"
              },
              "sort": {
                "description": "The order: relevance (with words, the default then), newest (otherwise the default), price, length or year.",
                "enum": ["relevance", "newest", "price_asc", "price_desc", "length_asc", "length_desc", "year_desc", "year_asc"],
                "type": "string"
              },
              "year_max": {
                "description": "Built in this year or earlier.",
                "minimum": 1800,
                "type": "integer"
              },
              "year_min": {
                "description": "Built in this year or later.",
                "minimum": 1800,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "boats": {
                "items": {
                  "properties": {
                    "currency": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "The advert number.",
                      "type": ["integer", "null"]
                    },
                    "price": {
                      "type": ["number", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The advert page.",
                      "type": "string"
                    }
                  },
                  "required": ["title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "offset": {
                "type": "integer"
              },
              "total": {
                "description": "All matches of the search.",
                "type": ["integer", "null"]
              }
            },
            "required": ["boats", "offset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search boats for sale on Boatopoly"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c7af90f1861d9be5104d1428511b384134b6f959eef55cc03bbbdb77cc6f607"
        },
        {
          "name": "submit_boats",
          "title": "Hand boats over to Boatopoly",
          "description": "Hands up to 100 boats over to Boatopoly, each an object in the format of get_import_guide. Returns a link for the seller: signed in to Boatopoly, the seller checks every boat in a preview and creates drafts from them. Nothing is published and no account is touched by this call. The link is valid for 3 days.",
          "inputSchema": {
            "properties": {
              "boats": {
                "description": "The boats, one object each, with the fields of get_import_guide (boat_type, category, title, manufacturer, model, price, …).",
                "items": {
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "The language of the conversation with the seller: German (de), English (en), Spanish (es), Czech (cs), French (fr), Italian (it), Dutch (nl), Polish (pl), Croatian (hr), Slovenian (sl), Latvian (lv), Swedish (sv), Portuguese (pt), Danish (da), Norwegian (no), Finnish (fi), Greek (el), Turkish (tr) or Hungarian (hu) (default English). The answers and the links to Boatopoly come in this language.",
                "enum": ["de", "en", "es", "cs", "fr", "it", "nl", "pl", "hr", "sl", "lv", "sv", "pt", "da", "no", "fi", "el", "tr", "hu"],
                "type": "string"
              }
            },
            "required": ["boats"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "boat_count": {
                "type": "integer"
              },
              "expires_at": {
                "description": "End of validity of the link (ISO 8601).",
                "type": "string"
              },
              "import_url": {
                "description": "The link for the seller.",
                "type": "string"
              }
            },
            "required": ["boat_count", "expires_at", "import_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Hand boats over to Boatopoly"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2e98a602e8acf6ec80458a7919a51c1d56ed2d18f2f53ce179c6f60d38853563"
        }
      ],
      "digest": "sha256:267cc4464f5ce9a7019ea0d16e035da16ea1c1f342a4d717da71173aa9254f30"
    }
  }
}
