{
  "lockfileVersion": 2,
  "subjects": {
    "com.pennyocr/ocr": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pennyocr.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pennyocr",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "PennyOCR reads documents (PDF/images) into markdown or text. read_document costs $0.00075/page (exact cost_usd returned); estimate_cost is free. Get an API key at https://pennyocr.com/dashboard/ — agents: see https://pennyocr.com/llms.txt for keyless signup steps.",
      "tools": [
        {
          "name": "estimate_cost",
          "description": "Free: return the page count and exact cost_usd to read a document URL with read_document, without running OCR. Use before reading large documents.",
          "inputSchema": {
            "properties": {
              "pages": {
                "description": "Optional page range like '1-20'.",
                "type": "string"
              },
              "url": {
                "description": "http(s) URL of the PDF or image",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad3f19b7eda0e03686e683a0bd25e41e1d420ce09f240fa555b6b085db01bf3c"
        },
        {
          "name": "read_document",
          "description": "Read a document (PDF or image) from a URL and return its contents as markdown (tables preserved) or plain text. Costs $0.00075 per page, billed to the PennyOCR account; the response includes the exact cost_usd and per-page citations. Use estimate_cost first for big documents. Supports page ranges and hard spend caps.",
          "inputSchema": {
            "properties": {
              "max_cost_usd": {
                "description": "Refuse (with the numbers) if the run would cost more than this.",
                "type": "number"
              },
              "max_pages": {
                "description": "Refuse (with the numbers) if selection exceeds this many pages.",
                "type": "integer"
              },
              "output": {
                "description": "Output format. Default markdown.",
                "enum": ["markdown", "text"],
                "type": "string"
              },
              "pages": {
                "description": "Page range like '1-20,25'. Default: all pages.",
                "type": "string"
              },
              "url": {
                "description": "http(s) URL of the PDF or image",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f902ab3e86fd6a12047f11abf41683b7604b92af2e837692dc8af8f57219d40"
        }
      ],
      "digest": "sha256:403bc3f59ab97ec4d547a68f46fd39d4a00523a547382240579e37a9fc835027"
    }
  }
}
