{
  "lockfileVersion": 2,
  "subjects": {
    "com.changerella/app": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.changerella.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "changerella",
        "title": "Changerella — crypto exchange aggregator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Changerella compares live quotes from instant crypto exchangers (non-custodial, no account) and shows what each one actually pays out after fees.\nTypical flow: search_assets to find the exact code and network → get_quotes for the user's amount → give the user swap_url, where they pick the offer, enter their own receiving address and send the deposit directly to the exchanger. You cannot create an exchange through this server, and you never need the user's keys or addresses.\nget_quotes asks exchangers live and is rate-limited; prefer get_market_rates for a rough rate and get_swap_link when the user only needs the page. Reuse a quote you already have instead of asking again.",
      "tools": [
        {
          "name": "get_market_rates",
          "title": "Best rates for popular pairs",
          "description": "Best current rate per popular direction (e.g. BTC→USDT, USDT→XMR) from a periodically refreshed snapshot. Cheap, no live request; filter by from/to ticker.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "type": "string"
              },
              "limit": {
                "default": 30,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d42bb1f50e55edc479a40fda2017961fbbde3c19294679a0cdc052380c748bb"
        },
        {
          "name": "get_order_status",
          "title": "Status of an exchange",
          "description": "Status of an exchange the user created on Changerella, by the order id from its page address (app.changerella.com/order/<id>): stage, amounts, payout transaction id. Addresses are not returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "UUID from the order page URL.",
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:027593994dbd8ff6965e60e0219002ac94df7dd88d7d1fcef0c625296efef994"
        },
        {
          "name": "get_quotes",
          "title": "Compare exchangers for an amount",
          "description": "Live offers from all exchangers serving the pair for the given amount, best first: amount received after all fees, rate, KYC rating (A best … D), ETA, limits, and a swap_url per offer for the user to complete the exchange. Rate-limited (answers are cached for a minute); do not poll.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount of `from` to send.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "from": {
                "description": "Ticker to send, e.g. BTC.",
                "type": "string"
              },
              "from_network": {
                "description": "Network of the sent coin, e.g. TRX for USDT on Tron. Required when the coin lives on several networks.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_kyc": {
                "description": "Only exchangers with this KYC rating or better (A = no KYC expected).",
                "enum": ["A", "B", "C", "D"],
                "type": "string"
              },
              "rate_type": {
                "default": "floating",
                "enum": ["floating", "fixed"],
                "type": "string"
              },
              "to": {
                "description": "Ticker to receive, e.g. XMR.",
                "type": "string"
              },
              "to_network": {
                "description": "Network of the received coin.",
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aaba3fdf8b18a8c070d2dbc3d790e5ef55c333c1dca2dc266508a473fe868083"
        },
        {
          "name": "get_swap_link",
          "title": "Link to swap a pair",
          "description": "A link that opens the Changerella calculator on the pair (and amount), where the user compares offers and completes the swap themselves. Validates that the pair can be exchanged. Cheap: no live request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "from": {
                "type": "string"
              },
              "from_network": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "to_network": {
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60265630a4a8ed553e083e5d59cfc2951018df443a2fea2a98be396900a43e41"
        },
        {
          "name": "list_exchangers",
          "title": "Exchangers compared",
          "description": "The exchangers Changerella compares, with their KYC rating (A — no KYC expected … D — KYC likely).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:542c0e5d8543df8e1797f189ea417ec534e58252b5a0c5176b46e5dcbf68db68"
        },
        {
          "name": "search_assets",
          "title": "Find coins and networks",
          "description": "Search the coins and networks that can be exchanged (by ticker or name, e.g. \"usdt\", \"monero\"). Returns code + network pairs to use in the other tools, whether the coin can be sent and/or received, and its USD price. Cheap: served from memory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Ticker or coin name; empty lists the biggest coins.",
                "type": "string"
              },
              "side": {
                "description": "Only coins that can be sent (from) or received (to).",
                "enum": ["from", "to"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9efeec1067a9dbb289d8d8e1b75efad666f30c872f6aab4f9037d6762f5d66bf"
        }
      ],
      "digest": "sha256:d57d11de8f1ea20688decd8ff6af204899856b6cc93f9b629d394073144c8845"
    }
  }
}
