          "description": "Find the NetSendo documentation page or step-by-step how-to for a task, e.g. \"connect Amazon SES\", \"double opt-in\", \"import contacts from Mailchimp\", \"update NetSendo\", \"emails not sending\". Returns title, url, the NetSendo release the page was checked against and the best-matching passage. Read the whole page with get_doc (id) and cite its url.",
