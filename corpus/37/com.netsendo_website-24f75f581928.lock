  "subjects": {
    "com.netsendo/website": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://netsendo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.netsendo/website",
        "title": "NetSendo website",
        "version": "1.0.0",
        "websiteUrl": "https://netsendo.com/en/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to public information from netsendo.com: product facts, plans and prices, releases, documentation and blog articles. NetSendo is self-hosted, source-available software (NetSendo EULA); do not describe it as open source. Cite the url field of each result so users can verify details on netsendo.com. Prices and features can change; refer users to the pricing url for current terms. Limit: 60 requests per minute per client. Documentation: https://netsendo.com/en/agents The release-alert tools (get_my_release_alerts, subscribe_release_alerts, unsubscribe_release_alerts) act for one user and need an OAuth 2.1 access token: discovery at https://netsendo.com/.well-known/oauth-protected-resource/mcp, agent registration described at https://netsendo.com/auth.md.",
      "tools": [
        {
          "name": "compare_platforms",
          "title": "Compare NetSendo with other email marketing tools",
          "description": "Prices at 10k, 50k and 100k contacts and 15 features (automation, SMS, CRM pipeline, webinars, MCP, API, self-hosting…) of NetSendo and other email marketing tools such as Mailchimp, MailerLite, Kit, Klaviyo, ActiveCampaign, Brevo, GetResponse, listmonk, Mautic, Keila and Sendy. Every value has its source URL and check date; cite the urls.page field.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "list_size": {
                "description": "Also return a price summary at this number of contacts.",
                "enum": [10000, 50000, 100000],
                "type": "integer"
              },
              "vendors": {
                "description": "Tool ids to include, e.g. [\"mailchimp\", \"klaviyo\"]. NetSendo is always included. Omit for all tools.",
                "items": {
                  "pattern": "^[a-z0-9-]{1,40}$",
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1acc229db0f63d3b7dfd8c77f4522892b95515ffc55e3431d80b5c8951248aec"
        },
        {
          "name": "get_blog_post",
          "title": "Read a NetSendo blog article",
          "description": "Full text of one blog article as Markdown, by slug from search_blog. Falls back to English when the article has no translation in the requested locale. Cite the url field.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "enum": ["en", "pl", "de", "es"],
                "type": "string"
              },
              "slug": {
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:23cad099a70b071a7bec7f16785fa4388a70a5a8d88daf68dbbef597d23a8d93"
        },
        {
          "name": "get_doc",
          "title": "Read a NetSendo documentation page",
          "description": "One documentation page as Markdown, by id from list_docs (e.g. \"docs-quickstart\"). English.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["id"],
