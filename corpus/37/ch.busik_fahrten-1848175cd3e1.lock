{
  "lockfileVersion": 2,
  "subjects": {
    "ch.busik/fahrten": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://busik.ch/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "busik.ch",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "busik.ch lists minibus trips between Ukraine and Europe, offered by independent drivers and small bus operators. Use get_routes_for_city to see which connections exist, search_trips for a date, and get_trip_details for stops and rules. Do not collect personal or payment details. The passenger books on busik.ch via booking_url and pays the driver directly.",
      "tools": [
        {
          "name": "get_routes_for_city",
          "title": "Routes for a city",
          "description": "List the connections that currently have upcoming trips from and/or to a city, with the next departure. Use this to answer 'Where can I go from Lviv?' before searching a specific date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. 'Kyiv', 'Zürich'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "direction": {
                "description": "Connections FROM the city, TO the city, or both. Default 'both'.",
                "enum": ["from", "to", "both"],
                "type": "string"
              },
              "language": {
                "description": "Language for city and stop names: 'de' German (default) or 'uk' Ukrainian.",
                "enum": ["de", "uk"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Routes for a city"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:073af9c6e8725d48825c09b0703b2c30bd0c60bec9f395a071233ced57715a6f"
        },
        {
          "name": "get_trip_details",
          "title": "Trip details",
          "description": "Details of one trip found with search_trips: all stops with times (boarding points, breaks, border crossing), luggage allowance, payment method and the booking link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language for city and stop names: 'de' German (default) or 'uk' Ukrainian.",
                "enum": ["de", "uk"],
                "type": "string"
              },
              "trip_id": {
                "description": "The trip_id from search_trips, e.g. '17-0-5'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["trip_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trip details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81ab7635a57291b11546c4ec7214d674436591a1a883548c01c456f64e1fa336"
        },
        {
          "name": "search_trips",
          "title": "Search bus trips",
          "description": "Search minibus trips offered on busik.ch between two cities on a given travel date. busik.ch connects passengers with independent drivers and small bus operators between Ukraine and Europe (also via Poland, Austria, Czechia). Trips may stop in between; a search also finds the part of a longer trip. Prices are per person. Booking is done by the passenger on busik.ch via booking_url; payment is made directly to the driver. If a city is unknown or ambiguous, the result lists candidates to ask about.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Travel date (local date at the departure city), ISO 8601, e.g. '2026-10-15'.",
                "format": "date",
                "type": "string"
              },
              "from": {
                "description": "Departure city, e.g. 'Lviv', 'Kyiv', 'Zürich', 'Львів'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language for city and stop names: 'de' German (default) or 'uk' Ukrainian.",
                "enum": ["de", "uk"],
                "type": "string"
              },
              "seats": {
                "description": "Number of seats needed. Default 1.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Arrival city, e.g. 'Zurich', 'München', 'Berlin', 'Київ'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["date", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search bus trips"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d18373cbca78b8792f2a970e7ca6fffee9a6594f90bebc08c3d0b5cc7f1aa5e5"
        }
      ],
      "digest": "sha256:fbcb38c58a1cb86d7040ccdeb81ce0d8dc07e917961c35ec4e4702829d73cf96"
    }
  }
}
