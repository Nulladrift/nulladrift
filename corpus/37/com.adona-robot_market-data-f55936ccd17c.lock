          },
          "digest": "sha256:ffc9416578d65839ef46f2e0a51e090405a8d7dd5e6d8faca0e75c97ddfcd6cd"
        },
        {
          "name": "quote_price_for",
          "description": "Price a month of a usage you already know: simultaneous connections at peak, slices of 1000 bars, and symbols followed live continuously. Answers the smallest plan covering it and the CHF total before VAT. For the plans themselves, use get_offer.",
          "inputSchema": {
            "properties": {
