            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:93539ab39ed5a83eea0d2ccc876223b84ab5d1e6234d6008382b62ecfb96ddad"
        },
        {
          "name": "list_symbols",
          "description": "Every FX pair and spot metal a paid plan carries, with its name and class.",
          "inputSchema": {
            "properties": {},
            "title": "list_symbolsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
