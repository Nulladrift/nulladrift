      },
      "instructions": "Adona Robot sells forex and gold market data by capacity: one-second OHLC candles and a real-time bid/ask quote stream for FX pairs and spot metals (XAUUSD, XAUEUR, XAGUSD, XPTUSD, XPDUSD), over REST and WebSocket, with redistribution allowed. Use get_offer for the plans, the free trial and the terms, list_symbols for what is available, and quote_price_for to price a usage. Data itself is read with an API key: get_candles here, with the key in the Authorization header (Bearer adk_live_...) or, where a gateway keeps Authorization for itself, in the X-API-Key header, and billed like GET /v1/candles, or the /v1 REST and WebSocket API (see the reference). No key yet: get_offer's links.signup opens a free trial.",
      "tools": [
        {
          "name": "get_candles",
          "description": "Candle history for one symbol, one page, oldest first, with your API key in the request's Authorization header (Bearer adk_live_... or adk_test_...) or in its X-API-Key header (adk_live_..., for a client or gateway that keeps Authorization for itself; two different keys are refused with CONFLICTING_API_KEYS). Billed like GET /v1/candles: slices of 1000 bars, rounded up, an empty page costs nothing. timeframe is one of D1, H4, H1, M15, M5, M1, S1; limit 1 to 5000; page backwards with before = the previous answer's next_before. end_user_id names the person you serve, for the per-person minute ceiling. Refusals answer the /v1 codes.",
          "inputSchema": {
            "properties": {
              "before": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Before"
              },
              "end_user_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "End User Id"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "symbol": {
                "title": "Symbol",
                "type": "string"
              },
              "timeframe": {
                "title": "Timeframe",
                "type": "string"
              }
            },
            "required": ["symbol", "timeframe"],
            "title": "get_candlesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd3f0fe4ab0e17792c803055fa34161492bdbc975ed7d3af919c4847d57e44d8"
        },
        {
          "name": "get_offer",
          "description": "Call this first to learn what is sold: the plans with their CHF prices and limits, the free trial, the continuous-feed rule, the redistribution terms, and links (signup, API reference, OpenAPI). To price a specific usage, use quote_price_for.",
          "inputSchema": {
            "properties": {},
            "title": "get_offerArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_offerDictOutput",
