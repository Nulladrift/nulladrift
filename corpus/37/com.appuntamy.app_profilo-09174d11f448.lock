      "instructions": "Usa questi strumenti per consultare il profilo pubblico di Appuntamy, orientarti tra le risorse e trovare la pagina per richiedere una demo. Documentazione su https://app.appuntamy.com/docs.",
      "tools": [
        {
          "name": "find_product_resources",
          "title": "Risorse ufficiali del prodotto",
          "description": "Filtra per parole chiave i collegamenti pubblici sulle funzionalità e su come usare Appuntamy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Numero massimo di risorse. Il valore predefinito è 5.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Argomento da cercare tra le risorse ufficiali",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "resources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["resources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:283d9a92a3976a35c8e041d04dc178a6cf1475600e314d87a07d9e4132e9b3c8"
        },
        {
          "name": "get_demo_link",
          "title": "Pagina per richiedere una demo",
          "description": "Restituisce il link ufficiale dove l'utente può richiedere una demo di Appuntamy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
