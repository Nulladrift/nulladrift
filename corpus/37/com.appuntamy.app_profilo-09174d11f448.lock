            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1293f36f25480d9d8320131fa26b7f7e3139e6da7823a6e000a5616494e69b9a"
        },
        {
          "name": "get_product_profile",
          "title": "Profilo del prodotto",
          "description": "Legge il profilo pubblico di Appuntamy, con descrizione, destinatari, funzionalità e link ufficiali.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "demo": {
                "format": "uri",
                "type": "string"
              },
              "product": {
                "additionalProperties": false,
                "properties": {
                  "audience": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "features": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "website": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["audience", "description", "features", "name", "website"],
                "type": "object"
              },
              "publisher": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "portfolio": {
                    "format": "uri",
                    "type": "string"
                  },
                  "website": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["email", "name", "portfolio", "website"],
                "type": "object"
              },
              "resources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["demo", "product", "publisher", "resources"],
            "type": "object"
          },
