                "default": null,
                "description": "your niche, product or audience, as you would say it (1 to 120 characters)",
                "title": "Niche"
              },
              "video_brief": {
                "default": null,
                "description": "required for mode \"intro\", 10 to 600 characters: what your video is about, in a few sentences, in your own words and language. The intro uses only the facts and numbers you write here; anything else becomes a {placeholder}",
                "examples": ["A beginner video on why home espresso tastes sour, built around my 18 grams in, 36 grams out recipe."],
                "maxLength": 600,
                "minLength": 10,
                "title": "Video Brief",
                "type": ["string", "null"]
              }
