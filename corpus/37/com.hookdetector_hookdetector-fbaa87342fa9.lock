        {
          "name": "find_packaging",
          "description": "Find packaging: the titles and thumbnails that earned the click on a topic, from\n    long-form YouTube videos that beat their own channel.\n\n    What it does: runs the same outlier search as find_long_hooks (long-form YouTube,\n    2023 or later, views at least min_outlier times the channel's usual), then looks at\n    each video's thumbnail beside its title and says what the pair is doing.\n\n    What comes back: the run's `finds`, ranked. Each is a real package, as YouTube shows\n    it: title (verbatim) and thumbnail_url (the size YouTube really served, the picture\n    the analysis looked at; thumbnail_checked says so), channel, watch_url, views,\n    channel_median_views, outlier, outlier_score (0 to 100 on one fixed scale, so finds\n    from different runs rank together), outlier_tier, channel_size and posted_at, plus the analysis: title_device (curiosity_gap, contrarian_claim,\n    specific_number, how_to, listicle, challenge, story, question, warning, comparison,\n    authority, timeliness, identity_callout, other), title_template (the title as a\n    fill-in structure), thumbnail_text (the words printed on the thumbnail, read by a vision\n    model; null when none), thumbnail_text_role (repeats_title, adds_to_title,\n    contrasts_title, no_text; counted from title_overlap, the share of the thumbnail's words\n    that are also in the title, where that can be), thumbnail_subject, thumbnail_faces,\n    thumbnail_emotion,\n    thumbnail_colors, thumbnail_composition, thumbnail_devices, angle, gap (what the picture shows that the title does not say, and the\n    question that leaves), promise, steal_it and audience, visible_action (the single thing\n    happening in the picture), title_carries and picture_adds (what only the title says,\n    what only the picture adds), text_box, and thumb_metrics (measured in code from the\n    pixels: palette, brightness, contrast, saturation, busyness, the biggest words' height\n    at 210 px wide and whether the length corner is clear), plus cut_on_phone (the title is\n    longer than 60 characters, where a phone roughly cuts it; approximate) and on_subject\n    (yes or partly: whether the look judged the package to be about your topic; a package\n    judged not to be is dropped and the next one takes its slot; null on a link run). analysed\n    is false when a package could not be looked at (its look is asked twice, and the next\n    candidate takes the slot if it fails twice); it is still a real package.\n\n    The run's report then holds title_patterns and thumbnail_patterns (what at least two\n    of the packages share, each naming their video_ids) and ideas: up to `ideas` (6 by\n    default, 0 for none) packages WRITTEN for your topic from those patterns, each a title\n    a thumbnail concept and thumbnail_text (the words to print on it), naming the real\n    packages it is based_on. report.ideas_label is always \"Written by Hook Detector from\n    the patterns in these real packages\": show it with them, never present an idea as a\n    real video's title; an idea over 70 characters, with more than 5 words for its\n    thumbnail or repeating a real title is dropped. report.numbers counts the packages:\n    title_chars and title_words\n    (medians), titles_with_number, titles_with_question, titles_cut_on_phone (with\n    phone_title_chars, the approximate length a phone cuts a title at), thumbnails_with_text\n    and thumbnail_words (over the analysed ones), and the title_devices, thumbnail_devices and\n    emotions that repeat (name, count); age_cohorts repeats the counts for packages posted in\n    the last split_days days (recent) and for older ones, with the undated apart.\n    report.landscape is the subject at a glance, as on find_long_hooks.\n\n    Arguments: topic 3 to 500 characters, or a channel's or a long-form video's YouTube\n    address exactly as on find_long_hooks (a channel's own outliers, or that one video; no\n    ideas are written for a link, use remix_find); count 1 to 30 (default 12); language,\n    country, min_outlier, posted_within_days, channel_size and reuse as on\n    find_long_hooks; idempotency_key and wait_seconds as on find_hooks; content_type\n    \"short\" finds the packages of YouTube Shorts instead of long-form videos (\"long\", the\n    default), each Short measured against its own channel's Shorts. Every find carries\n    multiple (views over the channel's median, the number 1of10 and vidIQ show),\n    multiple_band (10x, 5x, 2x, under 2x) and content_type.\n\n    Cost: reserves up to 70 credits for 24 packages or fewer and 3 more for each package\n    above that (88 at 30; down to 25) and charges only the provider calls it\n    made: the searches, one call per channel measured, and one for each video whose date\n    had to be read exactly. Looking at a thumbnail costs no credit. After a find_long_hooks run on the same topic it is close\n    to free. A failed run costs nothing, and so does a run that finds nothing, inside the\n    allowance.\n\n    Timing and next step: how long a run takes has not been measured yet, so never assume\n    a time. Call get_run with wait_seconds=50 until status is done or failed;\n    progress.items holds the packages looked at so far as cards and progress.scan the videos\n    it is looking at while it runs. Same as POST /v1/packaging. Needs the research\n    permission.",
          "inputSchema": {
