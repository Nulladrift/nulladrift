              },
              "platforms": {
                "default": null,
                "description": "since 2026-10-10: optional, which platforms to search and deliver from, a non-empty list of \"tiktok\", \"instagram\" and \"youtube\" (YouTube Shorts); left out (or all three) searches all three. [\"instagram\"] delivers Instagram reels only. Names are read without regard to case and a repeat counts once; an empty list or any other name is 422 naming platforms. The run echoes it as `platforms`.",
                "examples": [
                  ["instagram"]
                ],
                "items": {
                  "enum": ["tiktok", "instagram", "youtube"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "title": "Platforms",
                "type": ["array", "null"],
                "uniqueItems": true
              },
              "posted_within_days": {
                "default": null,
                "description": "since 2026-10-01: optional, how recent the clips must be, as days: 7, 30, 90, 365. The search asks the platforms for that window and the floor for a clip under 7 days old uses views per day (10,000 a day passes); null or left out means any time. A clip's `posted_at` and `age_days` say what the run found. For chat (the recency chip): omitted keeps the conversation's current setting; 7, 30, 90 or 365 sets it for this and later turns and wins over a recency phrase in the message; an explicit null on REST, or 0 on either door, clears it back to any time.",
                "enum": [7, 30, 90, 365, 0, null],
