        {
          "name": "remix_find",
          "description": "Make it mine, for a long-form opening or a package: write up to n (1 to 5, default\n    3) new ones for your niche that keep one real find's structure. From a long find,\n    `written` holds openings: hook (what the creator says first), then (what the next half\n    minute has to deliver) and kept_structure, built on the find's template and its order\n    of beats. From a packaging find it holds packages: title, thumbnail (what to show and\n    how to frame it), thumbnail_text (the words to print, or null) and kept_structure,\n    built on its title template and its thumbnail's composition.\n\n    Write my intro: with mode \"intro\" and video_brief (your own video in a few sentences,\n    10 to 600 characters; a long find only, a packaging find is 422; niche and n are not\n    used) it writes YOUR intro in the real opening's structure. `written` then holds one\n    object with a beat for each beat of the real opening, in order: beat, does, from_s,\n    to_s, seconds and words_budget (the real opening's own timing, never the model's), say\n    (the words to say, with {placeholders} for what only you know), words, placeholders,\n    suggested_on_screen and suggested_broll (suggestions, never part of what is said); and\n    seconds, timing (measured or estimated), kept_structure, placeholders and\n    numbers_to_placeholders. The answer carries mode \"intro\" and video_brief, and niche is\n    null. A number you did not write in video_brief becomes {number}. One that copies the\n    real opening or runs over a word budget is 422 remix_not_possible.\n\n    Returns {\"find_id\", \"kind\", \"niche\", \"n\", \"written\", \"label\", \"credits_charged\": 1,\n    \"credits\"}. label says they were written by Hook Detector from a real opening's (or\n    package's) structure: show it with them, never present one as a real video's. One that\n    is the real find's own words is dropped. They are never added to a run, a keep or an\n    export. Costs 1 credit per call, taken before the model is asked and refunded when it\n    does not answer (503 model_unavailable) or when nothing it wrote keeps the rules or it\n    declines the content (422 remix_not_possible, the reason in the message; another try\n    or another niche may work). 402 insufficient_credits at a balance of 0;\n    404 find_not_found; limited per account per hour (429 rate_limited). Needs the\n    research permission. The answer carries remix_id: list_remixes and get_remix read it\n    back, free. Same as POST /v1/finds/{find_id}/remix.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "find_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "one of your finds (from get_run, get_find, list_finds or list_kept_finds)",
