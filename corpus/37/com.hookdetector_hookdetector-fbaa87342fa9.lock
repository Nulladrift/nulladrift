        {
          "name": "chat",
          "description": "One conversational turn, for an agent relaying a person's words. It either asks\n    ONE clarifying question (action \"clarify\"), answers about delivered hooks or the tool\n    (action \"answer\", run null, no credits), or starts a research run (action\n    \"research\", with the started run under \"run\"), exactly like POST /v1/chat.\n    Every response has suggestions: 0 to 4 follow-ups, [] for research.\n\n    A deck size typed into the message (\"..., 15 hooks\") and a recency phrase (\"this\n    month\", \"last week\") set the run's count and posted_within_days; the count argument\n    sets the deck size when the message states none. Asked to make one of\n    the conversation's hooks yours for a niche (\"make hook 2 mine for dentists\"), the turn\n    writes lines from that hook's structure (1 credit, like remix_hook) and answers them\n    labelled, the full result under \"remix\".\n\n    language and country select the search locale: omitted or null keeps the current\n    conversation setting; a value sets it for this and later turns; an empty string\n    clears it to any language / any country. The picker wins over the message's locale;\n    replies stay in the language the person writes in. Invalid locale: 422 invalid_request.\n\n    message is 1 to 4000 characters. Pass conversation_id from an earlier turn to keep\n    the context; leave it out to start a conversation. Cost: a turn itself is free but is\n    a model call, so turns are limited per account per hour (429 rate_limited); a turn\n    that starts a run reserves credits like find_hooks. Next step: on \"research\", call\n    get_run with run.run_id and wait_seconds=50. Errors: 503 model_unavailable when the\n    model is down (nothing charged, try again), 402 insufficient_credits. For direct\n    research without the question step, call find_hooks instead. Needs the write\n    permission, and research for a turn that starts a run (403 insufficient_scope, nothing\n    reserved).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "conversation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Conversation Id"
              },
              "count": {
                "anyOf": [
                  {
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "how many hooks a run this turn starts should deliver, 1 to 30; a size typed into the message (\"15 hooks\") wins over it, and it wins over the turn's own guess; null or omitted lets the turn decide. Fewer hooks is a faster, cheaper run",
                "title": "Count"
              },
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "optional: only clips from creators in this country, as an assigned ISO 3166-1 alpha-2 code: MA, EG, BR, US (UK is read as GB). For a region that is not a country, send its country's code and name the regional variety in language: Quebec is country CA with language \"Quebec French\", Flanders BE with \"Flemish\", Catalonia ES with \"Catalan\". The country places the TikTok search there; the language judge does the regional filtering, and Instagram reports no country. A country alone does not restrict the language. For chat, omitted or null keeps the conversation's current setting; a value sets it for this and later turns; the empty string clears it back to any language / any country.",
                "examples": ["MA"],
                "pattern": "^[A-Za-z]{2}$",
                "title": "Country"
              },
              "idempotency_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "retry safely: a turn that started a run with this key within 24 hours answers that run again, no model call, nothing reserved",
                "title": "Idempotency Key"
              },
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "optional, up to 60 characters: only clips spoken or written in this language or dialect, in words or as a tag: \"Moroccan Darija\", \"ar-MA\", \"Egyptian Arabic\", \"Brazilian Portuguese\". Any language works, including a regional variety (\"Quebec French\", \"Flemish\", \"Catalan\") and a mixed, code-switched one (\"Hinglish\", \"Taglish\", \"Moroccan Darija with French\"), or two joined by \"or\" (\"Tagalog or Taglish\"). The value is handed to the judges exactly as written; how well they honour a mixed or either-of value is not measured yet. Saying it inside topic works too; this field wins when both are given. For chat, omitted or null keeps the conversation's current setting; a value sets it for this and later turns; the empty string clears it back to any language / any country.",
                "examples": ["Moroccan Darija"],
                "maxLength": 60,
                "title": "Language"
              },
