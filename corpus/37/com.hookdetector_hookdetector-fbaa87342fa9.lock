          "description": "The index: every video your long and packaging runs found, across all runs, one\n    entry a video on each tab (its newest read, with the keep or reject made on the\n    video). Each is a full find object: the title and thumbnail_url as YouTube shows them,\n    views, channel_median_views, outlier (views over the channel's usual) and\n    outlier_score (0 to 100 on one fixed scale, so entries from different runs rank\n    together), plus the analysis its run wrote. q (at most 120 characters) looks in the\n    title, the channel, the hook as it was said, and what the thumbnail prints and shows,\n    so a package can be found by its thumbnail (\"red arrow\", \"before and after\"). Returns\n    {\"finds\", \"count\", \"total\" (every match, on any page), \"next_cursor\"}; pass\n    next_cursor as cursor for the next page. Use it to search what you already paid for\n    before starting a new run. Same as GET /v1/finds. Free. Errors: 422 for a kind, sort,\n    tier, min_score, device or q that is not allowed. The bounds min_multiple to language\n    (T3-FL) narrow the index on the server, as on GET /v1/finds; an entry that does not\n    carry a bounded field is left out.",
