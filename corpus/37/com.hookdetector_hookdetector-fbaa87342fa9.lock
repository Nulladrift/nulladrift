      "serverInfo": {
        "name": "hookdetector",
        "title": "Hook Detector",
        "version": ""
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Find short-form hooks that already work. Call create_account once, with your beta access code as access_code (no code yet: request_access), to get an api_key, then send it as the header 'Authorization: Bearer hd_...' or pass it as the api_key argument. find_hooks starts a run that takes about 2 to 3 minutes (up to about 5 on a dialect request); then call get_run with wait_seconds=50 until status is done or failed (usually 3 or 4 calls, up to 6 on a dialect). Pass an idempotency_key to find_hooks so a retry never starts a second run. A run's hooks are people talking on camera. export_run turns a finished run into CSV, JSON or Markdown. Two more kinds of run work the same way, on long-form YouTube only: find_long_hooks returns how the videos that beat their own channel open (the first minute, verbatim, and why it holds), and find_packaging their titles and thumbnails, what those share, and written ideas for your topic; poll both with get_run, and their results are the run's finds (get_run, then keep_find). Every error's whole text is JSON {\"error\": {\"code\": <HTTP status>, \"message\", \"error_code\"}}, plus \"errors\" with each field's loc on a 422; branch on error_code. A key holds some of four permissions (read, write, research, admin); a call it lacks is 403 insufficient_scope. Full guide: GET /llms.txt; the whole manual as one file: GET /docs.md.",
