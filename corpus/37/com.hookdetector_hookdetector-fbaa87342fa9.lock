        {
          "name": "get_run",
          "description": "A research run: its status, progress, charge and every hook it produced.\n\n    wait_seconds 0 to 50: wait up to that long for the run to finish, returning the\n    moment it is done or failed. Use wait_seconds=50 and call again while status is\n    \"queued\" or \"running\"; a fresh run needs about 3 or 4 such calls. progress has\n    stage, message and updated_at, plus counts once the research reports them, preview\n    (hooks written so far) while a running run holds one, and feed (the live research\n    wall: up to 24 clips the run is working on, newest first, each key, platform, creator,\n    views, state found|reading|talking|passed, thumb_url, a JPEG any <img> can load\n    with no key, and line, the banner or opening words once the judges passed the clip)\n    while it shows one, and on a Long form or Packaging run scan (the videos it is looking\n    at: up to 60 tiles {v: YouTube video id, s: found|on_topic|off_topic|measured|beat|\n    reading|ready|passed, x: multiple of the channel's usual or null}, oldest first, and\n    lanes with found, on_topic, measured, beat, reading, ready; draw a tile from\n    https://i.ytimg.com/vi/{v}/mqdefault.jpg; counts.measured and counts.beat are the\n    numbers report.landscape ends on). Pass since with the last\n    progress.updated_at to return on change or completion. It must be an ISO timestamp\n    with a timezone (422 invalid_request otherwise). `hooks` is the deck (a person\n    talking); `bonus` is always [] (removed 2026-10-08). Every hook has format and\n    section (always \"main\"), and\n    creator_country (TikTok only), place and place_country (null when unknown), banner\n    (the title placed on the video, null when none) and match (\"exact\" or \"close\", a\n    close match being a neighbouring subject delivered after the exact ones; null on runs\n    with no language or country and on older hooks). Since 2026-10-04 the run carries\n    understood (what the request was read to ask: subject, language, country, core,\n    audience, neighbours, styles, style_other, wants; null until read) and, on a run that\n    asked for a kind of opening (\"controversial hooks\", \"storytime\"), every hook carries\n    style_match (true when it opens that way; null otherwise). Since 2026-10-01 every hook carries\n    the virality v2 fields: virality (0 to 1 on one fixed scale since 2026-10-02),\n    virality_why, outlier, outlier_basis, creator_median_views, posted_at, age_days,\n    views_per_day, duration_s, paid, sound_reuse, own_sound, hashtags (null on older\n    hooks), and since 2026-10-02 the analysis: hook_type, hook_type_other, mechanism,\n    visual_hook, audience, template, steal_it; the run echoes posted_within_days and\n    seed_hook_ids, and once done carries\n    patterns: up to 3 hook structures winning in this deck, each name, template, why,\n    hook_ids and count, grouped by hook_type and computed before the run is done, in the\n    deck's language (null on older runs and when nothing is shared). Hooks include\n    transcript_kind:\n    speech, music, none, other, or null when unknown; and heard: false when our speech\n    service could not hear the clip right now (no spoken words shown, transcript null; the\n    done message then counts them), true otherwise. conversation_id names the chat conversation the run\n    belongs to (null outside one). A done run with fewer hooks than asked for, or none,\n    has outcome: why in one plain paragraph, what to try next, and whether it was free\n    (stats.rejections holds the counts); a full run's outcome is null, or one sentence\n    when some hooks are under the view floor because the country filter set clips aside.\n    Free: reading a run costs no credits.\n    ",
          "inputSchema": {
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "run_id": {
                "title": "Run Id",
                "type": "string"
              },
              "since": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Since"
              },
              "wait_seconds": {
                "default": 0,
                "description": "0 to 50: seconds to wait for the run to finish; 0 returns at once",
                "maximum": 50,
                "minimum": 0,
                "title": "Wait Seconds",
                "type": "integer"
              }
            },
            "required": ["run_id"],
            "title": "get_runArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_runOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d6901524916d1187998b7b3a52af49b7c74f0a8b0ac1065f9d2520ddd3d1031"
