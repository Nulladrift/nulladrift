          "description": "Create another API key on your account, for example one per agent or machine, so\n    you can revoke one without touching the others. name is up to 60 characters.\n\n    Give the key only what it needs. scopes: any of \"read\" (read runs, hooks, keeps,\n    usage), \"write\" (keep, reject, undo, chat), \"research\" (start runs, which spend\n    credits), \"admin\" (manage keys, delete the account); all four when left out. An agent\n    that finds hooks needs [\"read\", \"write\", \"research\"]. credit_limit: the most credits\n    runs started with this key may spend over its life, 1 to 100000 (a run then reserves\n    at most what is left). expires_in_days: 1 to 365; the key then stops working (401\n    key_expired).\n\n    The new key is in this result once and never again: store it now. Needs admin. An\n    account holds at most 10 active keys (409 beyond) and may create 20 per hour by\n    default (429 beyond). Free.\n    Next step: use the returned api_key; revoke old ones with revoke_key.\n    ",
          "inputSchema": {
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "credit_limit": {
                "default": null,
                "minimum": 1,
                "title": "Credit Limit",
                "type": "integer"
              },
              "expires_in_days": {
                "default": null,
                "minimum": 1,
                "title": "Expires In Days",
                "type": "integer"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Name"
              },
              "scopes": {
                "default": null,
                "items": {
                  "enum": ["read", "write", "research", "admin"],
                  "type": "string"
                },
                "minItems": 1,
                "title": "Scopes",
                "type": "array"
              }
            },
            "title": "create_keyArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
