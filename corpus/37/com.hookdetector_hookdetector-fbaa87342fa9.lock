        {
          "name": "find_hooks",
          "description": "Start hook research on a topic across TikTok, Instagram and YouTube Shorts (Shorts\n    only, never long-form YouTube; platform \"youtube\"). platforms (since 2026-10-10, any of\n    \"tiktok\", \"instagram\", \"youtube\"; all three when left out) searches and delivers only\n    those: [\"instagram\"] is Instagram reels only.\n\n    What it does: searches both platforms, reads what each clip says and shows, and\n    returns ranked hooks. Each hook has its verbatim opening line, most quotable line,\n    main idea, why it travelled, topic, on-screen text, full transcript, a watch link and\n    a vertical player_url (9:16 iframe).\n\n    Talking heads only (since 2026-09-29): `hooks` holds only clips where a person on\n    camera is talking (talking head, podcast, interview). A clip where nobody talks is\n    dropped; Bonus was removed on 2026-10-08 and `bonus` is always []. Every hook carries\n    format (talking_head, podcast, interview, stage; null on older hooks) and section\n    (always \"main\"). A run that finds fewer talking heads than count says so in outcome;\n    it never fills hooks with clips that do not talk.\n\n    Where it comes from (since 2026-09-30): every hook has creator_country (ISO alpha-2\n    of the creator's TikTok account; always null on Instagram, which states none), place\n    (the place the creator tagged, or null) and place_country (that place's country when\n    the platform states it). Never guessed.\n\n    Banner (since 2026-09-30): every hook has banner, the title-style text the creator\n    placed on the video to hook the viewer, verbatim (at most 200 characters), or null\n    when it has none; subtitles are never a banner. onscreen_text keeps all text read.\n\n    Match (since 2026-09-30, runs with a language or country): every hook has match,\n    \"exact\" when the clip is about the subject itself or \"close\" when it is about a\n    neighbouring subject with the same intent (a close match, delivered after every exact\n    match; label it as one); null on runs with no language or country and on older hooks.\n\n    Analysis (since 2026-10-02): every hook carries hook_type (curiosity_gap,\n    contrarian_claim, specific_number, identity_callout, stakes_threat, promise_payoff,\n    pattern_interrupt, story_open, question, direct_command, other with hook_type_other),\n    mechanism (why the opening stops the scroll, quoting the clip; why_it_travelled holds\n    the same text), visual_hook, audience, template and steal_it; null on older hooks.\n\n    Virality v2 (since 2026-10-01): the deck is ranked by virality (0 to 1, since\n    2026-10-02 on one fixed scale, the same clip scoring the same in every run), built from outlier (views over the creator's usual views per video,\n    creator_median_views, with outlier_basis saying how it was measured), freshness\n    (posted_at, age_days, views_per_day), travel (shares and saves per 1,000 views),\n    own_sound and sound_reuse, and a paid penalty; virality_why names the strongest\n    signal in one line. Every hook also carries duration_s and hashtags. Null on older\n    hooks. posted_within_days (7, 30, 90 or 365) keeps the search to recent clips (a clip\n    under 7 days old passes the floor at 10,000 views a day). seed_hook_ids (up to 10 of\n    your hooks, for example kept ones) means \"find more like these\": their lines, topics,\n    creators and languages steer the search, and a seed is never delivered again. A done\n    run carries patterns: up to 3 hook structures winning in the deck (name, template,\n    why, hook_ids, count), computed after delivery; null until then. remix_hook writes\n    lines from one hook's structure for your niche (1 credit).\n\n    Arguments: topic is 3 to 500 characters, count 1 to 30 (default 10). Instructions\n    inside the topic are fine: only the subject read out of it is searched. reuse=true\n    (default) starts from clips you already paid for on the same topic, so a rerun is\n    close to free and often finishes in seconds. idempotency_key: any string up to 255\n    characters; the same key within 24 hours returns the first run instead of starting\n    and paying for a second one, so always pass one and reuse it when you retry.\n    wait_seconds 0 to 50: 0 returns the run_id at once; above 0 waits for the run and\n    returns the run object, as get_run does.\n\n    Any language, dialect or country: language is optional free text up to 60 characters\n    naming the language or dialect every clip must be in (\"Moroccan Darija\", \"ar-MA\",\n    \"Egyptian Arabic\", \"Brazilian Portuguese\"); country is an optional ISO 3166-1 alpha-2\n    code for where the creators are (MA, EG, BR). Saying it inside topic works too; these\n    fields win when both are given. A country alone does not restrict the language. Each\n    hook reports the language it was judged to be in.\n\n    A region that is not a country: send its country's code and name the regional variety\n    in language (Quebec: country \"CA\", language \"Quebec French\"; Flanders: \"BE\" and\n    \"Flemish\"; Catalonia: \"ES\" and \"Catalan\"). The country places the TikTok search there\n    and the language judge does the regional filtering; Instagram reports no country.\n    language may name a mixed, code-switched variety (\"Hinglish\", \"Taglish\", \"Moroccan\n    Darija with French\") or two joined by \"or\" (\"Tagalog or Taglish\"); it reaches the\n    judges exactly as written, and how well they honour such a value is not measured yet.\n\n    Cost: reserves up to 200 credits up front (less if your balance is smaller, down to\n    40) and charges only what it used; the rest is refunded. A failed run costs nothing,\n    and so does a run that finds no hooks, within a per-account allowance (llms.txt has\n    the numbers; its outcome says which applied).\n\n    Timing and next step: a fresh run takes about 2 to 3 minutes, up to about 5 when the\n    language is a dialect. Call get_run with wait_seconds=50 repeatedly until status is\n    \"done\" or \"failed\", which is usually 3 or 4 calls (up to 6 on a dialect request). Watch progress.stage and progress.message meanwhile.\n\n    Needs a key with the research permission (403 insufficient_scope otherwise). A key\n    with a credit_limit reserves at most what is left of it; under the minimum it is 403\n    key_credit_limit_reached and nothing is reserved.\n    ",
          "inputSchema": {
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "conversation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "attach the run to one of your conversations",
                "title": "Conversation Id"
              },
              "count": {
                "default": 10,
                "description": "how many hooks to deliver, 1 to 30",
                "maximum": 30,
                "minimum": 1,
                "title": "Count",
                "type": "integer"
              },
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "optional: only clips from creators in this country, as an assigned ISO 3166-1 alpha-2 code: MA, EG, BR, US (UK is read as GB). For a region that is not a country, send its country's code and name the regional variety in language: Quebec is country CA with language \"Quebec French\", Flanders BE with \"Flemish\", Catalonia ES with \"Catalan\". The country places the TikTok search there; the language judge does the regional filtering, and Instagram reports no country. A country alone does not restrict the language.",
                "examples": ["MA"],
                "pattern": "^[A-Za-z]{2}$",
                "title": "Country"
              },
              "idempotency_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "1 to 255 visible ASCII characters; the same key within 24 hours returns the first run instead of paying for a second",
                "title": "Idempotency Key"
              },
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "optional, up to 60 characters: only clips spoken or written in this language or dialect, in words or as a tag: \"Moroccan Darija\", \"ar-MA\", \"Egyptian Arabic\", \"Brazilian Portuguese\". Any language works, including a regional variety (\"Quebec French\", \"Flemish\", \"Catalan\") and a mixed, code-switched one (\"Hinglish\", \"Taglish\", \"Moroccan Darija with French\"), or two joined by \"or\" (\"Tagalog or Taglish\"). The value is handed to the judges exactly as written; how well they honour a mixed or either-of value is not measured yet. Saying it inside topic works too; this field wins when both are given.",
                "examples": ["Moroccan Darija"],
                "maxLength": 60,
                "title": "Language"
              },
              "platforms": {
                "default": null,
                "description": "since 2026-10-10: optional, which platforms to search and deliver from, a non-empty list of \"tiktok\", \"instagram\" and \"youtube\" (YouTube Shorts); left out (or all three) searches all three. [\"instagram\"] delivers Instagram reels only. Names are read without regard to case and a repeat counts once; an empty list or any other name is 422 naming platforms. The run echoes it as `platforms`.",
                "examples": [
                  ["instagram"]
                ],
                "items": {
                  "enum": ["tiktok", "instagram", "youtube"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "title": "Platforms",
                "type": ["array", "null"],
                "uniqueItems": true
              },
              "posted_within_days": {
                "default": null,
                "description": "since 2026-10-01: optional, how recent the clips must be, as days: 7, 30, 90, 365. The search asks the platforms for that window and the floor for a clip under 7 days old uses views per day (10,000 a day passes); null or left out means any time. A clip's `posted_at` and `age_days` say what the run found.",
                "enum": [7, 30, 90, 365, null],
                "examples": [30],
                "title": "Posted Within Days",
                "type": ["integer", "null"]
              },
              "reuse": {
                "default": true,
                "description": "start from clips you already paid for",
                "title": "Reuse",
                "type": "boolean"
              },
              "seed_hook_ids": {
                "default": null,
                "description": "since 2026-10-01: optional, up to 10 hook ids from your runs (a kept hook from GET /v1/keeps, or any hook you can read): \"find more like these\". The engine reads their lines, topics, creators and languages to steer the search phrases and the creators it expands; a seed is never delivered again. An id that is not one of your hooks is 422.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 10,
                "title": "Seed Hook Ids",
                "type": ["array", "null"],
                "uniqueItems": true
              },
              "topic": {
                "description": "what the clips are about, 3 to 500 characters. Instructions inside it are fine: a long topic, or one with a language or country, is searched by the subject read out of it, never verbatim.",
                "examples": ["short term rental tax strategy"],
                "maxLength": 500,
                "minLength": 3,
                "title": "Topic",
                "type": "string"
              },
              "wait_seconds": {
                "default": 0,
                "description": "0 to 50: seconds to wait for the run to finish; 0 returns at once",
                "maximum": 50,
                "minimum": 0,
                "title": "Wait Seconds",
                "type": "integer"
              }
            },
            "required": ["topic"],
            "title": "find_hooksArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "find_hooksOutput",
