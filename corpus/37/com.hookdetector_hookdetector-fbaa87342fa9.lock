              },
              "idempotency_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "1 to 255 visible ASCII characters; the same key and request within 24 hours answer the saved remix and charge nothing; the same key with another request is 422 idempotency_key_reused",
                "title": "Idempotency Key"
              },
              "mode": {
                "default": null,
                "description": "optional: \"openings\" (the default) writes openings or packages for a niche; \"intro\" is Write my intro: your own timed intro for the video you describe in video_brief, in this long-form opening's structure. Only a long find has an intro (a packaging find is 422); niche and n are not used in intro mode",
                "enum": ["openings", "intro", null],
                "examples": ["intro"],
                "title": "Mode",
                "type": ["string", "null"]
              },
              "n": {
                "default": null,
                "description": "how many to write, 1 to 5 (default 3)",
                "maximum": 5,
                "minimum": 1,
                "title": "N",
                "type": "integer"
              },
              "niche": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
