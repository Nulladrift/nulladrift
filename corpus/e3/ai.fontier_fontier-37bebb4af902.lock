{
  "lockfileVersion": 2,
  "subjects": {
    "ai.fontier/fontier": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fontier.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fontier.ai",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Fontier is a type library for agents: every open-licence family on Google Fonts, Fontsource and Fontshare (2168), each with a sourced licence ruling and facts measured from the font file. Use search_fonts to find fonts by mood, use or category (pass uses to keep only fonts that are a plain yes for commercial, web or app use; pass sort \"size\" and text_only for the lightest fonts for a fast site), get_font for the full record (measured cap height, x-height, stem, glyphs, languages, WOFF2 bytes per weight, what a phone and Windows download for Regular and Bold, fallback CSS) and pairings, check_font_license for a yes, no, conditional or unknown answer on one use (use \"logo\" for whether it can set a logo you own and register), pair_fonts for the fonts real websites load with one, and best_fonts_for_use for the ranked, measured fonts for a resume, tattoo, logo, wedding, handwriting with the licence lines that matter for it. Quote the licence source and say the answer is a reading of the licence text, not legal advice. Cite the font's url (https://fontier.ai/specimen/<slug>).",
      "tools": [
        {
          "name": "best_fonts_for_use",
          "title": "Best fonts for a use",
          "description": "Use this when someone asks for the best font for a resume, tattoo, logo, wedding, handwriting (\"best font for a resume\", \"a tattoo script\", \"a logo font I can trademark\", \"wedding invitation fonts\", \"a handwriting font\"). Returns our picks with why, then the most used fonts of each style ranked and measured for that use, every one a plain yes for commercial use: resume: characters per line at 11 pt on US Letter and the size that looks as big as Arial 11 pt, plus the free twins of Calibri, Cambria, Arial and Times New Roman; tattoo, wedding, handwriting: stroke in mm at 1 cm capitals, lowercase share, languages (wedding serifs come with the text font real sites load them with); logo: stroke at favicon size, width, how many crawled home pages load it, and every licence's logo and trademark lines quoted with the sha256 of the file checked. Each row has its licence answers per use, css and url. Pass limit for longer lists.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Fonts per style list (default as on the page, at most 50; resume has 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "use": {
                "description": "resume, tattoo, logo, wedding, handwriting.",
                "enum": ["resume", "tattoo", "logo", "wedding", "handwriting"],
                "type": "string"
              }
            },
            "required": ["use"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:518dfec1cfdd0ab49ddd5811e522059ebb796ec3ffc3f75c31684d277a47980d"
        },
        {
          "name": "check_font_license",
          "title": "Check a font licence",
          "description": "Use this when someone asks \"can I use <font> for <use>\". Answers yes, no, conditional or unknown, with why, a verbatim quote from the licence, the source URL, a sha256 of the licence text checked and the date checked. Uses: commercial (Use it in commercial work: brand, marketing, products you sell.); web (Serve it on your own website with @font-face, self-hosted or from a CDN.); app (Bundle it inside your own mobile or desktop app.); platform (Offer it to your users as a font they can pick in your product (site builders, design tools, templates).); modify (Change the files: subset, convert formats, edit glyphs.); logo (Set a logo or wordmark in it, and own and register that logo.). For logo, quotes holds the licence's lines on logos and on trademarks (trademarkQuote, or trademarkNote when the licence is silent), and quotesCheckedIn names the licence file, by sha256, the quotes were found in verbatim. Omit use to get all of them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "font": {
                "description": "Slug or family name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "use": {
                "description": "One use; omit for all.",
                "enum": ["commercial", "web", "app", "platform", "modify", "logo"],
                "type": "string"
              }
            },
            "required": ["font"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61fdc9a5a8c0be82bd4d5e996f934990fcdf5fce3412fae07cac5088fd370597"
        },
        {
          "name": "get_font",
          "title": "Get a font",
          "description": "Use this for everything about one font: foundry, designers, live version and weights, the CSS URL to load it, facts measured from the font file (cap height, x-height, average width and stem in em, glyph count, scripts, languages, OS/2 embedding bits, WOFF2 bytes per weight, webBytes: what its own CDN sends an iPhone and Windows Chrome for Latin Regular and Regular plus Bold, and fallback @font-face overrides that stop layout shift), the licence ruling for every use with the source and a verbatim quote, how many Y Combinator startup home pages load it (startups), and for hand-reviewed fonts an assessment, tags and pairings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "font": {
                "description": "Slug or family name, e.g. \"satoshi\" or \"EB Garamond\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["font"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b4b2a3f436a88e2d84ec3939681e87c72a545785ee33bc7c9840d3844272604"
        },
        {
          "name": "pair_fonts",
          "title": "Fonts real sites pair with one",
          "description": "Use this when someone asks what font goes with a font (\"what pairs with Avenir\", \"a body font for Montserrat\"). Returns the fonts that real websites load with it, counted on a crawl of the home pages of the top sites in one pinned Tranco list: sites loading both, share, lift over chance, example domains, each open partner's licence answers, and the size that lines up both x-heights when both fonts are measured. Works for commercial fonts too (Avenir, Proxima Nova).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "font": {
                "description": "Slug or family name, e.g. \"avenir-next\" or \"Montserrat\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["font"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b01c8a4812f0b2ccef2972c873424bd5eccbae700a7765dce05aaf79cc85354"
        },
        {
          "name": "search_fonts",
          "title": "Search fonts",
          "description": "Use this to find fonts for a project: by mood or use (\"warm editorial serif\", \"code\", \"geometric branding\"), category, or licence. uses keeps only fonts whose answer is a plain yes for every use listed, e.g. [\"commercial\",\"web\",\"app\"]. For \"which font loads fastest\" pass sort \"size\" (lightest first by the WOFF2 bytes a phone downloads for Latin Regular and Bold from the font's own CDN) and text_only true (sans, serif or mono text faces, no themed or script faces). Every word must match; when no font matches them all, the fonts matching the most words come back and match.all is false with a note. Returns short rows with each use answer, bytes (phone and windows, regular and regularBold) and a url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "sans, serif, mono, display, handwriting, icons.",
                "enum": ["sans", "serif", "mono", "display", "handwriting", "icons"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many results, to page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Free text: a family, mood, tag or use. Empty lists everything.",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "description": "relevance (default) or size: lightest first by phone bytes for Regular and Bold.",
                "enum": ["relevance", "size"],
                "type": "string"
              },
              "text_only": {
                "description": "Only fonts that work as a site's text font: sans, serif or mono, Latin-1 letters, Google's text style tags.",
                "type": "boolean"
              },
              "uses": {
                "description": "Uses that must be a plain yes: commercial, web, app, platform, modify.",
                "items": {
                  "enum": ["commercial", "web", "app", "platform", "modify"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bf02f0225889abcd070007035fca3b8171194d1789247c8bcf945a355e262c9"
        }
      ],
      "digest": "sha256:8435fdf1bf6ea48087f8699c4d03795b150fffca0a4b1a3066c2e721705641ae"
    }
  }
}
