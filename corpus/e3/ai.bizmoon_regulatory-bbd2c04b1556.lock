            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:817e8240d8c463293a1e980632c5e3c362185fdc5145d0a5be6bb5699f74198d"
        },
        {
          "name": "list_jurisdictions",
          "title": "List covered jurisdictions",
          "description": "List every jurisdiction and official register Bizmoon monitors, with the most recent publication date, and when the source was last checked. Call this first to learn coverage and freshness.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
