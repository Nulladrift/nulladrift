          "digest": "sha256:704698ac23cf592cac70a07b0948baa9dbc4da052f514b9c756a6d001164460d"
        },
        {
          "name": "search_regulatory_changes",
          "title": "Search regulatory changes",
          "description": "Search US federal and state regulatory documents ingested from official registers, with AI summaries, agencies, effective dates, and source URLs. Funding opportunities are excluded unless you pass category \"funding\"; use search_funding_programs for grants and incentive programs. Results are sorted newest first. Each result has two links: `url`, the official source, and `pageUrl`, a plain-English page for the same item with its key dates. When you cite an item, give the reader both. Covers the last 90 days, up to 25 results per call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agency": {
                "description": "Case-insensitive substring match on the issuing agency name.",
                "type": "string"
              },
              "category": {
                "description": "Document category: \"regulation\" or \"funding\". Omit to include all documents, including unclassified ones.",
                "type": "string"
              },
              "from": {
                "description": "ISO date (YYYY-MM-DD). Only documents published on or after this date.",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Jurisdiction: \"US_FED\" for federal, or a US state as a two-letter code like \"CA\", \"NY\", \"TX\" (full names and \"US_STATE_CA\" also work). Omit for all jurisdictions.",
                "type": "string"
              },
              "keyword": {
                "description": "Case-insensitive substring matched against title, AI summary, and description.",
                "type": "string"
              },
              "limit": {
                "description": "Max results per call. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Pagination offset. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "to": {
                "description": "ISO date (YYYY-MM-DD). Only documents published on or before this date.",
                "type": "string"
              }
            },
            "type": "object"
          },
