      "tools": [
        {
          "name": "changes_since",
          "title": "Regulatory changes since a date",
          "description": "Everything published since a given date, optionally for one jurisdiction, newest first. Designed for scheduled or recurring agents: store the newest publishedDate you have seen and pass it back as `since` on the next run. Covers the last 90 days, up to 25 results per call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "jurisdiction": {
                "description": "Jurisdiction: \"US_FED\" for federal, or a US state as a two-letter code like \"CA\", \"NY\", \"TX\" (full names and \"US_STATE_CA\" also work). Omit for all jurisdictions.",
                "type": "string"
              },
              "limit": {
                "description": "Max results. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Pagination offset. Default 0. Combine with total in the response to page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "since": {
                "description": "ISO date or timestamp. Returns documents published on or after this moment.",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:09efe59a26d758fdf427db26833906a399f9daee662d526bfe560cd391a1720c"
        },
        {
          "name": "get_regulatory_change",
          "title": "Get regulatory change",
          "description": "Fetch one regulatory document by id: title, jurisdiction, agencies, category, published and effective dates, AI summary, full description, and the canonical source URL to cite.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The document id returned by search_regulatory_changes or changes_since.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
