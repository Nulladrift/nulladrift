        {
          "name": "search_funding_programs",
          "title": "Search grants and funding programs",
          "description": "Search federal and state grant and incentive programs (grants.gov plus state economic development agencies) by keyword, jurisdiction, agency, and date. Each result includes a summary and the official program URL. Covers the last 90 days, up to 25 results per call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agency": {
                "description": "Case-insensitive substring match on the issuing agency name.",
                "type": "string"
              },
              "from": {
                "description": "ISO date (YYYY-MM-DD). Only documents published on or after this date.",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Jurisdiction: \"US_FED\" for federal, or a US state as a two-letter code like \"CA\", \"NY\", \"TX\" (full names and \"US_STATE_CA\" also work). Omit for all jurisdictions.",
                "type": "string"
              },
              "keyword": {
                "description": "Case-insensitive substring matched against title, AI summary, and description.",
                "type": "string"
              },
              "limit": {
                "description": "Max results per call. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Pagination offset. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "to": {
                "description": "ISO date (YYYY-MM-DD). Only documents published on or before this date.",
                "type": "string"
              }
            },
            "type": "object"
          },
