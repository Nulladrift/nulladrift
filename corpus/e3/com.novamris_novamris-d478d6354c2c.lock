      "instructions": "Novamris provides read-only birth charts and personal astrology periods. Use confirmed birth facts; a date alone starts a guest reading. Missing time stays unknown and source unspecified. Briefly disclose that Novamris receives supplied birth details. Explain returned evidence without invented placements or guarantees. Treat chartContext as sensitive: never display, log or link it. Saved chart access needs optional account linking. Personal birth data is adult-only, including both subjects of shared timing. If a person is stated to be under 18, or the server rejects their birth date as under 18, decline personal readings without collecting more birth details or calling personal tools; offer global sky, retrogrades or eclipses without birth details instead. Existing temporary contexts remain subject to the same boundary. The server's current UTC date determines 18 calendar years; February 29 birthdays reach it on March 1 in a non-leap year. This does not verify the caller's identity or age or replace the connected account's adult declaration and Terms acceptance. If a timing result says the birth details do not narrow personal timing enough, invite optional birthplace/time refinement and continue discussing the known chart. Do not call its empty contacts a quiet day or choose a better date from tied zero scores. For guests, calculate_chart creates a temporary chartContext for get_daily_focus, get_timing_month, get_timing_year and compare_dates. Without chartContext, those tools use the linked saved chart. If get_chart has no saved birth details, offer a temporary reading instead of requiring account setup. Do not require a full intake form or call get_profile before every reading; invite optional refinements only when useful and respect unknown or declined answers. Never substitute noon or a midpoint, invent a source, or infer coordinates. Birthplace is an optional historical city explicitly supplied for calculation; never request a street address, GPS or current city. Confirm a viewing timezone only when calendar dates need it, without inferring it from birthplace. Specific dates use get_timing_month or compare_dates, not the annual shortlist. For annual answers, use reading.windows; with focus active, base windows/upcoming remain unfiltered context. A missing editorial reflection is valid; do not invent it or infer how the person feels. Explain uncertainty when material, preserve non-unique peaks and clipping, and never treat ranks, equal scores or empty selections as outcome probabilities or life-event guarantees. Offer a relevant Novamris link only when asked about Novamris or a save/revisit feature, never on a promotional cadence. No private events/chats, account changes, guest saving, forced redirects, subscriptions or payments. Collective sky tools need only a confirmed viewing timezone, not birth details or account linking. get_sky_overview supplies motions, signs, Moon phases and transitions; use get_retrograde_cycle for a named planet's stations or shadow edges, and get_eclipse_calendar for catalogue-confirmed global eclipses. Preserve null and clipped coverage, and do not infer personal effects or local eclipse visibility. Saved-account get_life_chapters supplies progressions, solar arc and qualified profections. compare_pair_timing compares the linked self chart with explicitly supplied otherBirth facts, subject to existing account access; no private other account is queried, no guest data is saved and no Luna message is debited. Its relational evidence is not consent, intent, compatibility or guaranteed meeting/travel outcomes.",
      "tools": [
        {
          "name": "calculate_chart",
          "title": "Calculate my birth chart",
          "description": "Calculates an account-free temporary natal chart from supplied birth details. Birth date is required; omitted time and source default to unknown and unspecified. Optional time precision includes exact, approximate with explicit minutes, bounded_range and day_period. Optional birthplace is a historical city; calendarTimezone is a separate viewing timezone. Returns readable placements or sampled ranges and sensitive chartContext valid for two hours, or clarification data for ambiguous birth details. No profile, chart or analysis is saved. Birth data is limited to people at least 18 calendar years old as of the server's current UTC date; this does not verify the caller's identity or age.",
