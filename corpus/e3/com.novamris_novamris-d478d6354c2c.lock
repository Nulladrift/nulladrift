                            "type": "string"
                          },
                          "kind": {
                            "const": "bounded_range",
                            "type": "string"
                          },
                          "latestLocalTime": {
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d)?$",
