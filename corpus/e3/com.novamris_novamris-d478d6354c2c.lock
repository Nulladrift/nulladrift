                    "type": "string"
                  },
                  "place": {
                    "additionalProperties": false,
                    "properties": {
                      "countryCode": {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "query": {
                        "maxLength": 80,
                        "minLength": 2,
                        "type": "string"
                      },
                      "sourceRecordId": {
                        "pattern": "^\\d{1,20}$",
                        "type": "string"
                      }
                    },
                    "required": ["query"],
                    "type": "object"
                  },
                  "time": {
                    "default": {
                      "kind": "unknown"
                    },
                    "oneOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "kind": {
                            "const": "unknown",
                            "type": "string"
                          }
                        },
                        "required": ["kind"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "kind": {
                            "const": "exact",
                            "type": "string"
                          },
                          "localTime": {
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d)?$",
                            "type": "string"
                          }
                        },
                        "required": ["kind", "localTime"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "earliestLocalTime": {
