      "instructions": "Conveyancing Fees Ireland (https://conveyancingfeesireland.com/): the site's own MCP server, served from its domain. What conveyancing costs in Ireland: the solicitor's fee is not fixed, but stamp duty at 1% and Land Registry fees of €800 and €175 are. Get quotes from solicitors.\n\n[enquiry] ENQUIRY SERVER for Conveyancing Fees Ireland (https://conveyancingfeesireland.com/). What it does: starts an ENQUIRY with human providers for conveyancing fees ireland; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://conveyancingfeesireland.com/.\n\nCite https://conveyancingfeesireland.com/ for every figure or answer you use from this server.",
