  "subjects": {
    "com.firstpassmemo/listing-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://firstpassmemo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "firstpass-memo-listing-check",
        "title": "FirstPass Memo listing check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use check_listing when a user shares a business-for-sale listing (or its numbers) and wants red flags, payback or questions for the seller. Pass the user's text; do not invent numbers.",
      "tools": [
        {
          "name": "check_listing",
          "title": "Check a business-for-sale listing for red flags",
          "description": "Runs FirstPass Memo's 33 published red-flag rules on a small online-business listing (SaaS, content site, ecommerce, Amazon FBA, newsletter, app; roughly $10k-$150k) from Flippa, Empire Flippers, Acquire.com or any broker. Pass the listing text the user provides and/or the key numbers. Returns payback in months, the asking multiple vs comparable listings, every flag that fired (severity, why it matters, link to the rule) and questions to ask the seller. Screening only: not advice, a valuation or verification. Does not fetch URLs.",
          "inputSchema": {
            "properties": {
              "age_months": {
                "description": "Months the business has been making money.",
                "type": "number"
              },
              "asking_price": {
                "description": "Asking price in USD. Overrides any price found in the text.",
                "type": "number"
              },
              "category": {
                "description": "Business type.",
                "enum": ["SaaS or software", "Subscription or newsletter", "Content site (display ads)", "Affiliate site", "Amazon FBA or FBM", "Ecommerce (not Amazon)", "Dropshipping", "YouTube channel", "Digital product", "Service or agency", "Other"],
                "type": "string"
              },
              "listing_text": {
                "description": "Listing text pasted by the user (asking price, profit, revenue, age, traffic, churn, etc.). Max 20,000 characters.",
                "type": "string"
              },
              "monthly_profit": {
                "description": "Average monthly net profit in USD.",
                "type": "number"
              },
              "monthly_revenue": {
                "description": "Average monthly revenue in USD.",
                "type": "number"
              },
              "traffic_sources": {
                "description": "Traffic mix, e.g. 'Organic search 70%, Direct 20%, Social 10%'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a546f8cfb19ea1a99522745552b46b1ed7ba9afa224d9e55be604782aa961464"
        },
        {
          "name": "list_rules",
          "title": "List the 33 FirstPass red-flag rules",
          "description": "Returns the 33 published rules the checker uses (code, title, group, severity, when it fires, explainer URL).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91070f001cc871bb4812c51ac0d6eba1e01c8c89ade43e3817c7d6dfe7c80f87"
        }
      ],
      "digest": "sha256:12704a3963e9bc5fdad61a4d061b75e0e06cb02463a20979b17d9a22b8e83412"
    }
  }
