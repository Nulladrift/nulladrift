          "outputSchema": {
            "properties": {
              "canvas": {
                "properties": {
                  "card_count": {
                    "type": "number"
                  },
                  "cards": {
                    "items": {
                      "properties": {
                        "data": {
                          "description": "Per type. text: { text, title?, color? }. media: { url, kind, title?, caption?, source? }. generation: { model?, prompt?, kind, status (draft | queued | generating | done | failed), job_id?, media_url?, credits_used?, error? }. frame: { label, width, height }. task: { taskId }."
                        },
                        "height": {
                          "type": "number"
                        },
                        "id": {
                          "type": "string"
                        },
                        "position": {
                          "properties": {
                            "x": {
                              "type": "number"
                            },
                            "y": {
                              "type": "number"
                            }
                          },
                          "required": ["x", "y"],
                          "type": "object"
                        },
                        "type": {
                          "enum": ["text", "media", "generation", "frame", "task", "legacy"],
                          "type": "string"
                        },
                        "width": {
                          "type": "number"
                        }
                      },
                      "required": ["data", "id", "position", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "edges": {
                    "items": {
                      "description": "A connection drawn from one card to the next: { id, source, target, label? }. data.role start_image means the source card's finished image is the target card's start frame.",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "label": {
                          "description": "Text drawn on the line, when it has one."
                        },
                        "source": {
                          "description": "The card the connection starts from.",
