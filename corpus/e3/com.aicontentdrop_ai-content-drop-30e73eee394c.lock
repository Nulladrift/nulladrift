        {
          "name": "update_card",
          "title": "Update card",
          "description": "Change a card: merge fields into its data (text or title on a text card; prompt, model, kind, aspect_ratio, duration, resolution or image_url on a generation card; title or caption on a media card; label on a frame), or move and resize it. Costs no credits. status, job_id, job_kind, quote_id, media_url, thumbnail_url, credits_used and error are set by the server when a card runs and are refused here. A per-second model is priced from the card's duration and resolution, and run_generation_card checks its quote against them. SIGN-IN REQUIRED: connect this server with OAuth (the host prompts for it), or add an API key header \"Authorization: Bearer acd_live_…\" created at https://aicontentdrop.com/settings/integrations.",
          "inputSchema": {
            "properties": {
              "canvas_id": {
                "description": "The board id, from list_canvases or create_canvas.",
                "type": "string"
              },
              "card_id": {
                "description": "The card id, from cards[] on the board.",
                "type": "string"
              },
              "data": {
                "description": "Fields to merge into the card's data; fields not named are kept.",
                "type": "object"
              },
              "height": {
                "description": "Optional card height in pixels.",
                "type": "number"
              },
              "position": {
                "description": "Optional { x, y } in board pixels. When omitted the server places the card in the first free grid cell.",
                "properties": {
                  "x": {
                    "type": "number"
                  },
                  "y": {
                    "type": "number"
                  }
                },
                "required": ["x", "y"],
                "type": "object"
              },
              "revision": {
                "description": "The board revision this change is based on (from the last board you saw). Optional: when omitted the tool reads the current one first.",
                "type": "number"
              },
              "width": {
                "description": "Optional card width in pixels.",
                "type": "number"
              }
            },
            "required": ["canvas_id", "card_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "canvas": {
                "properties": {
                  "card_count": {
                    "type": "number"
                  },
                  "cards": {
                    "items": {
                      "properties": {
                        "data": {
                          "description": "Per type. text: { text, title?, color? }. media: { url, kind, title?, caption?, source? }. generation: { model?, prompt?, kind, status (draft | queued | generating | done | failed), job_id?, media_url?, credits_used?, error? }. frame: { label, width, height }. task: { taskId }."
                        },
                        "height": {
                          "type": "number"
                        },
                        "id": {
                          "type": "string"
                        },
                        "position": {
                          "properties": {
                            "x": {
                              "type": "number"
                            },
                            "y": {
                              "type": "number"
                            }
                          },
                          "required": ["x", "y"],
                          "type": "object"
                        },
                        "type": {
                          "enum": ["text", "media", "generation", "frame", "task", "legacy"],
                          "type": "string"
                        },
                        "width": {
                          "type": "number"
                        }
                      },
                      "required": ["data", "id", "position", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "edges": {
                    "items": {
                      "description": "A connection drawn from one card to the next: { id, source, target, label? }. data.role start_image means the source card's finished image is the target card's start frame.",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "label": {
                          "description": "Text drawn on the line, when it has one."
                        },
                        "source": {
                          "description": "The card the connection starts from.",
                          "type": "string"
                        },
                        "target": {
                          "description": "The card it leads to.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "id": {
                    "type": "string"
                  },
                  "link": {
                    "description": "The board's page on AI Content Drop.",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "revision": {
                    "description": "The board's version; every write bumps it.",
                    "type": "number"
                  }
                },
                "required": ["card_count", "cards", "edges", "id", "link", "name", "revision"],
                "type": "object"
              },
              "card": {
                "properties": {
                  "data": {
                    "description": "Per type. text: { text, title?, color? }. media: { url, kind, title?, caption?, source? }. generation: { model?, prompt?, kind, status (draft | queued | generating | done | failed), job_id?, media_url?, credits_used?, error? }. frame: { label, width, height }. task: { taskId }."
                  },
                  "height": {
                    "type": "number"
                  },
                  "id": {
                    "type": "string"
                  },
                  "position": {
                    "properties": {
                      "x": {
                        "type": "number"
                      },
                      "y": {
                        "type": "number"
                      }
                    },
                    "required": ["x", "y"],
                    "type": "object"
                  },
                  "type": {
                    "enum": ["text", "media", "generation", "frame", "task", "legacy"],
                    "type": "string"
                  },
                  "width": {
                    "type": "number"
                  }
                },
                "required": ["data", "id", "position", "type"],
                "type": ["object", "null"]
              },
              "next_step": {
                "type": "string"
              }
            },
            "required": ["canvas", "card", "next_step"],
            "type": "object"
          },
