            "properties": {
              "ad_id": {
                "description": "A saved ad's id, from list_saved_ads or save_competitor_ad.",
                "type": "string"
              },
              "canvas_id": {
                "description": "The board id, from list_canvases or create_canvas.",
                "type": "string"
              },
              "revision": {
                "description": "The board revision this change is based on. Optional: when omitted the tool reads the current one first.",
                "type": "number"
              }
            },
            "required": ["ad_id", "canvas_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ad": {
                "properties": {
                  "decoded": {
                    "description": "True when the card carries the decoded brief.",
                    "type": "boolean"
                  },
                  "id": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["decoded", "id", "title"],
                "type": "object"
              },
              "canvas": {
                "properties": {
                  "card_count": {
                    "type": "number"
                  },
                  "cards": {
                    "items": {
                      "properties": {
                        "data": {
                          "description": "For the placed ad: { url, kind, title, caption?, source: { kind: \"ad\", id }, brief? }."
                        },
                        "height": {
                          "type": "number"
                        },
                        "id": {
                          "type": "string"
                        },
                        "position": {
                          "properties": {
                            "x": {
                              "type": "number"
                            },
                            "y": {
                              "type": "number"
                            }
                          },
                          "required": ["x", "y"],
                          "type": "object"
                        },
                        "type": {
                          "enum": ["text", "media", "generation", "frame", "task", "legacy"],
                          "type": "string"
                        },
                        "width": {
                          "type": "number"
                        }
                      },
                      "required": ["data", "id", "position", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "edges": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "id": {
                    "type": "string"
                  },
                  "link": {
                    "description": "The board's page on AI Content Drop.",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "revision": {
                    "description": "The board's version; every write bumps it.",
                    "type": "number"
                  }
                },
                "required": ["card_count", "cards", "edges", "id", "link", "name", "revision"],
                "type": "object"
              },
