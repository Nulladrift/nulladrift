        {
          "name": "ad_to_canvas_card",
          "title": "Ad to board",
          "description": "Place a saved competitor ad on a board as a media card (its video or image, the advertiser as title, the hook as caption) with its decoded brief attached when it has one. Costs no credits. Returns the whole board and the new card. SIGN-IN REQUIRED: connect this server with OAuth (the host prompts for it), or add an API key header \"Authorization: Bearer acd_live_…\" created at https://aicontentdrop.com/settings/integrations.",
