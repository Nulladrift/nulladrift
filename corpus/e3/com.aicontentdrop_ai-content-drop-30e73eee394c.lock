        {
          "name": "add_generation_card",
          "title": "Add generation card",
          "description": "Add a draft generation card to a board: a prompt and a model (an id from list_models) that can be rendered later with run_generation_card. Adding it costs nothing; nothing renders until it is run with a quote. Set duration and resolution on the card for a per-second model: the quote for run_generation_card must be taken with them. For a step that builds on an earlier card (a still that becomes a video), pass from_card_id: the new card is connected to that card on the board and, unless it has its own image_url, starts from that card's finished image. SIGN-IN REQUIRED: connect this server with OAuth (the host prompts for it), or add an API key header \"Authorization: Bearer acd_live_…\" created at https://aicontentdrop.com/settings/integrations.",
          "inputSchema": {
            "properties": {
              "aspect_ratio": {
                "description": "Optional, e.g. 9:16, 16:9, 1:1.",
                "type": "string"
              },
              "canvas_id": {
                "description": "The board id, from list_canvases or create_canvas.",
                "type": "string"
              },
              "duration": {
                "description": "Optional clip length in seconds, for video models that price by duration.",
                "type": "number"
              },
              "from_card_id": {
                "description": "Optional: an image generation card or an image media card on the same board. The new card is connected to it, and its finished image is the new card's start frame when the new card runs (run the source card first).",
                "type": "string"
              },
              "height": {
                "description": "Optional card height in pixels.",
                "type": "number"
              },
              "image_url": {
                "description": "Optional public https reference image for image-to-video or image-to-image.",
                "type": "string"
              },
              "kind": {
                "description": "Defaults to video.",
                "enum": ["video", "image"],
                "type": "string"
              },
              "model": {
                "description": "A model id from list_models.",
                "type": "string"
              },
              "position": {
                "description": "Optional { x, y } in board pixels. When omitted the server places the card in the first free grid cell.",
