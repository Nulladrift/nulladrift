      "serverInfo": {
        "name": "com.clawhard/runsheet",
        "title": "Runsheet",
        "version": "1.1.0",
        "description": "Runsheet is a live day-of schedule (run of show) for weddings, shoots and conferences. Share one link with every vendor, shift the rest of the day when you run late, and everyone's schedule updates. No sign-up.",
        "websiteUrl": "https://runsheet.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Runsheet: Runsheet is a live day-of schedule (run of show) for weddings, shoots and conferences. Share one link with every vendor, shift the rest of the day when you run late, and everyone's schedule updates. No sign-up. Use it when you need a live schedule for a wedding, shoot or event day. Tools: runsheet_create_schedule (Create a live day-of schedule page). Results include a link (open_url) that the user can open to see the same result on the website. Share view links with the user. Never share an edit link publicly.",
      "tools": [
        {
          "name": "runsheet_create_schedule",
          "title": "Create a live day-of schedule page",
          "description": "Use when the user wants a shareable run-of-show or day-of schedule for a wedding, conference, shoot or other event that guests or crew can open on their phone and that updates live when edited. Creates the page and returns a view link to share with everyone and a private edit link to keep. Start from a template (wedding, conf, shoot, blank) or pass your own items. Example: {\"name\": \"Maya and Sam wedding\", \"date\": \"2026-09-12\", \"timezone\": \"America/New_York\", \"template\": \"wedding\"} or {\"name\": \"Offsite\", \"items\": [{\"time\": \"09:00\", \"title\": \"Welcome\", \"duration_minutes\": 30}]}. Each call creates a new saved page.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "items": {
                "description": "Schedule slots.",
                "items": {
                  "properties": {
                    "duration_minutes": {
                      "type": "integer"
                    },
                    "time": {
                      "description": "Start, 24-hour HH:MM",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "where": {
                      "type": "string"
                    },
                    "who": {
                      "description": "Vendors or roles on this slot",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["time", "title"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "name": {
                "description": "Event name.",
                "type": "string"
              },
              "template": {
                "description": "Starter schedule. Ignored if items are given.",
                "enum": ["wedding", "conf", "shoot", "blank"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone, e.g. America/New_York. Default UTC.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a live day-of schedule page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
