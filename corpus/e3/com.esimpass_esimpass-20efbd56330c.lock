{
  "lockfileVersion": 2,
  "subjects": {
    "com.esimpass/esimpass": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.esimpass.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "esimpass",
        "title": "eSIMpass",
        "version": "1.2.1",
        "websiteUrl": "https://www.esimpass.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "eSIMpass sells prepaid, data-only travel eSIMs for 200+ countries and regions. To help a traveller buy one: search_destinations -> get_plans (live prices) -> check_device if unsure -> create_checkout_link, then give them the link. You cannot complete payment: the traveller enters their email and pays at checkout. After paying, the traveller can give you the private eSIM link from the confirmation page; get_esim_install then returns one-tap install links for iPhone and Android. Quote only prices returned by get_plans, and for a regional plan check every country of the trip against its countries_covered list.",
      "tools": [
        {
          "name": "check_device",
          "title": "Check phone eSIM compatibility",
          "description": "Whether a phone model supports eSIM, from the models eSIMpass documents (Apple, Samsung, Google). The phone must also be carrier-unlocked; a model not in the list is not necessarily incompatible.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "device": {
                "description": "Phone model, e.g. \"iPhone 15 Pro\", \"Galaxy S24\", \"Pixel 8\".",
                "type": "string"
              }
            },
            "required": ["device"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aedeb9fc46229cbf177a2d90a89f0f7844a13af5b21af4456df22945e5d3cfd4"
        },
        {
          "name": "create_checkout_link",
          "title": "Create a checkout link",
          "description": "A checkout URL on esimpass.com with one plan already selected. It does not pay or place an order: the traveller opens it, enters their email and pays (card, Apple Pay, Google Pay, PayPal or crypto). Minutes later the confirmation page has an Install button (one tap on iPhone and Android), a QR code and a private eSIM link. Takes a plan name as get_plans returns it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 code to price in, e.g. \"EUR\", \"USD\", \"GBP\". Defaults to this site's currency.",
                "type": "string"
              },
              "destination": {
                "description": "The destination: a slug from search_destinations (\"esim-japan\", \"esim-europe\", \"esim-tokyo\") or its English name (\"Japan\").",
                "type": "string"
              },
              "partner_code": {
                "description": "Optional eSIMpass Partner Program code (letters and digits): the sale is credited to that partner.",
                "type": "string"
              },
              "plan": {
                "description": "The plan name from get_plans, e.g. \"7 Days - 3GB Data\" or \"Unlimited - 10 Days\".",
                "type": "string"
              },
              "quantity": {
                "description": "How many eSIMs (one per traveller). Default 1.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "travel_end": {
                "description": "Unlimited plans only, optional: last travel day, YYYY-MM-DD.",
                "type": "string"
              },
              "travel_start": {
                "description": "Unlimited plans only, optional: first travel day, YYYY-MM-DD. For some destinations the plan starts on this date.",
                "type": "string"
              }
            },
            "required": ["destination", "plan"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkout_url": {
                "format": "uri",
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "destination": {
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "plan": {
                "type": "string"
              },
              "quantity": {
                "type": "integer"
              },
              "total": {
                "type": "number"
              },
              "unit_price": {
                "type": "number"
              }
            },
            "required": ["checkout_url", "currency", "destination", "plan", "quantity", "total", "unit_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2298a701b2f90e752151ad30f984429709b056972360edc25fd81ed1b9d000d2"
        },
        {
          "name": "fetch",
          "title": "Fetch a destination (connector)",
          "description": "One destination as a document: plans, live prices and a checkout link per plan. The id comes from search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A destination id from search, e.g. \"esim-japan\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0df779574156c7f8d3e2b5cdae6bce90920cb921be92f4b335d68295f2d66d4f"
        },
        {
          "name": "get_esim_install",
          "title": "Install a purchased eSIM",
          "description": "After the traveller has paid: one-tap install links for their eSIM, for iPhone (iOS 17.4+) and Android (10+), plus the manual-entry codes. Takes the private eSIM link from the traveller's order confirmation page (https://www.esimpass.com/…/my-esim/…); any other value is refused. Each install link installs the eSIM when opened on the phone that will use it. The result is that traveller's private eSIM details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "esim_link": {
                "description": "The private eSIM link from the order confirmation page, or the token at its end.",
                "type": "string"
              }
            },
            "required": ["esim_link"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "esim_page": {
                "description": "The traveller's eSIM page: QR code and data usage.",
                "format": "uri",
                "type": "string"
              },
              "esims": {
                "items": {
                  "properties": {
                    "activation_code": {
                      "type": ["string", "null"]
                    },
                    "install_on_android": {
                      "format": "uri",
                      "type": ["string", "null"]
                    },
                    "install_on_iphone": {
                      "format": "uri",
                      "type": ["string", "null"]
                    },
                    "note": {
                      "type": "string"
                    },
                    "number": {
                      "type": "integer"
                    },
                    "smdp_address": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["install_on_android", "install_on_iphone", "number"],
                  "type": "object"
                },
                "type": "array"
              },
              "how_to": {
                "type": "string"
              },
              "ready": {
                "description": "false while the eSIM is still being prepared; try again in a minute.",
                "type": "boolean"
              }
            },
            "required": ["esim_page", "esims", "ready"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e71f844ff9390c3bf5330647abfe560f61e7ada1357473fccadaa63297c87331"
        },
        {
          "name": "get_plans",
          "title": "List plans and live prices",
          "description": "The plans on sale for one destination right now, with live prices, data, validity and the product page URL. For a regional plan it also lists every country covered; a country missing from that list is not covered. Prices and plans change, so these are the current ones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 code to price in, e.g. \"EUR\", \"USD\", \"GBP\". Defaults to this site's currency.",
                "type": "string"
              },
              "destination": {
                "description": "The destination: a slug from search_destinations (\"esim-japan\", \"esim-europe\", \"esim-tokyo\") or its English name (\"Japan\").",
                "type": "string"
              },
              "unlimited": {
                "description": "true for unlimited-data plans only, false for fixed-data plans only; omit for both.",
                "type": "boolean"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "countries_covered": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "currency": {
                "type": "string"
              },
              "destination": {
                "type": "string"
              },
              "plans": {
                "items": {
                  "properties": {
                    "currency": {
                      "type": "string"
                    },
                    "data_gb": {
                      "type": ["number", "null"]
                    },
                    "plan": {
                      "description": "Pass this to create_checkout_link.",
                      "type": "string"
                    },
                    "price": {
                      "type": "number"
                    },
                    "type": {
                      "enum": ["fixed-data", "unlimited"],
                      "type": "string"
                    },
                    "validity_days": {
                      "type": ["integer", "null"]
                    }
                  },
                  "required": ["currency", "data_gb", "plan", "price", "type", "validity_days"],
                  "type": "object"
                },
                "type": "array"
              },
              "product_page": {
                "format": "uri",
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["currency", "destination", "plans", "product_page", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91114806143e698b5c91010fba16b325a3778a2f4f0b6150758a19b01db77e47"
        },
        {
          "name": "search",
          "title": "Search (connector)",
          "description": "Search eSIMpass destinations by place name, in the shape ChatGPT connectors use. Returns ids that fetch takes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Place name.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9a967c5451ec0bfbd519569ad021b4cb865fe65f5301a958ddd2403546a0c98"
        },
        {
          "name": "search_destinations",
          "title": "Search eSIM destinations",
          "description": "Find the eSIMpass travel eSIM for a place: a country (\"Japan\"), a region (\"Europe\", \"Asia\", \"Global\") or a city (\"Tokyo\", which is covered by its country's plans). Returns matching destinations with the slug that get_plans and create_checkout_link take.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Place name, in English or the traveller's language.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4bc9d121a5e673497e3604c396bfc1c70495e320c8051a9ec0e39a009492df9b"
        }
      ],
      "digest": "sha256:e6a37b57d2b371a19bec48a57c6dc5d45f93e892622fee090aef4c91d72a741d"
    }
  }
}
