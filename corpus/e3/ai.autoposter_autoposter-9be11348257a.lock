        {
          "name": "autoposter_get_analytics",
          "title": "Get Analytics",
          "description": "Reads performance analytics. level 'posts' (default) returns per-post metrics (impressions, views, likes, comments, shares, clicks, ...) with totals for a date range or for one post. level 'accounts' returns the latest account-level snapshot (followers, reach, impressions, engagement, ...) per connected account, plus a daily series when from/to are given. Data is synced periodically, so very recent posts may have no metrics yet.",
          "inputSchema": {
            "properties": {
              "accountIds": {
                "description": "Limit to these accounts (IDs from autoposter_list_accounts).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "from": {
                "description": "Start date YYYY-MM-DD (inclusive). Default: 14 days before 'to'.",
                "type": "string"
              },
              "level": {
                "description": "'posts' (default) or 'accounts'.",
                "enum": ["posts", "accounts"],
                "type": "string"
              },
              "limit": {
                "description": "Max posts or series rows returned (default 20, max 50). Totals always cover all matches.",
                "type": "number"
              },
              "platform": {
                "description": "level 'posts' only: limit to one platform, e.g. 'instagram'.",
                "type": "string"
              },
              "postId": {
                "description": "level 'posts' only: return analytics for this post (from autoposter_list_posts).",
                "type": "string"
              },
              "to": {
                "description": "End date YYYY-MM-DD (inclusive). Default: today (UTC). Max range 90 days.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "accounts": {
                "description": "level 'accounts': latest snapshot (and series) per account.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "dateRange": {
                "description": "Applied from/to dates.",
                "type": "object"
              },
              "level": {
                "description": "'posts' or 'accounts'.",
                "type": "string"
              },
              "posts": {
                "description": "level 'posts': per-post metrics, newest first.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "level 'posts': post counts and summed metrics over successful rows.",
                "type": "object"
              }
            },
            "required": ["level"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["posts:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8c6fb91552ceb61a7f09d33a12303a3e2577cec538a262fab5655c8f76e4ab84"
        },
        {
          "name": "autoposter_get_media_upload_url",
          "title": "Get Direct S3 Upload URL",
          "description": "Only for clients that can perform an HTTP PUT or multipart POST (not chat-only clients such as Gemini): if you cannot make that request yourself, use autoposter_create_upload_link instead. Generates a presigned S3 upload URL for direct, high-speed upload of videos or images up to 5GB without size limits or timeouts. Returns direct PUT url, POST upload fields, and public CDN URL.",
          "inputSchema": {
            "properties": {
              "contentType": {
                "description": "MIME type of the media (e.g. 'video/mp4', 'image/jpeg', 'image/png').",
                "type": "string"
              },
              "fileName": {
                "description": "Name of the file including extension (e.g. 'promo_video.mp4', 'photo.jpg').",
                "type": "string"
              }
            },
            "required": ["contentType", "fileName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cdnUrl": {
                "description": "Public CDN URL after upload.",
                "type": "string"
              },
              "directPutUrl": {
                "description": "Presigned S3 PUT URL for direct upload.",
                "type": "string"
              },
              "instructions": {
                "description": "Instructions for completing the direct upload.",
                "type": "string"
              },
              "key": {
                "description": "S3 object key for the media file.",
                "type": "string"
              },
              "success": {
                "description": "Whether the upload URL was successfully created.",
                "type": "boolean"
              },
              "uploadPost": {
                "description": "Presigned POST fields if using multipart upload.",
                "type": "object"
              }
            },
            "required": ["cdnUrl", "directPutUrl", "key", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["posts:create"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b30ce82fcfac385be4029aa439b2a96a55131e53eb89f4eb0e633cc21afd85c3"
        },
