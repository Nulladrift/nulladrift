        },
        {
          "name": "autoposter_draft_post",
          "title": "Create Post Draft",
          "description": "Creates a draft post for human review. If API key lacks direct publish, post is saved as pending_approval and notifications are sent to workspace approvers. Accepts mediaUrls (public URLs) or files (client-supplied file objects up to 100MB). For large video files over 100MB, tell the user to provide a direct public file URL or use autoposter_get_media_upload_url.",
          "inputSchema": {
            "$defs": {
              "MediaFile": {
                "additionalProperties": false,
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "properties": {
              "accountIds": {
                "description": "List of account IDs from autoposter_list_accounts.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "content": {
                "description": "Base text content of the post.",
                "type": "string"
              },
              "files": {
                "description": "Optional client-supplied file objects to attach to the post.",
                "items": {
                  "$ref": "#/$defs/MediaFile"
                },
                "type": "array"
              },
              "firstComment": {
                "description": "Optional first comment posted on the post right after it publishes (e.g. links or hashtags). Supported on platforms with comment support such as X, Facebook, Instagram, LinkedIn, Threads, Bluesky, Mastodon, Telegram, Discord.",
                "type": "string"
              },
              "mediaIds": {
                "description": "Optional list of existing media IDs from workspace media library (from autoposter_list_media).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mediaUrls": {
                "description": "Optional public image or video URLs to attach (e.g. from autoposter_upload_media).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "platformContent": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Optional platform-specific content overrides (e.g. twitter, linkedin).",
                "type": "object"
              },
              "postType": {
                "description": "Optional target format where applicable: 'post' (default feed post/carousel), 'reel' (Instagram or Facebook Reel; requires video), 'story' (Instagram or Facebook 24h Story; requires image or video), or 'shorts' (YouTube Shorts; vertical video under 60s). Ignored on platforms without format variants.",
                "enum": ["post", "reel", "story", "shorts"],
                "type": "string"
              },
              "threadComments": {
                "description": "Optional thread: follow-up texts posted in order after publishing, each replying to the previous one. If firstComment is also set, these come after it. On X this makes a tweet thread.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Optional title. Used by YouTube, Pinterest and WordPress; ignored elsewhere.",
                "type": "string"
              },
              "visibility": {
                "description": "Optional audience for TikTok posts (default PUBLIC_TO_EVERYONE). Ignored on other platforms.",
                "enum": ["PUBLIC_TO_EVERYONE", "SELF_ONLY", "MUTUAL_FOLLOW_FRIENDS"],
                "type": "string"
              }
            },
            "required": ["accountIds", "content"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "draftPosts": {
                "description": "List of created draft posts per account.",
                "items": {
                  "properties": {
                    "accountName": {
                      "description": "Target account name.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Draft post ID.",
                      "type": "string"
                    },
                    "platform": {
                      "description": "Target social media platform.",
                      "type": "string"
                    },
                    "postType": {
                      "description": "Target format ('post', 'reel', 'story', or 'shorts').",
                      "type": "string"
                    },
                    "scheduledAt": {
                      "description": "Scheduled timestamp if any.",
                      "type": "string"
                    },
                    "status": {
                      "description": "Current post status (drafts or pending_approval).",
                      "type": "string"
                    }
                  },
                  "required": ["id", "platform", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "instructions": {
                "description": "Instructions for approving or viewing the draft.",
                "type": "string"
              },
              "message": {
                "description": "Status message indicating draft creation.",
                "type": "string"
              }
            },
            "required": ["draftPosts", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
