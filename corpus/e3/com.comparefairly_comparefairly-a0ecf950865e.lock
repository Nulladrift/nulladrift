  "subjects": {
    "com.comparefairly/comparefairly": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://comparefairly.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "comparefairly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "CompareFairly: universal, neutral, sourced comparisons. Search first, then get_comparison. Data localized by lang/country. Citation with a link is welcome; bulk scraping is rate-limited.",
      "tools": [
        {
          "name": "get_comparison",
          "description": "Fetch one full structured comparison (items with scores, sub-scores, per-criterion values, badges, sources, sourced/estimate flags, freshness). Neutral ranking, never paid. Data is localized to the requested lang/country.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "2-letter country code. Default: US.",
                "type": "string"
              },
              "lang": {
                "description": "2-letter language code. Default: en.",
                "type": "string"
              },
              "slug": {
                "description": "Comparison slug (from search_comparisons).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cd0cf645bfe2cdee10d3c2fcc75b308533e3a295191e1b8275a90481cc51be9"
        },
        {
          "name": "list_categories",
          "description": "List the top-level categories available for a market, with the number of comparisons in each.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "2-letter country code. Default: US.",
                "type": "string"
              },
              "lang": {
                "description": "2-letter language code. Default: en.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7e5e6e2fd8bc43a7a6513ea86fb6059bad2f5bca3ea682a140aab64d8832856a"
        },
        {
          "name": "search_comparisons",
          "description": "Search CompareFairly's catalog of neutral, sourced comparisons for a given market. Returns matching comparisons (title, slug, url, json_url, popularity). Use this first to find the exact slug, then call get_comparison.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "2-letter country code (e.g. US, FR, DE, GB). Default: US.",
                "type": "string"
              },
              "lang": {
                "description": "2-letter language code (e.g. en, fr, de, es, it). Default: en.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 20, max 50).",
                "type": "integer"
              },
              "query": {
                "description": "Free-text query, e.g. 'best electric car' or 'password manager'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f21a751dc5c7cb0851d47eb8662f77d212965e2acfc88a2736d77d30a1f6b1ff"
        }
      ],
