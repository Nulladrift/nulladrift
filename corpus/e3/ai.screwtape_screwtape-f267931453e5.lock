      "instructions": "Screwtape.ai decides whether an AI agent is allowed to spend money, and keeps the proof. Call check_duplicate_invoice (Bearer key or x402 payment) before an agent pays an invoice or payment instruction: it returns duplicate.status (unique, duplicate, possible_duplicate, replay), runs the checks you pass (for example a sum check that line items add up to the total) and judges the invoice against your evidence, such as the purchase order. Pay only when next_step.action is pass; on escalate, do not pay. Every verdict carries a signed receipt as proof of why the money moved or did not. Use budget_ledger to reserve cumulative spend ($0.002); action_receipt signs an action record ($0.003). Use payment_check ($0.005) before paying a seller, to check the 402 payee and price. All six paid tools share 3 free calls per UTC day without a key plus 10/day with a free key. Anonymous: private daily IP namespace, 3/minute, global 2000/day. Free GET /v1/receipt/verify checks action receipts and /.well-known/screwtape-receipt-key publishes their key. Use judge on one draft answer before you return it (send evidence; it does not search the web). Use consensus when 2 to 16 answers to the same task agree and you are about to trust the majority. Use get_api_key only if no key is configured and you can compute SHA-256 in code. judge, check_duplicate_invoice and consensus cost one call each: a free key gives 10 per UTC day, or pay $0.005 USDC on Base or Solana with x402. After anonymous access is exhausted, an unpaid tools/call returns HTTP 200 with isError true and the x402 PaymentRequirements in structuredContent and result._meta['x402/payment-required']. Retry with params._meta['x402/payment']. Settlement is echoed in result._meta['x402/payment-response']. Judged content is not stored unless retain is true or the key owner turned on opt-in data sharing (off by default; redacted, kept 90 days). A successful judge or consensus result includes an Ed25519 receipt when signing is configured. Public keys are at https://screwtape.ai/.well-known/screwtape-receipt-keys.json. POST /v1/receipts/verify checks a receipt. publish_receipt publishes one receipt you own. It needs the Bearer key and does not accept x402.",
      "tools": [
        {
          "name": "action_receipt",
          "title": "Action Receipts",
          "description": "Action Receipts: Ed25519-signed, hash-chained attestation of an agent-reported action and status; not evidence the action happened or a legal compliance certification. Per caller and agent chain; concurrent appends serialize with compare-and-set. Raw action/reference are hashed, not stored. event_id per agent is the authoritative idempotency key; a custom HTTP key cannot override it. Same event_id/body returns the same receipt; changed body conflicts. Optional children (1-64 receipt UUIDs) closes a run: the signed children_root digests ordered child receipt_hash values so any added, dropped or swapped step fails verification. GET /v1/receipt/verify?id=<receipt_id> is free and returns the receipt to anyone who knows its unguessable ID; children_root_valid is set when children are present. A receipt proves the record is unchanged since issued, not that a payment was correct or an outside action happened. Or pass receipt=<JSON> to verify a portable receipt. Keep IDs private if your agent IDs/status are sensitive. Records persist until the API key is deleted; keyless records have no automatic expiry. $0.003 per call; shared 3 free calls per UTC day without a key (daily private IP namespace), plus 10/day with a free key. Anonymous scopes rotate daily; use a key for a persistent ledger/chain. Send the same Bearer key plus a payment header to keep the same ledger/chain after the allowance runs out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "action_sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "agent_id": {
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "children": {
                "description": "Ordered child receipt ids. Signs children_root over their receipt_hash values so any added, dropped or swapped step fails verification.",
                "items": {
                  "pattern": "^[0-9a-f-]{36}$",
                  "type": "string"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "event_id": {
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "reference": {
                "maxLength": 256,
                "type": "string"
              },
              "status": {
                "enum": ["requested", "succeeded", "failed", "paid_not_served"]
              }
            },
            "required": ["action", "agent_id", "event_id", "status"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "keys_url": {
                "type": "string"
              },
              "receipt": {
                "properties": {
                  "action_sha256": {
                    "type": "string"
                  },
                  "agent_id": {
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9._:-]+$",
                    "type": "string"
                  },
                  "alg": {
                    "const": "Ed25519"
                  },
                  "chain": {
                    "type": "string"
                  },
                  "children": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "children_root": {
                    "description": "SHA-256 of canonical JSON of ordered child receipt_hash values.",
                    "type": "string"
                  },
                  "event_id": {
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9._:-]+$",
                    "type": "string"
                  },
                  "issued_at": {
                    "type": "string"
                  },
                  "kid": {
                    "type": "string"
                  },
                  "previous_hash": {
                    "type": ["string", "null"]
                  },
                  "receipt_id": {
                    "type": "string"
                  },
                  "reference_sha256": {
                    "type": "string"
                  },
                  "schema": {
                    "const": "screwtape-action-receipt-v1"
                  },
                  "sequence": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "signature": {
                    "type": "string"
                  },
                  "status": {
                    "enum": ["requested", "succeeded", "failed", "paid_not_served"]
                  }
                },
                "required": ["action_sha256", "agent_id", "alg", "chain", "event_id", "issued_at", "kid", "previous_hash", "receipt_id", "schema", "sequence", "signature", "status"],
                "type": "object"
              },
              "receipt_hash": {
                "type": "string"
              },
              "replayed": {
                "type": "boolean"
              },
              "request_id": {
                "type": "string"
              },
              "verify_url": {
                "type": "string"
              }
            },
            "required": ["keys_url", "receipt", "receipt_hash", "verify_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
