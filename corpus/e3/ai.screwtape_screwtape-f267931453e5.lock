                "type": "string"
              },
              "reasons": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "remaining_budget": {
                "type": "number"
              },
              "replayed": {
                "type": "boolean"
              },
              "request_id": {
                "type": "string"
              },
              "reserved": {
                "type": "boolean"
              },
              "retry_count": {
                "type": "integer"
              },
              "root_run_id": {
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "run_id": {
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "spent": {
                "type": "number"
              },
              "velocity_per_minute": {
                "type": "number"
              }
            },
            "required": ["decision", "reasons", "remaining_budget", "reserved", "root_run_id", "run_id", "spent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
