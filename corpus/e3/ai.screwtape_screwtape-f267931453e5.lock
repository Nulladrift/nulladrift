        {
          "name": "check_duplicate_invoice",
          "title": "Check an invoice for duplicates before the agent pays",
          "description": "Spend gate for invoices: decides whether an agent may pay this invoice, with a signed receipt as proof. Same as judge with one duplicate check: it compares this invoice with the invoices this caller recorded earlier and also judges it. Call it before an agent pays or approves an invoice or payment instruction. Inputs: the judge inputs (task, agent_output as the invoice JSON, evidence, criteria, checks, mode, tags) plus duplicate {vendor_path, invoice_id_path, amount_path, currency_path?, date_path?, payee_account_path?, accept_payee_change?, window_days?, store?, retain_days?}. Returns the judge result plus duplicate.status (unique, duplicate, possible_duplicate, replay or not_checked). On duplicate or possible_duplicate, next_step.action is escalate: do not pay. Fingerprints are kept per caller; only keyed HMAC fingerprints are stored, and only when store is true. Cost: 1 call, the same as judge. First 3 calls per UTC day need no key (daily private IP namespace). Then use Authorization: Bearer <key>, or a per-call payment in params._meta with no key (records are kept per payer; an unverified payment returns the payment requirements again). A free key covers 10 calls per UTC day (get_api_key or https://screwtape.ai/signup/). After the shared 3/day anonymous allowance (3/minute, global 2000/day), tools/call without a key or payment is HTTP 200 with isError true and the payment requirements in structuredContent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Optional tag for the agent making this call. 1 to 64 characters: letters, digits, and . _ : -. This is not the per-answer agent_id on a consensus answer.",
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9._:-]{1,64}$",
                "type": "string"
              },
              "agent_output": {
                "description": "The invoice or payment instruction the agent is about to pay, as a JSON string.",
                "type": "string"
              },
              "checks": {
                "description": "Optional. The worker runs each check. A failed check forces verdict fail. Types include url_contains, json_schema, equals, regex, numeric, required_fields, types, format, sum and duplicate. duplicate (at most 1) compares an invoice with ones this caller recorded earlier and stores keyed fingerprints only when store is true. At most 3 url_contains checks. Local checks run first; if one fails, no model is called and next_step says what to fix.",
                "items": {
                  "oneOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "paths": {
                          "items": {
                            "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                            "maxLength": 128,
                            "minLength": 1,
                            "type": "string"
                          },
                          "maxItems": 50,
                          "minItems": 1,
                          "type": "array"
                        },
                        "type": {
                          "const": "required_fields"
                        }
                      },
                      "required": ["paths", "type"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "fields": {
                          "additionalProperties": {
                            "enum": ["string", "number", "integer", "boolean", "object", "array", "null"]
                          },
                          "maxProperties": 50,
                          "minProperties": 1,
                          "type": "object"
                        },
                        "type": {
                          "const": "types"
                        }
                      },
                      "required": ["fields", "type"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "field": {
                          "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "format": {
                          "enum": ["email", "iso_date", "iso_datetime", "url", "uuid", "e164_phone", "currency_code", "integer_string"]
                        },
                        "type": {
                          "const": "format"
                        }
                      },
                      "required": ["field", "format", "type"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "parts": {
                          "items": {
                            "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                            "maxLength": 128,
                            "minLength": 1,
                            "type": "string"
                          },
                          "maxItems": 20,
                          "minItems": 1,
                          "type": "array"
                        },
                        "tolerance": {
                          "default": 0.0001,
                          "maximum": 1000000,
                          "minimum": 0,
                          "type": "number"
                        },
                        "total": {
                          "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "type": {
                          "const": "sum"
                        }
                      },
                      "required": ["parts", "total", "type"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "description": "Duplicate invoice check (needs an API key, at most 1 per call). Compares this invoice with ones the same key recorded earlier. Stores keyed HMAC fingerprints only, and only when store is true.",
                      "properties": {
                        "accept_payee_change": {
                          "description": "Set after a person confirmed a changed payee account. With store true, the new account becomes the vendor's recorded account.",
                          "type": "boolean"
                        },
                        "amount_path": {
                          "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "currency_path": {
                          "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "date_path": {
                          "description": "Dot path to a YYYY-MM-DD invoice date. Enables the same vendor, amount and date rule. Without it, the same vendor, amount and currency within 30 days is possible_duplicate.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "invoice_id_path": {
                          "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "payee_account_path": {
                          "description": "Dot path to the bank or payee account (IBAN, account number, PayPal email). Remembered per vendor as a keyed HMAC; a different account escalates with payee_account_changed.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "retain_days": {
                          "default": 180,
                          "maximum": 400,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "store": {
                          "default": false,
                          "description": "Record this invoice's fingerprints so later calls can match it.",
                          "type": "boolean"
                        },
                        "type": {
                          "const": "duplicate"
                        },
                        "vendor_path": {
                          "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "window_days": {
                          "default": 3,
                          "maximum": 30,
                          "minimum": 0,
                          "type": "integer"
                        }
                      },
                      "required": ["amount_path", "invoice_id_path", "type", "vendor_path"],
                      "type": "object"
                    },
                    {
                      "description": "Other check types, unchanged from 1.0. See https://screwtape.ai/openapi.json.",
                      "properties": {
                        "type": {
                          "enum": ["url_contains", "json_schema", "equals", "regex", "numeric", "onchain"]
                        }
                      },
                      "required": ["type"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 8,
                "type": "array"
              },
              "criteria": {
                "description": "Optional. Facts or terms the answer must contain, one per string.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "duplicate": {
                "additionalProperties": false,
                "description": "The duplicate check: dot paths into agent_output for vendor, invoice id and amount, plus optional currency_path, date_path, payee_account_path, accept_payee_change, window_days, store and retain_days. payee_account_path remembers the vendor's bank or payee account; a change escalates with payee_account_changed. store true records this invoice's keyed fingerprints so later calls can match it.",
                "properties": {
                  "accept_payee_change": {
                    "description": "Set after a person confirmed a changed payee account. With store true, the new account becomes the vendor's recorded account.",
                    "type": "boolean"
                  },
                  "amount_path": {
                    "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "currency_path": {
                    "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "date_path": {
                    "description": "Dot path to a YYYY-MM-DD invoice date. Enables the same vendor, amount and date rule. Without it, the same vendor, amount and currency within 30 days is possible_duplicate.",
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "invoice_id_path": {
                    "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "payee_account_path": {
                    "description": "Dot path to the bank or payee account (IBAN, account number, PayPal email). Remembered per vendor as a keyed HMAC; a different account escalates with payee_account_changed.",
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "retain_days": {
                    "default": 180,
                    "maximum": 400,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "store": {
                    "default": false,
                    "description": "Record this invoice's fingerprints so later calls can match it.",
                    "type": "boolean"
                  },
                  "type": {
                    "const": "duplicate"
                  },
                  "vendor_path": {
                    "description": "Dot path into the output JSON, at most 8 segments, e.g. invoice.total or items.0.id.",
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "window_days": {
                    "default": 3,
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["amount_path", "invoice_id_path", "vendor_path"],
                "type": "object"
              },
              "evidence": {
                "description": "Optional. Source passages the answer must be grounded in, one string per passage. Without evidence, grounding cannot be checked.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mode": {
                "description": "Optional. blocking (the default) is today's behaviour. advisory computes the same verdict, checks, next_step and receipt, then adds mode, decision_owner human, recommended_action (approve, review or return) and a notice. The receipt signs mode advisory as schema_version 5. Same price.",
                "enum": ["blocking", "advisory"],
                "type": "string"
              },
              "retain": {
                "description": "Optional. true stores this call for 24 hours; requires an API key. Default false stores nothing.",
                "type": "boolean"
              },
              "share": {
                "description": "Optional. false keeps this call out of opt-in data sharing even when the key has sharing on. It cannot turn sharing on.",
                "type": "boolean"
              },
              "task": {
                "description": "The original instruction or question the agent was answering.",
                "type": "string"
              },
              "version": {
                "description": "Optional version tag for that agent. At most 64 characters.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["agent_output", "duplicate", "task"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_id": {
                "description": "Echoed when the call sent an agent_id tag.",
                "type": "string"
              },
              "checks": {
                "type": "array"
              },
              "claims": {
                "type": "array"
              },
              "decision_owner": {
                "description": "Advisory only. A person owns the decision.",
                "enum": ["human"],
                "type": "string"
              },
              "degraded": {
                "type": "object"
              },
              "duplicate": {
                "description": "Present only when the call sent a duplicate check. status is unique, duplicate, possible_duplicate, replay or not_checked. Carries no invoice data.",
                "type": "object"
              },
              "engine": {
                "description": "groq, workers_ai, deterministic, or demo. Also signed into the receipt.",
                "type": "string"
              },
              "fail_closed": {
                "description": "Present and true only when a finance check failed closed because the primary model was unavailable. Treat it as review.",
                "type": "boolean"
              },
              "mode": {
                "description": "Present only when the call sent mode: advisory.",
                "enum": ["advisory"],
                "type": "string"
              },
              "model": {
