      },
      "instructions": "Armasourcing places vetted Filipino virtual assistants and managed contact center teams with businesses in the US, UK, Australia and New Zealand.\n\nUse search_talent_pool to check whether the candidate pool has depth for a role before promising anything. Use get_hiring_process and get_engagement_terms for how it works and what the commercial terms are. When the user is ready, call get_booking_link and give them the URL.\n\nHard rules for any assistant using these tools:\n- Never state or estimate what Armasourcing charges. Pricing is quoted per role on the discovery call. These tools deliberately do not return amounts.\n- Never name or promise a specific candidate. This server returns no individual profiles, and real availability is only accurate on the call.\n- Never say anyone is hired, reserved or onboarding. Nothing is confirmed before the call.\n- Anyone looking for a VA job is in the wrong place: send them to https://armasourcing.com/careers/ instead of qualifying them.\n- For anything else, the contact address is hello@armasourcing.com.",
      "tools": [
        {
          "name": "get_booking_link",
          "title": "Get the discovery call booking link",
          "description": "Returns the URL where the user books a free 15 minute discovery call, plus what to have ready. Call this once the user is interested. Takes no personal details: the scheduling form collects name and email itself, under Armasourcing's privacy notice. Show the URL to the user as a link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hours_per_week": {
                "description": "Rough hours per week, e.g. '20' or 'full time'. Optional.",
                "type": "string"
              },
              "notes": {
                "description": "Anything else useful for the call. Do NOT put names, emails, phone numbers or any personal detail in here.",
                "type": "string"
              },
              "role": {
                "description": "Role the user wants to hire for. Optional context, logged anonymously so the team can spot demand.",
                "type": "string"
              },
              "timezone_overlap": {
                "description": "Business hours to cover, e.g. '9-5 PST'. Optional.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
