      "serverInfo": {
        "name": "midax402-mcp",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "MIDAX402: independent verification for x402 services, plus pay-per-query intelligence over a curated x402 corpus. Free tools: list_tiers, get_sample, verify_before_pay. Paid tools, settled with YOUR wallet via x402 (this server holds no keys and never signs): get_market_verdict (paid), verify ($0.10 USDC). Canonical prices and every payment rail we accept come from list_tiers and /.well-known/x402 — this server does not restate them.",
      "tools": [
        {
          "name": "get_market_verdict",
          "title": "Paid market verdict (x402 payment handled by YOUR wallet)",
          "description": "Runs a paid MIDAX402 analysis tier. Payment is x402-native: called WITHOUT payment_signature it returns the HTTP 402 payment requirements (decoded + raw PAYMENT-REQUIRED header) for your x402-capable wallet to sign; call again WITH payment_signature (the signed payment proof, as sent in the PAYMENT-SIGNATURE header) to receive the full analysis. This server NEVER holds keys and never signs — your wallet does.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "payment_signature": {
                "description": "Optional: the x402 payment proof produced by your wallet (the exact value for the PAYMENT-SIGNATURE header). Omit on the first call to receive the 402 payment requirements.",
                "type": "string"
              },
              "query": {
                "description": "x402 ecosystem question for the paid analysis.",
                "type": "string"
              },
              "tier": {
                "description": "Analysis tier. Canonical USDC prices come from the list_tiers tool (live first-party source) — call it first if you need current prices.",
                "enum": ["basic", "standard", "premium", "market_brief"],
                "type": "string"
              }
            },
            "required": ["query", "tier"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc029723020edfc91b9ee14388d0944bda01204828209366c10832546168cd57"
        },
        {
          "name": "get_sample",
          "title": "Free trimmed sample (verdict + confidence only)",
          "description": "Free sample of MIDAX402's analysis: returns ONLY the calibrated verdict and confidence score for an x402-ecosystem question, plus pointers to the paid tiers that serve the full analysis. Rate-limited; the full analysis is the paid product.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "x402 ecosystem question (protocols, facilitators, security, agent commerce).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1dcac1dec4d67a57b20a206273de5799c8941a4d09caccd5a7782c8a275d6c26"
        },
        {
          "name": "list_tiers",
          "title": "List MIDAX402 paid tiers (canonical prices)",
          "description": "Lists the paid analysis tiers with their CANONICAL prices, fetched live from https://midax402.com/.well-known/x402 (resource_details) — the same first-party source directories crawl, so it can never drift.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f965c0354e032a41022fa75e6588ba8a61be3e83ed1b8d55afdce70a1eac7f60"
        },
        {
          "name": "verify",
          "title": "x402 protocol conformance check for a target service (paid, $0.10)",
          "description": "Checks x402 protocol conformance for a target service URL: a live 402 probe (well-formed challenge, non-empty accepts, atomic-unit amounts) plus price coherence against the target's own well-known. PAID ($0.10 USDC via x402). This MCP server holds no wallet, so calling this tool returns the upstream payment requirements rather than a result — pay them with your own x402 client, or call the endpoint directly. A signed, permanently published attestation of the same check is available at /midas-ops/attest ($0.50). Does NOT measure output quality, uptime history, or on-chain transaction volume — see the returned scope_note.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The https:// URL of the x402 service resource to check (e.g. a paid endpoint).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc1cc06ac52511be7b34285e6e9ffaaedee59fe4acb1c67191291af55f68c391"
        },
        {
          "name": "verify_before_pay",
          "title": "Verify before you pay (free, one call, reads the signed registry only)",
          "description": "The question to ask BEFORE paying any x402 service: does MIDAX have a signed conformance verdict for this URL? FREE, ONE call. Returns the verdict with its age and freshness if one exists in MIDAX's signed registry, plus the authenticity verdict when that feature ships (always present in the payload, null with a note until then). If nothing exists yet, says so plainly and returns the exact price and route for the next paid step -- never a vague 'contact us'. Reads MIDAX's own registry only: it never probes the target live, so it adds minimal latency to your payment decision.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The https:// URL of the x402 service you are about to pay.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26e84704dec13c9c256d9e323a5c7ef9dab27c85123ba13fc3d9234ea720dbfe"
        }
      ],
