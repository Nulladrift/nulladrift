      "serverInfo": {
        "name": "shortlist-pass",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Shortlist Pass hosts the live pages of real local businesses. The read tools return published data only: menus, upcoming stops and events, pickup availability. start_order creates a cart from offering ids — or item names, answered with choices when unclear — (prices are not accepted) and returns a cart_url on the business's page, where the customer reviews the order and pays; payment details are not handled by these tools. Food trucks sell per stop, and each stop's menu is listed in the upcoming-events data. Plain JSON API: https://app.shortlistpass.com/api/agent/v1. Docs: https://app.shortlistpass.com/developers/agents.",
      "tools": [
        {
          "name": "get_business",
          "title": "Get a business",
          "description": "Returns the public profile of one Shortlist business: name, type, description, town, phone, website, page URL, hours (fixed locations only), whether online ordering is open, and the order page URL when it is. Mobile businesses (food trucks) have no fixed address; their locations are the upcoming stops in the upcoming-events data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "subdomain": {
                "description": "The business subdomain, e.g. \"nitos\" for nitos.shortlistpass.com",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["subdomain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:408975e7f7f8ef03c8a04aa18acd10afdb72b153c7e2c4e21b63c532881447b3"
        },
        {
          "name": "get_menu",
          "title": "Get the menu",
          "description": "Returns the current public menu of one business: every active item with its id (use it in start_order), name, description, price, category, tags, available and sold_out flags, an image URL, and options: its sizes and add-ons (group key, label, and each choice's value, label and price). Prices are in US dollars. For a business with menu_source \"event\" (food trucks), this is the full catalog of everything it sells; what is sold on a given day is listed per stop in the upcoming-events data, and the note field states this. The response includes the business summary with the order page URL when ordering is open.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "subdomain": {
                "description": "The business subdomain, e.g. \"nitos\"",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["subdomain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the menu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:06d282811f24b762f3d0bc07f1b608fb0f1bb9ce753e5e2caf8b3639a162e731"
        },
        {
          "name": "get_trucks_tonight",
          "title": "Food trucks out tonight in a city",
          "description": "Food trucks in one city today (local time), in two lists. \"tonight\" (status \"out_tonight\"): trucks with a stop confirmed for today — truck name, park if it is at one, address, start and end time, open_now, the truck page link, and order_url only when that truck is taking preorders for that stop. \"usually_here\" (status \"usually_here\"): trucks that regularly park at a listed park but have NO stop confirmed for today — say \"usually here\", never \"out tonight\". Also lists the parks with today's and usual truck counts. Optional \"days\" (1-7, default 1): also returns \"days\", the posted stops for today and the next days grouped by date (truck, where, start, end, open_now, page link); a day with no posted stop is left out. Test pages, private events and cancelled or hidden stops are never included. Cities: Myrtle Beach, Austin.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City name or slug, e.g. \"Austin\" or \"myrtle-beach\"",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "days": {
                "description": "How many days from today, 1-7 (default 1)",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Food trucks out tonight in a city"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ca40ee0a10d9d28385e536834491bcfdd9906a17a9a14cdfe6805479f658828d"
        },
        {
          "name": "get_upcoming_events",
          "title": "Get upcoming events and stops",
          "description": "Returns the upcoming published events and stops for one business; for a food truck these are its locations. Each has a name, ISO start and end with the local offset, location name and address, whether pre-orders are open for that stop, the pickup time slots still available with remaining capacity (null means no cap), and a menu with menu_status: \"set\" means the items listed are what is sold at that stop and their offering ids are accepted by start_order for that stop; \"not_live\" means the business has not put a menu on that stop yet, the menu is empty, menu_note carries the explanation, and start_order does not accept the stop; \"catalog\" means a fixed business whose standing menu applies. Recurring events carry a recurrence description and the next date. Cancelled and test events are not included.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "subdomain": {
                "description": "The business subdomain, e.g. \"nitos\"",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["subdomain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get upcoming events and stops"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0a46b872d6a1f7e579b5b5a8e4bd912b90f88982c1feb47bd1a882eeb3d91e38"
        },
        {
          "name": "search_businesses",
          "title": "Search Shortlist businesses",
          "description": "Searches real local businesses on Shortlist Pass (food trucks, restaurants, shops, HOAs and more). Optional filters: a town slug (e.g. \"myrtle-beach\"), a business category key (e.g. \"food_truck\", \"restaurant\", \"bakery\"), and a free-text query. The query matches every word, in any order, against the business name, headline and type, and also against its active menu items (name, description, tags, category); a business found through its menu carries matched_items (id, name, price, up to 5). For food trucks, matched items come from the full catalog and menu_note says so; what is sold on a given day is per stop. Businesses with a menu match rank first. Returns up to 25 matches, each with its subdomain, which is the identifier the other tools take. Demo and test pages are not included.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Business category key, e.g. \"food_truck\"",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "Free-text query, e.g. \"empanadas\" or \"buffalo chicken fries\"; matched word-by-word against the business and its menu items",
                "maxLength": 80,
                "type": "string"
              },
              "town": {
                "description": "Town slug, e.g. \"myrtle-beach\"",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Shortlist businesses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c2f4f42c2a6886ec7e4ccff6509b9b399cffe9ed32a4bd5296015559c4b59c7a"
        },
        {
          "name": "start_order",
          "title": "Start an order for a customer",
          "description": "Creates a short-lived cart for a customer at one Shortlist business and returns a cart_url on the business's own page, where the customer reviews the order and pays through the business's checkout. Input is offering ids (preferred) or item names, and quantities; prices are not accepted. Order by id from get_menu or the stop's menu. If you only have a name, send it as name: when it is unclear or not on the menu, no cart is made and the reply (error \"needs_choice\") lists each line as matched, choose (options with ids) or not_found (genuinely close items with ids, or none) with a message to read to your user; ask them and resend with the offering_id. The server prices every line from the menu, applies the business's deals and tax, and returns the resulting quote. For businesses with menu_source \"event\" (food trucks), event_id is required and identifies one upcoming stop; the offering ids accepted are those listed in that stop's menu in the upcoming-events data, and pickup_time is one of that stop's open pickup_slots. A stop whose menu_status is \"not_live\" is refused. The cart expires in 30 minutes. This tool does not accept payment details or addresses; payment happens on the business's page at the returned cart_url. In the quote, total_before_tip excludes the optional tip, which the customer chooses on the checkout page; quote.tip.note states the business's suggested percentage. agent.name is recorded on the cart and the order so the business can see which assistant helped.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent": {
                "description": "The name of the assistant placing the order, e.g. { \"name\": \"Claude\" }. Optional; defaults to \"AI assistant\".",
                "properties": {
                  "name": {
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "customer": {
                "description": "Customer details, if provided; pre-filled on the order sheet",
                "properties": {
                  "email": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 30,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "event_id": {
                "description": "A stop id from the upcoming-events results. Required for businesses with menu_source \"event\".",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "name": {
                      "description": "Only when you have no id: the item's name as your user said it. If it is unclear the reply is error \"needs_choice\" with options (ids) per line; ask your user and resend with the offering_id.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "offering_id": {
                      "description": "An offering id from the stop's menu (or from get_menu for a fixed business). Preferred.",
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "options": {
                      "additionalProperties": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          }
                        ]
                      },
                      "description": "The offering's own variant or modifier choices, by option value or label",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "quantity": {
                      "description": "Whole number, 1 to 100",
                      "maximum": 100,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["quantity"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "pickup_time": {
                "description": "One of the stop's open pickup_slots, \"HH:MM\" 24-hour",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "subdomain": {
                "description": "The business subdomain, e.g. \"nitos\"",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["items", "subdomain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start an order for a customer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:74ae5f692c1a00b98f0e424d4c2801e4add8811ca9e36895c7fb26ede9f7c2c4"
        }
      ],
      "digest": "sha256:03ab2f00f303904a66ec440fa7fbe683a61190d44ac50225a5d2148d62b1b382"
    }
  }
