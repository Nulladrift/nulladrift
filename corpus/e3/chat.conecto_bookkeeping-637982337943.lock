                "minLength": 1,
                "type": "string"
              },
              "catch_up": {
                "default": false,
                "type": "boolean"
              },
              "date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "gain_account": {
                "description": "An account code from the chart, e.g. \"6600\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "paid_to": {
                "description": "Where the price went, e.g. \"1010\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "price": {
                "description": "What it sold for before tax. Default 0, a write-off.",
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "undo": {
                "description": "Bring a sold or written off asset back.",
                "type": "boolean"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
