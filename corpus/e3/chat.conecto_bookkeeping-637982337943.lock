                "description": "Depreciation booked before the books started.",
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "purchase_date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "rate_percent": {
                "description": "Declining balance: the share of its book value a year.",
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "residual": {
                "description": "What it is worth at the end of its life. Default 0.",
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "serial_number": {
                "maxLength": 80,
                "type": "string"
              },
              "tracking": {
                "additionalProperties": {
                  "maxLength": 60,
                  "type": "string"
                },
                "description": "Tracking options by category, e.g. {\"Department\": \"Service\"} (books_list_tracking).",
                "maxProperties": 2,
                "type": "object"
              },
              "warranty_until": {
                "description": "YYYY-MM-DD, \"\" for none.",
                "pattern": "^(\\d{4}-\\d{2}-\\d{2})?$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
