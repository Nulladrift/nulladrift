        {
          "name": "books_depreciate",
          "title": "Book depreciation",
          "description": "Book the depreciation of every registered asset through a month's end (default: the end of last month), like Xero's run depreciation: one entry per month, dated its last day, from the month after the last one booked, so running it again books nothing twice. Months in a locked period are refused; catch_up: true books them in the first open month instead. undo_after books the opposite of what was booked for the months after that date, for every asset or the one asset names; undo before changing an asset's cost, life or method. Costs $0.01 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Only this asset.",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "catch_up": {
                "default": false,
                "type": "boolean"
              },
              "through": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "undo_after": {
                "description": "Undo the months after this date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Book depreciation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:256568f84bc5a28a23a7d6288b53d5fc850c354401fff2c690f3a99c4a0d4fa7"
        },
        {
          "name": "books_dispose_asset",
          "title": "Sell or write off an asset",
          "description": "Take an asset out of the books, sold or written off, like Xero's dispose. Its depreciation is booked through the month it goes first (to the day with actual_days; what was booked for later months is undone), then one entry takes its cost and accumulated depreciation out, books price to paid_to and the difference as a gain or a loss on gain_account (made as 4950 Gains and losses on assets sold when missing). paid_to is the bank account the money went to, or the income account the invoice to the buyer booked it to, which this then clears. A write-off has no price. undo: true brings it back. Costs $0.01 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "The asset's number, like \"FA-0001\" (books_list_assets).",
