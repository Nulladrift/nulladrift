        {
          "name": "books_setup",
          "title": "Set up the books",
          "description": "Start the business's double-entry books, or change their settings. The first call needs currency (the base currency of every report; it can't change once something is booked) and makes the chart: \"starter\" (cash, bank, receivables, tax, equity, sales and common costs, numbered 1000-8000), \"minimal\" (only the eight accounts the books post to on their own), or a country's standard numbers: \"skr03\" or \"skr04\" for Germany (DATEV's charts, the ones German tax advisers work in; ask the adviser which), so accounts the books make later take that chart's numbers too and a DATEV export needs no mapping. The books start on start_date (default: the start of this fiscal year); enter what the business owned and owed that day as one entry against the account with the opening_balances role (3900; 9000 on the German charts), unpaid invoices and bills from before included. vat_basis says when VAT on the business's own sales is owed: \"invoice\" (by invoice date, the default) or \"payment\" (as customers pay: Germany's Ist-Versteuerung, §20 UStG, which the tax office allows on request), for invoices issued from vat_basis_from on. Entries are booked the same either way; the tax and vat_return reports then count each such invoice's VAT by its payments. An invoice keeps the rule of its own date, so a switch counts nothing twice. With post_invoices (default on), sent invoices and supplier bills, their payments and voids post on their own, those from start_date on right away. payment_accounts says where payments land per method, in and out (default: the bank account, cash in the cash account); rates are standing exchange rates for currencies the European Central Bank doesn't publish. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chart": {
                "description": "Only on the first call.",
                "enum": ["starter", "minimal", "skr03", "skr04"],
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217, e.g. \"EUR\".",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "fiscal_year_start": {
                "description": "The month the fiscal year starts. Default 1 (January).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "payment_accounts": {
                "additionalProperties": {
                  "type": ["string", "null"]
                },
                "description": "Payment method -> account code, e.g. {\"card\": \"1020\"}; null goes back to the default. Methods: bank_transfer, card, cash, check, online, other.",
                "type": "object"
              },
              "post_invoices": {
                "type": "boolean"
              },
              "rates": {
                "additionalProperties": {
                  "type": ["number", "string", "null"]
                },
                "description": "Currency -> one unit of it in the base currency, e.g. {\"AED\": \"0.2486\"}; null removes one. Used instead of the ECB's rate.",
                "type": "object"
              },
              "start_date": {
                "description": "The first day the books cover.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "vat_basis": {
                "description": "When VAT on sales is owed. Default \"invoice\".",
                "enum": ["invoice", "payment"],
                "type": "string"
              },
              "vat_basis_from": {
                "description": "The first invoice date vat_basis holds for. Needed once something is booked; before that, default the start date. Not in a locked or closed period.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set up the books"
          },
          "behavior": {
