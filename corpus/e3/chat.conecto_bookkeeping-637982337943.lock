        {
          "name": "books_export",
          "title": "Export the books",
          "description": "A file in the file store, with a download link: journal (a CSV of every line of every entry from-to, for an accountant or another program), accounts (the chart with balances on to) or datev (a DATEV Buchungsstapel for a German tax adviser: one fiscal year, from-to, default the year so far; needs the datev settings once) or fec (the French Fichier des Écritures Comptables for a tax audit: the fiscal year that holds to, every entry; needs the fec settings once). Conecto files no tax returns: for UK VAT (Making Tax Digital) the journal CSV is the digital link into bridging software. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "datev": {
                "additionalProperties": false,
                "description": "For what: datev, kept for the next export. adviser (Beraternummer) and client (Mandantennummer) from the tax adviser; chart \"03\" (SKR03) or \"04\" (SKR04); account_length (4 to 8, default 4); accounts: each account code used to its DATEV number, like {\"4000\": \"8400\", \"1010\": \"1200\"} (same_numbers: true when the chart already uses them; books set up on the skr03 or skr04 chart do, and need neither chart nor accounts here); tax_keys: a tax's BU-Schlüssel when it isn't German VAT at 19 or 7 percent.",
                "properties": {
                  "account_length": {
                    "maximum": 8,
                    "minimum": 4,
                    "type": "integer"
                  },
                  "accounts": {
                    "additionalProperties": {
                      "maxLength": 9,
                      "type": "string"
                    },
                    "maxProperties": 500,
                    "type": "object"
                  },
                  "adviser": {
                    "maximum": 9999999,
                    "minimum": 1001,
                    "type": "integer"
                  },
                  "chart": {
                    "enum": ["03", "04"],
                    "type": "string"
                  },
                  "client": {
                    "maximum": 99999,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "same_numbers": {
                    "type": "boolean"
                  },
                  "tax_keys": {
                    "additionalProperties": {
                      "maxLength": 4,
                      "type": "string"
                    },
                    "maxProperties": 50,
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "fec": {
                "additionalProperties": false,
                "description": "For what: fec, kept for the next export. siren (9 digits; read from a French VAT ID when left out); accounts: each account code used to its plan comptable général number, like {\"4000\": \"706000\", \"1010\": \"512000\"} (same_numbers: true when the chart already uses them).",
                "properties": {
                  "accounts": {
                    "additionalProperties": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "maxProperties": 500,
                    "type": "object"
                  },
                  "same_numbers": {
                    "type": "boolean"
                  },
                  "siren": {
                    "maxLength": 14,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "from": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "what": {
                "enum": ["journal", "accounts", "datev", "fec"],
                "type": "string"
              }
            },
            "required": ["what"],
            "type": "object"
          },
