        {
          "name": "books_save_tax",
          "title": "Add or change a tax",
          "description": "A tax rate the books use (VAT, GST, sales tax), matched by name. Tax charged on sales is owed on sales_account (default: the sales tax account); tax paid on purchases is reclaimed on purchase_account (default: the tax to reclaim account; null when it can't be reclaimed, and it stays part of the cost). A rate in use can't change: add a new tax and archive the old one. Invoices make the taxes they need on their own. kind makes a new tax one the business owes itself, like Xero's reverse charge rates: rc_eu (services from another EU country), rc_abroad (from outside it), rc_home (reverse charge at home) or eu_goods (goods from another EU country); on an expense or a bank line it books the VAT owed and reclaimed at once, the amount paid being without VAT. kind import is import VAT paid at customs, no rate: what is booked with it is the VAT itself, reclaimed whole on the import VAT account (1310, made with it), where an expense or a bank line counts with no tax named (box 62 in Germany, box 4 in the UK). Conecto gives no tax advice; the rates are the business's. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "archived": {
                "type": "boolean"
              },
              "kind": {
                "description": "For a new tax: VAT the business owes itself, or import VAT.",
                "enum": ["rc_eu", "rc_abroad", "rc_home", "eu_goods", "import"],
                "type": "string"
              },
              "name": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "new_name": {
                "maxLength": 60,
                "type": "string"
              },
              "purchase_account": {
                "maxLength": 20,
                "type": ["string", "null"]
              },
              "rate": {
                "description": "Percent, e.g. 19.",
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "sales_account": {
                "description": "An account code from the chart, e.g. \"6600\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add or change a tax"
          },
          "behavior": {
