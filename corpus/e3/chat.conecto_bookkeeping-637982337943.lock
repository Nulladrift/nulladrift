      "serverInfo": {
        "name": "conecto-books",
        "title": "Conecto Bookkeeping",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Conecto Bookkeeping: The business's double-entry books: a chart of accounts, journal entries, expenses with receipts, taxes, bank statements imported (CSV, CAMT.053, OFX) and matched, invoices posted on their own, locked periods, and profit and loss, balance sheet, trial balance, ledger and tax reports. Every tool lists its price; reads are free up to 1,000,000 a month for the account (then $0.50 per 10,000), and a call that fails is never charged. Pay from your Conecto balance (GET https://api.conecto.chat/v1/balance).",
      "tools": [
        {
          "name": "account_add_approval_rule",
          "title": "Hold a tool for approval",
          "description": "Make a tool wait for a person: every call of it, those whose argument is over a number (like invoices_create_credit_note when amount is over 500), or those whose argument is one of some values (like connect_call when method is POST, PUT, PATCH or DELETE). A held call answers approval_required with an approval_id and asks the approver; when they approve, call again with the same arguments, once (a call no person answers for adds the approval: header X-Conecto-Approval, or _meta.approvalId over MCP). The approver is an email, a saved channel, or a team (its managers, or everyone in it); each approver gets a link of their own, and the person whose call it is never approves it. With two_people_over, calls whose argument is over it need two people. Bills like Xero's bill approval: purchasing_create_bill with argument total holds bills over an amount, tax included; a rule on purchasing_pay_bill also holds batches with such a payment. Removing a rule is the owner's, on their account page, when the account has an owner email. $0.001. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "approver_channel": {
                "description": "A saved notify channel.",
                "maxLength": 80,
                "type": "string"
              },
              "approver_email": {
                "maxLength": 254,
                "type": "string"
              },
              "approver_team": {
                "description": "A team (account_list_teams).",
                "maxLength": 80,
                "type": "string"
              },
              "approvers": {
                "default": "managers",
                "description": "Who in approver_team approves.",
                "enum": ["managers", "everyone"],
                "type": "string"
              },
              "argument": {
                "description": "An argument of the tool (or total, for purchasing_create_bill).",
                "maxLength": 60,
                "type": "string"
              },
              "over": {
                "description": "Calls with argument over this are held.",
                "type": "number"
              },
              "tool": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "two_people_over": {
                "description": "Calls whose argument is over this need two people; higher than over.",
                "type": "number"
              },
              "values": {
                "description": "Calls with argument equal to one of these (any case) are held.",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Hold a tool for approval"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:bafcce195dd8c4b74f7e348f82c31d9b321d0d79bb304e3011d10e47a298217f"
        },
        {
          "name": "account_assign_team",
          "title": "Give something to a team",
          "description": "Move a form, a meeting type, a job, an inbox, a phone number, a newsletter, the website chat, a rental, a pipeline, a table or a website to a team. What happens through it is charged to that team from now on (a form's responses, a number's calls, an inbox's tickets), and its rental moves with it. Something a bot makes already belongs to the bot's team. Only a key of the company-wide team without limits moves things between teams. $0.001. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Its id, slug, name, address or number; not needed for the chat.",
                "maxLength": 254,
                "type": "string"
              },
              "kind": {
                "enum": ["form", "meeting_type", "job", "inbox", "phone_number", "newsletter", "chat", "rental", "pipeline", "table", "website"],
                "type": "string"
              },
              "team": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["kind", "team"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Give something to a team"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ca3d14f0c9de109450813efc23f9de17d841ceba04907018172951f51e842715"
        },
        {
          "name": "account_audit_log",
          "title": "Read the audit log",
          "description": "The account's admin and security actions, newest first: keys made and revoked, limits and auto-reload, the owner's sign-ins, connectors, exports, vault reads and writes, credentials set and everything deleted. Ordinary work is in the call log (account_list_calls). verify: true also checks the hash chain, which breaks where an entry was changed or removed. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Only actions starting with this, like \"key.\" or \"tool.vault_\".",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              },
              "verify": {
                "default": false,
                "type": "boolean"
