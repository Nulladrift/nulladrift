        {
          "name": "books_save_asset",
          "title": "Register a fixed asset",
          "description": "Put an asset the business bought in the register, like Xero's fixed assets: a van, a machine, a laptop, with its cost, purchase date and the asset account its purchase was booked to (registering books nothing). method: straight_line over its life down to residual, declining_balance at rate_percent of its book value at the start of each fiscal year, full (all of it in the month it starts, for something cheap enough to write off at once) or none (land). averaging: full_month counts the month it starts in full, actual_days counts days. Depreciation goes to the depreciation expense and accumulated depreciation accounts (made as 6950 and 1590 when missing) unless expense_account and accumulated_account say otherwise. An asset depreciated before the books started brings opening_accumulated. To change one, pass asset: once its depreciation is booked, only its name, description, serial number, warranty and tracking change. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "description": "The asset account its purchase was booked to, e.g. \"1500\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "accumulated_account": {
                "description": "An account code from the chart, e.g. \"6600\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "asset": {
                "description": "The asset to change, by its number. Leave out to register one.",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "averaging": {
                "default": "full_month",
                "enum": ["full_month", "actual_days"],
                "type": "string"
              },
              "cost": {
                "description": "What it cost before tax, in the base currency.",
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "depreciation_start": {
                "description": "When it was first used, if after the purchase date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "description": {
                "maxLength": 500,
                "type": "string"
              },
              "expense_account": {
                "description": "An account code from the chart, e.g. \"6600\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "life_months": {
                "maximum": 1200,
                "minimum": 1,
                "type": "integer"
              },
              "life_years": {
                "maximum": 100,
                "minimum": 0.1,
                "type": "number"
              },
              "method": {
                "default": "straight_line",
                "enum": ["straight_line", "declining_balance", "full", "none"],
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "number": {
                "description": "A new asset's number. Default: the next FA-0001.",
                "maxLength": 20,
                "type": "string"
              },
