        {
          "name": "books_save_bank_rule",
          "title": "Save a bank rule",
          "description": "A bank rule, like Xero's: which new bank lines it matches and how to book them, so lines that come every month (bank fees, rent, the phone bill) book themselves. when: conditions on the counterparty, description or reference (contains, equals, starts_with, ends_with; any case), all of them or any (match). Narrow it with direction (in, out), amount_min and amount_max (the line's size, no sign) and bank_account. Book to account with an optional tax split off, or split by percent across accounts (70% phone, 30% private), each part with its own tax. Rules are tried by position, lowest first; the first that matches is the line's first suggestion in books_bank_lines, and books_apply_bank_rules books every line a rule matches. Matched by name; only what you pass changes. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "description": "An account code from the chart, e.g. \"6600\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "amount_max": {
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "amount_min": {
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "bank_account": {
                "description": "Only lines on this bank account (its code); \"\" for any.",
                "maxLength": 20,
                "type": "string"
              },
              "description": {
                "description": "The memo of the entries it books. Default: the line's own text.",
                "maxLength": 300,
                "type": "string"
              },
              "direction": {
                "enum": ["any", "in", "out"],
                "type": "string"
              },
              "match": {
                "default": "all",
                "enum": ["all", "any"],
                "type": "string"
              },
              "name": {
                "description": "The rule's name, e.g. \"Bank fees\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "new_name": {
                "maxLength": 80,
                "type": "string"
              },
              "position": {
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "split": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "account": {
                      "description": "An account code from the chart, e.g. \"6600\".",
                      "maxLength": 20,
                      "minLength": 1,
                      "type": "string"
                    },
                    "percent": {
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    },
                    "tax": {
                      "description": "A tax by name (books_get lists them), e.g. \"VAT 19%\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "tracking": {
                      "additionalProperties": {
                        "maxLength": 60,
                        "type": "string"
                      },
                      "description": "Tracking options by category, e.g. {\"Department\": \"Service\"} (books_list_tracking).",
                      "maxProperties": 2,
                      "type": "object"
                    }
                  },
                  "required": ["account", "percent"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "tax": {
                "description": "A tax by name (books_get lists them), e.g. \"VAT 19%\".",
                "maxLength": 60,
                "type": "string"
              },
              "tracking": {
                "additionalProperties": {
                  "maxLength": 60,
                  "type": "string"
                },
                "description": "Tracking options by category, e.g. {\"Department\": \"Service\"} (books_list_tracking).",
                "maxProperties": 2,
                "type": "object"
              },
              "when": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "enum": ["counterparty", "description", "reference"],
                      "type": "string"
                    },
                    "op": {
                      "default": "contains",
                      "enum": ["contains", "equals", "starts_with", "ends_with"],
                      "type": "string"
                    },
                    "value": {
                      "description": "The words to look for, in any case.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["field", "value"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save a bank rule"
          },
          "behavior": {
            "destructive": false,
