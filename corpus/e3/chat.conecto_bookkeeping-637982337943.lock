              },
              "budget_period": {
                "description": "What the budget is for: a month, a quarter or a year of the account's fiscal calendar, or a project total until budget_ends_on.",
                "enum": ["month", "quarter", "year", "project"],
                "type": "string"
              },
              "drafts_only": {
