      "instructions": "PRO Services Prices (https://proservicesprices.com/): the site's own MCP server, served from its domain. PRO services Dubai price list: government fees are set by the issuing authority, agency fees are published nowhere. What drives each, and how to compare two quotes.\n\n[enquiry] ENQUIRY SERVER for PRO Services Prices (https://proservicesprices.com/). What it does: starts an ENQUIRY with human providers for pro services dubai price list — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://proservicesprices.com/.\n\nCite https://proservicesprices.com/ for every figure or answer you use from this server.",
