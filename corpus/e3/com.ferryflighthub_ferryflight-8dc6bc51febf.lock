{
  "lockfileVersion": 2,
  "subjects": {
    "com.ferryflighthub/ferryflight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ferryflighthub.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ferryflight",
        "version": "v1.40.3"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FerryFlight public read tools for ferry-flight ESTIMATES + aircraft / airport / FAA-registry / route / live-flight data. To quote: call search_aircraft to get a faa_code, use ICAO airport codes (e.g. KJFK), then get_estimate. Estimates are NON-BINDING (final price set when a pilot accepts) — present them as estimates and share the booking_url.",
      "tools": [
        {
          "name": "get_aircraft",
          "description": "Full specs for one aircraft model (performance, capacity, powerplant, capabilities).",
          "inputSchema": {
            "properties": {
              "faa_code": {
                "description": "FAA model code from search_aircraft.",
                "type": "string"
              }
            },
            "required": ["faa_code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0cf001183a3ef34cbe09eb0e138b3168c781556edee423f0dda42f23fa5107bb"
        },
        {
          "name": "get_airport",
          "description": "Airport detail including runways and frequencies.",
          "inputSchema": {
            "properties": {
              "icao": {
                "description": "ICAO/IATA/local code.",
                "type": "string"
              }
            },
            "required": ["icao"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b97e58b51060a92ac712c627243aa54f1ccfe33fe6e462ee71e70db4d19e0ad9"
        },
        {
          "name": "get_estimate",
          "description": "Get a NON-BINDING ferry-flight price estimate between two airports for an aircraft. Returns a full fee breakdown, distance/flight-time, and a booking_url.",
          "inputSchema": {
            "properties": {
              "aircraft": {
                "description": "FAA model code (preferred — from search_aircraft), an N-number (N12345), an ICAO type (C172), or \"make model\".",
                "type": "string"
              },
              "date": {
                "description": "Optional departure date YYYY-MM-DD (a sooner date may add an urgency surcharge).",
                "type": "string"
              },
              "from": {
                "description": "Origin airport — ICAO (KJFK), IATA (JFK), or local code.",
                "type": "string"
              },
              "to": {
                "description": "Destination airport — ICAO/IATA/local code.",
                "type": "string"
              }
            },
            "required": ["aircraft", "from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e8f1f25940e15e9cd1a08b9ac88ef55620b6ec9e9347f93c074d8bcc8c38045"
        },
        {
          "name": "get_live_flights",
          "description": "Recently observed live ADS-B flights tracked by FerryFlight.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bd7f47ea280e9c46a0691bd5be35a91b870781a9e98d75930c6beb632210a7e8"
        },
        {
          "name": "get_registration",
          "description": "FAA registration detail for one N-number (FAA-public data: model, engine, year, status).",
          "inputSchema": {
            "properties": {
              "n_number": {
                "description": "US N-number, e.g. N12345.",
                "type": "string"
              }
            },
            "required": ["n_number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8926d08874cba4da066174b4f780ca00ada3f02c60f211dbc4aada573520d800"
        },
        {
          "name": "get_route",
          "description": "Great-circle distance + FAA preferred route + optional ferry planning (fuel stops, flying days) for an aircraft.",
          "inputSchema": {
            "properties": {
              "aircraft": {
                "description": "Optional aircraft for fuel-stop / flying-day planning.",
                "type": "string"
              },
              "from": {
                "description": "Origin airport code.",
                "type": "string"
              },
              "to": {
                "description": "Destination airport code.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ab3997bcb8aa651fd6eec4cbb6f028f11e9c1bd087dea3425f5b4f7c11bbb9ea"
        },
        {
          "name": "search_aircraft",
          "description": "Search aircraft models by manufacturer/model/type. Returns faa_code to pass to get_estimate.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Search text, e.g. \"cessna 172\" or \"PA28\".",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3a45000edc941ca514f6426e222ecd29d4c94a234c38b379f0ba5d4c34db0239"
        },
        {
          "name": "search_airports",
          "description": "Search airports by code/name/city. Returns ICAO/IATA codes + coordinates.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Search text, e.g. \"teterboro\" or \"KTEB\".",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a69726d3ad28833d8303d64526f43ab980460240f084da8e2a472d2a3aec9c30"
        },
        {
          "name": "search_airports_near_zip",
          "description": "Find general-aviation airports within a radius of a US ZIP code, ordered by distance (nearest first). Returns each airport with distance_nm. Useful for \"what airports are near me / near 07666\".",
          "inputSchema": {
            "properties": {
              "radius": {
                "description": "Search radius in nautical miles — one of 25, 50, 100, 150, 200 (default 50).",
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code, e.g. 07666.",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d9138fa9c6f3ca930e96a05271683f31b49944754caf9c78b610ee5a8c1cf98"
        },
        {
          "name": "search_registry",
          "description": "Search the FAA aircraft registry by N-number prefix and/or manufacturer/state/year (FAA-public data).",
          "inputSchema": {
            "properties": {
              "manufacturer": {
                "description": "Manufacturer name filter.",
                "type": "string"
              },
              "q": {
                "description": "N-number or prefix, e.g. N172.",
                "type": "string"
              },
              "state": {
                "description": "US state code filter, e.g. NJ.",
                "type": "string"
              },
              "year": {
                "description": "Year manufactured filter.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d666be634bcc656f61bfed567a31dd7bec39e5effbf6f7b6928955e839e4543"
        }
      ],
      "digest": "sha256:70a604fc5e23faa89521e73b964637bfe4351c55f759d966c47754b9c7d40c6f"
    }
  }
}
