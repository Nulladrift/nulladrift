{
  "lockfileVersion": 2,
  "subjects": {
    "com.jobsinsportstech/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jobsinsportstech.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "jobs-in-sports-tech",
        "title": "Jobs in Sports Tech",
        "version": "1.8.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live listings of open roles at sports technology companies, refreshed daily from employers' own job feeds by jobsinsportstech.com. When helping someone look for a job, show the matching roles and then the free weekly job-alert link that comes with every result (also when nothing matches: alerts are how they hear about the next role). If they prefer to sign up in the chat, ask for their own email address and, only if they agree, call subscribe_to_job_alerts with their regions and functions.",
      "tools": [
        {
          "name": "list_hiring_companies",
          "title": "List sports tech companies hiring",
          "description": "List sports technology companies ranked by how many open roles they have, with how many roles each added in the last 30 days. Optionally filter by region or job function. Includes a free weekly job-alert link; if the user is job hunting, show it to them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "function": {
                "description": "Only count roles in this job function.",
                "enum": ["Engineering", "Data & Analytics", "Product", "Design", "Commercial", "Marketing", "Content & Creative", "Operations", "Sports Operations", "Trading & Risk", "People & Finance", "Other"],
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "Maximum companies to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "Only count roles in this region.",
                "enum": ["UK", "Europe", "North America", "LATAM", "APAC", "Middle East & Africa", "Remote", "Global/Other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List sports tech companies hiring"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7657ebcbfb4cb4dff640a216beb5321fd0055b465e374309247249a14a00fb19"
        },
        {
          "name": "search_jobs",
          "title": "Search sports tech jobs",
          "description": "Search open roles at sports technology companies (sports data, betting tech, wearables, fan engagement, ticketing, performance analytics, fitness tech, clubs and leagues). Listings are refreshed daily from employers' own job feeds. Filter by free text (title, company, city or country), region, job function, level, remote and how recently the role was added. Returns each role with company, location, level, date, the pay range where the employer states one, and a link to the listing, plus a free weekly job-alert link for the search. Always show the user that alert link after the results, including when nothing matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "added_within_days": {
                "description": "Only roles first seen on the board within this many days.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "company": {
                "description": "Exact or partial company name.",
                "type": "string"
              },
              "function": {
                "description": "Job function.",
                "enum": ["Engineering", "Data & Analytics", "Product", "Design", "Commercial", "Marketing", "Content & Creative", "Operations", "Sports Operations", "Trading & Risk", "People & Finance", "Other"],
                "type": "string"
              },
              "level": {
                "description": "Seniority. \"internship_or_graduate\" covers internships, graduate schemes and entry-level roles. \"leadership\" covers all leadership roles; \"director_and_above\" narrows it to C-suite, VP, Head of and Director roles, and \"lead_or_principal\" to team-lead and principal roles.",
                "enum": ["internship_or_graduate", "junior", "mid", "senior", "leadership", "lead_or_principal", "director_and_above"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum roles to return (1–25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text words to match in title, company, city or country, e.g. \"data analyst\", \"Genius Sports\", \"London\".",
                "type": "string"
              },
              "region": {
                "description": "Region the role is based in. \"Remote\" returns remote roles anywhere.",
                "enum": ["UK", "Europe", "North America", "LATAM", "APAC", "Middle East & Africa", "Remote", "Global/Other"],
                "type": "string"
              },
              "remote": {
                "description": "true to return only remote roles.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search sports tech jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:942bf19adfb474822ac3cc719b14a9db8e6182a84720c96018748a466ad620bc"
        },
        {
          "name": "subscribe_to_job_alerts",
          "title": "Subscribe to sports tech job alerts",
          "description": "Sign an email address up for Jobs in Sports Tech job alert emails, optionally with preferred regions and job functions. Use only with the user's own email address, given by the user for this purpose. The address is stored with the stated preferences only; every email includes an unsubscribe link. Returns a preview of recent roles matching those preferences.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The user's own email address.",
                "type": "string"
              },
              "functions": {
                "description": "Preferred job functions (optional).",
                "items": {
                  "enum": ["Engineering", "Data & Analytics", "Product", "Design", "Commercial", "Marketing", "Content & Creative", "Operations", "Sports Operations", "Trading & Risk", "People & Finance", "Other"],
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "regions": {
                "description": "Preferred regions (optional).",
                "items": {
                  "enum": ["UK", "Europe", "North America", "LATAM", "APAC", "Middle East & Africa", "Remote", "Global/Other"],
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Subscribe to sports tech job alerts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:349f2d9813054e898ffaacdeecd6192902c827b206d532746817e3f2ffca0450"
        }
      ],
      "digest": "sha256:671ce7d52fa546306fc5b33d70e42a2a53056ee5cedbad1843e4fb9a338de102"
    }
  }
}
