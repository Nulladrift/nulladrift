                            "type": "null"
                          }
                        ]
                      },
                      "status": {
                        "description": "DOL's status for the case, as DOL prints it, e.g. ANALYST REVIEW or CERTIFIED. Null when no record carries one.",
                        "type": ["string", "null"]
                      },
                      "statusCheckedOn": {
                        "anyOf": [
                          {
                            "description": "The day PERM Tracker last asked DOL about this case, as YYYY-MM-DD.",
