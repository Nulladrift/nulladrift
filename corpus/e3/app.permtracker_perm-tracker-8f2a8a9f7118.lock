        {
          "name": "get_case",
          "title": "Get a case by its number",
          "description": "One case by number: its status, filing date, employer and, once decided, DOL's record. Covers PERM, prevailing wage, H-1B LCA and H-2A, H-2B and CW-1 (applications, job orders and wage requests). A seasonal case adds its workers, work period and worksite, and the job as DOL accepted it. A pending PERM case adds its filing month's place in the queue. Example: {\"caseNumber\":\"G-100-26045-123456\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "caseNumber": {
                "description": "As DOL prints it: G-100-... for PERM, P-100-... for a prevailing wage request, I-200-... for an H-1B LCA, H-300-..., H-400-..., JO-A-300-... or C-500-... for the seasonal programs. Example: G-100-26045-123456.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["caseNumber"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "The date the data is true for, YYYY-MM-DD, when one applies.",
                "type": ["string", "null"]
              },
              "data": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "description": "One DOL case: its status, dates, employer and job, DOL's decided record once there is one, and for a pending PERM case its place in the queue.",
                    "properties": {
                      "accepted": {
                        "anyOf": [
                          {
                            "additionalProperties": {},
                            "propertyNames": {
                              "type": "string"
                            },
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "H-2A and H-2B only: the job as DOL accepted it (wage, workers, work period, worksite), before any decision."
                      },
                      "caseNumber": {
                        "description": "The case number as DOL prints it, e.g. G-100-26045-123456.",
                        "type": "string"
                      },
                      "decision": {
                        "anyOf": [
                          {
                            "additionalProperties": {},
                            "propertyNames": {
                              "type": "string"
                            },
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "DOL's decided record, once a disclosure file carries the case: status, receivedDate, decisionDate, and by program the occupation, worksite, wage and law firm. Null while the case is pending."
                      },
                      "employer": {
                        "description": "The employer's name as DOL holds it.",
                        "type": ["string", "null"]
                      },
                      "filingDate": {
                        "anyOf": [
                          {
                            "description": "The day the case was filed, as YYYY-MM-DD.",
                            "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "isFinal": {
                        "description": "True once DOL has decided the case or the employer withdrew it.",
                        "type": "boolean"
                      },
                      "jobTitle": {
                        "description": "The job title on the case.",
                        "type": ["string", "null"]
                      },
                      "program": {
                        "description": "Which DOL program the case belongs to: perm (PERM labor certification), pwd (prevailing wage request), lca (H-1B labor condition application) or seasonal (H-2A, H-2B or CW-1).",
                        "enum": ["perm", "pwd", "lca", "seasonal"],
                        "type": "string"
                      },
                      "programName": {
                        "description": "The program in words, e.g. PERM labor certification.",
                        "type": "string"
                      },
                      "queue": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "description": "PERM only: where the case's filing month stands in DOL's queue.",
                            "properties": {
                              "casesFiledThatMonth": {
                                "description": "PERM cases filed in that month.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              "decidedFromThatMonth": {
                                "description": "How many of them DOL has decided.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              "filingMonth": {
                                "description": "The month the case was filed, as YYYY-MM.",
                                "pattern": "^\\d{4}-\\d{2}$",
                                "type": "string"
                              },
                              "pendingFromEarlierMonths": {
                                "description": "Pending PERM cases filed in earlier months, which DOL works first.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              "pendingFromThatMonth": {
                                "description": "How many of them are still pending.",
