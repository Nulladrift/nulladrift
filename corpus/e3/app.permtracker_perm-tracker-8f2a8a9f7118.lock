      "serverInfo": {
        "name": "permtracker",
        "title": "PERM Tracker",
        "version": "1.2.0",
        "websiteUrl": "https://permtracker.app/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Federal records on U.S. employment-based immigration: PERM labor certification, prevailing wage requests, H-1B LCAs, DOL processing times, the State Department visa bulletin and consulates' interview lines, and USCIS's I-140 and I-485 figures. Also PERM Tracker's own figures: the approval shares in its sample of USCIS receipt numbers (estimates with a margin), the timelines people reported (self-reported), and how close its estimates land. Every answer names its source and the page it came from. Cite that page. Estimates are labelled as estimates and make no promise. To read one employer, law firm or occupation, search for it by name first: the search returns the slug the get tool takes.",
      "tools": [
        {
          "name": "estimate_decision",
          "title": "Estimate a PERM decision date",
          "description": "When a pending PERM case is likely to be decided, with the range, the model and its caveats. Send a case number, or a filing date for a case in analyst review. It's an estimate from DOL's measured pace and makes no promise: show the caveats with the date. Example: {\"filed\":\"2026-02-15\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "case": {
                "description": "A PERM case number. Its own status and filing date are used. Example: G-100-26045-123456.",
                "maxLength": 40,
                "type": "string"
              },
              "filed": {
                "description": "A filing date, for a case in analyst review, when there's no case number. Example: 2026-02-15.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "The date the data is true for, YYYY-MM-DD, when one applies.",
                "type": ["string", "null"]
              },
              "data": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "description": "When a pending PERM case is likely to be decided. An estimate from DOL's own pace: it makes no promise.",
                    "properties": {
                      "basis": {
                        "description": "How the estimate was worked out, in a sentence.",
                        "type": "string"
                      },
                      "caveats": {
                        "description": "What the estimate can't know. Show them with the date.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "decisionDate": {
                        "anyOf": [
                          {
                            "description": "The day DOL decided the case, for the decided kind, as YYYY-MM-DD.",
                            "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "earliest": {
                        "description": "The early end of the range, as YYYY-MM-DD.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "estimatedDate": {
                        "description": "The likeliest decision day, as YYYY-MM-DD.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "filingDate": {
                        "anyOf": [
                          {
                            "description": "The filing date the estimate is for, as YYYY-MM-DD.",
                            "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "kind": {
                        "description": "date: an estimated day with a range. no-date: the case is past every model's reach, with a note. none: no model can give a defensible date. decided: the case already has a decision.",
                        "enum": ["date", "no-date", "none", "decided"],
                        "type": "string"
                      },
                      "latest": {
                        "description": "The late end of the range, as YYYY-MM-DD.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "model": {
                        "description": "The model that produced the estimate, by name.",
                        "type": "string"
                      },
                      "note": {
                        "description": "Why there is no date, for the no-date and none kinds.",
                        "type": "string"
                      },
                      "pendingCasesAhead": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Pending PERM cases filed before this one."
                      },
                      "status": {
                        "description": "The status the estimate assumed, e.g. ANALYST REVIEW.",
                        "type": ["string", "null"]
                      },
                      "waitedDays": {
                        "description": "Days the case has waited, for the no-date kind.",
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      }
                    },
                    "required": ["kind"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "description": "No such record. Say so; don't retry the same call.",
                    "properties": {
                      "found": {
                        "const": false,
                        "description": "False: no record matched.",
                        "type": "boolean"
                      },
                      "message": {
                        "description": "What wasn't found and what to try, in a sentence.",
                        "type": "string"
                      }
                    },
                    "required": ["found", "message"],
                    "type": "object"
                  }
                ],
                "description": "The answer, or found: false when no record matched."
              },
              "page": {
                "description": "The page on permtracker.app that shows the same thing. Cite it.",
                "type": "string"
              },
              "source": {
                "description": "Who published the underlying records.",
                "type": "string"
              }
            },
            "required": ["asOf", "data", "page", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
