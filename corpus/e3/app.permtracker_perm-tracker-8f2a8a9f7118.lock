                "anyOf": [
                  {
                    "additionalProperties": {},
                    "description": "The employer page a printed name belongs to, with its PERM record.",
                    "properties": {
                      "employer": {
                        "anyOf": [
                          {
                            "additionalProperties": {},
                            "properties": {
                              "h1bLcas": {
                                "anyOf": [
                                  {
                                    "maximum": 9007199254740991,
                                    "minimum": -9007199254740991,
