                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["caseNumber", "decision", "employer", "filingDate", "isFinal", "jobTitle", "program", "programName", "queue", "status", "statusCheckedOn"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "description": "No such record. Say so; don't retry the same call.",
                    "properties": {
                      "found": {
                        "const": false,
                        "description": "False: no record matched.",
                        "type": "boolean"
                      },
                      "message": {
                        "description": "What wasn't found and what to try, in a sentence.",
                        "type": "string"
                      }
                    },
                    "required": ["found", "message"],
                    "type": "object"
                  }
                ],
                "description": "The answer, or found: false when no record matched."
