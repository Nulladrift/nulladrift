                      "lawFirmUnknown": {
                        "description": "True when a law firm was sent and no firm in the records matches it.",
                        "type": "boolean"
                      },
                      "matched": {
                        "description": "Cases that matched everything sent.",
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "matchedEmployer": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Cases in the days read whose employer matched the name sent."
                      },
                      "period": {
                        "anyOf": [
                          {
                            "additionalProperties": {},
                            "description": "What DOL's record holds for the days read, whatever was asked.",
                            "properties": {
                              "decided": {
                                "description": "How many of them DOL has decided.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              "filed": {
                                "description": "Cases filed in the days read.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              "waiting": {
                                "description": "How many are still waiting.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              }
                            },
                            "required": ["decided", "filed", "waiting"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "program": {
                        "description": "Which DOL program the case belongs to: perm (PERM labor certification), pwd (prevailing wage request), lca (H-1B labor condition application) or seasonal (H-2A, H-2B or CW-1).",
                        "enum": ["perm", "pwd", "lca", "seasonal"],
                        "type": "string"
