            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "block": {
                "description": "IOE and five digits: the first eight characters of an online receipt number. Example: IOE09366.",
                "maxLength": 8,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["block"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "The date the data is true for, YYYY-MM-DD, when one applies.",
                "type": ["string", "null"]
              },
              "data": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "description": "One receipt block: each form's share in each status group with its margin, the blocks either side, and the newest moves the sample saw.",
                    "properties": {
                      "after": {
                        "description": "The nearest later block where the sample holds cases, or null.",
                        "type": ["string", "null"]
                      },
                      "before": {
                        "description": "The nearest earlier block where the sample holds cases, or null.",
                        "type": ["string", "null"]
                      },
                      "block": {
                        "description": "The block: IOE and five digits.",
                        "type": "string"
                      },
                      "forms": {
                        "description": "Each form the sample counted in the block, most counted first.",
                        "items": {
                          "additionalProperties": {},
                          "description": "One form's figures: how many cases the sample counted and the share in each status group.",
                          "properties": {
                            "counted": {
                              "description": "Cases of this form the sample counted here.",
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            "form": {
                              "description": "The USCIS form, e.g. I-485.",
                              "type": "string"
                            },
                            "groups": {
                              "additionalProperties": {
                                "additionalProperties": {},
                                "description": "One status group's figure: the sampled count, the estimated share and its 95% margin.",
                                "properties": {
                                  "count": {
                                    "description": "Sampled cases in this status group.",
                                    "maximum": 9007199254740991,
                                    "minimum": -9007199254740991,
                                    "type": "integer"
                                  },
                                  "estimated": {
                                    "description": "The sample's estimate of how many of the form's cases here are in this group.",
                                    "type": "number"
                                  },
                                  "high": {
                                    "description": "The high end of the 95% margin on that share, from 0 to 1.",
                                    "maximum": 1,
                                    "minimum": 0,
                                    "type": "number"
                                  },
                                  "low": {
                                    "description": "The low end of the 95% margin on that share, from 0 to 1.",
                                    "maximum": 1,
                                    "minimum": 0,
                                    "type": "number"
                                  },
                                  "share": {
                                    "description": "The estimated share of the form's cases here in this group, from 0 to 1.",
                                    "maximum": 1,
                                    "minimum": 0,
                                    "type": "number"
                                  }
                                },
                                "required": ["count", "estimated", "high", "low", "share"],
                                "type": "object"
                              },
                              "description": "By status group: approved, denied, withdrawn, closed, revoked, rfe (USCIS asked for more evidence) and waiting (still pending).",
                              "propertyNames": {
                                "type": "string"
                              },
                              "type": "object"
                            }
                          },
                          "required": ["counted", "form", "groups"],
                          "type": "object"
                        },
                        "type": "array"
                      },
