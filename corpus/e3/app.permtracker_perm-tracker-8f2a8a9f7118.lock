        {
          "name": "find_cases",
          "title": "Find cases without a case number",
          "description": "Find a case from what you know about it: any of the employer's name, words of the job title and the law firm, with one filing day, a range of days or no date. One of them is enough. Each case comes with its number, status, job and filing day, and the answer says what DOL's record holds for the days read. With no employer fitting in a month or less, it returns the employers that did file in those days under a close spelling. Example: {\"employer\":\"Acme\",\"from\":\"2026-01-05\",\"to\":\"2026-01-31\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "employer": {
                "description": "The employer's name, 2 to 120 characters. Inc, LLC and punctuation don't matter. With dates three months apart or less, any word of the name fits; with no dates or a longer range, the start of the name. Example: Acme.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "filed": {
                "description": "One filing day, from 2019-10-01 to today. Not with from or to. Example: 2026-01-30.",
                "maxLength": 10,
                "type": "string"
              },
              "firm": {
                "description": "The law firm's or agent's name, 2 to 120 characters. DOL names a firm only once it decides a case, so the answer holds decided cases only. Example: Fragomen.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "from": {
                "description": "The first filing day of a range. Alone, it is that one day. Example: 2026-01-05.",
                "maxLength": 10,
                "type": "string"
              },
              "job": {
                "description": "Words of the job title, up to 80 characters. Alone, with no dates, it reads the newest three months. Example: controls engineer.",
                "maxLength": 80,
                "type": "string"
              },
              "program": {
                "description": "Which program to search. Example: perm.",
                "enum": ["perm", "pwd", "lca", "seasonal"],
                "type": "string"
              },
              "to": {
                "description": "The last filing day of a range. A range longer than three months needs an employer or a firm. Example: 2026-01-31.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "The date the data is true for, YYYY-MM-DD, when one applies.",
                "type": ["string", "null"]
              },
              "data": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "description": "Cases found without a case number, with what DOL's record holds for the days read.",
                    "properties": {
                      "cases": {
                        "description": "The matching cases, 50 at most.",
                        "items": {
                          "additionalProperties": {},
                          "description": "One case in a search answer.",
                          "properties": {
                            "caseNumber": {
                              "description": "The case number as DOL prints it.",
                              "type": "string"
                            },
                            "decisionDate": {
                              "anyOf": [
                                {
                                  "description": "The day DOL decided the case, as YYYY-MM-DD.",
                                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "employer": {
                              "description": "The employer's name as DOL holds it.",
                              "type": ["string", "null"]
                            },
                            "filedOn": {
                              "anyOf": [
                                {
                                  "description": "The day the case was filed, as YYYY-MM-DD.",
                                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "isFinal": {
                              "description": "True once the case is decided or withdrawn.",
                              "type": "boolean"
                            },
                            "jobTitle": {
                              "description": "The job title on the case.",
                              "type": ["string", "null"]
                            },
                            "lawFirm": {
                              "description": "The law firm on the case. DOL names it only once the case is decided.",
                              "type": ["string", "null"]
                            },
                            "status": {
                              "description": "DOL's status for the case.",
                              "type": ["string", "null"]
                            },
                            "url": {
                              "description": "The case's page on permtracker.app.",
                              "type": "string"
                            },
                            "wageRequest": {
                              "description": "The case number of the prevailing wage request the case used, when DOL's record names one.",
                              "type": ["string", "null"]
                            },
                            "worksiteState": {
                              "description": "The worksite's state, two letters, when DOL's record carries it.",
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["caseNumber", "decisionDate", "employer", "isFinal", "jobTitle", "status", "url", "wageRequest", "worksiteState"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "closeNames": {
                        "description": "With no employer fitting in a month or less: the employers that did file in those days under a close spelling.",
                        "items": {},
                        "type": "array"
                      },
                      "day": {
                        "anyOf": [
                          {
                            "additionalProperties": {},
                            "description": "What DOL's record holds for the days read, whatever was asked.",
                            "properties": {
                              "decided": {
                                "description": "How many of them DOL has decided.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              "filed": {
                                "description": "Cases filed in the days read.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              "waiting": {
                                "description": "How many are still waiting.",
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              }
                            },
                            "required": ["decided", "filed", "waiting"],
                            "type": "object"
