{
  "lockfileVersion": 2,
  "subjects": {
    "app.permtracker/perm-tracker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://permtracker.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "permtracker",
        "title": "PERM Tracker",
        "version": "1.0.0",
        "websiteUrl": "https://permtracker.app/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Federal records on U.S. employment-based immigration: PERM labor certification, prevailing wage requests, H-1B LCAs, DOL processing times and the State Department visa bulletin. Every answer names its source and the page it came from. Cite that page. Estimates are labelled as estimates and make no promise.",
      "tools": [
        {
          "name": "employer_profile",
          "title": "An employer's, law firm's or occupation's PERM record",
          "description": "Cases in DOL's published files (certified, denied, median days to a decision, filings in the last 12 months, and for an occupation the median offered wage), plus how many of its cases are pending at DOL right now and at which stage. Find the slug with search_sponsors first. Example: {\"kind\": \"employer\", \"slug\": \"microsoft-corporation\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "One of \"employer\", \"law firm\" or \"occupation\" (singular).",
                "enum": ["employer", "law firm", "occupation"],
                "type": "string"
              },
              "slug": {
                "description": "From search_sponsors, e.g. google-llc.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff67fb568604240b8fc329350d3c45e534eb97c8a762581aaf6680f7316497bc"
        },
        {
          "name": "estimate_decision",
          "title": "Estimate a PERM decision date",
          "description": "When a pending PERM case is likely to be decided, with a range, the model used and its caveats. Pass a case number, or a filing date for a case in analyst review. It's an estimate and makes no promise. Examples: {\"case_number\": \"G-100-26045-123456\"} or {\"filed\": \"2026-01-15\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "case_number": {
                "description": "A PERM case number.",
                "maxLength": 40,
                "type": "string"
              },
              "filed": {
                "description": "Filing date, YYYY-MM-DD, when there's no case number.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0425ed213bc42033d206817def8dbd01016d702ac188d3bc287c4e00a588d699"
        },
        {
          "name": "find_case",
          "title": "Find a case without its number",
          "description": "A DOL case found without its number, from what someone knows about it: any of the employer's name, words of the job title and the law firm, with one filing day, a range of days or no date. One of them is enough. Each case comes with its number, status, job title and filing day, and the answer says what DOL's record holds for the days read. PERM by default. The program may be pwd (prevailing wage), lca (H-1B) or seasonal (H-2A, H-2B, CW-1). A law firm finds decided cases only, since DOL names it at the decision. A range longer than three months needs an employer or a firm. With no employer fitting in a month or less it returns the employers that filed in those days under a close spelling. Examples: {\"employer\": \"Acme Robotics\", \"filed\": \"2026-01-30\"}, {\"job\": \"controls engineer\", \"from\": \"2026-01-05\", \"to\": \"2026-02-28\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "employer": {
                "description": "The employer's name.",
                "maxLength": 120,
                "type": "string"
              },
              "filed": {
                "description": "One filing day, YYYY-MM-DD. Not with from or to.",
                "maxLength": 10,
                "type": "string"
              },
              "firm": {
                "description": "The law firm's or agent's name. Decided cases only.",
                "maxLength": 120,
                "type": "string"
              },
              "from": {
                "description": "The first filing day of a range, YYYY-MM-DD.",
                "maxLength": 10,
                "type": "string"
              },
              "job": {
                "description": "Words of the job title.",
                "maxLength": 80,
                "type": "string"
              },
              "program": {
                "description": "perm (the default), pwd, lca or seasonal.",
                "maxLength": 12,
                "type": "string"
              },
              "to": {
                "description": "The last filing day of a range, YYYY-MM-DD.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72f398ada7ab6757b1d8405fb55908df5abbf511cbf7d6c07fe295e3edf6360b"
        },
        {
          "name": "find_soc_code",
          "title": "Find a job's SOC code",
          "description": "The SOC occupation codes employers filed a job title under in DOL's PERM, prevailing wage and LCA files, with each code's share of the title's filings. Or a code's title, and for a 2010 code the 2018 codes it became. Examples: {\"query\": \"data scientist\"} or {\"query\": \"15-1132\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "A job title or a SOC code, e.g. data scientist or 15-2051.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:969f5356c45200e9c50c474407c13b41ff489ec11876059a6240c592cc212e4c"
        },
        {
          "name": "lookup_case",
          "title": "Look up a case",
          "description": "One DOL case by number: status, filing date, employer, job and, once decided, DOL's decided record. PERM (G-100-...), prevailing wage (P-100- to P-203-...), H-1B LCA (I-200-...) and H-2A, H-2B or CW-1 numbers. Example: {\"case_number\": \"G-100-26045-123456\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "case_number": {
                "description": "As DOL prints it, e.g. G-100-26045-123456.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["case_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e46abd194ee9ab4852a4f61f9acab05abf8060231573734f1e4b6df9ffcde67e"
        },
        {
          "name": "queue_status",
          "title": "PERM and prevailing wage queues",
          "description": "DOL's processing times today: the month each PERM and prevailing wage queue is working on, average days to a decision, and how many PERM cases are pending from each filing month. Takes no arguments: {}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f5895eea1e9d295978775f17e816c7e71e0093f564538e9c771c5d2f1f9212d"
        },
        {
          "name": "search_sponsors",
          "title": "Find an employer, law firm or occupation",
          "description": "Search DOL's PERM records by name. Returns each match's record and the slug that employer_profile takes. Example: {\"kind\": \"employer\", \"name\": \"Microsoft\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "One of \"employer\", \"law firm\" or \"occupation\" (singular).",
                "enum": ["employer", "law firm", "occupation"],
                "type": "string"
              },
              "name": {
                "description": "Part of the name, 2 to 120 characters, e.g. Microsoft.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["kind", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22d998ef436557d205b86295804d4ce378603b303e25987a8b4a961d5f939bfb"
        },
        {
          "name": "visa_bulletin",
          "title": "Visa bulletin",
          "description": "A visa bulletin's employment and family final action and dates for filing charts, as printed. The newest by default, with months back to June 2005. Examples: {} for the newest, or {\"month\": \"2026-10\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "month": {
                "description": "YYYY-MM. Leave out for the newest.",
                "maxLength": 7,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfafcd2a0d582f4b950f93fc344dc5a75917cc91dd4b566054fdab75290e8701"
        }
      ],
      "digest": "sha256:8b92c92156cd32c36d7435793cbc56ce97cfc969089921af35081f728baee807"
    }
  }
}
