      "tools": [
        {
          "name": "get_rates",
          "title": "Compare shipping rates",
          "description": "Shipping prices for one parcel between two postal codes from USPS, UPS and FedEx, cheapest first, with delivery days and surcharges. Each quote names its source and rateType (retail, list, or a postage reseller's price). Quotes only: nothing is bought and no label is made. Sources that can't quote come back in errors.",
          "inputSchema": {
            "properties": {
              "carriers": {
                "description": "Only these carrier ids (see list_carriers). Omit for all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dimension_unit": {
                "description": "Default in",
                "enum": ["in", "cm"],
                "type": "string"
              },
              "from": {
                "description": "Origin postal code, e.g. 94107",
                "type": "string"
              },
              "from_country": {
                "description": "Origin country, two letters (default US)",
                "type": "string"
              },
              "height": {
                "type": "number"
              },
              "length": {
                "description": "Optional; give length, width and height together",
                "type": "number"
              },
              "residential": {
                "description": "Whether the destination is a home (default false)",
                "type": "boolean"
              },
              "to": {
                "description": "Destination postal code, e.g. 10001",
                "type": "string"
              },
              "to_country": {
                "description": "Destination country, two letters (default US)",
                "type": "string"
              },
              "weight": {
                "description": "Parcel weight, in weight_unit",
                "type": "number"
