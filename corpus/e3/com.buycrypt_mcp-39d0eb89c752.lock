        {
          "name": "get_tournament",
          "title": "Tournament details and standings",
          "description": "One tournament: rules summary, prize pool, prizes by place and the standings (nick and score). For a running\n    tournament the standings are provisional.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the buycrypt.com links (the user's language): en (default), ru, ua, de, es, pt, pl, tr, vi, id, tl, hi, ha, zh, ko, kz, ar, ur",
                "title": "Language",
                "type": "string"
              },
              "top": {
                "default": 10,
                "description": "How many places of the standings to return",
                "maximum": 100,
                "minimum": 1,
                "title": "Top",
                "type": "integer"
              },
              "tournament_id": {
                "description": "Tournament id from list_tournaments",
                "minimum": 1,
                "title": "Tournament Id",
                "type": "integer"
              }
