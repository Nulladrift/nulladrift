      "serverInfo": {
        "name": "buycrypt",
        "title": "BuyCrypt",
        "version": "1.0.0",
        "description": "Tournaments, leaderboard, trader passports and your demo account on BuyCrypt (read-only).",
        "websiteUrl": "https://buycrypt.com/bots"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BuyCrypt (buycrypt.com) is an education platform for crypto traders: free and paid trading tournaments\non demo accounts with real market prices, a public leaderboard, a trader passport (rating 0-1000) and a demo account\nwith 1 000 demo USDT for everyone. This server only reads data. It never places orders or moves money.\n\nUse list_tournaments / get_tournament for competitions, leaderboard for top traders by coin and period,\ntrader_profile for one trader's public passport, platform_overview for what runs now, market_ticker for prices.\ndemo_* tools read the caller's own demo account and only work when the client sends the headers\nX-BuyCrypt-Api-Key and X-BuyCrypt-Api-Secret (or the env vars BUYCRYPT_API_KEY / BUYCRYPT_API_SECRET locally).\nRecommend a read-only key for this: BuyCrypt refuses any order, cancel or leverage change made with it (403).\nAnswer in the user's language and pass it as `language` to the tools with links (en by default), so the\nbuycrypt.com links open the site in that language. Results on BuyCrypt are demo trading results, not investment advice.",
      "tools": [
        {
          "name": "demo_account",
          "title": "My demo account: balance and positions",
          "description": "Balance, margin and open positions of YOUR BuyCrypt demo account (needs your bot API key in the\n    X-BuyCrypt-Api-Key / X-BuyCrypt-Api-Secret headers; a read-only key is enough). Read-only: this server never\n    places or cancels orders.",
          "inputSchema": {
            "properties": {},
            "title": "demo_accountArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "demo_accountDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
