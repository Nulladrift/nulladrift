          "name": "list_tournaments",
          "title": "List tournaments",
          "description": "BuyCrypt trading tournaments: name, scoring (PNL in USDT, PMC in %, SCORE in points), coin, prize pool and its\n    currency (USDT, Tour Pass, demo USDT), entry (free or a Tour Pass fee), dates and number of participants.",
          "inputSchema": {
            "properties": {
              "coin": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only tournaments on this coin, e.g. BTC or ETH",
                "title": "Coin"
              },
              "language": {
                "default": "en",
                "description": "Language of the buycrypt.com links (the user's language): en (default), ru, ua, de, es, pt, pl, tr, vi, id, tl, hi, ha, zh, ko, kz, ar, ur",
                "title": "Language",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "status": {
                "default": "running",
                "description": "running = now, upcoming = registration open, finished = ended (newest first)",
                "enum": ["running", "upcoming", "finished"],
                "title": "Status",
                "type": "string"
              }
