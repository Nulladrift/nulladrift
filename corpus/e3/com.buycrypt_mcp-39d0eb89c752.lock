        },
        {
          "name": "leaderboard",
          "title": "Top traders (leaderboard)",
          "description": "BuyCrypt public leaderboard for one coin and period. Score = sum of the price moves (in % of entry price,\n    signed by direction, no leverage, no size) caught by the trader's closed positions. Only traders who share their\n    statistics are listed. api_bot = the account trades through the bot API.",
          "inputSchema": {
            "properties": {
              "coin": {
                "default": "BTC",
                "description": "Coin of the board, e.g. BTC, ETH, SOL, DOGE, ETC",
                "title": "Coin",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the buycrypt.com links (the user's language): en (default), ru, ua, de, es, pt, pl, tr, vi, id, tl, hi, ha, zh, ko, kz, ar, ur",
                "title": "Language",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "period_days": {
                "default": 30,
                "description": "7 = week, 30 = month, 90 = three months",
                "enum": [7, 30, 90],
                "title": "Period Days",
                "type": "integer"
              }
            },
            "title": "leaderboardArguments",
            "type": "object"
          },
