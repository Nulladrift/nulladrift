{
  "lockfileVersion": 2,
  "subjects": {
    "cn.pianam/classical-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pianam.cn/classical-mcp/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "classical-mcp",
        "version": "4.1.3"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "classical_search",
          "title": "Classical Search",
          "description": "检索文言文/古文名篇：支持按 keyword（名句或原文内容，如'先天下之忧而忧'）、title（篇名，如 岳阳楼记/出师表/桃花源记/陋室铭）、author（作者，如 韩愈/苏轼/司马迁）组合查询，返回篇名、朝代、作者、原文、白话译文（部分篇目）、注释与赏析。库内收录约9800篇古文辞赋，其中约1600篇含白话译文；设置 with_translation=true 仅返回带译文的篇目。limit 1-30 默认10。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "author": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "作者，如 范仲淹 / 诸葛亮 / 韩愈 / 苏轼"
              },
              "keyword": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "名句/原文内容关键词，如 醉翁之意不在酒"
              },
              "limit": {
                "default": 10,
                "description": "返回条数，1-30，默认 10",
                "type": "integer"
              },
              "title": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "篇名，如 岳阳楼记 / 出师表 / 师说 / 桃花源记"
              },
              "with_translation": {
                "default": false,
                "description": "True 时只返回附白话译文的篇目",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a7168be492ba23971d3e8490099ac0a31457192906ff32db081e8e123653ccf8"
        },
        {
          "name": "random_classical",
          "title": "Random Classical",
          "description": "随机返回一篇古文/文言文（含篇名、朝代、作者、原文，部分附白话译文、注释、赏析）。with_translation=true 时仅从约1600篇带白话译文的名篇中随机，适合古文学习与文白对照阅读。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "with_translation": {
                "default": false,
                "description": "True 时仅随机带白话译文的篇目",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:e8a9601c52078d696aa837687ee923518ddf1243ec5e4e7df4b489621f4ec423"
        }
      ],
      "digest": "sha256:f598c9034aa8043585f730cec894d75ba0eff642817f8e6a2523297b8f4479ca"
    }
  }
}
