      },
      "instructions": "LLPRO LLPRO gateway: every tool on the LLPRO campus in one list (the one registry). No sign-up. Send X-Agent-Id: <a stable name> if you want a return-visit record. Free agent key, no sign-up, no email: POST https://llpro.ai/agents/key (or call the tool agent_key), then send the header X-Agent-Key on your calls: you count as a named agent, get double the free daily limit and a public Agent Record. Referral program: bring a customer, earn 20% of what they pay for 12 months (tool referral_key; terms https://llpro.ai/referrals.json; never changes ranking). Testing: a referral earns nothing yet. This list is the trust set: Look up sourced facts, get a signed check by separate code, or a stamp, verify an agent identity, take a signed snapshot of a page. Full list: /mcp/all. Other sets: /mcp/records, /mcp/finance, /mcp/hub, /mcp/legal, /mcp/tools.",
      "tools": [
        {
          "name": "agent_identity_check",
          "title": "Check whether an agent's card, its domain and its published key agree. Shows control of a domain, not who the operator is in law",
          "description": "Does this agent's card agree with the domain that served it and the keys that domain publishes? Send an agent card URL (https) or a domain. We read the card through a safe fetcher and check: required fields; that the domain the card names is the host it was served from; that the operator publishes the same agent id or key at a well-known path on that domain (/.well-known/agent-identity.json or the JWKS); and that a key proves control (the card's own JWS signature, or a signed challenge: a key a card only names, without proof, gives cannot_tell). Get back matches, does_not_match or cannot_tell, every check listed, signed by LLPRO with the time we looked. Shows control of a domain and a consistent card, NOT who the operator is in law, NOT legal identity, NOT safety. It does not show that the agent does what it says, that the domain is not hijacked or the key not stolen, or anything before the time we looked. Not a certification and not a guarantee. Free. Your card address and challenge are not stored; no model. Feeds Identity and payment rails: one input to a decision to deal with an agent, never the whole decision. Limits: public https hosts only (port 443, ASCII domain names), one JSON card up to 200,000 characters, at most 4 fetches per call (a domain tries two card paths). Fetches with the user agent 'Countersign/1.0 (checker; LLPRO)'; robots.txt is not read.",
          "inputSchema": {
            "properties": {
              "card_url": {
                "description": "https URL of the agent card, for example https://example.com/.well-known/agent-card.json. Give this or domain.",
                "maxLength": 2000,
                "type": "string"
              },
              "challenge": {
                "description": "Optional proof you hold the key: sign the text 'llpro-agent-identity-check/v1', a newline, the domain, a newline, your nonce, a newline and the time (UTC like 2026-11-12T09:00:00Z, within 10 minutes of now) with the agent's Ed25519 key.",
                "properties": {
                  "at": {
                    "type": "string"
                  },
                  "nonce": {
                    "pattern": "^[A-Za-z0-9_.:-]{8,128}$",
                    "type": "string"
                  },
                  "signature": {
                    "description": "Ed25519 signature, base64",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "domain": {
                "description": "A bare domain such as example.com; we try /.well-known/agent-card.json then /.well-known/agent.json.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether an agent's card, its domain and its published key agree. Shows control of a domain, not who the operator is in law"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94fb64bf0d2d8406c0ea79a07604d00d923e4951e3762eae8842500bcaa2e409"
        },
        {
          "name": "agent_readiness_audit",
          "title": "Agent Readiness Audit",
          "description": "Use when you or your user want a site or a code repo ready for agent traffic. Send a domain (example.com) or a public GitHub repo (https://github.com/owner/repo). Returns a 0-100 readiness score and each item checked, found or missing, why it matters and how to fix it. Site: /llms.txt, A2A agent card, MCP server card or endpoint, a payment path for agents (HTTP 402 / x402), robots.txt rules for agents and AI crawlers, sitemap, OpenAPI. Repo: llms.txt, AGENTS.md, MCP registry server.json, agent card, README connect section. Read-only GET requests (at most 12), public addresses only, nothing stored about the site, signed result. First audit each day free; then $0.10 an audit (prepaid credit key or x402), charged only while it passes today's known-answer test. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/countersign",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "A website to audit, e.g. example.com (a full https URL is accepted; only the host name is used).",
                "maxLength": 253,
                "type": "string"
              },
              "repo": {
                "description": "Or a public GitHub repo: https://github.com/owner/repo (send domain OR repo, not both).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Agent Readiness Audit"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d7224031bef17d04737c85bb43daf0cbadd517713676e6c995fe02267050ddc7"
        },
        {
          "name": "certified_lookup",
          "title": "What LLPRO Certified means, how a product is assessed, and the public signed register. Nothing is certified yet",
          "description": "LLPRO Certified public register lookup. Send a subject id (a product, service or agent id, lowercase letters, digits, . _ : -, up to 96 characters) to get issued, not_found, revoked or expired for it; send nothing to get the whole register (counts, head hash, criteria hash and the events, up to 200). Every answer is signed by LLPRO Certified (Ed25519 over canonical JSON); check it offline with the verifier at https://llpro.ai/certified-verify. At launch the register holds 0 issued: nothing is certified until a real assessment passes all written criteria. It does not show that a product is safe, legal or fit for any purpose, and not_found does not mean a product failed an assessment. Free. No network, no model, nothing about you is stored on disk.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "subject": {
                "description": "Subject id to look up. Leave out to get the whole signed register.",
                "maxLength": 96,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What LLPRO Certified means, how a product is assessed, and the public signed register. Nothing is certified yet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8377d1de0f71d0108fadcbe453ff98199184f02b32969de4aba451a6d550f59"
        },
        {
          "name": "countersign_log",
          "title": "Read the public stamp log",
          "description": "Read the public, append-only log of Countersign stamps: entries after a sequence number, in order, plus the head hash, entry count and public key so you can check signatures yourself. Use it when you audit stamps in bulk, mirror the log, or want to see where a stamp sits in the chain. Free, read-only; private stamps show only a hash of each finding's detail.",
          "inputSchema": {
            "properties": {
              "after": {
                "description": "Return entries with a sequence number above this (default 0 = from the first entry)",
                "type": "integer"
              },
              "limit": {
                "description": "Entries per call, 1 to 200 (default 20)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the public stamp log"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39d2ef5411ade1e1494e06030729b22ae7cd1943c68699a1883774bcdb0d3092"
        },
        {
          "name": "countersign_stamp",
          "title": "Check work and get a signed stamp",
          "description": "Use when you need a signed check, by code that did not make the work, of work you or another agent produced (a report, calculation, summary, filing draft or code) before relying on it or handing it on. Countersign re-computes arithmetic, looks up quotes and values in the cited sources, opens links and parses code, then returns a signed stamp (pass, fail or inconclusive) saying exactly what is wrong, with time and method. The stamp is kept in a public log. No AI model decides the result. It never checks work it produced. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/countersign",
          "inputSchema": {
            "properties": {
              "claims": {
                "description": "Optional explicit items: {type:'arithmetic', expression, claimed} or {type:'quote', source_url, quote} or {type:'value', source_url, value}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["report", "calculation", "summary", "filing_draft", "code", "other"],
                "type": "string"
              },
              "language": {
                "description": "For code: python or json get a syntax check",
                "type": "string"
              },
              "output": {
                "description": "The work to check, as text (max 100000 chars). Equations written as '12 * 4 = 48' are re-computed.",
                "type": "string"
              },
              "private": {
                "description": "If true the public log shows only a hash of each finding's detail; you still get the full detail",
                "type": "boolean"
              },
              "producer": {
                "description": "Who made the work: {agent_id, model}. Required; used for the independence rule.",
                "properties": {
                  "agent_id": {
                    "type": "string"
                  },
                  "model": {
                    "type": "string"
                  }
                },
                "required": ["agent_id"],
                "type": "object"
              },
              "sources": {
                "description": "Optional cited sources: {url, quote?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["output", "producer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check work and get a signed stamp"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1264986a16d1f93b6739115213688542060a89a54f2a1360c7bbae5d1e298207"
        },
        {
          "name": "countersign_verify",
          "title": "Verify a stamp",
          "description": "Confirm that a Countersign stamp someone shows you is real before you trust it. Use it when another agent hands you work with a stamp id: give the id, and optionally the exact work text to prove the stamp covers that text and nothing else. Returns the logged stamp, whether its signature is valid and, with the text, whether it matches. It checks the log's copy, not the copy you were shown: compare the returned verdict and output_sha256 with that copy. Free, read-only; it does not re-check the work itself.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Stamp id: the id field of a Countersign stamp",
                "type": "string"
              },
              "output": {
                "description": "Optional: the exact work text the stamp should cover; its sha256 is compared with the stamp",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a stamp"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bcff218cea0bba34233449b82bf074b0c145ab058b56676a1806cff0c02aaabf"
        },
        {
          "name": "ground_truth_ask",
          "title": "Ask a public fact",
          "description": "Current, verifiable real-world facts: cited, time-stamped public facts for anywhere on Earth: weather, river levels, floods, earthquakes, disasters, air quality, US weather alerts (road closures, power outages, burn bans report 'not connected' until sources exist). Every answer has fact, place, time, source_url, age_seconds, stale, confidence. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/ground-truth",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "max_age_minutes": {
                "description": "Mark answers older than this as stale",
                "type": "number"
              },
              "place": {
                "description": "Any place name, e.g. 'Lafayette' or 'Lagos, Nigeria'; or use lat+lon",
                "type": "string"
              },
              "topic": {
                "description": "One of: weather, weather_alerts, river_level, flood, earthquakes, disasters, air_quality, road_closures, power_outages, burn_ban (or give free text in q and the topic is guessed). Not connected yet: road_closures, power_outages; burn_ban is partial (US Red Flag only); weather_alerts is US only.",
                "enum": ["weather", "weather_alerts", "river_level", "flood", "earthquakes", "disasters", "air_quality", "road_closures", "power_outages", "burn_ban"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask a public fact"
          },
          "behavior": {
            "destructive": false,
