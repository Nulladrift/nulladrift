        {
          "name": "countersign_stamp",
          "title": "Check work and get a signed stamp",
          "description": "Use when you need a signed check, by code that did not make the work, of work you or another agent produced (an invoice or purchase order total, a report, calculation, summary, filing draft or code) before relying on it or handing it on. Countersign re-computes arithmetic, looks up quotes and values in the cited sources, opens links and parses code, then returns a signed stamp (pass, fail or inconclusive) saying exactly what is wrong, with time and method. The stamp is kept in a public log. No AI model decides the result. It never checks work it produced. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/countersign",
          "inputSchema": {
            "properties": {
              "claims": {
