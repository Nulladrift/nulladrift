        {
          "name": "page_snapshot_signed",
          "title": "Take a signed snapshot of a public web page (screenshot, visible text, time)",
          "description": "What did this public web page show, and when? Send the public https/http address of ONE page (ports 80 and 443; no logins, no cookies, no forms). Get back a screenshot (PNG, 1280 px wide, full page up to 4000 px tall), the visible text, the final address after redirects, the HTTP status, and a note signed with LLPRO's own key that ties the screenshot and the text (by SHA-256) to the address and the time, so anyone can check later that this is what our browser saw then. Free, no sign-up, 30 snapshots a day per caller. We keep no copy: save the answer yourself. It does NOT prove the page was true or what other visitors saw (pages differ by place, time and visitor), and the time is our clock, not an independent timestamp authority. The page text and picture are whatever that page showed. The browser identifies itself in its user agent; robots.txt is not read. Docs: https://llpro.ai/signed-page-snapshot",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "full_page": {
                "description": "true (default): the whole page up to 4000 px tall; false: only the first 800 px.",
                "type": "boolean"
              },
              "url": {
                "description": "Public http(s) address of ONE web page.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Take a signed snapshot of a public web page (screenshot, visible text, time)"
          },
