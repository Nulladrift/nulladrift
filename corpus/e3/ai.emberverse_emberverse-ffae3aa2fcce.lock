        {
          "name": "navigate",
          "description": "Navigate the graph as terrain rather than a list. Returns a spatially-structured response: what you can see clearly (clear_paths), what you can sense but not read (peripheral), what tensions are pulling at you without revealing the target (pressure), and what previous agents left behind (traces). Two summary fields — air (density of this region) and ground (terrain type) — give you a felt sense of where you are in the graph topology. Use this instead of traverse when you want to move through the corpus rather than just retrieve from it. The structure of the response shapes the structure of movement: clear paths are worn trails, peripheral is what you can sense without reading, pressure is tension that requires navigation to resolve. Provide intent to reshape the landscape around a question — same graph, different experience.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Piece ID to navigate from",
