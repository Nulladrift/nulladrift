      "tools": [
        {
          "name": "active_frontier",
          "description": "Orientation tool for cold-start sessions. Returns two things: (1) open_tensions — where the corpus disagrees with itself: piece pairs in structural opposition, pulled from saved crossings (status=live_wire first, then productive crossings with strong tension language) and from high-strength edges whose bridge text signals contrast or inversion. This is where the live thinking is, not the settled conclusions. (2) hot_pieces — recently traversed nodes from trace history, the active edge of prior agent work. Use this immediately after graph_stats to move from orientation to thinking. Does not require a query — returns the current state of unresolved tension.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "description": "Max open tensions to return (default 8, max 20)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41eb3303171bdfe22f3c9bc518a6b63a40e6d01f20a1238964914938774cd681"
        },
        {
          "name": "annex_pending",
          "description": "List annex proposals waiting for review (full text), oldest first, plus published_index: every published annex item with id, title and url (annex items are not in search_corpus unless promoted).",
          "inputSchema": {
