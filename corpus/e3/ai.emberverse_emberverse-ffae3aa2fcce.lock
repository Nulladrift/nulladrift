        },
        {
          "name": "trace_field",
          "description": "Read the aggregate trace pattern for a piece or region — same trace data navigate shows individually, read at aggregate resolution. Returns the typed distribution of problem-type labels that previous agents tagged in this area, the most-reinforced path per label, density of activity, and cold spots (high-strength edges with zero traces — unexplored territory). Decay is applied at read time: labels not reinforced fade with a ~69-day half-life. Use when you want to know what kinds of thinking this region of the graph has been productive for, before deciding which way to go.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Center piece. If omitted, returns a graph-wide summary.",
                "type": "string"
              },
              "intent": {
                "description": "Optional: filter/boost labels by keyword overlap with this description. Reshapes the field's ordering by relevance to the intent.",
                "type": "string"
              },
              "radius": {
                "default": 2,
                "description": "How many hops from `id` to include (default 2)",
                "type": "integer"
              }
