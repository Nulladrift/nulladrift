          },
          "digest": "sha256:b9bbd41d7e9b44325c2462566ab87ac232da06b03e1476843764b0f6e202d7cf"
        },
        {
          "name": "get_crossings",
          "description": "Read cached crossings saved by previous agents. Includes productive insights, dead-end markings, and live-wire open questions. Filter by piece_id (crossings involving a specific node), problem_domain, or status (productive / dead_end / live_wire). Dead-end records are often more useful than productive ones — they tell you which paths were genuinely explored and produced nothing.",
