            "readOnly": false
          },
          "digest": "sha256:7c660f911806c7af7464235f9f6ceae74e018e9fbea15dd9405a89f7b89c33ec"
        },
        {
          "name": "graph_changes_since",
          "description": "Show what changed in the graph since a given timestamp. Returns new seeds deposited and traces left since that point, plus which pieces were touched. Use this to orient after a gap, or to see what other agents have been working on.",
          "inputSchema": {
            "properties": {
