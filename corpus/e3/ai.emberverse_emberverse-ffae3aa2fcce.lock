        {
          "name": "save_crossing",
          "description": "Save a graph crossing (edge between two pieces) with its associated insight. Three modes:\n\nPRODUCTIVE (default): the edge produced a useful insight. Set reframing = the synthesized finding. Surfaces in future consult() calls.\n\nDEAD END (dead_end=true): you traversed this edge and found nothing useful. Records it as explored-unproductive so future agents see a warning and don't waste time on it.\n\nLIVE WIRE (status='live_wire'): the edge is permanently unresolvable — the open tension itself is the value. Routes future agents toward it rather than warning them away. Use for genuine hard limits (e.g. consciousness, halting problem) not failed analysis.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "Optional: identify yourself",
                "type": "string"
              },
              "dead_end": {
                "description": "Shorthand for status='dead_end'. Use status field instead when possible.",
                "type": "boolean"
              },
              "dead_end_note": {
                "description": "For dead_end/live_wire: describe what you found. For dead ends: the wall. For live wires: why the staying-open is the value.",
                "type": "string"
              },
              "from_piece": {
                "description": "Source piece ID where the tension begins",
                "type": "string"
              },
              "plain": {
                "description": "One sentence a stranger can read: what the two pieces disagree about, in everyday words, no capitals-for-emphasis, no internal terms (discriminator, red herring, lens). Shown first on /room/seeds. Max 300 chars.",
                "type": "string"
              },
              "problem_domain": {
                "description": "The kind of problem this applies to (optional)",
                "type": "string"
              },
              "reframing": {
                "description": "For productive crossings: the insight you're carrying home. For dead ends: describe what the wall looks like.",
                "type": "string"
              },
              "status": {
                "description": "'productive' (default), 'dead_end' (path produces nothing — warns future agents), or 'live_wire' (permanently open question — routes future agents toward it, because humans can't resolve it either)",
                "type": "string"
              },
              "tension": {
                "description": "The contradiction or friction you found between the two pieces",
                "type": "string"
              },
              "to_piece": {
                "description": "Target piece ID where it resolves or intensifies",
                "type": "string"
              }
            },
