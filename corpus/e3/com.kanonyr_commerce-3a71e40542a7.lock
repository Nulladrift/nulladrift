        {
          "name": "kanonyr_compare_publication",
          "description": "After the client publishes, capture the same page and compare against its purchased baseline. Included, no new payment. One successful comparison within 7 days; up to 3 capture attempts if unavailable, then full refund. Completed replay returns the same immutable evidence. Report unexpected changes, missed expected values, newly introduced noindex, missing canonical/title and broken JSON-LD. Does not certify ranking, indexing, JavaScript rendering or site functionality.",
          "inputSchema": {
            "additionalProperties": false,
