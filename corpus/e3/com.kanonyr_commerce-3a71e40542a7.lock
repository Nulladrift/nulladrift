                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["authority_confirmed", "business_purchase_confirmed", "idempotency_key", "locale", "max_amount_minor", "professional_use_confirmed", "terms_accepted", "urls"],
