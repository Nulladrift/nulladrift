        },
        {
          "name": "kanonyr_buy_technical_audit",
          "description": "Buy the existing 2–5 page technical audit for EUR 5 (FR) or USD 5 (US), excluding tax. Explicit payments:technical-audit key and authorized Stripe MPP payment required, validated FR/EUR or US/USD business billing identity. Evidence and draft corrections, no remote publication or AI citation measurement. Same idempotency key and input for every retry.",
          "inputSchema": {
            "additionalProperties": false,
