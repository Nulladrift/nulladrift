      },
      "instructions": "Free inspection → explicit authorized purchase → correction → verification. Publication checks: buy and wait for the baseline, let the client publish, then call compare_publication for the included comparison. Use an MPP-capable client, or pass card_payment_url to the owner for explicit card approval. No prepaid credits, autonomous publishing or promised ranking. Paid tools require an authorized account key; configure it in https://kanonyr.com/app/agents?hl=fr. Never buy without the user’s spending authority.",
      "tools": [
        {
          "name": "kanonyr_buy_schema_repair",
          "description": "Buy one eligible WebPage JSON-LD correction with evidence, validation and one live check: EUR 2 (FR) or USD 2 (US), excluding tax, no credits or subscription. Requires explicit payments:schema-repair key, validated FR/EUR or US/USD business billing identity, accepted B2B terms and payer-authorized Stripe MPP credential. The owner may instead open card_payment_url and authorize the same order by card. Only buy after inspect_page reports eligible. Client applies with its own publishing authority; stop on conflicts. Payment is handled by the MPP client, never put payment credentials in arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "authority_confirmed": {
                "const": true
              },
              "business_purchase_confirmed": {
                "const": true
              },
              "currency": {
                "default": "EUR",
                "enum": ["EUR", "USD"],
                "type": "string"
              },
              "idempotency_key": {
                "format": "uuid",
                "type": "string"
              },
              "inspection_id": {
                "format": "uuid",
                "type": "string"
              },
              "locale": {
                "enum": ["fr", "en"],
                "type": "string"
              },
              "max_amount_minor": {
                "const": 200
              },
              "professional_use_confirmed": {
                "const": true
              },
              "source_html_sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "terms_accepted": {
                "const": true
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["authority_confirmed", "business_purchase_confirmed", "idempotency_key", "inspection_id", "locale", "max_amount_minor", "professional_use_confirmed", "source_html_sha256", "terms_accepted", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
