{
  "lockfileVersion": 2,
  "subjects": {
    "com.alternativasia/alternativasia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://alternativasia.com/api/mcp/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "alternativasia",
        "version": "1.20.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Alternativas IA responde a una sola pregunta: ¿qué puedo usar en lugar de esta herramienta de IA?\n\nOrden habitual: list_alternatives con el slug del producto conocido (\"chatgpt\", \"notion-ai\", \"figma\") -> get_tool para el detalle completo de una candidata. Usa search_tools cuando el usuario diga una palabra clave o una categoría en vez de un producto.\n\nSlugs: list_alternatives recibe como target el slug del producto conocido. Cada resultado se identifica por el slug de su propia ficha, tomado de una toolUrl (\"/tools/<slug>\" -> \"<slug>\"); no lo inventes.\n\nHonestidad de los datos: los ingresos se marcan como verificados (conectados con Stripe) o declarados por la propia empresa, y las dos cosas no son intercambiables. Una ficha se publica solo después de verificar el badge. Las posiciones de pago van siempre señaladas y nunca cambian el rel de un enlace. Aquí no hay puntuaciones ni reseñas, así que no menciones ninguna.\n\nsubmit_tool busca el badge de este sitio en la URL enviada. Si lo encuentra, la ficha entra en la cola de revisión sin necesidad de cuenta y se publica en un plazo de 7 días si supera la revisión. Si no, se guarda como BORRADOR privado: cuando el badge esté en la página, una comprobación posterior lo pone en cola; o quien creó la herramienta se registra con el mismo correo y lo reclama. create_checkout devuelve una URL que debe abrir una PERSONA — nunca intentes pagar tú.",
      "tools": [
        {
          "name": "create_checkout",
          "title": "Create a checkout link for a paid add-on",
          "description": "Create a Stripe checkout URL for one paid add-on on one listing, and return it for a HUMAN to open. Never present this as a completed purchase: nothing is charged until a person completes checkout in a browser. Returns an error when the listing doesn't exist, the add-on isn't purchasable yet (free early access), or payments aren't configured in this environment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "product": {
                "description": "Add-on key: premium_launch, review_one, review_monthly, network_all, network_three. See list_offers for names, effects, and prices.",
                "enum": ["premium_launch", "review_one", "review_monthly", "network_all", "network_three"],
                "type": "string"
              },
              "slug": {
                "description": "The listing's slug (as in a toolUrl, e.g. '/tools/acme-writer' -> 'acme-writer').",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkoutUrl": {
                "description": "A URL a HUMAN must open. Nothing is charged until a person completes it.",
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "instruction": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e8edf74ed50735d9bb0d0b3ea3eeb562bad920ceb4939ed8df7996dd3f68c05"
        },
        {
          "name": "get_tool",
          "title": "Get AI tool detail",
          "description": "Fetch the full public detail for one AI tool by its listing slug (as returned by search_tools' toolUrl, e.g. '/tools/acme-writer' -> slug 'acme-writer'). Call this after search_tools to get a tool's full description, launch date, revenue signals (verified or self-reported), and for-sale status. Returns null if the slug doesn't resolve to a live Alternativas IA listing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The tool's listing slug.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "tool": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "askingPriceUsd": {
                        "type": "number"
                      },
                      "category": {
                        "type": "string"
                      },
                      "description": {
                        "type": "string"
                      },
                      "faviconUrl": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "forSale": {
                        "const": true,
                        "type": "boolean"
                      },
                      "launchDate": {
                        "description": "ISO 8601 timestamp of the real launch date.",
                        "type": "string"
                      },
                      "logoUrl": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "name": {
                        "type": "string"
                      },
                      "ogImageUrl": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "revenueVerifiedAt": {
                        "description": "ISO 8601 timestamp of the last Stripe verification.",
                        "type": "string"
                      },
                      "selfReported": {
                        "const": true,
                        "description": "Marks selfReportedMrrUsd as unverified. Never report it as verified.",
                        "type": "boolean"
                      },
                      "selfReportedMrrUsd": {
                        "description": "Present only when the figure is the maker's own claim.",
                        "type": "number"
                      },
                      "tagline": {
                        "type": "string"
                      },
                      "toolUrl": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      },
                      "verifiedMrrUsd": {
                        "description": "Present only when the maker connected Stripe.",
                        "type": "number"
                      }
                    },
                    "required": ["category", "description", "faviconUrl", "launchDate", "logoUrl", "name", "ogImageUrl", "tagline", "toolUrl", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "null when the slug does not resolve to a live listing on this site."
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:052ec710badba856eaf7b2e431aa71d2a762c291406383213ece76a9dcb850ef"
        },
        {
          "name": "list_alternatives",
          "title": "List alternatives to a tool",
          "description": "List live, same-category alternatives to a well-known AI tool (e.g. 'chatgpt', 'notion-ai', 'figma'). Call this when a user asks 'what are the alternatives to X' or wants competitors/substitutes for a named product. `target` is the well-known tool's slug, not a listing slug from this catalog.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "target": {
                "description": "Slug of the well-known target tool, e.g. 'chatgpt'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "tagline": {
                      "type": "string"
                    },
                    "toolUrl": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "tagline", "toolUrl"],
                  "type": "object"
                },
                "type": "array"
              },
              "target": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "null when the target slug is not a known product."
              }
            },
            "required": ["alternatives", "target"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cc59a4d54a353f324bbe6d026eb88517508a87597efe4eadbee93e863a6d3c2"
        },
        {
          "name": "list_offers",
          "title": "List paid add-ons (offers)",
          "description": "List the optional paid add-ons a maker can buy to promote their listing (name, one-sentence effect, price in USD). Listing is always free; these only ADD reach and are always labeled 'Sponsored'. Call this to see what's purchasable before create_checkout. During free early access (early-bird), offers are not yet purchasable and this says so (purchasable=false).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "note": {
                "type": "string"
              },
              "offers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "priceUsd": {
                      "type": "number"
                    },
                    "whatItDoes": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "name", "priceUsd", "whatItDoes"],
                  "type": "object"
                },
                "type": "array"
              },
              "purchasable": {
                "description": "False during free early access — nothing can be bought.",
                "type": "boolean"
              },
              "site": {
                "type": "string"
              }
            },
            "required": ["note", "offers", "purchasable", "site"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39212c39afcbc1991ea802cebbd5141d595eaf3462ebac4681d34bc9693f11b1"
        },
        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Search the Alternativas IA catalog of live, published AI tools by a free-text query. Matches on tool name, tagline, or category name (case-insensitive substring). Call this first when a user asks to find, discover, or compare AI tools by keyword, use-case, or category (e.g. 'agents', 'writing assistants'). Returns up to 20 results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Free-text search term, e.g. a tool name, use-case, or category.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "description": "Matching live listings, newest first, capped at 20.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "faviconUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "logoUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "type": "string"
                    },
                    "site": {
                      "type": "string"
                    },
                    "tagline": {
                      "type": "string"
                    },
                    "toolUrl": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "faviconUrl", "logoUrl", "name", "site", "tagline", "toolUrl", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b05da70a35a4fd6128b70ea17ee2e894da28f4cadfe7512b0c5010b4ed97667a"
        },
        {
          "name": "submit_tool",
          "title": "Submit a new AI tool",
          "description": "Submit a new AI tool to Alternativas IA on behalf of its maker. We fetch the submitted url and look for the Alternativas IA badge. Badge found (status QUEUED): no account is needed — the badge proves the maker controls the site. The listing enters the free review queue and goes live within 7 days if it passes review; the result has its listingUrl. Badge not found (status DRAFT): the listing is a private draft. The result carries badgeHtml — once it is on the page, a later re-check queues the draft (drafts are re-checked in rotation, 25 per run, one run every 6 hours, for 90 days), so do not submit again — and a claimUrl where the maker can sign up with the same email instead. Refused: our own domains, private or non-https hosts (error reserved_host), and a host that already has a live, queued or pending listing (error duplicate_host). Call this only when a user explicitly wants to list their own tool — never to submit a tool on someone else's behalf without their email. Rate-limited globally to 5 submissions per hour. Supply tagline, problemSolved, logoUrl and imageUrls whenever you can: they are what make the published listing look like a real product page rather than a stub.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category slug, e.g. 'agents', 'writing', 'coding', 'design', 'marketing', 'productivity', 'video', 'analytics'.",
                "type": "string"
              },
              "description": {
                "description": "A description of the tool (40-1000 chars).",
                "maxLength": 1000,
                "minLength": 40,
                "type": "string"
              },
              "email": {
                "description": "The maker's email. Kept as the contact address; signing up with it on this site attaches the listing to the maker's account.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "imageUrls": {
                "description": "Up to 5 https screenshot URLs, best first. Copied to our own storage. Without any, the listing shows a generated placeholder card instead of a real screenshot.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "logoUrl": {
                "description": "https URL of the tool's logo. We copy it to our own storage — we never hotlink the maker's host.",
                "format": "uri",
                "type": "string"
              },
              "name": {
                "description": "The tool's name.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "problemSolved": {
                "description": "What problem the tool solves, in the maker's words (max 160 chars). Rendered as its own block on the listing page.",
                "maxLength": 160,
                "type": "string"
              },
              "tagline": {
                "description": "One line shown on every card (max 60 chars). Supply it — without one we fall back to a truncated description.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "url": {
                "description": "The tool's https homepage URL.",
                "format": "uri",
                "type": "string"
              },
              "xHandle": {
                "description": "X/Twitter handle, without the @.",
                "type": "string"
              },
              "xHandleIsFounder": {
                "description": "True when the handle is the founder's personal account rather than the product's.",
                "type": "boolean"
              }
            },
            "required": ["category", "description", "email", "name", "url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "badge": {
                "description": "Result of the badge check on the submitted url.",
                "enum": ["verified", "missing"],
                "type": "string"
              },
              "badgeHtml": {
                "description": "DRAFT only: the badge HTML to put, unmodified and visible, on the submitted url. Drafts are re-checked in rotation (25 per run, one run every 6 hours, for 90 days).",
                "type": "string"
              },
              "claimUrl": {
                "description": "Where the maker signs up with the same email to manage (QUEUED) or claim (DRAFT) the listing. Present only when ok is true.",
                "type": "string"
              },
              "error": {
                "description": "invalid_input, bad_category, rate_limited, reserved_host (our own or a private host), or duplicate_host.",
                "type": "string"
              },
              "listingUrl": {
                "description": "The listing's public page. QUEUED only; it returns 404 until the listing goes live.",
                "type": "string"
              },
              "message": {
                "description": "What happened and what the maker can do next.",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "status": {
                "description": "QUEUED: the badge was found on the submitted url; the listing is in the review queue with no account and goes live within 7 days if it passes review. DRAFT: no badge found; a private draft. Present only when ok is true.",
                "enum": ["QUEUED", "DRAFT"],
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08b8ccb693b7cdedffb0edd020fdb82800a2d4f3aa7da4849884eb90305c3f8a"
        }
      ],
      "digest": "sha256:fd4c9da07509329875200d697329aa51d210c4c10b9b016247f091e21d774cf6"
    }
  }
}
