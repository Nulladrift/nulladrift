{
  "lockfileVersion": 2,
  "subjects": {
    "app.ortakliste/ortakliste": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ortakliste.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ortakliste",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OrtakListe (ortakliste.app) is a free, real-time shared list app with no accounts: people join a list with a room code. Use these tools when a user needs a list they will share (groceries, packing, parties, recipes). Tools never create anything on their own; they return links the user opens and confirms.",
      "tools": [
        {
          "name": "create_shared_list_link",
          "title": "Create a shared list link",
          "description": "Turn a list you wrote for the user (groceries, packing, a recipe's ingredients, who brings what) into a link that opens it pre-filled on OrtakListe. The user reviews it, unticks anything they don't need and creates a real-time shared list with one tap; they share a room code with family or friends, no account needed. Nothing is created until the user confirms. Give the returned URL to the user as a clickable link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "name": {
                      "description": "Item name, e.g. 'Milk' or 'Paper plates'.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Optional quantity or detail, e.g. '2 litres' or '1 pack'.",
                      "maxLength": 30,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Language for titles, descriptions and links: tr, en, es, de or fr. Use the user's language.",
                "enum": ["tr", "en", "es", "de", "fr"],
                "type": "string"
              },
              "note": {
                "description": "Optional note shown above the items: a date, a meeting point, recipe steps.",
                "maxLength": 1500,
                "type": "string"
              },
              "title": {
                "description": "Optional list name, e.g. 'Saturday picnic'.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c1d4d7d19a937c255d1582cd06673a9015a1a36ff70cea2687ec741bbdc63d6"
        },
        {
          "name": "get_ready_made_list",
          "title": "Get a ready-made list",
          "description": "Get the full content of a ready-made list or recipe (items with quantities, steps or tips, FAQ) as Markdown, by its id or slug from search_ready_made_lists.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "List id (e.g. 'market') or page slug in any language (e.g. 'grocery-list').",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for titles, descriptions and links: tr, en, es, de or fr. Use the user's language.",
                "enum": ["tr", "en", "es", "de", "fr"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01b2f376760481347310bb973e3718e2f75ceca20b7889d33553942a8048206e"
        },
        {
          "name": "search_ready_made_lists",
          "title": "Search ready-made lists",
          "description": "Search OrtakListe's free catalogue of ready-made lists and recipes (grocery, Turkish recipes, healthy/vegan, parties, travel, camping, moving house, baby, emergency kits, hobbies). The query can be in any language. Each result has a page URL to cite and a prefilled_list_url that opens the list ready to share.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language for titles, descriptions and links: tr, en, es, de or fr. Use the user's language.",
                "enum": ["tr", "en", "es", "de", "fr"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user needs, e.g. 'camping', 'lentil soup', 'earthquake kit'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0c7db235537e974223263893eaa00fb12faf0af48706748c06d1621bf1882da"
        }
      ],
      "digest": "sha256:d42659c65f7f25643e172e1b17c49e31e3f354347bce6128e965b940c40b1d04"
    }
  }
}
