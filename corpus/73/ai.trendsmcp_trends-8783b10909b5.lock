      "tools": [
        {
          "name": "trends___get_context",
          "description": "What people are posting, reading and betting about a keyword right now, or with hashtag=true the top TikTok and Instagram posts on one hashtag. Returns recent posts, videos, news stories, discussions and prediction markets per source, with engagement (views, likes, score) and top comments. Use it to explain why something is trending or what the conversation says; get_time_series and get_growth measure how much. Costs 1 request per data type (source or board) in the call; boards cost 1 request per 10 rows. Only data types that answer are charged; the answer says requests_charged. Returns a plan-limit message when the request is rate limited or the monthly quota is used up.",
          "inputSchema": {
            "properties": {
              "comments": {
                "description": "Top comments for the first N items of each source, 0 to 5. Default 2. Only for 'YouTube', 'TikTok', 'Instagram', 'X', 'Reddit', 'Bluesky', and 'Hacker News'.",
                "type": "integer"
              },
              "days": {
                "description": "Look back this many days, 1 to 30. Default 7.",
                "type": "integer"
              },
              "hashtag": {
                "description": "true: treat keyword as one exact hashtag (with or without #) and return the platform's own top posts for it, instead of a keyword search. Only for 'TikTok', and 'Instagram'; other sources search the keyword as usual. Default false.",
                "type": "boolean"
              },
              "keyword": {
                "description": "Any name or phrase, e.g. 'nintendo switch 2'.",
                "type": "string"
              },
              "limit": {
                "description": "Items per source, 1 to 20. Default 10.",
                "type": "integer"
              },
              "source": {
                "description": "One source, several comma-separated, or 'all': 'all' = 10 ('News', 'YouTube', 'TikTok', 'Instagram', 'X', 'Reddit', 'Bluesky', 'Hacker News', 'Polymarket', and 'GitHub'), costing 10. Valid: 'News', 'YouTube', 'TikTok', 'Instagram', 'X', 'Reddit', 'Bluesky', 'Hacker News', 'Polymarket', 'GitHub'.",
                "type": "string"
              }
            },
            "required": ["keyword", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Context"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:20176d6581933d69cdfe7a48b620f243e9201a2f2f0ba211725e1aafb8a7f344"
        },
        {
          "name": "trends___get_growth",
          "description": "Point-to-point growth for a keyword on one or more sources. Each window is a preset string (12M, 3M, YTD, and the other listed periods). Values are on a 0-100 scale, plus absolute volume when available. Designed for growth questions; for charting or custom math, get_time_series provides the full series. App Downloads and App Rankings are keyword sources (Android bundle ID). They are not the App Store / Google Play live boards on get_top_trends. Costs 1 request per data type (source or board) in the call; boards cost 1 request per 10 rows. Only data types that answer are charged; the answer says requests_charged. Returns a plan-limit message when the request is rate limited or the monthly quota is used up.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO 3166-1 alpha-2 code (US, GB, JP). Aliases like 'UK' or 'United Kingdom' resolve too. Only for Google Search, Google Images, Google News, Google Shopping, YouTube, TikTok, and Pinterest. Google defaults to worldwide, TikTok to US; with a country the data is fetched live.",
                "type": "string"
              },
              "keyword": {
                "description": "What to look up. The string format is required by source. Standard sources (Google Search, Google Images, Google News, Google Shopping, YouTube, Wikipedia, TikTok, Amazon, Pinterest): any name or phrase, e.g. 'nike'. npm: Exact npmjs.com package name, case-sensitive. Right: 'react', '@babel/core'. Wrong: 'React', 'React.js'. Python: Exact PyPI project name. Right: 'pandas', 'requests'. Wrong: 'Pandas'. Steam: Game display name in plain English, not a Steam App ID. Right: 'Elden Ring', 'CS2'. First Steam store search result wins, so use an unambiguous name. App Downloads and App Rankings: Android bundle ID only (the id= value on Google Play). Right: 'com.openai.chatgpt', 'com.whatsapp'. Wrong: 'ChatGPT', 'WhatsApp', an iOS App Store ID, or a bundle ID that is not Android. Find it at play.google.com/store/apps/details?id=THIS_PART. If the request includes App Downloads or App Rankings with other sources, keyword must still be the Android bundle ID.",
                "type": "string"
              },
              "language": {
                "description": "Optional language edition code (en, de, ja, pt). Only for Wikipedia. Default en; other languages are fetched live.",
                "type": "string"
              },
              "percent_growth": {
                "description": "Growth windows. Default if omitted: ['12M']. Each item must be a preset string: '7D', '1W', '14D', '2W', '30D', '1M', '2M', '3M', '6M', '9M', '12M', '1Y', '18M', '24M', '2Y', '36M', '3Y', '48M', '4Y', '60M', '5Y', 'MTD', 'QTD', 'YTD'. Every preset is a two-date comparison.",
                "items": {
                  "description": "A preset period such as '12M', '3M', or 'YTD'.",
                  "type": "string"
                },
                "type": "array"
              },
              "resolution": {
                "description": "Optional. 'weekly' (default, about 5 years) or 'daily' (last 90 days, fetched live). Only for Google Search, Google Images, Google News, Google Shopping, and YouTube.",
                "type": "string"
              },
              "source": {
                "description": "One source, comma-separated sources (e.g. 'Amazon, TikTok, YouTube'), or 'all': 'all' = 9 ('Google Search', 'Google Images', 'Google News', 'Google Shopping', 'YouTube', 'Wikipedia', 'TikTok', 'Amazon', and 'Pinterest'), costing 9. Valid: 'Google Search', 'Google Images', 'Google News', 'Google Shopping', 'YouTube', 'Wikipedia', 'TikTok', 'Amazon', 'Pinterest', 'npm', 'Python', 'Steam', 'App Downloads', 'App Rankings'.",
                "type": "string"
              }
            },
            "required": ["keyword", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Growth"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f41cda982f4340e37f43c6c93d2f18004c8de5b79c69bb4a1de4bfa1af3077fc"
        },
        {
          "name": "trends___get_reviews",
          "description": "What customers say about a brand, app, product or place. Returns, per source, the matched listing with its all-time rating and review count, the newest reviews (stars, text, the company's reply) and a summary (average stars, star counts, share negative, share replied). Use it for brand sentiment and complaints; get_context covers social posts. Costs 1 request per data type (source or board) in the call; boards cost 1 request per 10 rows. Only data types that answer are charged; the answer says requests_charged. Returns a plan-limit message when the request is rate limited or the monthly quota is used up.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Store country, ISO code (US, GB, DE). Default US. Only for 'App Store', 'Google Play', and 'Amazon'.",
                "type": "string"
              },
              "days": {
                "description": "Only reviews from the last N days, 1 to 365. Default 90.",
                "type": "integer"
              },
              "keyword": {
                "description": "A brand, app, product or place name, e.g. 'notion'. Each source matches it to one listing and returns that listing as subject; check it is the one you meant.",
                "type": "string"
              },
              "limit": {
                "description": "Reviews per source, newest first, 1 to 20. Default 10.",
                "type": "integer"
              },
              "source": {
                "description": "One source, several comma-separated, or 'all': 'all' = 3 ('App Store', 'Google Play', and 'Amazon'), costing 3. Valid: 'App Store', 'Google Play', 'Amazon'.",
                "type": "string"
              }
            },
            "required": ["keyword", "source"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7e1585722f1ddbeaf2deb682b8e5c0e20bc1eb960ec733579801b093576ddeb4"
        },
        {
          "name": "trends___get_time_series",
          "description": "Full historical series for one keyword on one or more sources (0-100 values, plus volume when available). Suited for charting or custom math. Live 'what's trending now' boards are on get_top_trends. get_growth answers most growth questions with less data. Costs 1 request per data type (source or board) in the call; boards cost 1 request per 10 rows. Only data types that answer are charged; the answer says requests_charged. Returns a plan-limit message when the request is rate limited or the monthly quota is used up.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO 3166-1 alpha-2 code (US, GB, JP). Aliases like 'UK' or 'United Kingdom' resolve too. Only for Google Search, Google Images, Google News, Google Shopping, YouTube, TikTok, and Pinterest. Google defaults to worldwide, TikTok to US; with a country the data is fetched live.",
                "type": "string"
              },
              "keyword": {
                "description": "What to look up. The string format is required by source. Standard sources (Google Search, Google Images, Google News, Google Shopping, YouTube, Wikipedia, TikTok, Amazon, Pinterest): any name or phrase, e.g. 'tesla'. npm: Exact npmjs.com package name, case-sensitive. Right: 'react', '@babel/core'. Wrong: 'React', 'React.js'. Python: Exact PyPI project name. Right: 'pandas', 'requests'. Wrong: 'Pandas'. Steam: Game display name in plain English, not a Steam App ID. Right: 'Elden Ring', 'CS2'. First Steam store search result wins, so use an unambiguous name. App Downloads and App Rankings: Android bundle ID only (the id= value on Google Play). Right: 'com.openai.chatgpt', 'com.whatsapp'. Wrong: 'ChatGPT', 'WhatsApp', an iOS App Store ID, or a bundle ID that is not Android. Find it at play.google.com/store/apps/details?id=THIS_PART.",
                "type": "string"
              },
              "language": {
                "description": "Optional language edition code (en, de, ja, pt). Only for Wikipedia. Default en; other languages are fetched live.",
                "type": "string"
              },
              "resolution": {
                "description": "Optional. 'weekly' (default, about 5 years) or 'daily' (last 90 days, fetched live). Only for Google Search, Google Images, Google News, Google Shopping, and YouTube.",
                "type": "string"
              },
              "source": {
                "description": "One source, several comma-separated (one series each), or 'all': 'all' = 9 ('Google Search', 'Google Images', 'Google News', 'Google Shopping', 'YouTube', 'Wikipedia', 'TikTok', 'Amazon', and 'Pinterest'), costing 9. Valid: 'Google Search', 'Google Images', 'Google News', 'Google Shopping', 'YouTube', 'Wikipedia', 'TikTok', 'Amazon', 'Pinterest', 'npm', 'Python', 'Steam', 'App Downloads', 'App Rankings'.",
                "type": "string"
              }
            },
            "required": ["keyword", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Time Series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3217e261befa1ce69b64270e45a1f9e578df314b5d6841bcece05ac3b69a38a"
        },
        {
          "name": "trends___get_top_trends",
          "description": "Live top-trending boards: one feed type, several, or 'all'. No keyword. For 'Amazon Best Sellers by Category', 'Google Trends by Category', 'Pinterest Trending by Category', 'Top Websites', 'Substack by Category', and 'TikTok Trending Hashtags by Category', category selects the board. Default sort is current rank. Use sort='rank_change' for climbers vs a prior snapshot (window 1d, 3d, 7d, 14d, or 30d). If the requested board is not in the database yet (for example a country that is not collected on the schedule), the board is fetched live. App Store Top Free, App Store Top Paid, and Google Play are live store boards, not keyword lookups. App history is available via get_growth or get_time_series with source App Downloads or App Rankings and an Android bundle ID. Live boards are only available here, not via get_time_series. Costs 1 request per data type (source or board) in the call; boards cost 1 request per 10 rows. Only data types that answer are charged; the answer says requests_charged. Returns a plan-limit message when the request is rate limited or the monthly quota is used up.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Pass this whenever type is 'Amazon Best Sellers by Category', 'Google Trends by Category', 'Pinterest Trending by Category', 'Top Websites', 'Substack by Category', or 'TikTok Trending Hashtags by Category'. Use the official name. Without it those feeds mix every board. Only omit on a first pull to learn the official names.",
                "type": "string"
              },
              "country": {
                "description": "Optional ISO 3166-1 alpha-2 code (US, GB, JP). Aliases like 'USA' or 'United States' resolve to US. Omit for the default US board. Only for Google Trends, Google Trends by Category, Pinterest Trending, Pinterest Trending by Category, TikTok Trending Hashtags, TikTok Trending Hashtags by Category, X (Twitter) Trending, and YouTube Trending.",
                "type": "string"
              },
              "limit": {
                "description": "Rows per board. Default 100 = 10 requests per board (1 request per 10 rows); lower it to spend less, e.g. 10 = 1 request. Min 1, max 200.",
                "type": "integer"
              },
              "offset": {
                "description": "Rows to skip for pagination. Default 0.",
                "type": "integer"
              },
              "sort": {
                "description": "How to rank the board. 'rank' (default): current leaders. 'rank_change': biggest climbers vs a prior snapshot. Mover rows include rank, keyword, prev_rank, and rank_change.",
                "type": "string"
              },
              "type": {
                "description": "One live feed, several comma-separated (one board each, each billed per 10 rows), or 'all' (27 boards). Valid: 'Amazon Best Sellers Top Rated', 'Amazon Best Sellers by Category', 'App Store Top Free', 'App Store Top Paid', 'GitHub', 'Google News Top News', 'Google Play', 'Google Trends', 'Google Trends by Category', 'IMDb MOVIEmeter', 'Open Library Trending Books', 'Pinterest Trending', 'Pinterest Trending by Category', 'Polymarket Top Markets', 'Reddit Hot Posts', 'Reddit World News', 'Top Websites', 'Spotify Top Podcasts', 'Steam Most Played', 'Substack', 'Substack by Category', 'TikTok Trending Hashtags', 'TikTok Trending Hashtags by Category', 'TikTok Trending Searches', 'Wikipedia Trending', 'X (Twitter) Trending', 'YouTube Trending'.",
                "type": "string"
              },
              "window": {
                "description": "Lookback used only when sort is 'rank_change'. One of '1d', '3d', '7d', '14d', '30d'. Default '30d'. Short windows only work on daily feeds; weekly and monthly feeds return a note pointing to a longer window.",
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Top Trends"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
