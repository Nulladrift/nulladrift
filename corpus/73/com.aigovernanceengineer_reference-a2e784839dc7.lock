          "description": "Filter the obligation register (obligation → artefact → stack layer, with stable ids such as AIGE-OBL-EUAIA-ART9). All filters are optional and combine with AND. framework: an id, short name or name (\"eu-ai-act\", \"EU AI Act\", \"ISO 42001\", \"nist\"); role: a duty holder such as \"provider\", \"deployer\", \"developer\" or \"GPAI provider\" (matched in the duty holder, or in the scope of laws that name who they bind; rows with neither, such as voluntary standards, drop out); systemClass: an EU AI Act class (all-ai-systems, prohibited, high-risk-annex-iii, high-risk-annex-i, transparency-art50, gpai, gpai-systemic); appliesBefore: an ISO date, keeping rows whose first application date (appliesFrom) is on or before it (later milestones are listed with each row); status: in-force, applies-later, deferred, grace, voluntary or pending; layer: a stack layer 1-5.",
