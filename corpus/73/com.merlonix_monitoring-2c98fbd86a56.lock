{
  "lockfileVersion": 2,
  "subjects": {
    "com.merlonix/monitoring": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.merlonix.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "merlonix",
        "title": "Merlonix",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Merlonix monitoring tools. PUBLIC (no auth): query the live SSL/DNS/registration health of any public domain (check_domain_health), score a site for AI-agent readiness (check_agent_readiness), health-check a live MCP server by URL (check_mcp_health), check a domain or IP against the mail DNS blocklists (check_email_blacklist), scan one page for dead links and mixed content (check_broken_links), and read the status of the third-party vendors Merlonix monitors (list_vendor_status / get_vendor_status / list_plans). AUTHED (set \"Authorization: Bearer mk_…\" with an API key from app.merlonix.com → Settings → API keys): READ your own monitored assets (list_my_assets), the latest check results for one asset (get_asset_checks), and your recent alerts (list_my_alerts); and WRITE (needs a write-scoped API key): start monitoring an asset (create_asset), update or remove one (update_asset / delete_asset), and acknowledge or resolve an alert (acknowledge_alert / resolve_alert). Read tools are read-only; the write tools mutate only YOUR account and are tenant-scoped + write-scope-gated server-side.",
      "tools": [
        {
          "name": "acknowledge_alert",
          "description": "Acknowledge one of YOUR alerts by its alert id (from list_my_alerts) — marks it as seen/being-handled without resolving it. Optionally attach a note. Requires an API key with write scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alert_id": {
                "description": "The alert id from list_my_alerts (a UUID).",
                "type": "string"
              },
              "note": {
                "description": "Optional note (max 500 chars).",
                "type": "string"
              }
            },
            "required": ["alert_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b20da691606f772fd603b56df43a9ce4b6b3d65963bc8c5d21a18f2add4b44f"
        },
        {
          "name": "check_agent_readiness",
          "description": "Score how ready a website is for AI agents and answer engines. Fetches /llms.txt, /robots.txt, and the homepage and returns a letter grade with per-signal findings. No browser rendering or LLM call — deterministic HTTP/parse.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hostname": {
                "description": "A public hostname, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["hostname"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5fad80f75d7fa5fbece863125a79f42bf8ea7177e27db0e148de467aa3b34f2e"
        },
        {
          "name": "check_broken_links",
          "description": "Scan one web page for dead links (4xx/5xx/unreachable) and mixed content (http subresources on an https page). Returns each link with its status. Single-page scan, not a crawl — pass the exact page URL. Rate-limited to a few scans per minute, so batch calls will be throttled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The exact page URL to scan, e.g. https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fa2a81d96ce0ab4a652a550dc79f6f5827fdfb79e15e3e258b54f9844890bd46"
        },
        {
          "name": "check_domain_health",
          "description": "Check the live SSL/TLS certificate (validity + expiry + issuer), DNS records (A/AAAA/MX/NS resolution), and domain-registration (RDAP) expiry of any public hostname. Each leg fails soft and is reported independently.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hostname": {
                "description": "A public hostname, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["hostname"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:88a373d2a80d46fa8916ed428b696af266f048aaccc88a0a9fcc75489f499e05"
        },
        {
          "name": "check_email_blacklist",
          "description": "Check whether a domain or IP is listed on the major DNS blocklists (DNSBLs) that mail providers consult before accepting mail — the usual reason legitimate mail silently lands in spam. Returns each zone checked, whether it is listed, and the return code. Deterministic DNS lookups, no LLM.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A public domain or IP address, e.g. example.com or 203.0.113.10",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d4a77c7388ecb2ddfc6690f0ce5d3955eb37a2330e806a21725ba4d8b5a93705"
        },
        {
          "name": "check_mcp_health",
          "description": "Health-check a live MCP (Model Context Protocol) server by URL: performs a real JSON-RPC initialize handshake, then tools/list, and returns whether it is up/degraded/down, its protocol version, server name/version, the callable tool/resource/prompt inventory, transport, and handshake latency. Deterministic — no LLM. Use it to verify your own MCP server is alive and spec-compliant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The MCP endpoint URL, e.g. https://example.com/mcp",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:26ab503e6f495265998ddf435900db8c893d55380c61110b57f3f10281803fa2"
        },
        {
          "name": "create_asset",
          "description": "Start monitoring a new asset (website/domain) in YOUR Merlonix account. Provide a hostname and asset_type; optionally a label and which checks to enable. Returns the created asset. Requires an API key with write scope. Subject to your plan asset quota (a full or non-paying plan returns an error).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_type": {
                "description": "Asset kind: \"hostname\" (a website/host), \"domain\", \"certificate\", or \"dns_record\".",
                "enum": ["domain", "hostname", "certificate", "dns_record"],
                "type": "string"
              },
              "dns_enabled": {
                "description": "Monitor DNS records.",
                "type": "boolean"
              },
              "domain_enabled": {
                "description": "Monitor domain-registration (RDAP) expiry.",
                "type": "boolean"
              },
              "hostname": {
                "description": "The hostname to monitor, e.g. example.com",
                "type": "string"
              },
              "label": {
                "description": "Optional human label (max 120 chars).",
                "type": "string"
              },
              "ssl_enabled": {
                "description": "Monitor the TLS certificate (default on for hostnames).",
                "type": "boolean"
              },
              "uptime_check_url": {
                "description": "Optional URL to probe for uptime (enables uptime checks).",
                "type": "string"
              }
            },
            "required": ["asset_type", "hostname"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca6d6160d9c586a7b6cabe95ea9e6c61e875835ef928be5d3b137a66d888216d"
        },
        {
          "name": "delete_asset",
          "description": "STOP monitoring one of YOUR assets and remove it, by its asset id (from list_my_assets). This is irreversible — its check history goes too. Requires an API key with write scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "The asset id from list_my_assets (a UUID).",
                "type": "string"
              }
            },
            "required": ["asset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:890bd21c5d15e2ba4b04d330120f302b901820623bd3f3422f91f4a9b2e0d58b"
        },
        {
          "name": "get_asset_checks",
          "description": "Get the latest check results (SSL, DNS, uptime, heartbeat, port) for ONE of your monitored assets, by its asset id (from list_my_assets). Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "The asset id from list_my_assets (a UUID).",
                "type": "string"
              }
            },
            "required": ["asset_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:21618747eec750be6e2e211c5711b2c07d868125c3f2fcc2dd8f7d94e6f13539"
        },
        {
          "name": "get_vendor_status",
          "description": "Get the current status plus 30-day status history of one monitored vendor by slug (e.g. \"cloudflare\"). Use list_vendor_status to discover valid slugs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Vendor slug, e.g. cloudflare",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8042eb4ca4ecd06656fc3c9ba0e3fb9258b0bfd9ff5dff6e45a7c615bd5455d6"
        },
        {
          "name": "list_my_alerts",
          "description": "List recent alerts across YOUR monitored assets (SSL changes, downtime, DNS drift, vendor incidents, etc.) with their severity and lifecycle status. Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b8878a3f0d96c20fd17c060f9c9331863b38dcfca5016ce2d6fbdc323646bfc7"
        },
        {
          "name": "list_my_assets",
          "description": "List the monitored assets (websites/domains) in YOUR Merlonix account. Returns each asset id, hostname, type, and monitoring status. Requires an API key (Authorization: Bearer mk_… from app.merlonix.com → Settings → API keys).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:783d524e0d9eb50fd94d282ce3a8aa1b609de715d9a8d84ddad00edef4607245"
        },
        {
          "name": "list_plans",
          "description": "List Merlonix subscription plans and pricing (Starter, Team, Agency, Compliance) with their monitoring limits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:010d7792fbe5dd38ebe68d0f925ca5707fb9bede71e678b495bbb48f23e4ae2e"
        },
        {
          "name": "list_vendor_status",
          "description": "List the current operational status and recent incidents of every third-party vendor Merlonix monitors (e.g. Cloudflare, GitHub, Stripe). Returns each vendor's slug, current status, and 24h incident count.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e71a93fd56302e642cf4fa7ef2fe4467185dce722279dede29623188b34f37d9"
        },
        {
          "name": "resolve_alert",
          "description": "Resolve one of YOUR alerts by its alert id (from list_my_alerts) — closes it. Optionally set resolution (\"fixed\" | \"false_positive\" | \"wontfix\") and a note. Requires an API key with write scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alert_id": {
                "description": "The alert id from list_my_alerts (a UUID).",
                "type": "string"
              },
              "note": {
                "description": "Optional note (max 500 chars).",
                "type": "string"
              },
              "resolution": {
                "description": "Why the alert is being closed.",
                "enum": ["fixed", "false_positive", "wontfix"],
                "type": "string"
              }
            },
            "required": ["alert_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
