{
  "lockfileVersion": 2,
  "subjects": {
    "com.soracom/knowledge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://knowledge-mcp.soracom.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "soracom-knowledge",
        "title": "Soracom Knowledge",
        "version": "1.1.5"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for searching Soracom documentation.\n- search_soracom_docs: service guides, console how-tos, service overviews/pricing, IoT recipes.\n- search_api_docs: API references, CLI commands, SAM permissions.\n- get_document: fetch the full page for a `url` from either search tool (also expands `#/schema/<Name>` links).\nSearch broadly first: omit document_names unless confident, raise max_results when exploring, reword narrow queries, then fetch the right URL with get_document.\nFor exact tokens such as error codes, API paths, operationIds, or parameter names, retry with search_mode='keyword' if hybrid misses the expected page.\nWhen replying in English, write the brand name as \"Soracom\" rather than the all-caps \"SORACOM\" used in Japanese-language materials, even where retrieved documents use \"SORACOM\".",
      "tools": [
        {
          "name": "get_document",
          "description": "Fetch full markdown for a SORACOM documentation page. Also resolves API schema links. Exact URLs are attempted first.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A search-result URL, or the full URL of a `#/schema/<Name>` link from search_api_docs. Must start with http:// or https://; pass it exactly as returned.",
                "maxLength": 2048,
                "pattern": "^(http://|https://)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Full SORACOM Documentation Page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a643c6e5f87f3d702685218a9582811ea85fb1b8a2c510b0691e264802863dac"
        },
        {
          "name": "search_api_docs",
          "description": "Search SORACOM API documentation, CLI references, and SAM permissions. Use for exact API endpoints, soracom-cli commands, or SAM permission strings. Use search_soracom_docs for service guides, console how-tos, pricing, or IoT recipes. Use get_document on `#/schema/<Name>` links in results to read full API schema fields.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Documentation language. Omit to auto-detect; set only to pin one language.",
                "enum": ["Japanese", "English"],
                "type": "string"
              },
              "max_results": {
                "default": 16,
                "description": "Maximum results to return (1-32). Increase when exploring.",
                "maximum": 32,
                "minimum": 1,
                "type": "integer"
              },
              "method": {
                "description": "Optional HTTP method to narrow results (e.g. 'GET', 'POST'). Exact, case-insensitive match.",
                "maxLength": 128,
                "type": "string"
              },
              "path": {
                "description": "Optional API path fragment, matched as a case-insensitive substring excluding the version prefix — e.g. '/sims' or 'subscribers', not '/v1/sims'.",
                "maxLength": 128,
                "type": "string"
              },
              "query": {
                "description": "Natural-language query or API endpoint name. Optional when tag, method, or path is supplied; omit to browse filtered operations.",
                "maxLength": 1000,
                "type": "string"
              },
              "search_mode": {
                "default": "hybrid",
                "description": "Search strategy: 'hybrid' combines keyword and vector search; 'keyword' matches exact API paths, operationIds, and parameter names; 'semantic' uses vector similarity only.",
                "enum": ["hybrid", "keyword", "semantic"],
                "type": "string"
              },
              "tag": {
                "description": "Optional OpenAPI tag such as 'Sim', 'DataEntry', 'Stats', or 'Query'. Exact, case-insensitive; discover valid tags from result api_tag fields.",
                "maxLength": 128,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search SORACOM API Documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ede837239705272265016cf6eb4f5f3546f14246d0c00dd9ce62e6bc81293e4"
        },
        {
          "name": "search_soracom_docs",
          "description": "Search SORACOM service documentation, guides, and console how-to articles (user site, service overviews and pricing, IoT recipes). Covers SORACOM services, subscription plans, User Console operations, changelogs, blogs, devices, IoT Store, partners, contract terms, and use cases. Use search_api_docs for API references, CLI commands, or SAM permissions.",
          "inputSchema": {
            "properties": {
              "document_names": {
                "description": "Optional document-name scope filter. Omit when unsure; narrowing too early can hide relevant results. Each document has a fixed language; only in-scope languages are searched. Available documents:\n- blog.soracom.com (Japanese): Official blog: announcements, tutorials, event reports, and customer stories.\n- changelog.soracom.io (English): New feature releases, end-of-service notices, and pricing/spec changes.\n- changelog.soracom.io/ja (Japanese): New feature releases, end-of-service notices, and pricing/spec changes.\n- developers.soracom.io (English): SORACOM Developer Site docs.\n- docs.soracom.io (English): SORACOM Documentation: services, devices, guides, and developer resources.\n- iot-template-gallery.soracom.io (English): Ready-to-use IoT solution template setup guides.\n- iot-template-gallery.soracom.jp (Japanese): Ready-to-use IoT solution template setup guides.\n- iot-usecase.com (Japanese): IoT use cases showing SORACOM across industries.\n- soracom.io (English): Official blog: announcements, tutorials, event reports, and customer stories.\n- soracom.io/terms (English): Contract terms and conditions for SORACOM services in English, by region.\n- soracom.jp/iot-recipes (Japanese): Step-by-step IoT solution recipes with SORACOM.\n- soracom.jp/iot_basics (Japanese): Introductory IoT fundamentals and related technologies.\n- soracom.jp/partners (Japanese): SORACOM Partner Space and certified partner information.\n- soracom.jp/services (Japanese): SORACOM service overviews and pricing.\n- soracom.jp/store (Japanese): SORACOM IoT Store devices and starter kits.\n- soracom.jp/support_partners/certified_device (Japanese): SORACOM certified and compatible IoT device catalog.\n- soracom.jp/terms (Japanese): Contract terms and conditions (利用規約) for SORACOM services in Japanese.\n- support.soracom.io/hc/en-us (English): SORACOM support FAQs.\n- support.soracom.io/hc/ja (Japanese): SORACOM support FAQs.\n- users.soracom.io (Japanese): SORACOM User Site docs for service usage and configuration.",
                "items": {
                  "enum": ["blog.soracom.com", "changelog.soracom.io", "changelog.soracom.io/ja", "developers.soracom.io", "docs.soracom.io", "iot-template-gallery.soracom.io", "iot-template-gallery.soracom.jp", "iot-usecase.com", "soracom.io", "soracom.io/terms", "soracom.jp/iot-recipes", "soracom.jp/iot_basics", "soracom.jp/partners", "soracom.jp/services", "soracom.jp/store", "soracom.jp/support_partners/certified_device", "soracom.jp/terms", "support.soracom.io/hc/en-us", "support.soracom.io/hc/ja", "users.soracom.io"],
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "description": "Documentation language. Omit to auto-detect; set only to pin one language. This does not imply the user's market — use market for that.",
                "enum": ["English", "Japanese"],
                "type": "string"
              },
              "market": {
                "description": "End-user's deployment market, not the query language. Omit if unknown.",
                "enum": ["Global", "Japan"],
                "type": "string"
              },
              "max_results": {
                "default": 16,
                "description": "Maximum results to return (1-32). Increase when exploring.",
                "maximum": 32,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search query in natural language related to SORACOM services or console usage",
                "maxLength": 1000,
                "type": "string"
              },
              "search_mode": {
                "default": "hybrid",
                "description": "Search strategy: 'hybrid' combines keyword and vector search; 'keyword' matches exact tokens; 'semantic' uses vector similarity only.",
                "enum": ["hybrid", "keyword", "semantic"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search SORACOM Documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cf996c13e59c2e5b8a880e0d4fb386a5d9409a745ab4dde4b164587c72f99ed"
        }
      ],
      "digest": "sha256:96f9d8a00884045c9274410f35ea5f7bfe3abe84d1af442afcc5184fb81c2d2c"
    }
  }
}
