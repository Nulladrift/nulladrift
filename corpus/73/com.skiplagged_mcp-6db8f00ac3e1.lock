                "description": "Number of adults (default: 2, max: 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "numChildren": {
                "default": 0,
                "description": "Number of children (default: 0, max: 10)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "numRooms": {
                "default": 1,
                "description": "Number of rooms (default: 1, max: 9)",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of hotels to skip (default: 0); limit + offset must not exceed 100",
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "default": "value",
                "description": "Sort hotels by price (cheapest first), ranking (highest rated first), value (best value rating), or discount (best deals first, default when deals available)",
                "enum": ["price", "ranking", "value", "discount"],
                "type": "string"
