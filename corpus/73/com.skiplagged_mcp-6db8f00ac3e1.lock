                      "type": "array"
                    },
                    "chain": {
                      "type": "string"
                    },
                    "deepLink": {
                      "format": "uri",
                      "type": "string"
                    },
                    "id": {
                      "description": "Hotel result card identifier; not a user identifier",
                      "type": "string"
                    },
                    "imageUrl": {
                      "type": "string"
                    },
                    "location": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price": {
                      "additionalProperties": false,
                      "properties": {
                        "amount": {
                          "description": "Nightly price in `currency` (converted from USD)",
