                        },
                        "currency": {
                          "description": "ISO 4217 code of `amount`",
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        },
                        "usdAmount": {
                          "description": "Source nightly price in US dollars; use it for comparison",
                          "type": "number"
                        }
                      },
                      "required": ["amount", "currency", "text"],
                      "type": "object"
                    },
                    "rating": {
