                      "type": "string"
                    },
                    "destinationCity": {
                      "description": "Destination city name",
                      "type": "string"
                    },
                    "destinationCountryCode": {
                      "description": "Destination ISO 3166-1 alpha-2 country code",
                      "type": "string"
                    },
                    "direct": {
                      "description": "Whether the award is on a nonstop flight",
                      "type": "boolean"
                    },
                    "fees": {
                      "additionalProperties": false,
                      "description": "Cash taxes and fees on top of the miles",
                      "properties": {
                        "amount": {
                          "description": "Taxes and fees per traveler in `currency`; null if unknown",
                          "type": ["number", "null"]
                        },
                        "charged": {
                          "additionalProperties": false,
                          "description": "What the program charges, when its currency differs from `currency`",
                          "properties": {
                            "amount": {
                              "type": "number"
                            },
                            "currency": {
                              "type": "string"
                            }
                          },
                          "required": ["amount", "currency"],
                          "type": "object"
                        },
                        "currency": {
                          "description": "ISO 4217 code of `amount`",
                          "type": "string"
                        },
                        "usdAmount": {
                          "description": "Taxes and fees in US dollars, for comparison; null when the rate is unknown",
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["amount", "currency", "usdAmount"],
                      "type": "object"
                    },
                    "id": {
                      "description": "Opaque award identifier (program, route, date and cabin)",
                      "type": "string"
                    },
                    "miles": {
                      "description": "Miles or points per traveler, one way",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "originAirportCode": {
                      "description": "Origin airport code (e.g., 'JFK')",
                      "type": "string"
                    },
                    "originCity": {
                      "description": "Origin city name",
                      "type": "string"
                    },
                    "originCountryCode": {
                      "description": "Origin ISO 3166-1 alpha-2 country code",
                      "type": "string"
                    },
                    "program": {
                      "additionalProperties": false,
                      "description": "Loyalty program whose miles or points book this award",
                      "properties": {
                        "bookingUrl": {
                          "description": "The program's site, where the award is booked",
                          "type": "string"
                        },
                        "id": {
                          "description": "Program id (e.g., 'aeroplan')",
                          "type": "string"
                        },
                        "name": {
                          "description": "Loyalty program name",
                          "type": "string"
                        }
                      },
                      "required": ["id", "name"],
                      "type": "object"
                    },
                    "seatsLeft": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Award seats left at this price; null if unknown"
                    }
