      "tools": [
        {
          "name": "sk_award_search",
          "title": "Skiplagged Award Search",
          "description": "Search award seats: flights bookable with airline miles or loyalty points (Aeroplan, Alaska Mileage Plan, Flying Blue, Delta SkyMiles, United MileagePlus, Virgin Atlantic, Qantas, Emirates, Qatar and more), with the miles and cash taxes/fees each costs. Use it when the user wants to use miles or points; use sk_flights_search for cash fares. Flexible by design: origins and destinations take several airport codes, metro codes (NYC, LON) or region slugs (europe, japan, california); destinations can be empty for anywhere. Dates can be one day (departureDate), a window (departureDate + departureDateEnd), give or take N days (flexibleDays), or left out to search every date with seats loaded (about the next 60 days). Set returnDate or roundTrip for return awards, listed separately (awards are booked one way). Each result is the cheapest program for that route, date and cabin, per traveler; filter `programs` for the price in a specific program. Book on the program site; `searchUrl` opens the same search on Skiplagged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "airlines": {
                "description": "Only awards flown by these airlines (IATA codes, e.g. ['BA', 'VS'])",
                "items": {
                  "pattern": "^[A-Z0-9]{2}$",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "cabins": {
                "default": ["economy"],
                "description": "Cabins to search (default: ['economy']); premium is premium economy. Several allowed, e.g. ['business', 'first'].",
                "items": {
                  "enum": ["economy", "premium", "business", "first"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "currency": {
                "description": "Currency to show taxes and fees in (ISO 4217, default: USD). Pass the user's local currency when you know it. Fees are converted and approximate; miles are unaffected.",
                "enum": ["USD", "AUD", "BRL", "CAD", "CHF", "CNY", "CZK", "DKK", "EUR", "GBP", "HKD", "IDR", "INR", "JPY", "KRW", "MXN", "MYR", "PLN", "RON", "SEK", "SGD", "TRY", "TWD", "UAH", "VND"],
                "type": "string"
              },
              "departureDate": {
                "description": "Exact departure date (YYYY-MM-DD), or the first day of a window ending on departureDateEnd. Omit to search every date with seats loaded (about the next 60 days).",
                "type": "string"
              },
              "departureDateEnd": {
                "description": "Last departure day of a window (YYYY-MM-DD, inclusive); needs departureDate. E.g. departureDate 2026-12-01 and departureDateEnd 2026-12-15 for \"the first half of December\".",
                "type": "string"
              },
              "destinations": {
                "description": "Where to fly to, in the same forms as origins, e.g. ['europe'] or ['LHR', 'CDG']. Empty searches anywhere (slow and broad; prefer a region).",
                "items": {
                  "maxLength": 64,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "directOnly": {
                "default": false,
                "description": "Only nonstop awards (default: false)",
                "type": "boolean"
              },
              "flexibleDays": {
                "default": 0,
                "description": "Also search this many days before and after each date or window (default: 0), e.g. 3 for \"give or take 3 days\".",
                "maximum": 7,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "default": 12,
                "description": "Maximum awards to return per direction (default: 12, max: 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxMiles": {
                "description": "Only awards costing at most this many miles per traveler",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of awards to skip per direction (default: 0); limit + offset must not exceed 100",
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              },
              "origins": {
                "description": "Where to fly from: airport codes (JFK), metro codes (NYC, LON, which search every airport of the city), or place slugs for a US state, country or continent (california, united-kingdom, japan, europe, asia, north-america, south-america, africa, oceania). Several allowed, e.g. ['JFK', 'EWR']. Resolve a city name you have no code for with sk_resolve_iata first.",
                "items": {
                  "maxLength": 64,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "programs": {
                "description": "Only awards bookable with these loyalty programs, e.g. when the user holds Aeroplan points. Omit for every program: aeroplan (Air Canada Aeroplan), alaska (Alaska Mileage Plan), delta (Delta SkyMiles), emirates (Emirates Skywards), etihad (Etihad Guest), flyingblue (Air France-KLM Flying Blue), jetblue (JetBlue TrueBlue), qantas (Qantas Frequent Flyer), qatar (Qatar Airways Privilege Club), united (United MileagePlus), velocity (Virgin Australia Velocity), virginatlantic (Virgin Atlantic Flying Club).",
                "items": {
                  "enum": ["aeroplan", "alaska", "delta", "emirates", "etihad", "flyingblue", "jetblue", "qantas", "qatar", "united", "velocity", "virginatlantic"],
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "returnDate": {
                "description": "Exact return date (YYYY-MM-DD), or the first day of a return window ending on returnDateEnd. Setting it makes the search a round trip.",
                "type": "string"
              },
              "returnDateEnd": {
                "description": "Last return day of a window (YYYY-MM-DD, inclusive); needs returnDate.",
                "type": "string"
              },
              "roundTrip": {
                "default": false,
                "description": "Also search return awards (default: false; implied by returnDate). Without return dates, returns are searched up to 14 days after the last departure day, or over every loaded date for a dateless search.",
                "type": "boolean"
              },
              "seats": {
                "default": 1,
                "description": "Travelers who need a seat (default: 1, max: 9; lap infants need none). Only awards with this many seats left are returned.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "miles",
                "description": "Order awards by fewest miles (then fees, default) or by earliest date",
                "enum": ["miles", "date"],
                "type": "string"
              }
            },
            "required": ["origins"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cheapestByDestination": {
                "description": "Cheapest departing award to each destination airport, when there are several",
                "items": {
