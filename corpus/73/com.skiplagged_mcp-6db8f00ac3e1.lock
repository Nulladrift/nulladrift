                "enum": ["USD", "AUD", "BRL", "CAD", "CHF", "CNY", "CZK", "DKK", "EUR", "GBP", "HKD", "IDR", "INR", "JPY", "KRW", "MXN", "MYR", "PLN", "RON", "SEK", "SGD", "TRY", "TWD", "UAH", "VND"],
                "type": "string"
              },
              "limit": {
                "default": 12,
                "description": "Maximum number of hotels to return (default: 12, max: 100)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
