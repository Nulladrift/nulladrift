        {
          "name": "list_council_schemes",
          "title": "List a council’s licensing schemes",
          "description": "Lists a council’s licensing schemes from HouseFile’s records: in force, starting soon, proposed, and ended in the last 12 months, each with its area, dates, fee, source link and last verified date. Takes a council name, part of a name or a GSS code. If several councils match, it returns them to choose from.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "council": {
                "description": "A council name, part of one, or its GSS code, such as \"Croydon\" or \"E09000008\"",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["council"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "gss_code": {
                      "type": "string"
                    },
                    "housefile_url": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["gss_code", "housefile_url", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "council": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "address_checker": {
                        "type": ["string", "null"]
                      },
                      "checked_no_scheme_on": {
                        "description": "Set when a person checked and found the council runs no scheme",
                        "type": ["string", "null"]
                      },
                      "gss_code": {
                        "type": "string"
                      },
                      "housefile_url": {
                        "type": "string"
                      },
                      "licensing_page": {
                        "type": ["string", "null"]
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": ["address_checker", "checked_no_scheme_on", "gss_code", "housefile_url", "licensing_page", "name"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "disclaimer": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "result": {
                "enum": ["found", "several_matches", "not_covered"],
                "type": "string"
              },
              "schemes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "applies_to": {
                      "type": ["string", "null"]
                    },
                    "area": {
                      "type": "string"
                    },
                    "coverage_type": {
                      "type": "string"
                    },
                    "dates": {
                      "type": "string"
                    },
                    "end_date": {
                      "type": ["string", "null"]
                    },
                    "fee_summary": {
                      "type": ["string", "null"]
                    },
                    "housefile_url": {
                      "type": "string"
                    },
                    "last_verified_at": {
                      "type": ["string", "null"]
                    },
                    "legal_name": {
                      "type": "string"
                    },
                    "scheme_name": {
                      "type": "string"
                    },
                    "scheme_type": {
                      "enum": ["selective", "additional_hmo", "mandatory_hmo", "council_schemes"],
                      "type": "string"
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "stage": {
                      "enum": ["in_force", "starting_soon", "proposed", "ended"],
                      "type": "string"
                    },
                    "start_date": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["applies_to", "area", "coverage_type", "dates", "end_date", "fee_summary", "housefile_url", "last_verified_at", "legal_name", "scheme_name", "scheme_type", "source_url", "stage", "start_date"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["candidates", "council", "disclaimer", "query", "result", "schemes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List a council’s licensing schemes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
