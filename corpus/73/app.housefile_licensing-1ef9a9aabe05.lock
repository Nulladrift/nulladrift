{
  "lockfileVersion": 2,
  "subjects": {
    "app.housefile/licensing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.housefile.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "housefile-licensing",
        "title": "HouseFile UK property licensing checker",
        "version": "1.2.0",
        "websiteUrl": "https://www.housefile.app/mcp/about"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Checks whether a property in England falls within a council’s selective or additional HMO licensing scheme, using HouseFile’s records. Call licensing_coverage to see which councils the records cover. With each result, show the user the source link and the \"last verified\" date. If a council is not covered, tell the user HouseFile holds no records for it, and that this doesn’t mean the council has no scheme. Never tell the user a licence isn’t needed: say what HouseFile’s records indicate. Where a result is near a scheme boundary, send the user to the council’s map. Mandatory HMO licensing depends on how many people and households live in the property, so ask about occupancy if the user hasn’t said. Results are general information, not legal advice: tell the user to confirm with the council before letting.",
      "tools": [
        {
          "name": "check_property_licensing",
          "title": "Check a property’s licensing",
          "description": "Looks up a postcode in England in HouseFile’s records of council licensing schemes and returns each scheme in force there, with its dates, fee, source link and the date the records were last verified, plus the national HMO rule. Schemes not in force yet are listed under upcoming. It works to postcode precision, so near a scheme’s edge it says so. Give occupants and households to settle the mandatory HMO test in England.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "as_of_date": {
                "description": "YYYY-MM-DD. Defaults to today; at most 24 months ahead",
                "type": "string"
              },
              "households": {
                "description": "How many separate households they form",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "occupants": {
                "description": "How many people live in the property",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "postcode": {
                "description": "The full UK postcode of the property being checked, in any spacing or case, such as \"e8 1dy\". Only its first half is kept",
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "type": "string"
              },
              "council": {
                "type": ["string", "null"]
              },
              "council_address_checker": {
                "description": "The council’s own address-level lookup, where it has one",
                "type": ["string", "null"]
              },
              "council_gss_code": {
                "type": ["string", "null"]
              },
              "country": {
                "enum": ["England", "Wales", "Scotland", "Northern Ireland", "unknown"],
                "type": "string"
              },
              "covered": {
                "type": "boolean"
              },
              "disclaimer": {
                "type": "string"
              },
              "housefile_url": {
                "type": "string"
              },
              "postcode": {
                "type": "string"
              },
              "schemes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "applicability": {
                      "enum": ["applies", "conditional", "boundary_uncertain", "does_not_apply", "not_covered"],
                      "type": "string"
                    },
                    "applies_to": {
                      "type": ["string", "null"]
                    },
                    "condition": {
                      "description": "What the answer depends on, where it isn’t settled",
                      "type": ["string", "null"]
                    },
                    "confidence": {
                      "anyOf": [
                        {
                          "enum": ["high", "medium", "low"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "council": {
                      "type": ["string", "null"]
                    },
                    "council_licensing_page": {
                      "type": ["string", "null"]
                    },
                    "end_date": {
                      "type": ["string", "null"]
                    },
                    "fee_summary": {
                      "type": ["string", "null"]
                    },
                    "housefile_url": {
                      "type": ["string", "null"]
                    },
                    "last_verified_at": {
                      "type": ["string", "null"]
                    },
                    "note": {
                      "type": ["string", "null"]
                    },
                    "precision": {
                      "enum": ["address", "postcode"],
                      "type": "string"
                    },
                    "precision_note": {
                      "type": ["string", "null"]
                    },
                    "scheme_name": {
                      "type": "string"
                    },
                    "scheme_type": {
                      "enum": ["selective", "additional_hmo", "mandatory_hmo", "council_schemes"],
                      "type": "string"
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "start_date": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["applicability", "applies_to", "condition", "confidence", "council", "council_licensing_page", "end_date", "fee_summary", "housefile_url", "last_verified_at", "note", "precision", "precision_note", "scheme_name", "scheme_type", "source_url", "start_date"],
                  "type": "object"
                },
                "type": "array"
              },
              "upcoming": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "applicability": {
                      "anyOf": [
                        {
                          "enum": ["applies", "conditional", "boundary_uncertain", "does_not_apply", "not_covered"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Whether the postcode falls in the scheme’s area on our records, as for a scheme in force. Null where no postcode was given"
                    },
                    "council": {
                      "type": "string"
                    },
                    "end_date": {
                      "type": ["string", "null"]
                    },
                    "expected_start_date": {
                      "description": "Null where the council hasn’t announced a start date",
                      "type": ["string", "null"]
                    },
                    "housefile_url": {
                      "type": "string"
                    },
                    "last_verified_at": {
                      "type": ["string", "null"]
                    },
                    "note": {
                      "type": ["string", "null"]
                    },
                    "scheme_name": {
                      "type": "string"
                    },
                    "scheme_type": {
                      "enum": ["selective", "additional_hmo", "mandatory_hmo", "council_schemes"],
                      "type": "string"
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "stage": {
                      "enum": ["proposed", "starting_soon"],
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    }
                  },
                  "required": ["applicability", "council", "end_date", "expected_start_date", "housefile_url", "last_verified_at", "note", "scheme_name", "scheme_type", "source_url", "stage", "summary"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["as_of_date", "council", "council_address_checker", "council_gss_code", "country", "covered", "disclaimer", "housefile_url", "postcode", "schemes", "upcoming"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a property’s licensing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e38b073a9ce8c05d05950cc5119ef7978eda7b4b8ec9ed6e3a94813d8526f805"
        },
        {
          "name": "licensing_coverage",
          "title": "Which councils are covered",
          "description": "Which councils HouseFile’s records cover: each council with published schemes, with how many, how many are in force and when they were last verified, and the councils checked and found to run none. Use it to tell the user honestly whether their area is covered, and list_council_schemes for one council’s detail.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checked_no_scheme_councils": {
                "description": "Short names of the councils a person checked and found to run no additional or selective scheme. list_council_schemes gives the date",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "checked_no_scheme_count": {
                "type": "number"
              },
              "council_count": {
                "description": "Every council the records cover, with schemes or checked and found to run none",
                "type": "number"
              },
              "councils": {
                "description": "Councils with published schemes. Councils checked and found to run none are in checked_no_scheme_councils",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "in_force": {
                      "type": "number"
                    },
                    "last_verified": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "The council’s short name, as on HouseFile’s pages. list_council_schemes takes it as it is",
                      "type": "string"
                    },
                    "published_schemes": {
                      "type": "number"
                    }
                  },
                  "required": ["in_force", "last_verified", "name", "published_schemes"],
                  "type": "object"
                },
                "type": "array"
              },
              "councils_with_schemes": {
                "type": "number"
              },
              "housefile_url": {
                "type": "string"
              },
              "most_recent_verification": {
                "type": ["string", "null"]
              },
              "note": {
                "type": "string"
              },
              "published_scheme_count": {
                "type": "number"
              }
            },
            "required": ["checked_no_scheme_councils", "checked_no_scheme_count", "council_count", "councils", "councils_with_schemes", "housefile_url", "most_recent_verification", "note", "published_scheme_count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which councils are covered"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
