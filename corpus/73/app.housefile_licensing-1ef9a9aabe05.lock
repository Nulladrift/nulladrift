        {
          "name": "upcoming_licensing_changes",
          "title": "Upcoming licensing changes",
          "description": "What’s coming: schemes proposed or starting soon, and recent changes to schemes in HouseFile’s records (started, ended, fee, dates or area changed), newest first. Optionally for one council, and for a number of months ahead and back (6 by default, at most 24). For all councils the lists stop at the 15 soonest schemes and the 10 latest changes, with the totals; ask for one council to see all of its own.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "council": {
                "description": "A council name, part of one, or its GSS code",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "within_months": {
                "description": "Months ahead and back to look, 6 by default",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "gss_code": {
                      "type": "string"
                    },
                    "housefile_url": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["gss_code", "housefile_url", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "council": {
                "type": ["string", "null"]
              },
              "disclaimer": {
                "type": "string"
              },
              "note": {
                "description": "What the stages mean, and how to see more when a list was cut short",
                "type": "string"
              },
              "recent_changes": {
                "description": "Newest first, at most 10 when no council is given",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "change": {
                      "type": "string"
                    },
                    "council": {
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "housefile_url": {
                      "type": "string"
                    },
                    "scheme_name": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "stage_now": {
                      "enum": ["in_force", "starting_soon", "proposed", "ended"],
                      "type": "string"
                    }
                  },
                  "required": ["change", "council", "date", "housefile_url", "scheme_name", "source_url", "stage_now"],
                  "type": "object"
                },
                "type": "array"
              },
              "recent_changes_total": {
                "description": "How many changes there were in the window; more than listed when the list was cut short",
                "type": "number"
              },
              "result": {
                "enum": ["found", "several_matches", "not_covered"],
                "type": "string"
              },
              "upcoming": {
                "description": "Soonest first, then proposals with no start date by council; at most 15 when no council is given",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "council": {
                      "type": "string"
                    },
                    "end_date": {
                      "type": ["string", "null"]
                    },
                    "expected_start_date": {
                      "description": "Null where the council hasn’t announced a start date",
                      "type": ["string", "null"]
                    },
                    "housefile_url": {
                      "type": "string"
                    },
                    "last_verified_at": {
                      "type": ["string", "null"]
                    },
                    "scheme_name": {
                      "type": "string"
                    },
                    "scheme_type": {
                      "enum": ["selective", "additional_hmo", "mandatory_hmo", "council_schemes"],
                      "type": "string"
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "stage": {
                      "enum": ["proposed", "starting_soon"],
                      "type": "string"
                    }
                  },
                  "required": ["council", "end_date", "expected_start_date", "housefile_url", "last_verified_at", "scheme_name", "scheme_type", "source_url", "stage"],
                  "type": "object"
                },
                "type": "array"
              },
              "upcoming_total": {
                "description": "How many schemes are proposed or starting soon; more than listed when the list was cut short",
                "type": "number"
              },
              "within_months": {
                "type": "number"
              }
            },
            "required": ["candidates", "council", "disclaimer", "note", "recent_changes", "recent_changes_total", "result", "upcoming", "upcoming_total", "within_months"],
            "type": "object"
          },
          "annotations": {
