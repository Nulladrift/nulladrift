{
  "lockfileVersion": 2,
  "subjects": {
    "com.i2dev/snap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://snap.i2dev.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "snap",
        "title": "Snap Screenshots",
        "version": "0ad5ca0d327fae8d522e3fb009431c61329bc3d5",
        "description": "Screenshot any public web page from an AI agent.",
        "websiteUrl": "https://snap.i2dev.com/docs/mcp"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Snap renders web pages to images in a real Chromium browser.\n\nUse take_screenshot to see what a public URL looks like. Only public http(s) URLs are allowed; localhost and private networks are refused. The image is returned inline when it is small enough, and always as a URL.\n\nWithout an API key, take_screenshot uses a free MCP daily screenshot allowance per IP; a shared per-network ceiling can also apply. This is separate from the anonymous GET /v1/screenshot allowance. With a Snap API key (Authorization: Bearer <key>), each capture uses one of the monthly credits pooled across the organisation's API keys. get_quota reports the allowance for the current caller without consuming a capture allowance.",
      "tools": [
        {
          "name": "get_quota",
          "title": "Get remaining quota",
          "description": "With no API key, reports today's anonymous MCP screenshot allowance per IP (with a shared per-network ceiling when applicable). With an API key, reports the organisation's monthly credits pooled across its API keys. The public GET /v1/screenshot quota is separate; this check consumes no capture allowance.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "type": "number"
              },
              "networkRemaining": {
                "type": "number"
              },
              "period": {
                "enum": ["day", "month"],
                "type": "string"
              },
              "remaining": {
                "type": "number"
              },
              "resetsAt": {
                "type": "string"
              },
              "tier": {
                "enum": ["anonymous", "api_key"],
                "type": "string"
              },
              "used": {
                "type": "number"
              }
            },
            "required": ["limit", "period", "remaining", "resetsAt", "tier", "used"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4331196457f2e9dcd25c7c74c15a764cc20a4d24ba7b5358f6f13a1bada9b68"
        },
        {
          "name": "take_screenshot",
          "title": "Take a screenshot",
          "description": "Render a public web page in Chromium and return a screenshot. Use fullPage for the whole scrollable page; very tall pages come back as a link instead of an inline image, and a fullPage WebP capture of a page taller than 16383px is clipped to that height (reported as fullPageClip) — use jpeg or png for pages that tall. If the page's load event does not complete in time, the capture is taken anyway and reported via loadEventTimedOut.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "default": "webp",
                "description": "Image format. webp and jpeg are much smaller than png.",
                "enum": ["png", "jpeg", "webp"],
                "type": "string"
              },
              "fullPage": {
                "default": false,
                "description": "Capture the full scrollable page.",
                "type": "boolean"
              },
              "height": {
                "default": 720,
                "description": "Viewport height in CSS pixels. Values above the service maximum are clamped.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "locale": {
                "description": "BCP 47 locale, e.g. de-DE.",
                "type": "string"
              },
              "timezoneId": {
                "description": "IANA time zone, e.g. Europe/Berlin.",
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL to capture, e.g. 'https://example.com'.",
                "format": "uri",
                "type": "string"
              },
              "waitForSelector": {
                "description": "CSS selector that must appear before capturing.",
                "type": "string"
              },
              "waitUntil": {
                "default": "load",
                "description": "Navigation event to wait for before capturing.",
                "enum": ["load", "domcontentloaded", "networkidle"],
                "type": "string"
              },
              "width": {
                "default": 1280,
                "description": "Viewport width in CSS pixels. Values above the service maximum are clamped.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "type": "number"
              },
              "cache": {
                "enum": ["hit", "rendered"],
                "type": "string"
              },
              "contentType": {
                "type": "string"
              },
              "fullPageClip": {
                "additionalProperties": false,
                "properties": {
                  "captureHeightPx": {
                    "type": "number"
                  },
                  "pageHeightPx": {
                    "type": "number"
                  }
                },
                "required": ["captureHeightPx"],
                "type": "object"
              },
              "height": {
                "type": ["number", "null"]
              },
              "imageUrl": {
                "type": "string"
              },
              "inlined": {
                "type": "boolean"
              },
              "loadEventTimedOut": {
                "const": true,
                "type": "boolean"
              },
              "width": {
                "type": ["number", "null"]
              }
            },
            "required": ["bytes", "cache", "contentType", "height", "imageUrl", "inlined", "width"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:909f9376e428e9af9fb0614f43a0718f98e6e4aec3c95ce3d34ba7fdd28f9309"
        }
      ],
      "digest": "sha256:ab10ee54ba0d9a79301c9ec056c88c57a9f3992c0d32bd04ef1a06db180a098c"
    }
  }
}
