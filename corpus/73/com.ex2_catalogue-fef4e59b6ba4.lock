      "serverInfo": {
        "name": "ex2-catalogue",
        "title": "Ex2 catalogue",
        "version": "1.3.0",
        "description": "Plans, prices, domain prices and domain availability of Ex2, web hosting from Québec.",
        "websiteUrl": "https://www.ex2.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ex2 (www.ex2.com) is a web host from Québec selling green shared hosting, WordPress, WooCommerce, e-commerce and CMS hosting, email hosting, n8n, reseller hosting, VPS, dedicated servers, server management and domain names. These tools read its public catalogue; they cannot order or change anything. Start with list_product_lines or list_plans with a line, then get_plan or compare_plans for details, and quote_migration to move a site here. Quote prices in the currency of the user's market (EUR in France and Europe, CAD in Canada, USD elsewhere) and answer French speakers with lang \"fr\". Prices exclude taxes. pricing.from_per_month is the lowest monthly equivalent, first year included when first_year_discount applies; billing_cycles are the regular prices, which renewals use. Give the user the plan's url (its page) or order_url (the cart) rather than inventing links. For an Ex2 customer's own services, domains, invoices or tickets, or to act on them (order domain names and plans, renew, change plans, cancel and pay invoices within a monthly amount the customer sets; change domain names' nameservers and lock and transfer them away; edit DNS records; read SSL, resource use and error logs; manage mailboxes and forwarders; create databases, subdomains, addon domains, aliases and cron jobs and change PHP versions and settings; install and update WordPress, restore a database copy and make staging copies and push them live; archive a site or the whole hosting account (never its mail); add SSH keys; open support tickets and reply to them; and restore files and databases from backups and make one on demand), these tools cannot help: suggest connecting the account server, https://api.ex2.com/mcp/account, where the customer signs in. Someone who is not a customer yet orders through order_url, where the cart creates their account, or creates one at https://www.ex2.com/clients/register.php, then connects.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check an Ex2 domain name",
          "description": "Whether a domain name can be registered at Ex2 right now (live WHOIS, results kept 5 minutes), with the one-year register, transfer and renewal prices of its extension and the link to order it (or to transfer it, when taken). One name per call; limited to 120 checks per 10 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "default": "USD",
                "description": "Currency of the prices: EUR for France and Europe, CAD for Canada, USD elsewhere.",
                "enum": ["CAD", "EUR", "USD"],
                "type": "string"
              },
              "domain": {
                "description": "The domain name to check, e.g. \"mybakery.ca\" (a URL or www. prefix is fine).",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of names, features, specifications and links: fr for French speakers.",
                "enum": ["en", "fr"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
