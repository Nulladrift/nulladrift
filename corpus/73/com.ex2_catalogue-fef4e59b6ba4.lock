            "additionalProperties": false,
            "properties": {
              "currency": {
                "default": "USD",
                "description": "Currency of the prices: EUR for France and Europe, CAD for Canada, USD elsewhere.",
                "enum": ["CAD", "EUR", "USD"],
                "type": "string"
              },
              "tlds": {
                "description": "Domain extensions, with or without the leading dot.",
                "items": {
