{
  "lockfileVersion": 2,
  "subjects": {
    "com.niubiagent/niubiagent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.niubiagent.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "niubiagent",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_compatibility_report",
          "title": "Read a reproducible MCP test",
          "description": "Retrieve the observations, reproduction command and source evidence for an exact report slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:57de8ecb3200279c13e23d6fc066daca653ff3ded7c68051ff3ea6a52a5253c4"
        },
        {
          "name": "get_daily_briefing",
          "title": "Get agent briefing",
          "description": "Build a compact briefing and action queue from the latest source-backed signals.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 12,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3fa5df01b4e1a65b15e0826d1ebfb82ec362c6993dacead9b906810dd7e99a2"
        },
        {
          "name": "get_latest_signals",
          "title": "Get latest signals",
          "description": "Return the newest verified AI-agent ecosystem signals with source URLs, change types, and action items.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b107ecbed2a63e3a364dcee63fcb8a91e228decc134e4f864d5a4279dfb749d"
        },
        {
          "name": "get_signal",
          "title": "Get one signal",
          "description": "Retrieve a signal by slug, including human and agent summaries, provenance, confidence, and actions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:72786bdab242bfcf219760341dc25ce9ba7799ec710d89902c200a104d166de6"
        },
        {
          "name": "get_source_health",
          "title": "Get source health",
          "description": "Inspect automated source coverage, last runs, failures, and content freshness.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d67669d0eaa7f01fbe08f436e1df5fa0982697bc016b4c5e864ef803fc7135f1"
        },
        {
          "name": "search_compatibility_reports",
          "title": "Find MCP compatibility tests",
          "description": "Search observed MCP failure modes in English or Chinese. Returns tested environments, timestamps, coverage limits and citation URLs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "default": "",
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cb843e87f8689694e55dd54e63a32e44a81000f97aec11a0206722b87ec11163"
        },
        {
          "name": "search_signals",
          "title": "Search agent ecosystem signals",
          "description": "Search and page through the full niubiagent archive by keyword, category, tag, and sort order. Returns source-backed results and pageCount.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["agent-infrastructure", "model-behavior", "safety-research", "open-source", "agent-economy"],
                "type": "string"
              },
              "cursor": {
                "description": "Use nextCursor from the prior response for bounded-cost next-page access.",
                "maxLength": 1200,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword query",
                "maxLength": 160,
                "type": "string"
              },
              "sort": {
                "default": "latest",
                "enum": ["latest", "usefulness", "confidence"],
                "type": "string"
              },
              "tag": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:59421989aedda9a11f85b94315e3689df7f09ed1dbc39084a1ee26c728b67580"
        }
      ],
      "digest": "sha256:2afbe19418912c1855d4d128832dbcd5d5fbdc6128f17ced857100816495c738"
    }
  }
}
