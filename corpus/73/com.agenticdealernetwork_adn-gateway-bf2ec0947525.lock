                "type": "string"
              },
              "cursor": {
                "maxLength": 2048,
                "minLength": 8,
                "type": "string"
              },
              "rooftop_slug": {
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$",
                "type": "string"
              },
              "view": {
                "enum": ["manifest", "summary", "full"]
              }
            },
            "required": ["cursor"],
            "type": "object"
          },
