        {
          "name": "inventory_stats",
          "title": "Count and summarize network inventory",
          "description": "Aggregate available inventory across the network in ONE call: counts, effective-price min/median/max and the top values per facet. Example: {\"dimensions\": [\"make_model\", \"body_style\"], \"condition\": \"used\", \"rooftop_slugs\": [\"mms\"]}. Geo (latitude and longitude, optional radius_miles) and oem_program_slug scope exactly as network_search. Pivot mode (group_by, up to 2 of the facets plus state, dealer_group, price_band, age_band) returns one row per group with count and medians; dimensions and group_by are mutually exclusive; format csv returns the rows as CSV. Pass country=CA for Canadian dealers.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Categorical arrays are ORed within their field; separate filter fields are ANDed together. Aggregation has no pagination or sorting input. Server-enforced: latitude requires longitude; longitude requires latitude; radius_miles requires latitude and longitude. Exactly one of dimensions | group_by is required. Additional argument rules are enforced server-side.",
            "properties": {
              "body_style": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "condition": {
                "enum": ["new", "used"]
              },
              "country": {
                "default": "US",
                "description": "Market to search; rooftops in the other country are excluded. Prices are in that country's currency; the radius stays in miles.",
                "enum": ["US", "CA"],
                "type": "string"
              },
              "dimensions": {
                "description": "One to four unique facets. make_model values join nonblank make and model with one space; rooftop values are rooftop slugs.",
                "items": {
                  "enum": ["make", "model", "make_model", "condition", "body_style", "fuel_type", "drivetrain", "exterior_color", "model_year", "rooftop"]
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "drivetrain": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "exterior_color": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "format": {
                "enum": ["json", "csv"]
              },
              "fuel_type": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "group_by": {
                "items": {
                  "enum": ["make", "model", "make_model", "condition", "body_style", "fuel_type", "drivetrain", "exterior_color", "model_year", "rooftop", "state", "dealer_group", "price_band", "age_band"]
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
