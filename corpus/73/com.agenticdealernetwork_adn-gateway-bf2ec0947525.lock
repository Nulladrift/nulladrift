                          "type": "object"
                        },
                        "maxItems": 3,
                        "type": "array"
                      },
                      "fees_total": {
                        "description": "Exact decimal amount with two places (never a JSON float).",
                        "pattern": "^-?[0-9]+\\.[0-9]{2}$",
                        "type": "string"
                      },
