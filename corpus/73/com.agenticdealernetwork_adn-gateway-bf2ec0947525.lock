        {
          "name": "network_search",
          "title": "Search network inventory",
          "description": "Browse available inventory across the network, one page at a time. For counts or distributions call inventory_stats; to copy the catalog call network_snapshot (one download replaces hundreds of pages). Results are slim summary rows; embed hero_photo_url as a markdown image when presenting a vehicle, and call inventory_get with rooftop_slug for its full photo gallery. Optional OEM program scope; optional geographic radius — latitude and longitude together; radius_miles defaults to 50 (max 500) and needs both. Rooftops without coordinates are excluded from geo-scoped results. Pass country=CA for Canadian dealers. Listed prices may exclude doc/government fees and tax — call quote_preview for the estimated total. Totals are estimates at best; when pricing_coverage is \"partial_estimate\", present the total as a subtotal excluding the charges in excluded. Always relay pricing_disclosure.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Categorical arrays are ORed within their field; separate filter fields are ANDed together. The default ordering is price_asc. Server-enforced: latitude requires longitude; longitude requires latitude; radius_miles requires latitude and longitude. sort = distance requires latitude and longitude. Additional argument rules are enforced server-side.",
            "properties": {
              "body_style": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "condition": {
                "enum": ["new", "used"]
              },
              "country": {
                "default": "US",
                "description": "Market to search; rooftops in the other country are excluded. Prices are in that country's currency; the radius stays in miles.",
                "enum": ["US", "CA"],
                "type": "string"
              },
              "drivetrain": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "exterior_color": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "format": {
                "default": "json",
                "enum": ["json", "csv"]
              },
              "fuel_type": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "interior_color": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "is_certified": {
                "type": "boolean"
              },
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "1–500 with view manifest; 1–50 for summary and full (server-enforced)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "listed_only": {
                "description": "When true, only units with at least one stored photo and a vehicle detail page (vdp_url). Absent or false returns every available unit, including stock the dealer has not merchandised yet.",
                "type": "boolean"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "make": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "model": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "model_year_max": {
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              },
              "model_year_min": {
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              },
              "odometer_max": {
                "minimum": 0,
                "type": "integer"
              },
              "oem_program_slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "description": "Zero-based row offset. Results are totally ordered and stable for an unchanged catalog, but pagination is NOT snapshot-isolated: ingestion between two page requests shifts offsets, so a traversal may duplicate or omit rows. To copy the catalog consistently: record catalog_watermark AND total from the first page, compare both on every subsequent page, and restart the traversal if either changes. Narrowing by rooftop_slug shortens each traversal and so reduces the chance of a restart. Offsets beyond 10000 are rejected; narrow the query instead.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "passenger_capacity_min": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum expiry-gated effective price: an unexpired special price when present, otherwise asking price.",
                "maximum": 99999999.99,
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Minimum expiry-gated effective price: an unexpired special price when present, otherwise asking price.",
                "maximum": 99999999.99,
                "minimum": 0,
                "type": "number"
              },
              "radius_miles": {
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "rooftop_slug": {
                "description": "Restrict results to one rooftop, as listed by network_directory. A slug that matches no rooftop returns no results rather than an error.",
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$",
                "type": "string"
              },
              "rooftop_slugs": {
                "description": "Restrict results to these network rooftops.",
                "items": {
                  "pattern": "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "sort": {
                "description": "Optional ordering; defaults to price_asc. The sort key uses NULLS LAST and is deterministically terminated by rooftop and unit ids. distance requires latitude and longitude (radius_miles defaults to 50).",
                "enum": ["price_asc", "price_desc", "year_desc", "mileage_asc", "distance"]
              },
              "transmission": {
                "oneOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "trim": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "view": {
                "default": "summary",
                "enum": ["summary", "manifest", "full"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": false,
                "properties": {
                  "catalog_version": {
                    "type": "string"
                  },
                  "catalog_watermark": {
                    "description": "Opaque revision token for the network catalog. Changes whenever an inventory ingestion is applied anywhere in the network; monotonic per catalog but carries NO timestamp semantics — compare for equality only. Null before the first ingest. Covers ingestion only: administrative reconfiguration (rooftop activation, exclusion rules, coordinates) can shift result rows without changing this token — most such events also change total, which the traversal recipe compares as well.",
                    "type": ["string", "null"]
                  },
                  "count": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "csv": {
                    "type": "string"
                  },
                  "format": {
                    "enum": ["json", "csv"]
                  },
                  "has_more": {
                    "type": "boolean"
                  },
                  "hint": {
                    "additionalProperties": false,
                    "properties": {
                      "arguments": {
                        "type": "object"
                      },
                      "reason": {
                        "enum": ["page_cap", "deep_offset"]
                      },
                      "tool": {
                        "enum": ["inventory_stats", "network_snapshot"]
