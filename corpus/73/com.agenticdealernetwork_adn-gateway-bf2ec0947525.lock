      "instructions": "Agentic Dealer Network gateway. Rooftop endpoints (/r/{slug}/mcp) serve one dealership rooftop: search its live inventory, fetch a unit by VIN, read the store record with its fee schedule (stores), preview estimated pricing (quote_preview — read-only, anonymous), and run the deal rails — deal_quote (anonymous quotes are stateless; authenticated quotes persist a deal thread), deal_hold_soft / deal_hold_release, deal_handoff (consented lead handoff), lead_prepare / lead_submit (anonymous dealership contact request), and deal_thread_get. Authenticated tools take an agent API key via 'Authorization: Bearer adn_k_...' (self-serve registration: POST /register). The network endpoint (/mcp) serves the rooftop directory, cross-network inventory search with OEM and geographic scoping, per-rooftop store records with fee schedules (stores), and quote_preview — pass rooftop_slug on network calls. Choosing a tool: a count or a distribution is one inventory_stats call, never a page walk; a shopper browse is network_search, whose hint names the cheaper call when a page is truncated; a copy of the catalog is network_snapshot (one ETag'd download replaces hundreds of pages) kept current by inventory_changes; a price context for one vehicle is inventory_comparables. Search pages carry has_more and next_offset. Network reads take country (US default, CA for Canada); the radius is always in miles and prices are shown as published by the dealer in that country's currency. Listed asking prices may exclude doc/government fees and tax; quote_preview or deal_quote return an estimated total with any price-included fees flagged included_in_price. Totals are estimates at best; when pricing_coverage is 'partial_estimate', present the total as a subtotal excluding the charges in excluded. Always relay pricing_disclosure. Fee schedules may be incomplete; an unlisted fee is not a guarantee that no such fee applies. Search results are slim summaries: hero_photo_url is deliverable, so embed it as a markdown image when presenting a vehicle; photo_count and options_count report the capped detail available. When a shopper focuses on a vehicle, call inventory_get for its full ordered photo_urls gallery and embed the first few angles. Pass rooftop_slug when calling inventory_get from the network or dealer connection surface. Dealer connection endpoints add private group reads and optional writes while retaining the network read tools. Results carry per-rooftop freshness. Per-IP or per-connection rate limited.",
      "tools": [
        {
          "name": "deal_quote",
          "title": "Request a quote",
          "description": "Out-the-door quote for one available unit at a named rooftop. Anonymous calls are stateless; authenticated calls persist a deal thread. Anonymous calls persist nothing; quote_preview is the read-only equivalent for browsing. Fee schedules may be incomplete — an unlisted fee is not a guarantee that no such fee applies; confirm final charges with the dealer. Totals are estimates at best; when pricing_coverage is \"partial_estimate\", present the total as a subtotal excluding the charges in excluded. Always relay pricing_disclosure.",
