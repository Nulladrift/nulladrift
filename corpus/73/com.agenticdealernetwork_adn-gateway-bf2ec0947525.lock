                        "type": "string"
                      }
                    },
                    "required": ["country", "currency", "odometer_unit"],
                    "type": "object"
                  },
                  "next_cursor": {
                    "maxLength": 2048,
                    "minLength": 8,
                    "type": "string"
                  },
                  "resync_required": {
                    "type": "boolean"
                  },
                  "round_upper": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "rows_emitted": {
                    "maximum": 500,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rows_scanned": {
                    "maximum": 5000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "scope": {
                    "anyOf": [
                      {
                        "pattern": "^network:(?:US|CA)$",
                        "type": "string"
                      },
                      {
                        "pattern": "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$",
                        "type": "string"
