        {
          "name": "lead_prepare",
          "title": "Ask the dealership to reach out — prepare",
          "description": "Prepare a named dealership's exact contact disclosure and a short-lived signed binding.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "customer.email requires channels to include email. customer.phone requires channels to include phone.",
            "properties": {
              "channels": {
                "items": {
                  "enum": ["email", "phone"]
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "comments": {
                "maxLength": 2000,
                "type": "string"
              },
              "customer": {
                "additionalProperties": false,
                "anyOf": [
                  {
                    "required": ["email"]
                  },
                  {
                    "required": ["phone"]
                  }
                ],
                "properties": {
                  "email": {
                    "maxLength": 254,
                    "minLength": 6,
                    "pattern": "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 30,
                    "minLength": 7,
                    "pattern": "^(?=(?:[^0-9]*[0-9]){7,15}[^0-9]*$)\\+?[0-9()\\-. ]+$",
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "include_quote": {
                "default": true,
                "description": "Set false when the shopper was not shown a quote: the disclosure then makes no price claim and quote_included is false.",
                "type": "boolean"
              },
              "rooftop_slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "unit_identity": {
                "maxLength": 30,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["channels", "customer", "rooftop_slug", "unit_identity"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": false,
                "properties": {
                  "binding": {
                    "maxLength": 16384,
                    "minLength": 1,
                    "type": "string"
                  },
                  "disclosure_text": {
                    "maxLength": 5000,
                    "minLength": 10,
                    "type": "string"
                  },
                  "expires_at": {
                    "format": "date-time",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "quote_included": {
                    "type": "boolean"
