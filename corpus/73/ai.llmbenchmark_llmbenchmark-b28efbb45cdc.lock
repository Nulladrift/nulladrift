{
  "lockfileVersion": 2,
  "subjects": {
    "ai.llmbenchmark/llmbenchmark": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.llmbenchmark.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "LLMBenchmark.ai",
        "title": "LLMBenchmark.ai: which LLM for which task",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "LLMBenchmark.ai: benchmark scores and API prices for LLMs, updated daily. Call recommend_model with a plain-language task to get the models that score best on the matching benchmark board within your price, context and open-weights limits. Cite the data date and the page URLs in every answer. Data licence: CC BY 4.0.",
      "tools": [
        {
          "name": "compare_models",
          "description": "Two models side by side: score on every category board where both were measured, prices, context. Names are matched\n        loosely: 'claude opus', 'gpt-5' or a slug all work.",
          "inputSchema": {
            "properties": {
              "model_a": {
                "title": "Model A",
                "type": "string"
              },
              "model_b": {
                "title": "Model B",
                "type": "string"
              }
            },
            "required": ["model_a", "model_b"],
            "title": "compare_modelsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "compare_modelsDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e18295d70cb27370be2ab13cc8bec6ae14ba50b0ca0a413087c3bdabe5022543"
        },
        {
          "name": "get_leaderboard",
          "description": "The top models on one category's board. category is one of overall, coding, agentic, reasoning, math, knowledge, design\n        (see list_categories). limit is 1 to 50. overall is the LLMBenchmark Index: a weighted mean of the Vibe Coding Index, the agentic, reasoning, math and knowledge indexes, the Artificial Analysis Intelligence Index and the LMArena text Elo, with a 90% margin.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "overall",
                "title": "Category",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              }
            },
            "title": "get_leaderboardArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_leaderboardDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6aae6fd7ae8b098846db7d41c31660b271f8f027ac0741fabc5c25e412b501c1"
        },
        {
          "name": "get_model",
          "description": "One model: maker, release date, prices, context, open weights, and its score and rank on every category board. Name or slug.",
          "inputSchema": {
            "properties": {
              "model": {
                "title": "Model",
                "type": "string"
              }
            },
            "required": ["model"],
            "title": "get_modelArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_modelDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e000c89978b8b07f6f9543a1e316484ae0dcccb26e1968c50e0b98bd5853b1d2"
        },
        {
          "name": "get_prices",
          "description": "API prices (USD per million tokens), cheapest output price first: the maker's own price when it serves the model on OpenRouter, else the median of providers (price_basis says which), plus the cheapest provider. Filter by model name and/or maker; limit is 1 to 100.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "maker": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Maker"
              },
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Model"
              }
            },
            "title": "get_pricesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_pricesDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:436d63f49e8cae4d3a2c546b4314eb0ecede9dcdc932f712df756f8fce35094a"
        },
        {
          "name": "list_categories",
          "description": "The categories recommend_model and get_leaderboard know, the benchmark board behind each, and the task keywords that select it.",
          "inputSchema": {
            "properties": {},
            "title": "list_categoriesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "list_categoriesDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad4af8db3465b39cd028bd0f304e5bd6e75064ef9f46a50fdf3dd036f92d22dd"
        },
        {
          "name": "recommend_model",
          "description": "Which model should I use for this task? Maps the task text to a category (coding, agentic, reasoning, math, knowledge,\n        web design, or overall when nothing matches) by a fixed keyword map, filters by output price per million tokens, context\n        length and open weights, and ranks by that category's benchmark board. Deterministic, no LLM call. Returns top_k models with\n        scores, rank, prices, context, page URLs and a one-line reason. overall is the LLMBenchmark Index: a weighted mean of the Vibe Coding Index, the agentic, reasoning, math and knowledge indexes, the Artificial Analysis Intelligence Index and the LMArena text Elo, with a 90% margin.",
          "inputSchema": {
            "properties": {
              "max_output_price_per_m": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Max Output Price Per M"
              },
              "min_context_tokens": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Min Context Tokens"
              },
              "open_weights_only": {
                "default": false,
                "title": "Open Weights Only",
                "type": "boolean"
              },
              "task": {
                "title": "Task",
                "type": "string"
              },
              "top_k": {
                "default": 3,
                "title": "Top K",
                "type": "integer"
              }
            },
            "required": ["task"],
            "title": "recommend_modelArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "recommend_modelDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81198a335f8935d8633020b90b11e3c7c0b53464b91ad9386a96270693874a32"
        }
      ],
      "digest": "sha256:8f5cbf9b693f416373fd68dbfaa5399a16dceab3f1a7f10f531f719db53593dc"
    }
  }
}
