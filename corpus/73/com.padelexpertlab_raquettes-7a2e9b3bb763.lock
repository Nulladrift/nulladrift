{
  "lockfileVersion": 2,
  "subjects": {
    "com.padelexpertlab/raquettes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://padelexpertlab.com/api/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "padel-expert-lab",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Comparateur de raquettes de padel pour la France et la Belgique, en français. Les caractéristiques viennent des fiches officielles des marques. Les prix sont les derniers relevés sur les boutiques officielles des marques : ce ne sont pas des offres, et ils ont pu changer depuis.",
      "tools": [
        {
          "name": "chercher_raquettes",
          "title": "Chercher des raquettes de padel par nom ou par critères",
          "description": "Liste les raquettes de padel par nom (marque, modèle, joueur) ou par critères : marque, niveau, forme, tranche de prix, poids, gamme femme ou junior. 10 résultats par page avec un identifiant « marque/modele-annee » pour voir_raquettes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "forme": {
                "enum": ["ronde", "goutte-d-eau", "diamant"],
                "type": "string"
              },
              "gamme": {
                "description": "Gamme femme ou junior ; sans cette valeur, les raquettes adultes mixtes.",
                "enum": ["femme", "junior"],
                "type": "string"
              },
              "marque": {
                "description": "Slug de la marque (ex. « nox », « bullpadel », « head »).",
                "pattern": "^[a-z0-9-]{2,30}$",
                "type": "string"
              },
              "niveau": {
                "description": "Niveau annoncé par la marque.",
                "enum": ["debutant", "intermediaire", "confirme"],
                "type": "string"
              },
              "nom": {
                "description": "Nom ou début de nom : marque, modèle, joueur (ex. « vertex 05 », « at10 »).",
                "maxLength": 40,
                "minLength": 2,
                "pattern": "^[\\p{L}\\p{N} +.'’-]+$",
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "poids": {
                "description": "Légère : moins de 355 g. Standard : 355 à 364 g. Lourde : 365 g et plus.",
                "enum": ["legere", "standard", "lourde"],
                "type": "string"
              },
              "prix": {
                "description": "Tranche de prix, en euros, sur la boutique officielle de la marque (borne haute comprise : 100 € est dans « jusqu-a-100 »).",
                "enum": ["jusqu-a-100", "100-200", "200-300", "plus-de-300"],
                "type": "string"
              },
              "tri": {
                "default": "populaires",
                "enum": ["populaires", "prix-croissant", "prix-decroissant", "recentes"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chercher des raquettes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10d7f272b11d732b4eccedaade30be90c67377980acde0e690c019c55b712561"
        },
        {
          "name": "recommander_raquettes",
          "title": "Recommander des raquettes de padel selon un profil de joueur",
          "description": "Donne jusqu'à 3 raquettes de padel classées par adéquation à un profil : niveau, style, poids, fréquence de jeu, budget. Même moteur que le quiz du site. Chaque raquette vient avec ses caractéristiques, le dernier prix relevé sur la boutique officielle de la marque quand il existe, et les raisons du choix.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "budget": {
                "default": "peu_importe",
                "description": "Budget maximum en euros, sur le prix de la boutique officielle de la marque. Les raquettes dans le budget passent d'abord ; une raquette plus chère ou sans prix ne complète la liste que s'il en manque.",
                "enum": ["max_100", "max_200", "max_300", "plus_de_300", "peu_importe"],
                "type": "string"
              },
              "frequence": {
                "default": "une_fois",
                "description": "Parties par semaine.",
                "enum": ["moins_d_une_fois", "une_fois", "deux_fois_ou_plus"],
                "type": "string"
              },
              "niveau": {
                "description": "Niveau du joueur : débutant (moins d'un an), joue régulièrement, ou bon niveau (souvent, en tournoi).",
                "enum": ["debutant", "regulier", "confirme"],
                "type": "string"
              },
              "poids": {
                "default": "ne_sais_pas",
                "description": "Poids souhaité : léger (moins de 355 g), standard (355 à 365 g), lourd (365 g et plus).",
                "enum": ["leger", "standard", "lourd", "ne_sais_pas"],
                "type": "string"
              },
              "style": {
                "default": "ne_sais_pas",
                "description": "Style préféré : défendre et placer, un peu de tout, attaquer et finir.",
                "enum": ["defense", "mixte", "attaque", "ne_sais_pas"],
                "type": "string"
              }
            },
            "required": ["niveau"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommander des raquettes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d373f85cba8354083b836ac26ef615952cf47b9a094c4675b363f3d93cd110c0"
        },
        {
          "name": "voir_raquettes",
          "title": "Voir les caractéristiques de 1 à 4 raquettes de padel",
          "description": "Donne les caractéristiques annoncées par la marque (forme, niveau, poids, équilibre, noyau, face), le dernier prix relevé sur la boutique officielle quand il existe, les autres versions et des alternatives pour une raquette ; un tableau côte à côte pour 2 à 4 raquettes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "raquettes": {
                "description": "De 1 à 4 identifiants « marque/modele-annee » donnés par chercher_raquettes (ex. « nox/at10-genius-18k-2026 »).",
                "items": {
                  "pattern": "^[a-z0-9-]{2,40}\\/[a-z0-9-]{3,80}$",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["raquettes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Voir des raquettes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8483892289d41b63d6deda0d3fec519cb193709e7e97f0a007c36995288062e"
        }
      ],
      "digest": "sha256:1651639048724146fa1d8adb40abeacaface7d0f2c52df5f339123424aa321cb"
    }
  }
}
