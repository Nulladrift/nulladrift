        {
          "name": "save_client",
          "title": "Create or update a client",
          "description": "Create a client (brand) or update one by client_id, and optionally turn its white-label health report link on or off. Needs a LocalSchema Pro API key in the request headers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "client_id": {
                "description": "Update this client. Omit to create one.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "contact_email": {
                "description": "Contact email. When updating, omit to keep it or send \"\" to clear it.",
                "maxLength": 255,
                "type": "string"
              },
              "contact_name": {
                "description": "Contact person. When updating, omit to keep it or send \"\" to clear it.",
                "maxLength": 160,
                "type": "string"
              },
              "name": {
                "description": "Client (brand) name. Required when creating; omit to keep it when updating.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "report": {
                "description": "true turns the client's white-label health report link on, false turns it off. Omit to leave it.",
                "type": "boolean"
              },
              "website": {
                "description": "Brand website; links every branch to one Organization in the client embed. When updating, omit to keep it or send \"\" to clear it.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
