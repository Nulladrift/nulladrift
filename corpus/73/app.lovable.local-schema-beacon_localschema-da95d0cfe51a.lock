{
  "lockfileVersion": 2,
  "subjects": {
    "app.lovable.local-schema-beacon/localschema": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://local-schema-beacon.lovable.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "local-schema-beacon",
        "title": "Local Schema Beacon",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LocalSchema generates, validates and hosts LocalBusiness JSON-LD (schema.org structured data) for local businesses and the agencies that run their local SEO.\n\nFree tools, no key: list_business_types, generate_schema, validate_schema, validate_page, get_embed_snippet.\nAccount tools (list_clients, save_client, list_locations, get_location, save_location, run_health_check) need a LocalSchema Pro API key sent as the HTTP header \"Authorization: Bearer ls_…\" or \"X-API-Key: ls_…\" in the MCP client's connection settings. Keys are created under Settings → API keys at https://local-schema-beacon.lovable.app/app/settings. Never ask for the key in chat and never pass it as a tool argument.\n\nAdding markup to a site: pick the most specific businessType (list_business_types), call generate_schema, fix every issue with severity error, insert script_tag into the page <head>, then call validate_page on the deployed URL.\nManaging client sites: save_location with publish: true, install the returned embed script_tag once on the client's site, then run_health_check. Later edits only need save_location with publish: true — the embed updates the site automatically.\nOpening hours use 24-hour HH:MM with day names or ranges (\"Mo-Fr\"); days not listed are closed; add two entries for split hours.",
      "tools": [
        {
          "name": "generate_schema",
          "title": "Generate LocalBusiness schema",
          "description": "Generate LocalBusiness JSON-LD (schema.org) from business details and validate it against Google's rich result rules. Returns the JSON-LD, a ready-to-paste <script> tag and issues to fix. No API key needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acceptsReservations": {
                "type": "boolean"
              },
              "address": {
                "properties": {
                  "addressCountry": {
                    "description": "ISO 3166-1 alpha-2, e.g. NL or US",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "addressLocality": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "addressRegion": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "postalCode": {
                    "maxLength": 20,
                    "type": "string"
                  },
                  "streetAddress": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "alternateName": {
                "maxLength": 200,
                "type": "string"
              },
              "areaServed": {
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "businessType": {
                "default": "LocalBusiness",
                "description": "schema.org type, e.g. Dentist, Plumber, Restaurant. See /business-types.",
                "maxLength": 60,
                "type": "string"
              },
              "currenciesAccepted": {
                "items": {
                  "maxLength": 3,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "email": {
                "maxLength": 200,
                "type": "string"
              },
              "foundingDate": {
                "pattern": "^\\d{4}(-\\d{2}-\\d{2})?$",
                "type": "string"
              },
              "geo": {
                "properties": {
                  "latitude": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "hasMap": {
                "maxLength": 2000,
                "type": "string"
              },
              "images": {
                "items": {
                  "maxLength": 2000,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "isAcceptingNewPatients": {
                "type": "boolean"
              },
              "knowsLanguage": {
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "legalName": {
                "maxLength": 200,
                "type": "string"
              },
              "logo": {
                "maxLength": 2000,
                "type": "string"
              },
              "medicalSpecialty": {
                "maxLength": 80,
                "type": "string"
              },
              "menu": {
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "Public business name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "openingHours": {
                "description": "Regular hours. Days not listed are closed. Use two entries for split hours.",
                "items": {
                  "properties": {
                    "allDay": {
                      "description": "Open 24 hours on these days",
                      "type": "boolean"
                    },
                    "closes": {
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "days": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      ],
                      "description": "Day names or ranges: \"Mo-Fr\", [\"Saturday\"]"
                    },
                    "opens": {
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    }
                  },
                  "required": ["days"],
                  "type": "object"
                },
                "maxItems": 21,
                "type": "array"
              },
              "paymentAccepted": {
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "priceRange": {
                "description": "e.g. €€ or €20-€80",
                "maxLength": 30,
                "type": "string"
              },
              "rating": {
                "description": "LocalSchema Pro — omitted from free output",
                "properties": {
                  "bestRating": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "ratingValue": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "reviewCount": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["ratingValue", "reviewCount"],
                "type": "object"
              },
              "reviews": {
                "description": "LocalSchema Pro — omitted from free output",
                "items": {
                  "properties": {
                    "author": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "body": {
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "datePublished": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "rating": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["author", "rating"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "sameAs": {
                "description": "Google Business Profile, Yelp, Facebook, LinkedIn… profile URLs",
                "items": {
                  "maxLength": 2000,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "servesCuisine": {
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "serviceAreaOnly": {
                "description": "True for service-area businesses without a storefront (address is hidden)",
                "type": "boolean"
              },
              "services": {
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "price": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "priceMax": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "priceType": {
                      "enum": ["fixed", "from", "range"],
                      "type": "string"
                    },
                    "unitText": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "url": {
                      "maxLength": 2000,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "slogan": {
                "maxLength": 200,
                "type": "string"
              },
              "specialHours": {
                "description": "Holiday exceptions (LocalSchema Pro — omitted from free output)",
                "items": {
                  "properties": {
                    "closed": {
                      "type": "boolean"
                    },
                    "closes": {
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "opens": {
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "validFrom": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "validThrough": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["validFrom"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "telephone": {
                "description": "International format, e.g. +31 50 123 4567",
                "maxLength": 40,
                "type": "string"
              },
              "url": {
                "description": "Website URL (https://…)",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:036d4b878af21230e643789848f5044489d63d7984e3f60b278cb5cb490905e1"
        },
        {
          "name": "get_embed_snippet",
          "title": "Get hosted embed snippet",
          "description": "Get the install snippet and live status for a LocalSchema hosted embed key (loc_… for one location, org_… for a client with several). Paste the script tag once; published updates reach the site automatically.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "key": {
                "description": "Hosted embed key",
                "pattern": "^(?:loc|org)_[a-z0-9]{6,32}$",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:31df4c460b140ddf267af83658ee36a2fef4a17a464cfc5396bc223626eddc4c"
        },
