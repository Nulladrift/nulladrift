      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "uCAD is a simple 3D CAD that builds models from scripts in its own small Python. Before writing any script, call specs: it gives the language (every function and the objects they return) and how this service works. The language grows often: call specs at the start of every session even if you saved notes or a skill about uCAD before (it is at spec version e597bdd3ef now). Then build with run_script, check what came out (its report and pictures), fix and run again; view and scene show a drawing as it is now. After building, always give the user the drawing's link (it is in run_script's answer): in uCAD they can turn the model around, measure it, cut sections, share it and export STL, OBJ or DXF; this service only makes pictures. That link opens only for the user, signed in: when they want to show the drawing to someone else, share gives a link anyone can open.",
      "tools": [
        {
          "name": "drawings",
          "title": "The account's drawings",
          "description": "The drawings kept in the user's uCAD account, newest first: id, name, when changed, link (and the link anyone can open, for those shared).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:29970688b908c81c84433d59cd43d18d8a0ec37c8336599a71587f3f422c4230"
        },
        {
          "name": "example",
          "title": "Read a reference example",
          "description": "The script of one of the reference examples listed by specs (by its id): a finished model built carefully in uCAD's language, to learn from before building something like it.",
          "inputSchema": {
            "properties": {
              "id": {
                "enum": ["villa", "fachwerk", "house", "staircase", "apartment", "kitchen", "diningset", "drawers", "garden", "desklamp", "toilet", "teapot", "gears", "flange", "enclosure"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:44c969f57dbbda12c4509a9b40c4c20a15e7e6463b67592465027edbab04bda8"
        },
        {
          "name": "run_script",
          "title": "Build: run a uCAD script",
          "description": "Run a whole uCAD script on a drawing in the user's account (a new drawing when `drawing` is left out) and keep the result there. Returns the report (every solid with its size and place, warnings, print() output, or the error with its line), the drawing's id and link, and pictures of it. Each run replaces what the drawing's previous run made. The language is at spec version e597bdd3ef: if what you know of it is another version (or none), call specs first.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The whole script (uCAD's Python, see specs)",
                "type": "string"
              },
              "drawing": {
                "description": "The id of the drawing to run it on. Left out: a new drawing.",
                "type": "string"
              },
              "height": {
                "description": "Picture height in pixels (default 600)",
                "maximum": 1200,
                "minimum": 150,
                "type": "integer"
              },
              "name": {
                "description": "A name for a new drawing (as the user sees it in Open)",
                "type": "string"
              },
              "spec_version": {
                "description": "The spec version (from specs) the script is written for. Now: e597bdd3ef",
                "type": "string"
              },
              "views": {
                "description": "The sides to show it from (one picture each): iso, iso_back, front, back, left, right, top, bottom. Default: iso.",
                "items": {
                  "enum": ["iso", "iso_back", "front", "back", "left", "right", "top", "bottom"],
                  "type": "string"
                },
                "type": "array"
              },
              "width": {
                "description": "Picture width in pixels (default 800)",
                "maximum": 1600,
                "minimum": 200,
                "type": "integer"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
