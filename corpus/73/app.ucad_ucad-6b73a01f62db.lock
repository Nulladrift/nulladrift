      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "uCAD is a simple 3D CAD that builds models from scripts in its own small Python. Before writing any script, call specs: it gives the language (every function and the objects they return) and how this service works. The language grows often: call specs at the start of every session even if you saved notes or a skill about uCAD before (it is at spec version cae9943a0a now). Then build with run_script, check what came out (its report and pictures), fix and run again; view and scene show a drawing as it is now. After building, always give the user the drawing's link (it is in run_script's answer): in uCAD they can turn the model around, measure it, cut sections, share it and export STL, OBJ or DXF; this service only makes pictures. That link opens only for the user, signed in: when they want to show the drawing to someone else, share gives a link anyone can open.",
      "tools": [
        {
          "name": "drawings",
          "title": "The account's drawings",
          "description": "The drawings kept in the user's uCAD account, newest first: id, name, when changed, link (and the link anyone can open, for those shared).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
