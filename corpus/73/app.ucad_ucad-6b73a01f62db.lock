        },
        {
          "name": "share",
          "title": "A link anyone can open",
          "description": "A link to a drawing that anyone can open, with no uCAD account: they see the drawing as it is now (and as it changes later) in uCAD, and can turn it around, measure it, cut sections, download it and edit a copy of their own; its script isn't in it. Use it when the user wants to show or send the model to someone else, or post it: the drawing's own link (?d=) opens only for the user, signed in. Each drawing has one such link: asked again, share gives the same one.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "on (default): the drawing's link, made if it has none. renew: a new link, and the old one stops working. off: the link stops working.",
                "enum": ["on", "renew", "off"],
                "type": "string"
              },
              "drawing": {
                "description": "The drawing's id (from an earlier run_script, or from drawings). Left out: the drawing worked on last.",
                "type": "string"
              }
            },
            "type": "object"
