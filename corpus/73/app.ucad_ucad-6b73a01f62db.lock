          "digest": "sha256:3ed009a3245dbe10675dda359fbff8227a5adfdc1b07a765a81b85db70565699"
        },
        {
          "name": "run_script",
          "title": "Build: run a uCAD script",
          "description": "Run a whole uCAD script on a drawing in the user's account (a new drawing when `drawing` is left out) and keep the result there. Returns the report (every solid with its size and place, warnings, print() output, or the error with its line), the drawing's id and link, and pictures of it. Each run replaces what the drawing's previous run made. Scripts are in uCAD's language at spec version cae9943a0a (see specs).",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The whole script (uCAD's Python, see specs)",
                "type": "string"
              },
              "drawing": {
                "description": "The id of the drawing to run it on. Left out: a new drawing.",
                "type": "string"
              },
              "height": {
                "description": "Picture height in pixels (default 600)",
                "maximum": 1200,
                "minimum": 150,
                "type": "integer"
              },
              "name": {
                "description": "A name for a new drawing (as the user sees it in Open)",
                "type": "string"
              },
              "spec_version": {
                "description": "The spec version (from specs) the script is written for. Now: cae9943a0a",
                "type": "string"
              },
              "views": {
                "description": "The sides to show it from (one picture each): iso, iso_back, front, back, left, right, top, bottom. Default: iso.",
                "items": {
                  "enum": ["iso", "iso_back", "front", "back", "left", "right", "top", "bottom"],
                  "type": "string"
                },
                "type": "array"
              },
              "width": {
                "description": "Picture width in pixels (default 800)",
                "maximum": 1600,
                "minimum": 200,
                "type": "integer"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
