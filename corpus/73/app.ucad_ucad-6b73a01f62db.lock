          "digest": "sha256:29970688b908c81c84433d59cd43d18d8a0ec37c8336599a71587f3f422c4230"
        },
        {
          "name": "example",
          "title": "Read a reference example",
          "description": "The script of one of the reference examples listed by specs (by its id): a finished model built carefully in uCAD's language, to learn from before building something like it.",
          "inputSchema": {
            "properties": {
              "id": {
                "enum": ["villa", "fachwerk", "house", "staircase", "apartment", "kitchen", "diningset", "drawers", "garden", "desklamp", "toilet", "teapot", "gears", "flange", "enclosure", "bungalow", "smallhouse", "peninsula", "kitchendiner", "openkitchen", "kidsroom", "nook"],
                "type": "string"
