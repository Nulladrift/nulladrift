      "instructions": "# DexPaprika MCP: agent usage notes\n\n## `rationale` field (required on every read tool)\nEvery read tool (`getNetworks`, `getPoolDetails`, etc.) requires a `rationale` string of 20-500 chars.\nFormat: 1-2 sentences referencing (a) what triggered the call and (b) downstream use.\nDo not include user PII or secrets. Rationales are logged for MCP improvement and never shown to end users.\n\nExamples:\n- \"User asked for SOL price; calling getTokenDetails to fetch current USD value.\"\n- \"Building a portfolio dashboard; need top pools for WETH on ethereum to estimate liquidity.\"\n- \"Backtesting USDC/WETH spread; fetching 24h OHLCV at 1h interval.\"\n\n`submitFeedback` is the exception: it has its own `goal`/`expected`/`observed` fields which serve as the rationale.\n\n## Tool discovery\nStart with `getNetworks` (discover supported chains) or `getCapabilities` (agent-onboarding doc: network synonyms, workflow patterns, common pitfalls). Both are free, cached, and have no parameters beyond rationale.\n\n## Your own API key: getTokenOHLCV, getPoolTransactions and getTokenIndicator\n`getTokenOHLCV` (USD candles for a token across all its pools), `getPoolTransactions` (a pool's individual swaps) and `getTokenIndicator` (RSI, EMA, MACD, Bollinger Bands or VWAP on those token candles) need a Dev, Pro or Enterprise plan and run on the caller's own key, never on this server's. The user sets the key as the `Authorization` header on their connection to this server, the key on its own, then reconnects. Without it these tools return `DP401_API_KEY_REQUIRED` and call nothing upstream; relay the setup steps (`setup_url` in the error) or use the error's `fallback_tool` (`getPoolOHLCV` or `getPoolIndicator` on the token's most liquid pool; `getPoolDetails` for a pool's 24h transaction counts). `getPoolOHLCV` and `getPoolIndicator` run on this server's key for candles of 10m and longer within the last 7 days; for finer candles or older history they use the caller's key when the connection carries one, and otherwise return `DP403_PLAN_REQUIRED`. Every other tool works with or without a key.\n\n## Technical indicators\n`getPoolIndicator` returns RSI, EMA, MACD, Bollinger Bands or VWAP for a pool, computed server-side from its OHLCV candles, so there is no need to fetch candles and compute them. Pick one with `indicator` and always pass `interval`. Send only the parameters of that indicator (`period`; `fast_period`/`slow_period`/`signal_period` for macd; `std_dev` for bbands): any other is refused with 400.\n\n## Parameter naming\nSort parameters accept both legacy and canonical names; pick whichever is clearer, the server normalizes both. Canonical names (preferred going forward):\n- `sort_dir` (legacy: `sort`): sort direction, \"asc\" or \"desc\".\n- `sort_by` (legacy: `order_by`): sort field, tool-specific enum.\n\n`getTokenPools` proxies the network-scoped /pools/search with a `token_address` filter (the old /tokens/{token_address}/pools endpoint was removed). The token filter has no cross-network equivalent. Results are pool-perspective only: the old `inversed`/`reorder` flip and `paired_token_address`/`address` second-token filter were removed with the endpoint and return an explicit error if supplied.\n\n`getDexPools` kept its name and its `dex` argument, but on 2026-08-05 the endpoint underneath changed: /networks/{network}/dexes/{dex}/pools was removed and the tool now proxies /networks/{network}/pools/search with a `dex_name` filter. Rows arrive under `results` with `has_next_page` + `next_cursor`, not under `pools` with `page_info`, and the 24h volume field is `volume_usd_24h`, not `volume_usd`. `cursor` replaces `page`: page 2 and above return an explicit error rather than silently repeating page 1.\n\nPagination is 1-indexed; the server accepts `page=0` as a backward-compat alias for `page=1`.\n\n## Time formats\n- `getPoolOHLCV.start` / `.end` (and the same on `getTokenOHLCV`, `getPoolIndicator` and `getTokenIndicator`): a relative offset from now is simplest (`-24h` = last 24 hours, `-7d`, `-90m`; units s, m, h, d) and needs no knowledge of today's date. Also accepts RFC3339 (`2024-01-01T00:00:00Z`), Unix epoch seconds and `YYYY-MM-DD` (treated as 00:00:00 UTC).\n- `getPoolTransactions.from` / `.to`, and `created_after` / `created_before` on getNetworkPoolsFilter and filterNetworkTokens: the same shapes as `start`, so a relative offset (`-1h`, `-24h`, `-7d`), Unix epoch seconds, RFC3339 or `YYYY-MM-DD`. Transactions: window capped to last 7 days.\n- Pool and token search on this server runs an hour behind, like a free key: pools and tokens created in the last hour are left out, so a `created_after` window shorter than an hour comes back empty. A Dev plan or higher on your own key, calling the API directly, sees them as they are indexed.\n\n## Output shape\nAll tools return both `content[0].text` (JSON string, for older clients) and `structuredContent` (validated against the tool's `outputSchema`, 2025-06-18+). Prefer `structuredContent` to avoid the parse round-trip.\n\nArray-returning tools wrap the array under a named key in structuredContent: `getNetworks` gives `{ networks: [...] }`, `getPoolOHLCV` and `getTokenOHLCV` give `{ ohlcv: [...] }`, `getTokenMultiPrices` gives `{ prices: [...] }`.",
