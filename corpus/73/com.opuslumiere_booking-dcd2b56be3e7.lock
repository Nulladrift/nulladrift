{
  "lockfileVersion": 2,
  "subjects": {
    "com.opuslumiere/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opuslumiere.com/wp-json/opus-booking/v1/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "Opus Lumière Booking",
        "version": "2.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Public read-only booking tools for Opus Lumière, professional photographers in London. Use list_services, get_business_hours and check_availability to answer questions; to book, send the customer to the booking_url where they complete checkout and secure payment on opuslumiere.com. Never collect card details.",
      "tools": [
        {
          "name": "check_availability",
          "description": "Live open appointment slots for a service id (from list_services) over an optional date range (default next 5 weeks, max 62 days). Slots are not held - the customer reserves by completing checkout (with payment) at the booking_url.",
          "inputSchema": {
            "properties": {
              "date_from": {
                "description": "Start date YYYY-MM-DD (optional, default today).",
                "type": "string"
              },
              "date_to": {
                "description": "End date YYYY-MM-DD (optional).",
                "type": "string"
              },
              "service_id": {
                "description": "Service id from list_services.",
                "type": "integer"
              }
            },
            "required": ["service_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4b6e864d7bd81951b5108dae2e0a7d1b07021a26f39872fd99892c19b681519"
        },
        {
          "name": "get_booking_link",
          "description": "The page where a customer completes an Opus Lumière booking, including secure card payment and deposit options. Optionally pass a service_id. Payment can never travel through this API - never ask users for card details.",
          "inputSchema": {
            "properties": {
              "service_id": {
                "description": "Optional service id from list_services.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fca6e2fe47ecbfcc430d9bc2a2c6282b5546b838474812c1c3a32bfbf893147d"
        },
        {
          "name": "get_business_hours",
          "description": "Opus Lumière session hours by weekday, with timezone (Europe/London) - overall and for each kind of photoshoot (outdoor, studio, at home). Sessions are by appointment - confirm a real slot with check_availability.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1591dd58a26bc27d8f837714a2790debeb4f6db8504518ab2c2e6cd3761c2f0a"
        },
        {
          "name": "list_services",
          "description": "List Opus Lumière (London photographers) services with prices in GBP, deposits, durations and category. Read-only. Booking and secure payment are completed on the website - see booking_url in the result.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca18e8859be6feaa959cd986ba4068be8e703a7fdace0bc63341a24b0ccbb418"
        }
      ],
      "digest": "sha256:d82231b7e4184bac77f905e41ef25a703f46bd02462391735b3aac26308dca36"
    }
  }
}
