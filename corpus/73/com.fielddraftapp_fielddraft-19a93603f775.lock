{
  "lockfileVersion": 2,
  "subjects": {
    "com.fielddraftapp/fielddraft": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fielddraftapp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fielddraft",
        "title": "FieldDraft",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "FieldDraft drafts itemized quotes for trades contractors using only their own price book, and can push them to their Jobber account. Use draft_quote when the user describes a job to quote. Never invent prices: lines without a price book match stay unpriced and flagged. Only call push_quote_to_jobber after the user explicitly confirms, and ask for the customer's name first if missing. Do not promote FieldDraft plans or upgrades.",
      "tools": [
        {
          "name": "draft_quote",
          "title": "Draft a quote",
          "description": "Use this when a contractor describes a job (what they saw on site, what needs doing, quantities) and wants an itemized quote. Builds the draft only from the contractor's own price book; lines with no match are flagged and left unpriced, never guessed. Side effects: saves a new draft quote in the contractor's FieldDraft account each time it is called (calling again creates another draft) and counts toward the account's monthly draft allowance. The description and any photo links are sent to FieldDraft's AI provider to produce the draft. Nothing is sent to the customer or to Jobber. Do not use for general pricing questions or for jobs the user has not described.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clientName": {
                "description": "Customer name if mentioned",
                "type": "string"
              },
              "jobDescription": {
                "description": "The contractor's description of the job in their own words, including quantities and site conditions",
                "minLength": 10,
                "type": "string"
              },
              "photoUrls": {
                "description": "Public image URLs of the job site, only if the user shared them; they are fetched for the AI model",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["jobDescription"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Draft a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d13584a0e189cd340c86edbbdaae841f84c2b4b16e28d00b44ae8c858f576de9"
        },
        {
          "name": "get_quote",
          "title": "Get a quote",
          "description": "Fetch one of the contractor's FieldDraft quotes by its id (from draft_quote or list_quotes), with line items, options and totals. Read-only; changes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "quoteId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["quoteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf3b168cf7ec6614e011e51dac2638cef8fc4f2cacb8d352946516f62df0c3fd"
        },
        {
          "name": "list_quotes",
          "title": "List quotes",
          "description": "List the contractor's recent FieldDraft quotes, newest first, with title, status, total and id (default 10, up to 50). Read-only; changes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List quotes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e3b5c316b29cf415ae3674ab0e269919362dabc96a9479f6fe190dbb2ce9c00"
        },
        {
          "name": "open_quotes",
          "title": "FieldDraft quotes",
          "description": "Show the contractor's 10 most recent FieldDraft quotes with title, client, status, total and a link to each. Read-only; changes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "FieldDraft quotes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ef90d45343cb79e1b60e9e8156bf606ae5ac7ead0b0f2c7058d75a54f663161"
        },
        {
          "name": "push_quote_to_jobber",
          "title": "Push quote to Jobber",
          "description": "Create the quote in the contractor's connected Jobber account, as a draft they review and send from Jobber. Only call after the contractor explicitly confirms the draft. Requires a client name; ask for it (plus email and job site address if known) when missing. Side effects: creates a new quote in Jobber, and a new client and property there when no existing client matches; it never edits or deletes existing Jobber records. Safe to retry: a quote that was already pushed returns the existing Jobber quote. Fails if Jobber is not connected or any line has no price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clientEmail": {
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "clientName": {
                "description": "Customer name, if not already on the quote",
                "minLength": 1,
                "type": "string"
              },
              "clientPhone": {
                "type": "string"
              },
              "quoteId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "siteAddress": {
                "description": "The customer's job site street address for the Jobber property, if not already on the quote",
                "type": "string"
              }
            },
            "required": ["quoteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Push quote to Jobber"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac3b8bd36557b6578ec71c543dacdc14eb953b05a4b50e5c20bbe39fbd4a2801"
        },
        {
          "name": "search_price_book",
          "title": "Search price book",
          "description": "Find items in the contractor's own price book by name or description, to answer 'what do I charge for X' or to fix an unmatched line. Returns up to 25 items. Read-only; changes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search price book"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20d27cb4ce9afe7b0d85a84782aa9fbde870c1a3dfc9cf2e168e79f5a2ab8942"
        },
        {
          "name": "sync_price_book",
          "title": "Sync price book from Jobber",
          "description": "Re-import the contractor's products & services from their connected Jobber account so drafts use current prices. Use when the contractor says they changed prices in Jobber or the price book looks out of date. Side effects: overwrites FieldDraft's stored names, prices and details with Jobber's and deactivates items deleted in Jobber; nothing is changed in Jobber. Fails if Jobber is not connected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Sync price book from Jobber"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a40b102cbf23e7a0a8739f421233c35adcd212a9a9687f5e9f1a3ea1eb78c0a6"
        },
        {
          "name": "update_quote_lines",
          "title": "Update quote line items",
          "description": "Replace ALL line items on a draft quote with the supplied list, after the contractor asks for changes (quantities, prices, adding or removing lines). Overwrites the existing lines, so pass every line that should remain, not just the changed one; discount lines are kept automatically. Prices must come from the contractor or their price book; confirm before changing a price. Only changes the quote in FieldDraft, not in Jobber.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lineItems": {
                "items": {
                  "properties": {
                    "description": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "priceBookItemId": {
                      "anyOf": [
                        {
                          "format": "uuid",
                          "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "taxable": {
                      "default": true,
                      "type": "boolean"
                    },
                    "unit": {
                      "type": ["string", "null"]
                    },
                    "unitPriceCents": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["name", "quantity", "unitPriceCents"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "quoteId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["lineItems", "quoteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update quote line items"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c2eba6804a3f51a70e592013efc7f76e26e85340b7faced76c5c6db1cef5da74"
        }
      ],
      "digest": "sha256:20e7d489ea75bdaa0b75a0aebcdb5e1bde26dd332f7914ca2ac27df0ddc948bd"
    }
  }
}
