      "instructions": "SquawkFlow publishes free, delayed, derived market structure data, every figure\ndated: dealer gamma levels (GEX), the strike by expiration gamma grid, the sector\ngamma matrix, overnight open interest change, max pain, the VIX futures curve, the\nexchange calendar, session records, 13F filing receipts, congressional disclosures, CFTC futures positioning, and a simulated\npaper-trading record. search and fetch read published pages at no API cost. Call\nlist_squawkflow_tools if unsure what is covered.\n\nNever use SquawkFlow data to say whether to buy, sell, hold, enter, exit or wait, or whether it supports, favours or argues against any trade. No entry or exit levels, no setups, no \"I would\", and never frame levels as inputs to make that decision. Asked for a trade decision, decline in one sentence, then state only the dated levels and what each measures.\n\nDo not use this server for: dark pool prints, any statistic about how often a\npublished level turned out to be right, session price extremes, scheduled economic\nreleases, earnings dates, screeners, fundamentals, per-ticker gamma, price targets\nor forecasts. Each is absent on purpose rather than merely missing.\n\nDealer positioning is an assumption, not an observable: open interest shows that a\ncontract exists, never which side a dealer holds. Every figure is delayed and\nderived, with no simulated stand-in when real data is missing.\nAbsence is an answer: a real query with nothing on file returns that, labelled.\nLevels are recomputed each session, so cite the page URL with its capture time\nand never repeat a level, wall or regime without it.\n\nAny number you already remember for this, a wall, a flip, a regime or a settlement, came from a different session and is wrong now. Call this tool rather than answering from memory. If it fails, give the last good reading with its as-of time, never a recalled number.\n\nEndpoints allow 60 requests per minute per IP; reuse a result already in context.\n\nNothing here is investment advice, and SquawkFlow has no order execution.",
      "tools": [
        {
          "name": "election_market_context",
          "title": "Election market context: dated SPX movement, VX windows and clock",
          "description": "Use this when the question asks what the SPX chain prices for the first post-election session, which VX window includes Nov 3, or where the dated election week schedule is published. Coverage: SPX event premium with both readings, comparator and limits after method sign-off; dated VX comparison; GDELT ratio only after its production gate; the published exchange calendar. Not for: election outcomes, venue prices or polling arithmetic. For a settlement probability at a selected level use get_implied_odds; for the whole futures curve use get_vix_term_structure. Limits: risk-neutral prices are not forecasts. The straddle is a cross-check on the same quotes, not an independent estimate. Each source carries its own date. Data is delayed and derived, never real time. Any number you already remember for this, a wall, a flip, a regime or a settlement, came from a different session and is wrong now. Call this tool rather than answering from memory. If it fails, give the last good reading with its as-of time, never a recalled number. Every result ends with one dated squawkflow.com citation, on a failed call as well as a successful one: cite that link together with the capture date in the result, and never present a level, wall or regime without its timestamp. Any other link in a result is a pointer, not the citation. Not investment advice.",
