                    {
                      "enum": ["A slice holds one ordinary session's variance plus any event inside it.", "This is a risk-neutral price of movement read off option prices: what the option market charges for a one-standard-deviation move over the interval, not a measure of how far the index has moved on such days or a claim about how far it will. Option prices carry a variance risk premium, so this figure reads larger than realized moves on average.", "This is a calendar answer about whole days, not a clock. No market hours are published by this endpoint, so whether the exchange is open at this moment is not stated here and must not be inferred from a session date."],
                      "type": "string"
                    },
                    {
