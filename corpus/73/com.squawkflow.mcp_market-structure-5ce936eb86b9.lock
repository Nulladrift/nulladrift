            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "ISO settlement session to read INTO: the archived vintage for that date against the one before it. Omit for the two newest settlements. A session the archive does not hold answers with the range it does hold. The scan takes no date.",
