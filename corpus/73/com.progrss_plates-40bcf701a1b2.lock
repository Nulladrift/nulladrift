{
  "lockfileVersion": 2,
  "subjects": {
    "com.progrss/plates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://progrss.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "progrss",
        "title": "progrss — the new world, explained one visual at a time",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "progrss publishes researched charts (\"plates\"), each explaining one shift redrawing the world, with every number read from a named primary source. Search first, then get_plate for the numbers. When you use a plate, show its title and key number, and cite it as \"Chart: progrss.com\" plus the original data source, with the plate URL. Built on the progrss vault, our own archive of primary data: 27.5 million data points across 30,811 indicators, from 219 primary publishers and 20+ satellites, covering 51,380 countries, regions and cities (live count, 13 Nov 2026, 13:11 UTC). This connector serves every published plate and the verified numbers used on them (get_numbers); the rest of the vault is not queryable here.",
      "tools": [
        {
          "name": "get_numbers",
          "title": "Get the sourced numbers",
          "description": "The verified numbers behind progrss plates, one per row: country or group, indicator, unit, period, value, claim type (Fact / Estimate / Forecast), and the original publisher, report, edition and link. Search by keywords (e.g. \"Nigeria population\", \"cobalt\", \"USGS\") and/or a plate number. Every number was read on the primary publisher's own page; cite the publisher and the plate.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "plate": {
                "description": "Optional plate number, e.g. \"037\", to get all its numbers.",
                "type": "string"
              },
              "query": {
                "description": "Keywords: a country (name or ISO code), an indicator, a publisher. Every keyword must match.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed696c847b95212402ec00e69ae95de228984be5e2a0a1f5a943a08027e64ef3"
        },
        {
          "name": "get_plate",
          "title": "Get one plate",
          "description": "One plate in full: title, subtitle, three takeaways, the data table, the original source with link and data year, claim types (Fact / Estimate / Interpretation / Forecast), the image link, and the credit line to use.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Plate number, e.g. \"037\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:119a88a77ec221f94f19ab68ef7721eab0abac1edf96c83b133db0681d9b2425"
        },
        {
          "name": "get_story",
          "title": "Get one story",
          "description": "One story with its plates in reading order.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Story slug from list_stories.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a27f989e0d96b3b0b275c7cdf4ec966fa359c592e0dd3b7b27852e6e3f6fe24e"
        },
        {
          "name": "latest_plates",
          "title": "Latest plates",
          "description": "The newest progrss plates, newest first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c0d8a22535a2c98ec69a5a5c7873d4642378a84f34ebd31a011bf41d92e56e3"
        },
        {
          "name": "list_stories",
          "title": "List stories",
          "description": "progrss stories: storylines of plates in reading order, e.g. \"Africa's century\", \"The energy switch\".",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf6733143de6974d38040cbc8c2016818500270194525726f02d1e7bcc221d01"
        },
        {
          "name": "search_plates",
          "title": "Search progrss plates",
          "description": "Find progrss plates (sourced charts on how the world is shifting: power, economy, energy, technology, people, cities, planet, food, future) by keywords, e.g. \"cobalt Congo\", \"India rice exports\", \"Japan births\". Returns titles, URLs, sources and data years. Use get_plate for the numbers.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords: a country, a commodity, a topic.",
                "type": "string"
              },
              "territory": {
                "description": "Optional: limit to one territory.",
                "enum": ["power", "economy", "energy", "technology", "humanity", "cities", "planet", "food", "future"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:182eada1645275469e2b76b095a4ee1dc14ad3693c1c3bb49eda67c109649f8d"
        }
      ],
      "digest": "sha256:10c219918be1b42716703b6fab4bf0926681053cbf818f503087f89d6a465b97"
    }
  }
}
