      "instructions": "GenPPT makes AI presentation decks and social slideshows.\nTwo ways to start:\n(a) You wrote the slides (from the user's files, images, or research): genppt_create_slideshow with title and slides[] (1-25; X portrait posts take up to 20 images). It renders straight to slide images. Then genppt_get_deck(deckId, waitSeconds: 30) until phase ready, and use slideImageUrls or genppt_export_deck.\n(b) Only a topic or notes: genppt_create_deck → genppt_get_deck(waitSeconds: 30) → at phase concepts_ready show the concept and call genppt_generate_slides → genppt_get_deck until phase ready → genppt_export_deck.\nGive every slide real visual proof: websiteUrls or slides[].screenshotUrl for live webpage screenshots, slides[].imageUrl for brand logos, product UI, or charts, slides[].unsplashQuery for a real photo. Name the brands and apps on a slide so their logos appear; never ask visual for hand-painted fake browser windows when no screenshotUrl is attached. Never plan plain text-only dark cards. Keep Slide 1 to a bold 4-8 word cover without subtitle paragraphs or chyron stickers, and keep other slides to a headline and at most one short sentence. No em dashes, no AI-slop phrasing such as \"isn't X, it's Y\" or \"Hits Harder\", no fake poll buttons, and no number repeated twice on one slide.\ngenppt_revise_slides edits slides of a ready deck; pass revisions[] for redraws/assets, or flat top-level placements[] (or revisions[].placeImages) to paste exact images into boxes with no redraw. genppt_hot_topics gives today's trending topics for slideshow ideas.\ngenppt_export_deck builds instant full-slide image PPTX, PDF, or ZIP files; paid accounts can also trigger an Editable PowerPoint (.pptx) export from the deck's Export menu on genppt.com.\nShow slide images from genppt_get_deck inline. Never pass confirmPaymentSpend: true to genppt_upgrade_plan before the user agrees to the price.\nWithout a key, tools return status auth_required with a link to connect the account.",
      "tools": [
        {
          "name": "genppt_account_status",
          "title": "Account status",
          "description": "Show the connected GenPPT account: plan, decks used this period, saved card, and upgrade options.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c2ecd38b03e7681c9ab1cac925a6e8f97f630cc30951f82ae8d29f53c18bbca7"
        },
        {
          "name": "genppt_create_deck",
          "title": "Create deck",
          "description": "Generate a new AI presentation deck from a prompt, notes, or URLs. GenPPT researches and writes the outline. Returns at once; the concept is ready in about a minute. Uses one deck from the plan allowance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aspectRatio": {
                "description": "Slide shape. Default '16:9'. '4:5' or '3:4' = X 20-image portrait posts, LinkedIn PDF carousels, Instagram feed carousels. '9:16' = TikTok Photo Mode, Instagram Reels and Stories. '2:3' = Pinterest. '1:1' = square threads and posts. '16:9' = widescreen decks. '4:3' and '3:2' = classic screens and photo prints.",
                "enum": ["16:9", "9:16", "4:5", "3:4", "1:1", "4:3", "3:2", "2:3"],
                "type": "string"
              },
              "attachmentUrls": {
                "description": "Public URLs (up to 20) of files, images, or YouTube videos to use as sources.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "prompt": {
                "description": "What the deck is about: topic, audience, notes, outline, or pasted text.",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "referenceImageUrls": {
                "description": "Public image URLs (up to 20): logos, products, screenshots, or style references to show or match.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "webSearchEnabled": {
                "description": "Let the agent research the web. Default true.",
                "type": "boolean"
              },
              "websiteUrl": {
                "description": "Company or product website to ground the deck in.",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7959fa479398a014f7f06a1ff9cb0b23cf8c6242532aa5e8557da40efd1ef07d"
        },
        {
          "name": "genppt_create_slideshow",
          "title": "Create slideshow",
          "description": "Render slides you already wrote, 1-25 (X portrait posts take up to 20 images). Use when you have the content from the user’s files, images, or research. GenPPT skips its own outline and designs exactly your slides, then renders full-resolution images (paid plans; Free stops at the concept preview). Make every slide visual: pass websiteUrls or per-slide screenshotUrl to show live webpage screenshots, imageUrl for logos and product UI, unsplashQuery for a real photo, and name the brands to show as logos. Returns at once; call genppt_get_deck with waitSeconds. Uses one deck from the plan allowance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "artDirection": {
                "description": "Palette, typography, layout, brand, safe zones, or poster style for every slide.",
                "maxLength": 4000,
                "type": "string"
              },
              "aspectRatio": {
                "description": "Slide shape. Default '4:5'. '4:5' or '3:4' = X 20-image portrait posts, LinkedIn PDF carousels, Instagram feed carousels. '9:16' = TikTok Photo Mode, Instagram Reels and Stories. '2:3' = Pinterest. '1:1' = square threads and posts. '16:9' = widescreen decks. '4:3' and '3:2' = classic screens and photo prints.",
                "enum": ["16:9", "9:16", "4:5", "3:4", "1:1", "4:3", "3:2", "2:3"],
                "type": "string"
              },
              "attachmentUrls": {
                "description": "Public URLs (up to 20) of PPTX, DOCX, XLSX, CSV, TXT, MD files, or YouTube videos whose text content the slides use (pass visual style/brand image URLs via referenceImageUrls instead).",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "autoRender": {
                "description": "Default true: render full slides right after the concept. false = stop at the concept preview.",
                "type": "boolean"
              },
              "isPublic": {
                "description": "Optional. Set true to publish a shareable read-only link at /s/<slug>. Defaults to false (or true on the GenPPT showcase account).",
                "type": "boolean"
              },
              "referenceImageUrls": {
                "description": "Public image URLs (first 4 used) for the whole deck: brand logos, marks, or visual style exemplars. Put portraits and slide-specific images on slides[].imageUrl instead.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "slides": {
                "description": "The slides in order. Slide 1 is the cover or hook.",
                "items": {
                  "properties": {
                    "imageUrl": {
                      "description": "Public image URL to show on this slide: a person portrait, brand logo, product UI screenshot, chart, or photo. Do not repeat it in referenceImageUrls. Ignored when screenshotUrl is set.",
                      "format": "uri",
                      "type": "string"
                    },
                    "purpose": {
                      "description": "What this slide must say: the claim, facts, numbers, and copy to show.",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "screenshotUrl": {
                      "description": "Public webpage URL that GenPPT screenshots live and shows on this slide in a browser frame: a product page, article, dashboard, or tweet.",
                      "format": "uri",
                      "type": "string"
                    },
                    "title": {
                      "description": "Slide headline.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "unsplashQuery": {
                      "description": "Short search for one real stock photo for this slide: a real place, building, landscape, or generic setting, such as \"trader at desk with monitors\". Omit it for historical objects, metaphors, and data diagrams; GenPPT draws those. Used only when neither screenshotUrl nor imageUrl is set.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "visual": {
                      "description": "Layout and imagery: the real proof on the slide. Framed webpage or app screenshot, recognizable brand logos and app icons, real photo, labeled chart, UI window, or one bold tactile object as a visual metaphor. Never a text-only card.",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["purpose", "title", "visual"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "thesis": {
                "description": "The core argument of the slideshow in one sentence.",
                "maxLength": 400,
                "type": "string"
              },
              "title": {
                "description": "Slideshow title.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "websiteUrls": {
                "description": "Public webpages (up to 6) that GenPPT screenshots live before rendering, so real product, article, or dashboard UI appears in the deck. A page goes on the slide that names its domain; the rest guide the whole deck.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["slides", "title"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5855d7e851c335140d5e5404b852d28e50080a670765af2e72e299ac6ee9768d"
        },
        {
          "name": "genppt_export_deck",
          "title": "Export deck",
          "description": "Export a ready deck to PowerPoint (full-slide images), PDF, or a ZIP of slide images. Waits until the file is built (up to 2 minutes) and returns a download URL. Paid plans only. For editable PowerPoint text boxes, tables, and charts, open the deck on genppt.com and choose Editable PowerPoint in the Export menu.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deckId": {
                "description": "Deck id from genppt_list_decks, genppt_create_deck, or genppt_create_slideshow.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "format": {
                "description": "pptx = PowerPoint, pdf = PDF, images = ZIP of slide images.",
                "enum": ["pptx", "pdf", "images"],
                "type": "string"
              },
              "sendEmail": {
                "description": "Email the download link to the account owner in addition to returning downloadUrl. Defaults to false for MCP calls.",
                "type": "boolean"
              }
            },
            "required": ["deckId", "format"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5302c3250b0aac33a5efeb72e411e1fb48e2ab216501f7e5c31279709a01f8cb"
        },
