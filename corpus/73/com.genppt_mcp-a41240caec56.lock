{
  "lockfileVersion": 2,
  "subjects": {
    "com.genppt/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://genppt.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "genppt",
        "title": "GenPPT",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GenPPT makes AI presentation decks.\nFlow: genppt_create_deck → genppt_get_deck every 30-60 s → at phase concepts_ready show the concept and call genppt_generate_slides → genppt_get_deck until phase ready → genppt_export_deck.\nShow slide images from genppt_get_deck inline. Never pass confirmPaymentSpend: true to genppt_upgrade_plan before the user agrees to the price.\nWithout a key, tools return status auth_required with a link to connect the account.",
      "tools": [
        {
          "name": "genppt_account_status",
          "title": "Account status",
          "description": "Show the connected GenPPT account: plan, decks used this period, saved card, and upgrade options.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c2ecd38b03e7681c9ab1cac925a6e8f97f630cc30951f82ae8d29f53c18bbca7"
        },
        {
          "name": "genppt_create_deck",
          "title": "Create deck",
          "description": "Generate a new AI presentation deck from a prompt, notes, or URLs. Returns at once; slides render in 1-3 minutes. Uses one deck from the plan allowance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aspectRatio": {
                "description": "Slide shape. Default 16:9.",
                "enum": ["16:9", "9:16", "4:5", "1:1"],
                "type": "string"
              },
              "attachmentUrls": {
                "description": "Public URLs of files, images, or YouTube videos to use as sources.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "prompt": {
                "description": "What the deck is about: topic, audience, notes, outline, or pasted text.",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "webSearchEnabled": {
                "description": "Let the agent research the web. Default true.",
                "type": "boolean"
              },
              "websiteUrl": {
                "description": "Company or product website to ground the deck in.",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:35872847967f5c2662e67c48a98a3f0195974e4895ebac920915e9e35b14d987"
        },
        {
          "name": "genppt_export_deck",
          "title": "Export deck",
          "description": "Export a ready deck to PowerPoint, PDF, or a ZIP of slide images. Waits until the file is built (up to 2 minutes) and returns a download URL. Paid plans only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deckId": {
                "description": "Deck id from genppt_list_decks or genppt_create_deck.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "format": {
                "description": "pptx = PowerPoint, pdf = PDF, images = ZIP of slide images.",
                "enum": ["pptx", "pdf", "images"],
                "type": "string"
              }
            },
            "required": ["deckId", "format"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:410d628304d6cefce78ea378676252e5377516ae42d31d8bac3107f9fc73e8dc"
        },
        {
          "name": "genppt_generate_slides",
          "title": "Generate slides",
          "description": "Render the full slides once genppt_get_deck shows phase concepts_ready. Same as the Generate button in the studio. Slides take 1-3 minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deckId": {
                "description": "Deck id from genppt_list_decks or genppt_create_deck.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["deckId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:507fd471ab2ffadba88d37cc2ae2763583d70d8028c174168734bda959abac92"
        },
        {
          "name": "genppt_get_deck",
          "title": "Get deck",
          "description": "Get one deck: its phase, concept preview, slides, and image URLs. Poll it after genppt_create_deck to follow progress.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deckId": {
                "description": "Deck id from genppt_list_decks or genppt_create_deck.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["deckId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:da85cb672627f6feac77af4da68e5c5ee6fdf8ab9b2bb82d33e42bb60b3efa9f"
        },
        {
          "name": "genppt_list_decks",
          "title": "List decks",
          "description": "List the user’s GenPPT decks, newest edits first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max decks to return (default 20).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Filter by title.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d6022189dc5c7604f0cadce3ca5eb99822a7f866bdef9e6a1f6acce97cfc7e00"
        },
        {
          "name": "genppt_submit_feedback",
          "title": "Send feedback",
          "description": "Send a bug report, feature request, or question to the GenPPT team.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["bug", "missing_feature", "question", "other"],
                "type": "string"
              },
              "context": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "deckId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "message": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["category", "message"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54f97fdadfbcea07292adde2369f92a76b3b386491545fa659c062db7aafdf16"
        },
        {
          "name": "genppt_upgrade_plan",
          "title": "Upgrade plan",
          "description": "Preview the cost of a GenPPT plan. Never charges. Ask the user before passing confirmPaymentSpend: true; that returns the checkout link where the user pays.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirmPaymentSpend": {
                "description": "false (default) = price preview only. true = the user agreed to pay; returns the checkout link.",
                "type": "boolean"
              },
              "plan": {
                "enum": ["growth_monthly", "growth_yearly", "max_yearly"],
                "type": "string"
              }
            },
            "required": ["plan"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d6f18e13c2f5d8b9e61bf2899cd1326da3cefd28985a0cf43080a310713d265e"
        }
      ],
      "digest": "sha256:a5916814dc421f7433f1ac3967b36fd9234051a087c7fa28fd4292ffd8470ad2"
    }
  }
}
