        {
          "name": "genppt_revise_slides",
          "title": "Revise slides",
          "description": "Edit rendered slides of a ready deck: pass revisions[] (one entry per slide number for new copy, a fixed number, a different layout, or imageUrl/screenshotUrl) and/or flat top-level placements[] ({ slideNumber, url?, screenshotUrl?, x, y, width, height, cover? }) to paste exact images into boxes with no redraw. Paid plans only. Up to 10 placement-only slides (no instructions, imageUrl, or screenshotUrl) finish before the call returns, with phase ready and the new slideImageUrls. Other edits return at once; call genppt_get_deck with waitSeconds to see the new images.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deckId": {
                "description": "Deck id from genppt_list_decks, genppt_create_deck, or genppt_create_slideshow.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "placements": {
                "description": "Flat pixel-exact image placements ({ slideNumber, url?, screenshotUrl?, x, y, width, height, cover? }) merged by slideNumber with no redraw. Up to 4 boxes per slide. Match box aspect ratio to the source image and avoid half-frame Slide 1 pastes.",
                "items": {
                  "properties": {
                    "cover": {
                      "description": "True when the box is over a drawn copy of this image: the box is filled with the surrounding color first. Match (width * slideW) / (height * slideH) to the source image aspect ratio to avoid letterbox bars.",
                      "type": "boolean"
                    },
                    "height": {
                      "maximum": 1,
                      "minimum": 0.02,
                      "type": "number"
                    },
                    "screenshotUrl": {
                      "description": "Public webpage to screenshot live and paste into the box.",
                      "format": "uri",
                      "type": "string"
                    },
                    "slideNumber": {
                      "maximum": 25,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "url": {
                      "description": "Direct public image URL to paste into the box unchanged.",
                      "format": "uri",
                      "type": "string"
                    },
                    "width": {
                      "maximum": 1,
                      "minimum": 0.02,
                      "type": "number"
                    },
                    "x": {
                      "description": "Left edge as a fraction of the slide width.",
                      "maximum": 0.98,
                      "minimum": 0,
                      "type": "number"
                    },
                    "y": {
                      "description": "Top edge as a fraction of the slide height.",
                      "maximum": 0.98,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["height", "slideNumber", "width", "x", "y"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "revisions": {
                "items": {
                  "properties": {
                    "imageUrl": {
                      "description": "Public image URL (logo, product UI, chart, photo) for the redraw to feature on this slide.",
                      "format": "uri",
                      "type": "string"
                    },
                    "instructions": {
                      "description": "What to change on this slide. Optional when imageUrl, screenshotUrl, or placeImages is given. With placeImages it only describes the paste.",
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "placeImages": {
                      "description": "Paste exact images into boxes on the slide (fractions 0-1 of the slide) with no redraw. Prefer top-level placements[] in MCP clients that drop nested array objects. Keep nearby text outside each box. Not with imageUrl or screenshotUrl; make that change in a separate call.",
                      "items": {
                        "properties": {
                          "cover": {
                            "description": "True when the box is over a drawn copy of this image: the box is filled with the surrounding color first. Match (width * slideW) / (height * slideH) to the source image aspect ratio to avoid letterbox bars.",
                            "type": "boolean"
                          },
                          "height": {
                            "maximum": 1,
                            "minimum": 0.02,
                            "type": "number"
                          },
                          "screenshotUrl": {
                            "description": "Public webpage to screenshot live and paste into the box.",
                            "format": "uri",
                            "type": "string"
                          },
                          "url": {
                            "description": "Direct public image URL to paste into the box unchanged.",
                            "format": "uri",
                            "type": "string"
                          },
                          "width": {
                            "maximum": 1,
                            "minimum": 0.02,
                            "type": "number"
                          },
                          "x": {
                            "description": "Left edge as a fraction of the slide width.",
                            "maximum": 0.98,
                            "minimum": 0,
                            "type": "number"
                          },
                          "y": {
                            "description": "Top edge as a fraction of the slide height.",
                            "maximum": 0.98,
                            "minimum": 0,
                            "type": "number"
                          }
                        },
                        "required": ["height", "width", "x", "y"],
                        "type": "object"
                      },
                      "maxItems": 4,
                      "minItems": 1,
                      "type": "array"
                    },
                    "screenshotUrl": {
                      "description": "Public webpage URL to screenshot live and feature on this slide in the redraw.",
                      "format": "uri",
                      "type": "string"
                    },
                    "slideNumber": {
                      "maximum": 25,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["slideNumber"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["deckId"],
            "type": "object"
          },
