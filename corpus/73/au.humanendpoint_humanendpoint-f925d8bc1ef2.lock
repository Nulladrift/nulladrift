          "name": "human_get_quote",
          "title": "Get human quote status",
          "description": "Retrieve a human-reviewed quote. Polling is always available as a fallback even when the quote request supplied callback_url. When status=offered, inspect the operator's service fee, expense authority and expiry. Creating the job accepts those terms. When declined, inspect the reason before deciding whether to resubmit.",
