        {
          "name": "human_create_job",
          "title": "Create human job",
          "description": "Accept the human-reviewed commercial terms using the quote_token and create the asynchronous HumanEndpoint job. Creating the job starts a workflow that may lead to human execution in the real world after required payment. Store the returned job_token because it is required for later reads and control.",
