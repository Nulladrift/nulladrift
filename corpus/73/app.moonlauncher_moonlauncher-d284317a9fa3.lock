      "serverInfo": {
        "name": "moonlauncher",
        "title": "Moonlauncher",
        "version": "1.0.0",
        "description": "Prepare pump.fun token launches from your AI agent. You review and sign each one in your own wallet.",
        "websiteUrl": "https://moonlauncher.app",
        "icons": [
          {
            "src": "https://moonlauncher.app/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
