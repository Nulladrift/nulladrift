        },
        {
          "name": "start_launch",
          "title": "Start a token launch",
          "description": "Read-only: returns questions and estimates; it creates nothing and moves no funds. Call this first when the user wants to launch a token. Pass anything they have already decided. Returns the questions to ask them (shaped for AskUserQuestion), estimated costs for each first-buy choice, and the field limits. Ask the questions and confirm the summary with the user before calling launch_token.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "description": {
                "description": "Short description shown on pump.fun. 500 characters max.",
                "maxLength": 500,
                "type": "string"
              },
              "idea": {
                "description": "What the user wants the token to be about, in their words.",
                "maxLength": 500,
                "type": "string"
              },
              "imageSvg": {
                "description": "A logo you drew as an SVG document, if you've made one.",
                "type": "string"
              },
              "imageUrl": {
                "description": "https link to the token image, if the user gave one.",
                "type": "string"
              },
              "initialBuySol": {
                "description": "First buy in SOL as a decimal string, e.g. \"0.1\", if decided. 0 to 5.",
                "type": "string"
              },
              "name": {
                "description": "Token name, as the user chose it. 32 characters max.",
                "maxLength": 32,
                "type": "string"
              },
              "site": {
                "description": "false if the user doesn't want a free token site.",
                "type": "boolean"
              },
              "siteAccent": {
                "description": "Token site accent color, #RRGGBB, bright enough for dark text.",
                "type": "string"
              },
              "siteName": {
                "description": "A site address the user asked for, e.g. rocket-coin. start_launch says if it's free.",
                "maxLength": 40,
                "type": "string"
              },
              "story": {
                "description": "Text for the token site: a few plain paragraphs, 2,000 characters max.",
                "type": "string"
              },
              "symbol": {
                "description": "Ticker, e.g. RKT. 10 characters max, usually 3–6 capital letters.",
                "maxLength": 10,
                "type": "string"
              },
              "telegram": {
                "description": "The token's Telegram link, https.",
                "type": "string"
              },
              "twitter": {
                "description": "The token's X (Twitter) link, https.",
                "type": "string"
              },
              "website": {
                "description": "The token's own website, https. Leave it out to use the free token site.",
                "type": "string"
              }
            },
            "type": "object"
          },
