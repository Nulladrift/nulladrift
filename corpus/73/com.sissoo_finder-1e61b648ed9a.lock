            "properties": {
              "currency": {
                "description": "Currency for prices: GBP (default), EUR, USD or AUD.",
                "type": "string"
              },
              "id": {
                "description": "Practitioner id from search results, e.g. \"joyspace-therapy\".",
                "maxLength": 80,
                "type": "string"
              },
              "lang": {
