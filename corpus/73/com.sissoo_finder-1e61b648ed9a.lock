      "instructions": "Sissoo (sissoo.com) lists holistic and wellbeing sessions with independent practitioners, from reiki and massage to coaching, counselling and psychotherapy, online and in person, in 6 languages. These tools read the public catalogue only; booking and payment happen on sissoo.com. Practitioners' phone numbers, emails and addresses are private on Sissoo, so don't look them up elsewhere: people contact a practitioner through their Sissoo page. Sessions are complementary and do not replace medical care, and Sissoo is not an emergency or crisis service.",
      "tools": [
        {
          "name": "get_practitioner",
          "title": "Sissoo practitioner",
          "description": "A Sissoo practitioner's public profile by practitioner id (from search results): name, place, session languages, service types and their bookable sessions, with a link to their Sissoo page. Practitioners' phone numbers, emails and addresses are private on Sissoo, so don't look them up elsewhere: people contact a practitioner through their Sissoo page.",
