        {
          "name": "search_services",
          "title": "Search Sissoo sessions",
          "description": "Finds bookable holistic and wellbeing sessions on Sissoo (sissoo.com), from reiki, massage and yoga to coaching, counselling and psychotherapy, online or in person, in several languages. Matches a short description of what the person is looking for, with optional place, format, session language, timing, budget and stage (new to it, or going deeper). Returns up to 8 sessions with price (booking fee included), next free time and a link to the service page with that date picked. Read-only: booking and payment happen on sissoo.com. Not for emergencies or crisis support: crisis wording returns helplines instead of sessions.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Currency for prices: GBP (default), EUR, USD or AUD.",
                "type": "string"
              },
              "format": {
                "description": "Online, in person or either (default).",
                "enum": ["any", "online", "in_person"],
                "type": "string"
              },
              "lang": {
                "description": "Language of titles and booking pages: en, de, fr, es, it or pt. Default: the user's locale, else en.",
                "type": "string"
              },
              "max_price": {
                "description": "Highest price per session in the chosen currency, booking fee included.",
                "minimum": 0,
                "type": "number"
              },
              "need": {
                "description": "What the person is looking for, in a few of their own words: a type of session (\"reiki\", \"life coaching\") or what they hope for (\"sleep better\", \"less stress\"). No names or health records.",
                "maxLength": 100,
                "type": "string"
              },
              "place": {
                "description": "City or country, for in-person sessions.",
                "maxLength": 60,
                "type": "string"
              },
              "session_language": {
                "description": "Language the session is held in, as a two-letter code, e.g. \"de\".",
                "type": "string"
              },
              "stage": {
                "description": "Where the person is with this kind of session (Sissoo's 3 E's). emerge: new to it or trying it for the first time; first steps (free intro calls, first sessions) come first and repeats, follow-ups and programmes are left out. evolve: has tried it and wants to go deeper; programmes, series and follow-ups come first. Leave it out when they haven't said.",
                "enum": ["emerge", "evolve"],
                "type": "string"
              },
              "within_days": {
                "description": "Only sessions with a free time within this many days.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
