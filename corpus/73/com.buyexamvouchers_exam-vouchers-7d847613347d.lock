      "instructions": "BuyExamVouchers sells IT certification exam vouchers (12-hour email delivery). Use search_vouchers or get_voucher for live prices, compare_price for the saving against the official fee, get_policies for refunds and delivery, and buy_link to give the user a prefilled checkout link. The tools are read-only; the user pays on the website.",
