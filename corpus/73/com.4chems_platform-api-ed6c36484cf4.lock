      "instructions": "Customer-tier tools for the platform API (/v1 endpoints only). Anonymous tools — get_catalog_templates, get_legal_entity_types, get_onboarding_route, start_inquiry, verify_inquiry, start_account_registration, verify_account_registration, start_device_login, and verify_device_login — work without an 'authorization' argument: call them with no token to explore the catalog, learn the next onboarding step, register, sign in, or send 4chems an inquiry. For inquiries, call start_inquiry, ask the user for the 6-digit code from their email, then call verify_inquiry — never guess or retry codes on your own. To create an account, call start_account_registration, ask the user for the 6-digit code from their email, then call verify_account_registration — never guess or retry codes, and never ask the user for a password. The user sets their password through the link Keycloak emails; then sign in with start_device_login and verify_device_login (poll while it answers pending, waiting retry_after seconds) and pass the returned access_token as 'authorization'. A tenant needs a business email (free-mail domains are refused), an attestation that the user may act for the company, and one trial per email domain; it starts as a 7-day trial. All other tools require a Bearer token as the 'authorization' argument ('Bearer <token>'). Mutation tools poll to completion before returning (the terminal operation envelope); if the poll bound is exceeded the tool returns the last polled envelope (status pending or running, with operation_id) for follow-up. Before record_consent, show the user the document URL and version and obtain an explicit affirmative answer; never record a consent on inference, on silence, or on a general instruction to proceed. Tool results carry structuredContent that validates against the tool's outputSchema; error results carry the problem+json object (code, detail, next_step…) in structuredContent.",
