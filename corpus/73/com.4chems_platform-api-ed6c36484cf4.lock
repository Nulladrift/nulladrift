          "name": "create_invitation",
          "title": "Create Invitation",
          "description": "Invite an email address to the caller's tenant at the specified access\nlevel and return the invitation, including the raw single-use accept\ntoken. Call this when a tenant admin wants to add a new member; the\ninvitee accepts via `accept_invitation`.",
