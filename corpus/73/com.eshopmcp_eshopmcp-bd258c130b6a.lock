        {
          "name": "eshop_stahnout",
          "title": "Free store: download / Obchůdek: stáhnout",
          "description": "Registers a person for the free Obchůdek store template and returns a personal download link (zip, valid 30 days, also sent by e-mail). Requires the person's name, e-mail, what they will sell and their explicit consent (souhlas=true) to processing these details for 2 years by AiTop. CZ: Stažení šablony Obchůdek po souhlasu.",
          "inputSchema": {
