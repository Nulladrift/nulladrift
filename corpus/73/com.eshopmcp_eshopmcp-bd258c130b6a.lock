        {
          "name": "ul_najdi",
          "title": "Search the whole hive / Hledat v celém úlu",
          "description": "One search across the eshopmcp hive of Czech companies. Returns products from the stores' feeds (price in CZK, availability, link), services and price lists, how-to guides, articles, FAQ and contacts, ranked by relevance and mixed across companies. Each result states its kind (zbozi = product, sluzba = service, rada = guide, clanek = article, stranka = page, faq, cenik = price list, kontakt), the company and the exact URL; snippets are quoted from the company website. Accepts plain-language queries in Czech or English, e.g. \"váleček na fasádu do 300 Kč\" or \"epoxy floor for a garage\". Results from health-related companies contain no treatment claims, list a product only when the query names it, and include a doctor notice. This is the general entry point; ul_hledej is the narrower goods-only search with stock filter, and ul_zeptej_se matches a described need to companies. Read-only; nothing is ordered or paid. CZ: Hledání ve všem napříč firmami úlu.",
          "inputSchema": {
            "properties": {
              "dotaz": {
                "description": "Anything, in plain words / cokoli, lidskými slovy.",
                "type": "string"
              },
              "druh": {
                "description": "Only one kind of result / jen jeden druh výsledku.",
                "enum": ["zbozi", "sluzba", "rada", "clanek", "stranka", "faq", "cenik", "kontakt"],
                "type": "string"
              },
              "limit": {
                "description": "How many results (default 12) / počet výsledků.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "max_cena": {
                "description": "Only products up to this price in CZK / jen zboží do této ceny v Kč.",
                "type": "number"
              },
              "obchod": {
                "description": "Only one member / jen jeden člen.",
                "enum": ["painto", "diochi", "diopro", "accu", "dodavky-znojmo", "grasslova", "trsova", "baufloor-trade", "podlahy-drwal", "dech", "aitop"],
                "type": "string"
              }
            },
            "required": ["dotaz"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the whole hive / Hledat v celém úlu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce7d9f49baf2b6e681b17f3face94bcec44c68c89f86161588934d2c99930ca4"
        },
        {
          "name": "ul_nakupni_seznam",
          "title": "Shopping list / Nákupní seznam",
          "description": "Builds a shopping list from chosen item ids, grouped by store: links, quantities and subtotal per store. It does not place an order or create a cart; shipping and payment are set by each store. CZ: Nákupní seznam po obchodech s odkazy.",
          "inputSchema": {
            "properties": {
              "polozky": {
                "description": "Items: item id from a search result and quantity (default 1) / položky: id a počet kusů.",
