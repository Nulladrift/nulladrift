        {
          "name": "ul_hledej",
          "title": "Search products / Hledat zboží",
          "description": "Catalogue search over product and service items only (no guides, articles or contacts) with filters for maximum price, in-stock only, item type and one store. Returns name, price in CZK incl. VAT, availability, store, item id and link, ranked by matches in the item name; queries work best in Czech (e.g. \"váleček na fasádu\", \"prací kapsle\", \"půjčit dodávku\"). Suited to narrowing a shopping choice by stock or price; the broader search across all content of the hive is ul_najdi. Prices and stock are quoted from the stores' feeds with their timestamp. Read-only; the purchase is completed in the store. CZ: Hledání zboží a služeb v katalogu s filtry.",
          "inputSchema": {
            "properties": {
              "dotaz": {
                "description": "What to look for, ideally in Czech / Co hledat, např. „váleček na fasádu“. May be empty when `obchod` is set / může být prázdné, když je zadán obchod.",
                "type": "string"
              },
              "jen_skladem": {
                "description": "Only items reported in stock (or vehicles free now). Stores without fresh stock data are then left out / jen položky hlášené skladem; obchody bez čerstvého skladu vypadnou.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many results (default 10) / počet výsledků.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_cena": {
                "description": "Maximum price in CZK incl. VAT / nejvyšší cena v Kč s DPH.",
                "type": "number"
              },
              "obchod": {
                "description": "Limit to one store / jen jeden obchod.",
                "enum": ["painto", "diochi", "diopro", "accu", "dodavky-znojmo", "grasslova", "trsova", "baufloor-trade", "podlahy-drwal", "dech", "aitop"],
                "type": "string"
              },
              "typ": {
                "description": "zbozi = goods, sluzba = services.",
                "enum": ["zbozi", "sluzba"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products / Hledat zboží"
