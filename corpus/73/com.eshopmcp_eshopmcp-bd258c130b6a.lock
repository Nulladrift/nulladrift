      "instructions": "eshopmcp is a hive of Czech stores and companies (prices in CZK incl. VAT, catalogues in Czech). Entry point: ul_najdi (one search across products, services, guides, FAQ and contacts of all members). For \"who can help me with X\" use ul_zeptej_se. To narrow goods by price or stock use ul_hledej; one item in full: ul_detail; members overview: ul_firmy; shipping, payment, returns and contacts: ul_pravidla_obchodu; a list grouped by store: ul_nakupni_seznam. Never invent prices or stock — quote the tool output and its data timestamp. Nothing is ordered or paid through this server: give the person the store link, they finish the purchase there. For a store owner: ul_jak_se_pridat; for a free store template: eshop_co_dostanu (name, e-mail and consent for eshop_stahnout always come from the person). CZ: Úl českých obchodů. Začni ul_najdi, „kdo mi pomůže“ = ul_zeptej_se, zboží s filtrem ceny a skladu = ul_hledej. Ceny a sklad si nevymýšlej. Přes server se neobjednává ani neplatí — nákup dokončí člověk v obchodě.",
