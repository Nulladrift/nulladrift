        },
        {
          "name": "ul_sluzby",
          "title": "Services / Služby",
          "description": "Complete list of services (not goods) offered by companies in the hive, optionally for one company: van rental, industrial and designer floors, holistic counselling, nutritional therapy, breathing app, AiTop services. Each entry gives the service name, price in CZK or \"price by scope\", availability and the company link where it is booked. Takes no search words: it is the full service catalogue for browsing, whereas ul_zeptej_se matches a need described in words to companies and ul_najdi searches services by words. Read-only; nothing is booked or paid through it. CZ: Úplný seznam služeb firem v úlu.",
          "inputSchema": {
            "properties": {
              "obchod": {
                "description": "Only one company / jen jedna firma.",
                "enum": ["painto", "diochi", "diopro", "accu", "dodavky-znojmo", "grasslova", "trsova", "baufloor-trade", "podlahy-drwal", "dech", "aitop"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Services / Služby"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc598c89cd425967465df6b4d8b8e10d03a679423e30dbf8b03779bcdd44b7de"
        },
        {
          "name": "ul_zeptej_se",
          "title": "Ask the hive / Zeptej se úlu",
          "description": "Answers who in the hive can help with a need described in plain words (e.g. \"I want to lose weight\", \"new floor\", \"move a sofa\"). Returns the matching companies, a short answer built from sentences on their websites, the exact pages and their offer; members: painto = Painting and construction tools; diochi = Natural herbal products; diopro = Laundry capsules; accu = Batteries and accumulators; dodavky-znojmo = Van rental; grasslova = Holistic counselling; trsova = Nutritional therapy; baufloor-trade = Industrial floor renovation; podlahy-drwal = Designer floors; dech = Breathing trainer; aitop = Hive operator. When no company covers the need, the result says so and lists the fields the hive covers. Health-related results contain no treatment claims or product-for-symptom matches and include a doctor notice. CZ: Kdo v úlu pomůže s potřebou.",
          "inputSchema": {
            "properties": {
              "clen": {
                "description": "Optional member id / volitelně id člena.",
                "enum": ["painto", "diochi", "diopro", "accu", "dodavky-znojmo", "grasslova", "trsova", "baufloor-trade", "podlahy-drwal", "dech", "aitop"],
                "type": "string"
              },
              "text": {
                "description": "The person's need in their own words, Czech or English / potřeba člověka jeho slovy.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
