        {
          "name": "ul_pravidla_obchodu",
          "title": "Store policies / Pravidla obchodu",
          "description": "Store policies and public contacts for one company in the hive: shipping, payment, returns, service terms, e-mail, phone, address and opening hours, each with its source URL and check date; anything the company does not publish is returned as \"neuvedeno\". CZ: Pravidla obchodu a kontakty.",
          "inputSchema": {
