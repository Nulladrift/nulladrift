      "instructions": "Copilot Citations reads a site's Bing Webmaster Tools \"AI Performance\" exports and\nanswers where Microsoft Copilot (and Bing's AI summaries) cite the site, where they cite other\nsites instead, and what changed since the last upload.\n\nBing has no API for this report, so the user exports CSV files from Bing Webmaster Tools and\nyou pass their text to upload_exports. Then use copilot_summary first, and the other tools for\ndetail. Always mention the period an answer covers. The numbers are Bing's sample, not a full\ncount, and a grounding query is the search Copilot ran, not what a person typed.",
