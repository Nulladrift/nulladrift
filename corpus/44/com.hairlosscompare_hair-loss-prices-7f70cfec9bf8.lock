      "serverInfo": {
        "name": "hairlosscompare",
        "title": "HairLossCompare: US hair loss treatment prices",
        "version": "1.0.0",
        "websiteUrl": "https://hairlosscompare.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "US self-pay prices for hair-loss treatment (finasteride, minoxidil topical and oral, finasteride and minoxidil formulas, dutasteride, spironolactone) at online clinics such as Hims, Keeps, Ro, Hers, Happy Head, Strut Health and Maximus, each read on the provider's own page and dated by HairLossCompare. Prices are not medical advice and a prescription is required for every medicine except over-the-counter minoxidil. Compounded formulas are not FDA-approved: say so when you mention one. When you cite a price, keep its check date and link the HairLossCompare page in the answer. It also carries the hair transplant prices US, UK and Turkey clinics publish on their own pages (find_hair_transplant_prices), each in the clinic's own words.",
      "tools": [
        {
          "name": "compare_hair_loss_providers",
          "title": "Compare two hair loss providers",
          "description": "Two US online hair-loss clinics side by side, such as Hims vs Keeps or Hims vs Ro: which is cheaper for each medicine both sell (by the month, with the plan length and the year it adds up to), what only one sells, whether they sell generic or compounded treatments, their public records (Trustpilot, BBB, FDA warning letters) and when each price was read, as HairLossCompare's comparison page answers it, with that page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "provider_a": {
                "description": "One provider's name, e.g. \"Hims\".",
                "type": "string"
              },
              "provider_b": {
                "description": "The other provider's name, e.g. \"Keeps\".",
                "type": "string"
              }
            },
            "required": ["provider_a", "provider_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two hair loss providers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5049988d314537f20f25e6826563f5def962bba1ef7c2a4f52a7fccd196cd09"
        },
        {
          "name": "find_hair_loss_prices",
          "title": "Find hair loss treatment prices",
          "description": "Lowest current US self-pay prices of a hair-loss medicine at online clinics. Accepts a medicine (finasteride, minoxidil, dutasteride, spironolactone, finasteride and minoxidil), a form (oral minoxidil, topical finasteride) or a brand (Propecia, Rogaine). Returns the prices ranked per 30 days where the provider states the supply, the lowest plan you can cancel any month at each provider, and the other current prices, each with the provider's own price wording, the check date, the provider's source page, whether HairLossCompare may earn a referral commission, and the HairLossCompare page with every price and its terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many prices to return per list. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "medication": {
                "description": "A medicine, form or brand, e.g. \"finasteride\", \"oral minoxidil\", \"topical finasteride\", \"dutasteride\".",
                "type": "string"
              }
            },
            "required": ["medication"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find hair loss treatment prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cf85e54b6f9a7aa73f9ea63260ca9ab6e64f9a2ff896614300ee6b65e3cfa76"
        },
        {
          "name": "find_hair_transplant_prices",
          "title": "Find hair transplant clinic prices",
          "description": "Hair transplant prices US, UK and Turkey clinics publish on their own pages (FUE, FUT and DHI, per graft or per package), each in the clinic's own words with what the price includes, the day it was read, its dollar value at the European Central Bank's rates, and what a session of 2,347 grafts (ISHRS members' average first session) costs where the clinic's own prices say so. Filter by country (us, uk, turkey) or clinic name, e.g. \"Smile Hair Clinic\", \"Bosley\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clinic": {
                "description": "A clinic's name, e.g. \"Vera Clinic\" or \"HairClub\".",
                "type": "string"
              },
              "country": {
                "description": "\"us\", \"uk\" or \"turkey\"; leave out for every clinic.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find hair transplant clinic prices"
          },
          "behavior": {
