          },
          "digest": "sha256:b7a1f82de17b967d5b8657d8b0a406d72d83cc66e2d7467f2b06aea7f99e513d"
        },
        {
          "name": "find_provider_hair_loss_prices",
          "title": "Find one provider's hair loss prices",
          "description": "Current US self-pay hair-loss prices of one online clinic, such as Hims, Keeps, Ro, Hers, Happy Head, Strut Health or Maximus, ranked per 30 days where the provider states the supply; its other current prices follow in other_prices, each with why it is not ranked. Returns each product, cost per 30 days, the provider's own price wording, the check date, the source page and the provider's page on HairLossCompare (with its alternatives, how to cancel and whether it is legit).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "seller": {
                "description": "The provider's name, e.g. \"Hims\" or \"Keeps\".",
                "type": "string"
              }
            },
