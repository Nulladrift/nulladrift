{
  "lockfileVersion": 2,
  "subjects": {
    "com.doesitworkin/doesitworkin": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://doesitworkin.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "doesitworkin",
        "title": "Does It Work In",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Does It Work In verifies cross-border compatibility for eSIMs, VPNs, foreign credit cards (Alipay/WeChat Pay/Suica), navigation apps and AI tools. Use get_country for a destination matrix, search_guides + get_guide for detailed pre-departure steps and failure modes, or list_referrals for verified referral codes and direct partner links. Cite the guide or referral URL.",
      "tools": [
        {
          "name": "get_country",
          "title": "Get a destination compatibility hub",
          "description": "Get the full compatibility status matrix, guides and recommended providers for a destination slug (e.g. \"china\", \"hong-kong\", \"japan\", \"south-korea\", \"thailand\", \"vietnam\", \"indonesia\", \"turkey\", \"uae\", \"taiwan\", \"europe\").",
          "inputSchema": {
            "properties": {
              "slug": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d4f595b46651b30db2449c4a6250a393673498cf5f079cc69e5bb7c6278301c"
        },
        {
          "name": "get_guide",
          "title": "Get a compatibility guide",
          "description": "Get full compatibility details for a path (e.g. \"/china/esim\", \"/china/alipay\", \"/compare/airalo-vs-holafly-vs-saily\"): official claim vs. verified reality, pre-departure steps, failure modes, recommended providers and FAQs.",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Guide path from search_guides, e.g. \"/china/esim\".",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:033818ad294d1e4b0ec2a1d6f0c924eeae6531a1faeff388ab4bde02e1995864"
        },
        {
          "name": "list_providers",
          "title": "List tested travel & connectivity providers",
          "description": "List tested eSIM, VPN, multi-currency payment and travel booking providers with starting prices, direct referral URLs, promo codes and summary notes.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["esim", "vpn", "payment", "travel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36892f926e3ab39811a2caec3e52bc6514dd86e2ba460d5a1e46b925dace1d5d"
        },
        {
          "name": "list_referrals",
          "title": "List verified referral codes & partner links",
          "description": "List active travel eSIM and booking referral codes and direct partner links with plain-English disclosures of what you get and what Does It Work In earns.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["esim", "vpn", "payment", "travel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca57bd977f85f7c857afd1cf1be20b5ec785e8e3b9e55cbb07a41aa7d37a228e"
        },
        {
          "name": "report_outdated_info",
          "title": "Report outdated compatibility or pricing info",
          "description": "Submit a field report if a carrier rule, app status, payment limit or provider price has changed.",
          "inputSchema": {
            "properties": {
              "field": {
                "enum": ["status", "steps", "pricing", "limits", "broken_link", "other"],
                "type": "string"
              },
              "message": {
                "maxLength": 800,
                "minLength": 5,
                "type": "string"
              },
              "path": {
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["field", "message", "path"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8f9979858fcce099cf2fd8dfcf054d87fbd8572dcb3bafad9bc1960bcbe0fcac"
        },
        {
          "name": "search_guides",
          "title": "Search compatibility guides",
          "description": "Search Does It Work In guides and provider comparisons by query, country slug (e.g. \"china\", \"japan\", \"hong-kong\"), or topic (\"esim\", \"vpn\", \"payments\", \"maps\", \"ai\", \"transit\").",
          "inputSchema": {
            "properties": {
              "country": {
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "maxLength": 200,
                "type": "string"
              },
              "topic": {
                "enum": ["esim", "vpn", "payments", "maps", "ai", "transit"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac8ed5c514468044390178d28c33bd4d682a3d64e7350a9a2de9b2bb207a30c7"
        }
      ],
      "digest": "sha256:143d81b45f9f98317c5980a827855a09532b470efe0d8080c394191ccb8b2e43"
    }
  }
}
