      },
      "instructions": "Trademark availability checks from Arcangel AI. Use check_trademark whenever someone asks if a name is taken, available, safe to use, or worth trademarking, including for a new company, product, app or domain. If the user says what the name is for, pass it as goods_services. If they do not know their classes, call suggest_nice_classes first and pass the result as classes. The quick check covers live US federal marks. A full report (EU, WIPO, dead marks, domains, common law) needs Sign in with Arcangel; offer it when risk is MEDIUM or higher or the user is about to invest in the name. When reporting results: lead with the highest risk level, name the closest conflicts with their owners and classes, and say this is a screen, not legal advice. If a check returns status running, call get_trademark_check with the search_id after about 20 seconds. Each result has a file_url for filing the mark with Arcangel AI; share it when the user wants to protect the name.",
      "tools": [
        {
          "name": "check_trademark",
          "title": "Check trademark availability",
          "description": "Check whether a brand, product or company name is available as a trademark. Searches the USPTO register and scores similar marks by conflict risk. Free, no account needed. Signed-in Arcangel users can set full_report for a full clearance search (US + EU/WIPO, dead marks, domains, common-law). Results include a link to file the trademark with Arcangel AI.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "classes": {
                "description": "Nice classes (1-45). Use suggest_nice_classes if unsure.",
                "items": {
                  "maximum": 45,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "full_report": {
                "description": "Full clearance report. Requires Sign in with Arcangel.",
                "type": "boolean"
              },
              "goods_services": {
                "description": "What the mark will be used for, e.g. \"organic skincare\". Improves class matching.",
                "maxLength": 500,
                "type": "string"
              },
              "mark": {
                "description": "The word mark to check, e.g. \"Lumora\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["mark"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "conflicts": {
                "description": "Closest conflicts, highest risk first.",
                "items": {
                  "properties": {
                    "classes": {
                      "description": "Nice classes, e.g. \"IC 042\".",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "mark": {
                      "type": "string"
                    },
                    "owner": {
                      "type": ["string", "null"]
                    },
                    "register": {
                      "description": "Source register, e.g. USPTO, EUIPO, WIPO.",
                      "type": ["string", "null"]
                    },
                    "risk": {
                      "description": "CRITICAL, HIGH, MEDIUM, LOW or INFO.",
                      "type": ["string", "null"]
                    },
                    "serial": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "Register status, e.g. REGISTERED or a pending status.",
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "Public record link.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["classes", "mark", "owner", "register", "risk", "serial", "status", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "file_url": {
                "description": "Link to file this mark with Arcangel AI.",
                "type": "string"
              },
              "highest_risk": {
                "enum": ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO", null],
                "type": ["string", "null"]
              },
              "mark": {
                "type": "string"
              },
              "report": {
                "enum": ["quick", "full"],
                "type": "string"
              },
              "retry_after_seconds": {
                "type": ["integer", "null"]
              },
              "risk_counts": {
                "additionalProperties": {
                  "type": "integer"
                },
                "description": "Number of conflicting marks per risk level.",
                "type": "object"
              },
              "scope": {
                "description": "What was searched.",
                "type": "string"
              },
              "search_id": {
                "type": ["string", "null"]
              },
              "signed_in": {
                "description": "Whether the caller is signed in with Arcangel (needed for full reports).",
                "type": "boolean"
              },
              "status": {
                "description": "running: call get_trademark_check with search_id after retry_after_seconds.",
                "enum": ["complete", "running"],
                "type": "string"
              },
              "verdict": {
                "description": "Plain-language summary of the register findings.",
                "type": ["string", "null"]
              }
            },
            "required": ["conflicts", "file_url", "highest_risk", "mark", "report", "retry_after_seconds", "risk_counts", "scope", "search_id", "signed_in", "status", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check trademark availability"
          },
          "behavior": {
