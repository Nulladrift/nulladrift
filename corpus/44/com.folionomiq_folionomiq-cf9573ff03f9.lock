        {
          "name": "check_before_you_buy",
          "title": "Check before you buy",
          "description": "Before adding one new holding to a portfolio: how much of it is already owned through the\n        current funds, whether it adds an independent bet, what past crises would have done\n        with it, and a decision sheet with three columns: now, the same money kept as cash,\n        the money in the new holding. Typical questions: 'I'm thinking of adding $10,000 of\n        QQQ with new cash: what changes versus keeping it in cash?'; 'Check before I buy\n        SCHD.'; 'Test adding an ETF to my portfolio.'. Instead: for selling, reweighting or\n        several changes at once, test_a_change. The 'after' portfolio was never held; it\n        never says whether to buy. It does not recommend, predict or calculate tax.",
          "inputSchema": {
            "properties": {
              "add": {
                "description": "The one ticker being considered.",
                "maxLength": 20,
                "title": "Add",
                "type": "string"
              },
              "amount": {
                "description": "How much of it, in the same units as `holdings` (money when holdings are amounts).",
                "exclusiveMinimum": 0,
                "title": "Amount",
                "type": "number"
              },
              "base": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Currency code every figure is expressed in: USD, EUR, GBP, CAD… Default USD.",
                "title": "Base"
              },
              "holdings": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "What is held: {ticker: number}, 1 to 100 holdings. Weights in any scale (60/20/20 or 0.6/0.2/0.2) or money amounts in the base currency (60000/20000/20000): `units` says which; without it, holdings adding up to 1 or 100 are read as percentages, anything else as money, which makes the falls come out in money. Tickers as the exchange lists them (VOO, VWCE.DE, EQQQ.DE, XAW.TO; 'CASH.USD' for cash). Example: {\"VTI\": 60, \"VXUS\": 20, \"BND\": 20}.",
                "title": "Holdings",
                "type": "object"
              },
              "units": {
                "anyOf": [
                  {
                    "enum": ["money", "weights"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What the holdings' numbers are: 'money' (amounts in the base currency) or 'weights' (percentages or fractions). Omitted: holdings adding up to 1 or 100 are read as percentages, anything else as money, and the answer says so.",
                "title": "Units"
              }
            },
            "required": ["add", "amount", "holdings"],
            "title": "check_before_you_buyArguments",
            "type": "object"
          },
          "outputSchema": {
            "description": "One addition measured on the portfolio it would join (counterfactual).",
            "properties": {
              "_fence": {
                "description": "What these figures are and are not: descriptive, no forecast, no advice. Repeat its sense when presenting the result.",
                "type": ["string", "null"]
