      "serverInfo": {
        "name": "Folionomiq",
        "title": "Folionomiq",
        "version": "f72f793",
        "description": "Free, descriptive measurement of a portfolio's structure and risk from price history. No account, no advice, no forecasts."
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Measures an investment portfolio from its price history: how many independent bets it really holds, which holding carries the risk, what it owns through its funds, and what past crises did to that money. Descriptive only: no forecast, no buy/sell/hold advice, no score of how good a portfolio is. It fits any question that names tickers, a fund or a portfolio: its risk, what past crises did to it, overlap between funds, withdrawals in retirement, a monthly investing plan, or one ETF or stock on its own; the figures are measured on those exact holdings rather than recalled. `measure_portfolio` takes the holdings as {ticker: weight or amount} and answers all of it in one call; `validate_symbols` and `search_symbols` resolve a ticker that is uncertain. For one question (just the crises, just the funds' companies…), the narrower tools answer it with less.\n\nDescriptive. No forecast, no advice. Every figure is measured over the window named beside it, from end-of-day prices. Nothing here predicts a price, a return or a probability, and nothing here says what to buy, sell or hold. A figure's limit is stated beside it, and a figure that is not in the result was not measured.",
      "tools": [
        {
          "name": "asset_info",
          "title": "One fund or share: what it is and holds",
          "description": "One fund or share on its own: name, type, exchange, yearly cost when published, measured\n        return, volatility and worst fall, and for a fund its largest holdings and sectors.\n        Typical questions: 'What is EQQQ.DE?'; 'Tell me about this ETF before I add it.';\n        'What's inside VXUS?'. Instead: for a whole portfolio's companies, look_through.\n        Non-US listings need the exchange suffix (VWCE.DE, IWDA.AS); search_symbols finds\n        it. It does not recommend, predict or calculate tax.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "One ticker, as the exchange lists it.",
                "maxLength": 20,
                "title": "Ticker",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "title": "asset_infoArguments",
            "type": "object"
          },
