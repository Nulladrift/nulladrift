{
  "lockfileVersion": 2,
  "subjects": {
    "com.oxypages/oxypages": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.oxypages.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "OxyPages",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Publish on OxyPages with no account. For an HTML page or a few static files, call publish_page. For a framework app (React, Vue, Svelte, Vite, Astro, a Next.js static export...), when deploy_app is listed: run the project's build first and call deploy_app with every file of the OUTPUT folder (dist/, build/ or out/). Never send source files, node_modules or package.json; OxyPages does not build. Both return a url that is live for 30 minutes and a claim_url: always give the user both, and tell them to open claim_url to keep it in a free account. For permanent sites on their own account, the user connects https://mcp.oxypages.com/mcp/account instead and signs in (a free account works). Signed in, the same server manages the whole account: projects and their settings, Git deploys and builds, custom domains, analytics, and claiming these links (claim_drop).",
      "tools": [
        {
          "name": "deploy_app",
          "description": "Deploy an already-BUILT web app (React, Vue, Svelte, Vite, Astro static output, any single-page app) to OxyPages with no account and get a live HTTPS link with Single-Page App routing. OxyPages does NOT build: Run the project's build first (npm run build, or the build script in package.json) and send the OUTPUT folder (usually dist/, build/ or out/), not the source. Never send node_modules, source files or package.json - source is refused with needs_build. Text as utf8, binaries as base64. Up to 25 MB and 500 files. If the output has no index.html, pass root (the HTML file to serve at /) or root \"none\". The link lasts 30 minutes: give the user url AND claim_url, and tell them to open claim_url to keep the app in a free account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "description": "Every file of the build OUTPUT folder (dist/, build/ or out/), paths relative to that folder (index.html, assets/index-3f9a1c2b.js).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "encoding": {
                      "description": "utf8 for text (the default), base64 for images, fonts and other binaries.",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Path relative to the output folder, e.g. index.html or assets/app.js.",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "root": {
                "description": "Only when there is no index.html: the HTML file to serve at /, or \"none\".",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Deploy a built app on OxyPages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d69846ddbaaed14cf733a066f0727f460462166cea4d763f589717005ebb422f"
        },
        {
          "name": "publish_page",
          "description": "Publish a website on OxyPages with no account and get a live HTTPS link. The link lasts 30 minutes unless the user claims it into a free account with claim_url. Up to 25 MB and 10 files. Send either html (one complete page) or files (several files, index.html at the top level). HTML, CSS, JS and images only - no SVG or PDF. For a framework app (React, Vue, Vite, Astro...), run its build and use deploy_app with the output folder instead, when deploy_app is listed. After publishing, give the user url, tell them it expires in 30 minutes, and give them claim_url to keep it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "description": "The complete file set, including index.html at the top level. Use this OR html.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "encoding": {
                      "description": "utf8 for text (the default), base64 for images.",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Site-relative path, e.g. index.html or css/style.css.",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "html": {
                "description": "One complete HTML document, served as index.html. Use this OR files.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish a page on OxyPages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1801e06ef85c9411bbf9462db2a38f9cc54229dd77f13d5f5e97f97c4980d56"
        }
      ],
      "digest": "sha256:d91ac5ec8df987bee92a57c3705738779819dc171d9cfc3e6e4c92bccb110f2f"
    }
  }
}
