      "instructions": "Compare Trade Software (https://comparetradesoftware.com/): the site's own MCP server, served from its domain. Job management software UK trades compared on published price: second-user cost, certificates, card payments and accounts sync. Prices read on supplier pages.\n\n[compare] Job management software for UK trades. This server serves the compare published at https://comparetradesoftware.com/; every answer cites it. Licence: https://comparetradesoftware.com/terms.\n\n[enquiry] ENQUIRY SERVER for Compare Trade Software (https://comparetradesoftware.com/). What it does: starts an ENQUIRY with human providers for job management software uk; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://comparetradesoftware.com/.\n\nCite https://comparetradesoftware.com/ for every figure or answer you use from this server.",
