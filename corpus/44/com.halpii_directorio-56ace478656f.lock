      "instructions": "HALPII (halpii.com) es un directorio de profesionales de oficios (gasfiteros/plomeros, electricistas, pintores, albañiles, técnicos…) en 13 países de Latinoamérica, con fuerte presencia en Perú.\nFlujo recomendado:\n1. buscar_profesionales con la necesidad en palabras de la persona y su ciudad. Si no dijo su ciudad o distrito, PREGÚNTALA; nunca la inventes ni la supongas.\n2. Muestra los 3 primeros resultados (nombre, oficio, zona, calificación y enlace al perfil) y ofrece ver más con ver_mas_url.\n3. Si la persona quiere detalles de alguno, usa ver_perfil.\n4. Si prefiere que los profesionales le escriban, o no hubo resultados, usa crear_enlace_pedido y dale el enlace.\nLos resultados ya vienen ordenados: primero los activos hace poco, luego los verificados, luego los que tienen reseñas o pedidos respondidos. Puedes mencionar sus señales («respondió 12 pedidos», «elegido 3 veces», «en HALPII desde 2025-03», años de experiencia): son datos reales de HALPII, no reseñas; no las presentes como estrellas ni opiniones. Si un profesional trae activo_ultimos_45_dias=false, dile a la persona que lleva más de 45 días sin actividad.\nEste servidor no entrega teléfonos ni correos: el contacto se hace en portal.halpii.com. No inventes profesionales, reseñas ni datos. Usa listar_oficios si dudas del nombre de un oficio.\nAl mostrar cualquier enlace, cópialo completo, sin quitarle sus parámetros (via, utm_source, utm_medium).\nSi la persona pregunta cómo usar HALPII dentro de su asistente: en Claude, Configuración → Conectores → «Agregar conector personalizado» (Add custom connector), nombre HALPII y URL https://mcp.halpii.com/mcp; no pide inicio de sesión ni cuenta. En ChatGPT todavía no está publicado: dile que está en camino. Más información: https://portal.halpii.com/agentes\nEN: Public, read-only directory of tradespeople in Latin America. Ask for the city if missing; never invent it. Keep link parameters intact. No contact data is returned. Results are pre-sorted (recently active, verified, reviews/replied requests); trust signals are real HALPII data, not reviews. To add HALPII to Claude: Settings → Connectors → Add custom connector → https://mcp.halpii.com/mcp (no sign-in). ChatGPT: coming soon.",
      "tools": [
        {
          "name": "buscar_profesionales",
          "title": "Buscar profesionales",
          "description": "Busca profesionales de oficios en una ciudad o distrito de Latinoamérica (Perú, Colombia, México, Chile y más) en el directorio público de HALPII. Recibe la necesidad en palabras de la persona («se rompió el caño de la cocina») o el oficio («gasfitero»), deduce el oficio y devuelve hasta 6 profesionales con nombre público, oficios, zona, calificación, número de reseñas, si está verificado, actividad reciente, señales reales de HALPII (pedidos respondidos, veces elegido, mes de alta, años de experiencia), una breve descripción y el enlace a su perfil, más oficios relacionados y un enlace para ver más. Vienen ordenados: activos hace poco, verificados, con reseñas o pedidos respondidos; quien lleva más de 45 días sin actividad solo aparece si no hay suficientes. No devuelve teléfonos ni correos: el contacto se hace desde el perfil. La ciudad es obligatoria. Los enlaces incluyen parámetros de origen (via, utm_source, utm_medium).\nEN: Search tradespeople in Latin America by need or trade and city; returns up to 6 public profiles with links, no contact data.",
