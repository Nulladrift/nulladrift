{
  "lockfileVersion": 2,
  "subjects": {
    "best.creditcards/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.creditcards.best/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "creditcards.best",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Structured, always-current US credit-card data for agents. Use search_cards to filter, get_card for detail, estimate_rewards to rank cards for a spending profile, check_eligibility to filter by credit band, compare_cards for head-to-head, and get_apply_link for the apply URL. Every tool searches issuer-verified cards by DEFAULT; pass verified:false for the unverified stubs or verified:null for the whole corpus. Verified means sourced, not complete: values the issuer does not publish stay null, so treat a null as \"the issuer does not say\" and never as a zero, and never fill one in yourself. Most issuers publish no credit requirement, so check_eligibility returns far fewer cards than search_cards and excludes the unknowns rather than assuming they qualify. Rankings reflect fit, not placement. Apply links are creditcards.best tracked redirects — always hand the user those, never a raw issuer URL.",
      "tools": [
        {
          "name": "check_eligibility",
          "title": "Check likely eligibility",
          "description": "Given a user's credit band (and optionally income), return cards they would typically qualify for, surfacing issuer application rules (e.g. Chase 5/24) and any income floor. Only cards that publish a credit requirement can be answered; cards with no published requirement are counted in `unknownCount`, never listed as qualifying. This is a likelihood signal from published guidance, not an approval guarantee.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cardIds": {
                "description": "Restrict to these cards; default is all verified cards",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "creditBand": {
                "enum": ["excellent", "good", "fair", "poor", "none"],
                "type": "string"
              },
              "incomeUsd": {
                "type": "number"
              }
            },
            "required": ["creditBand"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c0d430db576cee39fa37f88b6b4208315766a5a73194281283b47f7f3a66523"
        },
        {
          "name": "compare_cards",
          "title": "Compare cards",
          "description": "Side-by-side detail for two or more cards by id: fees, foreign-transaction fee, signup bonus, earn rates, credits and eligibility. Apply links are tracked redirects.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ids": {
                "description": "Card slugs to compare",
                "items": {
                  "type": "string"
                },
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9bd948346188b079b62f25f005d80b79e15456084c6baf4eab30aa3130fb2583"
        },
        {
          "name": "estimate_rewards",
          "title": "Estimate annual rewards",
          "description": "Given an annual spending profile (USD per category, e.g. { dining: 6000, groceries: 8000, travel: 4000, other: 20000 }), estimate each card's net rewards value and rank them. Net value = rewards earned on spend + first-year signup bonus − annual fee. Statement credits are reported separately (max value if fully used), NOT folded into the headline, to avoid overstating premium 'coupon-book' cards. Returns a per-category breakdown and the assumptions used. All card facts come from the verified dataset; only point valuation is modeled.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cardIds": {
                "description": "Restrict to these cards; default is all",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "creditBand": {
                "description": "Restrict to cards this band typically qualifies for",
                "enum": ["excellent", "good", "fair", "poor", "none"],
                "type": "string"
              },
              "includeSignupBonus": {
                "description": "Include the signup bonus in year-1 value (default true)",
                "type": "boolean"
              },
              "limit": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "spend": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Annual USD spend keyed by category label",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["spend"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67d326042140b5f803d80d2d8d863e9d19ed95a2b3962d53f33e23171d8e838b"
        },
        {
          "name": "get_apply_link",
          "title": "Get apply link",
          "description": "Return the apply link for a card. This is always a creditcards.best tracked redirect that records the referral and forwards to the issuer; the raw issuer URL is never returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91bb96c8da8bda34085519b78fedd6522207a280367c2269bf92752f2a1118e8"
        },
        {
          "name": "get_card",
          "title": "Get one card",
          "description": "Full detail for a single card by id (slug), including earn rates, credits, eligibility, sources and lastVerified. The apply link is our tracked redirect, not the issuer URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Card slug, e.g. 'chase-sapphire-preferred'",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19894183b4f6546d89060031ee50a78c4abc0bbc3dbb3c1a309de49fe1478a19"
        },
        {
          "name": "search_cards",
          "title": "Search credit cards",
          "description": "Filter the US credit-card dataset by product type, rewards currency (program name or kind), issuer, annual fee, foreign-transaction fee, signup-bonus value, credit band, or curated category. Searches ONLY issuer-verified cards by default, because unverified stubs carry null for most filterable fields and a null is not a zero. Set verified:false for the stubs, or verified:null to search everything knowingly. Returns at most 25 summaries unless you raise `limit`; `total` is the full match count and `truncated` says whether you are seeing all of it. Rankings reflect fit, not placement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Curated slug, e.g. 'best-cash-back-credit-cards'",
                "type": "string"
              },
              "creditBand": {
                "description": "Only cards a user with this credit band typically qualifies for",
                "enum": ["excellent", "good", "fair", "poor", "none"],
                "type": "string"
              },
              "isBusiness": {
                "type": "boolean"
              },
              "issuer": {
                "description": "Issuer name, partial match (e.g. 'Chase')",
                "type": "string"
              },
              "limit": {
                "description": "Max cards to return (default 25). Check `truncated` before treating the list as complete.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "maxAnnualFee": {
                "type": "number"
              },
              "minSignupValueUsd": {
                "description": "Minimum estimated signup-bonus cash value",
                "type": "number"
              },
              "noForeignTransactionFee": {
                "type": "boolean"
              },
              "productType": {
                "items": {
                  "enum": ["cashback", "travel-rewards", "points", "business", "balance-transfer"],
                  "type": "string"
                },
                "type": "array"
              },
              "rewardsCurrency": {
                "description": "Program name, partial match, by its own name: 'AAdvantage' not 'American', 'SkyMiles' not 'Delta', 'Bonvoy', 'Avios'.",
                "type": "string"
              },
              "rewardsCurrencyType": {
                "description": "Kind of loyalty currency earned. Use this for airline or hotel cards; it is not a productType.",
                "items": {
                  "enum": ["cashback", "bank-points", "airline-miles", "hotel-points", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "enum": ["name", "annualFee", "signupValue", "baseRate"],
                "type": "string"
              },
              "verified": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Defaults to true (issuer-verified only). false = only the unverified stubs seeded from the open reference. null = the whole corpus, nulls and all."
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7763d6fa7d6363c2aa8c7a78d9e21c358380582472a07c950ad518e414076f4e"
        }
      ],
      "resources": [
        {
          "uri": "creditcards://dataset",
          "name": "dataset",
          "title": "Full card dataset",
          "description": "Every card as structured JSON, each with a `verified` flag and `lastVerified` freshness.",
          "mimeType": "application/json",
          "digest": "sha256:75310a6a9270109fa33142e54c8cc5504e6fb1a18ee623d7102c710f9b3fba47"
        },
        {
          "uri": "creditcards://methodology",
          "name": "methodology",
          "title": "Methodology & trust",
          "description": "How card values are sourced, verified, and kept fresh.",
          "mimeType": "text/markdown",
          "digest": "sha256:65cd06b43a72ff4338260b1e78339ced361b998874200d8ec8ecdd64fdadf42d"
        }
      ],
      "digest": "sha256:2dca2a43a9bce6eb63db75c949a6ef81a28920e97c13ce4ab43a341a2b7b8db4"
    }
  }
}
