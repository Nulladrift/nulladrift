                "description": "Pays de livraison",
                "title": "Pays",
                "type": "string"
              },
              "societe": {
                "description": "Nom de l'entreprise ou de l'administration",
                "title": "Societe",
                "type": "string"
              },
              "telephone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Telephone (facultatif)",
                "title": "Telephone"
              }
            },
            "required": ["email", "nom", "societe"],
            "title": "demander_devisArguments",
            "type": "object"
