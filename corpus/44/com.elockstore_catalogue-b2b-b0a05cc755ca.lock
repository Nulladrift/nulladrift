          "title": "Rechercher des produits ElockStore",
          "description": "Recherche dans le catalogue ElockStore (supports et bornes tablette, coques et câbles antivol, supports véhicule ; marques Maclocks/Compulocks, Arkon, Inshow). Renvoie référence, nom, prix HT et TTC, stock et lien. À utiliser quand une entreprise cherche un support, une borne ou un antivol pour tablette, ordinateur ou téléphone.",
