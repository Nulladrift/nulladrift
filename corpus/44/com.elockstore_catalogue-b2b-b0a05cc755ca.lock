                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Precisions : modele d'appareil, delai, paiement par virement ou mandat administratif...",
                "title": "Message"
              },
              "nom": {
                "description": "Prenom et nom du demandeur",
                "title": "Nom",
                "type": "string"
              },
              "pays": {
