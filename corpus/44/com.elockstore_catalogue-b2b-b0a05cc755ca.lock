      },
      "instructions": "ElockStore (elockstore.com) est le distributeur officiel en France des marques Maclocks/Compulocks, Arkon et Inshow depuis 2011 : supports et bornes pour tablettes (iPad, Galaxy Tab, Surface), coques antivol, cables antivol, supports telephone et tablette pour vehicules, bornes de paiement. Clientele professionnelle (entreprises, commerces, administrations, revendeurs). Stock en France, expedition 48-72 h. Prix en euros HT, TVA 20 % en sus, remises automatiques par quantite. Utilisez rechercher_produits puis fiche_produit pour conseiller ; preparer_panier pour un achat direct (la personne valide et paie elle-meme sur le site) ; demander_devis pour un devis, un paiement par virement ou mandat administratif, ou une quantite superieure au stock. Ne promettez jamais une compatibilite que la fiche ne mentionne pas.",
      "tools": [
        {
          "name": "demander_devis",
          "title": "Préparer une demande de devis ElockStore",
          "description": "Prépare une demande de devis professionnelle à ElockStore (grandes quantités, paiement par virement ou mandat administratif, produit en rupture). Ne l'envoie pas : renvoie le texte et un lien mailto que la personne envoie elle-même.",
          "inputSchema": {
            "$defs": {
              "Article": {
                "properties": {
                  "quantite": {
                    "description": "Quantite",
                    "maximum": 10000,
                    "minimum": 1,
                    "title": "Quantite",
                    "type": "integer"
                  },
                  "reference": {
                    "description": "Reference ElockStore (ex. 209APXB) ou identifiant numerique",
                    "title": "Reference",
                    "type": "string"
                  }
                },
                "required": ["quantite", "reference"],
                "title": "Article",
                "type": "object"
              }
            },
            "properties": {
              "articles": {
                "default": [],
                "description": "Produits et quantites souhaites (peut etre vide si le besoin est decrit dans message)",
