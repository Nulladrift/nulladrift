        {
          "name": "update_job_status",
          "title": "Update job status",
          "description": "Update a saved job's status, outcome or details. Use status for where the application is now (interviewing, negotiation for an offer, hired). Use outcome for an applied job that ended without progressing: rejected, no_response (no reply after 45+ days), withdrawn, or didnt_apply; status stays as it is. With didnt_apply, give a reason: job_closed reports the listing as expired, and the rest improve the user's future matches. Add detail for anything worth knowing (what the page said, a hidden requirement). Uses the connected Himalayas account; no extra sign-in needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "description": "Anything worth knowing about the outcome, in a sentence or two. No personal data.",
                "maxLength": 500,
                "type": "string"
              },
              "excitement": {
                "description": "Excitement level from 0-5",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "id": {
                "description": "Kanban item ID",
                "type": "number"
              },
              "notes": {
                "description": "Updated notes",
                "type": "string"
              },
              "outcome": {
                "description": "What happened after applying, as reported by the user. \"clear\" removes a recorded outcome.",
                "enum": ["rejected", "no_response", "withdrawn", "didnt_apply", "clear"],
                "type": "string"
              },
              "reason": {
                "description": "Why the user didn't apply (only with outcome didnt_apply)",
                "enum": ["job_closed", "needs_account", "location_or_visa_restricted", "pay_too_low", "wrong_timezone", "not_really_remote", "wrong_seniority", "wrong_role", "not_interested", "other"],
                "type": "string"
              },
              "status": {
                "description": "New application status",
                "enum": ["seen", "saved", "applied", "interviewing", "negotiation", "hired", "archived"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update job status"
          },
          "behavior": {
