              "exclude_worldwide": {
                "description": "When true and country is set, return ONLY jobs specifically available in that country, excluding worldwide/remote jobs. Requires country to be set.",
                "type": "boolean"
              },
              "experience": {
                "description": "Filter by a single experience/seniority level (entry-level, mid-level, senior, manager, director, or executive)",
                "enum": ["entry-level", "mid-level", "senior", "manager", "director", "executive"],
                "type": "string"
