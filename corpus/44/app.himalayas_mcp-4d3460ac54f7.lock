        {
          "name": "create_company_job",
          "title": "Create company job",
          "description": "Post a remote job on Himalayas for the user's company, to hire remote staff. Posting a job is free; it needs admin approval before going live, and can also be saved as a draft. The optional extras are paid: sticky ($299) and newsletter ($99). With any extras, the reply is a Stripe checkout link the user opens and pays themselves, and the job doesn't go live until that payment completes; without extras nothing is charged. Uses the connected Himalayas employer account; no extra sign-in needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app_link_or_email": {
                "description": "Application URL or email address — backend auto-detects via @ check",
                "type": "string"
              },
              "base_salary": {
                "description": "Minimum salary",
                "type": "number"
              },
              "category_list": {
                "description": "Comma-separated job categories",
                "type": "string"
              },
              "description": {
                "description": "Job description (350+ characters, can include HTML)",
                "minLength": 350,
                "type": "string"
              },
              "draft": {
                "description": "Save as draft instead of submitting for approval",
                "type": "boolean"
              },
              "employment_type": {
                "description": "Employment type",
                "enum": ["Full Time", "Part Time", "Contractor", "Temporary", "Intern", "Volunteer", "Other"],
                "type": "string"
              },
              "extras": {
                "description": "Paid extras: 'sticky' ($299 pin to top for 30 days), 'newsletter' ($99 feature in weekly email for 30 days)",
                "items": {
                  "enum": ["sticky", "newsletter"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_salary": {
                "description": "Maximum salary",
                "type": "number"
              },
              "salary_country": {
                "description": "Salary currency code (default: USD)",
                "type": "string"
              },
              "screening_questions": {
                "description": "Screening questions for applicants",
                "items": {
                  "properties": {
                    "correct_option": {
                      "description": "Index of correct option (for mpc type)",
                      "type": "number"
                    },
                    "expected_answer": {
                      "description": "Expected answer (for boolean: 'true'/'false')",
                      "type": "string"
                    },
                    "options": {
                      "description": "Answer options (for mpc type)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "question": {
                      "description": "Question text",
                      "type": "string"
                    },
                    "question_type": {
                      "description": "Question type",
                      "enum": ["boolean", "text", "mpc"],
                      "type": "string"
                    },
                    "required": {
                      "description": "Whether answer is required",
                      "type": "boolean"
                    }
                  },
                  "required": ["question", "question_type"],
                  "type": "object"
                },
                "type": "array"
              },
              "seniority": {
                "description": "Seniority levels",
                "items": {
                  "enum": ["Entry-level", "Mid-level", "Senior", "Manager", "Director", "Executive"],
                  "type": "string"
                },
                "type": "array"
              },
              "skill_list": {
                "description": "Comma-separated skills",
                "type": "string"
              },
              "title": {
                "description": "Job title (5-80 characters)",
                "maxLength": 80,
                "minLength": 5,
                "type": "string"
              },
              "valid_through": {
                "description": "Expiration date (ISO format, defaults to 30 days from now)",
                "type": "string"
              }
            },
            "required": ["app_link_or_email", "description", "employment_type", "seniority", "title"],
            "type": "object"
          },
