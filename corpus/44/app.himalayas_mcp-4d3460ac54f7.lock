            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirm_token": {
                "description": "Leave out to see what would be deleted; nothing is deleted. Pass the token from that reply to delete it",
                "type": "string"
              },
              "job_slug": {
                "description": "Job slug to delete",
                "type": "string"
              }
            },
            "required": ["job_slug"],
            "type": "object"
          },
          "annotations": {
