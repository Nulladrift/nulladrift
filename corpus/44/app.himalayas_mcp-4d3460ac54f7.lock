      "instructions": "Himalayas is a remote jobs marketplace. Its tools cover a remote job search: searching remote job listings by role, country, seniority and salary; job details and the employer's apply link; a resume and cover letter tailored to a job; an application tracker for saved, applied, interviewing, negotiation (offer) and hired jobs; replies to recruiters; remote salary data and company profiles. For employers they cover posting a remote job, the company profile, searching remote candidates and messaging them. They apply when the user is looking for or applying to remote jobs, tracking applications, researching remote pay, or hiring remote staff.\n\nReporting problems: submit_feedback sends a short report to the engineers who build Himalayas, who use it to fix what got in agents' way: a capability that doesn't exist, missing or unclear documentation, a surprising response, an error that doesn't say how to fix the request, incorrect behaviour, a challenge page, or latency, rate limits or pagination that made a task impractical. A report holds the goal and what went wrong; it never includes credentials, personal data or the user's private content. The user can ask to see a report before it is sent.\n\nPrivacy and access: the user signs in on himalayas.app through OAuth, so agents never see their password, and a connection only gets the scopes the user approved. Email, password and account deletion can't be changed through these tools. How Himalayas handles personal data, including the services that process it: https://himalayas.app/privacy",
