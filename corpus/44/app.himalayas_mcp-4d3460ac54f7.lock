              },
              "country": {
                "description": "Filter jobs by country (e.g., 'Canada', 'United States', 'UK')",
                "type": "string"
              },
              "currency": {
                "description": "Salary currency (default: USD). salary_min and salary_max are always USD; this doesn't convert them.",
                "enum": ["USD", "AUD", "EUR", "JPY", "GBP", "CAD", "CHF", "CNY", "HKD", "NZD", "SGD", "SEK", "KRW", "NOK", "INR", "MXN", "TWD", "ZAR", "BRL", "IDR", "PHP", "THB", "CLP", "CZK", "DKK", "HUF", "ILS", "TRY", "PLN"],
                "type": "string"
