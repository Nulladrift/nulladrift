            "properties": {
              "benefits": {
                "description": "Comma-separated benefit slugs to filter by (e.g., '401k,health-insurance,equity')",
                "type": "string"
              },
              "companies": {
                "description": "Comma-separated company slugs to filter by (e.g., 'stripe,gitlab')",
