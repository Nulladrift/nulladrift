        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "orion-celestia-intel",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_daily_brief",
          "title": "Today's Celestia network brief",
          "description": "Orion's latest daily analysis of the Celestia mainnet: headline, anomaly signals with severity, key network metrics, and provenance links for every figure. Start here for 'what is happening on Celestia today?'. Set include_narrative for Orion's written prose summary.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "include_narrative": {
                "description": "Also return Orion's written prose narrative (markdown, with a citation check)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3915faffdb382087bb9ccb7cd788a7fd915204c00c92e959d405e4fbe67eedb0"
        },
        {
          "name": "get_metric_history",
          "title": "Metric history series",
          "description": "Time series of one snapshot metric across Orion's daily reports, oldest to newest. Metrics: height, total_fee_tia, total_blobs_tb, total_tx, total_validators, active_validators, tia_price, bonded_ratio, bonded_ratio_supply, nakamoto_halting, jail_count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many recent days (default 30)",
                "maximum": 365,
                "minimum": 2,
                "type": "integer"
              },
              "metric": {
                "description": "Which snapshot metric to chart",
                "enum": ["height", "total_fee_tia", "total_blobs_tb", "total_tx", "total_validators", "active_validators", "tia_price", "bonded_ratio", "bonded_ratio_supply", "nakamoto_halting", "jail_count"],
                "type": "string"
              }
            },
            "required": ["metric"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08cdfbaae8e1257aeff5837cfc60a7be02e9a17fefe6d66eb96d49c882be20c5"
        },
        {
          "name": "get_namespace",
          "title": "Namespace detail",
          "description": "Detail for a single Celestia namespace by its namespace_id (hex — get one from get_top_namespaces): size, blob count, last activity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "namespace_id": {
                "description": "Namespace id (hex), e.g. from get_top_namespaces",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["namespace_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20f1bc63f1ba1cfa5ebb2b50f6a6f992b396a7742773f695888021c8919daa05"
        },
        {
          "name": "get_network_state",
          "title": "Celestia network state",
          "description": "Current Celestia mainnet metrics from Orion's latest snapshot: height, DA volume (TB), fees, validators (active vs registered), staking ratios, Nakamoto coefficient, jail count, TIA price — with provenance links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:45effa56183e6affcb4eff092b342647a9be85f8ff13fd94023aa85e5afd5d09"
        },
        {
          "name": "get_report",
          "title": "Full daily report",
          "description": "Full Orion report for a specific date (YYYY-MM-DD): snapshot metrics, all signals, summary, provenance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Report date YYYY-MM-DD (see list_reports for available dates)",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1c4fdd191a2e304565c51b85744227d2a6fb839ecc5b253386a5cd5d05c807d7"
        },
        {
          "name": "get_signals",
          "title": "Anomaly signals",
          "description": "Anomaly/health signals detected by Orion for a given day (default: latest). Each signal has type, severity (info|notable|critical), observed value vs rolling baseline, and its data source. Filter with min_severity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Report date YYYY-MM-DD; omit for the latest report",
                "type": "string"
              },
              "min_severity": {
                "description": "Only signals at or above this severity",
                "enum": ["info", "notable", "critical"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c10bfc7a6a4d7f75f64cb3d6635b749af7098a812122506e0abdf8b402c0137"
        },
        {
          "name": "get_top_namespaces",
          "title": "Top Celestia namespaces by DA volume",
          "description": "Largest namespaces (rollups) on Celestia by total blob size, live from Celenium. Shows who is posting the most data to the DA layer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many namespaces (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b2fa4284ba45b9a9b2e040f9b701ba59e5636155e83b7b4a89291774f09fe830"
        },
        {
          "name": "get_top_validators",
          "title": "Top Celestia validators by stake",
          "description": "Largest Celestia validators by stake, live from Celenium: moniker, stake (TIA), commission, jailed status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many validators (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:59abd8f66d954319538eb595030667b7a420e485d91630e8c493e73f735a9862"
        },
        {
          "name": "get_trends",
          "title": "Network trends (day-over-day)",
          "description": "Day-over-day and week-over-week change for key Celestia metrics, computed from Orion's daily snapshots. Answers 'what changed since yesterday / last week?'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fb7057f6017cf968562f2c4ff99746c95848f58c28f79ea46b79374fde3a226"
        },
        {
          "name": "list_reports",
          "title": "Report archive index",
          "description": "Index of Orion's daily Celestia reports (date + signal counts), newest first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max entries to return (default 30)",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3d1057db9ffed8bc6c8c01115fc5d95c9ebe1917766e4fa17ad2a4aaeed42be"
        },
        {
          "name": "search_reports",
          "title": "Search the report archive",
          "description": "Keyword search across recent daily reports (signal titles, details, types, metrics). Returns matching signals grouped by date. Plain keyword scan — no LLM in the loop, results are verbatim from the archive.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many recent reports to scan (default 14)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword or phrase, e.g. 'eclipse', 'block time', 'namespace'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25b887518933a3593cd3056354ccdc9c01051b3647b0aa06820adc1773296ee9"
        }
      ],
