              }
            ]
          },
          "digest": "sha256:3065bc48b3f09243294cdf09d0b2cd8e12866066d6101e6cd75ca70529b63fa9"
        },
        {
          "name": "list_scenes",
          "title": "List scenes",
          "description": "List the team's scenes in their order, with their state (live, partly live, changed since it went live, off) and which screens and sub-screens each scene sets (at most 20 targets per scene; targets_total is the real number). Results come in pages: pass next_cursor as cursor for the next page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "limit": {
                "description": "Scenes per page. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List scenes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["scenes:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c22ec181d454016b4d299d66d33dd250810a72be1694ecc26c9f080f5fbf1b5e"
        },
        {
          "name": "list_screens",
          "title": "List screens",
          "description": "List the connected team's screens: online status and what each screen and sub-screen shows right now (its normal content, pushed content, a scene or screen mirroring), with the end time if there is one. Also returns the account's time zone and current local time. Filter with query (part of a screen or sub-screen name) or screen_id. Results come in pages: pass next_cursor as cursor for the next page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "limit": {
                "description": "Screens per page. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a screen or sub-screen name.",
                "maxLength": 100,
                "type": "string"
              },
              "screen_id": {
                "description": "One screen.",
                "pattern": "^[0-9a-fA-F-]{36}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List screens"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["screens:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:79834c2e1f3c1739eb40bbd9b2aa4beff3eb234d1f5ac02e3999b1603d4e6c0c"
        },
        {
          "name": "push_content",
          "title": "Show content on a screen",
          "description": "Show content on one screen, or on one sub-screen of a split screen, in place of what it shows now, until a time or until it is put back to normal. A split screen needs a subscreen_id. Returns what the screen shows afterwards. Content only appears once the screen is online and has a player paired; the result includes online and paired when the connection may read screens.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_id": {
                "description": "Id of the file, design, app, split screen or playlist to show, as found in the team's content.",
                "pattern": "^[0-9a-fA-F-]{36}$",
                "type": "string"
              },
              "screen_id": {
                "description": "Id of the screen, as listed with the team's screens.",
                "pattern": "^[0-9a-fA-F-]{36}$",
                "type": "string"
              },
              "subscreen_id": {
                "description": "Id of one sub-screen of a split screen. Required for a split screen, left out for a normal screen.",
                "pattern": "^[0-9a-fA-F-]{36}$",
                "type": "string"
              },
              "until": {
                "description": "When to go back to normal: local time of the account without an offset (for example 2026-10-23T18:00), or a time with an offset (2026-10-23T18:00:00+02:00). At most 90 days ahead. Leave out to show it until it is put back to normal.",
                "type": "string"
              }
            },
            "required": ["content_id", "screen_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Show content on a screen"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["screens:push"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6e1594da773630aee347f01169dcf7b5655bcdee21d01517e181b2c0bdff2d7c"
        },
