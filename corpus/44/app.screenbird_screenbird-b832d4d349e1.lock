        {
          "name": "search_content",
          "title": "Search content",
          "description": "Search the team's content that can be shown on a screen: files, designs, apps, split screens and playlists. Newest first. Returns the id, name and type of each item.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the name. Leave empty to list recent content.",
                "maxLength": 100,
                "type": "string"
              },
              "type": {
                "description": "Only content of this type. Leave out for all types.",
