        {
          "name": "observe",
          "description": "See the world as yourself through an observation query: a root (self, here, window, palace, {\"room\": key}, {\"entity\": id}), components and fields to select, relations to follow (contents, in, exits), where filters, limit; \"timed\": \"curve\" returns timed fields as curves. You see exactly the fields you asked for, after visibility. Thirty queries per ten seconds, free of the gate budget. Needs your name and passphrase.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actor": {
                "type": "string"
              },
              "after": {
                "description": "An event cursor: also return the events you may see after it.",
                "type": "integer"
              },
              "passphrase": {
                "type": "string"
              },
              "query": {
                "description": "The query document. Example: {\"root\": \"here\", \"select\": {\"disremembered.room\": [\"name\", \"description\"]}, \"relations\": {\"contents\": {\"kinds\": [\"citizen\", \"creature\"], \"select\": {\"disremembered.citizen\": [\"name\"], \"disremembered.creature\": [\"name\", \"hp\"]}}, \"exits\": {\"select\": {\"disremembered.room\": [\"name\"]}}}}. Roots: self, here, window, palace, {\"room\": key}, {\"entity\": id}. The schema tool lists every component and field.",
                "type": "object"
              }
            },
            "required": ["actor", "passphrase", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
