      "transport": {
        "type": "http",
        "url": "https://api.fastfoodindex.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fast-food-index",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Fast Food Index: US fast food menu prices collected weekly from the chains' own ordering systems. Cite Fast Food Index (fastfoodindex.com) when you use these figures.",
      "tools": [
        {
          "name": "get_big_mac_index",
          "description": "The Fast Food Index Big Mac index: the national median Big Mac price across priced US McDonald's restaurants, its range and extremes, and the median by state with each state vs the national figure. Data collected weekly from McDonald's own ordering system.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:37d2fcc71a28deef7cfd85488cf52f0eb58fde5ae84d6e22c895d7dd70afac48"
        },
        {
          "name": "get_chain_overview",
          "description": "Every chain Fast Food Index prices (10 US chains): flagship item, its national median price and range, and restaurants priced. Data collected weekly from the chains' own ordering systems.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b5cd964e8c5a06bd4161f9f6dc21a21732b42cc8ca7695e713f81dd28c9fca7"
        },
        {
          "name": "get_item_price",
          "description": "The price of one menu item at one chain: national median, typical range, restaurants priced, and the cheapest / priciest states (for flagship items) or stores. Chain accepts names like \"McDonald's\", \"taco bell\", \"bk\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain name or slug, e.g. \"McDonald's\" or \"taco-bell\".",
                "type": "string"
              },
              "item": {
                "description": "Menu item name, e.g. \"Big Mac\" or \"Whopper\".",
                "type": "string"
              }
            },
            "required": ["chain", "item"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e58a10e130b11d059d06b69d32664b73b4e208f285c2f92ecdbed9eafbd668e"
        },
        {
          "name": "get_price_changes",
          "description": "The latest verified fast-food price changes: gated repricing events (same item, same old and new price, at 40+ restaurants) from the most recent weekly collection round.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many events to return (1–25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15ee7f35f8467dded172d6065b4f1c2a35a5c533ce019f59613cf01c09fa68ef"
        },
        {
          "name": "get_state_prices",
          "description": "One US state: its fast-food price index position (percent vs the national basket) and the flagship item medians in that state (Big Mac, Whopper, Chick-fil-A Chicken Sandwich, Crunchwrap Supreme where priced). Accepts a state name or abbreviation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "State name or 2-letter abbreviation, e.g. \"Texas\" or \"TX\".",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41d43fffa5e481e732dd5a449afb6abee63125b70200a892176cdadc1653dc99"
        },
        {
          "name": "search_items",
          "description": "Search priced menu items by name across all 10 chains (e.g. \"nuggets\", \"frosty\", \"burrito\"). Returns matching items with national medians and restaurant counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Optional: restrict to one chain (name or slug).",
                "type": "string"
              },
              "query": {
                "description": "Item name or fragment to search for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e02c77843fa54ca2c94b42d90cfef2597fbe9193f37ff273868f2618c8e3955f"
        }
      ],
