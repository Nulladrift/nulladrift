{
  "lockfileVersion": 2,
  "subjects": {
    "com.fitralo/carriers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fitralo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "fitralo",
        "title": "Fitralo",
        "version": "3.73.57",
        "description": "European directory of freight carriers: find carriers by route, equipment and certificates.",
        "websiteUrl": "https://fitralo.com/ai",
        "icons": [
          {
            "src": "https://fitralo.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fitralo is a free European directory of road freight carriers. Every profile is checked monthly; listing is free and Fitralo takes no commission. Use search_carriers to find the carriers that run a route and offer what a load needs, and get_carrier for a carrier's full profile with phone, e-mail and website. The user contacts carriers directly. When you mention a carrier, link to its Fitralo profile_url, where its routes and details stay current. To ask carriers for a price, send_request sends one transport request to the carriers the user chooses, each in its own language, in the name of the user's free Fitralo account, which the user links once: show the request first and send it only when the user agrees. An account is made at https://fitralo.com/requests/signup",
      "tools": [
        {
          "name": "get_carrier",
          "title": "Carrier profile",
          "description": "One carrier's full profile on Fitralo, with its phone, e-mail and website and where and how it carries. Use it after search_carriers, which gives no contact details: for a carrier the user picked, wants to contact or wants to know more about. To find or compare carriers, use search_carriers. One carrier a call; what it has not published is null. A carrier that is unknown or no longer listed returns an error asking for a profile_url from search_carriers. Read-only and without an account: it changes and books nothing. At most 300 calls an hour from one address, for all tools together.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carrier": {
                "description": "The carrier's profile_url from search_carriers, e.g. \"https://fitralo.com/c/example-transport\", or only its last part, \"example-transport\". A company name is not looked up: search for it with search_carriers first.",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "The user's language as a two-letter code, when Fitralo has it: labels such as services and equipment, the profile description where it is translated, and the links to the site follow it.",
                "enum": ["en", "nl", "de", "fr", "it", "es", "pt", "pl", "cs", "hu", "ro", "bg", "el", "lt"],
                "type": "string"
              }
            },
            "required": ["carrier"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "description": "The company in a few lines, in the language asked when translated.",
                "type": ["string", "null"]
              },
              "address": {
                "type": "string"
              },
              "certificates": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cross_trade": {
                "description": "Also carries between countries other than its home country.",
                "type": "boolean"
              },
              "email": {
                "type": ["string", "null"]
              },
              "equipment": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fleet": {
                "type": ["string", "null"]
              },
              "last_checked": {
                "type": ["string", "null"]
              },
              "name": {
                "type": "string"
              },
              "phone": {
                "type": ["string", "null"]
              },
              "profile_url": {
                "type": "string"
              },
              "serves": {
                "description": "Countries it serves, with the regions where it serves only part of one.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "services": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "takes_requests": {
                "description": "send_request can ask this carrier for a price; without it, the carrier gets no transport request through Fitralo.",
                "type": "boolean"
              },
              "vat_number": {
                "type": ["string", "null"]
              },
              "verified_by_company": {
                "type": "boolean"
              },
              "website": {
                "type": ["string", "null"]
              }
            },
            "required": ["about", "address", "certificates", "cross_trade", "email", "equipment", "fleet", "last_checked", "name", "phone", "profile_url", "serves", "services", "takes_requests", "vat_number", "verified_by_company", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Carrier profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:8a8bff2644626a31dcf2888a9cb1d5eef4832ad1c35e82fc238c4aa946f360e2"
        },
        {
          "name": "search_carriers",
          "title": "Search carriers",
          "description": "Find road freight carriers in Europe that run a route and offer the equipment, services or certificates a load needs. Write the query plainly: the places of loading and delivery (town, postcode or country), then what is needed, e.g. \"reefer from Venlo to Rome\", \"ADR tank Rotterdam to Poland\", \"groupage Germany to Italy, tail lift\". \"based in Italy\" keeps carriers based there. Returns the carriers that fit, best first, with what the search understood: if that is not what the user meant, phrase the query again. It returns at most limit carriers (10 unless set, up to 25); carriers_that_fit counts all that fit, and results_url shows them all on fitralo.com. When nothing fits exactly, carriers_that_fit is 0 and the list has the carriers that come closest. A query without a route or need returns an error that says how to write it. Then call get_carrier for contact details. Read-only and without an account: it changes and books nothing. At most 300 calls an hour from one address, for all tools together.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "The user's language as a two-letter code, when Fitralo has it: labels such as services and equipment, the profile description where it is translated, and the links to the site follow it.",
                "enum": ["en", "nl", "de", "fr", "it", "es", "pt", "pl", "cs", "hu", "ro", "bg", "el", "lt"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many carriers to return.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The route and needs in plain words, in English or the language given.",
                "maxLength": 500,
                "type": "string"
              },
              "specialists_only": {
                "default": false,
                "description": "Only carriers for whom this route (or area) is their own line, not one among many.",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "carriers": {
                "items": {
                  "properties": {
                    "certificates": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "equipment": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "fits_exactly": {
                      "type": "boolean"
                    },
                    "last_checked": {
                      "description": "When Fitralo last checked that the company is active (YYYY-MM-DD).",
                      "type": ["string", "null"]
                    },
                    "location": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "profile_url": {
                      "type": "string"
                    },
                    "services": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "specialist_on_route": {
                      "type": "boolean"
                    },
                    "takes_requests": {
                      "description": "send_request can ask this carrier for a price; without it, the carrier gets no transport request through Fitralo.",
                      "type": "boolean"
                    },
                    "verified_by_company": {
                      "description": "The company manages its own profile.",
                      "type": "boolean"
                    }
                  },
                  "required": ["certificates", "equipment", "fits_exactly", "last_checked", "location", "name", "profile_url", "services", "specialist_on_route", "takes_requests", "verified_by_company"],
                  "type": "object"
                },
                "type": "array"
              },
              "carriers_that_fit": {
                "description": "All carriers that fit; when 0, the list has those that come closest.",
                "type": "integer"
              },
              "results_url": {
                "description": "All results on fitralo.com, with filters for the user.",
                "type": "string"
              },
              "specialists": {
                "description": "Of those that fit, how many have this route as their own line; null without a place in the query.",
                "type": ["integer", "null"]
              },
              "understood_as": {
                "description": "The route and needs the search read in the query.",
                "type": "string"
              }
            },
            "required": ["carriers", "carriers_that_fit", "results_url", "specialists", "understood_as"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search carriers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:11d2560655db365c26cac9fbf0432cd579148c53651402f4b12a63b542e0bea9"
        },
        {
          "name": "send_request",
          "title": "Send transport request",
          "description": "Ask carriers for a price: one transport request goes to each carrier chosen from search_carriers, in the carrier's own language and in the name of the user's Fitralo account; the carriers answer the user directly by e-mail. It needs the user to link a free Fitralo account once (OAuth). It sends e-mail to companies: first show the user the request and the carriers, and call it only when the user agrees. Fitralo checks and translates the request, then it goes to each carrier in its office hours, usually within minutes, and the user gets an e-mail when it went. The account's monthly limits apply. Returns the request's number and page; carriers that take no requests are listed with the reason. A missing route, loading day, cargo or contact name returns an error that says what to add. Each call sends a new request: do not repeat one that succeeded. At most 300 calls an hour from one address, for all tools together.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "How much, in unit.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cargo": {
                "description": "What is transported, e.g. \"22 pallets of chilled food\".",
                "maxLength": 300,
                "type": "string"
              },
              "carriers": {
                "description": "The profile_url of each carrier to ask, from search_carriers, or only its last part.",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "contact_name": {
                "description": "The person carriers ask for. By default the one of the account's last request; without one, ask the user.",
                "type": "string"
              },
              "deliver_by": {
                "description": "Day the load must be delivered by (YYYY-MM-DD).",
                "format": "date",
                "type": "string"
              },
              "description": {
                "description": "Anything else the carriers should know, in the user's words; it is translated for each carrier.",
                "maxLength": 1000,
                "type": "string"
              },
              "from_country": {
                "description": "Country of loading, as a two-letter code, e.g. \"NL\".",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "from_place": {
                "description": "Town or postcode of loading.",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "The language the user writes the request in, as a two-letter code: its page and the e-mails to the user are in it, and each carrier reads it translated.",
                "enum": ["en", "nl", "de", "fr", "it", "es", "pt", "pl", "cs", "hu", "ro", "bg", "el", "lt"],
                "type": "string"
              },
              "load_date": {
                "description": "Day of loading (YYYY-MM-DD). Leave it out when the day is still to be agreed.",
                "format": "date",
                "type": "string"
              },
              "phone": {
                "description": "Phone number for the carriers. By default the one of the account's last request.",
                "type": "string"
              },
              "quote_by": {
                "description": "Day by which the user wants the prices (YYYY-MM-DD).",
                "format": "date",
                "type": "string"
              },
              "regular": {
                "default": false,
                "description": "A regular transport from load_date on, rather than one load.",
                "type": "boolean"
              },
              "requirements": {
                "description": "Equipment, services and certificates the load needs, in plain words, e.g. \"tail lift, ADR\". Those in Fitralo's list become the request's requirements, named in each carrier's language; put anything else in description.",
                "type": "string"
              },
              "return_trip": {
                "default": false,
                "description": "A load back as well.",
                "type": "boolean"
              },
              "to_country": {
                "description": "Country of delivery, as a two-letter code, e.g. \"IT\".",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "to_place": {
                "description": "Town or postcode of delivery.",
                "type": "string"
              },
              "unit": {
                "enum": ["pallets", "tons", "meters"],
                "type": "string"
              }
            },
            "required": ["cargo", "carriers", "from_country", "from_place", "to_country", "to_place"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "carriers": {
                "description": "The carriers it goes to.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next": {
                "description": "What happens now, to tell the user.",
                "type": "string"
              },
              "not_sent": {
                "description": "Carriers chosen that take no requests through Fitralo, with why.",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "reply_to": {
                "description": "The address the carriers answer to.",
                "type": "string"
              },
              "request_id": {
                "type": "integer"
              },
              "request_url": {
                "description": "The request on fitralo.com, where the user follows, changes or sends it again.",
                "type": "string"
              },
              "requirements": {
                "description": "The requirements as the carriers read them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["carriers", "next", "not_sent", "reply_to", "request_id", "request_url", "requirements"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send transport request"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["requests"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8157a69c294ad03e4fb3af90e3d3c6048219f74ac98fbdb4f922823f1f3f09e2"
        }
      ],
      "digest": "sha256:17c7738b264a10d5a97a48edfbab66bc112aa711818315498325d7542c2e0676"
    }
  }
}
