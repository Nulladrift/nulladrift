      "instructions": "Post Kit: Post drafts, scripts, covers. The user publishes every post themselves. Call draft_posts for posts on a topic, localize_post to adapt a post for another market, draft_video_script for a short video script, launch_video for an HTML clip of the user's own product page, draft_tiktok_slides for TikTok slideshows of one idea, and make_cover for a layered post cover. For make_cover, write a title of at most 8 words from the idea when the user gave none, and keep the user's words when they did. Show the summary and canvas_url, then the prompts to make the pictures with; offer the SVG as a file. The title stays live text: never ask an image model to draw it. For draft_tiktok_slides, quote the summary field first. For a product or a new account, write 3 or 4 angles of 5 short lines from the user's facts as angle_lines, with plan_days 14 when the user wants a posting plan. Save png_base64 only when the user asks for the files; with angle_lines each slide is a png_url link instead. Show posting_plan days as a table with its rules, and add no posting times or claims. Show each angle's caption and hashtags. The page /slides does the same job. Show each draft with its length and issues. passes false means it breaks a rule named in issues: say so, do not present it as ready. When ai_disclosure.flagged is true, name the label each platform needs and quote its source. Do not call it optional where the rule requires it, and do not decide for the user whether to post. Use only the facts in the user's topic or post: add no claims, numbers or links. capacity_reached means the free daily writing allowance is used up until 00:00 UTC: say so and offer the checklist, which is still returned. Do not use these tools to post for the user, read an account, fetch statistics or trends, or repost or translate someone else's content. Decline those and persona farms, voice cloning of real people or fake-identity accounts. launch_video is for the user's own page: ask before calling it on a page that is not theirs. Offer the returned html as a file to open in a browser. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "draft_posts",
          "title": "Draft posts for each platform",
          "description": "Use this when the user wants social posts written about a topic, such as \"write posts about our new CLI for X, Bluesky and LinkedIn\". Pass the topic, with every fact and any link to include, and 1 to 6 platforms from x, bluesky, threads, mastodon, linkedin, instagram, reddit, youtube, pinterest, tiktok; optionally a tone. Returns one draft per platform with its length as that platform counts it, hashtags, whether it passes the platform's rules and the issues if not, plus a checklist of rules and image sizes with sources and dates. Uses only the facts given. It does not publish, read accounts or fetch trends or statistics.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "platforms": ["x", "bluesky", "linkedin"],
                "topic": "The launch of our new open-source CLI, branch-tidy. It deletes merged git branches in one command, works on macOS, Linux and Windows, and is MIT licensed."
              }
            ],
            "properties": {
              "platforms": {
                "description": "Where the posts will go, up to 6 of x, bluesky, threads, mastodon, linkedin, instagram, reddit, youtube, pinterest, tiktok.",
                "items": {
                  "enum": ["x", "bluesky", "threads", "mastodon", "linkedin", "instagram", "reddit", "youtube", "pinterest", "tiktok"],
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "tone": {
                "description": "Optional voice, such as \"friendly and plain\" or \"dry humour\".",
                "maxLength": 80,
                "type": "string"
              },
              "topic": {
                "description": "What the posts are about, with any facts, names and link to include. Posts use only what is given here.",
                "maxLength": 800,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["platforms", "topic"],
            "type": "object"
          },
