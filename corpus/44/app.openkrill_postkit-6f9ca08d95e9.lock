        {
          "name": "draft_tiktok_slides",
          "title": "Make TikTok slideshows for one idea",
          "description": "Use this when the user wants to test an app idea with TikTok slideshows before coding, such as \"make 4 slideshows for this idea\". Pass idea, and angles 3 or 4 (default 4). For a product or a new account, also pass angle_lines: 3 or 4 angles you wrote, each with name, hook, pain, stake, reveal and cta, and optionally caption and hashtags; the slides then show only those lines. Pass plan_days 7 to 14 for a posting plan of the first days. With angle_lines each slide comes as png_url, a link to its PNG, unless images is true. Returns that many angles, each with 5 slides (hook, pain, stake, reveal, cta) as 1080x1920 PNGs in png_base64, one caption and a hashtag list. Quote the summary field first: it has the counts and the first caption. Save png_base64 as its filename only when the user asks for the files. Stake is the second pain beat. The reveal invites the comment what is the app. The same page is at /slides. One call is one plugin-call. It does not publish or store the idea.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "angles": 4,
                "idea": "a shared grocery list for roommates"
              }
            ],
            "properties": {
              "angle_lines": {
                "description": "Optional. 3 or 4 angles you wrote for a product or account, one line per slide. When given, the slides show these lines instead of the fixed app-test frames, with no angle name, role or footer on the image, ready to post. Each line is at most 90 characters of letters, digits, spaces and . , : - / ! ? ' + %; curly quotes and dashes are drawn as plain ones.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "caption": {
                      "description": "Caption words. Default: the hook and the reveal. The hashtags are added after it.",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "cta": {
                      "maxLength": 90,
                      "minLength": 1,
                      "type": "string"
                    },
                    "hashtags": {
                      "description": "Up to 5 hashtags. Default: words from the idea.",
                      "items": {
                        "pattern": "^#?[A-Za-z0-9_]{2,40}$",
                        "type": "string"
                      },
                      "maxItems": 5,
                      "type": "array"
                    },
                    "hook": {
                      "maxLength": 90,
                      "minLength": 1,
                      "type": "string"
                    },
                    "name": {
                      "description": "Short angle name, such as Myth bust.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "pain": {
                      "maxLength": 90,
                      "minLength": 1,
                      "type": "string"
                    },
                    "reveal": {
                      "maxLength": 90,
                      "minLength": 1,
                      "type": "string"
                    },
                    "stake": {
                      "maxLength": 90,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["cta", "hook", "name", "pain", "reveal", "stake"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 3,
                "type": "array"
              },
              "angles": {
                "description": "How many angles to make. Default 4. Each angle is 5 slides. With angle_lines, leave it out: the count is the number of angles sent.",
                "maximum": 4,
                "minimum": 3,
                "type": "integer"
              },
              "idea": {
                "description": "The app or startup idea to test. Slides use only this text plus fixed angle frames. Do not include secrets.",
                "maxLength": 280,
                "minLength": 8,
                "type": "string"
              },
              "images": {
                "description": "Optional, used with angle_lines. false (the default with angle_lines) returns each slide as png_url, a link that draws the PNG, and leaves png_base64 empty, so the answer stays small; true also puts the PNG bytes in png_base64 (about 400 KB for 20 slides). Without angle_lines the bytes are always returned.",
                "type": "boolean"
              },
              "plan_days": {
                "description": "Optional. 7 to 14: also return a posting plan for the first days of a new account that uses every angle, a 15-second video, reply posts and review days.",
                "maximum": 14,
                "minimum": 7,
                "type": "integer"
              }
            },
            "required": ["idea"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "angle_count": {
                "type": "integer"
              },
              "angles": {
                "items": {
                  "properties": {
                    "caption": {
                      "type": "string"
                    },
                    "hashtags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "enum": ["pain", "curiosity", "contrarian", "story", "angle-1", "angle-2", "angle-3", "angle-4"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slides": {
                      "items": {
                        "properties": {
                          "filename": {
                            "type": "string"
                          },
                          "height": {
                            "type": "integer"
                          },
                          "index": {
                            "type": "integer"
                          },
                          "media_type": {
                            "type": "string"
                          },
                          "png_base64": {
