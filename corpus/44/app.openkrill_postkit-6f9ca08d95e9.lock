                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["days", "rules", "sources"],
                "type": "object"
              },
              "slide_count": {
                "type": "integer"
              },
              "source": {
                "type": "string"
              },
              "status": {
                "enum": ["ok", "declined"],
                "type": "string"
              },
              "summary": {
                "description": "Short counts and the first caption. Quote this before reading image bytes.",
                "type": "string"
              }
            },
            "required": ["angle_count", "angles", "as_of", "billing", "notice", "page", "slide_count", "source", "status", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Make TikTok slideshows for one idea",
            "openai/toolInvocation/invoking": "Make TikTok slideshows for one idea..."
