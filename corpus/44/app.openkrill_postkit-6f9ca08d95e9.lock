              "formats": {
                "default": ["instagram_portrait", "x_landscape"],
                "description": "Sizes to lay out; the first is the size the pictures are made at",
                "items": {
                  "enum": ["instagram_portrait", "x_landscape", "1:1", "9:16", "16:9", "5:2", "4:3", "3:4"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "idea": {
                "description": "The post idea the cover is for, in one or two sentences",
                "maxLength": 280,
                "minLength": 3,
                "type": "string"
              },
              "kind": {
                "default": "article",
                "description": "article: Article or blog cover: a strong headline beside one clear picture; note: Note cover (Instagram or Xiaohongshu style): a large headline over a close, friendly picture; ecommerce: Shop poster: the product large in the middle, the offer in words; product: Product design shot: the object as a hero on a clean set, the name below",
                "enum": ["article", "note", "ecommerce", "product"],
                "type": "string"
              },
              "reader": {
                "description": "Who the post is for, for example 'founders who run AI agents'",
                "maxLength": 80,
                "type": "string"
              },
              "split": {
                "default": "separate",
                "description": "separate: two pictures, a background plate and a subject cutout; segment: one scene per size that a segmentation model cuts",
                "enum": ["separate", "segment"],
                "type": "string"
              },
              "style": {
                "anyOf": [
                  {
                    "enum": ["openkrill", "openkrill_dark"],
                    "type": "string"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "accent": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "ink": {
                        "description": "Colour of the title and subtitle",
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "light": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "medium": {
                        "description": "What the pictures are, for example a film photograph or a flat paper collage",
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "mood": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "muted": {
                        "description": "Colour of the byline",
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 60,
                        "minLength": 1,
                        "type": "string"
                      },
                      "palette": {
                        "description": "Hex colours, background tone first",
                        "items": {
                          "pattern": "^#[0-9a-fA-F]{6}$",
                          "type": "string"
                        },
                        "maxItems": 8,
                        "minItems": 2,
                        "type": "array"
                      }
                    },
                    "required": ["accent", "ink", "light", "medium", "mood", "muted", "name", "palette"],
                    "type": "object"
                  }
                ],
                "default": "openkrill",
                "description": "An account style preset, or your own style so every cover of one account looks alike"
              },
              "subject": {
                "description": "One concrete object the picture shows, such as 'a glass jar of folded paper notes'; write one from the idea when the user gave none, since an idea alone gives a vague picture",
                "maxLength": 200,
                "type": "string"
              },
              "subject_url": {
                "description": "Your subject cutout, once made from the prompt",
                "format": "uri",
                "maxLength": 2048,
