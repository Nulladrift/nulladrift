        {
          "name": "make_cover",
          "title": "Make a layered post cover",
          "description": "Use this when the user wants a cover image for a post, article, note or product, such as \"make a cover for my post about X\". Pass idea, title (up to 8 words; write from the idea if omitted), subject (one concrete object to picture; write from the idea), and optionally subtitle, byline, reader, kind (article, note, ecommerce, product), style and formats. Returns the cover spec JSON with layers in occlusion order (background, subject, then title, subtitle and byline as live text), pixel positions per format (default Instagram 1080x1350 and X 1600x900), GPT image prompts, an SVG per format and a canvas link to move the title, scale the subject and export PNGs without remaking the picture. Draws no picture itself, publishes nothing and stores nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "byline": "tools.openkrill.app",
                "idea": "A plain SQLite table with a status column is enough job queue for most small apps, no Redis needed.",
                "subtitle": "One table, one status column, no Redis",
                "title": "SQLite is your job queue"
              }
            ],
            "properties": {
              "background_url": {
                "description": "Your background picture, once made from the prompt",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
