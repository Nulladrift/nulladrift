                "description": "The posting plan, only when plan_days was given.",
                "properties": {
                  "days": {
                    "items": {
                      "properties": {
                        "angle_id": {
                          "type": "string"
                        },
                        "day": {
                          "type": "integer"
                        },
                        "kind": {
                          "enum": ["slideshow", "video", "reply", "review"],
                          "type": "string"
                        },
