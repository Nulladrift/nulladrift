                          "width": {
                            "type": "integer"
                          }
                        },
                        "required": ["filename", "height", "index", "media_type", "png_base64", "png_bytes", "role", "text", "width"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["caption", "hashtags", "id", "name", "slides"],
                  "type": "object"
                },
                "type": "array"
              },
              "as_of": {
                "type": "string"
              },
