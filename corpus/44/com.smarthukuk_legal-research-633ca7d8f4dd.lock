        {
          "name": "search_public_precedents",
          "title": "Resmî kaynaklarda emsal karar ara",
          "description": "E-posta ile etkinleştirilmiş trialToken kullanarak doğal dil, esas/karar numarası veya hukuki konu ile public resmî karar kaynaklarında arama yapar. İlk 5 başarılı arama ücretsizdir. Sonuçlar künye ve resmî kaynak URL’si içerir; hukuki görüş üretmez.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chamber": {
                "description": "İsteğe bağlı daire/kurul filtresi",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "dateFrom": {
                "description": "İsteğe bağlı başlangıç tarihi, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dateTo": {
                "description": "İsteğe bağlı bitiş tarihi, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Döndürülecek sonuç sayısı (1-5)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Kişisel veri içermeyen hukuki konu, olay özeti veya karar künyesi",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "trialToken": {
                "description": "start_mcp_precedent_trial aracından dönen gizli deneme tokenı",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
