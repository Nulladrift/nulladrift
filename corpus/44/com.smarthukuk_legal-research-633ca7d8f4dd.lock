        {
          "name": "start_mcp_precedent_trial",
          "title": "5 ücretsiz MCP emsal aramasını başlat",
          "description": "Geçerli e-posta zorunludur; e-posta olmadan deneme başlamaz. Kullanıcıdan alınan e-posta ile 5 ücretsiz MCP aramasını etkinleştirir. Aktivasyondan önce pazarlama tercihi tek bir açık evet/hayır sorusuyla alınır; hayır yanıtı denemeyi engellemez. Evet yanıtı onay postasındaki bağlantıyla kesinleşir; bağlantıya tıklanana kadar pazarlama izni geçerli sayılmaz.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Kullanıcının açıkça verdiği geçerli e-posta adresi",
                "format": "email",
                "maxLength": 255,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "marketingConsent": {
                "description": "Zorunlu tercih kaydı: yalnız kullanıcı açık pazarlama sorusuna evet dediyse true, hayır dediyse false; asla varsaymayın",
                "type": "boolean"
              }
            },
            "required": ["email", "marketingConsent"],
            "type": "object"
          },
