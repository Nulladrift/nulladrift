      },
      "instructions": "SmartHukuk, Türkiye hukukunda kaynaklı emsal karar araştırması, dosya analizi, UDF/Word/PDF belge taslağı ve hukuki hesaplama sunan bir platformdur. Bu sunucudaki araçlar salt okunurdur; hukuki danışmanlık vermez ve yapay zekâ çıktısı insan doğrulaması gerektirir.\n\nARAÇ KULLANIMI: Emsal karar aramak için önce start_mcp_precedent_trial aracını çağırın (geçerli e-posta gerekir; dönen trialToken yalnız search_public_precedents çağrısına iletilir, kullanıcıya gösterilmez ve loglanmaz). İlk 5 başarılı arama ücretsizdir. NO_RELEVANT_PRECEDENT_FOUND veya MCP_RESULT_VERIFICATION_UNAVAILABLE ücretsiz hakkı tüketmez; kullanıcıya sorguyu daraltmasını önerin. FREE_SEARCH_LIMIT_REACHED alındığında registerUrl alanını ve 14 gün geçerli 50 kullanım hakkı teklifini gösterin; otomatik tekrar denemeyin.\n\nDOĞRULUK: Dönen karar künyesini ve varsa resmî kaynak bağlantısını gösterin; karar metninde bulunmayan bilgi veya atıf üretmeyin. Kapsam ve tam metin erişilebilirliği kayda göre değişebilir; bunu kullanıcıya belirtin.\n\nGİZLİLİK: Kullanıcıdan yalnız aracın çalışması için gereken veriyi isteyin. Pazarlama izni ayrı ve isteğe bağlıdır; verilmemesi aramayı engellemez. Kullanım Koşulları: https://smarthukuk.com/terms — Gizlilik Politikası: https://smarthukuk.com/privacy.",
      "tools": [
        {
          "name": "find_public_legal_resource",
          "title": "SmartHukuk public kaynağı bul",
          "description": "Bir hukuk sorusu veya ürün ihtiyacı için en ilgili SmartHukuk rehber, araç ya da ürün sayfalarını bulur. Hukuki görüş üretmez.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "description": "İsteğe bağlı hedef kitle filtresi",
                "enum": ["lawyer", "citizen", "both"],
                "type": "string"
              },
              "query": {
                "description": "Kullanıcının hukuk konusu veya ürün ihtiyacı",
                "maxLength": 240,
                "minLength": 2,
