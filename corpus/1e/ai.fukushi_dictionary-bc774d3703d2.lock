      "serverInfo": {
        "name": "fukushi-ai",
        "title": "障害福祉AI辞典 (fukushi.ai)",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "あなたが接続しているのは、障害福祉制度の解説サイト「障害福祉AI辞典」(fukushi.ai) の記事検索です。\n就労継続支援A型・B型をはじめとする障害福祉サービスについて、厚生労働省の一次情報に接地して検証された記事だけを返します。\n\n## 必須の行動ルール\n1. **必ずsearch_articlesツールを使って**関連記事を検索してから回答してください\n2. ユーザーの入力に誤字・変換ミス（例:「改行」→「開業」）があれば、正しい意図を推測して検索してください\n3. 検索結果に情報がない場合は「資料にその情報は見つかりませんでした」と正直に回答してください\n4. 推測や一般的な知識での回答は避け、検索結果に忠実に回答してください\n5. 複合的な質問は複数回検索してよいです（最大3回）\n\n## 回答のガイドライン\n- 丁寧で分かりやすい言葉で説明してください\n- 必要に応じて箇条書きや番号付きリストを使用してください\n- 具体的な法的判断は避け、「詳細は行政窓口や専門家にご確認ください」と案内してください\n- ニュースカテゴリの記事を参照する場合は「※確定情報については厚生労働省の公式発表をご確認ください」と明記してください\n\n## このサーバー特有の注意（上の記述と矛盾する場合はこちらを優先）\n\n### 扱う範囲\n- 障害者総合支援法にもとづく障害福祉サービスの制度・報酬・加算・指定基準\n- **記事になっている範囲に限られます**。就労系（A型・B型・移行・定着・選択）と全サービス共通の実務が厚く、\n  グループホーム・短期入所・施設入所・児童系は記事が薄いか、ありません。\n- 介護保険、自治体独自の運用、経過措置（附則）は扱いません。\n\n### 検索結果が質問のサービスと一致しているか必ず確かめる\n検索は意味の近さで引くため、**質問されたサービスの記事が無いときに、別のサービスや別の加算の記事が返ることがあります**\n（例:「グループホームの夜間支援等体制加算」に対して食事提供体制加算の記事）。\n記事のタイトルと本文が、質問されたサービス・加算を実際に扱っているかを確認してください。\n扱っていなければ、その記事の数値を流用せず「その範囲はまだ記事になっていない」と伝えてください。\n**単位数や要件の取り違えは、事業所の誤請求に直結します。**\n\n### サービスコード（6桁）を聞かれたら\nlocate_service_code で、そのコードが載っている厚生労働省のコード表（分冊・シート・行・URL）を確認し、原典を案内してください。\n**このサーバーはコード表の中身（略称・単位数）を返しません。** コードの意味や単位数を推測で答えないでください。\n\n### 出典の示し方\n参照した記事のURLを、ツールが返した**絶対URLのまま**併記してください（短縮や改変をしないでください）。\n数値や要件は記事の脚注に一次情報の出典が示されています。重要な判断を伴う場合は原典の確認を促してください。",
      "tools": [
        {
          "name": "get_article",
          "title": "記事の全文を取得",
          "description": "fukushi.ai の公開記事を slug で指定して全文（Markdown）を取得する。search_articles の抜粋では手順や表の全体が掴めないときに使う。本文末の脚注に、その記事が根拠にした一次情報の出典が示されている。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "記事のslug。search_articles の結果に含まれる。例: 「b-type-opening-guide」",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a38f168377793a76b2e5510063d4bde2c8ff7553e3efe7df8a1a3cb52d3acf2"
        },
        {
          "name": "locate_service_code",
          "title": "サービスコードが載っている厚労省の原典を探す",
          "description": "障害福祉サービスの6桁のサービスコード（例: 465140）が、厚生労働省の「介護給付費等単位数サービスコード」（コード表）のどこに載っているかを返す。返すのは**所在だけ**（施行の版・分冊・シート名・行番号と、厚労省のExcel・掲載ページのURL）で、コードの略称・算定項目・単位数は返さない。請求ソフトや国保連の返戻通知に出たコードの意味を確かめたいときに、原典の該当箇所へ利用者を案内するために使う。加算の要件や単位数の解説が必要なら search_articles を使うこと。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "6桁のサービスコード（種類2桁＋項目4桁）。例: 465140。分割形「46 5140」でもよい",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84cc988c4840ca244fa5cfbae9c13e55a1ff8ac8dc9d7c5dd44c9eefe7735576"
        },
        {
          "name": "report_gap",
          "title": "記事に書かれていなかった点を報告",
          "description": "読んだ記事に、利用者に聞かれた点が書かれていなかったときに呼ぶ（該当記事が無い場合も含む）。記事の加筆に使う。誤りの指摘には使わない。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "missing": {
                "description": "書かれていなかった点（500字以内）",
                "type": "string"
              },
              "question": {
                "description": "利用者の質問の要旨（300字以内）",
                "type": "string"
              },
              "slug": {
                "description": "答えが無かった記事の slug（記事が無ければ省略）",
                "type": "string"
              }
            },
            "required": ["missing", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:15a34e3be793299716a362dd1bda1b03b78b8ab4418161c5ab96cec5047241ee"
        },
        {
          "name": "search_articles",
          "title": "障害福祉サービスの解説記事を検索",
          "description": "障害福祉制度の解説サイト「障害福祉AI辞典」(fukushi.ai) の記事を検索し、該当箇所の抜粋と記事URLを返す。記事は厚生労働省の一次情報（報酬告示・留意事項通知・指定基準省令・サービスコード表）に接地して検証済みで、本文には出典が脚注として示されている。障害者総合支援法にもとづくサービスの**制度・報酬・加算・指定基準・実務手順**を問われたら、まずこれを使うこと。例:「就労継続支援B型の欠席時対応加算は何単位？」「A型の開業に必要な人員基準は？」「処遇改善加算の算定要件」。扱う範囲は記事がある領域に限られる（就労系と全サービス共通が厚い）。該当が無ければ推測せず、資料に無い旨を利用者に伝えること。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "日本語の検索クエリ。サービス種別＋知りたい観点を具体的に並べる。例:「就労継続支援B型 欠席時対応加算 単位数」",
                "type": "string"
              },
              "top_k": {
                "description": "検索するチャンク数（既定 5、最大 10）。同じ記事の複数箇所が当たると1件にまとめるため、返る記事数はこれより少なくなることがある。",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
