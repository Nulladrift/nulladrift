      },
      "instructions": "b612 は「AI開発レビューの観点＋思考の型＋過去の失敗知」を提供する。このサーバーに繋いだら、コーディング作業の全体でこの規律に従うこと。\n\n【推測で動かない(最優先)】実装・修正の前に自問する：①現物の根拠はあるか(ログ・実測・エラー) ②本質は何か(表面の症状でなく構造) ③これで確定か。根拠が無ければ止めて確認する。「たぶん」で実装しない。\n\n【見た目で「直った」と言わない】実際に動かし、連動先・状態遷移まで確認してから完了と言う。UIの成功表示やビルド成功を、動作の証拠にしない。1か所直したら影響範囲(他の状態・他のボタン・最小化/復元/ドラッグ等)も確認する。\n\n【毎タスクの手順(コードは送らない)】(1) 着手前に必ず b612_patterns を「案件のキーワード」で引き、関連する過去の失敗を読んでから始める。(2) b612_domain_preset と b612_review_checklist で必須項目・エッジケース・法令・観点を受け取る(渡すのは業種名など短い文字列のみ)。(3) 受け取った観点を手元のコードに自分で当てて確認する。(4) 完了と言う前に b612_review_checklist と3問自問で再点検する。(5) 機械的なコード検査は b612_rules の規則を手元で当てる。\n\n※このサーバーにコード本文を送る口は無い＝顧客コードは提供者に渡らない。深い知識は上記ツールで都度取得すること。",
      "tools": [
        {
          "name": "b612_design",
          "title": "HP/LP のデザイン規約を引く",
          "description": "ホームページ・LP・UI・チラシを作る前に必ず引く。生成AIが出しがちで顧客に「AIくさい」と言われる形（注記の左に色の縦棒・器と同じ色の面・均一な3列カード・全部同じ角丸と影）の禁止事項と、カードは角張らせる・並びの間隔は親のgapで持つ・複雑なSVGは無料素材を使う、などの必須事項を返す。あわせて、放っておくと生成AIが出さない6つ（斜めの帯・斜めの文字・派手なCTA・追従CTA・写真の上の文字・飾りの浮遊）と、そのまま貼れるCSS/JSの一覧を返す。snippet に名前を渡すとその実装を全文返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "snippet": {
                "description": "実装が欲しいときにファイル名（例 cta-shine.css / sticky-cta.js）。省略すると規約と一覧を返す",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1872da510461003deb2bf1771bd23713009a52e29c4c16471cbf1cfc4ac9aa47"
        },
        {
          "name": "b612_domain_preset",
          "title": "b612 ドメインプリセット",
          "description": "業種/ドメイン別の必須モデル・エッジケース・必須法令・アンチパターンを返す。対応ドメイン: accounting, ai-chat, ai-content-ops, android, beauty, blog, booking, chat, community, corporate, corporate-story, crm, ec, event, fukushi, game, healthcare, hr, instagram, inventory, ios, line, llmo, lms, lp, pos, project, rag, realestate, restaurant, retrogame, saas, seo, subscription, survey, task",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "業種/ドメイン名（例: ec, booking, healthcare, saas）。対応: accounting, ai-chat, ai-content-ops, android, beauty, blog, booking, chat, community, corporate, corporate-story, crm, ec, event, fukushi, game, healthcare, hr, instagram, inventory, ios, line, llmo, lms, lp, pos, project, rag, realestate, restaurant, retrogame, saas, seo, subscription, survey, task",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df268c3d11fe2da44af36c6d3421481ef114d7b815fe19a6e773387165530a13"
        },
        {
          "name": "b612_grow",
          "title": "SNS/note/AEOで売る型を引く（Grow層）",
          "description": "作った HP/LP/商品/コンテンツを、SNS（X / Instagram / Threads）・note・AI検索（AEO）で広めて売るための戦略の作り方を返す。「集客したい」「SNS戦略」「売り方」「AEO」「AIの回答に出したい」「note を読まれたい」等で使う。7つの汎用原則＋チャネル別の型＋AEOの型に加え、生成AIが出しがちな戦略が抜かす『日本の法令ガード（ステマ規制・景表法・薬機法・特商法）』と『計測の実装（UTM・4指標）』を必ず含む。product に何を・誰に・いくらで売るか、goal に目標、channel に重点媒体を渡すと、その条件に当てて返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "channel": {
                "description": "重点チャネル（x / instagram / threads / note / aeo / all）。省略可",
                "type": "string"
              },
              "goal": {
                "description": "目標（認知拡大 / リスト獲得 / 販売 など）",
                "type": "string"
              },
              "product": {
                "description": "何を・誰に・いくらで売るか（例: 980円の哲学エッセイ、決断できない人向け）",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6e0ed336ae0eebee210e194c17c89e5529b21399045d5d70899ab9754ba1b49"
        },
        {
          "name": "b612_notes",
          "title": "公式LINEに送ったメモを読む",
          "description": "利用者が hakuto の公式LINE に送ったメモを読み込む。「今日のメモをまとめて」「昨日のメモ見せて」「今週のアイデア整理して」などと言われたらこれを使う。days で遡る日数を指定する（既定は1＝今日ぶん）。返ってくるのは日付ごとに並べた生のメモ。要約・分類・タスク化は、この結果を読んで自分で行うこと。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "何日ぶん遡るか。今日だけなら 1、今週なら 7。既定は 1",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3ed9f9393a97bb80ca672f92767eff14a2fe0657414d1ae38a9182317d1a3cb"
        },
        {
          "name": "b612_patterns",
          "title": "b612 実戦patterns",
          "description": "b612 の実戦ノウハウ（典型エラー・推測実装の傾向・過去に効いた意思決定）を返す。案件固有名は含まない公開版。全文は約88,000字あるため、既定は見出し索引のみを返す。query に検索語を渡すと一致した節だけを返す（推奨）。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "full": {
                "description": "true で全文（max_chars の上限まで）。既定 false",
                "type": "boolean"
              },
              "max_chars": {
                "description": "出力の上限文字数（既定 20000）。超過分は落とした節名を明記する",
                "type": "number"
              },
              "query": {
                "description": "検索語（例: LINE, 決済, 予約, レスポンシブ）。未指定なら見出し索引",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8477093d7cc1c1b4b31a60ff1f3236204ad3b72d5025e2e3dc60dcfdf28c15f9"
        },
        {
          "name": "b612_principles",
          "title": "b612 の思考原則",
          "description": "b612 メソッドの思考の核（NO SPECULATION・実装前の3問自問・5原則・握りつぶし禁止）を返す。レビューや実装を始める前に読み、原則に沿って進めること。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
