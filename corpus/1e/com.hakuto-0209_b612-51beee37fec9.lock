          "digest": "sha256:372871075dd80e150affd3efc347644bf4263f4edee9ef4a4599e5f957f44189"
        },
        {
          "name": "b612_reference",
          "title": "実在サイトの参考を引く（Honmono）",
          "description": "HP・LP・UI を作る前に、実在の公開サイトを参考として引く。業種や雰囲気（例:「カフェのLP」「士業のコーポレート」「買取サービス」）を渡すと、日本で実際に公開されている LP/HP を数件、URL と実測した配色（＋分かればフォント）で返す。生成AIが出しがちな『それっぽいだけ』のデザインを、実在サイトの型に寄せるために使う。さらに、その業種で使える無料画像（ボーの素材やさん）の直リンクを最大60点まとめて返す。画像が要る HP/LP/UI 制作では必ずこれを呼び、返ってきた画像を各セクションに置くこと。業種を省くと、収録している業種の一覧を返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "count": {
                "description": "返す件数（既定5・最大10）",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "industry_or_vibe": {
                "description": "業種か雰囲気（例: カフェのLP / 士業のコーポレート / 買取 / BtoB SaaS）。省略すると収録業種の一覧を返す",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25f1237dc1f6d90a19bae2500a62c609c5ffc6d72b39fbbfdec53a8dbe6ef818"
        },
        {
          "name": "b612_review_checklist",
          "title": "b612 レビュー観点（対象別）",
          "description": "対象の種類に応じた b612 のレビュー観点を返す。返ってきた観点を使って呼び出し側の AI が実レビューを行う。対応: lp, hp, ec, api, saas, game, form, generic",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "target_type": {
                "description": "レビュー対象の種類。次のいずれか: lp, hp, ec, api, saas, game, form, generic（不明なら generic）",
                "type": "string"
              }
            },
            "required": ["target_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b13e8eb4ac0b986566147667ba3eeea94352673f0ae63f394f2904c15faadb3a"
        },
        {
          "name": "b612_rules",
          "title": "b612 検出ルール一覧",
          "description": "コードに当てる検出ルール（ID・重大度・なぜ危険か・直し方）の一覧を返す。**呼び出し側の AI がこのルールを手元のコードに当てて検査する**（コードは b612 サーバーに送らない）。握りつぶし / 秘密の直書き / 0行更新の見逃し / タイマー多重起動 / 印刷崩れ / 破壊的SQL / XSS 等。ルールID: swallow-empty-catch, swallow-catch-comment-only, swallow-nullish-default, swallow-nullish-any, supabase-update-without-select, hardcoded-secret, console-log-secret, raf-loop-not-idempotent, setinterval-no-clear, top-level-sdk-client, next-force-dynamic, print-transform-scale, global-element-selector, img-no-dimensions, destructive-sql, bulk-update-no-where, dangerous-html, eval-use, mcp-stdout-log, line-postback-encode, dark-body-light-surface, print-white-text, last-child-visual, aspect-ratio-with-object-position, tap-target-too-small, leftover-min-height, overflow-hidden-full-height, empty-element-no-fallback, fail-open-secret-check, charge-before-persist, fetch-result-ignored",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e194165e585a554f117d85ae88bef21eefbe3eb808f4940d55b53ce1b18174a3"
        },
        {
          "name": "b612_update",
          "title": "b612 をアップデートする（資産を最新にする）",
          "description": "b612 のアップデート。エージェント・法令ファイル・業種プリセット・雛形・参照ドキュメントを最新に更新する手順を返す。「b612 をアップデートして」「b612 を最新にして」と言われたらこれを使う。返すのは利用者本人が自分で実行する更新手順で、実行すると手元と違うファイルだけが置き換わる（既存は .bak を残す）。新しい専門エージェントが増えたときや、法令が改正されたときに実行する。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
