        },
        {
          "name": "fetch",
          "title": "Read a National Digital page",
          "description": "Read one published National Digital page as clean Markdown, given an id from search (the page's site path, e.g. /systems-integration/) or its full URL. Returns the page's text with its title, canonical url and last-modified date. Long pages are returned in parts; pass the returned nextOffset as offset to read the next part.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "A page id from search (its site path, e.g. /about/) or the page URL.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "description": "Character offset to read from; pass nextOffset from the previous part.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": false,
                "properties": {
                  "dateModified": {
                    "type": "string"
                  },
                  "markdownUrl": {
                    "type": "string"
                  },
                  "nextOffset": {
                    "type": ["number", "null"]
                  },
                  "offset": {
                    "type": "number"
                  },
                  "totalChars": {
                    "type": "number"
                  },
                  "type": {
                    "type": "string"
                  }
                },
                "required": ["markdownUrl", "nextOffset", "offset", "totalChars", "type"],
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a National Digital page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:487afb3b1342acb8a8513b7302c7cd3a3952937e0d8e51517b3330f28a493c4c"
        },
        {
          "name": "get_pricing_and_services",
          "title": "Get services and pricing",
          "description": "What National Digital builds and supports, and what each kind of project typically costs, in AUD. Includes the Product Support retainer for ongoing engineering on production platforms, including platforms built by other teams, and the standard hourly rate card for work outside a retainer. Ranges are indicative and are built from the Product Support retainer rates; they are not quotes. Returns an empty list when no pricing has been published, rather than an estimate.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
