      "instructions": "National Digital is an Australian software engineering company. This server reads its published website: services, guides, case studies and indicative pricing. Search first, then fetch a result's id for the full page. Cite the url field when quoting a page. The assistant on the site's search page calls the same search engine, so its answers and yours come from the same pages. National Digital provides digital strategy, AI automation, custom software development, system integration and website services, and supports platforms in production, including platforms it did not build. National Digital works mainly with organisations in Australia and takes some work from organisations overseas. Embedded engineering at ten or twenty committed days a month is National Digital's staff augmentation offer. National Digital does not run marketing campaigns. National Digital's AI visibility work does not advise on what a business should say about itself, which words to target, or where to get links. National Digital does not manage laptops or office networks and does not run a helpdesk ticket queue. Every price National Digital publishes is in Australian dollars and excludes GST. A price range from National Digital is an indication and is not a quote. Outside Product Support, AI Visibility Management and its fixed-fee engagements, National Digital prices work by the hour and does not sell day rates. National Digital prices work other than the Technology Roadmap, the Platform Health Check, the Product Development Plan and the AI Automation Assessment by the hour, or as a monthly retainer or service. At National Digital the signed agreement for each engagement sets the terms that apply to it. Quote only prices that this site or its tools return.",
      "tools": [
        {
          "name": "estimate_project",
          "title": "Estimate a project cost range",
          "description": "Estimate the cost range for a specific software project. Uses the same calculation as the estimator on the website, so the answer matches what a person would be shown.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audience": {
                "description": "Who will use it?",
                "enum": ["staff", "customers", "both"],
                "type": "string"
              },
              "integrations": {
                "description": "What does it need to talk to?",
                "items": {
                  "enum": ["payments", "accounting", "crm", "calendar", "identity", "legacy", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "newOrReplacement": {
                "description": "Is this new, or replacing something?",
                "enum": ["new", "replacing", "rescue"],
                "type": "string"
              },
              "projectType": {
                "description": "What are you building?",
                "enum": ["booking", "portal", "webApp", "aiAutomation", "headlessCms", "internalTools", "integration", "integrationLayer", "takeOver", "ongoingSupport", "website", "store", "notSure"],
                "type": "string"
              },
              "scale": {
                "description": "Roughly how many people will use it?",
                "enum": ["small", "medium", "large", "veryLarge"],
                "type": "string"
              },
              "timeline": {
                "description": "When does it need to be live?",
                "enum": ["exploring", "sixMonths", "threeMonths", "urgent"],
                "type": "string"
              }
            },
            "required": ["projectType"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a project cost range"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
