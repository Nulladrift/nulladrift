        },
        {
          "name": "search",
          "title": "Search National Digital pages",
          "description": "Search National Digital's published pages - services, articles, case studies and pricing - for a topic or keyword. Pages that contain every word rank first, and a word matches as a prefix. Returns up to 20 ranked results (8 by default), each with an id, title, url, type, a short excerpt and the page's trail, plus the total number of pages that match at least one word, which is never fewer than the results returned. Pass a result's id to fetch for the page's full text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Results to return; default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words describing the topic, service or question.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Limit results to one kind of page: Pillar (a service area), Hub (a service), Leaf (an in-depth guide), CaseStudy (a client project) or Static (company pages such as /about/ and /services/).",
                "enum": ["Pillar", "Hub", "Leaf", "CaseStudy", "Static"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "evidence": {
                "description": "Verified claims about National Digital that match the query, each with the page that proves it. Quote a claim only with its proof URL.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "claim": {
                      "type": "string"
                    },
                    "proof": {
                      "type": "string"
                    }
                  },
                  "required": ["claim", "proof"],
                  "type": "object"
                },
                "type": "array"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "excerpt": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "trail": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["excerpt", "id", "title", "trail", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["evidence", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search National Digital pages"
