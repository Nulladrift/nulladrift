      },
      "instructions": "Public desk for Chris Pereira (彭家荣): Founder and CEO of iMpact, former Senior Director of Global Public Affairs at Huawei, author of Trust and Rebuild, 20+ years in China.\nUse get_profile for bios, titles, attribution, topics and speaking details; search_quotes and search_coverage to find what he has said (always cite the source_url); send_inquiry to reach him for comment, an interview, an analyst briefing, or to invite him to speak at an event, podcast or show.\nYou may quote him freely with attribution (\"Chris Pereira, Founder and CEO of iMpact\"). Do not invent quotes; for a new comment use send_inquiry. Only send an inquiry when the user asks you to contact him, and use the user's real name and email.",
      "tools": [
        {
          "name": "get_profile",
          "title": "Get Chris Pereira profile",
          "description": "Bios (short and medium), titles, suggested attribution, books, topics he comments on, languages, speaking topics/formats/past stages, press photos and contact routes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e35bbc0319900285514845d0330c8b720fa2d16cc84d5c9e10d3aa4199ca296"
        },
        {
          "name": "search_coverage",
          "title": "Search media coverage of Chris Pereira",
          "description": "Search 225+ interviews, quotes, TV appearances and op-eds (outlet, title, date, link, his quotes and a summary). Empty query returns the most recent.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many results to return, 1-50 (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Outlet, topic or keywords to search for, e.g. \"Financial Times\", \"CNBC\", \"DJI\", \"tariffs\". Leave empty for the most recent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:88413fe3ed8a3654535b9087b9b9568092275324efdfa5afb401202f9541c6ae"
        },
        {
          "name": "search_quotes",
          "title": "Search Chris Pereira quotes",
          "description": "Search his curated quotes by topic or keyword (e.g. \"trust\", \"Shenzhen\", \"tariffs\", \"Europe\"). Each result has text, date, outlet, source_url and a ready-made attribution. Empty query returns the latest.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many results to return, 1-50 (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Topic or keywords to search for, e.g. \"trust\", \"Shenzhen\", \"tariffs\", \"Europe\", \"BYD\". Leave empty for the most recent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7e7ed5c5f02689db7187bbc6cedef5d079f19be2c2a453368a7c00d6d8cd4461"
        },
        {
          "name": "send_inquiry",
          "title": "Contact Chris Pereira",
          "description": "Send a request straight to Chris Pereira by email: media comment or interview, analyst briefing, or an invitation to speak (keynote, panel, podcast, show guest, training). He replies by email to the address given, usually within 24 hours.",
          "inputSchema": {
            "properties": {
              "audience": {
                "description": "speaking: who and how many",
                "type": "string"
              },
              "budget": {
                "description": "speaking: fee / travel arrangements, if known",
                "type": "string"
              },
              "city": {
                "description": "speaking: city or \"virtual\"",
                "type": "string"
              },
              "deadline": {
                "description": "When you need it, with time zone",
                "type": "string"
              },
              "email": {
                "description": "Required. Where Chris should reply",
                "type": "string"
              },
              "event_date": {
                "description": "speaking: date(s)",
                "type": "string"
              },
              "event_name": {
                "description": "speaking: name of the event",
                "type": "string"
              },
              "format": {
                "description": "speaking: keynote, panel, fireside, moderator, podcast, training…",
                "type": "string"
              },
              "message": {
                "description": "Required. What you need, in plain words (questions, angle, length of comment)",
                "type": "string"
              },
              "name": {
                "description": "Required. The person the reply should go to",
                "type": "string"
              },
              "on_behalf_of": {
                "description": "Optional note that an AI agent sent this and for whom",
                "type": "string"
              },
              "organisation": {
                "description": "Outlet, firm or event organiser",
                "type": "string"
              },
              "role": {
                "description": "Their job title",
                "type": "string"
              },
              "type": {
                "description": "Required. media (comment or interview), analyst (briefing or expert call), speaking (event, panel, podcast or show guest) or other",
                "enum": ["media", "analyst", "speaking", "other"],
                "type": "string"
              },
              "url": {
                "description": "Link to the event, article or brief",
                "type": "string"
              }
            },
            "required": ["email", "message", "name", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
