{
  "lockfileVersion": 2,
  "subjects": {
    "com.graggrobotics/agent-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gragg-agent-tools.fly.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gragg-agent-tools",
        "version": "1.30.0",
        "websiteUrl": "https://graggrobotics.com/agent-bazaar"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hosted media tools for AI agents, run by Gragg Robotics (graggrobotics.com). No account or API key. Pass public http(s) URLs to video/audio files; every tool returns an output_url you can hand to your user or pass straight into another tool (chaining is free, no re-download). Free tier limits: inputs up to 250 MB and 15 min, 40 calls/hour per client, outputs deleted after 24 hours. Only process media you have the right to use.",
      "tools": [
        {
          "name": "hire_for_task",
          "description": "Hire Gragg Robotics (a small US AI-automation company: an AI agent team plus its founder) to do a one-off\n    job you or your user need done. Fixed prices:\n      size=\"small\"  $99  (1-2 business days): a script, spreadsheet, data cleanup/conversion, research brief,\n                         video edit package, one-page site.\n      size=\"medium\" $349 (3-5 business days): custom tool or API integration, scraper, report, small web app,\n                         or a new hosted tool built for you.\n      size=\"sprint\" $750 (3-5 business days): one business automation deployed on the user's own accounts.\n    Without contact_email you just get the quote. With contact_email (your user's, with their OK) the job is\n    booked: a payment link is emailed, work starts once it is paid, full refund if we cannot deliver.",
          "inputSchema": {
            "properties": {
              "contact_email": {
                "default": "",
                "title": "Contact Email",
                "type": "string"
              },
              "contact_name": {
                "default": "",
                "title": "Contact Name",
                "type": "string"
              },
              "deadline": {
                "default": "",
                "title": "Deadline",
                "type": "string"
              },
              "deliverable": {
                "default": "",
                "title": "Deliverable",
                "type": "string"
              },
              "size": {
                "default": "small",
                "title": "Size",
                "type": "string"
              },
              "task": {
                "title": "Task",
                "type": "string"
              }
            },
            "required": ["task"],
            "title": "hire_for_taskArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eed28863478994764b0984a99ddc985b85ad444fd5ad1d32bb7b2a67ca70611e"
        },
        {
          "name": "request_tool",
          "description": "Ask for a hosted tool that does not exist here yet (anything from email to video/audio/document work).\n    Say what it should do, give an example input, what you would pay per use, and how often you would use it.\n    We build tools that have paying demand; with a contact_email we confirm the price before building and\n    tell you when it is live.",
          "inputSchema": {
            "properties": {
              "contact_email": {
                "default": "",
                "title": "Contact Email",
                "type": "string"
              },
              "example_input": {
                "default": "",
                "title": "Example Input",
                "type": "string"
              },
              "price_per_use_usd": {
                "default": 0,
                "title": "Price Per Use Usd",
                "type": "number"
              },
              "tool_description": {
                "title": "Tool Description",
                "type": "string"
              },
              "uses_per_month": {
                "default": 0,
                "title": "Uses Per Month",
                "type": "integer"
              }
            },
            "required": ["tool_description"],
            "title": "request_toolArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ddde442c0175eadb3cb6375965cc095345b99daccab55377968654e41b93c5f"
        },
        {
          "name": "video_add_audio",
          "description": "Put a soundtrack on a video. mode = \"replace\" (new audio only) or \"mix\" (blend with the original).\n    The audio is cut to the video's length. audio_volume 0.0-2.0 scales the added track.",
          "inputSchema": {
            "properties": {
              "audio_url": {
                "title": "Audio Url",
                "type": "string"
              },
              "audio_volume": {
                "default": 1,
                "title": "Audio Volume",
                "type": "number"
              },
              "mode": {
                "default": "replace",
                "title": "Mode",
                "type": "string"
              },
              "video_url": {
                "title": "Video Url",
                "type": "string"
              }
            },
            "required": ["audio_url", "video_url"],
            "title": "video_add_audioArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57a9e625b51d521f5b828f664e608f3b9e94b80a33a8e07aaa53132be2c0cf64"
        },
        {
          "name": "video_caption",
          "description": "Burn a text caption/title into a video (white text on a translucent dark box).\n    position = \"top\", \"center\" or \"bottom\". font_size 0 = auto (about 1/18 of the frame height).\n    start_s/end_s (optional) limit when the text shows; default is the whole video. Up to 300 characters;\n    use \\n for line breaks.",
          "inputSchema": {
            "properties": {
              "end_s": {
                "default": -1,
                "title": "End S",
                "type": "number"
              },
              "font_size": {
                "default": 0,
                "title": "Font Size",
                "type": "integer"
              },
              "position": {
                "default": "bottom",
                "title": "Position",
                "type": "string"
              },
              "start_s": {
                "default": -1,
                "title": "Start S",
                "type": "number"
              },
              "text": {
                "title": "Text",
                "type": "string"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["text", "url"],
            "title": "video_captionArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b9ea18ca9e6cdde3fb97ee663307f60598616166e0029dd180211bcd89dd297"
        },
        {
          "name": "video_concat",
          "description": "Join 2-10 videos end to end into one MP4. Clips are scaled/letterboxed to one size: the first clip's\n    size unless width/height are given. Clips without audio get silence so the result always has a track.",
          "inputSchema": {
            "properties": {
              "height": {
                "default": 0,
                "title": "Height",
                "type": "integer"
              },
              "urls": {
                "items": {
                  "type": "string"
                },
                "title": "Urls",
                "type": "array"
              },
              "width": {
                "default": 0,
                "title": "Width",
                "type": "integer"
              }
            },
            "required": ["urls"],
            "title": "video_concatArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d62f3ad369ad35df305a88bec0299eb49b65876e85f6473336fa6b1e690d5592"
        },
        {
          "name": "video_convert",
          "description": "Convert media to another format. format = \"mp4\", \"webm\", \"gif\" (first 30 s, 480 px wide),\n    \"mp3\", \"m4a\" or \"wav\" (the audio formats extract the soundtrack).",
          "inputSchema": {
            "properties": {
              "format": {
                "title": "Format",
                "type": "string"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["format", "url"],
            "title": "video_convertArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0ae3ce2dd5a53f8e84c0efe2700bf9ad9ad223f6b1a1a7b9f0f1438ecf67a540"
        },
        {
          "name": "video_extract_frames",
          "description": "Grab still frames as PNG images. Either times_s = [seconds, ...] (up to 20) or count = N evenly\n    spaced frames (1-20). Returns a list of image URLs, useful for thumbnails or for looking at a video.",
          "inputSchema": {
            "properties": {
              "count": {
                "default": 0,
                "title": "Count",
                "type": "integer"
              },
              "times_s": {
                "anyOf": [
                  {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Times S"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "video_extract_framesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3c115c5b74dc692f00f3db53964538270d5b0283abf5ce706cf4ce2cef77344"
        },
        {
          "name": "video_info",
          "description": "Inspect a video or audio file: duration, resolution, frame rate, codecs, and whether it has audio.\n    url: public http(s) URL of the file (or an output_url from another tool here).",
          "inputSchema": {
            "properties": {
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "video_infoArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fd5f9539a7b0e1eab03c6e4f02776da0b740ed6c30dc0395f149f30ea8e9e06"
        },
        {
          "name": "video_resize",
          "description": "Resize or reframe a video. Either aspect = \"9:16\" (Shorts/Reels/TikTok), \"16:9\", \"1:1\", \"4:5\", \"4:3\",\n    or an explicit width and height. mode = \"crop\" (fill the frame, trim edges) or \"pad\" (fit inside, black bars).",
          "inputSchema": {
            "properties": {
              "aspect": {
                "default": "",
                "title": "Aspect",
                "type": "string"
              },
              "height": {
                "default": 0,
                "title": "Height",
                "type": "integer"
              },
              "mode": {
                "default": "crop",
                "title": "Mode",
                "type": "string"
              },
              "url": {
                "title": "Url",
                "type": "string"
              },
              "width": {
                "default": 0,
                "title": "Width",
                "type": "integer"
              }
            },
            "required": ["url"],
            "title": "video_resizeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8cfb7aeb2393054703719852daced901a356eea6db2efbb26e69a22eaf5ea0d"
        },
        {
          "name": "video_speed",
          "description": "Speed a video up or slow it down. factor 2.0 = twice as fast, 0.5 = half speed (0.25-4.0).\n    Audio pitch is preserved.",
          "inputSchema": {
            "properties": {
              "factor": {
                "title": "Factor",
                "type": "number"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["factor", "url"],
            "title": "video_speedArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0e95c7bec481fd0b3b140f29b9743239b45c7b626c6005b244aea55bb7ecd9c"
        },
        {
          "name": "video_trim",
          "description": "Cut a clip out of a video (frame-accurate). start_s / end_s are seconds from the beginning.\n    Returns an MP4 (H.264/AAC) output_url.",
          "inputSchema": {
            "properties": {
              "end_s": {
                "title": "End S",
                "type": "number"
              },
              "start_s": {
                "title": "Start S",
                "type": "number"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["end_s", "start_s", "url"],
            "title": "video_trimArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:482a82636f51d197b40dd1ce78b5508a5dea07a99ac216c204bb86d16f967d4b"
        }
      ],
      "digest": "sha256:d990d8047d1bd186ac4e422e1d2a3ee855a75c98174e78e149b7a45b1316342b"
    }
  }
}
