          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "swiftsign_check_status",
          "description": "Check the status of an envelope — who signed, who hasn't, download links. Works in both sandbox (sk_test_ keys) and live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "envelopeId": {
                "description": "The envelope ID to check",
                "type": "string"
              }
            },
            "required": ["envelopeId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b80cfd7ca3662f62459244922dc6111a0d5e40043b3800dbb85ad0b5ca2986a0"
        },
        {
          "name": "swiftsign_confirm_send",
          "description": "Dispatch a DRAFT envelope — use after a human has reviewed an envelope that swiftsign_send_envelope or swiftsign_send_from_template returned as draft_pending_confirmation. This emails the signers. Does NOT work on envelopes already SENT/COMPLETED/VOIDED.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "envelopeId": {
                "description": "The DRAFT envelope ID to dispatch",
                "type": "string"
              }
            },
            "required": ["envelopeId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:db58a69b7e5cf69ecf9ebc6ea592aeef259840e777090bc29e304e8b588295c9"
        },
        {
          "name": "swiftsign_create_embedded_url",
          "description": "Mint a short-lived embedded signing URL for a recipient (30-minute expiry). Returns a url to embed plus its expiresAt. The envelope must already be SENT. Works in both sandbox (sk_test_ keys) and live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "envelopeId": {
                "description": "The envelope ID",
                "type": "string"
              },
              "recipientId": {
                "description": "The recipient ID within that envelope",
                "type": "string"
              },
              "returnUrl": {
                "description": "URL to redirect the signer to after they finish",
                "type": "string"
              }
            },
            "required": ["envelopeId", "recipientId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:27c2f9f46aaa06bd43dc5d81484a35e6d2ab32a699e541f537c6bbefe0894107"
        },
        {
          "name": "swiftsign_download_signed_pdf",
          "description": "Download the completed, sealed PDF (or its Certificate of Completion) for an envelope. Only works once status is COMPLETED — run swiftsign_check_status first. Does NOT work on DRAFT or SENT envelopes; nothing has been signed yet on those.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "certificate": {
                "description": "If true, download the Certificate of Completion (audit trail) instead of the signed document",
                "type": "boolean"
              },
              "document": {
                "description": "Which document to download when an envelope has several (0-based, default 0)",
                "type": "number"
              },
              "envelopeId": {
                "description": "The envelope ID (must be COMPLETED)",
                "type": "string"
              },
              "outputPath": {
                "description": "Where to save the file (default: ./swiftsign-<id>.pdf). Ignored on the hosted endpoint, which returns base64.",
                "type": "string"
              }
            },
            "required": ["envelopeId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2eee40dfefdb3ca613c7304d76172d120c6e521c1f85db92d039dbf1fa55c6a6"
        },
        {
          "name": "swiftsign_list_envelopes",
          "description": "List envelopes (sent documents) with their status. Scoped to your key's mode — sandbox (sk_test_) keys see test envelopes, live keys see live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:83776078248a4d7cf7facf771e844dc8e395b4aa8113ed793b0b0198946074c6"
        },
        {
          "name": "swiftsign_list_templates",
          "description": "List your saved templates. Scoped to your key's mode — sandbox (sk_test_) keys see test templates, live keys see live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:30d2ad9237daf302e133669256d52137ee6d74d842c62933f3cc4b8402909d1e"
        },
        {
          "name": "swiftsign_send_envelope",
          "description": "Send a document for e-signature. Accepts PDF as base64, recipients, and field placement. Sandbox keys (sk_test_) send immediately (watermarked test mail). LIVE keys create a DRAFT and return it for human review unless confirm: true — nothing is emailed until confirmed. Field placement: page+x+y (percent, top-left origin) OR an anchor string, not both. After everyone signs, retrieve the sealed PDF with swiftsign_download_signed_pdf.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "description": "Set true to dispatch immediately on a LIVE key (sk_live_/sk_oat_). Without it, live envelopes are created as DRAFT and returned for human review before anything is emailed. Test keys (sk_test_) always send immediately (sandbox, watermarked).",
                "type": "boolean"
              },
              "documents": {
                "description": "PDF documents to send",
                "items": {
                  "properties": {
                    "base64": {
                      "description": "Base64-encoded PDF content",
                      "type": "string"
                    },
                    "name": {
                      "description": "Document filename (e.g. 'contract.pdf')",
                      "type": "string"
                    }
                  },
                  "required": ["base64", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "fields": {
                "description": "Signing fields to place on documents",
                "items": {
                  "properties": {
                    "anchor": {
                      "description": "Anchor text to search in the PDF. Use anchor OR page+x+y, not both.",
                      "type": "string"
                    },
                    "document": {
                      "default": 0,
                      "description": "Document index (0-based)",
                      "type": "number"
                    },
                    "height": {
                      "description": "Field height (percent)",
                      "type": "number"
                    },
                    "options": {
                      "description": "Choices for RADIO / DROPDOWN fields",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "page": {
                      "description": "Page number (1-based). Ignored when anchor resolves.",
                      "type": "number"
                    },
                    "recipientIndex": {
                      "description": "Index into recipients array (0-based)",
                      "type": "number"
                    },
                    "type": {
                      "description": "Field type",
                      "enum": ["SIGNATURE", "NAME", "DATE", "TEXT", "INITIALS", "CHECKBOX", "RADIO", "DROPDOWN", "ATTACHMENT"],
                      "type": "string"
                    },
                    "width": {
                      "description": "Field width (percent)",
                      "type": "number"
                    },
                    "x": {
                      "description": "X position, percent 0-100 of page width, top-left origin",
                      "type": "number"
                    },
                    "y": {
                      "description": "Y position, percent 0-100 of page height, top-left origin",
                      "type": "number"
                    },
                    "yOffset": {
                      "description": "Y offset from anchor (percent)",
                      "type": "number"
                    }
                  },
                  "required": ["page", "recipientIndex", "type", "x", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "description": "Optional message to include",
                "type": "string"
              },
              "recipients": {
                "description": "People who need to sign or receive a copy",
                "items": {
                  "properties": {
                    "email": {
                      "description": "Recipient email address",
                      "type": "string"
                    },
                    "name": {
                      "description": "Recipient full name",
                      "type": "string"
                    },
                    "role": {
                      "default": "SIGNER",
                      "enum": ["SIGNER", "CC"],
                      "type": "string"
                    },
                    "routingOrder": {
                      "default": 1,
                      "description": "Signing order (1 = first)",
                      "type": "number"
                    }
                  },
                  "required": ["email", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "subject": {
                "description": "Email subject / document title",
                "type": "string"
              }
            },
            "required": ["documents", "fields", "recipients", "subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0846db180d3b32226ae17e93173619cd89685edd60c7f4ff6cf554d86a7b1f17"
        },
        {
          "name": "swiftsign_send_from_template",
          "description": "Send an envelope from a saved template by assigning signers to roles. Sandbox keys (sk_test_) send immediately; LIVE keys create a DRAFT for human review unless confirm: true — nothing is emailed until confirmed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "description": "Set true to dispatch immediately on a LIVE key (sk_live_/sk_oat_). Without it, live envelopes are created as DRAFT and returned for human review before anything is emailed. Test keys (sk_test_) always send immediately (sandbox, watermarked).",
                "type": "boolean"
              },
              "message": {
                "description": "Optional message to include",
                "type": "string"
              },
              "roleAssignments": {
                "additionalProperties": {
                  "properties": {
                    "email": {
                      "description": "Signer email address",
                      "type": "string"
                    },
                    "name": {
                      "description": "Signer full name",
                      "type": "string"
                    }
                  },
                  "required": ["email", "name"],
                  "type": "object"
                },
                "description": "Map of template role name → signer { name, email }",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "subject": {
                "description": "Email subject / document title",
                "type": "string"
              },
              "templateId": {
                "description": "The template ID to send from",
                "type": "string"
              }
            },
            "required": ["roleAssignments", "templateId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:665c0d100ee907d9006ab336c36a5052c9864da5d3e5c6a9ac06badbce18cd89"
        },
        {
          "name": "swiftsign_upgrade",
          "description": "Initiate the upgrade to PRO ($15/mo flat). Returns a Stripe checkout_url that a human opens once to add a card — agents cannot complete the payment themselves. Moves the account from sandbox (sk_test_) to live sends. Returns status 'updated' if already on the plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "plan": {
                "const": "PRO",
                "description": "Plan to upgrade to (default PRO)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:83d4b9be9aa3e7b97dac5bc4e9f8c90ac8aa6376ed4b13250554cf6265729a6d"
        },
        {
          "name": "swiftsign_void_envelope",
          "description": "Cancel/void an envelope that hasn't been completed yet. Signers can no longer sign a voided envelope. Works in both sandbox (sk_test_ keys) and live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "envelopeId": {
                "description": "The envelope ID to void",
                "type": "string"
              }
            },
            "required": ["envelopeId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:99313043919ebdeb669855954cc087e32b1d6c014b36eb7730667be487035d81"
        }
      ],
      "digest": "sha256:906946e1a438fe968e64d947bae32999eebfef71db21d3149cad1f2b2d6ea118"
    }
  }
