        {
          "name": "intake_message",
          "title": "Inbound Message Intake",
          "description": "Use this only as the entry point for the interactive intake form, or when the user attaches a pitch file such as .eml or .msg. For a pitch pasted in chat, use score_message instead. With no message it returns status ready and the empty form. With a message it returns status ok, the evaluation and three reply drafts. It saves the evaluation only when the user already has a desk; otherwise it scores against a sample engineer profile, which is not the user's real score, so say so and offer set_criteria. The desk is the signed-in user's, so send no desk_key.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "message": "Hi, we are hiring a Staff Engineer at Stripe, $220k base, remote.",
                "sender": "jane@stripe.com"
              }
            ],
            "properties": {
              "channel": {
                "description": "Optional channel the pitch came from. Defaults to email.",
                "enum": ["email", "linkedin", "x", "other"],
                "type": "string"
              },
              "file": {
                "description": "Set by ChatGPT when the user opens an attached pitch file (.eml, .msg, .pitch, .outreach). Do not fill it yourself.",
                "properties": {
                  "name": {
                    "description": "File name, such as \"lead.eml\".",
                    "minLength": 1,
                    "type": "string"
                  },
                  "resourceUri": {
                    "description": "The host link to the file.",
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["name", "resourceUri"],
                "type": "object"
              },
              "message": {
                "description": "Optional pitch text, such as \"Hi, we are hiring a Staff Engineer at Stripe, $220k base, remote.\" Omit it to open the empty intake form.",
                "maxLength": 20000,
                "type": "string"
              },
              "priority": {
                "description": "Optional priority the user gives this pitch. Defaults to medium.",
                "enum": ["high", "medium", "low"],
                "type": "string"
              },
              "sender": {
                "description": "Optional sender email address, profile URL or domain, such as \"jane@stripe.com\".",
                "maxLength": 320,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "Day of the call, as YYYY-MM-DD in UTC.",
                "type": "string"
              },
              "channel": {
                "description": "Channel the pitch came from.",
                "type": "string"
              },
              "drafts": {
                "description": "Only with status ok: one draft body for each kind of reply. Nothing is sent.",
                "properties": {
                  "decline": {
                    "description": "Draft body for a polite decline, with the feedback card appended.",
                    "type": "string"
                  },
                  "interested": {
                    "description": "Draft body for an interested reply.",
                    "type": "string"
                  },
                  "request_info": {
                    "description": "Draft body that asks for the salary range and remote policy.",
                    "type": "string"
                  }
                },
                "required": ["decline", "interested", "request_info"],
                "type": "object"
              },
              "evaluation": {
                "description": "Only with status ok: the score of the pitch.",
                "properties": {
                  "breakdown": {
                    "description": "The four sub-scores, each an integer from 0 to 100 where higher is better.",
                    "properties": {
                      "cadence": {
                        "description": "How well spaced the outreach is; low for rapid follow-ups or contact after a decline.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "relevance": {
                        "description": "Fit with the target role, skills, salary floor and remote policy.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "spam": {
                        "description": "Spam safety: 100 is clean, low means template tokens, buzzwords or urgency.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "specificity": {
                        "description": "How concrete the pitch is: named company, role details and stated salary.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["cadence", "relevance", "spam", "specificity"],
                    "type": "object"
                  },
                  "composite_score": {
                    "description": "Overall score from 0 to 100.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "evaluation_id": {
                    "description": "Id to pass to draft_response; valid only when the user has a desk.",
                    "type": "string"
                  },
                  "flags": {
                    "description": "Warning flags. Values: missing_salary, dealbreaker_clash, token_failure (unfilled template token such as [Current Company]), aggressive_drip, repeat_after_decline, slop, artificial_urgency, free_webmail. Empty when the pitch is clean.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "key_reasons": {
                    "description": "Plain reasons behind the scores.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "recommended_action": {
                    "description": "Suggested reply.",
                    "enum": ["interested", "request_info", "decline"],
                    "type": "string"
                  },
                  "sender_domain": {
                    "description": "Sender domain of the pitch.",
                    "type": "string"
                  },
                  "summary": {
                    "description": "Cleaned summary of the pitch.",
                    "type": "string"
                  }
                },
                "required": ["breakdown", "composite_score", "evaluation_id", "flags", "key_reasons", "recommended_action", "sender_domain", "summary"],
                "type": "object"
              },
              "file": {
                "description": "The attached file, when the form was opened from one.",
                "properties": {
                  "name": {
                    "description": "File name, such as \"lead.eml\".",
                    "type": "string"
                  },
                  "resourceUri": {
                    "description": "The host link to the file, as ChatGPT sent it.",
                    "type": "string"
                  }
                },
                "required": ["name", "resourceUri"],
                "type": "object"
              },
              "interactive_ui": {
                "description": "The intake form resource.",
                "type": "string"
              },
              "message": {
                "description": "With status ready: what the user should do next. With status ok: which criteria the pitch was scored against.",
                "type": "string"
              },
              "priority": {
                "description": "Priority the user gave the pitch.",
                "type": "string"
              },
              "scored_against": {
                "description": "your_criteria: the user's saved desk criteria. sample_profile: a sample engineer profile, because the user has no desk; this is not the user's real score.",
                "enum": ["your_criteria", "sample_profile"],
                "type": "string"
              },
              "source": {
                "description": "Where the data comes from: the user's own private desk.",
                "type": "string"
              },
              "status": {
                "description": "ready: the empty form is open and no pitch was given. ok: the pitch was scored.",
                "enum": ["ok", "ready"],
                "type": "string"
              }
            },
            "required": ["interactive_ui", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
