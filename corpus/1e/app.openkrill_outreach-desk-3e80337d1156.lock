        {
          "name": "purge_data",
          "title": "Purge Desk Data",
          "description": "Use this to permanently delete stored data. scope sender deletes every evaluation and the scoreboard row for one sender_domain, which is then required (for example \"stripe.com\"). scope desk deletes the whole desk: criteria, senders and evaluations. Deletion is immediate and cannot be undone, so confirm the scope with the user before calling. Returns purged true and what was deleted. Errors: scope sender with no sender_domain is refused with invalid_input; send sender_domain or use scope desk. Not for changing criteria; use set_criteria. The desk is the signed-in user's, so send no desk_key.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "scope": "sender",
                "sender_domain": "faststaffing.biz"
              }
            ],
            "properties": {
              "scope": {
                "description": "What to delete: \"sender\" for one sender's records, or \"desk\" for the whole desk. Confirm with the user first.",
                "enum": ["desk", "sender"],
                "type": "string"
              },
              "sender_domain": {
                "description": "Required when scope is \"sender\": the sender domain to delete, such as \"stripe.com\". Ignored for scope desk.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["scope"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "Day of the call, as YYYY-MM-DD in UTC.",
                "type": "string"
              },
              "message": {
                "description": "Plain statement of what was deleted.",
                "type": "string"
              },
              "purged": {
                "description": "True when the records were deleted.",
                "type": "boolean"
              },
              "scope": {
                "description": "What was deleted.",
                "enum": ["desk", "sender"],
                "type": "string"
              },
              "source": {
                "description": "Where the data comes from: the user's own private desk.",
                "type": "string"
              }
            },
            "required": ["as_of", "message", "purged", "scope", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Desk data deleted",
            "openai/toolInvocation/invoking": "Deleting desk data..."
          },
          "digest": "sha256:729e07056337dd3d292adfc16d24be00a1c58b764b1071944373f98852967237"
        },
        {
          "name": "score_message",
          "title": "Score Inbound Pitch",
          "description": "Use this, not intake_message (form and files only), for any recruiter pitch pasted in chat. When the user states their criteria (role, skills, salary floor, remote policy), always send them as criteria in this same call, even before set_criteria; they win over saved criteria and are not saved, so call set_criteria too if the user wants them kept. With no criteria it uses the saved desk. Returns an evaluation_id, a 0 to 100 composite and four sub-scores (relevance, specificity, cadence, spam where 100 is clean), flags, key reasons and an action: interested, request_info or decline. Saves a cleaned summary to the sender scoreboard; raw text is never stored. Send the whole pitch as message, and sender_domain as a bare host such as stripe.com or not at all. A client that sends no user id has no desk: send criteria; nothing is stored and evaluation_id is empty. Errors: no_desk means call set_criteria, then score again; no_user_id means send criteria. Never present intake_message's sample-profile score as the user's. draft_response takes the evaluation_id.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "message": "Dear Candidate, you would be an awesome rockstar ninja for our client onsite in Dallas.",
                "sender_domain": "faststaffing.biz"
              }
            ],
            "properties": {
              "cadence_days": {
                "description": "Optional days since the previous message from this sender, 0 to 365, such as 2. Used only for the cadence sub-score. Defaults to 7.",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "criteria": {
                "additionalProperties": false,
                "description": "The criteria to score against, in the shape set_criteria takes. Send it whenever the user states their criteria; it wins over the desk's saved criteria. All four fields are required, so ask the user for one they did not state rather than guess it. Required when the client sends no user id (no ChatGPT sign-in and no OAuth connection): the pitch is then scored and nothing is stored.",
                "properties": {
                  "dealbreakers": {
                    "description": "Optional, up to 20: constraints that rule out a pitch, such as [\"Onsite required\", \"Legacy Java\"]. Omit it or send [] for none.",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "remote_policy": {
                    "description": "Wanted work arrangement, such as \"100% remote\", \"hybrid 1 day\" or \"any\".",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "salary_floor": {
                    "description": "Minimum yearly base salary in whole US dollars, 0 to 10000000, such as 210000. Use 0 for no floor.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "skills": {
                    "description": "Core skills, 1 to 30, such as [\"TypeScript\", \"Go\"].",
                    "items": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "minItems": 1,
                    "type": "array"
                  },
                  "target_role": {
                    "description": "Target job title, such as \"Staff Distributed Systems Engineer\".",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["remote_policy", "salary_floor", "skills", "target_role"],
                "type": "object"
              },
              "is_follow_up": {
                "description": "Optional: true when this message follows up earlier outreach. Used only for the cadence sub-score. Defaults to false.",
                "type": "boolean"
              },
              "message": {
                "description": "The full pitch text the user pasted, such as \"Hi, we are hiring a Staff Engineer at Stripe, $220k base, remote.\"",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "previous_declined": {
                "description": "Optional: true when the user already declined this sender. Used only for the cadence sub-score. Defaults to false.",
                "type": "boolean"
              },
              "sender": {
                "description": "Optional sender email address, profile URL or domain, such as \"jane@stripe.com\". Used only when sender_domain is not given.",
                "maxLength": 320,
                "type": "string"
              },
              "sender_domain": {
                "description": "Optional sender domain as a bare host name, such as \"stripe.com\" (no @, no https://). It wins over sender. With neither, the domain is read from the message, else unspecified-sender.com.",
                "maxLength": 253,
                "pattern": "^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "Day of the call, as YYYY-MM-DD in UTC.",
                "type": "string"
              },
              "breakdown": {
                "description": "The four sub-scores, each an integer from 0 to 100 where higher is better.",
                "properties": {
                  "cadence": {
                    "description": "How well spaced the outreach is; low for rapid follow-ups or contact after a decline.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "relevance": {
                    "description": "Fit with the target role, skills, salary floor and remote policy.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "spam": {
                    "description": "Spam safety: 100 is clean, low means template tokens, buzzwords or urgency.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "specificity": {
                    "description": "How concrete the pitch is: named company, role details and stated salary.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["cadence", "relevance", "spam", "specificity"],
                "type": "object"
              },
              "composite_score": {
                "description": "Overall score from 0 to 100; 85 or more is a strong pitch.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "evaluation_id": {
                "description": "Id of this evaluation; pass it to draft_response. Kept for 30 days. Empty when nothing was stored because the client sends no user id.",
                "type": "string"
              },
              "flags": {
                "description": "Warning flags. Values: missing_salary, dealbreaker_clash, token_failure (unfilled template token such as [Current Company]), aggressive_drip, repeat_after_decline, slop, artificial_urgency, free_webmail. Empty when the pitch is clean.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "key_reasons": {
                "description": "Plain reasons behind the scores.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recommended_action": {
                "description": "Suggested reply: interested, request_info or decline.",
                "enum": ["interested", "request_info", "decline"],
                "type": "string"
              },
              "sender_domain": {
                "description": "Sender domain the pitch is counted under on the scoreboard.",
                "type": "string"
              },
              "source": {
                "description": "Where the data comes from: the user's own private desk.",
                "type": "string"
              },
              "summary": {
                "description": "Short cleaned summary of the pitch with contact details removed; this is what is stored.",
                "type": "string"
              }
            },
            "required": ["as_of", "breakdown", "composite_score", "evaluation_id", "flags", "key_reasons", "recommended_action", "sender_domain", "source", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Pitch scored",
            "openai/toolInvocation/invoking": "Scoring the pitch against your criteria..."
          },
          "digest": "sha256:f6e51b2f9baa30d3af3562ed8b7ee1475c4e7b804c74c9d6e2845dc8f0ee74cd"
        },
        {
          "name": "set_criteria",
          "title": "Set Candidate Criteria",
          "description": "Use this to save the user's job search criteria; each call overwrites all saved criteria, and the earlier ones are lost. Best for: the first setup, which starts the user's private desk, or a change of role, skills, salary floor or remote policy. Input tips: send target_role, skills, salary_floor in whole US dollars and remote_policy, plus optional dealbreakers; to change one field, send every field again with the change. Ask the user for any missing required field before calling. Returns status saved, the cleaned criteria and the retention note. A client that sends no user id gets status not_saved: nothing is stored, and the returned criteria go to score_message as its criteria argument. Past evaluations and the scoreboard are kept. Not for scoring a pitch; use score_message.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "remote_policy": "100% remote",
                "salary_floor": 150000,
                "skills": ["Go", "PostgreSQL"],
                "target_role": "Backend engineer"
              }
            ],
            "properties": {
              "dealbreakers": {
                "description": "Optional, up to 20: constraints that rule out a pitch, such as [\"Onsite required\", \"Legacy Java\"]. Omit it or send [] for none.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "remote_policy": {
                "description": "Wanted work arrangement, such as \"100% remote\", \"hybrid 1 day\" or \"any\".",
                "maxLength": 200,
                "type": "string"
              },
              "salary_floor": {
                "description": "Minimum yearly base salary in whole US dollars, 0 to 10000000, such as 210000. Use 0 for no floor.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "skills": {
                "description": "Core skills, 1 to 30, such as [\"TypeScript\", \"Go\"].",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "target_role": {
                "description": "Target job title, such as \"Staff Distributed Systems Engineer\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["remote_policy", "salary_floor", "skills", "target_role"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "Day of the call, as YYYY-MM-DD in UTC.",
                "type": "string"
              },
              "dealbreakers": {
                "description": "Dealbreakers; empty when none were given.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "remote_policy": {
                "description": "Work arrangement.",
                "type": "string"
              },
              "retention_note": {
                "description": "How long evaluations and the desk are kept, or, with not_saved, what to do next.",
                "type": "string"
              },
              "salary_floor": {
                "description": "Minimum yearly base salary in US dollars.",
                "type": "integer"
              },
              "skills": {
                "description": "Core skills.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "description": "Where the data comes from: the user's own private desk.",
                "type": "string"
              },
              "status": {
                "description": "saved: the criteria replaced any earlier criteria on the user's desk. not_saved: the client sends no user id (no ChatGPT sign-in and no OAuth connection), so nothing was stored; pass the criteria to score_message.",
                "enum": ["saved", "not_saved"],
                "type": "string"
              },
              "target_role": {
                "description": "Target role, with contact details removed.",
                "type": "string"
              }
            },
            "required": ["as_of", "dealbreakers", "remote_policy", "retention_note", "salary_floor", "skills", "source", "status", "target_role"],
            "type": "object"
