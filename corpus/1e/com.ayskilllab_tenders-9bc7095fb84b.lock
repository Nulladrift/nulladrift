{
  "lockfileVersion": 2,
  "subjects": {
    "com.ayskilllab/tenders": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tenders.ayskilllab.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "ayskilllab-tenders",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free, read-only search of public tender notices from TED, the UK, Irish and US federal services on AY Tenders, in seven sectors. Rows are basic fields with the official notice and, where we have one, our page; check the official notice before relying on a row. Up to 10 rows an answer and 3 pages; 300 rows a day per address.",
      "tools": [
        {
          "name": "expiring_contracts",
          "title": "Contracts ending soon",
          "description": "Contracts in our seven sectors whose period ends in the coming months (3 unless you say, 12 at most), from UK award notices, Irish award dates plus the stated duration (an estimate, marked so) and USAspending. A contract ending is often re-tendered, but not always. Up to 10 rows an answer and 3 pages; 300 rows a day per address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "months_ahead": {
                "description": "Contracts ending within this many months; 3 unless you say.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page of results, from 1; ten rows a page.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words in the title or the buyer's name.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "region": {
                "description": "uk, ie (Ireland) or us. Leave it out for all three.",
                "enum": ["uk", "ie", "us"],
                "type": "string"
              },
              "sector": {
                "description": "it_services = IT systems & software, cybersecurity = Cybersecurity, medical_devices = Medical devices & pharmaceuticals, civil_works = Civil works & construction, energy_solar = Energy, solar & efficiency, cleaning_environment = Cleaning, environment & waste, events_marketing = Events, exhibitions & marketing.",
                "enum": ["it_services", "cybersecurity", "medical_devices", "civil_works", "energy_solar", "cleaning_environment", "events_marketing"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5d9c7a750b83d11ec16f18565645f8c34c801760ac9bfb35ec2c70c1ac40703"
        },
        {
          "name": "get_tender",
          "title": "Get one tender",
          "description": "One notice's page: title, buyer, country, stage and notice type, estimated value, published date, deadline, CPV, NAICS and PSC codes, place of performance where the notice states one, and the official notice. Counts as one row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id a search returned, such as ted-768295-2026, or the page address.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9be08954a815e221fbfb988f7ca8fc600ff7cb8a673298ff889fa4d864dc540"
        },
        {
          "name": "search_open_tenders",
          "title": "Search open tenders",
          "description": "Open calls for bids in our seven sectors, nearest deadline first. Needs at least one of query, sector, country or closes_within_days: there is no list of everything. Up to 10 rows an answer and 3 pages; 300 rows a day per address. Each row has the official notice (official_url) and our page (page_url) when we have one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "closes_within_days": {
                "description": "Only tenders whose deadline is in this many days.",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "country": {
                "description": "The buyer's country, two letters (GB, DE, US...).",
                "enum": ["DE", "PL", "FR", "ES", "CZ", "GB", "RO", "BE", "IT", "SE", "CH", "NL", "PT", "LT", "BG", "FI", "HR", "AT", "NO", "SK", "LV", "SI", "GR", "IE", "HU", "US", "DK", "LU", "EE", "MT", "CY", "IS", "AL", "MK", "MD"],
                "type": "string"
              },
              "page": {
                "description": "Page of results, from 1; ten rows a page.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words in the title or the buyer's name, in the notice's language.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "region": {
                "description": "uk, us, or eu (every other country).",
                "enum": ["uk", "us", "eu"],
                "type": "string"
              },
              "sector": {
                "description": "it_services = IT systems & software, cybersecurity = Cybersecurity, medical_devices = Medical devices & pharmaceuticals, civil_works = Civil works & construction, energy_solar = Energy, solar & efficiency, cleaning_environment = Cleaning, environment & waste, events_marketing = Events, exhibitions & marketing.",
                "enum": ["it_services", "cybersecurity", "medical_devices", "civil_works", "energy_solar", "cleaning_environment", "events_marketing"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2d075204f95fe6065bf45f285f60d1af7e552d0cefb5a58f5c5ca4677b1048b"
        }
      ],
      "digest": "sha256:49e5653a42e387a95cf45bd45729af0cc61db9ac2f7c567a07f129528125ebe2"
    }
  }
}
