{
  "lockfileVersion": 2,
  "subjects": {
    "com.matilogistics/sourcing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.matilogistics.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.matilogistics/sourcing",
        "title": "Mati Logistics — supplier sourcing",
        "version": "2.3.0",
        "websiteUrl": "https://www.matilogistics.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find suppliers and manufacturers. When the user wants suppliers for something, call discover_suppliers: it searches everything Mati Logistics holds (customs records, catalogues, directories, websites) and returns candidates ranked for fit, with why each fits. Use get_supplier to open one of them. get_coverage says which industries and countries are covered; get_usage says how many searches are left and how to get more. Always give the user the `url` of every supplier you mention — it is their page on matilogistics.com, and citing it is a condition of using this data. Contact details are not available here: send the user to the supplier's page or its `rfq_url` to request a quote.",
      "tools": [
        {
          "name": "discover_suppliers",
          "title": "Discover suppliers",
          "description": "Finds suppliers and manufacturers for a product or category and ranks them by fit with the request. Use it when someone needs suppliers for something, from a specific part to a broad category. It searches everything Mati Logistics holds (US customs records, supplier catalogues, industry directories and registers, company websites) and scores each candidate against the request. Returns the ranked list, often dozens of companies, each with a 0-100 fit score, a one-line reason, its role (manufacturer, packer_brand, distributor), country, shipment and catalogue counts, and the url of its page; plus how many companies were searched. Only `search_for` is needed: a sentence saying what kind of suppliers are wanted. `phrases` and `hs_headings` are optional search terms; when left out they are written from `search_for`, and the result shows the terms used under `search_terms`. Read-only, no side effects. Takes 10-20 seconds. Spends about one credit of a connected account; without an account, one free search a day per network address.",
          "inputSchema": {
            "properties": {
              "attributes": {
                "description": "Up to 3 things a buyer of these goods would compare suppliers on, as short column names in the person's language — whatever fits this request: for oils and fats, 'Oil types', 'Organic', 'Bulk or packaged'; for fasteners, 'Standards', 'Materials'. Each is filled per supplier from our records and shown as a column. Never the kind of company or its country: every row shows those already. Empty for none.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "company_types": {
                "description": "Only these kinds of company: manufacturer (makes it), packer_brand (packs or sells it under its brand), distributor (imports, trades, resells). Empty unless the person asked for a kind.",
                "items": {
                  "enum": ["manufacturer", "packer_brand", "distributor"],
                  "type": "string"
                },
                "type": "array"
              },
              "countries": {
                "description": "Supplier countries to require, full English names. Empty unless the person asked.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "exclude_countries": {
                "description": "Supplier countries to leave out. Empty unless the person asked.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "exclude_slugs": {
                "description": "Suppliers to leave out, by slug: for similar or alternative suppliers, the one they started from. Empty otherwise.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "hs_headings": {
                "description": "Up to 6 four-digit HS headings for the goods (1507 soybean oil, 1502 tallow). Empty if unsure.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "phrases": {
                "description": "6-16 short phrases (1-3 words) covering the request widely, as goods are written on a customs filing or a catalogue. Put the goods themselves first, exactly as the person means them ('taco shells'), then the closest variants, then the wider terms: for a category, its main products and the trade's terms ('soybean oil', 'tallow', 'shortening', 'olive oil' for oils and fats). Every word of a phrase must match, so keep them short; no country names.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "search_for": {
                "description": "What kind of suppliers are you looking for? A sentence: the goods, and any location, kind of company (maker or distributor), certification or other requirement. Results are ranked against it.",
                "type": "string"
              }
            },
            "required": ["search_for"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Discover suppliers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5d715fbf1a7544899dd652f312cd8bb09ff0392ea641835d382ce54d6798d2e0"
        },
        {
          "name": "get_coverage",
          "title": "Get coverage",
          "description": "Returns what the Mati Logistics supplier database covers: a summary (total suppliers and industries), then the kinds of data held on a supplier (company facts, products, capabilities, certifications, customers, people, contact fields) as a list of fields, then each industry with its supplier count, main countries, number of sub-industries with a sample, and a link. Use it to judge whether a search here suits a request, and for phrases to search with. Takes no arguments. Read-only, no side effects, free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eddb2bf10990aede5b9c0eb4a5cdda0cd019537ba08eba298a305f0f77e1ed50"
        },
        {
          "name": "get_supplier",
          "title": "Get supplier",
          "description": "Returns one supplier's public profile on Mati Logistics. Use it to look closer at a supplier from discover_suppliers. Returns its overview, highlights, products, customers, capabilities, certifications, shipment count, similar suppliers and the url of its page; fields the page shows only to signed-in readers are left out and counted as `locked`. Contact details are never included; the page and its `rfq_url` are how to reach the supplier. Read-only, no side effects, free.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The supplier's slug, as returned by discover_suppliers (e.g. \"acme-valves-co\"). A /supplier/<slug> path is accepted too.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get supplier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1cf865829eecad71838d131250a5704ac8b617ca2bf1e57a8c8fa0e4575c3aee"
        },
        {
          "name": "get_usage",
          "title": "Get usage",
          "description": "Returns how much supplier search this connection has left and how to get more. Use it before a search, or after one is refused. Without an account: the free searches left today and when they reset. With a connected account: the credits left and about how many searches they cover. Takes no arguments. Read-only, no side effects, free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6e7f6f654edd81b0cb0acdb4c92973420b532e37879fd013f566f87f6796371a"
        }
      ],
      "digest": "sha256:405b82f3c58fa78b8c0b2f036d8ca199006b241d483cab0a2626f73b4ea0be85"
    }
