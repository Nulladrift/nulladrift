{
  "lockfileVersion": 2,
  "subjects": {
    "com.anonpolls/anonpolls": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://anonpolls.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "anonpolls",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AnonPolls doesn't collect accounts or names. Creators see only totals, never who voted for what. To limit repeat votes, it stores a one-way hash of the voter's network address with the vote, not the address itself. Normally each network votes once per poll, checked on the server. In classroom or office mode, each browser votes once. Polls are public to anyone with the link.",
      "tools": [
        {
          "name": "create_poll",
          "title": "Create an anonymous poll",
          "description": "Create a poll anyone can vote on with a link — no sign-up, anonymous by default. AnonPolls doesn't collect accounts or names. Creators see only totals, never who voted for what. To limit repeat votes, it stores a one-way hash of the voter's network address with the vote, not the address itself. Normally each network votes once per poll, checked on the server. In classroom or office mode, each browser votes once. Polls are public to anyone with the link. Question at most 200 characters. Two to six options. vote_limit_mode: network (default, one vote per network), device (one vote per browser, classroom/office), or code (one-time voter codes; pass code_count 1–300). Returns poll_url (voting link), results_url (opens the results view via ?view=results), and creator_manage_url. creator_manage_url contains the creator token — give this only to the person who asked for the poll. In code mode also returns voter_codes_url (= creator_manage_url) and codes_requested (the code_count you asked for). The organiser opens voter_codes_url and taps \"Generate my voter codes\" to see them once. Hand them out yourself — codes are never returned in this tool result. MCP polls are unlisted and never auto-approved for discovery.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code_count": {
                "description": "Required when vote_limit_mode is code. At most 300.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "options": {
                "description": "Two to six options.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              },
              "question": {
                "description": "Poll question, at most 200 characters.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "vote_limit_mode": {
                "description": "network (default), device (classroom/office), or code (one-time codes).",
                "enum": ["network", "device", "code"],
                "type": "string"
              }
            },
            "required": ["options", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:069eb8cbd1e50d804dfb731fb9a11b03cf4cf7c8e06a9e5d242f081cf15f8e35"
        },
        {
          "name": "get_results",
          "title": "Get public poll totals",
          "description": "Read public totals for a poll, the same numbers as the public results page. AnonPolls doesn't collect accounts or names. Creators see only totals, never who voted for what. To limit repeat votes, it stores a one-way hash of the voter's network address with the vote, not the address itself. Normally each network votes once per poll, checked on the server. In classroom or office mode, each browser votes once. Polls are public to anyone with the link. poll_id may be the numeric id or a full https://anonpolls.com/poll/<id> URL. Returns only poll_id, question, options[{text, votes}], total_votes, vote_limit_mode, is_active, and created_at. Never returns voter-level data, voter codes, hashed addresses, or the creator token.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "poll_id": {
                "description": "Numeric poll id, or a full https://anonpolls.com/poll/<id> URL from create_poll / poll_url.",
                "type": ["number", "string"]
              }
            },
            "required": ["poll_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1943ce8d915d551c54fc0ae860ad10d2d023f666ee8a287ac2c9b084b6696862"
        }
      ],
      "digest": "sha256:6e0f90e607473fce83c815ff9e5fc9b66f6c73fe35a0318dfbf074ed307cb471"
    }
  }
}
