        {
          "name": "define_genomics_term",
          "title": "Define a genetics or genomics term",
          "description": "Get the definition of a genetics, genomics or molecular biology term by name or abbreviation (e.g. \"allele\", \"PCR\", \"codon\", \"Hardy-Weinberg law\"). Matching ignores case, accents and punctuation, accepts English names on any edition, and tolerates small typos. Returns the best entry with its full definition, category, related terms, translation status and canonical URL to cite, plus alternative candidates. Educational reference, not medical advice.",
