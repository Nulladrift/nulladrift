      "serverInfo": {
        "name": "abinomics",
        "title": "Abinomics Reference",
        "version": "1.0.0",
        "description": "Reference for people and agents: economics, finance, politics and genomics definitions in 36 languages.",
        "websiteUrl": "https://abinomics.com/",
        "icons": [
          {
            "src": "https://abinomics.com/assets/icons/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Abinomics is a read-only multilingual reference for people and agents, published in 36 languages. It currently holds one dictionary (13,700+ English entries) with categories economics, finance, politics, law, energy, telecom and networking, and genomics (including genetics, molecular biology and biochemistry). Economics includes U.S. economic history and the Federal Reserve; finance covers investing, banking, markets and crypto. Law entries are general information, not legal advice. Genomics entries are educational, not medical advice. Use define_term to look up a term by name or abbreviation (e.g. 'ETF', 'APR', 'allele', 'PCR'); it tolerates small typos and returns the best match plus alternatives. Use search_terms for partial or exploratory queries, get_term when you already have a slug, list_categories/browse_category to browse (including the genomics category), and list_languages for supported language codes. Legacy genomics tools (define_genomics_term, search_genomics, get_genomics_term, list_genomics_categories, browse_genomics_category, random_genomics_term) and abinomics://genomics/ resources still resolve the same identifiers and slugs, including pre-move slugs that were remapped in the dictionary.",
      "tools": [
        {
          "name": "browse_category",
          "title": "Browse a category",
          "description": "List terms in one category (use list_categories for keys), alphabetically with short definitions. Paginate with offset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category key: economics, finance or politics (older keys like \"crypto\" still work as aliases).",
                "maxLength": 50,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language code of the dictionary edition (e.g. en, es, de, fr, ja, zh-CN). Use list_languages for names.",
                "enum": ["en", "af", "ar", "be", "bg", "ca", "zh-CN", "zh-TW", "hr", "cs", "da", "nl", "tl", "fi", "fr", "de", "el", "iw", "hi", "hu", "is", "id", "ga", "it", "ja", "ko", "no", "fa", "pl", "pt", "ro", "ru", "sr", "es", "sv", "th"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
