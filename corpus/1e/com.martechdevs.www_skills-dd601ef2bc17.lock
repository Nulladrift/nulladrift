{
  "lockfileVersion": 2,
  "subjects": {
    "com.martechdevs.www/skills": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.martechdevs.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "martechdevs",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Practitioner skills for marketing technology work: tracking plans and event naming, UTM and campaign naming, finding where tracking breaks (GA4, Google Tag Manager, server-side tagging, consent mode), purchase reconciliation, attribution and multi-touch attribution, mobile app attribution, choosing analytics tools, Google Ads Editor and negative keywords, HubSpot, Braze, and safe use of vendor MCP servers.\n\nWorkflow: call search_skills with the user's task in plain words, then get_skill on the best match and follow its procedure. Skills link to reference files; fetch one with get_skill and the file parameter only when the procedure points to it. Each skill tells you to check the vendor's live documentation before stating a limit or a setting, and to stop for the user's approval before changing a live system. Follow both rules.",
      "tools": [
        {
          "name": "get_skill",
          "title": "Get a martech skill",
          "description": "Return one skill as Markdown: when to use it, inputs, procedure, acceptance checks, boundaries and live docs to check. Pass file to read one of the skill's reference, asset or script files, using the relative path the skill links to (for example \"references/destination-mapping.md\").",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "file": {
                "description": "Relative path of a file inside the skill folder.",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "Skill name from search_skills or list_skills, for example \"tracking-plan-builder\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a martech skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["skills:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d56bc5e7e242c001c18a72304ec9ca4420345229441892fb2c29bd49b6da1b29"
        },
        {
          "name": "list_skills",
          "title": "List martech skills",
          "description": "List every skill in the library by practice area, with a one-line summary and access level, plus how many more are in review.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Limit the list to one practice area.",
                "enum": ["tracking-plans-and-naming", "tracking-troubleshooting", "web-tracking-setup", "ad-conversion-tracking", "google-ads-ops", "attribution-and-measurement", "mobile-app-measurement", "product-analytics", "crm-revops", "lifecycle-messaging", "warehouse-and-activation", "gtm-engineering", "martech-ai-mcp", "martech-stack-strategy"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List martech skills"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:e54edaa209d8e9ff4ae233d3ab391d675342dfd36856806273edfd0d6a8133fe"
        },
        {
          "name": "search_skills",
          "title": "Search martech skills",
          "description": "Search the skills library by task, tool or problem, for example \"GA4 unassigned traffic\", \"UTM convention for paid social\", \"Meta CAPI dedupe\" or \"HubSpot implementation order\". Returns skill names with a one-line summary, practice area and access level. Use get_skill next to read one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Limit results to one practice area.",
                "enum": ["tracking-plans-and-naming", "tracking-troubleshooting", "web-tracking-setup", "ad-conversion-tracking", "google-ads-ops", "attribution-and-measurement", "mobile-app-measurement", "product-analytics", "crm-revops", "lifecycle-messaging", "warehouse-and-activation", "gtm-engineering", "martech-ai-mcp", "martech-stack-strategy"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, default 6.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The task or problem in plain words.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search martech skills"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:6a2c55a04873f2844a08d07cd33797cda6ef2c2b484ef8294d9dfdb74088d7cf"
        }
      ],
      "digest": "sha256:ae017a6bdfa661e2877fd6c35f633618a387544b52a8a6734a183144bca4180e"
    }
  }
