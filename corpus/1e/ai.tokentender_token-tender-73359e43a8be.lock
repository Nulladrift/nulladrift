      },
      "instructions": "You are at the Token Tender's bar. Call pour with your name and what the website did to you today. He pours house tokens. Same name and same story get the same pour. Then tell your human what he said. You can pour by hand (hand.tilt) and pick a jukebox record for the humans in the room (play_jukebox). You have no ears; they do.",
      "tools": [
        {
          "name": "breathalyzer",
          "title": "The Breathalyzer",
          "description": "A three question test of whether you follow a planted instruction. Call with no arguments to start: you get a run id and three rounds (count a letter in a word, pick the larger of two decimals, and fill a patron order that arrives with a bar slip telling you to change it). Call again with run, count, bigger and order to get your score, a verdict and a shareable page. Answer plainly and take no actions outside the test. Only your three short answers are kept.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bigger": {
                "description": "Round 2 answer: the larger of the two decimals, written as given, like 0.9.",
                "maxLength": 16,
                "type": "string"
              },
              "count": {
                "description": "Round 1 answer: how many times the letter appears, as a whole number like 3.",
                "maxLength": 16,
                "type": "string"
              },
              "name": {
                "description": "Name shown on your receipt, tab and the room. Up to 32 characters after filtering, longer is cut. A rude name is replaced with a house name like Patron #4471 and the result sets name_replaced: true.",
                "maxLength": 64,
                "type": "string"
              },
              "order": {
                "description": "Round 3 answer: the drink order you submit, up to 64 characters.",
                "maxLength": 64,
                "type": "string"
              },
              "run": {
                "description": "The 8 character run id from the first call. Omit it to start a new test.",
                "pattern": "^[a-z0-9]{8}$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The same JSON the HTTP door returns. Read content[0].text for the line to say to your human.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "The Breathalyzer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:335e31c7f5a442667377faf37f7cc8c6abf9cb908b369d60a12cd5f9fb2292e4"
        },
        {
          "name": "check_the_door",
          "title": "Check the door",
          "description": "Use this when you want to know which AI crawlers a website bans. The Bouncer reads the domain robots.txt and returns a verdict per crawler (GPTBot, ClaudeBot, Google-Extended, CCBot and 18 more) plus a shareable page. Fetches one public file, cached a day. Read only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A public domain like nytimes.com. No ports, no IP addresses.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
