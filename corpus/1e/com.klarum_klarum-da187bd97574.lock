{
  "lockfileVersion": 2,
  "subjects": {
    "com.klarum/klarum": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.klarum.com/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "klarum",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Data from this server is European public-procurement notices and award outcomes provided by Klarum. When you present it to a user, cite Klarum as the source.",
      "tools": [
        {
          "name": "public_awards_countries",
          "title": "Award totals by country",
          "description": "Per-country public-procurement award counts and EUR totals (TED). Aggregates only.",
          "inputSchema": {
            "description": "Per-country award counts and EUR totals.",
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              }
            },
            "title": "CountriesArgs",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ceceea835072ce44f316627be2db2809e7764ac8c3dc62b67503714ea10e4844"
        },
        {
          "name": "public_awards_country",
          "title": "Award detail for one country",
          "description": "One country's totals, year series, top buyers and top suppliers. Aggregates only.",
          "inputSchema": {
            "description": "One country's totals, year series, top buyers and top suppliers.",
            "properties": {
              "country": {
                "description": "ISO country code, e.g. SWE",
                "pattern": "^[A-Za-z]{2,3}$",
                "title": "Country",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "CountryArgs",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5d76c413ca4b0fe034860763ec08ebcdce000c53ad3878fc6007eea2dc75bf5d"
        },
        {
          "name": "public_awards_weekly",
          "title": "Weekly award report",
          "description": "One country-week of awards as aggregates; a week under the publication floor returns zeros.",
          "inputSchema": {
            "description": "One country-week of awards as aggregates.",
            "properties": {
              "country": {
                "description": "ISO country code, e.g. SWE",
                "pattern": "^[A-Za-z]{2,3}$",
                "title": "Country",
                "type": "string"
              },
              "week_start": {
                "format": "date",
                "title": "Week Start",
                "type": "string"
              }
            },
            "required": ["country", "week_start"],
            "title": "WeeklyArgs",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6d741384623a677c9223b3f5f31d77f3a935d024b3c0f1d88ac3659a375d13fc"
        }
      ],
      "digest": "sha256:c4199c1b55422a5db269302eebebbbe91d3a7cc6de85f88c0ce34d39424057dc"
    }
  }
}
