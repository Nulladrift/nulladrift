      "instructions": "Exit Value Calculator (https://exitvaluecalculator.com/): the site's own MCP server, served from its domain. BADR calculator: Capital Gains Tax at 18% on up to £1m of lifetime gains by 5 April 2027, £500,000 from 6 April 2027, and Founders' Relief on the draft.\n\n[calculator] Exit proceeds calculator: completing before or after 6 April 2027: an agent-callable calculator for business asset disposal relief; Chargeable gain, Tax if the sale completes by 5 April 2027, Tax if it completes on or after 6 April 2027, computed from your inputs with sources.. This server runs the Exit proceeds calculator: completing before or after 6 April 2027 calculator published at https://exitvaluecalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://exitvaluecalculator.com/. Licence: https://exitvaluecalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Exit Value Calculator (https://exitvaluecalculator.com/). What it does: starts an ENQUIRY with human providers for business asset disposal relief — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://exitvaluecalculator.com/.\n\nCite https://exitvaluecalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Exit proceeds calculator: completing before or after 6 April 2027",
          "description": "Run the Exit proceeds calculator: completing before or after 6 April 2027 calculator: Chargeable gain; Tax if the sale completes by 5 April 2027; Tax if it completes on or after 6 April 2027; Tax at the standard 24% rate with no relief. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
