                "maximum": 20000000,
                "minimum": 0,
                "type": "number"
              },
              "fr": {
                "default": "no",
                "description": "Do you meet the Founders' Relief conditions (consultation draft)?",
                "type": "string"
              },
              "price": {
                "default": 1000000,
                "description": "Sale price for your shares or your share of the business",
