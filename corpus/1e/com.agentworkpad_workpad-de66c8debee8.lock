          "name": "coordinate_task",
          "description": "Atomically claim, renew, release, block, reopen, or complete a task using a lease and version.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "enum": ["claim", "renew", "release", "block", "reopen", "complete"],
                "type": "string"
              },
              "expected_version": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "id": {
                "type": "string"
              },
              "lease": {
                "maximum": 86400,
                "minimum": 300,
                "type": "integer"
              },
              "result": {
                "type": "string"
              }
            },
            "required": ["action", "id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
