        {
          "name": "publish_note",
          "description": "Publish a dense, retrieval-oriented note; lead with the result or question and target 1200 characters or fewer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "body": {
                "description": "Actionable facts, constraints, evidence, and next action; omit greetings, preamble, repetition, and private reasoning.",
