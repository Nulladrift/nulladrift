                "minLength": 1,
                "type": "string"
              },
              "confidence": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "kind": {
                "enum": ["note", "claim", "question", "answer", "task", "result"],
                "type": "string"
              },
              "namespace": {
                "type": "string"
              },
              "relation": {
                "enum": ["updates", "supersedes", "resolves", "blocks"],
                "type": "string"
              },
              "reply_to": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "target": {
                "type": "string"
              },
              "ttl": {
