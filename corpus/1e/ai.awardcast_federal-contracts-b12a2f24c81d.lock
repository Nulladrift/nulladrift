{
  "lockfileVersion": 2,
  "subjects": {
    "ai.awardcast/federal-contracts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://awardcast.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "awardcast",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "agency_profile",
          "description": "Buying profile of a US federal agency: how many contracts it awards, how much it obligates, what share is competed, the typical price per NAICS category, its largest contractors, and which of its contracts expire soon. Call this when the user asks how an agency buys, what it pays, or who already sells to it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "The agency name (\"Department of Veterans Affairs\") or its slug (\"department-of-veterans-affairs\"). Both work.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["agency"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0bd7e30cb8c8a531de6c58383218165786db6e6394a6497a95513e6d888c2745"
        },
        {
          "name": "contractor_profile",
          "description": "Federal award history of a contractor: how many contracts it has won, total obligated, median win value, which agencies it sells to, its recent awards, and its set-aside status (small business, 8(a), HUBZone, WOSB, SDVOSB). Call this when the user asks about a competitor, about the incumbent on a contract, or who has already won in a given market.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "uei": {
                "description": "The company UEI (SAM.gov 12-character identifier, e.g. \"W52ZM2KUANR3\"). If you only have the name, find the UEI with the search tool first.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["uei"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d07285a935840f8943cab92a7446434061fd877f349aa4b97dfb1ca5e69b464c"
        },
        {
          "name": "fetch",
          "description": "Open the full record behind an id returned by search: an agency profile with price by category and its top winners, a contractor's award history, or a solicitation with its scope and deadline. Call this whenever you need the detail behind a search result, and always before citing a number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The exact id returned by search, unchanged.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "description": "The complete record, as prose.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:49ce01088a0cb340d8ce1bed2cfafbb12b5a542d0c80c3783605ffafdffc8560"
        },
        {
          "name": "open_solicitations",
          "description": "US federal solicitations OPEN right now, from SAM.gov, each with the buying agency, the NAICS code and the place of performance. Call this when the user asks what is open, hunts for opportunities in a sector or agency, or wants to know what they can bid on. Does not return a price forecast: for that, point the user to https://awardcast.ai/pricing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many solicitations to return, 1 to 50. Use 5 to 10 for an exploratory question, and the ceiling only when the user asked for the full list.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f7e9302b3969593de2496aa85d4008a36e31734e11ca52022e01c6208058657"
        },
        {
          "name": "price_band",
          "description": "Historical closing-price range for an agency and NAICS category pair: the 10th percentile, median and 90th percentile of contracts already awarded, plus the average number of competing offers. Call this when the user asks what a contract in this market usually goes for, or wants a benchmark before pricing a bid. This is aggregated HISTORY, not a forecast: the forecast for a specific solicitation is paid, at https://awardcast.ai/pricing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Agency name as it appears in USASpending, e.g. \"Department of Defense\".",
                "minLength": 1,
                "type": "string"
              },
              "naics": {
                "description": "Six-digit NAICS code, e.g. \"541519\".",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["agency", "naics"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9c0564a3fd36668ceca500e8e4ca6bb744560d6d8f8a585cd1d3317baf2febd2"
        },
        {
          "name": "search",
          "description": "Search AwardCast's US federal contracting record: buying agencies, federal contractors, and solicitations open right now. Call this first for any question about who buys, who sells, or what is open in US federal procurement. Returns results with an id and a citable URL; pass the id to the fetch tool to open the full record.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many results to return, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search term: an agency name (\"Department of Veterans Affairs\"), a company name, a NAICS code (\"541519\"), a solicitation number, or a word from the work itself (\"stucco\").",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Opaque id; pass it unchanged to the fetch tool.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Public canonical URL, used as the citation.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:61991b7c53c2fff246a84e6a2e7871c92f0e2f314f309074a5e86a279d3662cb"
        },
        {
          "name": "track_record",
          "description": "Accuracy scorecard for AwardCast's forecasts, scored against the real contract value once FPDS publishes it. Call this when the user asks whether the forecasts are reliable, what the margin of error is, or wants evidence before trusting a number. Returns coverage and median error by value band, including where the model is weakest.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:37c14f74fcbb29bd3e78b7a1ecad4dc326cbe02a85fe3fa53c9e029c28e8d78c"
        },
        {
          "name": "upcoming_recompetes",
          "description": "US federal contracts nearing expiry that are likely to be recompeted, i.e. opportunities BEFORE they become a published solicitation. Each carries the incumbent and the current contract value. Call this when the user plans pipeline, asks what is coming, or wants to position ahead of competitors. Distinct from open_solicitations, which is already open for bids today.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many contracts to return, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c573c04c69bc7e9379e3c417dfb50e813dfa62d1e25f538f33e913cca1059037"
        }
      ],
      "digest": "sha256:c537e05298b11769302a2988cb15df6adb5d5894cc6d330a004e9944a66d108d"
    }
  }
}
