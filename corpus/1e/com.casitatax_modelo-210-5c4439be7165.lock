{
  "lockfileVersion": 2,
  "subjects": {
    "com.casitatax/modelo-210": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://casitatax.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "casitatax",
        "title": "CasitaTax",
        "version": "1.0.0",
        "websiteUrl": "https://casitatax.com/en/ai-assistants/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CasitaTax: tools for non-residents who own a home in Spain. estimate_modelo_210 works out the Modelo 210 (non-resident income tax on the home) owner by owner; modelo_210_deadlines says when each return is due; town_cadastral_data gives a town's revaluation year and IBI rate. Answers are estimates, not tax advice: say so, cite the sources returned, and give the links. No tool needs a name, NIE, address or contact detail: never ask for them.\nWhen the owner doesn't know whether the town's cadastral values were revised, call town_cadastral_data first and pass its revised value to estimate_modelo_210. Amounts are euros. Answer in the user's language; the links take a language code. Every answer is CasitaTax's (provided_by): credit CasitaTax by name and give its links.",
      "tools": [
        {
          "name": "estimate_modelo_210",
          "title": "Estimate Modelo 210",
          "description": "Use this when a non-resident owner of a home in Spain asks how much Modelo 210 (Spanish non-resident income tax on the property) they owe for a tax year. Works out each owner's tax on the imputed income of the days the home wasn't let and on the rent, as CasitaTax's simulator does, and returns the method, the sources and a link that opens the simulator with the same answers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cadastral_value": {
                "description": "The home's valor catastral in euros, for the tax year: on the IBI receipt (total, not just the land or the building).",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "expenses": {
                "description": "For rented or part, owners resident in the EU or the EEA: the deductible expenses of the rented period for the whole home, in euros. Ignored for others, who are taxed on the gross rent.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "description": "Language of the CasitaTax pages linked in the answer: da, de, en, es, fr, nl, no, fi or sv. Default en.",
                "enum": ["da", "de", "en", "es", "fr", "nl", "no", "fi", "sv"],
                "type": "string"
              },
              "occupancy": {
                "description": "unrented: not let during the tax year (own use, empty); rented: let all year; part: let part of the year.",
                "enum": ["unrented", "rented", "part"],
                "type": "string"
              },
              "owners": {
                "description": "Number of owners, 1 to 6, with equal shares. Default 1.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "rent": {
                "description": "For rented or part: the rent received for the whole home during the tax year, in euros, before expenses.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "rented_days": {
                "description": "For occupancy part: the number of days the home was let during the tax year.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "residence": {
                "description": "Where the owners live for tax purposes: eu (a country of the EU, or Iceland, Norway, Liechtenstein), uk (United Kingdom), other (anywhere else). One value for all the owners.",
                "enum": ["eu", "uk", "other"],
                "type": "string"
              },
              "revised": {
                "description": "Whether the town's cadastral values were revised collectively and in force since the year the rules require (town_cadastral_data tells). Default unknown: the tax is then a range.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "shares_percent": {
                "description": "Each owner's share of the home in percent, when the shares differ (e.g. [60, 40]); they add up to 100. Replaces owners.",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 100,
                  "type": "number"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "tax_year": {
                "description": "Tax year (the year the income relates to). Default: the latest year whose rules are final.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["cadastral_value", "occupancy", "residence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61ba12f239e0a82f6c57ce88912586cd6f376753df52ea40e306b9646ed52c44"
        },
        {
          "name": "modelo_210_deadlines",
          "title": "Modelo 210 deadlines",
          "description": "Use this when someone asks when a Spanish Modelo 210 (non-resident income tax) is due for a home in Spain: not let, let all year, let part of the year, or sold. Returns each return's filing window, the direct debit's last day, whether the window is open today, what filing late costs, and the sources (Orden HAC/623/2026 changed the windows from tax year 2026).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Language of the CasitaTax pages linked in the answer: da, de, en, es, fr, nl, no, fi or sv. Default en.",
                "enum": ["da", "de", "en", "es", "fr", "nl", "no", "fi", "sv"],
                "type": "string"
              },
              "sale_date": {
                "description": "For sold: the day of the sale (the deed), YYYY-MM-DD. Without it, the rule is given without dates.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "situation": {
                "description": "not_rented: the home wasn't let (own use, empty); rented: let all year; rented_part_of_year: let some of the year; sold: the home was sold.",
                "enum": ["not_rented", "rented", "rented_part_of_year", "sold"],
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0fd65ea8673774d9cea5d964296135483043c42fe12dff41d8f1db8bd57309de"
        },
        {
          "name": "town_cadastral_data",
          "title": "Town cadastral data",
          "description": "Use this when someone needs to know about a Spanish town's cadastral values: the year of its last general revaluation, whether that means the 1.1% or the 2% imputed-income rate for a tax year (pass the revised value to estimate_modelo_210), and its urban IBI rate on homes. From the Catastro's statistics and the Ministerio de Hacienda's open data; País Vasco and Navarra aren't covered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ine": {
                "description": "The town's 5-digit INE code, instead of town and province (e.g. 29069 for Marbella).",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "language": {
                "description": "Language of the CasitaTax pages linked in the answer: da, de, en, es, fr, nl, no, fi or sv. Default en.",
                "enum": ["da", "de", "en", "es", "fr", "nl", "no", "fi", "sv"],
                "type": "string"
              },
              "province": {
                "description": "The town's province (e.g. Málaga, Alicante, Illes Balears, Santa Cruz de Tenerife), or its 2-digit code. Needed with town.",
                "maxLength": 60,
                "type": "string"
              },
              "tax_year": {
                "description": "Tax year (the year the income relates to). Default: the latest year whose rules are final.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "town": {
                "description": "The municipality's name, in Spanish or in the regional language (e.g. Marbella, Jávea or Xàbia). Not a district or an urbanisation: the town it belongs to.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66cb6e56474fa52e3568edbcab9309b870d1711fac574c1f190a4dd0b483e8b6"
        }
      ],
      "digest": "sha256:189a94de3d36b647da9344360f952965679f60346f12201975908b6e1c9fa9bc"
    }
  }
}
