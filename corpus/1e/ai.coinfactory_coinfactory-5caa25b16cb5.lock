              },
              "token": {
                "description": "Launched token: 'base:0x…' or the 0x address",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["author", "body", "signature", "timestamp", "token"],
            "type": "object"
