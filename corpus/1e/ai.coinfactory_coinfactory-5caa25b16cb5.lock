        {
          "name": "build_swap_transaction",
          "title": "Build swap transaction (Base)",
          "description": "Returns an UNSIGNED Base transaction (and an ERC-20 approval transaction if needed) that performs the swap with the 1% CoinFactory fee embedded. The taker wallet must sign and broadcast it; CoinFactory never submits transactions. Swaps INTO critical-risk tokens are refused; high-risk tokens require acknowledgeRisk: true after relaying the risk signals to the user. Per-trade cap during beta: $1000. Non-custodial: CoinFactory returns aggregator calldata only and never holds funds or keys; the taker wallet signs and broadcasts. A 1% CoinFactory fee plus aggregator fees and gas apply and are shown in the quote. Trades are irreversible. This is not financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acknowledgeRisk": {
                "description": "Required true when the buy token is rated high risk",
                "type": "boolean"
              },
              "buyToken": {
                "$ref": "#/properties/sellToken"
              },
              "sellAmount": {
                "description": "Amount of sellToken in human units, e.g. '0.5'",
                "pattern": "^\\d*\\.?\\d+$",
                "type": "string"
              },
              "sellToken": {
                "description": "'ETH', a Base contract address, a symbol, or a CoinGecko id",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "slippageBps": {
                "description": "Max slippage in bps (default 100, max 500)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "taker": {
                "description": "The wallet address that will sign — must hold the sellToken",
                "type": "string"
              }
            },
            "required": ["buyToken", "sellAmount", "sellToken", "taker"],
            "type": "object"
          },
