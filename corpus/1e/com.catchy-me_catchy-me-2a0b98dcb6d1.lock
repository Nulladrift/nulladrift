      "instructions": "Catchy (catchy-me.com) finds B2B leads on LinkedIn with proven facts about each person, then writes personal outreach messages to them with AI. These tools act in the user's own Catchy account, exactly as the web app does.\n\nAccount: without a key only catchy_info, list_plans and the sign-up / sign-in tools run; calling an account tool makes the client sign in (OAuth). An agent may register its user itself: sign_up (only after the user agreed to the Terms of Use and the Privacy Policy: catchy_info gives the links) -> the user reads the emailed code -> confirm_sign_up returns an API key (shown once; send it as Authorization: Bearer <key>). An existing account: sign_in. Plans: list_plans, subscribe (a LavaTop payment link the user opens and pays; poll get_payment_status), get_subscription, cancel_subscription (ask first). Balance: get_account, get_balance_history.\n\nWorkflow of a lead search («поиск лидов»):\n1. Onboarding (optional helpers): suggest_company_description -> suggest_goals -> suggest_audiences; pass the returned onboarding_id to every later helper and to create_search. Earlier onboardings can be reused (list_previous_onboardings, get_onboarding_prefill). People already known can be excluded (parse_exclusions_file, list_exclusion_sources).\n2. create_search(company, goal, icp): the requirements are compiled (1-2 min). Poll get_search every 20-30 s until status is ready.\n3. Review: get_search(detail=spec) shows the criteria, pains, counter-signals and the search method; change them with the user if needed (edit_criterion, edit_search_spec, edit_pain, edit_counter_signal, set_search_strategy).\n4. Price and run: quote_search(leads=N) gives the price in credits; show it, get the user's explicit yes, then run_search(leads=N, confirm_credits=credits_high). Poll get_search every 30-60 s; it says what to do next (`next`). A search may ask about a higher price (status asking): ask the user (control_search continue with the shown credits, stop, or diagnose_search + revise_search).\n5. Results: list_leads (fit, partial, miss), get_lead (dossier with dated facts and sources), export_search (download link), continue_search for more leads, quote_facts_on_request + start_facts_on_request to prove partial people, demote_lead.\n6. Outreach («Рассылка») on a finished search: get_outreach shows the setup and the next step: new_outreach, set_outreach_sender, suggest_outreach_essence + set_outreach_essence, set_outreach_funnel, quote_outreach + start_outreach; then get_outreach_lead per person, edit_outreach_message, quote_message_rewrite + rewrite_message, export_outreach. Catchy never sends messages: the user copies them.\n\nMoney and briefs:\n- Prices are whole credits. Every tool that spends credits needs confirm_credits from its quote tool: ALWAYS show the price to the user and wait for their yes; never confirm on your own. A quote changes nothing.\n- A new setup (a search onboarding or an outreach generation) spends one brief («бриф») of the plan's period; inside it everything goes on. A free account has one search brief and no outreach. get_account shows the plan, briefs left and the balance.\n- Errors carry a code and a message in the user's language; relay the message. Common codes: subscription_required, no_briefs (renews_at), low_balance (need_credits), price_changed (quote again), legal_pending (the Terms / Privacy Policy were updated: the user accepts them in the web app, or you show the user the links https://catchy-me.com/terms and https://catchy-me.com/privacy and, only after their explicit yes, call accept_legal(confirm=true)), key_read_only (this key only reads).\n\nLong work returns at once: poll the state tool the answer names, no faster than every 20 s. Answer the user in their language (get_account user.lang); the texts of a search are in the language it was made in.",
