        {
          "name": "create_search",
          "title": "Create a lead search",
          "description": "Creates a new lead search («поиск лидов») from the onboarding answers and starts compiling its requirements (~1-2 minutes; nothing is charged in credits, but it spends the onboarding's brief if no assistant did). Then poll get_search every 20-30 s until status is `ready`, review the spec with the user (get_search detail=spec), and only then quote and run it. company and icp are required. [REST: POST /api/tasks]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "What the user's company does (step 1).",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "exclude_companies": {
                "description": "Also leave out the companies of those people.",
                "type": "boolean"
              },
              "exclude_company_urls": {
                "items": {
                  "maxLength": 300,
                  "type": "string"
                },
                "maxItems": 5000,
                "type": "array"
              },
              "exclude_scope": {
                "description": "From those searches: everyone analysed (all) or only leads.",
                "enum": ["all", "leads"],
                "type": "string"
              },
              "exclude_tasks": {
                "description": "Earlier searches whose people to leave out.",
                "items": {
                  "pattern": "^[A-Za-z0-9_\\-]{1,80}$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "exclude_urls": {
                "description": "LinkedIn profile links of people to leave out.",
                "items": {
                  "maxLength": 300,
                  "type": "string"
                },
                "maxItems": 50000,
                "type": "array"
              },
              "goal": {
                "description": "What the outreach should achieve (step 2).",
                "maxLength": 2000,
                "type": "string"
              },
              "icp": {
                "description": "Whom to find: the customer profile (step 3).",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language of the outreach messages (default english).",
                "enum": ["english", "russian"],
                "type": "string"
              },
              "onboarding_id": {
                "description": "The onboarding id that ties the assistant calls and create_search into ONE brief. Omit it on the first call: the answer gives one; pass it to every later assistant call and to create_search of the same new search.",
                "pattern": "^[A-Za-z0-9-]{8,64}$",
