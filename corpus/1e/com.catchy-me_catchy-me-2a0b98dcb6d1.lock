                "pattern": "^[A-Za-z0-9_\\-]{1,80}$",
                "type": "string"
              },
              "text": {
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "The spec version from get_search (optional: protects against an edit made meanwhile in the web).",
