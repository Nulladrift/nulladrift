          "title": "Accept the updated Terms and Privacy Policy",
          "description": "Records that the user accepted the current Terms of Use (https://catchy-me.com/terms) and took note of the current Privacy Policy (https://catchy-me.com/privacy). Use it when a tool answered legal_pending: first show the user both links and ask whether they accept the updated Terms; call it with confirm=true ONLY after the user explicitly agreed — never on your own. The other tools work again after it. The user may instead accept them in the Catchy web app. [REST: (as POST /api/legal/accept)]",
