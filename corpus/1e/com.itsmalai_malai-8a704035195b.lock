        {
          "name": "malai_log_food",
          "title": "Log food",
          "description": "MALAI: Log food or drink the user says they ate into their MALAI food log, from their own words, e.g. \"2 boiled eggs\", \"a protein shake\", \"half my chicken rice bowl\". Use whenever the user says they ate, drank, or want to log something. Step 1: call with text only; MALAI returns matching options from its food database and the user's saved recipes. Step 2: confirm the right option with the user (or pick the clear best match), then call again with itemId, itemType and amount/unit. Returns what was logged and today's updated protein. Pass requestId on step 2 so a retry never logs twice. The returned entryId identifies the entry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "How much: number of servings, or grams/ml when unit is g/ml. Defaults to 1 serving.",
                "exclusiveMinimum": 0,
                "maximum": 5000,
                "type": "number"
              },
              "consumedAt": {
                "description": "When they ate it, ISO 8601. Defaults to now.",
                "format": "date-time",
                "type": "string"
              },
              "itemId": {
                "description": "Exact item from an earlier MALAI result (options or logWith). Requires itemType.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "itemType": {
                "description": "Type of itemId.",
                "enum": ["food", "recipe"],
                "type": "string"
              },
              "meal": {
                "description": "Meal time, if the user said it.",
                "enum": ["breakfast", "lunch", "dinner", "snack"],
                "type": "string"
              },
              "recommendationId": {
                "description": "Pass through from malai_suggest_next_meal logWith, if logging a suggestion.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "requestId": {
                "description": "A unique id you create for this log (e.g. a UUID). Send the same id when retrying so the food is never logged twice.",
                "maxLength": 100,
                "minLength": 8,
                "type": "string"
              },
              "text": {
                "description": "What the user ate, in their words, e.g. \"2 boiled eggs\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "unit": {
                "description": "Unit for amount. Defaults to serving.",
                "enum": ["serving", "g", "ml"],
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entry": {
                "additionalProperties": false,
                "description": "The logged entry, when logged is true.",
                "properties": {
                  "consumedAt": {
                    "type": "string"
                  },
                  "entryId": {
                    "type": "string"
                  },
                  "meal": {
                    "anyOf": [
                      {
                        "enum": ["breakfast", "lunch", "dinner", "snack"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "name": {
                    "type": "string"
                  },
                  "nutrition": {
                    "additionalProperties": {},
                    "type": "object"
                  },
                  "quantity": {
                    "type": "number"
                  },
                  "unit": {
                    "type": "string"
                  }
                },
                "required": ["consumedAt", "entryId", "meal", "name", "nutrition", "quantity", "unit"],
                "type": "object"
              },
              "instruction": {
                "type": "string"
              },
              "logged": {
                "description": "True when an entry was written. False means choose an option and call again.",
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "needsChoice": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "options": {
                "description": "Matches to confirm with the user; pass the chosen itemId and itemType back.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "defaultUnit": {
                      "type": "string"
                    },
                    "itemId": {
                      "type": "string"
                    },
                    "itemType": {
                      "enum": ["food", "recipe"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "savedByUser": {
                      "type": "boolean"
                    }
                  },
                  "required": ["defaultUnit", "itemId", "itemType", "name", "savedByUser"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              },
              "today": {
                "additionalProperties": false,
                "properties": {
                  "protein_eaten_g": {
                    "type": "number"
                  },
                  "protein_left_g": {
                    "type": ["number", "null"]
                  },
                  "protein_target_g": {
                    "type": ["number", "null"]
                  }
                },
                "required": ["protein_eaten_g", "protein_left_g", "protein_target_g"],
                "type": "object"
              }
            },
            "required": ["logged", "note"],
            "type": "object"
          },
