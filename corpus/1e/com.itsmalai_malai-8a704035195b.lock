        {
          "name": "malai_calculate_protein_target",
          "title": "Protein target",
          "description": "MALAI: Calculate a daily protein range for someone on a GLP-1 medication from their body weight: 1.2–1.6 g per kg, the 2025 joint advisory range for weight loss, split into per-meal amounts. Same method as MALAI's protein calculator. Use for \"how much protein should I eat on Zepbound\", \"I weigh 210 lb, what's my protein target\". Don't use for a signed-in user's saved MALAI target (that is malai_get_nutrition_targets).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "meals_per_day": {
                "description": "Meals to spread protein across. Default 4.",
                "maximum": 6,
                "minimum": 2,
                "type": "integer"
              },
              "weight": {
                "description": "Current body weight.",
                "exclusiveMinimum": 0,
                "maximum": 700,
                "type": "number"
              },
              "weight_unit": {
                "description": "Unit of weight.",
                "enum": ["kg", "lb"],
                "type": "string"
              }
            },
            "required": ["weight", "weight_unit"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "basis": {
                "type": "string"
              },
              "daily_protein_g": {
                "additionalProperties": false,
                "properties": {
                  "high": {
                    "type": "number"
                  },
                  "low": {
                    "type": "number"
                  }
                },
                "required": ["high", "low"],
                "type": "object"
              },
              "meals_per_day": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "per_meal_g": {
                "$ref": "#/properties/daily_protein_g"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "weight_kg": {
                "type": "number"
              }
            },
            "required": ["basis", "daily_protein_g", "meals_per_day", "note", "notes", "per_meal_g", "source", "weight_kg"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
