          "title": "Body profile",
          "description": "MALAI: Read the user's body profile in MALAI: age, sex, height, weight, activity level, goal and units. Use before advice that depends on their body or goal. If isPlaceholder is true the profile was never filled in; tell the user and suggest completing it in the MALAI app rather than quoting numbers based on it.",
