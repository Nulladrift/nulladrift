        {
          "name": "malai_get_food_log",
          "title": "Food log",
          "description": "MALAI: Read what the user actually logged in MALAI across a date range: their real history, not a plan. Use for \"what did I eat yesterday\", \"what did I have this week\", \"how has my protein been lately\". Defaults to the last 7 days. Returns each entry with its entryId, meal and nutrition, and a total.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "endDate": {
                "description": "Last day, YYYY-MM-DD, inclusive. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "startDate": {
                "description": "First day, YYYY-MM-DD, in the user's time zone. Defaults to 6 days before today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "number"
              },
              "entries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "consumedAt": {
                      "type": "string"
                    },
                    "entryId": {
                      "type": "string"
                    },
                    "loggedItemType": {
                      "type": "string"
                    },
                    "meal": {
                      "anyOf": [
                        {
                          "enum": ["breakfast", "lunch", "dinner", "snack"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "type": "string"
                    },
                    "nutrition": {
                      "additionalProperties": {},
                      "type": "object"
                    },
                    "quantity": {
                      "type": "number"
                    },
                    "unit": {
                      "type": "string"
                    }
                  },
                  "required": ["consumedAt", "entryId", "loggedItemType", "meal", "name", "nutrition", "quantity", "unit"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "summary": {
                "additionalProperties": {},
                "description": "Totals across the returned entries.",
                "type": "object"
              }
            },
            "required": ["count", "entries", "note", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
