{
  "lockfileVersion": 2,
  "subjects": {
    "co.instapi/instagram": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://instapi.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "instapi",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Instagram data for agents. Call get_started first: it's free and shows your account status and how to get an API key.",
      "tools": [
        {
          "name": "get_started",
          "title": "Get started with instapi",
          "description": "Free, no auth. Service overview, pricing, current account status, and how to get an API key for the data tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3d11766d0fcd9fe0227d5d36746eb27e1a54c84fab73b874a8a77ce0c32825d1"
        },
        {
          "name": "instagram_search",
          "title": "Search Instagram",
          "description": "Search Instagram users, hashtags, and places by keyword. Costs 1 credit. Requires Authorization: Bearer sk_instapi_... on the MCP connection.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Search keyword, e.g. a name, brand, or topic",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4f53f53336f7ec99cdf85958da0494db34325a5e516ffeee3fa689b2e9859b49"
        },
        {
          "name": "instagram_user_posts",
          "title": "Get a user's posts",
          "description": "Fetch recent posts for an Instagram username, with images and videos AI-parsed into text descriptions. Costs 1 credit. Requires Authorization: Bearer sk_instapi_.... First fetch for a user can take up to ~60s while media is analyzed; cached users return fast.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "count": {
                "default": 12,
                "description": "Number of most recent posts, newest first (default 12, max 30)",
                "exclusiveMinimum": 0,
                "maximum": 30,
                "type": "integer"
              },
              "username": {
                "description": "Instagram username, without @",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:04d993041b3cf801764b5d743b3273a02cfa5755dcc1a0ed12a6ca28cc12661d"
        },
        {
          "name": "instagram_user_profile",
          "title": "Get a user's profile",
          "description": "Public profile for an Instagram username: bio, links, follower/following/post counts, verified/private/business flags, category. Works for private accounts too. Costs 1 credit (refunded if the user doesn't exist). Requires Authorization: Bearer sk_instapi_....",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "username": {
                "description": "Instagram username (bare, @handle, or profile URL)",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:48961c001525aa10a801641a733b9c557e251a45ad3949274581f680482ecf7d"
        }
      ],
      "digest": "sha256:e0aa9ef7c0e6abea3259d490178ad320b0b95b06af480fab175dbe1c127516b0"
    }
  }
}
