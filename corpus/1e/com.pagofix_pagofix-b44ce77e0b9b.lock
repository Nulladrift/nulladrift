      "serverInfo": {
        "name": "pagofix",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PagoFix is free self-service software for EU B2B late payments. These MCP tools only draft and never send. Letters are sent by the creditor, or by PagoFix by email in the creditor’s name if the creditor asks for it in their PagoFix account. Court forms are always filed by the creditor. Money goes straight to the creditor.",
      "tools": [
        {
          "name": "calc_claim",
          "description": "Calculate statutory late-payment interest (per half-year period), the fixed compensation for recovery costs and the total for an unpaid EU B2B invoice. Each number comes with its legal reference.",
          "inputSchema": {
            "properties": {
              "accountHolder": {
                "type": "string"
              },
              "amount": {
                "description": "Invoice amount (principal) in EUR",
                "type": "number"
              },
              "bic": {
                "type": "string"
              },
              "calcDate": {
                "description": "YYYY-MM-DD, default today",
                "type": "string"
              },
              "creditorAddress": {
                "type": "string"
              },
              "creditorCountry": {
                "description": "EU country code, e.g. EE",
                "type": "string"
              },
              "creditorName": {
                "type": "string"
              },
              "creditorVat": {
                "type": "string"
              },
              "currency": {
                "default": "EUR",
                "enum": ["EUR"],
                "type": "string"
              },
              "debtorAddress": {
                "type": "string"
              },
              "debtorCountry": {
                "description": "EU country code, e.g. DE",
                "type": "string"
              },
              "debtorEmail": {
                "type": "string"
              },
              "debtorName": {
                "type": "string"
              },
              "debtorType": {
                "default": "company",
                "enum": ["company", "sole_trader", "consumer"],
                "type": "string"
              },
              "debtorVat": {
                "type": "string"
              },
              "dueDate": {
                "description": "YYYY-MM-DD, or null/\"none\" if no payment term was agreed (then 30 days after receipt)",
                "type": ["string", "null"]
              },
              "eurPlnRate": {
                "description": "Only for Polish law: NBP EUR/PLN average rate (last working day of the month before the due month)",
                "type": "number"
              },
              "iban": {
                "type": "string"
              },
              "invoiceDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "invoiceNumber": {
                "type": "string"
              },
              "lawCountry": {
                "description": "Country whose late-payment law applies (default: creditorCountry)",
                "type": "string"
              },
              "paymentReference": {
                "type": "string"
              },
              "receiptDate": {
                "description": "YYYY-MM-DD, date the debtor received the invoice (only used when there is no due date)",
                "type": "string"
              },
              "senderName": {
                "type": "string"
              }
            },
            "required": ["amount", "creditorCountry", "debtorCountry", "invoiceDate"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4942ba5553026b4ad6033f28f0a408e77217a0c82c400eace074ace9f46deb6c"
        },
