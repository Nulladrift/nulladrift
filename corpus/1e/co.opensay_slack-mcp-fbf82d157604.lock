{
  "lockfileVersion": 2,
  "subjects": {
    "co.opensay/slack-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.opensay.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "opensay-slack-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "opensay_create_pulse_survey",
          "title": "Draft or Send Confidential 1-on-1 DM Pulse Survey (Admin)",
          "description": "Drafts (dryRun=true by default) or dispatches a confidential 1-on-1 Slack DM pulse survey to the workspace or a specific Slack usergroup. Responses remain anonymous with aggregated score distributions in app.opensay.co.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "allowComments": {
                "default": true,
                "description": "Allow optional anonymous text follow-up.",
                "type": "boolean"
              },
              "dryRun": {
                "default": true,
                "description": "When true (default), previews the validated payload without sending DMs. Set false only after explicit user confirmation.",
                "type": "boolean"
              },
              "options": {
                "description": "2 to 5 concise answer choices.",
                "items": {
                  "maxLength": 75,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "question": {
                "description": "Pulse survey question sent via private Slack DM.",
                "maxLength": 300,
                "minLength": 5,
                "type": "string"
              },
              "targetUsergroupId": {
                "description": "Optional Slack usergroup ID; omit to target the entire workspace.",
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["options", "question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:df7944396333c4ea6bd598b3c0bb9ae3371efe257df9d4beb1e1e3311663b2db"
        },
        {
          "name": "opensay_draft_workflow_plan",
          "title": "Draft OpenSay Slack Rollout Plan",
          "description": "Generates a tailored rollout plan, recommended Slack channel configuration, dashboard checklist, and ready-to-post team announcement for an OpenSay use case.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "channelName": {
                "description": "Target Slack channel name (e.g., #all-hands-ama or #whisper-hr).",
                "maxLength": 80,
                "type": "string"
              },
              "teamName": {
                "description": "Team or company name for the rollout announcement.",
                "maxLength": 80,
                "type": "string"
              },
              "useCase": {
                "description": "Target OpenSay workflow to roll out.",
                "enum": ["anonymous_messages", "whistleblower_hotline", "suggestion_box", "pulse_surveys", "shoutouts", "general"],
                "type": "string"
              }
            },
            "required": ["useCase"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b58d5901d9490a754df38957cd895ed7ff7a4ea4e7b3c5f337e7fe12c36dfc58"
        },
        {
          "name": "opensay_estimate_pricing",
          "title": "Estimate OpenSay Pricing",
          "description": "Calculates exact OpenSay for Slack Business (flat workspace tiers up to 1,000 members) or Enterprise (1,001+ members) pricing, annual savings (2 months free), Freemium tier, and 7-day free Business trial terms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "billingCycle": {
                "default": "annual",
                "description": "Billing cadence. Annual billing includes 2 months free.",
                "enum": ["monthly", "annual"],
                "type": "string"
              },
              "memberCount": {
                "description": "Total active Slack workspace members (e.g., 45, 220, 1500).",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["memberCount"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d8ad6ea41a295b3ad80cc8ff9bc9355c0dab5e8fd4c2f5b490d56c2afa7210c9"
        },
        {
          "name": "opensay_get_compliance_and_security",
          "title": "Get OpenSay Compliance & Security Architecture",
          "description": "Retrieves OpenSay cryptographic anonymity architecture (one-way nonce-salted SHA-256 with rotating secret peppers), regulatory alignment (EU Whistleblower Directive 2019/1937, US SOX § 301, ISO 37002, GDPR), AI moderation guardrails, and links to DPA, Security, Permission Scopes, and Subprocessors.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:06e6f21f424733d01f3fd70de2d0ddd46fb259fcd8b4480b493fdc8a087c1820"
        },
        {
          "name": "opensay_get_install_link",
          "title": "Get OpenSay Add-to-Slack Install Link",
          "description": "Returns the official 1-click Add to Slack OAuth installation link for OpenSay (requires human Slack Workspace Admin approval), Slack App Directory listing, 7-day free Business trial details, and onboarding steps.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clientName": {
                "description": "Optional AI client name for attribution (e.g., claude, cursor, chatgpt).",
                "maxLength": 32,
                "type": "string"
              },
              "useCase": {
                "description": "Primary team use case (anonymous_messages, whistleblower_hotline, suggestion_box, pulse_surveys, shoutouts, general).",
                "enum": ["anonymous_messages", "whistleblower_hotline", "suggestion_box", "pulse_surveys", "shoutouts", "general"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9086c41db1f1b1da43790d250978b7a614a1eba1a39b90092ccf4765d92c4d48"
        },
        {
          "name": "opensay_get_workspace_status",
          "title": "Get Workspace Plan & Configuration Status (Admin)",
          "description": "Fetches high-level workspace status (plan, 7-day trial status, member count, whitelist/whisper/AI moderation flags) for an authenticated Slack or OpenSay Admin. Never returns user identities or message-to-user mappings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1a8a09bb62fb4604b66d385d33ee66d4c6a6100d9ab58f8b2a64b097794aafa0"
        }
      ],
      "resources": [
        {
