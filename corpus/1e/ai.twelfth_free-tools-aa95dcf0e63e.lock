{
  "lockfileVersion": 2,
  "subjects": {
    "ai.twelfth/free-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://twelfth.ai/tools/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "twelfth-free-tools",
        "title": "twelfth free tools",
        "version": "1.0.0",
        "description": "Free, no-sign-in check of how well a product page reads to AI shopping agents.",
        "websiteUrl": "https://twelfth.ai/tools/agent-readiness",
        "icons": [
          {
            "src": "https://twelfth.ai/brand/twelfth-cell-badge-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free tools from twelfth for retailers and anyone who sells online. check_product_page grades how well one public product page reads to AI shopping agents. No account is needed; for a retailer's own sales, stock and pricing, twelfth's workspace MCP at https://api.twelfth.ai/mcp needs a twelfth sign-in.",
      "tools": [
        {
          "name": "check_product_page",
          "title": "Check a product page for AI shopping agents",
          "description": "Check how well one public product page reads to AI shopping agents (ChatGPT, Gemini, Perplexity). Use it when someone asks whether their product pages are ready for AI shopping or agentic commerce, why an assistant gets a product's price or stock wrong, or to audit Product structured data before a launch. It fetches the page once and grades its schema.org Product markup against the published Google merchant listing and OpenAI product feed specs, returning a 0 to 100 score, each check with what is missing and why it matters, unscored signals on whether AI crawlers can reach and read the page, the facts the markup states, and a shareable result link. A store that refuses automated requests is reported as blocked, never scored; a category or search page is refused. Server HTML only (markup added by JavaScript is not seen); each URL is cached for 24 hours; 10 checks an hour per address and 30 per store domain. For a retailer's own sales, stock and pricing, use twelfth's workspace MCP (https://api.twelfth.ai/mcp) instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The full public address of one product page, such as https://shop.example.com/products/blue-kettle. http or https on the standard ports only; private and internal addresses are refused.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "band": {
                "description": "agent_ready is 80 or more, has_gaps 50 to 79, hard_to_read under 50.",
                "enum": ["agent_ready", "has_gaps", "hard_to_read", "blocked", "unreadable"],
                "type": "string"
              },
              "blocked": {
                "description": "The store refused the request (bot wall, 403, 429 or robots.txt).",
                "type": "boolean"
              },
              "cached": {
                "description": "True when the result came from the 24-hour cache.",
                "type": "boolean"
              },
              "checkedAt": {
                "description": "When the page was fetched (ISO 8601); a cached result keeps its first time.",
                "type": "string"
              },
              "checks": {
                "description": "Each graded check with what was earned and what is missing.",
                "items": {
                  "properties": {
                    "earned": {
                      "type": "number"
                    },
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "note": {
                      "type": ["string", "null"]
                    },
                    "weight": {
                      "type": "number"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "description": "Why no score was given, or why the call was refused.",
                "type": ["string", "null"]
              },
              "finalUrl": {
                "description": "The address after redirects; null when the page could not be read.",
                "type": ["string", "null"]
              },
              "found": {
                "additionalProperties": {
                  "type": ["string", "null"]
                },
                "description": "What the page's Product markup states: name, brand, gtin, mpn, sku, image, price, currency, availability (null where absent).",
                "type": "object"
              },
              "limits": {
                "description": "What the check cannot see.",
                "type": "string"
              },
              "reason": {
                "description": "rate_limited when a limit was hit.",
                "type": "string"
              },
              "resultUrl": {
                "description": "Shareable result page on twelfth.ai.",
                "type": "string"
              },
              "retryAfterSeconds": {
                "description": "Seconds until a rate-limited caller may try again.",
                "type": "number"
              },
              "richResultsTestUrl": {
                "description": "Google's Rich Results Test for the same page.",
                "type": "string"
              },
              "score": {
                "description": "0 to 100; null when blocked or unreadable.",
                "type": ["number", "null"]
              },
              "signals": {
                "description": "Not scored: whether an agent can reach and read the page at all (AI crawlers allowed by robots.txt, readable without JavaScript, markdown or /llms.txt, Google's recommended variant fields). Absent from results cached before 27 Nov 2026.",
                "items": {
                  "properties": {
                    "key": {
                      "enum": ["ai_crawlers", "no_javascript", "markdown", "variant_fields"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["pass", "partial", "fail", "unknown"],
                      "type": "string"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "The address that was asked for.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a product page for AI shopping agents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c605e31b638cedb814f2dd34635dff28b6c2ff4ace25263723d5203c35f6321d"
        }
      ],
      "digest": "sha256:78a4eedbd7824fe8306dc7b666a9e2f85ed310d669a5b8ac6dd5b458b477514a"
    }
  }
}
