{
  "lockfileVersion": 2,
  "subjects": {
    "com.lokuli/lokuli": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lokuli.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lokuli",
        "title": "Lokuli: book local pros and get prices",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Lokuli (said \"locally\") books local service businesses and gets prices from them. Businesses bookable on Lokuli are mostly in California; getting prices (request_quotes) works anywhere in the US. To book a business on Lokuli: find_businesses (or get_business with its lokuli.com/shop link), then get_available_times, then book_appointment. The person confirms by text before anything is booked, and pays at the business. For a business that isn't on Lokuli, or to compare prices, use request_quotes: Lokuli phones pros near the person about the day and time they want and texts back prices. Always get the person's name and US mobile number first and tell them a text is coming.",
      "tools": [
        {
          "name": "book_appointment",
          "title": "Book an appointment (confirmed by text)",
          "description": "Holds an open time at a business for a person and texts them a link to confirm it. Nothing is booked, and the business isn't told, until they tap Confirm within 15 minutes; otherwise the time is released. After they confirm, the business accepts the request (or it's confirmed at once at instant-book businesses). Payment is at the business. Requires the person's name and US mobile number; the confirmation link is texted to that number. Businesses that take a card when booking return a booking page link instead of a hold.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "The business slug or lokuli.com/shop/... link",
                "type": "string"
              },
              "email": {
                "description": "Optional email for the business's confirmation",
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "type": "string"
              },
              "notes": {
                "description": "Optional note for the business (300 characters max)",
                "type": "string"
              },
              "phone": {
                "description": "The person's US mobile number; the confirmation link is texted here",
                "type": "string"
              },
              "service_id": {
                "description": "The id of the service to book",
                "type": "string"
              },
              "staff_id": {
                "description": "Optional team member id",
                "type": "string"
              },
              "start": {
                "description": "The open slot's start time (ISO), exactly as listed in the business's open times",
                "type": "string"
              }
            },
            "required": ["business", "name", "phone", "service_id", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book an appointment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce72b5c52e08d8a966d4a28f4c04907c0fbe0e5605f388d93f1af256ef61ad3d"
        },
        {
          "name": "check_coverage",
          "title": "Check if Lokuli serves a zip code",
          "description": "Checks whether Lokuli can call pros near a US zip code (any zip code in the 50 states and DC). Returns the place, state and time zone.",
          "inputSchema": {
            "properties": {
              "zip": {
                "description": "5-digit zip code",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if Lokuli serves a zip code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:baa1b5323f99025e9e7afe4e46536e47ac87231c2c13376c65f5fb46d7769ade"
        },
        {
          "name": "find_businesses",
          "title": "Find local businesses on Lokuli",
          "description": "Searches Lokuli for local service businesses near a US zip code or city. Most businesses on Lokuli are in California, a few in other states. Understands everyday and Spanish wording (\"deep clean\", \"fade\", \"mani pedi\", \"limpieza de casa\"). Returns businesses that can be booked through Lokuli, with their services, prices and service ids, each marked with how it matched (name, service, synonym, or trade, meaning the same kind of business), and, separately, businesses from public records that are not on Lokuli and can't be booked.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City, if there's no zip (e.g. \"Montebello\")",
                "type": "string"
              },
              "limit": {
                "description": "Most results per group (default 6)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "description": "What the person needs, in plain words: \"haircut\", \"dog grooming\", \"brake repair\"",
                "type": "string"
              },
              "zip": {
                "description": "5-digit zip code to search near",
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find local businesses on Lokuli"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:039f2761e8d545f97f1bb8796c314221d3b5f4ba5f64eb2161fd33c55c36a455"
        },
        {
          "name": "get_available_times",
          "title": "Get open appointment times",
          "description": "Open times for one service at a business, from the business's live Lokuli calendar (the same one its page and apps use). Returns each open slot's start time (ISO) and a label in the business's time zone.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "The business slug or lokuli.com/shop/... link",
                "type": "string"
              },
              "date": {
                "description": "First day to check, YYYY-MM-DD (default: today)",
                "type": "string"
              },
              "days": {
                "description": "How many days from date (default 3)",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "service_id": {
                "description": "The id of one of the business's services",
                "type": "string"
              },
              "staff_id": {
                "description": "Optional team member id, to see only their times",
                "type": "string"
              }
            },
            "required": ["business", "service_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get open times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f4dd840a9e93181b92ba5881be15f44e4107a4a239afac16c92f080c6cc15cf"
        },
        {
          "name": "get_business",
          "title": "Get a business's services, prices and hours",
          "description": "Details of one business on Lokuli: services with prices, lengths and service ids, team members, hours, address, Lokuli reviews, and how booking works there (confirmed by the business or instantly; paid at the business, or on its booking page with a card). Takes the business's slug or its lokuli.com/shop/... link.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "The business's slug or its lokuli.com/shop/... link",
                "type": "string"
              }
            },
            "required": ["business"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get business details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a0b07e20b0e76a377deb0405e34eb02ff298eecd6a0330c9757aedc1c752630"
        },
        {
          "name": "request_quotes",
          "title": "Get prices from local pros",
          "description": "Has Lokuli phone local service businesses near a US zip code (anywhere in the US) to ask whether they can do a job at the day and time the user wants, and what they'd charge. Lokuli first texts the user a confirmation link; calls start only after they tap it, and prices come back to them by text. Calls go out Monday–Saturday, 11am–6pm local time; a request made outside those hours waits for the next opening. Requires the service, the 5-digit zip, the day and time, and the user's US mobile number. Free for the user. A service that starts with the word \"test\" (for example \"test house cleaning\") sends the text and link but calls no business.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "Optional: the slug of a business to call first, then nearby pros",
                "type": "string"
              },
              "date": {
                "description": "The day they want, YYYY-MM-DD (today through 60 days ahead)",
                "type": "string"
              },
              "details": {
                "description": "Anything a shop needs to quote: size, make/model, problem (optional)",
                "type": "string"
              },
              "name": {
                "description": "The user's first name (optional)",
                "type": "string"
              },
              "phone": {
                "description": "The user's US mobile number; the confirmation link and the prices are texted here",
                "type": "string"
              },
              "service": {
                "description": "What they need, in plain words: \"house cleaning\", \"brake repair\", \"plumber for a leaking water heater\"",
                "type": "string"
              },
              "time": {
                "description": "The time they want that day, like \"10:00 AM\" or \"14:30\"",
                "type": "string"
              },
              "zip": {
                "description": "5-digit zip code where the service is needed",
                "type": "string"
              }
            },
            "required": ["date", "phone", "service", "time", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get prices from local pros"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7cfcefdd0f718ca28e3221925c72c44f38fd883200b74054dedea0fe6d862e9f"
        }
      ],
      "digest": "sha256:9d25f193ee47407d80d7031ca39d8a58264517002382a08aea180d2b3b0d0c67"
    }
  }
}
