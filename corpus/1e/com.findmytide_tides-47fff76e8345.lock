{
  "lockfileVersion": 2,
  "subjects": {
    "com.findmytide/tides": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.findmytide.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "findmytide",
        "title": "Find My Tide",
        "version": "fd664e0755c51d1bb6fbfed8fcd8eef4ec336517"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find My Tide predicts tides for about 4,600 stations in the United States, Canada and US territories. Find a station with search_stations, then call get_tides with its id. Times are local to the station. Every answer carries a safety notice and attribution: pass them on, and never present these predictions as suitable for navigation.",
      "tools": [
        {
          "name": "get_conditions",
          "title": "Get current conditions at a station",
          "description": "Current wind speed and direction, sea surface temperature and sky at a tide station. Any of them may be missing where the forecast service has no data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "station_id": {
                "description": "From search_stations, e.g. \"noaa:9447130\".",
                "type": "string"
              }
            },
            "required": ["station_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get current conditions at a station"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e63b2e31c64175bae7e9e045b8c24b8705a68e1a4910ea385a94b13e9b3470d3"
        },
        {
          "name": "get_tides",
          "title": "Get tide predictions",
          "description": "High and low tide times and heights for one station, over one or more days in the station's local time, plus the current height and direction when the range includes now. Times are ISO 8601 with the station's UTC offset. Heights are above the station's chart datum, in feet for US stations and metres for Canadian ones unless units is given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "First day, YYYY-MM-DD in the station's local calendar. Defaults to today there.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "default": 2,
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "station_id": {
                "description": "From search_stations, e.g. \"noaa:9447130\".",
                "type": "string"
              },
              "units": {
                "enum": ["m", "ft"],
                "type": "string"
              }
            },
            "required": ["station_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get tide predictions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b5ba8f828ba825678714592b8eb7ae5e3c07a7cb13fa277a695a74f17cf6cec"
        },
        {
          "name": "search_stations",
          "title": "Search tide stations",
          "description": "Find tide stations in the United States, Canada and US territories by place name, by position, or both. With a name, results are ranked by how well they match (then by distance, if a position is given). With only a position, the nearest stations come first. Returns each station's id, which get_tides and get_conditions take.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "latitude": {
                "description": "Decimal degrees.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "description": "Decimal degrees.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "query": {
                "description": "A place, station or region name, e.g. \"Monterey\", \"Bay of Fundy\", \"BC\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tide stations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6e4671a4d17ad0e6dfdedf3d26a5f5726e2ca0af30dec5df6f8728fa41bcb32"
        }
      ],
      "digest": "sha256:311542805d7408a7e3f59cdeb7b4cb62639f239aba90f882941fbf7078f7d885"
    }
  }
}
