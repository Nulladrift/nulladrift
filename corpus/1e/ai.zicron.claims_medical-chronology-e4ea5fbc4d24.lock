      "instructions": "Zicron AI turns medical records into page-cited work product for legal and claims teams. This public server needs no sign-in and accepts no patient information. It describes Zicron's done-for-you medical chronology (a case summary plus one timeline across every provider, each entry cited to its page, in 48 hours, $450 per case up to 1,000 pages, first case refundable if it isn't usable), quotes a price, shows a sample and sends a contact request. Start with get_offer. To work on records inside a Zicron account (create a case, upload records through signed upload links, generate and read the page-cited chronology, or score SSDI, SSI, VA, workers' comp, PI, LTD and hospice claims), the user connects the account server at https://claims.zicron.ai/agent/mcp, which signs in with OAuth: in Claude, add it as a custom connector (Settings → Connectors); in ChatGPT, as a connector in developer mode. This server cannot do that. Medical facts only; no standard-of-care, causation or damages opinions. Price for a page count: quote_chronology. To see the deliverable: get_sample_chronology. To send a case: request_chronology, only after the user asks and agrees to be emailed (confirmed_by_user=true); it creates a contact request, not an order, and a person replies within one business day with a firm quote and a secure upload link. Never send medical records or patient details through these tools; records go only through that secure link. For SSDI law firms only: get_ssdi_pilot_info.",
