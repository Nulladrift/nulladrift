{
  "lockfileVersion": 2,
  "subjects": {
    "com.getparceldata/parcels": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.getparceldata.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "GetParcelData",
        "version": "1.30.0",
        "websiteUrl": "https://getparceldata.com/mcp"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "US parcel boundaries and assessor data (owner, address, assessed values, land use, zoning and building statistics). Free tools need no key: check_coverage, get_pricing and preview_area. The find_parcels_* tools need an API key sent as 'Authorization: Bearer <key>' and use credits from a GetParcelData API plan. Geometry is WKT in EPSG:4326. Free samples are given on request at https://getparceldata.com/pricing#sample.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check county coverage",
          "description": "Free, no API key. Says whether a county is in the current data release, or lists every covered county in a state when no county is given. Parcel lookups in counties that are not covered cost no credits.",
          "inputSchema": {
            "properties": {
              "county": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional county name, 3-digit county code or 5-digit FIPS",
                "title": "County"
              },
              "state": {
                "description": "USPS code, state name or 2-digit state FIPS, e.g. 'TX'",
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "check_coverageArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check county coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e62fe591436495d2f6986bd93fdced8abc7a39285fc4291294c9562fe6679d3e"
        },
        {
          "name": "find_parcels_at_point",
          "title": "Find parcels at a point",
          "description": "Finds the parcels that contain a latitude and longitude. Costs 1 credit per request, however many parcels come back. Up to 1,000 parcels per request. Needs an API key. Lookups in counties we do not cover and failed requests cost no credits. Returns parcel records with WKT boundaries in EPSG:4326, owner, address, assessed values, land use and zoning where the county publishes them.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude, decimal degrees",
                "maximum": 90,
                "minimum": -90,
                "title": "Lat",
                "type": "number"
              },
              "limit": {
                "default": 20,
                "description": "Parcels per request, 1 to 1,000",
                "maximum": 1000,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "lng": {
                "description": "Longitude, decimal degrees",
                "maximum": 180,
                "minimum": -180,
                "title": "Lng",
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Parcels to skip; each page is a new, charged request",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              }
            },
            "required": ["lat", "lng"],
            "title": "find_parcels_at_pointArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find parcels at a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:023541046249818f618b7779e08b54af3310de0bf82b482a57e3dd03fff1f0b0"
        },
        {
          "name": "find_parcels_by_apn",
          "title": "Find parcels by APN",
          "description": "Finds parcels by assessor parcel number (APN) in one county. Costs 1 credit per completed request, including no_match and ambiguous results. Up to 100 parcels per request. Validate each candidate before using it. Needs an API key. Lookups in counties we do not cover and failed requests cost no credits. Returns parcel records with WKT boundaries in EPSG:4326, owner, address, assessed values, land use and zoning where the county publishes them.",
          "inputSchema": {
            "properties": {
              "apn": {
                "description": "APN, with any leading zeros",
                "maxLength": 256,
                "minLength": 1,
                "title": "Apn",
                "type": "string"
              },
              "county": {
                "description": "County name, 5-digit FIPS or 3-digit county code",
                "maxLength": 128,
                "minLength": 1,
                "title": "County",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Parcels per request, 1 to 100",
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "match_mode": {
                "default": "normalized",
                "description": "normalized ignores punctuation and case; exact needs the original identifier; contains (alpha) finds identifiers containing the input",
                "enum": ["normalized", "exact", "contains"],
                "title": "Match Mode",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Parcels to skip; each page is a new, charged request",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "USPS code, state name or 2-digit FIPS; needed with a county name",
                "title": "State"
              }
            },
            "required": ["apn", "county"],
            "title": "find_parcels_by_apnArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find parcels by APN"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1a48c6ba4cfeee94b167347af8b1df304fc536879397a90af4886b414127c90"
        },
        {
          "name": "find_parcels_in_polygon",
          "title": "Find parcels in a polygon",
          "description": "Finds every parcel that intersects a WKT geometry (polygon, multipolygon, line or point). Costs 3 credits per request, however many parcels come back. The geometry's bounding box can be up to 25 km². Up to 1,000 parcels per request. Needs an API key. Lookups in counties we do not cover and failed requests cost no credits. Returns parcel records with WKT boundaries in EPSG:4326, owner, address, assessed values, land use and zoning where the county publishes them.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "Parcels per request, 1 to 1,000",
                "maximum": 1000,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Parcels to skip; each page is a new, charged request",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "wkt": {
                "description": "WKT in EPSG:4326 lon/lat order, e.g. POLYGON((-97.75 30.26, ...))",
                "minLength": 1,
                "title": "Wkt",
                "type": "string"
              }
            },
            "required": ["wkt"],
            "title": "find_parcels_in_polygonArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find parcels in a polygon"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:febae72a80714fe545e90238b1d3c38497d6afc6fa96aeb00e1cf75cfddd404d"
        },
        {
          "name": "find_parcels_in_radius",
          "title": "Find parcels within a radius",
          "description": "Finds every parcel within a radius of a point, nearest first. Costs 3 credits per request, however many parcels come back. Radius up to 5,000 metres. Up to 1,000 parcels per request. Needs an API key. Lookups in counties we do not cover and failed requests cost no credits. Returns parcel records with WKT boundaries in EPSG:4326, owner, address, assessed values, land use and zoning where the county publishes them.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude, decimal degrees",
                "maximum": 90,
                "minimum": -90,
                "title": "Lat",
                "type": "number"
              },
              "limit": {
                "default": 20,
                "description": "Parcels per request, 1 to 1,000",
                "maximum": 1000,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "lng": {
                "description": "Longitude, decimal degrees",
                "maximum": 180,
                "minimum": -180,
                "title": "Lng",
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Parcels to skip; each page is a new, charged request",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "radius_m": {
                "description": "Radius in metres, up to 5,000",
                "exclusiveMinimum": 0,
                "maximum": 5000,
                "title": "Radius M",
                "type": "number"
              }
            },
            "required": ["lat", "lng", "radius_m"],
            "title": "find_parcels_in_radiusArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find parcels within a radius"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:156583307356004c058944f23dc88c6567656d1ded6669c86096ff069606a8ee"
        },
        {
          "name": "get_pricing",
          "title": "Get prices and plans",
          "description": "Free, no API key. Returns the monthly API plans (price, included credits, overage per credit, rate limit), the credit cost of each lookup type and the one-off extract downloads. Statewide and nationwide licences are quoted at https://getparceldata.com/pricing.",
          "inputSchema": {
            "properties": {},
            "title": "get_pricingArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get prices and plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4187be358b82e4a8a1297986a8373a2245a6e501dd35d6fd19a75e79fa48e6e6"
        },
        {
          "name": "preview_area",
          "title": "Count parcels in an area",
          "description": "Free, no API key. Counts the parcels inside a bounding box, lists the counties it touches, and says whether the area fits the $49 extract of up to 5,000 parcels. Each side of the box can be up to 2 degrees. Limited to 30 requests per IP address per minute.",
          "inputSchema": {
            "properties": {
              "east": {
                "description": "Eastern longitude, EPSG:4326",
                "maximum": 180,
                "minimum": -180,
                "title": "East",
                "type": "number"
              },
              "north": {
                "description": "Northern latitude, EPSG:4326",
                "maximum": 90,
                "minimum": -90,
                "title": "North",
                "type": "number"
              },
              "south": {
                "description": "Southern latitude, EPSG:4326",
                "maximum": 90,
                "minimum": -90,
                "title": "South",
                "type": "number"
              },
              "west": {
                "description": "Western longitude, EPSG:4326",
                "maximum": 180,
                "minimum": -180,
                "title": "West",
                "type": "number"
              }
            },
            "required": ["east", "north", "south", "west"],
            "title": "preview_areaArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count parcels in an area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3547b5c5b329f6de244778d74bee5e2c536c464a3b449a0d0f4423a6cad7e121"
        }
      ],
      "digest": "sha256:221ef68dc1bb7330fe49a92d7df491aec785ff2769dee4f7f538bea48b194db5"
    }
  }
}
