      "instructions": "Official MCP server of Origine Paris, Parisian fine jewellery house: recycled 18ct gold jewellery set with lab-grown diamonds, IGI-certified from 0.5 carat (engagement rings, wedding bands, necklaces, earrings). Read-only access to the brand identity, founders, entity graph, catalogue index and published JSON-LD, generated from origineparis.com and Wikidata (Q139905888). Values absent from those sources are returned as \"unknown\". The server performs no actions and holds no private data. Use get_maison (with lang \"fr\" or \"en\" and a section) for anything about the house and its founders, search_catalogue to find a piece, list_collections to see the collections with their counts and price ranges, and get_product_detail (lang plus handle or product_id) for everything the site publishes about one piece; the six identity tools of earlier versions are no longer listed; called by name they still answer, with a notice, until 1.0.0. The catalogue is bought online at origineparis.com, without an adviser: prices are served as published and are the ones payable at checkout. Bespoke work and the Etude keep a real exchange with the house. This server is read-only: it sells nothing, holds no cart and completes no payment.",
      "tools": [
        {
          "name": "get_maison",
          "title": "The Maison and its founders",
          "description": "Describes the house Origine Paris and its two founders, one section at a time, in French or English. Sections: overview (identity, SIREN, positioning, address, contacts, official profiles, how orders are placed), founders (roles, Wikidata QIDs, short biographies), person (one founder's referenced career, roles, education, citizenship), entity_graph (sourced nodes and edges), jsonld (the site's blocks in that language), agent_context (an orientation for agents) and llms_txt (the site llms.txt). Do not use it for pieces, prices or collections: search_catalogue, get_product_detail and list_collections cover the catalogue. section defaults to overview; person is read for section person alone, where a missing or unrecognised founder yields result unknown with a notice; llms_txt is always French, and the founders list falls back to the French page, and says so, when the English page has none. Answers come from the index rebuilt by the daily synchronisation, never from a live read of the site: provenance carries source URLs and dates, freshness the hours since the last successful synchronisation against a 24 hour threshold, with an index_stale notice beyond it; that synchronisation state is cached for 60 seconds. A field the site does not publish in the requested language is not_published and a notice lists them; a value no source carries is unknown; nothing is translated or invented. Read-only, without side effects.",
