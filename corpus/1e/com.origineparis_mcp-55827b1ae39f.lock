        {
          "name": "get_product_detail",
          "title": "One piece of the catalogue",
          "description": "Returns the full published record of one piece of the Origine Paris catalogue, in French or English. Use it once a piece is chosen, from a search result or a product URL: the description exactly as published and never parsed, the price published on the site at the date of reading, variants and published sizes with the size guide, images, and the published statements on lead time, delivery, returns and care, each with its source URL and date. Do not use it to find or compare pieces (search_catalogue), to see the collections (list_collections) or for the house and its founders (get_maison). handle takes precedence over product_id when both are given; neither, or an unknown one, yields result unknown with a notice; size changes nothing in the record and adds a consultation block when it is not among the published sizes. Whether the piece can be bought online is read from the site, never guessed; fields the site does not publish are not_published, fields this server does not relay are not_served, nothing is invented; a bespoke piece comes with a consultation block instead of a purchase. Read-only: it sells nothing and completes no checkout.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "handle": {
                "description": "Product handle, for example \"daisy-light-or-rose\", or the full product URL (French or English). Give handle or product_id.",
                "maxLength": 200,
                "minLength": 2,
