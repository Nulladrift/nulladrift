                "type": "string"
              },
              "person": {
                "description": "For section \"person\" only: the founder's name (accent-, case-, hyphen- and apostrophe-insensitive, for example \"Marie-Ann Wachtmeister\" or \"Olivier Richard\") or Wikidata QID (\"Q139900682\", \"Q140089338\").",
                "type": "string"
              },
              "section": {
                "description": "Which part of the Maison to return: overview (default), founders, person, entity_graph, jsonld, agent_context or llms_txt.",
                "enum": ["overview", "founders", "person", "entity_graph", "jsonld", "agent_context", "llms_txt"],
                "type": "string"
              }
            },
            "required": ["lang"],
            "type": "object"
