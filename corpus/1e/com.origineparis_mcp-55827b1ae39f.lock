        {
          "name": "search_catalogue",
          "title": "Search the published catalogue",
          "description": "Finds pieces in the published Origine Paris catalogue from free text, filters or both, in French or English. Every result carries its score and the reasons behind it, collections come back as facets with counts, and pages are stateless through limit (default 10, at most 50) and cursor. Parameters are hard filters, never relaxed; what the query text carries is soft: a jewellery type detected in the text is a tier, so a piece of another type never precedes one of the requested type, and the other types are served, with a notice, when nothing of that type matches; a price cap detected in the text is dropped when it would empty the results; jewellery_type and max_price given as parameters override the text. With filters and no query every piece of the pool is returned; with no criterion at all the whole catalogue is served, paginated. Do not use it for the record of one piece (get_product_detail), to list the collections with their counts and price ranges (list_collections, whose handles feed the collection filter) or for the house and its founders (get_maison). Prices are the ones published on the site: for a piece bought online they are paid at its checkout and final at the time of ordering (basis published); the pieces sold by appointment and bespoke work are not bought online (basis indicative), and a bespoke intent or a query with no match comes with a consultation block. Read-only: it sells nothing, holds no cart and completes no payment.",
