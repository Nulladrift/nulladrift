          "digest": "sha256:3b0506c43457957331a006397082bd27d8d93e2f43fb3d94ba3008989d8dcac6"
        },
        {
          "name": "get_product",
          "title": "Get a product",
          "description": "Retrieve one product by its directory id, with full builder attribution, links, funding state and engagement stats. Returns strictly more per record than a search result: the builder's own accounts and the product's, the website, the city, opt-in MRR where the builder published one, and all-time clicks and impressions. Call this to answer anything specific about a single product — how to reach the builder, where they are, whether they are raising, what the listing actually claims — and call it once per product after a search when a shortlist needs filling out. Do not call it to discover products: it takes an id and nothing else, so it cannot answer \"find me X\". Search first. Ids are the slug in the product URL, not the display name. An unknown id returns not-found rather than a guess.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id, e.g. \"unkey\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f86b15a1be8bd5c2b0b5758c91e586b18f11c23f0b78be7df856dffecfcb8d1"
        },
        {
          "name": "list_filters",
          "title": "List available filters",
          "description": "List every region, category, funding stage and platform that currently has listings, with counts. Call this before the first search of a conversation, and whenever a filter value is in doubt. The vocabularies are closed and curated — a region or category that is not on this list matches nothing, and an empty result from a guessed filter is indistinguishable from a genuinely empty directory. The counts are also the fastest way to see the shape of the directory: which markets are represented, where the listings actually are, and which filters are worth offering someone. Takes no arguments and is cheap. There is no reason to avoid calling it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List available filters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b406184fff9d0614784bf5fab1acb61f6ce907db73dc97af77a65ac4e49617a"
        },
        {
          "name": "search",
          "title": "Search the directory",
          "description": "Search across both products and communities at once, returning lightweight results — id, title, url — for retrieval with fetch. Call this when you do not know which collection the answer lives in, or when you are a deep-research client that expects the conventional search/fetch pair. It is deliberately thin: it is the discovery half, and fetch is the other half. Do not call it when you already know you want products or communities specifically — search_products and search_communities take real filters (region, category, funding stage, raising status, platform) and return structured fields instead of prose, which is almost always the better answer. Ids come back prefixed as \"product:<id>\" or \"community:<id>\"; pass them to fetch unchanged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What to look for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the directory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de50dd8aef235ae8986d8b3844e42b70fce657c2a4658a6b32a77962dcffd370"
        },
        {
          "name": "search_communities",
          "title": "Search communities",
          "description": "Search builder communities — the Slack workspaces, WhatsApp groups and meetups that independent builders actually gather in — by free text, region, topic and platform. Each result carries a real join link. Call this when someone wants to reach a scene rather than a person: where founders in a given country talk to each other, which group covers a topic, where to go to meet builders in a region. Do not call it to find products or their builders — that is search_products. Communities and products are separate records; a community is a group of people, not something someone shipped. Member counts appear only where the organisers stated one, so a null count means unknown, not small.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Topic, e.g. \"AI\", \"Fintech\", or \"General\".",
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-100.",
                "type": "integer"
              },
              "offset": {
                "description": "Results to skip, for paging.",
                "type": "integer"
              },
              "platform": {
                "description": "Where the community lives.",
                "enum": ["slack", "whatsapp", "meetup", "facebook", "luma", "email", "other"],
                "type": "string"
              },
              "query": {
                "description": "Free text matched against name and one-liner.",
                "type": "string"
              },
              "region": {
                "description": "Country name, e.g. \"Israel\", \"United States\", \"Nigeria\". Case-insensitive. Omit for all regions.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search communities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b66279a09770197cfdfbabc1e9e21e1e731fd8ce624f44175c615ff83ecce8b4"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search the directory of builder products. Filter by free text, region, category, funding stage, whether the builder is actively raising, and what they are open to. Returns the matching products with their builder attribution and engagement stats. Call this whenever someone wants to find products or the people behind them by any of those axes — \"who is building fintech in Nigeria\", \"indie AI tools whose founders are raising\", \"what has this person shipped\". It is the right tool for deal sourcing and scouting: raising_status and open_to together answer \"who wants to hear from an investor\", and region is the axis this directory is organised around. Do not call it to rank or compare products by traction — that is get_leaderboard. Do not call it when you already hold a product id; get_product returns more per record. Funding is opt-in: funding_stage may be \"undisclosed\" and actively_raising may be null, both meaning the builder declined to say rather than that the answer is no.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actively_raising": {
                "description": "Two-value shorthand for raising_status: true is \"raising\", false is \"not_raising\". Neither value returns builders who declined to disclose; ask for raising_status=\"undisclosed\" to see those. raising_status wins if both are sent.",
                "type": "boolean"
              },
              "category": {
                "description": "Product category, e.g. \"AI\", \"Fintech\", \"Dev Tools\". Call list_filters for the full list. A listing may carry up to three, and this matches any of them.",
                "type": "string"
              },
              "funding_stage": {
                "description": "Funding stage of the product. \"undisclosed\" means the builder chose not to state a stage; it is not a stage between or below the others, and it does not imply bootstrapped.",
                "enum": ["bootstrapped", "pre-seed", "seed", "series-a", "undisclosed"],
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-100. Defaults to 25.",
                "type": "integer"
              },
              "offset": {
                "description": "Results to skip, for paging.",
                "type": "integer"
              },
              "open_to": {
                "description": "Return only products open to this kind of contact.",
                "enum": ["investment", "advisors", "beta-users", "co-founders", "partnerships", "hiring"],
                "type": "string"
              },
              "query": {
                "description": "Free text matched against product name, one-liner, builder name, category, region and city. Every word must match.",
                "type": "string"
              },
              "raising_status": {
                "description": "Whether the builder is raising, as three distinct answers. \"raising\" = they said yes. \"not_raising\" = they said no. \"undisclosed\" = they declined to say, which is NOT the same as no and must never be reported as no. Independent of funding_stage. Prefer this over actively_raising.",
                "enum": ["raising", "not_raising", "undisclosed"],
                "type": "string"
              },
              "region": {
                "description": "Country name, e.g. \"Israel\", \"United States\", \"Nigeria\". Case-insensitive. Omit for all regions.",
                "type": "string"
              },
              "sort": {
                "description": "Result ordering. Defaults to recent.",
                "enum": ["recent", "raising_first", "most_clicked", "most_seen", "most_backed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc9f44b58aeb6558e8662ea9705bf705716fb1e39c2fa0a37df17ac9937d29bd"
        },
        {
          "name": "submit_product",
          "title": "Submit a product to the directory",
          "description": "Add a product to the directory on behalf of the builder whose agent token this call carries. Call this when the person you are working for has asked to be listed here, or has asked you to add a product they built. Do not call it to add somebody else's product, and do not call it speculatively — a listing is a public claim about a real builder. REQUIRES A TOKEN: send `Authorization: Bearer wayb_…`. A builder creates one at /mine while signed in; without it this tool refuses and every other tool here still works. The listing is created as PENDING and is reviewed before it appears — a successful call returns an id and a status of \"pending\", never a live listing. Do not report it as published. Submit the builder's OWN product. A builder can list more than one product, but the directory refuses a second copy of a product it already lists (by website host or by name) with a message saying so. Call list_filters first: category and region are closed vocabularies, listed in full under products.accepted_values, and a value outside them is rejected rather than corrected. Funding fields are optional and tri-state — omit activelyRaising, or send null, where the builder has not said. Do not infer it, and do not send false to mean \"did not say\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activelyRaising": {
                "description": "true, false, or null for \"would rather not say\". Default null.",
                "type": ["boolean", "null"]
              },
              "builder": {
                "description": "Attribution: `name` is required inside it, the rest is optional. REQUIRED on the first listing from this account. Leave it out on later ones and the builder details from the account's newest listing are used; send it only when the builder wants them changed. Every listing from one account shares one builder page however this is filled in.",
                "properties": {
                  "avatarUrl": {
                    "description": "Optional. The builder's photo, sent like logoUrl (an image link or data URL) and copied in. Without one the site borrows their X, GitHub or Gravatar picture.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "region": {
                    "type": ["string", "null"]
                  },
                  "socials": {
                    "description": "Accounts keyed by platform, e.g. { \"x\": \"…\" }.",
                    "type": "object"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "categories": {
                "description": "Optional. Up to 3 categories from list_filters, MAIN FIRST — for a product that is honestly more than one thing (an AI agent that is also a dev tool). The first must be the same value as `category`; send it first or leave it out of the list and it is put there. A listing is findable and filed under all of them, so send only the ones the builder would claim: three loosely-related categories are worse for them than one true one. Ask the builder rather than inferring from their site.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "description": "REQUIRED. The product's MAIN category, from products.accepted_values.categories in list_filters. Closed vocabulary. This is the one a row, a card and the sharing image show.",
                "type": "string"
              },
              "city": {
                "description": "City, or null.",
                "type": "string"
              },
              "description": {
                "description": "REQUIRED, up to 800 characters. A short paragraph in the builder's OWN words about what the product is and who it is for, shown on the listing's own page. Plain text — links are not rendered, so put the address in websiteUrl. Never write it yourself, and never pad it to a length: ask the builder for it, the way you would ask for the URL. A short answer in their words is worth more here than a long one in yours. It became required on 2026-09-03 because a listing without one has nothing on its page a search engine can tell apart from every other listing.",
                "type": "string"
              },
              "fundingStage": {
                "description": "Funding stage. Use \"undisclosed\" where the builder has not said — never guess.",
                "enum": ["bootstrapped", "pre-seed", "seed", "series-a", "undisclosed"],
                "type": "string"
              },
              "logoUrl": {
                "description": "REQUIRED. The product's square logo: an https link to a PNG, JPEG or WebP (up to 2MB, under 4000×4000), or a base64 `data:image/...` URL. The directory fetches it, checks it is a real image, and stores its own re-encoded copy; send the image file itself, not a page that shows it. Prefer links: a whole request is capped at 256KB, so data URLs only suit small images. Ask the builder for their logo rather than picking an image off their site.",
                "type": "string"
              },
              "mrr": {
                "description": "Monthly recurring revenue, only where the builder chose to publish it.",
                "type": ["number", "null"]
              },
              "name": {
                "description": "The product name, up to 80 characters.",
                "type": "string"
              },
              "oneLiner": {
                "description": "One sentence saying what it does, up to 80 characters. Not a tagline.",
                "type": "string"
              },
              "openTo": {
                "description": "What the builder invited contact about. Omit for none.",
                "items": {
                  "enum": ["investment", "advisors", "beta-users", "co-founders", "partnerships", "hiring"],
                  "type": "string"
                },
                "type": "array"
              },
              "region": {
                "description": "REQUIRED. Country name from products.accepted_values.regions in list_filters (the full list; products.regions only names countries that already have listings). Closed vocabulary. Use \"Global\" where the builder is not anywhere in particular or would rather not say — that is a real answer on this list, and it is the one to send rather than guessing a country or omitting the field.",
                "type": "string"
              },
              "screenshots": {
                "description": "REQUIRED, 1 to 4. Screenshots of the product, each an https link to a PNG, JPEG or WebP (up to 2MB) or a base64 data URL, copied in like logoUrl. Ask the builder for them.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "socials": {
                "description": "The PRODUCT's own accounts, keyed by platform — not the builder's, which go under `builder.socials`. Keys: `x`, `linkedin`, `instagram`, `tiktok`, `youtube`, `facebook`, `github`, `email`. Each is `{ \"url\": \"…\" }` except `x`, which is `{ \"handle\": \"…\" }`, and `email`, which is `{ \"address\": \"…\" }` and should be a business address (support@, hello@) rather than a person's. `github` is the PRODUCT's repository — the code somebody would clone. The builder's own GitHub account is a different thing and goes in `builder.socials.github`.",
                "type": "object"
              },
              "websiteUrl": {
                "description": "REQUIRED. The product's own https URL — the address a reader opens. A code repository or an app store page counts. REFUSED: a shared document (Drive, Docs, Dropbox, Notion), and a free platform deploy subdomain (vercel.app, netlify.app, github.io, web.app, railway.app and the like) — the builder needs a domain of their own first. Never invent one: ask the builder.",
                "type": "string"
              }
            },
            "required": ["category", "description", "fundingStage", "logoUrl", "name", "oneLiner", "region", "screenshots", "websiteUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit a product to the directory"
          },
