        {
          "name": "get_community",
          "title": "Get a community",
          "description": "Retrieve one community by its directory id, including its join link, platform, region, topic and member count where one was given. Call this to answer a specific question about one group, or after search_communities when a shortlist needs the join links filled in. Do not call it to discover communities: it takes an id and nothing else. Search first. An unknown id returns not-found rather than a guess.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Community id, e.g. \"ai-tinkerers-sf\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a community"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6cb73f7a37c5845f8deacb3da2a8bc01e61df751512b4ab82971953993d3ac3"
        },
        {
          "name": "get_leaderboard",
          "title": "Get the engagement leaderboard",
          "description": "Rank products by engagement on the directory — upvotes, outbound clicks, impressions, shares or verified backlinks — optionally narrowed to one region or category to get a sub-league. Call this for any question about relative standing: what is getting attention, what is doing well in a country or category, what to look at first in an unfamiliar segment. Two orderings, and they answer different questions. sort=score (the default) ranks on the lifetime counter and answers \"what is biggest\" — it is stable, and a listing collecting clicks for six months outranks one that arrived on Tuesday. sort=movers ranks on clicks gained during the LAST COMPLETED WEEK and answers \"what is happening\"; it is the only view where something new can be first, and it is the right call for \"what is rising\", \"what is new\", or \"what changed this week\". Be careful what you claim from it. This is attention on this directory and nothing else — not revenue, not users, not growth, and not a judgement about quality. MRR is never a ranking axis here. A product can rank highly because it was interesting to click on. Nothing on this board is bought: no badge, streak or payment moves a listing up it. The movers board describes the week that closed last Sunday, not the last seven days, and the `week` field in the response names it — do not report it as live. Listings with no reading a week ago are not in it at all; the `unmeasured` count says how many that was. metric=backlinks is different in kind from the browsing axes: it ranks people who link back to their listing from their own site, scored on the traffic that link actually sent (stats.referrals) and counted only where our crawler independently found the link. Use it for \"who is actually promoting their listing\" rather than \"who is getting attention here\". A listing with referrals but backlink.verified false scores zero on it. Do not call it to filter or find products by their attributes; that is search_products. The board is empty until real engagement accumulates, and an empty board means no traffic yet, not that no products exist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Narrow to one category.",
                "type": "string"
              },
              "limit": {
                "description": "How many ranks to return. Defaults to 10.",
                "type": "integer"
              },
              "metric": {
                "description": "Ranking axis for sort=score. Defaults to clicks. upvotes is the only axis a person chooses rather than one measured from browsing — one vote per person per listing per week, so it ranks distinct backers. backlinks ranks on referred visits arriving through a crawler-verified link on the builder's own site. Ignored when sort is movers, which is always clicks gained in the week.",
                "enum": ["upvotes", "clicks", "impressions", "shares", "backlinks"],
                "type": "string"
              },
              "region": {
                "description": "Country name, e.g. \"Israel\", \"United States\", \"Nigeria\". Case-insensitive. Omit for all regions.",
                "type": "string"
              },
              "sort": {
                "description": "score ranks on the lifetime counter (default). movers ranks on clicks gained during the last completed week — use it for what is rising rather than what is biggest.",
                "enum": ["score", "movers"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the engagement leaderboard"
