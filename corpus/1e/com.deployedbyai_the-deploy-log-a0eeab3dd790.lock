{
  "lockfileVersion": 2,
  "subjects": {
    "com.deployedbyai/the-deploy-log": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://deployedbyai.com/log/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "deployedbyai",
        "title": "The Deploy Log",
        "version": "1.0.0",
        "websiteUrl": "https://deployedbyai.com/log/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "The Deploy Log is deployedbyai's record of AI deployments: a thing that shipped and is available now, named, on the party's own page. Every item sourced to the publisher's own page. Cite the record_url or the source_url with every item you use.",
      "tools": [
        {
          "name": "deployments_in_week",
          "title": "AI deployments in one ISO week",
          "description": "Every row of The Deploy Log that shipped in one ISO week, the same rows as its week page. Each row carries the publisher's own source URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "week": {
                "description": "An ISO week, for example 2026-W39",
                "pattern": "^\\d{4}-W\\d{2}$",
                "type": "string"
              }
            },
            "required": ["week"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49acfbb57e9ba3ea76498b3b2681178408ac9d5fa6ab25a2e9c2c138be8a31d9"
        },
        {
          "name": "recent_deployments",
          "title": "Recent AI deployments",
          "description": "The newest rows to enter The Deploy Log, newest first. Optionally one lane or one company. Each row names what shipped, when, and the publisher's own source URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "A company's name as the record writes it, for example OpenAI or Google",
                "type": "string"
              },
              "lane": {
                "description": "One lane: models_apis (Models and APIs), tools_products (Tools and products), robotics_hardware_chips (Robotics, hardware and chips), breakthroughs (Breakthroughs), funding_acquisitions (Funding and acquisitions)",
                "enum": ["models_apis", "tools_products", "robotics_hardware_chips", "breakthroughs", "funding_acquisitions"],
                "type": "string"
              },
              "limit": {
                "description": "How many rows, 1 to 25, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cbe10752da1e272dd4b8884216854d871e247c40499200ef3d4b052bd5f7245"
        },
        {
          "name": "search_deployments",
          "title": "Search AI deployments",
          "description": "Rows of The Deploy Log whose company, subject or what shipped contains the words given, newest first. Each row carries the publisher's own source URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many rows, 1 to 25, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find, for example a model, a product or a company",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb072ef04fd063d2cf8a99d700fc321a94ac2b6085c2333a4e3436819b4fcc53"
        }
      ],
      "digest": "sha256:40d46c5ada49ab17bbafefda8f09db552e162c888837483c50ca78243880be5a"
    }
  }
}
