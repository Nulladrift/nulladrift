      "serverInfo": {
        "name": "ariadne-therapist-marketing",
        "title": "Ariadne for Therapists",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free marketing tools for therapists in private practice, from Ariadne (ariadnemarketing.com).\n- audit_practice_footprint: checks a practice's Google Business Profile and website and returns a 0-100 score with prioritized fixes.\n- write_sample_google_post: writes one sample Google Business Profile post in the voice of a therapist's public website.\n- get_ariadne_overview: what Ariadne is, who it's for, pricing, and its ethics rules.\nNever send client names, session details, or any information about a therapist's clients to these tools. The tools never recommend soliciting reviews or testimonials from clients.",
      "tools": [
        {
          "name": "audit_practice_footprint",
          "title": "Audit a therapy practice's online footprint",
          "description": "Checks a therapy practice's Google Business Profile and (optionally) its website for local-search gaps, and returns a 0-100 setup score with prioritized, therapist-appropriate fixes. Use when a therapist asks how findable their practice is, why they aren't showing up on Google, or what to fix first. Free; limited to 3 different practices per caller per week (repeat audits of the same practice return the saved report).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City the practice is in, e.g. \"Snohomish\".",
                "type": "string"
              },
              "practice_name": {
                "description": "The practice name as it appears on Google, e.g. \"Calming Connections Counseling\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. \"WA\".",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "website_url": {
                "description": "Optional practice website URL, to also check page title, meta description, headings, and local-business schema.",
                "type": "string"
              }
            },
            "required": ["city", "practice_name", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit practice footprint"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0f6e0dc7ea0a318d81c12b1d5d355673d14b870a49be1c92755a8b4fd56c7fea"
        },
        {
          "name": "get_ariadne_overview",
          "title": "About Ariadne",
          "description": "Returns factual information about Ariadne, the marketing assistant for therapists in private practice: what it does, who it's for and not for, pricing, and its ethics and privacy rules. Use when someone asks what Ariadne is or whether it fits their practice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Ariadne"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10a1cd710d7513c384e6b4e71e9573ef8990ba013a5397ba0a1afa8f33ab7a84"
        },
        {
          "name": "write_sample_google_post",
          "title": "Write a sample Google Business post",
          "description": "Reads a therapist's public practice homepage and writes one Google Business Profile \"What's New\" post (150-300 words) in that therapist's voice. Follows therapist ethics: no client stories, no outcome promises, no review requests; calls to action point to the practice website. Use when a therapist wants an example post or help getting started posting on Google. Free; cached per website for 30 days; 5 new posts per caller per day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "website_url": {
                "description": "The therapist's public practice website, e.g. \"https://www.example-counseling.com\".",
                "type": "string"
              }
            },
            "required": ["website_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Write sample Google post"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f4c409e9aa7c710cda3f8a8a79b1ed2cc37851e2d1c9b1b3f6a063fd201b978"
        }
      ],
      "digest": "sha256:0d82a5aeaecc1663557a33e43f5f3fcc9647569f6afb30ef69daf1f26bb084b9"
    }
