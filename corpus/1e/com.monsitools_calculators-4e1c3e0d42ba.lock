{
  "lockfileVersion": 2,
  "subjects": {
    "com.monsitools/calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://monsitools.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "monsitools",
        "title": "MonsiTools calculators",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_calculators to find a calculator, describe_calculator to see its inputs, then calculate with numeric inputs. calculate works without a key for 10 calculations a day per IP address; a MonsiTools Premium API key (Authorization: Bearer mt_live_...) removes that limit.",
      "tools": [
        {
          "name": "calculate",
          "title": "Run a calculator",
          "description": "Runs a MonsiTools calculator on the given inputs and returns the result. Works without a key for 10 calculations a day per IP address. A MonsiTools Premium API key, sent as 'Authorization: Bearer mt_live_...' when connecting, removes the daily limit.",
          "inputSchema": {
            "properties": {
              "inputs": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Input name to number, for every input the calculator lists.",
                "type": "object"
              },
              "slug": {
                "description": "Calculator slug from search_calculators.",
                "type": "string"
              }
            },
            "required": ["inputs", "slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run a calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:481305a48a159820d277058e8da70ce8af1e78a77bc03821cbbdf5330cb3ed13"
        },
        {
          "name": "describe_calculator",
          "title": "Describe a calculator",
          "description": "Returns a calculator's name, category, formula, input names and page URL, given its slug.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Calculator slug, e.g. 'saas-runway-calculator'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe a calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47e5b27cf043bcd8c86224b29d65dedc8f9fe7c05b6ce259e48e0d88f565ac3e"
        },
        {
          "name": "search_calculators",
          "title": "Search MonsiTools calculators",
          "description": "Find MonsiTools calculators by keyword (for example 'runway', 'break even', 'roas', 'loan payment'). Returns each match's slug, name, category and input names. Use describe_calculator for details, then calculate to run one.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional exact category name, e.g. 'SaaS Metrics'.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match against calculator names, categories and input names.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search MonsiTools calculators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b265519314675405e37d9e3577d35196dfcc02c546a85b74e820a74c8fb9fcb4"
        }
      ],
      "digest": "sha256:fb8232648a7f5fc9252116bc06f941ac181a2d992e61534a2a88839aabea3a55"
    }
  }
}
