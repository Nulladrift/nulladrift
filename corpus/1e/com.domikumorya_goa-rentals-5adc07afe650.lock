          "title": "Compare rentals",
          "description": "Compare 2-5 places side by side by their ids from search_properties. Returns full details of each, a summary (cheapest per month and per night, closest to the beach, most bedrooms, most recently confirmed by the owner) and which amenities they share or only one has. Pass Copy `price_context` from the selected search results (they should be the same search context) to compare the same prices. Unknown prices remain null. Read-only.",
