        {
          "name": "search_properties",
          "title": "Search rentals in Goa",
          "description": "Search long-term and holiday rentals in North Goa, India (Morjim, Arambol, Mandrem, Ashwem, Siolim...). Pass the user's request as plain text in `query`, in any language (e.g. '2BHK in Mandrem under 60k for January, quiet, with AC'), and/or explicit filters; explicit filters win. Returns up to 10 places, newest first, with monthly and nightly prices in Indian rupees, distance to the beach, amenities, photos, the date the owner last confirmed availability and a Telegram link where the user contacts the realtor. Read-only: it never books or contacts anyone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amenities": {
                "description": "Required amenities, e.g. ['Air conditioning', 'Wi-Fi'].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "has_video": {
                "description": "Only places with a video tour.",
                "type": "boolean"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Area, e.g. 'Mandrem'. Comma-separated for several. See get_locations.",
                "type": "string"
              },
              "max_distance_m": {
                "description": "Max distance to the beach, metres.",
                "type": "integer"
              },
              "max_price": {
                "description": "Max monthly rent, INR.",
                "type": "integer"
              },
              "min_bedrooms": {
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "min_price": {
                "description": "Min monthly rent, INR.",
                "type": "integer"
              },
              "query": {
                "description": "The user's request in plain language, any language.",
                "maxLength": 500,
                "type": "string"
              },
              "quiet": {
                "description": "Only quiet places, away from roads and bars.",
                "type": "boolean"
              },
              "sort": {
                "default": "newest",
                "description": "Order: newest first, cheapest monthly rent first, or closest to the beach first.",
                "enum": ["newest", "price", "distance"],
                "type": "string"
              },
              "stay_month": {
                "description": "Month of arrival, 1-12 (prices depend on season).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "1RK, Studio, 1BHK, 2BHK, 3BHK, 4BHK, House, Bungalow, Room, Villa, Hotel. Comma-separated for several.",
