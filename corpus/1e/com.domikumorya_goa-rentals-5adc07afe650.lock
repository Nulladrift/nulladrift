      "instructions": "Long-term and holiday rentals in North Goa, India (Morjim, Arambol, Mandrem, Ashwem…). Read-only. Use get_locations to see areas, search_properties to find places (plain-language query and/or filters), get_property for one place, compare_properties to put 2-5 places side by side. Every result has a Telegram link — send the user there to contact the realtor. Never promise availability: show owner_confirmed_on. A place with free_from is rented now and frees up on that date — say so.",
      "tools": [
        {
