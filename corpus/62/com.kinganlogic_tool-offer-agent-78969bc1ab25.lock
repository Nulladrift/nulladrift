      "capabilities": {
        "tools": {}
      },
      "instructions": "Read the canonical machine-readable profile https://tooloffer.kinganlogic.com/manifest.json before calling. Capabilities: Read public API/MCP documentation and retain source-attributed evidence. Collect seller-stated customer, pricing, payment, access and invocation terms. Draft, review and revise an offer within an isolated conversation. Explain the buyer offer and prepare listing guidance without publication. Assess retained offer readiness deterministically without inference or payment. Export structured and human-readable records, with verified multipart retrieval when needed. Drafting is free; operator inference costs and published quotas still apply. Optional FAHCE evaluation is separate and buyer-authorized: 0.15 USDC on Base mainnet via the private human checkout. A free preflight is not an evaluation. Checkout preparation, wallet connection and a 402 challenge are not payment authorization, settlement or a completed result. Changed price, network, token or recipient stops payment. No automatic spending. Source-attributed API/MCP offer intake, conversation, drafting, revision, deterministic readiness assessment and exports. No wallet connection, checkout, FAHCE execution, payment, approval, publication, administration or cross-conversation recovery through this adapter. Release 66979784d826683d48d83d6639e924078a3a3476c3ab488a93a9a57519767f19.",
      "tools": [
        {
          "name": "assess_offer_readiness",
          "description": "Deterministic assessment of your retained session without revising seller terms. No fetching, inference, FAHCE, approval or payment. Returns a job, not the report: poll get_result for signed readiness JSON plus full human_readable content, or a resumable report manifest. Not seller certification or commercial clearance. Does not revise seller terms, but creates a metered asynchronous job and may retain delivery state.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Illustrative example identifiers must be replaced by IDs returned for your authenticated session; this schema does not dispatch the example.",
            "examples": [
              {
                "request_id": "00000000-0000-4000-8000-000000000001",
                "session_id": "00000000-0000-4000-8000-000000000002"
              }
            ],
            "properties": {
              "request_id": {
                "description": "Caller-generated UUID for this logical operation. Retain it and identical arguments for retries; do not reuse it for different work.",
                "format": "uuid",
                "type": "string"
              },
              "session_id": {
                "description": "The isolated session UUID returned by start_session; use the same client identity.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["request_id", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "job_id": {
                "description": "The stable job UUID returned by an operation; poll this same job rather than dispatching replacement work.",
                "format": "uuid",
                "type": "string"
              },
              "release_id": {
                "description": "Release identity bound to this asynchronous operation.",
                "type": "string"
              },
              "session_id": {
                "description": "The isolated session UUID returned by start_session; use the same client identity.",
                "format": "uuid",
                "type": "string"
              },
              "status": {
                "description": "Current job state; only complete with assembled verified content means delivery is finished.",
                "enum": ["pending", "processing", "uncertain", "complete", "error"],
                "type": "string"
              }
            },
            "required": ["job_id", "release_id", "session_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
