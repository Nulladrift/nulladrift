        {
          "name": "get_export_part",
          "description": "Retrieve one existing resumable export part from your session, without inference. Preserve the manifest and verify its hashes; do not claim completion until all parts are received. Does not revise seller terms, but creates a metered asynchronous job and may retain delivery state.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Illustrative example identifiers must be replaced by IDs returned for your authenticated session; this schema does not dispatch the example.",
            "examples": [
              {
                "export_id": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                "index": 1,
                "request_id": "00000000-0000-4000-8000-000000000001",
                "session_id": "00000000-0000-4000-8000-000000000002"
              }
            ],
            "properties": {
              "export_id": {
                "description": "The 64-character export hash identifier returned in a multipart manifest for this session.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "index": {
                "description": "One-based part index from the manifest. Retrieve every part and verify hashes before claiming complete delivery.",
                "maximum": 999999,
                "minimum": 1,
                "type": "integer"
              },
              "request_id": {
                "description": "Caller-generated UUID for this logical operation. Retain it and identical arguments for retries; do not reuse it for different work.",
                "format": "uuid",
                "type": "string"
              },
