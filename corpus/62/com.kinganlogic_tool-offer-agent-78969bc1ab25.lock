            "readOnly": false
          },
          "digest": "sha256:7dd7dbc480bf0e34a158e05c1fc4aadcdc0fffe23a4debdc9dec45d4df25da8f"
        },
        {
          "name": "export_offer",
          "description": "Export your session's saved offer, proposed plan or explicitly incomplete response without inference. Large responses use the agent's resumable manifest; retrieve each indexed part with get_export_part. An export is not publication or certification. Does not revise seller terms, but creates a metered asynchronous job and may retain delivery state.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Illustrative example identifiers must be replaced by IDs returned for your authenticated session; this schema does not dispatch the example.",
            "examples": [
              {
                "format": "json",
                "request_id": "00000000-0000-4000-8000-000000000001",
                "session_id": "00000000-0000-4000-8000-000000000002"
              }
            ],
            "properties": {
              "format": {
                "description": "Saved representation to export. Choose incomplete only for an explicitly unfinished record; export does not publish or authorize it.",
                "enum": ["json", "readable", "buyer", "representation", "listing", "plan", "incomplete"],
                "type": "string"
              },
              "request_id": {
                "description": "Caller-generated UUID for this logical operation. Retain it and identical arguments for retries; do not reuse it for different work.",
                "format": "uuid",
                "type": "string"
              },
              "session_id": {
                "description": "The isolated session UUID returned by start_session; use the same client identity.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["format", "request_id", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
