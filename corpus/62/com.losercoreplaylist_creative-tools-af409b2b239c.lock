{
  "lockfileVersion": 2,
  "subjects": {
    "com.losercoreplaylist/creative-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://losercoreplaylist.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "losercore-playlist",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public creative metadata and local video-project preparation only. No Spotify audio or song lyrics are supplied. No cloud AI tasks, payments, account data or stored media are exposed. Projects are drafts for the browser workspace, not rendered videos.",
      "tools": [
        {
          "name": "get_creation_template",
          "title": "Get an original Losercore scene template",
          "description": "Return one of two original adult-character scene prompts for a PS2-inspired concept. This prepares text only and never submits or charges an AI generation request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "template": {
                "enum": ["beanie-loser", "turn-on-the-playlist"],
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:04752a8f6e4d01bbea182f8f1dd4874d1acd39cd8bcb4fb11228987440c5f71d"
        },
        {
          "name": "prepare_video_project",
          "title": "Prepare an editable playlist video project",
          "description": "Prepare a free local-workspace JSON draft from 1–12 song/artist title cards and three original captions. Save the project field as JSON, then import it on the linked workspace. It does not render a video, fetch audio or provide song lyrics.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "captions": {
                "default": ["online again, emotionally buffering", "the room is quiet / the playlist is not", "one more track before sleep"],
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 3,
                "type": "array"
              },
              "language": {
                "default": "en",
                "enum": ["en", "id", "zh", "ja"],
                "type": "string"
              },
              "tracks": {
                "items": {
                  "properties": {
                    "artist": {
                      "maxLength": 240,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "maxLength": 240,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["artist", "title"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tracks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:65e37b09cd25cb1457125b85abd256a2198a6fb625cdbf3c8f7bcb5a044fcb64"
        },
        {
          "name": "search_playlist",
          "title": "Search Losercore starter tracks",
          "description": "Search four starter tracks by song, artist or mood. This is a dated starter selection, not a live or complete Spotify catalogue. Returns metadata and listening links only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 4,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "default": "",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4ec63fca1ad1ff6887e4f87f8248ba40d24c74052910d6fae3028c9058f8e26b"
        }
      ],
      "resources": [
        {
          "uri": "https://losercoreplaylist.com/developers/mcp",
          "name": "creative-workspace-guide",
          "title": "Creative tools and usage boundaries",
          "mimeType": "text/plain",
          "digest": "sha256:362a55009016cd6dcc335ab573379f1669dd63a795c4bad9103eae3f7a7b4625"
        },
        {
          "uri": "https://losercoreplaylist.com/playlist",
          "name": "playlist-starter-selection",
          "title": "Starter playlist metadata",
          "description": "Four starter tracks and their scope; no audio or song lyrics.",
          "mimeType": "application/json",
          "digest": "sha256:4c865c2290aad11a7c57d11a5a11073c7560cc2f323be7374f0305cec3a8ff2b"
        }
      ],
      "prompts": [
        {
          "name": "plan_playlist_video",
          "title": "Plan an original playlist video",
          "description": "Draft an original caption and timing brief for the local workspace.",
          "arguments": [
            {
              "name": "mood",
              "required": true
            }
          ],
          "digest": "sha256:e4f4c01a584169fae005cde43a21f9bcc75b2d98be2b39defed23a57b8982770"
        }
      ],
      "digest": "sha256:3d72bee22bc7606d2cfab8181fdfe986c96fc10eca5879981ecb2dad66fd8f01"
    }
  }
