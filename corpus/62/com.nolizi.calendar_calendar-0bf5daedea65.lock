{
  "lockfileVersion": 2,
  "subjects": {
    "com.nolizi.calendar/calendar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://calendar.nolizi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nolizi-calendar",
        "title": "Nolizi Calendar",
        "version": "0.10.5"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Nolizi Calendar: scheduling for the account whose API key this server holds.\n\nWork in this order: list_event_types to find a slug, list_available_slots to get real times, then create_booking once the person has confirmed the event, the time and the attendee details. Always verify a write with list_upcoming_bookings before reporting it as done.\n\nTwo things to hold onto. Writes are not idempotent and there is no idempotency key, so a retried booking can double-book a real person: when a write reports an uncertain outcome, reconcile with list_upcoming_bookings instead of calling it again. And the key carries full owner permissions with no scopes, so treat every write as acting directly as the account holder.",
      "tools": [
        {
          "name": "cancel_booking",
          "title": "Cancel a booking",
          "description": "Cancel a confirmed booking. This notifies the attendee and removes the meeting from connected calendars, and it cannot be undone. Use an exact booking_id taken from list_upcoming_bookings — never a guessed or reconstructed one. Cancelling one occurrence of a grouped or recurring booking can affect several meetings, so confirm with the person which meetings they mean.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "booking_id": {
                "description": "Exact booking_id from list_upcoming_bookings.",
                "type": "string"
              }
            },
            "required": ["booking_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:baeed506a7b68f8586f931d00889521de8398abd6c638db292a913799b672bd5"
        },
        {
          "name": "create_booking",
          "title": "Create a booking",
          "description": "Book a real meeting. This sends invitations and writes to connected calendars, and it cannot be undone except by cancelling. Ask the person to confirm the event, the exact time and the attendee details before calling it, and use their real name and email — never a placeholder. The start and end must be copied verbatim from a recent list_available_slots response; this server re-checks them against live availability and refuses times it cannot find. There is no idempotency key: if this call returns an uncertain outcome, do not call it again — call list_upcoming_bookings and read what actually happened.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "booker_tz": {
                "description": "Attendee IANA timezone, e.g. Europe/Berlin. Defaults to UTC.",
                "type": "string"
              },
              "email": {
                "description": "The attendee’s real email address. Invitations go here.",
                "type": "string"
              },
              "end": {
                "description": "The matching end from that same slot.",
                "type": "string"
              },
              "event_type": {
                "description": "Event slug from list_event_types.",
                "type": "string"
              },
              "name": {
                "description": "The attendee’s real name.",
                "type": "string"
              },
              "note": {
                "description": "Optional note shared with the host (max 2000 characters).",
                "type": "string"
              },
              "start": {
                "description": "Start, copied exactly from a fresh list_available_slots response.",
                "type": "string"
              }
            },
            "required": ["email", "end", "event_type", "name", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0f39c1a5b6a13bb54acead99003e88960863caf96c2c6ee0f2924b8ffc1883d"
        },
        {
          "name": "list_available_slots",
          "title": "List available times",
          "description": "Return the live available start/end pairs for one event type. These are real times on a real calendar: show them to the person and let them choose. Do not invent, extrapolate or round a time that is not in this response. Convert times for display only — pass the original values back to create_booking unchanged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "event_type": {
                "description": "Event slug from list_event_types (not a schedule_id).",
                "type": "string"
              }
            },
            "required": ["event_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:09709f516668285bd0c8a838c8ab0fd1b4dd72a8e28450388aa9dc4c1e381c53"
        },
        {
          "name": "list_event_types",
          "title": "List event types",
          "description": "List the bookable event types owned by the configured Nolizi Calendar account. Start here: the returned slug is what every other tool needs. Never guess a slug. Events with required custom questions or email verification cannot be booked through this API — send the person to the event’s public booking page instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9857d5bed86e34ab1a6347ab6eeadaf0d99db292badefc736032ea1bc973e51a"
        },
        {
          "name": "list_upcoming_bookings",
          "title": "List upcoming bookings",
          "description": "List up to 100 upcoming confirmed bookings. This is the only way to verify that a booking exists. Use it after every create or cancel, and use it first whenever a write returned an uncertain outcome.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:29d5a6cb43c1c82eb311cbad7a64d1a5602a9c43ceb69dbf7bc21a066d9a2d5c"
        }
      ],
      "digest": "sha256:72920bf2d556c7b3d39e8a09b70f5390982b5f755b97545190d13e69725a85ac"
    }
  }
}
