      "instructions": "Free brand/product name Clearance Checks backed by live registry data (nombrio.com). Use check_name for one name and check_names for a shortlist of 2-8 names (one call, ranked). The 'naming-session' prompt runs the brainstorm → screen → shortlist flow. Always relay the full-result links and the 'not legal advice' note to the user. A handle shown as 'confirm at <url>' could not be verified — never call it taken. With an API key (nombrio.com/dashboard/api-keys) the same tools run the full Clearance Check (US+EU+UK, named marks, exact score) against the caller's plan, and start_naming_session / get_naming_session become available.",
      "tools": [
        {
          "name": "check_name",
          "title": "Clearance Check — one name (free)",
          "description": "Run a free Clearance Check on ONE brand, business, product or app name. Live registry data, not guesses: US trademark verdict (USPTO — clear / caution / conflict with a count of live registrations), a count-only EU trademark screen (EUIPO), domain availability with prices (.com .io .co .app .dev), social handles (X/Twitter, TikTok, LinkedIn, Facebook; Instagram returns a confirm-link), developer namespaces (npm, PyPI, crates.io, GitHub, Docker Hub), the iOS App Store, and an overall viability band (strong / caution / blockers / high-risk) plus a link to the full interactive result. Use it when the user asks whether a SPECIFIC name is taken, trademarked, available or safe to use — and also at everyday developer naming moments: naming a new project, app, product, repo, package, CLI or domain while scaffolding, before publishing to npm/PyPI/crates.io, or whenever a name is being chosen in passing (the namespaces it checks are exactly those). For a shortlist or comparison use check_names instead — one call, all names in parallel, ranked. Free, no API key; shared fair-use pool with a per-caller daily allowance. Not legal advice. Data by nombrio.com.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The candidate name to check, e.g. 'Lumeo'. Plain name only — no URL, no TLD, no @handle. For several names use check_names.",
                "maxLength": 50,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appStore": {
                "additionalProperties": false,
                "properties": {
                  "matchCount": {
                    "type": "integer"
                  },
                  "verdict": {
                    "enum": ["clear", "similar", "conflict", "unknown"],
                    "type": "string"
                  }
                },
                "required": ["matchCount", "verdict"],
                "type": "object"
              },
              "conflicts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "classLabels": {
                      "description": "Human-readable Nice Classification labels ('9 Electronics & Software'), aligned index-for-index with the numeric class array.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "classes": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "owner": {
                      "type": "string"
                    },
                    "registries": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "similarity": {
                      "type": "number"
                    }
                  },
                  "required": ["name", "registries", "similarity"],
                  "type": "object"
                },
                "type": "array"
              },
              "developer": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available": {
                      "type": "boolean"
                    },
                    "namespace": {
                      "type": "string"
                    }
                  },
                  "required": ["available", "namespace"],
                  "type": "object"
                },
                "type": "array"
              },
              "disclaimer": {
                "const": "Not legal advice.",
                "type": "string"
              },
              "domains": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available": {
                      "type": "boolean"
                    },
                    "priceUsd": {
                      "type": "number"
                    },
                    "tld": {
                      "type": "string"
                    }
                  },
                  "required": ["available", "tld"],
                  "type": "object"
                },
                "type": "array"
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "apiAccess": {
                    "description": "Connect a plan (API key) — checks then run on the caller's own plan quota, independent of the free pools. Present when this check was capped.",
                    "type": "string"
                  },
                  "fullResult": {
                    "description": "Full interactive result (free).",
                    "type": "string"
                  },
                  "report": {
                    "description": "Full interactive result on the caller's plan.",
                    "type": "string"
                  },
