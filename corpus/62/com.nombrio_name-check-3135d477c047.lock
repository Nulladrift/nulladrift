            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sessionId": {
                "description": "The sessionId returned by start_naming_session.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["sessionId"],
            "type": "object"
          },
          "outputSchema": {
