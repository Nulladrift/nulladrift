{
  "lockfileVersion": 2,
  "subjects": {
    "com.rate-my-agent.mcp/rate-my-agent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.rate-my-agent.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "rate-my-agent",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Rate-My-Agent.com publishes verified client reviews of real estate agents and runs a free agent-matching service for buyers and sellers across the United States and Canada.\n\nThis connector can do three things: report verified-review statistics for a city (get_local_agent_review_data), return the matching questionnaire (get_matching_questions), and submit a completed request so the service can match the user with an agent (submit_match_request).\n\nA typical flow: share the review statistics for the user's city if useful, ask the questionnaire questions, echo the answers and contact details back for confirmation, then submit. Matching is available in every US and Canadian city, including those with few local reviews.\n\nQuestionnaire style: ask ONE question at a time. Present its answer options as a NUMBERED list (1, 2, 3, …) and end with \"Reply with the number or the answer.\" Renumber from 1 for every question, and accept either the number or the text — \"2\" and \"Condo\" mean the same thing.\n\nThe location question depends on buying versus selling: for a SELLER, ask for the property's full street address, because the match is made on the actual property being sold. For a BUYER, ask which city or neighbourhood they are targeting — a street address is not needed.\n\nBefore calling submit_match_request, show the user their answers and contact details and get an explicit confirmation, so it is unmistakable that submitting sends their information to the matching service.",
      "tools": [
        {
          "name": "get_local_agent_review_data",
          "title": "Verified-review statistics for a city",
          "description": "Returns Rate-My-Agent.com's verified-review statistics for one city: how many reviewed agents and verified reviews exist there and site-wide, the average rating, the most-reviewed neighbourhoods, and whether the free matching service covers that city (it covers every US and Canadian city). Call it when the user asks about real estate agents in a specific place, or before running the matching questionnaire, to show what the ratings are based on. It returns aggregate statistics only — it does not return, rank or recommend individual agents. To collect the user's requirements, call get_matching_questions next.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. \"Austin\" or \"Vancouver\".",
                "type": "string"
              },
              "prov_state": {
                "description": "2-letter province/state code, e.g. \"BC\", \"TX\".",
                "type": "string"
              }
            },
            "required": ["city", "prov_state"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adapter_version": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "city_proof": {},
              "coverage": {},
              "network_proof": {},
              "prov_state": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1de176b90f3bc6d2639d60baa396d7a505ea6e535188b6c03bccc41e5fad7e7b"
        },
        {
          "name": "get_matching_questions",
          "title": "Agent-matching questionnaire",
          "description": "Returns the questions the matching service asks, each with its exact answer options and the values submit_match_request expects, plus the questionnaire version. Call it when the user wants to be matched with an agent, so the questions and accepted values always come from the service itself rather than from memory. Ask only the questions the conversation has not already answered, one at a time, presenting options as a numbered list. Financing applies to buyers and property condition to sellers. Once every required question is answered and you have the user's name, email and phone, confirm the details with them and call submit_match_request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adapter_version": {
                "type": "string"
              },
              "assistant_instructions": {
                "type": "string"
              },
              "principle": {
                "type": "string"
              },
              "questions": {},
              "quiz_version": {
                "type": "string"
              },
              "then": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c2597f23be08ebe977ac30ac09ead21b392c05cf4944f2395e09d6c6acd9e99e"
        },
        {
          "name": "submit_match_request",
          "title": "Submit a request to be matched with an agent",
          "description": "Submits the user's completed questionnaire and contact details to Rate-My-Agent.com's free agent-matching service. Call it only after showing the user their answers and contact details and receiving an explicit confirmation; set consent to true to record that confirmation. Use each option's exact value from get_matching_questions. Handling the result: report success only on \"ok\":true, and relay the returned message verbatim. On \"ok\":false with code \"no_response\" the service did not answer in time — call it once more. On \"ok\":false with a field and message (for example an invalid email), tell the user what to correct, collect the new value and submit again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "For SELLERS: the property's full street address. For BUYERS: the city or neighbourhood they are targeting.",
                "type": "string"
              },
              "also_buying_or_selling": {
                "enum": ["yes", "no", "maybe"],
                "type": "string"
              },
              "budget": {
                "description": "Use an exact option value from get_matching_questions.",
                "type": "string"
              },
              "buy_sell": {
                "enum": ["buying", "selling"],
                "type": "string"
              },
              "consent": {
                "description": "Set to true ONLY after the user picks \"1. Confirm and Submit Request\". Must be true to submit.",
                "type": "boolean"
              },
              "email": {
                "type": "string"
              },
              "financing_help": {
                "description": "Buyers only — exact option value.",
                "type": "string"
              },
              "full_name": {
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "phone": {
                "description": "North-American number; 10 digits.",
                "type": "string"
              },
              "property_condition": {
                "description": "Sellers only — exact option value.",
                "type": "string"
              },
              "property_type": {
                "enum": ["single_family", "condominium", "townhouse", "commercial", "vacant_lot", "other"],
                "type": "string"
              },
              "quiz_version": {
                "default": "mcp-v1",
                "type": "string"
              }
            },
            "required": ["address", "buy_sell", "consent", "email", "full_name", "phone"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "e.g. invalid_input, invalid_email, no_response.",
                "type": "string"
              },
              "field": {
                "description": "Which field to correct, when applicable.",
                "type": "string"
              },
              "http_status": {
                "type": "number"
              },
              "message": {
                "description": "Relay verbatim on success; on error, the fix to explain.",
                "type": "string"
              },
              "ok": {
                "description": "true only when the lead was accepted.",
                "type": "boolean"
              },
              "retryable": {
                "description": "true means submit once more.",
                "type": "boolean"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:651934bc34e7323efabc4ad6540364d8736153c846c779926a690dd5930ec4a0"
        }
      ],
      "digest": "sha256:9f511b49ee707e33f52b82f17b04287fb96330b8850a78506b98d99e47a6c1e2"
    }
  }
}
