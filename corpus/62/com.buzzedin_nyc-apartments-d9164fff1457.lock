          "name": "search_listings",
          "title": "Search NYC apartments",
          "description": "Searches active NYC rental listings from StreetEasy, LeaseBreak, NYBits, Reddit, and building websites, plus lease takeovers posted on Buzzedin. Supports price, bedrooms, neighborhoods, boroughs, move-in dates, commute time to an address, distance to places (subway, grocery, a named store), amenities, rent-stabilized buildings, lease takeovers, and apartment qualities like natural light or quiet. Returns up to 8 listings with a deal-score estimate, how each rent compares to its neighborhood median, selected structured features such as laundry, outdoor space, pets and light, plus a public detail link for each apartment. Enrichment and deal scores are estimates; confirm details on the listing. Fetch the next page to see more results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "baths": {
                "description": "Minimum number of bathrooms",
                "type": "number"
              },
              "beds": {
                "description": "Bedroom counts as a list. 0 is a studio and 4 means 4 or more. \"1br\"=[1], \"studio or 1br\"=[0,1], \"1 or 2 bedrooms\"=[1,2], \"2+ bedrooms\"=[2,3,4]",
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": -9007199254740991,
                  "type": "integer"
                },
                "type": "array"
              },
              "borough": {
                "description": "Borough name if mentioned: Manhattan, Brooklyn, Queens, Bronx, Staten Island",
                "enum": ["Manhattan", "Brooklyn", "Queens", "Bronx", "Staten Island"],
                "type": "string"
              },
              "buildingCondition": {
                "description": "Building condition/maintenance level",
                "enum": ["excellent", "good", "fair", "poor"],
                "type": "string"
              },
              "buildingType": {
                "description": "Building type. \"high rise\"=\"high_rise\", \"walkup\"=\"walk_up\"",
                "enum": ["high_rise", "mid_rise", "walk_up", "townhouse", "brownstone"],
                "type": "string"
              },
              "catsAllowed": {
                "description": "Cats allowed",
                "type": "boolean"
              },
              "commuteFilter": {
                "description": "Filter by commute time to a SPECIFIC location",
                "properties": {
                  "destination": {
                    "description": "Specific address, place name, or landmark (e.g., \"Grand Central\", \"350 5th Ave\", \"my office at 123 Main St\")",
                    "type": "string"
                  },
                  "maxMinutes": {
                    "description": "Maximum commute time in minutes. Use 30 when the query does not specify.",
                    "maximum": 90,
                    "minimum": 1,
                    "type": "number"
                  },
                  "mode": {
                    "description": "Transportation mode (walking, transit, cycling, driving). Use \"transit\" when the query does not specify.",
                    "enum": ["transit", "walking", "cycling", "driving"],
                    "type": "string"
                  }
                },
                "required": ["destination", "maxMinutes", "mode"],
                "type": "object"
              },
