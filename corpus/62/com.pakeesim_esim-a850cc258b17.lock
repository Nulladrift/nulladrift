      "serverInfo": {
        "name": "pakeesim",
        "title": "Pakeesim eSIM",
        "version": "2.2.0",
        "description": "Travel data eSIMs for 80+ countries: live prices and availability, order online, get the QR code.",
        "websiteUrl": "https://pakeesim.com/",
        "icons": [
          {
            "src": "https://pakeesim.com/icon.svg",
            "mimeType": "image/svg+xml",
