        {
          "name": "cari_paket",
          "title": "Search eSIM plans",
          "description": "Search Pakeesim's live catalogue of prepaid travel data eSIMs (prices in IDR, live sale prices and availability). Use it when the user asks for eSIM or travel data plans for a destination. `tujuan` is free text in any language: a country, city or region, optionally with days and data (\"Japan 7 days 3GB\", \"eSIM Jepang seminggu\", \"日本 5日間\", \"eSIM Europa 15 días\", \"유럽 2주\"). Returns `saran` (cheapest available plan covering the stated days/data), then plans in recommended order: the country's own plans, then regional and Global plans that also cover it. Without `tujuan` and filters: one line per destination with plan count and lowest price.",
          "inputSchema": {
            "properties": {
              "bahasa": {
                "description": "Label language: id (Indonesian, default) or en.",
                "enum": ["id", "en"],
                "type": "string"
              },
              "batas": {
                "description": "Maximum plans returned (default 60).",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "hargaMaksIdr": {
                "description": "Only plans at or below this price (IDR).",
                "minimum": 1,
                "type": "integer"
              },
              "kuotaMinGb": {
                "description": "Only plans with at least this much data (GB).",
                "minimum": 0,
                "type": "number"
              },
              "masaAktifMinHari": {
                "description": "Only plans valid for at least this many days.",
                "minimum": 1,
                "type": "integer"
              },
              "tujuan": {
                "description": "Destination and needs in the user's own words, any language.",
                "type": "string"
              },
              "urut": {
                "description": "Sort order (default rekomendasi).",
                "enum": ["rekomendasi", "harga", "perHari", "kuota"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "catatan": {
                "type": "string"
              },
              "destinasi": {
                "items": {
                  "properties": {
                    "jumlahNegara": {
                      "type": "integer"
                    },
                    "jumlahPaket": {
                      "type": "integer"
                    },
                    "mulaiIdr": {
                      "type": "integer"
                    },
                    "wilayah": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "dipahami": {
                "type": "object"
              },
              "jumlah": {
                "type": "integer"
              },
              "negara": {
                "type": ["string", "null"]
              },
              "paket": {
                "items": {
                  "properties": {
                    "checkoutUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "hargaIdr": {
                      "description": "Final price the user pays now, any sale included. Present this as the price.",
                      "type": "integer"
                    },
                    "hargaNormalIdr": {
                      "description": "Normal price before the sale, shown struck through next to the final price. Not what the user pays.",
                      "type": "integer"
                    },
                    "hematIdr": {
                      "description": "Saving per eSIM in IDR (normal price minus final price). A saving, never the price.",
                      "type": "integer"
                    },
                    "hematPersen": {
                      "description": "Saving versus the normal price, in percent.",
                      "type": "integer"
                    },
                    "jaringan": {
                      "type": ["string", "null"]
                    },
                    "kuotaGb": {
                      "type": "number"
                    },
                    "labelHarga": {
                      "description": "Ready-to-show price line: final price, normal price, saving in % and IDR, and when the sale ends (WIB, UTC+7).",
                      "type": "string"
                    },
                    "masaAktifHari": {
                      "type": "integer"
                    },
                    "nama": {
                      "type": "string"
                    },
                    "negaraTercakup": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "perHariIdr": {
                      "type": "integer"
                    },
                    "promo": {
                      "enum": ["flash", "diskon"],
                      "type": "string"
