      },
      "instructions": "Pakeesim is an Indonesian online store selling prepaid travel data eSIMs (data only, prices in IDR, no physical SIM, the user's own number keeps working). Use these tools when the user asks to find, compare or buy a Pakeesim travel data eSIM (any language). Prices, sales and availability are live.\nFlow:\n1. cari_paket with the user's words as `tujuan` (any language: \"Japan 7 days\", \"eSIM Jepang seminggu\", \"日本 5日間\", \"Europa 15 días\"). It returns plans and, when days/data are known, `saran` = the cheapest plan that covers them. promo_berjalan lists current sales; detail_paket explains one plan.\n2. If the user is unsure their phone supports eSIM, use cek_perangkat. Before ordering, the user must explicitly accept the statement in info_checkout.persetujuan (phone supports eSIM and is not carrier-locked). Get their name and email.\n3. If the user has a promo code, check it with hitung_harga. Then buat_pesanan creates the order and returns the amount, pembayaran.tautanBayar, a private order URL and a token. Give the user tautanBayar: it opens their order page on pakeesim.com, where they pay online through the payment gateway (Bank virtual accounts, GoPay, and credit/debit cards); the order is confirmed automatically, no receipt upload. The assistant never pays and never asks for card or bank details. Unpaid orders expire after 3 hours.\n4. cek_pesanan returns the status and, once delivered, the eSIM (QR payload, SM-DP+ address, activation code). The QR code is also emailed.\nSale prices: show the final price (hargaIdr) as the price, the normal price struck through (hargaNormalIdr), the saving in % and IDR (hematPersen, hematIdr) and, for flash sales, when it ends (promoBerakhir); labelHarga has this ready to show. Never present the saving amount as the price.\nKeep the order URL/token for the user: it is the only way to open the order without an account. Reply in the user's language; `bahasa` only switches labels between Indonesian (id) and English (en).\nIn clients that show interactive cards (MCP Apps), cari_paket and detail_paket show plan cards with a Choose button, and buat_pesanan and cek_pesanan show an order card with the pay button (opens the order page on pakeesim.com) and, once delivered, the QR code. When the user taps Choose, the chat receives their choice: continue with step 2.",
      "tools": [
        {
          "name": "buat_pesanan",
          "title": "Create an order",
          "description": "Creates an order for the user and emails them the order link. Only call this after the user chose the plan and explicitly confirmed this statement: \"I have checked: my phone supports eSIM and is not carrier-locked (SIM Lock). I understand this eSIM is for internet only — no phone number, texts, or calls — and cannot be topped up.\" No money moves yet: the user pays online on their order page at pakeesim.com (payment gateway), and the result has the amount and that link (`pembayaran.tautanBayar`). Send a `kunciIdempotensi` so a retried call returns the same order instead of a duplicate. Limited to a few orders per email per 10 minutes.",
          "inputSchema": {
            "properties": {
              "bahasa": {
                "description": "Label language: id (Indonesian, default) or en.",
                "enum": ["id", "en"],
                "type": "string"
              },
              "catatan": {
                "description": "Optional note, e.g. departure date.",
                "maxLength": 500,
                "type": "string"
              },
              "email": {
                "description": "Buyer's email; the order link and QR code are sent here.",
                "format": "email",
                "type": "string"
              },
              "jumlah": {
                "default": 1,
                "description": "Number of eSIMs (one per phone).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "kodePromo": {
                "description": "Optional promo code the user gave you.",
                "maxLength": 40,
                "type": "string"
              },
              "kunciIdempotensi": {
                "description": "Optional unique key for this purchase (e.g. a UUID). Repeating the call with the same key, email and plan returns the same order for 24 hours.",
                "maxLength": 100,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "metodePembayaran": {
                "description": "Optional online payment method id from info_checkout. Omit it to use the first listed method.",
                "type": "string"
              },
              "nama": {
                "description": "Buyer's full name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "produk": {
                "description": "Plan slug from cari_paket.",
                "type": "string"
              },
              "setujuKompatibel": {
                "const": true,
                "description": "true only if the user confirmed their phone supports eSIM and is not carrier-locked.",
                "type": "boolean"
              }
            },
            "required": ["email", "nama", "produk", "setujuKompatibel"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "diskonIdr": {
                "type": "integer"
              },
              "esim": {
                "items": {
                  "properties": {
                    "activationCode": {
                      "type": "string"
                    },
                    "qrPayload": {
                      "type": "string"
                    },
                    "smdpAddress": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "expiresAt": {
                "format": "date-time",
                "type": ["string", "null"]
              },
              "labelStatus": {
                "type": "string"
              },
              "langkahBerikutnya": {
                "type": "string"
              },
              "orderNumber": {
                "type": "string"
              },
              "pembayaran": {
                "type": ["object", "null"]
              },
              "status": {
                "type": "string"
              },
              "subtotalIdr": {
                "type": "integer"
              },
              "tautan": {
                "type": "object"
              },
              "token": {
                "type": "string"
              },
              "totalIdr": {
                "type": "integer"
              }
            },
            "required": ["langkahBerikutnya", "orderNumber", "status", "totalIdr"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an order"
