                          "type": "boolean"
                        },
                        "office": {
                          "enum": ["EM", "US", "RO", "WO"],
                          "type": "string"
                        },
                        "searched": {
                          "const": true,
                          "type": "boolean"
                        },
                        "source": {
                          "type": "string"
                        }
                      },
                      "required": ["counts", "examined", "found", "marks", "office", "searched", "source"],
                      "type": "object"
                    },
