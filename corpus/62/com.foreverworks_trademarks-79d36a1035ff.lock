                          "minimum": 0,
                          "type": "integer"
                        },
                        "goods_filter": {
                          "description": "Whether this office's marks were filtered by the goods asked for; unsupported: listed unfiltered",
                          "enum": ["applied", "unsupported"],
                          "type": "string"
                        },
                        "marks": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "classes": {
                                "items": {
                                  "maximum": 9007199254740991,
                                  "minimum": -9007199254740991,
                                  "type": "integer"
                                },
                                "type": "array"
                              },
                              "filed": {
                                "type": "string"
                              },
                              "id": {
                                "type": "string"
                              },
                              "kind": {
                                "type": "string"
                              },
                              "link": {
