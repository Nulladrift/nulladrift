        {
          "name": "find_products",
          "description": "Search promotable products by campaign, merchant, category, or free-text query. Omit all filters to list ALL promotable products. Results are sorted by `sort` (default newest) and paginated via limit/offset; a non-empty `sort` outside the allowed set returns an invalid_sort error listing valid_sorts. Only products from billing-active merchants are returned. Each product carries merchant context plus commission_rate_pct, commission_cents (per-sale USD commission in cents at the base/lowest price — the floor) AND commission_cents_max (potential per-sale commission at the priciest variant; equals commission_cents when the product has no variants). Actual commission is on the real purchased variant. Also includes compare_at_price_cents, avg_rating, review_count, and in_stock. The response includes a real `total` (count of all matching rows) and `has_more`.",
          "inputSchema": {
            "properties": {
              "campaign_id": {
                "description": "Filter to products attached to this campaign (UUID)",
                "type": "string"
              },
              "category": {
                "description": "Filter by coarse_category",
                "enum": ["jewelry", "apparel", "beauty", "home_decor", "food_drink", "tech_gadgets", "saas", "mobile_app", "digital_content", "service", "other"],
                "type": "string"
              },
              "limit": {
                "description": "Max results per page (default 25, max 100)",
                "type": "integer"
              },
              "merchant_id": {
                "description": "Filter by merchant (UUID — the merchants.id, not shopify_merchants.id)",
                "type": "string"
              },
              "offset": {
                "description": "Number of results to skip (pagination, default 0)",
                "type": "integer"
              },
              "query": {
                "description": "Free-text match against product title (case-insensitive)",
                "type": "string"
              },
              "sort": {
                "description": "Sort order (default newest). `commission` orders by per-product commission (price × merchant rate) DESC.",
                "enum": ["newest", "price_asc", "price_desc", "rating", "commission"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
