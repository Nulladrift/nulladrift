      },
      "instructions": "Domain Mail Check: Mail delivery and DNS check. Call delivery_check when the user asks whether mail will reach Gmail or Outlook, or why it is rejected or marked spam. Pass the domain and the sending IP when known, and mail_from when the user gives the Return-Path domain of a sent message. Give the verdict, then the top causes with fixes, then the source links. likely_accepted means no published rule is broken, not that the inbox is certain. Mention not_checked items only when they matter. Call launch_score when the user asks whether a new or secondary domain is ready for cold email. Give the score, the verdict and the fix_first list, and say whether each fix is standard or opinion. Never present an opinion as a requirement, and say the score does not promise the inbox. A domain under 14 days old fails an opinion rule: tell the user to wait and warm up, not that the domain is broken. Call check_dns_hygiene when the user asks about CAA, DNSSEC, STARTTLS or encrypted mail delivery, dangling CNAMEs or subdomain takeover, or for a wider DNS security check than SPF, DKIM and DMARC. Give the faults with their fixes first. A dangling CNAME is a risk to fix, not proof that someone took the subdomain over. could_not_connect or refused on a mail server means it was not read, never that STARTTLS is missing. Call check_email_auth for SPF, DMARC, DKIM and a spoofing grade, check_dns_records for A, AAAA, MX, TXT, CAA or NS records, and lookup_domain_registration for registrar, dates and name servers. Pass dkim_selectors only when the user or their mail provider names them. DKIM cannot be found without a selector, so unknown is not a failure. Give the grade with its issues and fixes, and the source and as_of date. When something fails, give the records_to_paste as they are, each with its name, value and whether it replaces a record, then the fix_steps; a record marked later is the next step, not a fix. check_email_auth returns a page link to a web page with the same check: give it when the user may want to see the result in a browser or send it to the domain's owner. unavailable means a lookup failed: say so and do not guess. not_found means the name does not exist in DNS. registered false means the registry has no record, so the domain is usually free to register. These tools never return registrant or owner details: decline requests for an owner's name, email or phone and offer the registrar instead. They do not discover subdomains or send mail; delivery_check tests published rules and blocklists, not a real message. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "check_dns_hygiene",
          "title": "Check DNS security faults",
          "description": "Use this when the user asks about a domain's CAA record, DNSSEC, whether its mail servers offer STARTTLS, dangling CNAMEs or subdomain takeover risk, such as \"does example.com have DNSSEC and CAA?\" or \"is any subdomain of acme.co.uk dangling?\". Pass the domain. Returns 4 checks, each pass, fail, unknown or skipped with a detail and a fix: caa (the records), dnssec (signed, unsigned or broken), starttls (a result per mail server) and dangling_cnames (of 20 common names, CNAMEs to a missing name, each registrable, service or stale), a faults list worst first, and the source and as_of date. It reads public DNS and only the EHLO answer of up to 2 mail servers: it sends no mail, and it never registers or claims a name to test a takeover.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain, such as \"example.com\". A web address or an email address is reduced to its domain.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
