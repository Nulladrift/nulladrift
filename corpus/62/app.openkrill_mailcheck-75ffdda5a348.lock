        {
          "name": "check_dns_records",
          "title": "Look up DNS records",
          "description": "Use this when the user asks for a domain's DNS records, its mail provider or which certificate authorities may issue for it, such as \"which mail provider does acme.io use?\" or \"show the MX and CAA records for github.com\". Pass the domain and optionally up to 6 record types from A, AAAA, MX, TXT, CAA and NS (default: all). Returns each type's records with TTL, the mail provider named by the MX hosts, and the source and as_of date. It reads public DNS only; it cannot list subdomains or other record types.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain, such as \"example.com\". A web address or an email address is reduced to its domain.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "types": {
                "description": "Record types to read. Default: all of A, NS, MX, TXT, AAAA, CAA.",
                "items": {
                  "enum": ["A", "NS", "MX", "TXT", "AAAA", "CAA"],
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "mail_provider": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "records": {
                "additionalProperties": {
                  "properties": {
                    "count": {
                      "type": "number"
                    },
                    "items": {
                      "items": {
                        "properties": {
                          "priority": {
                            "type": "number"
                          },
                          "ttl": {
                            "type": "number"
                          },
                          "value": {
                            "type": "string"
                          }
                        },
                        "required": ["ttl", "value"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["count", "items"],
                  "type": "object"
                },
                "type": "object"
              },
              "source": {
                "type": "string"
              },
              "status": {
                "enum": ["ok", "not_found", "unavailable"],
                "type": "string"
              },
              "unavailable": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["as_of", "domain", "records", "source", "status", "unavailable"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
