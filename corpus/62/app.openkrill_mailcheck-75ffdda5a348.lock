                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "subdomain_policy": {
                    "enum": ["none", "quarantine", "reject", null],
                    "type": ["string", "null"]
                  }
                },
                "required": ["found", "issues"],
                "type": ["object", "null"]
              },
              "domain": {
                "type": "string"
              },
              "fix_steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fixes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "grade": {
                "enum": ["A", "B", "C", "D", "F", null],
                "type": ["string", "null"]
              },
              "grade_basis": {
                "type": "string"
              },
              "mail_provider": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "mx": {
                "items": {
                  "properties": {
                    "host": {
                      "type": "string"
                    },
                    "priority": {
                      "type": "number"
                    }
                  },
                  "required": ["host", "priority"],
                  "type": "object"
                },
                "type": "array"
              },
