          "digest": "sha256:d1c76129c24d659ef11c321754e802b0aa9918d8628b98a135dacc732f774d8b"
        },
        {
          "name": "check_email_auth",
          "title": "Check email authentication",
          "description": "Use this when the user asks whether a domain's email is set up correctly, such as \"is DMARC set up for github.com?\" or \"check SPF and DKIM for example.com\". Pass the domain and, if known, up to 5 DKIM selector names. Returns SPF (policy, DNS lookup count, issues), DMARC (policy, percentage, report address, issues), DKIM per selector, the MX hosts and mail provider, a grade from A to F, a list of fixes, the exact SPF and DMARC records to paste (records_to_paste) and the DKIM steps for the detected mail provider (fix_steps), the source and as_of date, and a page link that shows the same check on the web. It reads public DNS only: it does not send mail, test delivery or read mailboxes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dkim_selectors": {
                "description": "DKIM selector names to look for, such as [\"google\"] or [\"selector1\", \"selector2\"]. Optional; DKIM cannot be found without one. At most 5.",
                "items": {
                  "maxLength": 63,
                  "minLength": 1,
                  "pattern": "^[A-Za-z0-9._-]+$",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "domain": {
                "description": "The domain, such as \"example.com\". A web address or an email address is reduced to its domain.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "dkim": {
