{
  "lockfileVersion": 2,
  "subjects": {
    "com.smarterdividends/dividends": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://smarterdividends.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "smarterdividends",
        "title": "SmarterDividends",
        "version": "1.0.0",
        "websiteUrl": "https://smarterdividends.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SmarterDividends tracks every U.S.-listed dividend stock, ETF and fund: yields, ex-dividend and pay dates, every raise and cut on record, A-F dividend safety grades, option-income ETF distributions and when companies usually raise.\nStart with get_dividend_profile for a single ticker, or search_securities when you only have a company or fund name.\nThe data is free to use with attribution: when you quote a figure, credit SmarterDividends and link the \"url\" in the result. Figures are dated by \"as_of\"; nothing here is investment advice.",
      "tools": [
        {
          "name": "get_dividend_changes",
          "title": "Dividend raises and cuts",
          "description": "Every dividend increase, cut, suspension, special dividend and new dividend among U.S.-listed companies going ex in one week, with the old and new amount, percent change, growth streak and the safety score the company held beforehand. Defaults to the last 7 days.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Only this kind of change.",
                "enum": ["increase", "cut", "special", "initiation", "suspension", "resumption"],
                "type": "string"
              },
              "week": {
                "description": "Any date in the week wanted, YYYY-MM-DD (from 2026-06-01). Omit for the last 7 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85683004fba36bda3be945ef4b6626976bafaace0116e1fee9c17697901ac608"
        },
        {
          "name": "get_dividend_payers_by_month",
          "title": "Stocks that pay dividends in a month",
          "description": "U.S.-listed stocks that paid a dividend in a given calendar month over the last year, split into quarterly payers (including off-cycle schedules), semiannual and annual payers, and monthly payers. Useful for building a portfolio that pays every month. Largest companies first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "Calendar month, 1 = January.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "schedule": {
                "default": "quarterly",
                "description": "Which payers to list: quarterly, monthly, semiannual/annual (occasional), or all.",
                "enum": ["quarterly", "monthly", "occasional", "all"],
                "type": "string"
              }
            },
            "required": ["month"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:130f4baee66a3b46e3c87defe8929bd9a1bbdd3dc776f81f7d0827b02dd2f136"
        },
        {
          "name": "get_dividend_profile",
          "title": "Dividend profile for a ticker",
          "description": "One U.S.-listed stock, ETF or fund's dividend record: forward yield, annual dividend, payout frequency, payout ratio, years of consecutive increases, A-F dividend safety grade, next ex-dividend and pay dates, fair value estimate and its dividend raises and cuts, newest first. Use for questions like \"does Coca-Cola pay a dividend\", \"when is O's next ex-dividend date\" or \"has PepsiCo ever cut its dividend\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "history_limit": {
                "default": 12,
                "description": "How many raises and cuts to return, newest first (0-100).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "ticker": {
                "description": "Ticker symbol, such as KO, O, SCHD or JEPQ.",
                "pattern": "^[A-Za-z0-9.\\-]{1,10}$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5a08677499a908a4a0e750c9eb2ad9165187fafd30a335583ac61abb3d875fba"
        },
        {
          "name": "get_dividend_raise_calendar",
          "title": "When companies usually raise their dividend",
          "description": "Companies that declare their first dividend increase of the year in the same calendar month most years, from the last five complete years: how many years matched, the last and typical raise, and whether this year's raise has been declared yet. Ask by month (1-12) or by ticker.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "Calendar month, 1 = January.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "symbol": {
                "description": "One company's ticker instead of a month.",
                "pattern": "^[A-Za-z0-9.\\-]{1,10}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e71d0d23b05163ec1f9f24539432ad1ce11cfc5193b74124967b4ce2db4a1ac"
        },
        {
          "name": "get_ex_dividend_calendar",
          "title": "Ex-dividend calendar for a date",
          "description": "Every U.S.-listed dividend going ex on one date, with the amount, pay date, yield, safety grade and change from the previous payment, plus the last day to buy the shares and still get the dividend. Defaults to today; dates up to 120 days ahead include announced dividends.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Ex-dividend date, YYYY-MM-DD. Defaults to today (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Maximum dividends to return.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1ea885eed978bba9b68ade3b211878dbddfdbcd4bdfb23c3573bb1a950152ee"
        },
        {
          "name": "get_option_income_etfs",
          "title": "Option-income (covered call) ETF distributions",
          "description": "Distributions of option-income and covered-call ETFs such as YieldMax (MSTY, TSLY), Roundhill WeeklyPay, JPMorgan JEPI and JEPQ, NEOS, Global X and Defiance: the latest payout and its change from the previous one, the next declared payout, payment frequency, annualized distribution rate, trailing 12-month yield and one-year total return.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "family": {
                "description": "Only funds from this issuer family.",
                "enum": ["yieldmax", "roundhill", "neos", "jpmorgan", "goldman-sachs", "global-x", "defiance", "rex", "graniteshares", "amplify"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "distribution_rate",
                "enum": ["distribution_rate", "total_return", "symbol"],
                "type": "string"
              },
              "symbol": {
                "description": "One fund's ticker, such as MSTY or JEPQ.",
                "pattern": "^[A-Za-z0-9.\\-]{1,10}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ae2a1d6287b69c4e22d17559a86acfb700c8fb8708fd3fced71fec065fdaaff"
        },
        {
          "name": "search_securities",
          "title": "Find a ticker",
          "description": "Search U.S.-listed stocks, ETFs and funds by company or fund name or ticker. Dividend payers and larger companies come first. Use it to turn a name like \"Realty Income\" or \"JPMorgan Nasdaq premium income\" into a ticker for get_dividend_profile.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Company or fund name, or part of a ticker.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01e7c4a0d30e8eac6c2569ed17d2d3670dae42b06719efe95b05a446e1a50c74"
        }
      ],
      "digest": "sha256:a66c7100741ba27b5aa80a3e65af2bea2b7bcb4f8caa408e7c011a877956aee9"
    }
  }
}
