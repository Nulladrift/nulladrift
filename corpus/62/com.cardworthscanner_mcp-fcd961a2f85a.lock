          "title": "Trading Card Border Centering Ratio & PSA 10 Tolerance Calculator",
          "description": "Calculate trading card border centering ratios (Left/Right and Top/Bottom in mm or px) and determine maximum eligible grades across PSA (55/45), BGS (Black Label 50/50), CGC, and TAG.",
          "inputSchema": {
            "properties": {
              "bottomMm": {
                "description": "Bottom border width in mm or pixels (e.g. 2.5)",
                "type": "number"
              },
              "leftMm": {
                "description": "Left border width in mm or pixels (e.g. 2.4)",
                "type": "number"
              },
              "rightMm": {
                "description": "Right border width in mm or pixels (e.g. 2.6)",
                "type": "number"
              },
              "topMm": {
                "description": "Top border width in mm or pixels (e.g. 2.5)",
                "type": "number"
              }
            },
            "required": ["bottomMm", "leftMm", "rightMm", "topMm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
