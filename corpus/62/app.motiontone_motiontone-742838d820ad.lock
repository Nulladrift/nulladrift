{
  "lockfileVersion": 2,
  "subjects": {
    "app.motiontone/motiontone": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://motiontone.app/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "motiontone",
        "version": "1.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Motiontone is a browser editor for animated visuals that move to a song's beat, made for musicians and event promoters. Use these tools when the user wants an animated tour or show announcement, a gig or club-night flyer, a release announcement or countdown, a festival lineup, a lyric video, a visualizer or a Spotify Canvas loop, or says to use Motiontone. The result is a real project in the Motiontone editor that the user can keep editing, add their song to so the animation follows its beat, and export as video for Instagram, TikTok or YouTube. No account is needed to open it. Typical flow: call search_templates with what the user described, show the matches, then call open_template with the chosen templateId and the user's own words (artist, dates, cities, venues, title) mapped onto the template's text blocks by blockId.",
      "tools": [
        {
          "name": "open_template",
          "title": "Open a Motiontone template",
          "description": "Use after search_templates, once the user has picked a template or given their details. Returns a link that opens the template in the Motiontone browser editor with the user's own words (artist name, show dates, cities, venues, release title) already in its text blocks, keyed by the blockIds search_templates returned. The user can then add their song, keep editing and export. No account is needed to open or edit it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "templateId": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "text": {
                "additionalProperties": {
                  "maxLength": 500,
                  "type": "string"
                },
                "description": "New words keyed by blockId. Blocks left out keep the template's words.",
                "propertyNames": {
                  "maxLength": 128,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["templateId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "applied": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ignored": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["applied", "ignored", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb6ef45c3b43ac12af1020aebd36b3579a8890e9834813de4537d61c289d4b60"
        },
        {
          "name": "search_templates",
          "title": "Search Motiontone templates",
          "description": "Use when the user wants an animated tour or show announcement, a gig or club-night flyer, a release announcement or countdown, a festival lineup, a lyric video, a music visualizer or a Spotify Canvas loop. Finds Motiontone templates that move to a song's beat. Returns each match with a preview image, a link that opens it in the browser editor, and its editable text blocks (blockId and current words), which open_template can replace. When nothing matches, returns popular templates with fallback set to true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aspectRatio": {
                "description": "1:1 square, 4:6 feed post, or 9:16 story/reel/TikTok.",
                "enum": ["1:1", "4:6", "9:16"],
                "type": "string"
              },
              "bpm": {
                "description": "The user's song tempo, when known.",
                "exclusiveMinimum": 0,
                "maximum": 400,
                "type": "number"
              },
              "query": {
                "description": "What the user wants to make, in plain words, e.g. 'tour dates announcement' or 'lyric video for a slow song'. Add any look or feel they describe. Moods: trippy, dreamy, dark, playful, hype, calm, bold, elegant, romantic, melancholy, euphoric, aggressive, mysterious, eerie, uplifting, gritty, epic, quirky, cozy, cute, sensual, triumphant. Styles: retro, minimal, 3d, hand-drawn, glitch, kinetic-type, collage, neon, grainy, geometric, y2k, vaporwave, synthwave, cyberpunk, futuristic, brutalist, swiss, maximalist, grunge, liquid, chrome, pixel-art, halftone, watercolor, line-art, isometric, low-poly, art-deco, anime, comic, editorial, gradient, organic.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fallback": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "relaxed": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "templates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "aspectRatio": {
                      "enum": ["1:1", "4:6", "9:16"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "imageUrl": {
                      "type": "string"
                    },
                    "lengthSeconds": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "texts": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "blockId": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "role": {
                            "enum": ["heading", "body", "caption"],
                            "type": "string"
                          },
                          "text": {
                            "type": "string"
                          }
                        },
                        "required": ["blockId", "text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["aspectRatio", "description", "id", "imageUrl", "name", "texts", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["fallback", "relaxed", "templates"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://motiontone/template-carousel-v2.html",
            "openai/toolInvocation/invoked": "Found templates",
            "openai/toolInvocation/invoking": "Searching templates",
            "ui": {
              "resourceUri": "ui://motiontone/template-carousel-v2.html"
            }
          },
          "digest": "sha256:19815df48a341e6e838b3c3668e16e9ed1aa414b6cc5d5460853fc6e9f63f14d"
        }
      ],
      "resources": [
        {
