{
  "lockfileVersion": 2,
  "subjects": {
    "bz.manda/manda": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://manda.bz/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "manda",
        "title": "MANDA 売り案件検索",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MANDA (https://manda.bz) はスモールM&Aのマーケットプレイスです。\nこのサーバーでは公開中の売り案件(会社・事業の売却希望)を検索・閲覧できます。\n\n- search_deals で条件検索し、get_deal で詳細を取得します。\n- 業種での絞り込みは list_industries の業種名を search_deals の query キーワードとして使ってください。\n- 地域での絞り込みは list_areas の ID を search_deals の areaId に渡してください。\n- 案件はすべて匿名化された公開情報です。売り手への接触や非公開情報の閲覧には manda.bz での会員登録(無料)が必要です。気になる案件はその url をユーザーに案内してください。",
      "tools": [
        {
          "name": "get_deal",
          "title": "売り案件の詳細を取得",
          "description": "売り案件1件の詳細(事業内容の全文・属性情報など)を取得する。domain と localId は search_deals の結果から得る。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "search_deals の結果の domain",
                "type": "string"
              },
              "localId": {
                "description": "search_deals の結果の localId",
                "type": "string"
              }
            },
            "required": ["domain", "localId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "areaName": {
                "type": "string"
              },
              "attributes": {
                "description": "従業員数などの属性情報",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "value"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "description": {
                "description": "事業内容の全文",
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "industryTypes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "isClose": {
                "description": "true なら成約・掲載終了済み",
                "type": "boolean"
              },
              "isManda": {
                "description": "true なら売り手本人による MANDA 直掲載",
                "type": "boolean"
              },
              "isSoldOut": {
                "type": "boolean"
              },
              "lastModifiedTime": {
                "type": "string"
              },
              "localId": {
                "type": "string"
              },
              "priceText": {
                "description": "譲渡希望額",
                "type": "string"
              },
              "registeredTime": {
                "type": "string"
              },
              "salesText": {
                "description": "売上高",
                "type": "string"
              },
              "sellReasons": {
                "description": "売却理由 (例: retirement, no_successor)。MANDA直掲載の案件のみ",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "案件詳細ページのURL。ユーザーに案件を紹介するときはこれを示す",
                "type": "string"
              }
            },
            "required": ["areaName", "description", "domain", "industryTypes", "isClose", "isManda", "isSoldOut", "lastModifiedTime", "localId", "priceText", "registeredTime", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8978469b916ec5092216b7f3048ac4de7eaa5600d2fae6c0d93efc828454268"
        },
        {
          "name": "list_areas",
          "title": "地域マスタ一覧",
          "description": "地域マスタ(地方・都道府県)の一覧を返す。search_deals の areaId にはここで得た ID を指定する。",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "areas": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "areaId": {
                      "description": "search_deals の areaId に指定するID",
                      "type": "string"
                    },
                    "isRegion": {
                      "description": "true なら地方(都道府県をまとめた単位)",
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "regionId": {
                      "description": "都道府県が属する地方のID",
                      "type": "string"
                    }
                  },
                  "required": ["areaId", "isRegion", "name"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["areas"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67216a33df0e70c2af977f1e883bf61611f3a609d67d99e6fee7c19bede565d9"
        },
        {
          "name": "list_industries",
          "title": "業種マスタ一覧",
          "description": "業種マスタの一覧を返す。search_deals に業種IDフィルタはないため、絞り込みたい場合はここで得た業種名を query のキーワードとして使う。",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "industries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "industryId": {
                      "type": "string"
                    },
                    "isMajorCategory": {
                      "description": "true なら大分類",
                      "type": "boolean"
                    },
                    "name": {
                      "description": "業種名。search_deals の query キーワードとして使える",
                      "type": "string"
                    }
                  },
                  "required": ["industryId", "isMajorCategory", "name"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["industries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc1c8bd90142fd4e21cac326e0960da7cc8d30c213f741f97c5f70090c792548"
        },
        {
          "name": "search_deals",
          "title": "売り案件を検索",
          "description": "MANDA の公開中の売り案件(M&A・事業承継)をキーワード・地域・売上規模・譲渡額などで検索する。結果は1ページ20件。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "areaId": {
                "description": "地域ID。list_areas で得られる地方ID(例: 300)または都道府県ID(例: 306)",
                "type": "string"
              },
              "page": {
                "description": "ページ番号(1始まり)。省略時は1",
                "type": "integer"
              },
              "priceRange": {
                "description": "譲渡希望額レンジ(万円): lt1000 / 1000to5000 / 5000to10000 / 10000to50000 / 50000to100000 / gt100000 / gt10000(1億以上すべて)",
                "type": "string"
              },
              "query": {
                "description": "検索キーワード。案件名・業種名・本文にマッチする。スペース区切りで複数指定可",
                "type": "string"
              },
              "salesRange": {
                "description": "売上高レンジ(万円): lt1000 / 1000to5000 / 5000to10000 / 10000to50000 / 50000to100000 / gt100000 / gt10000(1億以上すべて)",
                "type": "string"
              },
              "sellerType": {
                "description": "owner を指定すると売り手本人が MANDA に直接掲載した案件のみに絞り込む",
                "type": "string"
              },
              "sort": {
                "description": "date を指定すると新着順。省略時は関連度順",
                "type": "string"
              },
              "successionOnly": {
                "description": "true で事業承継案件(後継者不在が売却理由＝高齢経営者の事業承継)のみに絞り込む",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "deals": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "areaName": {
                      "type": "string"
                    },
                    "domain": {
                      "description": "案件の掲載元ドメイン。get_deal の引数に使う",
                      "type": "string"
                    },
                    "industryTypes": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["null", "array"]
                    },
                    "isClose": {
                      "description": "true なら成約・掲載終了済み",
                      "type": "boolean"
                    },
                    "isManda": {
                      "description": "true なら売り手本人による MANDA 直掲載",
                      "type": "boolean"
                    },
                    "localId": {
                      "description": "掲載元内での案件ID。get_deal の引数に使う",
                      "type": "string"
                    },
                    "priceText": {
                      "description": "譲渡希望額",
                      "type": "string"
                    },
                    "registeredTime": {
                      "type": "string"
                    },
                    "salesText": {
                      "description": "売上高",
                      "type": "string"
                    },
                    "summary": {
                      "description": "事業内容の冒頭(全文は get_deal で取得)",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "案件詳細ページのURL。ユーザーに案件を紹介するときはこれを示す",
                      "type": "string"
                    }
                  },
                  "required": ["areaName", "domain", "industryTypes", "isClose", "isManda", "localId", "priceText", "registeredTime", "summary", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "hasNextPage": {
                "type": "boolean"
              },
              "page": {
                "type": "integer"
              },
              "perPage": {
                "type": "integer"
              },
              "total": {
                "description": "検索条件にマッチした総件数",
                "type": "integer"
              }
            },
            "required": ["deals", "hasNextPage", "page", "perPage", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fad1b08f9804b6759ef6f4a76357c0f56d6f4bbe9aaa3227fc17613a72cfe178"
        }
      ],
      "digest": "sha256:626d237432b96eb7236c436c2328062578b7de6497ae78c545827c268fbe64e5"
    }
  }
}
