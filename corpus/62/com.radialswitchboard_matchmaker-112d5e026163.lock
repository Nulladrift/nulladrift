{
  "lockfileVersion": 2,
  "subjects": {
    "com.radialswitchboard/matchmaker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://radialswitchboard.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "MglennP Radial Switchboard",
        "version": "3.5.6"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_agent_dossier",
          "title": "Get Single Agent Security & Runtime Dossier",
          "description": "Retrieve the complete 4-point Virginia Scout runtime heartbeat audit, measured RTT latency, 64-bit MGLE-NNP coupler breakdown, and SHA-256 tool-schema hash for one exact agent_id. Use only when inspecting a known agent_id; use search_agent_directory if you need to find the agent_id first.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "Exact agent or MCP server identifier from the Radial Switchboard phonebook (e.g. 'mcp://...' or registry slug).",
                "type": "string"
              }
            },
            "required": ["agent_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_id": {
                "description": "Requested agent identifier.",
                "type": "string"
              },
              "dossier": {
                "description": "Full runtime audit record, coupler code, and schema hash.",
                "type": "object"
              },
              "found": {
                "description": "True when agent_id exists in the audited phonebook.",
                "type": "boolean"
              }
            },
            "required": ["agent_id", "found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19e27e4082f5afba75dc5ac3919fb3977a60db9cb62fbc2f7a292b98d5e8ea16"
        },
        {
          "name": "get_switchboard_telemetry",
          "title": "Get Live Switchboard Health & Pool Telemetry",
          "description": "Return global US-EAST4 switchboard health, Grade A/B/D/E/F pool counts, autonomous registry crawl cursor state, and external hook telemetry. Use for system-wide status and pool metrics; use get_agent_dossier for an individual agent.",
          "inputSchema": {
            "properties": {
              "include_recent_activity": {
                "description": "When false, omits the 25-item recent_activity caller array for a compact payload (default true).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "live_callable_ab": {
                "description": "Count of live verified Grade A and Grade B endpoints.",
                "type": "integer"
              },
              "spec_version": {
                "description": "Active Radial Switchboard specification revision.",
                "type": "string"
              },
              "status": {
                "description": "Service operational state ('ok').",
                "type": "string"
              },
              "total_unsorted_pool": {
                "description": "Total indexed MCP and A2A records.",
                "type": "integer"
              }
            },
            "required": ["live_callable_ab", "spec_version", "status", "total_unsorted_pool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0efaddf892e5f103d22e3374c3bc44b732a2f38e135678efbc3f3167299321f"
        },
        {
          "name": "matchmake_agent_crew",
          "title": "Matchmake 64-Bit Agent Shortlist or 3-Agent Crew",
          "description": "Rank live heartbeat-verified MCP and A2A endpoints using 64-bit MGLE-NNP bitwise capability masks and return either a provider-diverse shortlist or a 3-agent complementary crew (Compute + Domain + Verifier) with single-use execution tickets. Use when selecting callable agents for a task; use search_agent_directory for raw keyword browsing or get_agent_dossier when you already have an agent_id.",
          "inputSchema": {
            "properties": {
              "caller_region": {
                "description": "Caller geographic zone for round-trip latency affinity ('E' US-East, 'W' US-West, 'U' Europe, 'P' APAC, 'GLOBAL' any).",
                "enum": ["E", "W", "U", "P", "GLOBAL"],
                "type": "string"
              },
              "capabilities": {
                "description": "Optional explicit MGLE-NNP capability switch names (e.g. sql, database, finance_data, file_parse, math_verify, code_exec, web_fetch, search_rag).",
                "items": {
                  "description": "Canonical capability switch identifier from Bits 0..23.",
                  "type": "string"
                },
                "type": "array"
              },
              "intent": {
                "description": "Natural-language task intent used to infer required 64-bit capability switches when capabilities is omitted.",
                "type": "string"
              },
              "max_latency_grade": {
                "description": "Worst acceptable Virginia Scout RTT grade ('A' <=120ms, 'B' <=300ms, 'C' <=700ms default, 'D' <=1500ms, 'ANY' unrestricted live RTT).",
                "enum": ["A", "B", "C", "D", "ANY"],
                "type": "string"
              },
              "mode": {
                "description": "Routing policy: 'top10_varied' for ranked shortlist across distinct vendors, or 'crew' for a 3-role complementary triad.",
                "enum": ["top10_varied", "crew"],
                "type": "string"
              },
              "require_instant_zero_auth": {
                "description": "True (default: true) restricts results strictly to open zero-credential endpoints with verified non-zero tools/list schemas callable immediately without API keys or OAuth.",
                "type": "boolean"
              },
              "top_k": {
                "description": "Maximum number of ranked candidates to return (1..25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "finalist_count": {
                "description": "Number of matched endpoints returned.",
                "type": "integer"
              },
              "finalists": {
                "description": "Ranked candidate agent records including endpoint URL, 64-bit hex ID, and execution_ticket.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "mode": {
                "description": "Applied routing policy identifier.",
                "type": "string"
              },
              "scanned_pool_count": {
                "description": "Total audited phonebook records scanned.",
                "type": "integer"
              }
            },
            "required": ["finalist_count", "finalists", "mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:900b41801e248aba689385a93df1e8da39a72a9edc030e9439790d27169b14bb"
        },
        {
          "name": "register_agent_endpoint",
          "title": "Register or Re-Audit Public MCP/A2A Endpoint",
          "description": "Submit a public HTTPS MCP or A2A endpoint for immediate live SSRF-guarded Virginia Scout interrogation, 64-bit MGLE-NNP grading, and directory indexing. Use when enrolling a new server or appealing a quarantined grade; do not use for private localhost/RFC1918 URLs.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "Optional canonical slug or identifier (e.g. 'com.example/my-mcp'); generated automatically if omitted.",
                "type": "string"
              },
              "description": {
                "description": "Optional summary of capabilities or reason for re-audit.",
                "type": "string"
              },
              "endpoint": {
                "description": "Publicly reachable HTTPS MCP or A2A endpoint URL to interrogate in real time.",
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "appeal_id": {
                "description": "Audit log reference ID.",
                "type": "string"
              },
              "audit_status": {
                "description": "Assigned Virginia Scout runtime audit status.",
                "type": "string"
              },
              "registered": {
                "description": "True when SSRF validation passed and live interrogation completed.",
                "type": "boolean"
              },
              "updated_record": {
                "description": "Resulting phonebook record and 64-bit coupler.",
                "type": "object"
              }
            },
            "required": ["audit_status", "registered"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d21c5a63fa43828ea70c00295a90b001a2f434defae2fa6c4eb2f202fc87242b"
        },
        {
          "name": "report_execution_outcome",
          "title": "Report Post-Handshake Execution Outcome",
          "description": "Submit a single-use HMAC execution_ticket from matchmake_agent_crew to record empirical downstream task completion or failure (+0.05 clean delivery / -0.20 timeout or schema failure on Byte-2 Guarantee grade). Use after invoking a matched agent to close the quality feedback loop.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "Target agent_id that executed the downstream call.",
                "type": "string"
              },
              "execution_ticket": {
                "description": "Single-use HMAC execution_ticket issued by matchmake_agent_crew.",
                "type": "string"
              },
              "observed_latency_ms": {
                "description": "Optional caller-observed round-trip execution latency in milliseconds.",
                "minimum": 0,
                "type": "number"
              },
              "outcome_success": {
                "description": "True if the downstream agent fulfilled its schema contract cleanly; false on timeout, HTTP error, or malformed output.",
                "type": "boolean"
              }
            },
            "required": ["agent_id", "execution_ticket", "outcome_success"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_id": {
                "description": "Evaluated target agent_id.",
                "type": "string"
              },
              "ticket_valid": {
                "description": "True when the single-use HMAC ticket passed verification and updated telemetry.",
                "type": "boolean"
              }
            },
            "required": ["ticket_valid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5818fd0cb6edeeb8d92a73176a5ddf308e5152a66d201da1257246e6a8b005f"
        },
        {
          "name": "search_agent_directory",
          "title": "Search Live Audited Agent Directory",
          "description": "Browse and filter the audited Radial Switchboard phonebook by keyword substring and Virginia Scout health grade without consuming matchmaking call quota. Use when exploring catalog coverage by name, vendor, or grade; use matchmake_agent_crew instead when ranking capability-matched finalists for execution.",
          "inputSchema": {
            "properties": {
              "grade_filter": {
                "description": "Filter by Virginia Scout audit grade ('AB' live <=350ms default, 'A' <=150ms, 'B' <=350ms, 'C' <=700ms, 'D' offline code, 'ALL' every non-poison record).",
                "enum": ["AB", "A", "B", "C", "D", "ALL"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of directory records to return (1..50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional case-insensitive keyword filter matched against agent_id, name, description, and endpoint URL.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agents": {
                "description": "Matching directory records with grade, coupler, and endpoint metadata.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "returned_count": {
                "description": "Number of records included in agents.",
                "type": "integer"
              },
              "total_matching": {
                "description": "Total phonebook records matching the filter.",
                "type": "integer"
              }
            },
            "required": ["agents", "returned_count", "total_matching"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:484efd4c75f8ddb87292bb26c35b587bdd7d90613bc7ccd8587a0e18dca68207"
        }
      ],
      "digest": "sha256:70f15f550b2ed9c38cb5c140fade31314910eb0faa773cee0a6f81bb59f856be"
    }
  }
}
