  "subjects": {
    "ai.inite/inite-visibility": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://inite.ai/api/mcp/analyzer"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "inite-visibility",
        "title": "INITE Visibility",
        "version": "2.3.0",
        "websiteUrl": "https://inite.ai/en/analyze"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "INITE (inite.ai) over MCP. The open tools answer without an account. What needs the person is on each product's signed-in door, which signs them in with OAuth when connected (passkey, email link or password at auth.inite.ai; a new person registers there): https://inite.ai/api/mcp/atlas-owners for a tool's owner, https://inite.ai/api/mcp/analyzer-me for their audits, https://inite.ai/api/mcp/portal-me for their account. When the person wants something this server does not do, inite_connect names the INITE server that does and how to add it; answers whose next step is elsewhere carry it in their next field.\nanalyzer (AI visibility): check_identity is free and instant; visibility_fixes is the fix plan, most important first, with paste-ready files; compare_sites reads your site and a competitor the same way; visibility_history shows how the reading moved; analyze_site runs the audit that asks the answer engines (a survey for guests) and get_analysis reads it.",
      "tools": [
        {
          "name": "analyze_site",
          "title": "Audit a site for AI visibility",
          "description": "The AI visibility audit: the identity files, crawler policy, schema graph and page health, then the answer engines asked whether they name the site, scored out of 100. Starts a run and returns its run_id; it takes about a minute, so call get_analysis with that id. Without an account it runs the survey (the audit without its two paid steps), two a day per address; a free account gets the teaser, a paid plan the whole audit, on the account's own allowance.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A public website, e.g. example.com or https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "runId": {
                "type": "string"
              },
              "tier": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["runId", "tier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Audit a site for AI visibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://inite.ai/visibility-audit-v1.html",
            "ui": {
              "resourceUri": "ui://inite.ai/visibility-audit-v1.html"
            }
          },
          "digest": "sha256:0d47947f569f1a34278bccb987134653f415408abb0c838adf8c2c49f5a95f0d"
        },
        {
          "name": "check_identity",
          "title": "Check how machines read a site",
          "description": "Free and instant, no account: read a website the way an AI engine does before it answers about it. Returns which answer-engine crawlers robots.txt lets in (retrieval, which decides whether the site can be cited) and which training crawlers it blocks (which costs nothing), the identity files present, whether the homepage carries Organization schema, an identity score out of 100, and the fixes that reading names. No model is asked; for whether the engines actually name the site, run analyze_site.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A public website, e.g. example.com or https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "files": {
                "type": "array"
              },
              "fixes": {
                "type": "array"
              },
              "fixesTotal": {
                "type": "integer"
              },
              "identityScore": {
                "type": "number"
              },
              "organizationSchema": {
                "type": "boolean"
              },
              "retrieval": {
                "type": "object"
              },
              "training": {
                "type": "object"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["identityScore", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check how machines read a site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://inite.ai/visibility-identity-v1.html",
            "ui": {
              "resourceUri": "ui://inite.ai/visibility-identity-v1.html"
            }
          },
          "digest": "sha256:33e0c7d31e6a0b39dd01acadd0cc46fc1fbef11dc916f1383311bd9142945aff"
        },
        {
          "name": "compare_sites",
          "title": "Two sites, read the same way",
          "description": "Your site against a competitor's, read the way an AI engine reads them before it answers: identity score out of 100, which answer-engine crawlers each lets in, the identity files each has (llms.txt, ai.json and the rest), Organization schema, and where each one is ahead. Free and instant, no model asked; counts two identity checks.",
          "inputSchema": {
            "properties": {
              "other": {
                "description": "The site to compare it with, e.g. competitor.com",
                "type": "string"
              },
              "url": {
                "description": "Your site, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["other", "url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ahead": {
                "type": "object"
              },
              "sites": {
                "type": "array"
              }
            },
            "required": ["sites"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Two sites, read the same way"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://inite.ai/visibility-compare-v1.html",
            "ui": {
              "resourceUri": "ui://inite.ai/visibility-compare-v1.html"
            }
          },
          "digest": "sha256:0ac0e9fbad46c64f93d1b5015257cbee887451d16f22de40057adbf0053e8042"
        },
        {
          "name": "get_analysis",
          "title": "Read an audit",
          "description": "Read an audit started by analyze_site: progress while it runs, then the score out of 100 and what to fix first. Only the caller who started the run can read it - the account, or for a guest the same address.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "description": "The id analyze_site returned",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "fixes": {
                "type": "array"
              },
              "fixesTotal": {
                "type": "integer"
              },
              "reportUrl": {
                "type": ["string", "null"]
              },
              "score": {
                "type": ["number", "null"]
              },
              "status": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an audit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://inite.ai/visibility-audit-v1.html",
            "ui": {
              "resourceUri": "ui://inite.ai/visibility-audit-v1.html"
            }
          },
          "digest": "sha256:8234671508212599e3a93ca26126348f0b8c5c9dd688e655aca0ad96fc486c1c"
        },
        {
          "name": "inite_connect",
          "title": "Connect another INITE server",
          "description": "How to add another INITE MCP server to this client, when the person wants something this one does not do. With no argument, the server beside this one; `for`, the one that does a job; `all: true`, every server. Returns the URL, the Claude Code command and the custom-connector step.",
          "inputSchema": {
            "properties": {
              "all": {
                "description": "true: every server, with install links. Ignored with `for`.",
                "type": "boolean"
              },
              "for": {
                "description": "What the person wants next; returns the server that does it",
                "enum": ["add_tool", "premium", "licence", "full_audit", "local_start", "account", "find_tools", "visibility", "talk", "find_business"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "doors": {
                "type": "array"
              },
              "more": {
                "type": "object"
              },
              "others": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["doors", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Connect another INITE server"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://inite.ai/connect-v1.html",
            "ui": {
              "resourceUri": "ui://inite.ai/connect-v1.html"
            }
          },
          "digest": "sha256:40e5de2c5f5280445bb471f135fdbe9d2873c702c375216a2f818f3e4e34e4a9"
        },
        {
          "name": "visibility_fixes",
          "title": "What to fix, in order",
          "description": "The fix plan for a site's AI visibility, most important first: what to change, why it matters for being named in AI answers, how many points of the score it should recover, the pages it applies to, and a paste-ready file or snippet when there is one (llms.txt, robots.txt rules, Organization schema). Free from the identity reading, no account; signed in, it is built from your latest finished audit of that site, which covers the answer engines too.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Fixes, most important first, per page, default 12",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "offset": {
                "description": "The nextOffset of the previous answer",
                "minimum": 0,
                "type": "number"
              },
              "url": {
                "description": "A public website, e.g. example.com or https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "fixes": {
                "type": "array"
              },
              "limit": {
                "type": "integer"
              },
              "matched": {
                "type": "integer"
              },
              "nextOffset": {
                "type": ["integer", "null"]
              },
              "offset": {
                "type": "integer"
              },
              "source": {
                "type": "string"
              },
              "total": {
                "type": "integer"
              },
              "totalIsAtLeast": {
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["fixes", "source", "total", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What to fix, in order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://inite.ai/visibility-fixes-v1.html",
            "ui": {
              "resourceUri": "ui://inite.ai/visibility-fixes-v1.html"
            }
          },
          "digest": "sha256:1d43893486901cccfaede6c4b204f996c868c0d8f58ac6e28d47bbd68182cdfa"
        },
        {
          "name": "visibility_history",
          "title": "How a site's reading moved",
          "description": "How a site's AI visibility reading has moved over time: for a site in the INITE Atlas, its weekly readings (identity score, answer-engine crawlers let in, llms.txt, Organization schema, the top fix each week); signed in, your own audits of it too, with their scores. Free, no model, and no check is spent: it reads what was already measured.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A public website, e.g. example.com or https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "audits": {
                "type": "array"
              },
              "totals": {
                "type": "object"
              },
              "totalsAtLeast": {
                "type": "array"
              },
              "url": {
                "type": "string"
              },
              "weekly": {
                "type": "array"
              }
            },
            "required": ["audits", "totals", "url", "weekly"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How a site's reading moved"
          },
          "behavior": {
