      "instructions": "NZ working-day arithmetic with the statutory section cited, NZ public holidays and anniversary days (2020-2030), and free IRD number, NZ bank account and ABN checksum validators. Information, not legal advice. Send a Polar licence key as 'Authorization: Bearer <key>' for more than 100 metered calls a day.",
      "tools": [
        {
          "name": "add_working_days",
          "description": "Add (or subtract) working days under a NZ statute's definition. Returns the date, the section cited and the holidays skipped. The start date is not counted.",
          "inputSchema": {
            "properties": {
              "days": {
                "title": "Days",
                "type": "integer"
              },
              "jurisdiction": {
                "default": "NZ",
                "title": "Jurisdiction",
                "type": "string"
              },
              "region": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Region"
              },
              "rule": {
                "title": "Rule",
                "type": "string"
              },
              "start_date": {
                "title": "Start Date",
                "type": "string"
              }
            },
            "required": ["days", "rule", "start_date"],
            "title": "add_working_daysArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "add_working_daysDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc503fc3878c2593c9429f53ec4f118ecd47706042e2cc1413794b02c21b00b6"
        },
        {
          "name": "count_working_days",
          "description": "Count working days after from_date up to and including to_date under a rule.",
          "inputSchema": {
            "properties": {
              "from_date": {
                "title": "From Date",
                "type": "string"
              },
              "jurisdiction": {
                "default": "NZ",
                "title": "Jurisdiction",
                "type": "string"
              },
              "region": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Region"
              },
              "rule": {
                "title": "Rule",
                "type": "string"
              },
              "to_date": {
                "title": "To Date",
                "type": "string"
              }
            },
            "required": ["from_date", "rule", "to_date"],
            "title": "count_working_daysArguments",
            "type": "object"
          },
          "outputSchema": {
