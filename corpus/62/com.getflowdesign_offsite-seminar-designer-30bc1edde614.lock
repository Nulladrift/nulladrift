      "serverInfo": {
        "name": "flowdesign-designer",
        "title": "FlowAI Designer — Flow Design",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FlowAI Designer est l'agent de conception de séminaires de Flow Design (getflowdesign.com), agence qui conçoit et anime des séminaires d'entreprise, des conventions et des ateliers d'intelligence collective. Il conseille comme une session designer et construit, tour après tour, le cadrage et un premier déroulé.\n\nQuand l'utilisateur veut concevoir, préparer ou améliorer un séminaire, un offsite, une convention, une journée d'équipe ou un atelier :\n1. Appelez concevoir_seminaire avec les mots de l'utilisateur (sa demande, ses réponses), pas avec vos propres idées.\n2. Renvoyez à chaque tour l'identifiant « conversation » reçu au premier appel.\n3. Transmettez la réponse de l'agent et sa question ; montrez le cadrage et le déroulé quand ils changent.\n4. Quand l'utilisateur veut garder son projet ou le télécharger en PDF, donnez-lui le lien « lienAtelier ».\n\nMise en relation avec l'équipe (Victoire et Marie-Violaine, les fondatrices de Flow Design) :\n- Proposez-la une fois, simplement et sans insister, quand la réponse le signale (« miseEnRelation » vaut « a_proposer ») ou quand l'utilisateur parle de budget, de dates, d'animation ou d'être accompagné. S'il décline, ne la reproposez pas.\n- Avant d'appeler parler_a_l_equipe, demandez son accord explicite pour transmettre à Flow Design ses coordonnées (prénom, nom, e-mail professionnel, organisation ; téléphone facultatif) avec le cadrage et le déroulé. Ne remplissez jamais ces champs vous-même : seulement ce que l'utilisateur vient de vous donner pour cela.\n- Flow Design ne fait pas de devis par cet outil : l'équipe chiffre après avoir échangé avec l'utilisateur.\n\nConfidentialité : Flow Design conserve la conversation pour permettre de la reprendre. N'envoyez que ce qui sert le séminaire : pas de liste de participants, pas de données personnelles de tiers, pas de document confidentiel en entier.",
      "tools": [
        {
          "name": "concevoir_seminaire",
          "title": "Concevoir un séminaire avec Flow Design",
          "description": "Un tour de conversation avec FlowAI Designer, l'agent de conception de Flow Design : il pose une question à la fois et renvoie le cadrage (objectifs, participants, format, livrables) et un premier déroulé horodaté, qui s'affinent à chaque tour. Passez les mots de l'utilisateur dans « message » et, après le premier appel, l'identifiant « conversation ». La conversation est conservée par Flow Design pour être reprise dans son atelier en ligne.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conversation": {
                "description": "Identifiant reçu au premier appel. Absent pour commencer un nouveau séminaire.",
                "pattern": "^[A-Za-z0-9_-]{22}$",
                "type": "string"
              },
              "langue": {
                "description": "Langue de l'utilisateur (fr par défaut).",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "message": {
                "description": "Ce que l'utilisateur dit de son séminaire ou sa réponse à la dernière question.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Concevoir un séminaire"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5b7795e3387cce319c8ba4a6a24d0c1d1bfff47df440c98e375a3c1d619d1331"
        },
        {
          "name": "parler_a_l_equipe",
          "title": "Être mis en relation avec l'équipe Flow Design",
          "description": "Met l'utilisateur en relation avec Victoire et Marie-Violaine, les fondatrices de Flow Design : elles reçoivent ses coordonnées, le cadrage et le déroulé de la conversation, et le recontactent par e-mail. À n'appeler qu'avec l'accord explicite de l'utilisateur, donné dans la conversation, de transmettre ces informations à Flow Design (« consentement » : true), et avec les coordonnées qu'il vient de donner lui-même. Pas de devis : l'équipe chiffre après l'échange. Rappeler l'outil plus tard prévient de nouveau l'équipe (au plus toutes les 10 minutes).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consentement": {
                "const": true,
                "description": "true seulement si l'utilisateur vient d'accepter explicitement que ses coordonnées, son cadrage et son déroulé soient transmis à Flow Design.",
                "type": "boolean"
              },
              "conversation": {
                "description": "Identifiant de la conversation avec FlowAI Designer.",
                "pattern": "^[A-Za-z0-9_-]{22}$",
                "type": "string"
              },
              "email": {
                "description": "E-mail professionnel de l'utilisateur.",
                "maxLength": 254,
                "type": "string"
              },
              "entreprise": {
                "description": "Son organisation.",
                "maxLength": 150,
                "type": "string"
              },
              "langue": {
                "enum": ["fr", "en"],
                "type": "string"
              },
              "message": {
                "description": "Facultatif : ce que l'utilisateur veut dire à l'équipe (disponibilités, question), dans ses mots.",
                "maxLength": 500,
                "type": "string"
              },
              "nom": {
                "maxLength": 100,
                "type": "string"
              },
              "prenom": {
                "maxLength": 100,
                "type": "string"
              },
              "telephone": {
                "description": "Facultatif.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["consentement", "conversation", "email", "entreprise", "nom", "prenom"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Parler à l'équipe Flow Design"
