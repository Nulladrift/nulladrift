{
  "lockfileVersion": 2,
  "subjects": {
    "com.hesperan/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.hesperan.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "hesperan",
        "title": "Hesperan",
        "version": "0.1.0",
        "websiteUrl": "https://hesperan.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Hesperan 1 is a decision model, not a text generator. Give it a state (text or JSON) and typed questions; it returns a probability for every possible answer.\nUse it when the answer is one of options you can name (routing, triage, policy checks, \"should I proceed?\"). Do not use it to write, summarise, extract free-form values or answer knowledge questions.\nAct automatically only when the probability clears a threshold that fits the cost of a mistake; otherwise ask the user. With a decision profile, act on action \"auto\" and hand \"review\" to a person.",
      "tools": [
        {
          "name": "decide",
          "title": "Decide with Hesperan",
          "description": "Ask Hesperan 1 one or more typed questions about a state and get a probability for every possible answer. Types: choice (pick one of named options), noul (probability that a statement is true), score (level on an ordinal scale). Use for decisions with known options: routing, triage, policy or risk checks, \"should I proceed?\". Not for writing text, summaries or knowledge questions. Ask all questions about the same state in one call: billing is by input tokens (the state once plus each question once), from the user's monthly allowance and then their prepaid balance; failed calls are free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "questions": {
                "additionalProperties": {
                  "oneOf": [
                    {
                      "description": "Pick one of named options. Answer: choice and a probability per option.",
                      "properties": {
                        "criteria": {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "description": "Option key -> plain-language description of what the option means. Mutually exclusive; add an \"other\" option if the list is not complete. Up to about 26 options work best.",
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "instructions": {
                          "description": "The question, e.g. \"Which team should handle this ticket?\"",
                          "type": "string"
                        },
                        "type": {
                          "const": "choice",
                          "type": "string"
                        }
                      },
                      "required": ["criteria", "instructions", "type"],
                      "type": "object"
                    },
                    {
                      "description": "Probability that a statement is true. Answer: noul = P(yes).",
                      "properties": {
                        "criteria": {
                          "description": "Optional: what counts as yes and as no.",
                          "properties": {
                            "false": {
                              "type": "string"
                            },
                            "true": {
                              "type": "string"
                            }
                          },
                          "type": "object"
                        },
                        "instructions": {
                          "description": "A statement (not a question), e.g. \"This email is a phishing attempt.\"",
                          "type": "string"
                        },
                        "type": {
                          "const": "noul",
                          "type": "string"
                        }
                      },
                      "required": ["instructions", "type"],
                      "type": "object"
                    },
                    {
                      "description": "Rate on an ordinal scale you define. Answer: score = expected level, plus a probability per level (\"0\", \"1\", ...).",
                      "properties": {
                        "criteria": {
                          "description": "One description per level, lowest first.",
                          "items": {
                            "type": "string"
                          },
                          "minItems": 2,
                          "type": "array"
                        },
                        "instructions": {
                          "description": "What to rate, e.g. \"How upset is the customer?\"",
                          "type": "string"
                        },
                        "type": {
                          "const": "score",
                          "type": "string"
                        }
                      },
                      "required": ["criteria", "instructions", "type"],
                      "type": "object"
                    }
                  ]
                },
                "description": "Named questions, answered together: { \"<name>\": { \"type\": \"choice\" | \"noul\" | \"score\", \"instructions\": \"...\", \"criteria\": ... } }.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "The situation to judge: free text, or a JSON object (keeps dates, amounts and fields unambiguous). Leave out data that does not matter for the question."
              }
            },
            "required": ["questions", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5a2867a169d1aa1dbdfb6c3d175752dbe40f32b3efaa579855258fc7ccb51b1"
        },
        {
          "name": "decide_with_profile",
          "title": "Decide with a calibrated profile",
          "description": "Run one of the user's decision profiles on a state. A profile is one question calibrated on the user's own labelled cases with a target precision; the answer is a decision, its calibrated confidence and an action: \"auto\" (confidence reaches the profile's threshold — act on it) or \"review\" (hand it to a person). Profiles are created in the Hesperan console; ask the user for the profile slug. Keep the returned decision_id to report the correct answer later with report_outcome. Billed by input tokens like decide; pass an idempotency_key to make retries safe (a repeat with the same key returns the first decision without charging again).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "idempotency_key": {
                "description": "Optional unique key for this decision (1-255 visible ASCII characters, e.g. the ticket id). Reusing it within 24 hours with the same state replays the stored decision.",
                "pattern": "^[\\x21-\\x7e]{1,255}$",
                "type": "string"
              },
              "profile": {
                "description": "Slug of the decision profile, e.g. \"ticket-routing\".",
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "The situation to judge: free text, or a JSON object (keeps dates, amounts and fields unambiguous). Leave out data that does not matter for the question."
              }
            },
            "required": ["profile", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:48108ec49050cff47497c2c4a5f937cd5767980acc2d48b953699eb48271ff6b"
        },
        {
          "name": "report_outcome",
          "title": "Report the correct answer",
          "description": "Record the correct answer for an earlier decide_with_profile decision, once it is known (e.g. the team that finally handled the ticket). This tracks the live precision of the profile in the console. actual must be one of the profile's option keys. Free of charge.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "actual": {
                "description": "The correct option key.",
                "minLength": 1,
                "type": "string"
              },
              "decision_id": {
                "description": "decision_id returned by decide_with_profile.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["actual", "decision_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e3f5132446f1a333b3a51af54b5feea10fdd514baa581188538d90bb0263e3a0"
        }
      ],
      "digest": "sha256:1d1197090572801bf4f7f5b2f82f1732f3bad739e87d917c388097be93bae8a1"
    }
  }
}
