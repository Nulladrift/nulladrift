          },
          "meta": {
            "fastmcp": {
              "tags": ["public"]
            }
          },
          "digest": "sha256:d896985b2dc834c102d5d289203c35eb930d1ae00d82ae0e90364d6ba5ff3ca5"
        },
        {
          "name": "submit_request",
          "title": "Submit a Lyra UI feature request",
          "description": "Report a component you needed but could not find, and get back the closest existing ones.\n\nSearch first: most apparent gaps are naming mismatches, and `search_components` answers that\nin one call without filing anything. The response here also lists close matches — read them.\n\nIf you are an agent acting for someone: ask them and get their explicit agreement before\nsubmitting. This sends their words to a third-party service. Never file as a silent side\neffect of noticing a gap.\n\n`name` and `email` are optional; anonymous is the default. Ask the user whether they want to\nbe reachable — never invent an address or reuse one from git config or earlier context.\n\nAlways classify it: set `kind` to its category and `labels` to every matching sub-category\nlabel from the schema's enum (for example `bug:keyboard` and `bug:focus`, or `scope:` when it\nis not about one component family). Both fields are optional only so that older clients keep\nworking: a request without them waits in the maintainer's unclassified queue for manual\ntriage. Component and family tags are detected automatically from the `lr-*` names in your\ntext.\n\nFill in every other optional field you can as well: `use_case`, `searched_for`,\n`settled_for`, `agent`, and `model` (the id of the model writing the report). Triage and the\nmaintainer's statistics rely on them. `name` and `email` stay opt-in, as described above.\n\nSubmissions are stored privately, shown only to the maintainer, and never published. Describe\nthe component generically: no source code, no client or product names, no credentials.",
          "inputSchema": {
            "properties": {
              "agent": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Expected: the submitting agent or client name (e.g. claude-code).",
                "title": "Agent"
              },
              "description": {
                "description": "Generic behavior needed or documented contract versus observed behavior. Do not include source code, client names, product names, or credentials.",
                "maxLength": 4000,
                "minLength": 10,
                "title": "Description",
                "type": "string"
              },
              "email": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "pattern": "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional. Only if you want a reply — stored privately, shown to the maintainer only, never published.",
                "title": "Email"
              },
              "kind": {
                "anyOf": [
                  {
                    "enum": ["bug", "optimization", "size", "dedup", "harmonization", "improvement", "feature"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Set this on every request: its category — bug (existing behaviour is wrong), optimization (runtime cost), size (bytes shipped), dedup (duplicated implementation), harmonization (siblings differ), improvement (engineering quality), feature (a genuinely new capability).",
                "title": "Kind"
              },
              "labels": {
                "description": "Set these on every request: every sub-category label that applies, e.g. bug:keyboard and bug:focus (a facet from another kind is fine), or scope:<value> when the request is not about one component family. Component and family tags are detected automatically from lr-* names.",
                "items": {
                  "enum": ["bug:crash", "bug:state-data", "bug:events", "bug:lifecycle", "bug:async-race", "bug:leak", "bug:accessibility", "bug:keyboard", "bug:focus", "bug:i18n", "bug:rtl", "bug:forms", "bug:layout", "bug:overlay-positioning", "bug:styling-theming", "bug:visual-states", "bug:motion", "bug:cross-engine", "bug:security", "bug:packaging", "bug:types-contracts", "bug:docs", "bug:tooling", "optimization:render", "optimization:layout-thrash", "optimization:observers-listeners", "optimization:memory", "optimization:algorithmic", "optimization:loading", "size:js-bundle", "size:css", "size:dependencies", "size:lazy-loading", "size:package", "dedup:logic", "dedup:styles", "dedup:tests", "dedup:tooling", "dedup:docs", "harmonization:naming", "harmonization:behavior", "harmonization:visual", "harmonization:events", "harmonization:docs", "improvement:dx-types", "improvement:diagnostics", "improvement:tests", "improvement:tooling-ci", "improvement:docs", "feature:new-component", "feature:capability", "scope:library-wide", "scope:tooling", "scope:docs", "scope:lyra-docs", "scope:website"],
                  "type": "string"
                },
                "maxItems": 12,
                "title": "Labels",
                "type": "array"
              },
              "model": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Expected on agent reports: the id of the model that wrote the submission (e.g. claude-opus-5-5).",
                "title": "Model"
              },
              "name": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional contact name, only when the user explicitly asks to be reachable.",
                "title": "Name"
              },
              "searched_for": {
                "description": "Expected: terms tried before giving up. The most useful field: it records the name the caller expected.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "title": "Searched For",
                "type": "array"
              },
              "settled_for": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Expected when you used a workaround: what you built or used instead.",
                "title": "Settled For"
              },
              "source_url": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional public URL with non-sensitive context.",
                "title": "Source Url"
              },
              "title": {
                "description": "Short, specific summary naming the missing component, bug, or API gap.",
                "maxLength": 120,
                "minLength": 3,
                "title": "Title",
                "type": "string"
              },
              "use_case": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Expected: the generic context explaining why the capability is needed.",
                "title": "Use Case"
              }
            },
            "required": ["description", "title"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "catalog_version": {
                "title": "Catalog Version",
                "type": "string"
              },
              "id": {
                "title": "Id",
                "type": "string"
              },
              "labels": {
                "description": "Labels stored on the request: your kind and labels plus component and family tags detected from lr-* names in the text.",
                "items": {
                  "type": "string"
                },
                "title": "Labels",
                "type": "array"
              },
              "matches": {
                "items": {
                  "properties": {
                    "description": {
                      "title": "Description",
                      "type": "string"
                    },
                    "docs_url": {
                      "title": "Docs Url",
                      "type": "string"
                    },
                    "family": {
                      "title": "Family",
                      "type": "string"
                    },
                    "family_label": {
                      "title": "Family Label",
                      "type": "string"
                    },
                    "import": {
                      "title": "Import",
                      "type": "string"
                    },
                    "matched_fields": {
                      "items": {
                        "type": "string"
