        },
        {
          "name": "search_documentation",
          "title": "Search Lyra UI documentation",
          "description": "Search section-sized chunks of the component and library-wide Markdown reference.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "q": {
                "description": "API behavior to look up.",
                "maxLength": 200,
                "minLength": 2,
                "title": "Q",
                "type": "string"
              },
              "tag": {
                "anyOf": [
                  {
                    "pattern": "^lr-[a-z0-9-]+$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional exact component tag to search within.",
