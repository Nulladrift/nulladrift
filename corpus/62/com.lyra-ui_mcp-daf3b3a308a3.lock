        {
          "name": "search_components",
          "title": "Search Lyra UI components",
          "description": "Ranked search over the Lyra UI component catalog.\n\nCall this before concluding a component is missing — most apparent gaps are naming\nmismatches. No authentication, no side effects.",
          "inputSchema": {
            "properties": {
              "family": {
                "anyOf": [
                  {
                    "pattern": "^(forms|data|layout|overlays|utility|media|charts|viewers|conversation|agent-tools|retrieval)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional component-family filter.",
                "title": "Family"
              },
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Locale used for returned names/descriptions (any of the site's 81 language tags, e.g. hi, zh-TW, pt-BR; legacy pt = pt-PT); all locales remain searchable.",
                "pattern": "^(am|ar|bg|bho|bn|ca|cs|da|de|de\\-CH|el|en|en\\-GB|es|es\\-419|et|fa|fa\\-AF|fi|fil|fr|fr\\-CA|ga|gu|ha|he|hi|hr|hu|id|ig|it|ja|jv|kk|kn|ko|lah|ln|lt|lv|ml|mr|ms|mt|my|nb|ne|nl|nn|om|or|pa|pcm|pl|ps|pt\\-BR|pt\\-PT|ro|ru|sd|sk|sl|sr|sr\\-Latn|su|sv|sw|ta|te|th|tr|uk|ur|uz|vi|yo|zh\\-CN|zh\\-HK|zh\\-TW|zu|pt)$",
                "title": "Locale",
                "type": "string"
              },
              "q": {
                "description": "What you are looking for.",
                "maxLength": 200,
                "minLength": 2,
                "title": "Q",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "catalog_version": {
                "title": "Catalog Version",
                "type": "string"
              },
              "library_version": {
                "title": "Library Version",
                "type": "string"
              },
              "locale": {
                "title": "Locale",
                "type": "string"
              },
              "matches": {
                "items": {
                  "properties": {
                    "description": {
                      "title": "Description",
                      "type": "string"
                    },
                    "docs_url": {
                      "title": "Docs Url",
                      "type": "string"
                    },
                    "family": {
                      "title": "Family",
                      "type": "string"
                    },
                    "family_label": {
                      "title": "Family Label",
                      "type": "string"
                    },
                    "import": {
                      "title": "Import",
                      "type": "string"
                    },
                    "matched_fields": {
                      "items": {
                        "type": "string"
                      },
                      "title": "Matched Fields",
                      "type": "array"
                    },
                    "name": {
                      "title": "Name",
                      "type": "string"
                    },
                    "reference_uri": {
                      "title": "Reference Uri",
                      "type": "string"
                    },
                    "reference_url": {
                      "title": "Reference Url",
                      "type": "string"
                    },
                    "score": {
                      "description": "Bounded relevance indicator used only to compare results from this query.",
                      "exclusiveMaximum": 1,
                      "minimum": 0,
                      "title": "Score",
                      "type": "number"
                    },
                    "tag": {
                      "title": "Tag",
                      "type": "string"
                    }
                  },
                  "required": ["description", "docs_url", "family", "family_label", "import", "name", "reference_uri", "reference_url", "score", "tag"],
                  "title": "MatchOut",
                  "type": "object"
                },
                "title": "Matches",
                "type": "array"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["catalog_version", "library_version", "locale", "matches", "query"],
            "title": "SearchResponse",
            "type": "object",
            "x-fastmcp-top-level-schema": "SearchResponse"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
