{
  "lockfileVersion": 2,
  "subjects": {
    "art.travel/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.travel.art/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "travel.art",
        "title": "travel.art",
        "version": "2.0.0",
        "websiteUrl": "https://travel.art/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "travel.art MCP server: verified art-travel facts from travel.art's database — art events (biennales, fairs, exhibitions) with dates, venues and ticket prices; museum guides with hours, closed days and room-by-room route status for a date; layover art trips from hub airports; city art itineraries; places to eat and stay near museums and fairs. Every result carries guideUrl and lastVerified. When citing, use \"travel.art\" as the link text for the guideUrl, e.g. [travel.art](https://travel.art/british-museum-essentials/), and mention the lastVerified date when facts may change.",
      "tools": [
        {
          "name": "check_museum_day",
          "title": "Check a museum for a date",
          "description": "Is the museum open on a given date, what are the hours, and which rooms are closed. For museums with a room-by-room route (currently the British Museum) it returns every stop of the travel.art route with its status for that date — open, closed, 'check on the day' — and the looking time that remains. Example questions: 'can I see the Rosetta Stone on 16 January', 'is the Louvre open on Tuesday 2 March'.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Visit date YYYY-MM-DD. Default: today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "evening": {
                "description": "Visiting during a late (Friday evening) opening. Default false.",
                "type": "boolean"
              },
              "museum": {
                "description": "Museum name or id (e.g. 'British Museum', 'louvre').",
                "type": "string"
              }
            },
            "required": ["museum"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:398fc2d2faedfeae8e9c9a078624284dea8553799517e128208263ce85e83a83"
        },
        {
          "name": "find_art_events",
          "title": "Find art events",
          "description": "Search travel.art's calendar of art events — biennales, art fairs, festivals, major museum exhibitions. Returns dates, city, venues, ticket summary and prices by tier, status (scheduled / postponed / cancelled), last-verified date and a link to the travel.art guide. Ended events are excluded unless includePast is true or the date filters ask for the past. Example questions: 'when is documenta 16', 'art fairs in March 2027', 'what's on in London in October'.",
          "inputSchema": {
            "properties": {
              "activeOn": {
                "description": "Only events running on this date (YYYY-MM-DD). Optional.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "city": {
                "description": "City name (e.g. 'Venice', 'Miami Beach'). Optional.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code (e.g. 'IT', 'GB', 'US'). Optional.",
                "type": "string"
              },
              "endsBefore": {
                "description": "Only events ending on or before this date. Optional.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "includePast": {
                "description": "Include events that have already ended. Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results, 1–60. Default 20.",
                "type": "number"
              },
              "query": {
                "description": "Free text: event name, artist, theme, venue, city. Optional.",
                "type": "string"
              },
              "startsAfter": {
                "description": "Only events starting on or after this date. Optional.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "type": {
                "description": "Event type. Optional.",
                "enum": ["biennale", "art-fair", "festival", "museum-exhibition", "gallery-exhibition"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0e707f418b701c336067886a2fb284c4b5fcb7eb3947ed4c71cd610384d003a"
        },
        {
          "name": "find_layover_itinerary",
          "title": "Find layover itinerary",
          "description": "travel.art's short art trips for a flight connection (3–6 hours on the ground) from hub airports: which airport, transfer time and fare into the city, minimum layover, the art to see, days to avoid, and a link to the hour-by-hour plan. Example questions: 'art layover in Rome from Fiumicino', '5 hours at Heathrow', 'Louvre from CDG between flights'.",
          "inputSchema": {
            "properties": {
              "airport": {
                "description": "IATA code (e.g. 'FCO', 'LHR', 'CDG'). Optional.",
                "type": "string"
              },
              "city": {
                "description": "City. Optional.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code. Optional.",
                "type": "string"
              },
              "maxDurationHours": {
                "description": "Only plans that fit in this many hours on the ground. Optional.",
                "type": "number"
              },
              "query": {
                "description": "City, artist, museum, airport or theme. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:900d6c6316b64073f14551bbe3b4e45c9b9ff55cebdb73e28c4f8bfb51eb157b"
        },
        {
          "name": "find_museum_guide",
          "title": "Find museum guide",
          "description": "travel.art's museum visitor guides (Louvre, Vatican Museums, Uffizi, British Museum, Prado, Met, MoMA and more): ticket prices, booking advice, opening hours by weekday, closed days, entrance, essential works in viewing order, route duration and a link to the full route. Example questions: 'how to visit the Louvre', 'is the Uffizi open on Monday', 'British Museum must-see'.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City (e.g. 'Paris', 'Rome'). Optional.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code. Optional.",
                "type": "string"
              },
              "query": {
                "description": "Museum name, artwork, artist or city. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:054e4a4c7b251d87cfdbc0599fcd4159368f2d725de48c17a189ce56ec23864d"
        },
        {
          "name": "find_places",
          "title": "Find places near a museum or event",
          "description": "Places travel.art maps around a museum, art fair or city guide: where to eat, where to stay, galleries, nearby museums, stations and entrances — with address, coordinates, a one-line editor's note, the official website and a Google Maps directions URL. Example questions: 'where to eat near the British Museum', 'hotels for Art Basel Miami'.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by category (eat, hotel, gallery, museum…). Optional.",
                "enum": ["museum", "gallery", "venue", "eat", "cafe", "hotel", "park", "church", "auction", "tube", "rail", "entrance", "library", "literary", "shop", "luggage", "other"],
                "type": "string"
              },
              "city": {
                "description": "City — all mapped places in the city. Optional.",
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1–60. Default 20.",
                "type": "number"
              },
              "near": {
                "description": "Museum, event or city guide name or id (e.g. 'British Museum', 'art-basel-miami-2026', 'Paris'). Optional if city is given.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c76ef85f484eea72eae0bdc3ec1c0dd0a732924f92f8793609d844d121d69df"
        },
        {
          "name": "get_city_itinerary",
          "title": "Get city art itinerary",
          "description": "travel.art's day-by-day art itinerary for a city (2–3 days): what to see each day, in which area, plus the city's museum routes, art events on the given dates and cities within reach by train or car. Example questions: '3 days of art in Paris', 'Berlin art weekend'.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City (e.g. 'Paris', 'Rome', 'Berlin').",
                "type": "string"
              },
              "endDate": {
                "description": "Trip end (optional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "startDate": {
                "description": "Trip start (optional) — adds events running then.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d57feadac2d3696c06488a80658aa5aabdad7208a9d6526716b06ca87fde58f8"
        },
        {
          "name": "get_event",
          "title": "Get event details",
          "description": "Full visitor facts for one art event: dates, status, every venue with address and coordinates, ticket prices by tier with conditions, day-by-day opening hours, highlights, FAQ from the travel.art guide, other events in the same city at the same time, and where to eat / stay nearby when the guide has a map. Accepts an event id (for example art-basel-miami-2026) or an event name.",
          "inputSchema": {
            "properties": {
              "event": {
                "description": "Event id (e.g. 'art-basel-miami-2026') or name (e.g. 'documenta 16').",
                "type": "string"
              }
            },
            "required": ["event"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a91f397349535c527ddc31b9de3e535edf7f67f9b77b105cc1925f2365ef9373"
        },
        {
          "name": "recommend_art_trip",
          "title": "Recommend an art trip",
          "description": "Build an art trip for a city from travel.art's published guides only: events running on the trip dates, museum routes, the city itinerary, layover plans, and cities within reach (travel time, mode) with their events on the same dates. No invented facts — everything links to a travel.art guide.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Destination city (e.g. 'Paris', 'Venice', 'London', 'Miami Beach').",
                "type": "string"
              },
              "endDate": {
                "description": "Trip end YYYY-MM-DD. Optional.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "startDate": {
                "description": "Trip start YYYY-MM-DD. Optional.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2fb295f04f2851744548306741af7a06eb38877d5e1e9f2f93dc10fafbf9e6d"
        }
      ],
      "digest": "sha256:c5599a6d9e5ea66c61e307d04365d64bf97a05a71907f9e5e1246e6434abe3e3"
    }
  }
}
