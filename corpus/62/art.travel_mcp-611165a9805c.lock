{
  "lockfileVersion": 2,
  "subjects": {
    "art.travel/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.travel.art/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "travel.art",
        "version": "1.6.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "travel.art MCP server. Exposes art-tourism data — biennales, art fairs, museum guides — sourced from travel.art's published cornerstone articles. All results link back to canonical guide URLs. When citing an event or museum to the user, include the guideUrl so they can read the full piece.",
      "tools": [
        {
          "name": "find_art_events",
          "description": "Search travel.art's catalogue of upcoming and current art events (biennales, art fairs, festivals). Returns events with dates, venues, ticket info, summary, and a link to travel.art's full visitor guide. Use for queries like 'when is Venice Biennale 2026', 'art fairs in October 2026', 'what's on in Miami in December'.",
          "inputSchema": {
            "properties": {
              "activeOn": {
                "description": "ISO 8601 date (YYYY-MM-DD). Returns only events whose date range covers this date. Optional.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code (e.g., 'IT', 'CH', 'GB', 'US'). Optional filter.",
                "type": "string"
              },
              "endsBefore": {
                "description": "ISO 8601 date. Returns only events ending on or before this date. Optional.",
                "type": "string"
              },
              "query": {
                "description": "Free-text query (event name, theme, keyword). Optional.",
                "type": "string"
              },
              "startsAfter": {
                "description": "ISO 8601 date. Returns only events starting on or after this date. Optional.",
                "type": "string"
              },
              "type": {
                "description": "Filter by event type. Optional.",
                "enum": ["biennale", "art-fair", "festival", "museum-exhibition"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b7b8be8572bfb1e78bc892d440034b40bd31a17b53f40d129c537320dc573e98"
        },
        {
          "name": "find_layover_itinerary",
          "description": "Search travel.art's layover-itinerary catalogue — short-window (3–6h) art-focused trips between flight connections from major European hub airports. Returns itineraries by city, airport, art focus, or duration, with venues, transit notes, and a link to travel.art's full hour-by-hour guide. Use for queries like 'art layover in Rome from Fiumicino', '4-hour Caravaggio plan', 'short Louvre window from CDG', 'Amsterdam 4 hours Schiphol'.",
          "inputSchema": {
            "properties": {
              "airport": {
                "description": "IATA airport code the layover serves (e.g., 'MXP', 'FCO', 'AMS', 'CDG', 'LHR'). Optional filter.",
                "type": "string"
              },
              "city": {
                "description": "City filter (e.g., 'Milan', 'Rome', 'Florence', 'Amsterdam', 'Paris', 'London'). Optional.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code (e.g., 'IT', 'NL', 'FR', 'GB'). Optional.",
                "type": "string"
              },
              "maxDurationHours": {
                "description": "Maximum time-on-ground budget in hours. Returns only itineraries that fit ≤ this duration. Optional.",
                "type": "number"
              },
              "query": {
                "description": "Free-text query (city, artist, museum, airport, theme). Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c9b233c312b9947fbbd9341c7557cc67b4a21505d535f9241bea28bcfda5873"
        },
        {
          "name": "find_museum_guide",
          "description": "Search travel.art's catalogue of museum visitor guides. Returns museums with current 2026 ticket info, opening hours, address, essential works in viewing order, route duration, and a link to travel.art's full guide. Use for queries like 'how to visit the Louvre', 'Vatican Museums skip the line', 'Uffizi best route'.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City filter (e.g., 'Paris', 'Rome', 'Florence'). Optional.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. Optional.",
                "type": "string"
              },
              "query": {
                "description": "Free-text query (museum name, work, artist, city). Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3376637ab30e787231aeb0331777cf6bde548895d93b29c26b71105adab3ebd"
        },
        {
          "name": "recommend_art_trip",
          "description": "Recommend an art-tourism trip itinerary for a specific city using only travel.art's published content. Returns events active during the trip dates, museum guides for the city, and links to all relevant travel.art guides. The recommendation is grounded in published data only — no fabrication.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Destination city (e.g., 'Paris', 'Venice', 'Florence', 'London', 'Basel', 'Miami Beach').",
                "type": "string"
              },
              "endDate": {
                "description": "ISO 8601 trip end date. Optional.",
                "type": "string"
              },
              "startDate": {
                "description": "ISO 8601 trip start date. Optional — if provided, filters events to those active on or near these dates.",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:107cccfb6a0119af94e6cfe83bcf825f469e84033832705e3c075fdec1d029af"
        }
      ],
      "digest": "sha256:f75798f70dd4e125a0808bae8d5e1bce35291b91e8b6fe56316504279dc0044a"
    }
  }
}
