        {
          "name": "supply_search",
          "title": "Search supply",
          "description": "Multi-provider discovery (live REAL merchants by default). Returns a ranked page (default limit=30, max 100) with total/has_more/next_offset. Follow next.args (search_id+offset+limit) to page without re-fanout. Optional fetch_limit (max 300) deepens the upstream pull on new searches. Pass include_sandbox=true only to append DEMO/SANDBOX test merchants at the bottom (test_offer=true). Always pass agent_id for mandate-aware badges. Carry search_id through supply_details / order_execute / order_feedback. Offer descriptions are clean text cut to 350 chars; supply_details returns the full text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_id": {
                "description": "Agent id for mandate-aware badges (always pass when available)",
                "type": "string"
              },
              "budget": {
                "anyOf": [
                  {
                    "description": "Legacy: max total budget in USD",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "description": "Max total budget in the given currency (indicative FX for other currencies)",
                    "properties": {
                      "amount": {
                        "description": "Max total in major units",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "currency": {
                        "description": "ISO currency for budget, e.g. USD",
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["amount", "currency"],
                    "type": "object"
                  }
                ],
                "description": "Max total budget — number means USD; or { amount, currency }"
              },
              "country": {
                "description": "ISO country for ships-to, e.g. US",
                "type": "string"
              },
              "fetch_limit": {
                "description": "Optional override for per-merchant upstream pull (default max(20, limit*2), max 300). Ignored when paging via search_id+offset",
                "exclusiveMinimum": 0,
                "maximum": 300,
                "type": "integer"
              },
              "include_sandbox": {
                "description": "Include DEMO/SANDBOX merchants (listed last, test_offer=true). Default false — live REAL merchants only. Use only when testing Conduit checkout flows.",
                "type": "boolean"
              },
              "limit": {
                "description": "Page size of ranked offers to return (default 30, max 100)",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "integer"
              },
              "offset": {
                "description": "0-based offset into the ranked set for this search_id (default 0). For page 2+, pass search_id from the prior response and follow next.args",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "payable_with": {
                "description": "Filter to rails the agent can pay with, e.g. [\"x402\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "quantity": {
                "description": "Desired quantity (default 1)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "query": {
                "description": "Product search query, e.g. USB-C charger 65W. Required for a new search; omit when paging with search_id + offset",
                "type": "string"
              },
              "search_id": {
                "description": "Resume paging into a prior ranked set (with offset>0, or offset 0 without query). New searches with query mint a fresh search_id",
                "type": "string"
              },
              "session_token": {
                "description": "Session token from agent_authenticate — required whenever agent_id is passed",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "badge_counts": {},
              "country": {
                "type": "string"
              },
              "country_default": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "boolean"
                  }
                ]
              },
              "degraded": {
                "type": "boolean"
              },
              "detail": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "has_more": {
                "type": "boolean"
              },
              "hint": {
                "type": "string"
              },
              "include_sandbox": {
                "type": "boolean"
              },
              "limit": {
                "type": "number"
              },
              "next": {
                "additionalProperties": false,
                "properties": {
                  "args": {
                    "additionalProperties": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "boolean"
                        }
                      ]
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "tool": {
                    "type": "string"
                  }
                },
                "required": ["tool"],
                "type": "object"
              },
              "next_offset": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "offers": {
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "offset": {
                "type": "number"
              },
              "partial": {},
              "recommended": {},
              "sandbox_included": {
                "type": "number"
              },
              "search_id": {
                "type": "string"
              },
              "total": {
                "type": "number"
              },
              "withheld": {
                "items": {
