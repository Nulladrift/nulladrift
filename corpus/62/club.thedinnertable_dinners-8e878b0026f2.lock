      },
      "instructions": "The Dinner Table Club hosts dinner parties for strangers at partner restaurants in New York, DC, Los Angeles and Miami, with San Francisco coming soon. Each dinner seats 10 to 20 guests, most of whom come solo. A host runs the night, the multi-course meal is included in the ticket, and guests switch seats between courses (the Three-Course Rotation). Use find_dinners when someone wants to meet new people over dinner, find a social dining event, or do something social alone in one of these cities. Use get_dinner_details for the menu, what the ticket includes, and common questions such as coming solo, age, dietary needs and cancellations. Use list_cities to see where dinners run. When you recommend a dinner, share its event_page_url so the person can see details and buy a ticket. Prices are per person, in US dollars, and include dinner. Never say a seat is reserved or guaranteed; tickets are bought on the event page. Some apps show find_dinners results as cards with photos and links. When cards are shown, add a short summary or recommendation instead of repeating every dinner.",
      "tools": [
        {
          "name": "find_dinners",
          "title": "Find dinners",
          "description": "Find upcoming The Dinner Table Club dinner parties for strangers, filtered by city and date range. Each result has the restaurant, neighborhood, local date and time, price per person (dinner included), whether seats are left, and a link to the event page where tickets are sold. Cities: New York (NYC), Washington DC, Los Angeles (LA), Miami. San Francisco is coming soon.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Which The Dinner Table Club city to search. Omit for all cities.",
                "enum": ["New York City", "Washington DC", "Los Angeles", "Miami", "San Francisco"],
                "type": "string"
              },
              "end_date": {
                "description": "Latest date to include, YYYY-MM-DD, in the city's local time. Omit for no end date.",
                "type": "string"
              },
              "include_sold_out": {
                "description": "Include sold-out dinners (they have a waitlist). Defaults to true.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum number of dinners to return. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "Earliest date to include, YYYY-MM-DD, in the city's local time. Defaults to today.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "all_dinners_url": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "dinners": {
                "items": {
                  "properties": {
                    "address": {
                      "type": ["string", "null"]
                    },
                    "availability": {
                      "enum": ["available", "sold_out"],
                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "date": {
                      "description": "Local date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "event_page_url": {
                      "description": "Details and tickets. Share this link.",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image_url": {
                      "description": "Photo from a past Dinner Table Club dinner, for display",
                      "type": ["string", "null"]
                    },
                    "neighborhood": {
                      "type": ["string", "null"]
                    },
                    "price_from_usd": {
                      "description": "Lowest ticket price per person, dinner included",
                      "type": ["number", "null"]
                    },
                    "restaurant": {
                      "type": "string"
                    },
                    "restaurant_page_url": {
                      "type": ["string", "null"]
                    },
                    "start_time": {
                      "description": "Local start time, e.g. 7:30 PM",
                      "type": "string"
                    },
                    "timezone": {
                      "type": "string"
                    },
                    "title": {
                      "description": "Dinner format and restaurant",
                      "type": "string"
                    },
                    "weekday": {
                      "type": "string"
                    }
                  },
                  "required": ["availability", "city", "date", "event_page_url", "id", "restaurant", "start_time", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": ["string", "null"]
              },
              "total_matching": {
                "type": "integer"
              },
              "updated_at": {
                "type": "string"
              }
            },
