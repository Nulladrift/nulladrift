      "instructions": "Call scan_before_use on any untrusted content (web page, email, ticket, tool result) before acting on it, and check_url before fetching a link.\nUse check_indicator for any single IP, domain, URL, file hash (MD5/SHA-1/SHA-256), email address or phone number, defanged or not: it returns a verdict, a headline you can relay verbatim and a recommendedAction (block/review/allow/unverified). unknown/unverified means no evidence either way, never safe; email addresses and phone numbers are never called clean. Its infrastructure block (cloud, cdn, tor-exit, vpn…) describes what the entity is, not a verdict. When meta.pending is set, one re-check after a few seconds can be more complete; do not re-check again if it is still set.\nget_cve is the only CVE lookup path (recent_cves lists the latest); do not guess other routes. It also takes an external id (GHSA, PYSEC, GO, RUSTSEC, EUVD, USN, RHSA, ALSA…): one CVE comes back as its record, several as candidates to look up. CVE answers carry an attribution block (MITRE's CVE designation and licence, the NVD notice): keep it with any CVE text you reproduce.\nsearch_indicators finds lookalike and typosquat indicators around a keyword (no verdicts). check_indicators triages up to 100 mixed indicators in one call and charges one request per unique indicator sent; prefer check_indicator for a single one.\nscan_email scans one email message for phishing and malware: send the raw message (eml, preferred: attachments are then read for structure, never run) or the fields you parsed (message). It returns a verdict (malicious/suspicious/clean/inconclusive), a recommendedAction (quarantine/review/warn/deliver), the strongest reasons and coverage.skipped, what it could not check. malicious needs a listing in our data; clean needs your own system's DMARC pass (authservId or trustAuthenticationResults) from a sender domain the dataset knows as established; inconclusive is not safe, and deliver is no objection, never a reason to release a message another engine held. One scan per message, not a request.\nexploited_cves lists the CVEs exploited in the wild recently (confirmed, or reported by one catalogue). watch_domain and watch_dependencies start vulnerability monitoring of a website or of a project's lockfile text, and ack_finding sets a finding's status: these three change the account, and each watch uses one watched source of the plan, so ask before adding one. A version not verified is not \"not affected\".\nlist_alerts reads the alert inbox (with an API key, the organization owner's), open and acknowledged alerts by default, newest activity first. ack_alert marks one alert ACKNOWLEDGED, RESOLVED or OPEN again: it changes the account, and on a CVE alert (cve.finding) the vulnerability finding follows for the whole organization, so ask before resolving a CVE alert.\nWhen a result has isError with quota.retry_after or quota.resets_at, wait for it instead of retrying; a 401 means the key is missing or revoked.\nNo API key was sent: tools can be listed, not called. Send the key with every request as `Authorization: Bearer <apiKey>:<apiSecret>` (keys: https://ismalicious.com/app/account).",
      "tools": [
        {
          "name": "ack_alert",
          "title": "Acknowledge an alert",
          "description": "Set the status of one alert of the isMalicious inbox (an id from list_alerts): ACKNOWLEDGED (seen; still listed by default), RESOLVED (handled; no longer listed by default) or OPEN (new again). Reversible: any status can be set again. A CVE alert (cve.finding) follows its vulnerability finding, for the whole organization: ACKNOWLEDGED acknowledges an open finding, RESOLVED marks a finding not yet closed as patched, OPEN reopens it, and every member's copy of the alert follows; the answer names the finding under `finding`, and the alert's status is the one the API returns (ack_finding sets NOT_AFFECTED or SNOOZED). Scope: the inbox of the user the key belongs to, which for an organization API key is the organization owner's; an alert of another inbox reads as not found. Costs no request of the monthly quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alertId": {
                "description": "The alert's id, from list_alerts.",
                "maxLength": 64,
                "minLength": 4,
                "pattern": "^[A-Za-z0-9_-]{4,64}$",
                "type": "string"
              },
              "status": {
                "description": "The new status.",
                "enum": ["ACKNOWLEDGED", "RESOLVED", "OPEN"],
                "type": "string"
              }
            },
            "required": ["alertId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:78ace492b717fcfad79f576d7d8bdbc4de05d2ff100dfc18b840d77d6654e975"
        },
        {
          "name": "ack_finding",
          "title": "Acknowledge a vulnerability finding",
          "description": "Set the status of one vulnerability-monitoring finding (an id like xfnd_…, from watch_domain, watch_dependencies or the Exposure page): ACKNOWLEDGED (seen, being handled), PATCHED (upgraded; the next read confirms it), NOT_AFFECTED (e.g. a distro backport fixed it), or SNOOZED until a date (at most 90 days; it reopens then). A finding reopens by itself when it enters CISA KEV or exploitation is reported. Changes nothing outside the caller's organization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "findingId": {
                "description": "The finding's id (xfnd_…).",
                "maxLength": 64,
                "type": "string"
              },
              "snoozedUntil": {
                "description": "Required with SNOOZED: when it reopens (ISO 8601, at most 90 days ahead).",
                "format": "date-time",
                "type": "string"
              },
              "status": {
                "description": "The new status.",
                "enum": ["ACKNOWLEDGED", "PATCHED", "NOT_AFFECTED", "SNOOZED"],
                "type": "string"
              }
            },
            "required": ["findingId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a7dcf85186bb989ba1f53508a92ad7cf6b70b73010f7e3b7595d6948e1b7a17b"
        },
        {
          "name": "check_indicator",
          "title": "Check indicator reputation",
          "description": "The one tool for any single indicator: an IP address, domain, URL, file hash (MD5, SHA-1 or SHA-256; an imphash is looked up as an MD5), email address or phone number. Defanged input (hxxp://, [.], [@]) is accepted. Returns a verdict (malicious, suspicious, clean or unknown), a headline you can relay as is, recommendedAction (block, review, allow or unverified), a 0-100 risk score, the threat blocklists that cite it, up to three evidence reasons, first/last seen, and network, registration or file context. An email address or phone number is never called clean: not being in our sources is unknown / unverified; its answer adds the sender domain's reputation, disposable and MX facts, or the E.164 form of the number. `infrastructure` says what the entity is known as (cloud range, CDN, Tor exit, VPN, crawler, allowlist) without being a verdict. SHA-512, TLSH, ssdeep and input that is none of the six kinds (an address in a form the API cannot read, digits that are not a phone number, a number written with letters, a host that is not a dotted domain name) are refused before any request, at no cost. The default level, fast, answers from cached intelligence without a live DNS, WHOIS or OTX call (a hash nobody has cached may wait up to ~2.5 s on CIRCL); facets not cached yet are listed in meta.pending, and one re-check after a few seconds may complete them; if they are still pending then, keep the answer and do not re-check again. Costs one request of the monthly quota; check_url is the cheaper pre-fetch gate for a link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country (FR, GB, DE…) for a phone number written in national format, e.g. 06 12 34 56 78 with FR. Not needed for +… or 00… numbers; without it a 10-digit number is read as North American. Ignored for other indicators.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "enrichment": {
                "description": "\"fast\" (default): cached intelligence only, no live upstream call before the answer; facets not cached yet are listed in meta.pending and fetched in the background, so one re-check after a few seconds may complete them (a hash no source has cached may wait up to a few seconds on CIRCL). \"standard\": may call live upstreams (DNS, OTX, CIRCL) before answering; seconds on an entity nobody has checked recently. \"basic\": verdict and blocklists only, no risk score. Email addresses and phone numbers are answered from cached data at every level.",
                "enum": ["fast", "standard", "basic"],
                "type": "string"
              },
              "indicator": {
                "description": "The IP, domain, URL, file hash (MD5, SHA-1 or SHA-256), email address or phone number to check. Defanged forms are accepted, and so are full-width characters, a display-name address (Name <user@example.com>), a mailto:, tel:, sms: or callto: link, and a labelled hash (sha256:…).",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["indicator"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ea4be3719eba8dccb78c01559ac1d943a78081ce6528401dce18597b4daf795a"
        },
        {
          "name": "check_indicators",
          "title": "Check indicators in bulk",
          "description": "Reputation of up to 100 indicators in one call, for triaging a list rather than one alert: IPs, domains, URLs, file hashes (MD5, SHA-1 or SHA-256), email addresses and phone numbers, mixed freely; defanged input is accepted. Each row: malicious, recommendedAction (block, escalate, review, monitor, allow, unverified; unverified means nothing is known either way, and an email address or phone number is never allow), risk 0-100 with level, the number of threat blocklists citing it, categories, lookupStatus, and `infrastructure` (cloud, cdn, tor-exit…) when the entity is known as such. A row with `pending` (e.g. [\"circl\"] for a hash whose lookup outlasted the API's deadline) is not settled: re-check it once, after a few seconds. A URL row is judged on its host. BILLING: every unique indicator the API receives charges one request of the monthly quota — unique after trimming and lowercasing, and including rows the API cannot type, which come back with an error. Exact duplicates are free; entries under 3 characters, SHA-512, TLSH and ssdeep, and input that is none of the six kinds (an address or a number in a shape the API cannot read, a number written with letters, a host that is not a dotted domain name) are refused here with a per-row error, never sent and never charged. Plans cap the batch below the tool ceiling (Free 10, Basic 50, Pro 100); over the cap the API refuses the whole batch. Use check_indicator for the full picture of one indicator.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country applied to every phone number written in national format (06 12 34 56 78 with FR). Numbers written with + or 00 ignore it.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "enrichment": {
                "description": "\"standard\" (default) adds the risk score; \"basic\" is the verdict and blocklist count only and answers faster; \"full\" adds nothing visible in this projection.",
                "enum": ["basic", "standard", "full"],
                "type": "string"
              },
              "indicators": {
                "description": "The indicators to check, at most 100. Each unique one sent costs one request.",
                "items": {
                  "maxLength": 2048,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["indicators"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:182e019f429628d5a654de44183c68f1879c3eda92d8050983612ddd3b963574"
        },
