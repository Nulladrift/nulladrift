        {
          "name": "exploited_cves",
          "title": "CVEs exploited in the wild",
          "description": "CVEs with attested exploitation in the last N days (default 7): confirmed (CISA KEV, CISA SSVC active, or two independent catalogues) or reported (one catalogue). Those first attested inside the window come first, then those only seen again in it; confirmed first in each. Each with severity, CVSS, EPSS, first and last exploitation evidence, KEV date, whether a patch exists, the sources, and how many indicators in our data were tagged with it this week (absent when unknown, never 0). Not in this list does not mean not exploited. Follow up with get_cve for one CVE. Costs one request of the monthly quota with a key; works without one (rate-limited by IP).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days (default 7).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Number of CVEs to return (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25c1d0fdad15dd7d311b1ecef51eaa1c15cea95b6948c3e565aeea7e661b61e2"
        },
        {
          "name": "get_cve",
          "title": "Look up a CVE",
          "description": "One CVE by id: description, severity, CVSS score and vector, EPSS exploitation probability, CISA KEV status (date added, due date, required action, known ransomware use), exploitation evidence where recorded (CISA SSVC none/poc/active, Exploit-DB ids, Nuclei template, the number of Metasploit modules, Microsoft's exploited flag), affected packages with introduced and fixed versions (OSV.dev, first 5), vendor advisories (CSAF, first 3), external identifiers (GHSA, PYSEC, GO, EUVD ids, bundle advisories such as USN or RHSA, first 6), the products the CNA itself declares affected in the CVE record with their version ranges (often the only product data before NVD analyses a CVE; as many as fit), publication dates and references (NVD, KEV, EPSS, CERT-FR, GitHub advisories, Exploit-DB), and an attribution block: MITRE's CVE designation and licence and the NVD notice, to keep with any CVE text you reproduce, and the sources the answer draws on. Also takes an external id (GHSA-…, PYSEC-…, GO-…, RUSTSEC-…, EUVD-…, USN-…, RHSA-…, ALSA-…, a Metasploit module path…): one CVE comes back as its record with resolvedFrom, several as a list of candidate CVE ids to look up. No recorded exploitation evidence does not mean the CVE is not exploited. This is the only CVE lookup path; do not guess other routes. Costs one request of the monthly quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "CVE identifier, e.g. CVE-2021-44228, or an external id naming it, e.g. GHSA-jfh8-c2jp-5v3q, PYSEC-2021-101, EUVD-2025-1234, USN-7000-1. Case-insensitive.",
                "pattern": "^(?:[Cc][Vv][Ee]-\\d{4}-\\d{4,}|(?:[Gg][Hh][Ss][Aa]|[Pp][Yy][Ss][Ee][Cc]|[Gg][Oo]|[Rr][Uu][Ss][Tt][Ss][Ee][Cc]|[Pp][Ss][Ff]|[Ee][Ee][Ff]|[Jj][Ll][Ss][Ee][Cc]|[Rr][Ss][Ee][Cc]|[Hh][Ss][Ee][Cc]|[Oo][Ss][Ee][Cc]|[Dd][Rr][Uu][Pp][Aa][Ll]|[Cc][Uu][Rr][Ll]|[Bb][Ii][Tt]|[Mm][Aa][Ll]|[Aa][Ss][Bb]|[Pp][Uu][Bb]|[Oo][Ss][Vv]|[Gg][Ss][Dd]|[Aa][Zz][Ll]|[Cc][Gg][Aa]|[Mm][Ii][Nn][Ii]|[Ee][Uu][Vv][Dd]|[Gg][Cc][Vv][Ee]|[Aa][Ll][SsBbEe][Aa]|[Rr][LlXx][SsBbEe][Aa]|[Rr][Hh][SsBbEe][Aa]|[UuLl][Ss][Nn]|[Dd][Ss][Aa]|[Dd][Ll][Aa]|[Dd][Tt][Ss][Aa]|(?:[Oo][Pp][Ee][Nn])?[Ss][Uu][Ss][Ee]|[Mm][Gg][Aa][Ss][Aa]|[Oo][Ee][Ss][Aa]|[Cc][Ll][Ss][Aa]|[Ee][Ll][Ss][Aa]|[Aa][Ll][Aa][Ss](?:2|2022|2023)?|[Ee][Dd][Bb]|[Zz][Dd][Ii]|[Uu][Bb][Uu][Nn][Tt][Uu]|[Dd][Ee][Bb][Ii][Aa][Nn]|[Aa][Ll][Pp][Ii][Nn][Ee]|[Bb][Ee][Ll][Ll]|[Ee][Cc][Hh][Oo]|[Rr][Oo][Oo][Tt])-[A-Za-z0-9:._+-]{1,80}|[Mm][Ss]\\d{2}-\\d{3}|(?:[Ee][Xx][Pp][Ll][Oo][Ii][Tt]|[Aa][Uu][Xx][Ii][Ll][Ii][Aa][Rr][Yy]|[Pp][Oo][Ss][Tt])/[A-Za-z0-9_./-]{3,180})$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5fc42f8eee1386ec04043817a5e05d1a40b42b6e6122b1f18e202ecd24bcd81"
        },
        {
          "name": "list_alerts",
          "title": "List alerts",
          "description": "One page of the isMalicious alert inbox (GET /alerts): the alerts raised on what the account watches, such as a watched domain or IP turning malicious or named on a ransomware leak site, certificate, WHOIS, location and infrastructure changes, lookalike domains, and vulnerability findings (cve.finding). Open and acknowledged alerts by default (set status to change that), most recent activity first; filters by severity, eventType, entityType and a search over title, description and value. Each alert: id (for ack_alert), type, severity, status, entity, title, description (300 characters at most), source, confidence and dates; a CVE alert also names its findingId, cveId and priority (for ack_finding). When hasMore is true, call again with offset + returned. Scope: the inbox of the user the key belongs to, which for an organization API key is the organization owner's; alerts on items another member watches are in that member's inbox. Read-only. Costs no request of the monthly quota (the key's per-minute burst limit applies).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entityType": {
                "description": "What the alert is about (default all); a CVE alert is `system`.",
                "items": {
                  "enum": ["domain", "ip", "account", "system", "email", "phone", "crypto"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "eventType": {
                "description": "Alert types to list (default all).",
                "items": {
                  "enum": ["monitor.alert", "threat.detected", "usage.warning", "system.notice", "reputation.changed", "reputation.cleared", "certificate.expiring", "certificate.expired", "certificate.changed", "whois.changed", "geo.changed", "sources.added", "category.changed", "infra.changed", "cve.finding", "typosquat.detected"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "limit": {
                "description": "Alerts per page (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Alerts to skip (default 0): the previous page's offset + returned.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "search": {
                "description": "Text matched in the title, the description or the value (e.g. a domain or a CVE id).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "severity": {
                "description": "Severities to list, e.g. [\"critical\", \"high\"] (default all).",
                "items": {
                  "enum": ["critical", "high", "medium", "low"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "status": {
                "description": "Statuses to list (default OPEN and ACKNOWLEDGED).",
                "items": {
                  "enum": ["OPEN", "ACKNOWLEDGED", "RESOLVED"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
