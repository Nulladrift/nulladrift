# Version updates, as pull requests against develop. Security alerts are on separately, in the
# repository's settings, and are not affected by this file.
#
# Weekly and grouped: one pull request for every minor and patch release of the npm packages, one
# for the GitHub Actions, and one of its own for each major, since a major is the one that can
# need code changes. Nothing younger than three days is proposed: pnpm-workspace.yaml already
# refuses to install a release under a day old (minimumReleaseAge), and the days after that are
# when a compromised release tends to be noticed and pulled.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The packages support Node 22 and later. Types for a newer Node would let code use what 22 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint and rollup-plugin-dts (tsup's declaration build) need TypeScript's compiler
      # API, which 7.0 does not ship. Remove once typescript-eslint supports it
      # (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
