# Typecheck, lint, tests and the bundle. The suite spawns real MCP servers over stdio, which is
# why the drift tests exercise the wire rather than a mocked client. Nothing here needs a service:
# the integration suite that did lives with the control plane, in the application repository.
name: ci
# Nothing here needs more than the checkout; fork PRs get the same read-only token.
permissions:
  contents: read
on:
  # Pull requests target `develop`; `main` only ever receives a merge from it. Both are listed
  # so a push to either is gated, and so the required check exists on both branches -- branch
  # protection can only require a check it has seen run there.
  pull_request:
  push:
    branches: [main, develop]
  # So the gate can be run against a branch without pushing to it, which is what you want the
  # first time CI is expected to work: the question is whether the runner starts at all, and
  # answering it should not need a commit nobody wanted to make.
  workflow_dispatch:

# Actions are pinned to commit SHAs, with the version in the comment: a tag can be moved to point
# at someone else's code. To update one, resolve the tag with
# `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
jobs:
  check:
    # Pinned rather than latest: the ubuntu-latest label began moving to Ubuntu 26 on 19 October
    # 2026, and a runner that changes underneath you is a variable nobody chose. Raise this
    # deliberately, with the rest of the matrix green.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The sign-off check reads every commit in a pull request, not just its tip.
          fetch-depth: 0

      # Contributions come in under the Developer Certificate of Origin (CONTRIBUTING.md): every
      # contributed commit carries a sign-off naming its own author. A contribution is a pull
      # request from a fork; a branch in this repository can only be pushed by someone with write
      # access, which is the maintainers and the release app, whose commits are not signed off.
      # Not `author_association`: an organization member whose membership is private arrives in
      # the event as CONTRIBUTOR. Merge commits are skipped. Hashes only in the output: commit
      # metadata comes from whoever opened the pull request.
      - name: Contributed commits are signed off (DCO)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            if ! git log -1 --format=%B "$sha" | grep -i '^Signed-off-by:' | grep -qiF "<$email>"; then
              echo "::error::commit $sha is not signed off by its author. Sign off with git commit -s; see CONTRIBUTING.md."
              missing=1
            fi
          done
          exit $missing

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      # A rule CONTRIBUTING states and nothing enforced. Two had shipped by the time anyone
      # looked. Scoped to the source that produces text a user reads, not to the repository's
      # own prose, which is held to the house style rather than to the product's.
      - name: No em dashes in anything a user reads
        run: |
          if grep -rn $'—' --include='*.ts' packages/*/src; then
            echo "::error::em dash in user-facing text; see CONTRIBUTING.md"
            exit 1
          fi

      # Includes the end-to-end suite: spawn a server, negotiate the protocol era, pin it, and
      # detect a rug pull.
      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # The published CLI must carry no workspace references. `@nulladrift/core` is a
      # devDependency so tsup bundles it; if it ever becomes a regular dependency, npm installs
      # a `workspace:*` range it cannot resolve and `npx nulladrift` breaks for everyone.
      - name: The bundle resolves without the workspace
        run: |
          cd packages/cli
          pnpm pack --pack-destination /tmp
          if tar xzOf /tmp/nulladrift-*.tgz package/dist/index.js | grep -q '@nulladrift/'; then
            echo "::error::published bundle references a workspace package"
            exit 1
          fi

      # The worked example in the README is generated by the product. If it stops matching, the
      # documentation is describing a format the code no longer writes.
      - name: Example lockfile is current
        run: |
          pnpm --filter nulladrift example:emit
          git diff --exit-code examples/mcp.lock
