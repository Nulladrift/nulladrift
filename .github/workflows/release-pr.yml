# Opens the release pull request, once a week, and never merges it.
#
# The version used to be bumped in whichever feature branch was open, which is how twelve
# versions reached the registry in fourteen hours -- 0.3.0 and 0.3.1 ten minutes apart, for work
# that was one change. A version number is a promise to whoever installs it, and the author of
# one change cannot see what else is going out beside it.
#
# So feature branches add a note under `## [Unreleased]` and nothing else. This reads those notes
# on a Thursday, works out whether they amount to a minor or a patch, writes the bump and the
# changelog entry onto a branch, and opens `develop -> main` for a person to read and merge.
#
# Merging is deliberately not automated. Publishing is irreversible -- npm never lets a version
# number be reused -- and the point of batching was to put a human between the work and the
# registry, which an auto-merge would hand straight back.
#
# A fix that disables or bypasses a control does not wait for Thursday. Run this by hand, or cut
# the release the usual way; see CONTRIBUTING.md.
name: release-pr

on:
  schedule:
    # 09:00 UTC Thursday: inside a European working day and before one starts in the Americas, so
    # whoever merges it is awake for the publish and the hour after it.
    - cron: "0 9 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          # The whole history, because the last tag is what says whether a version was already
          # prepared and never shipped.
          fetch-depth: 0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exit 3 means `## [Unreleased]` is empty. A quiet week is not a release, and a pull request
      # proposing nothing is the kind of noise people learn to close without reading.
      - name: Is there anything to release
        id: plan
        run: |
          set +e
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null)" node scripts/prepare-release.mjs --check
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Prepare the release commit
        if: steps.plan.outputs.skip != 'true'
        run: |
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null)" node scripts/prepare-release.mjs
          # The worked example in the README is generated by the product and carries its version.
          pnpm --filter nulladrift example:emit

      # Gated before a person is asked to look. A release branch that cannot pass CI wastes the
      # one review the whole cadence exists to create.
      - name: Gates
        if: steps.plan.outputs.skip != 'true'
        run: pnpm -r typecheck && pnpm -r lint && pnpm -r test && pnpm -r build

      - name: Open the release pull request
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          branch="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -aqm "Release ${VERSION}"
          git push -q origin "$branch"

          # Against develop, not main: the bump has to land on develop too, or the next release
          # would compute its version from a number that was never written down.
          gh pr create --base develop --head "$branch" \
            --title "Release ${VERSION}" \
            --body "$(printf '%s\n' \
              "Prepared by \`release-pr\`. The version comes from the \`## [Unreleased]\` notes: something added makes it a minor, only fixes make it a patch." \
              "" \
              "**Merge this into \`develop\`, then open \`develop\` into \`main\` and tag \`v${VERSION}\` on main to publish.**" \
              "" \
              "Nothing here is automatic past this point. Publishing is irreversible, and npm never lets a version number be reused." \
              "" \
              "If this is wrong, close it: nothing has been published and the notes stay where they are for next week.")"
