# Publish to npm from a tag, with provenance. Nothing here is run by hand: a release that a
# person can produce locally is a release nobody can check afterwards, and for a package whose
# whole claim is "you can tell when something changed", that would be the wrong way round.
#
# Two packages, in order. `@nulladrift/core` goes first because the control plane consumes it
# from npm: if the collector ships an engine the server cannot yet install, the two sides are
# briefly reading different rules, which is the one thing this product must never do.
name: release

on:
  push:
    tags: ["v*"]
# No workflow_dispatch. A manual run skipped both release checks below (they were limited to tag
# pushes) and the `npm` environment accepted any ref, so anyone with write access could dispatch
# this on a branch and publish it with provenance. A stranded publish is re-run from its tag's
# run instead ("Re-run failed jobs"), which keeps the ref a tag.

permissions:
  contents: read

# Actions are pinned to commit SHAs, with the version in the comment: a tag can be moved to point
# at someone else's code. To update one, resolve the tag with
# `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
jobs:
  # Everything that runs dependency code happens here, with no publish credential. It used to share
  # a job with the publish, so every package in the lockfile ran (install, lint, test, build) while
  # the job could mint an npm token: one compromised dev dependency was a publish.
  build:
    # Pinned rather than latest: the ubuntu-latest label began moving to Ubuntu 26 on 19 October
    # 2026, and a runner that changes underneath you is a variable nobody chose. Raise this
    # deliberately, with the rest of the matrix green.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The ancestry check below needs history; the default shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      # No `cache: pnpm`. The cache is written by runs on develop (crawl, release-pr), so a run that
      # poisoned it would reach the tarballs; a release installs from the lockfile's integrity
      # hashes and nothing else.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Releases come from a tag. Checked here as well as by the trigger, so a future trigger
      # cannot quietly widen it.
      - name: The ref is a release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "$GITHUB_REF_NAME" ;;
            *) echo "::error::$GITHUB_REF is not a v* tag"; exit 1 ;;
          esac
      # Releases are cut from main, and from what main merged. `on: push: tags` fires for a tag on
      # any commit, so without this a `v*` tag on a feature branch publishes from code that never
      # reached main -- past review, past the branch protection, straight to the registry. Any
      # ancestor of main was accepted, which included every intermediate commit a merge brought
      # in, never reviewed as a whole tree; first-parent history is the commits main itself was.
      - name: The tag is on main
        run: |
          git fetch --no-tags --quiet origin main
          if ! git rev-list --first-parent origin/main | grep -qx "$GITHUB_SHA"; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main's first-parent history. Merge develop into main, then tag main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main"
      # A tag that disagrees with package.json publishes a version nobody can find again from
      # the git history. Cheaper to stop here than to unpublish.
      #
      # Both packages are checked: they are versioned together on purpose, so that the engine a
      # given collector bundles is the engine the control plane can install by the same number.
      - name: Tag matches both package versions
        id: version
        run: |
          cli="v$(node -p "require('./packages/cli/package.json').version")"
          core="v$(node -p "require('./packages/core/package.json').version")"
          for pair in "packages/cli:$cli" "packages/core:$core"; do
            path="${pair%%:*}"; got="${pair##*:}"
            if [ "$got" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match $path/package.json ($got)"
              exit 1
            fi
          done
          echo "version=${cli#v}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # The same gates as ci, because a tag is not a reason to check less.
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build
      # `pnpm publish`, not `npm publish`: the workspace uses catalog: dependencies, and only
      # pnpm rewrites them to real ranges on the way into the tarball. npm would publish a
      # package.json asking for "zod": "catalog:", which installs nowhere. pnpm also applies
      # publishConfig.exports, which is what points the published core at dist rather than src.
      #
      # --no-git-checks because the tag ref is checked out detached, which pnpm otherwise
      # refuses; the version agreement is already asserted above.
      # No NODE_AUTH_TOKEN. Both packages have a trusted publisher pointing at this repository and
      # this workflow, so pnpm exchanges the job's OIDC token for a short-lived registry
      # credential and nothing long-lived exists to leak. Earlier runs show pnpm attempting this
      # on its own and falling back to the token; there is nothing to fall back to now, which is
      # the point.
      #
      # Provenance is set in pnpm-workspace.yaml, not here. `--provenance` is not a documented
      # pnpm flag and is swallowed without error, so passing it would look like a guarantee and
      # not be one.
      # Packed by pnpm, published by npm, for one reason each.
      #
      # pnpm packs: it rewrites `catalog:` ranges into real ones and applies publishConfig, which
      # is what points the published core at dist rather than src. npm would publish a manifest
      # asking for "zod": "catalog:", which installs nowhere.
      #
      # npm publishes: pnpm's OIDC token exchange answers 404 against a package that does have a
      # trusted publisher configured, so it falls back to a credential that is not there. npm's
      # implementation is the one npm documents, and it owns --provenance, which is not a pnpm
      # flag at all.
      - name: Pack both packages
        run: |
          mkdir -p /tmp/dist
          (cd packages/core && pnpm pack --pack-destination /tmp/dist)
          (cd packages/cli  && pnpm pack --pack-destination /tmp/dist)
          ls -la /tmp/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: /tmp/dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes the two tarballs the build job made, and nothing else. No checkout, no install, no
  # cache: the only code that runs while the job can mint an npm credential is npm itself, at an
  # exact version.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what lets npm attest that these tarballs
      # were built by this workflow from this commit, rather than uploaded from a laptop.
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: /tmp/dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Required, and it was removed once by mistake. This writes the .npmrc that tells npm
          # which registry to authenticate against; without it npm reports ENEEDAUTH and never
          # attempts an OIDC exchange at all, because it has no registry context to exchange for.
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10, and OIDC trusted publishing needs npm 11.5.1 or newer. Exact, not
      # `^11`: this is the one program that runs with the publish credential, and a range took
      # whatever was newest on the day, outside the lockfile and the release-age gate.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@11.21.1
          echo "npm $(npm --version), node $(node --version)"
      # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into the .npmrc and
      # exports that variable as a literal XXXXX-XXXXX-XXXXX-XXXXX when nothing supplies one. npm
      # then believes it holds a credential, uses the placeholder, and never attempts the OIDC
      # exchange at all: the publish fails 404 having signed a perfectly good provenance statement
      # first, which makes it look like a permissions problem rather than a credential that is
      # not a credential.
      #
      # Keep the registry line, drop the auth line. With no credential configured and
      # id-token: write available, npm exchanges the job's OIDC token for a short-lived one.
      - name: Registry configured, credential deliberately absent
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          cat "$NPM_CONFIG_USERCONFIG"

      # Each publish skips a version already on the registry. Two packages publish in sequence,
      # so any failure in the second leaves the first done; re-running then failed on "cannot
      # publish over the previously published versions" and never reached the one that still
      # needed publishing. A release that cannot be re-run is a release that strands itself
      # halfway on its first bad day.
      - name: Publish @nulladrift/core
        run: |
          version="$VERSION"
          if npm view "@nulladrift/core@$version" version >/dev/null 2>&1; then
            echo "@nulladrift/core@$version is already on the registry, nothing to do"
          else
            npm publish /tmp/dist/nulladrift-core-*.tgz --provenance --access public
          fi

      - name: Publish nulladrift
        run: |
          version="$VERSION"
          if npm view "nulladrift@$version" version >/dev/null 2>&1; then
            echo "nulladrift@$version is already on the registry, nothing to do"
          else
            npm publish /tmp/dist/nulladrift-0*.tgz --provenance --access public
          fi

      # The claim, checked. Everything above can succeed and still produce a tarball with no
      # attestation: pnpm 11 has been reported to ignore provenance settings depending on how
      # they are supplied, and a release that quietly loses its provenance is worse than one that
      # fails, because the package page keeps saying what people believe it says.
      #
      # The registry takes a moment to expose attestations after a publish, hence the retry.
      - name: Both packages were published with provenance
        run: |
          version="$VERSION"
          for pkg in "@nulladrift/core" "nulladrift"; do
            ok=
            for attempt in 1 2 3 4 5 6; do
              if [ -n "$(npm view "$pkg@$version" dist.attestations --json 2>/dev/null)" ]; then
                ok=1; break
              fi
              echo "waiting for $pkg@$version attestation (attempt $attempt)"
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::$pkg@$version published without a provenance attestation"
              exit 1
            fi
            echo "$pkg@$version: provenance attested"
          done
