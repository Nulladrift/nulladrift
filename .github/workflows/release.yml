# Publish to npm from a tag, with provenance. Nothing here is run by hand: a release that a
# person can produce locally is a release nobody can check afterwards, and for a package whose
# whole claim is "you can tell when something changed", that would be the wrong way round.
#
# Two packages, in order. `@nulladrift/core` goes first because the control plane consumes it
# from npm: if the collector ships an engine the server cannot yet install, the two sides are
# briefly reading different rules, which is the one thing this product must never do.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs, with the version in the comment: a tag can be moved to point
# at someone else's code. To update one, resolve the tag with
# `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
jobs:
  publish:
    # Pinned rather than latest: the ubuntu-latest label began moving to Ubuntu 26 on 19 October
    # 2026, and a runner that changes underneath you is a variable nobody chose. Raise this
    # deliberately, with the rest of the matrix green.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what lets npm attest that these tarballs
      # were built by this workflow from this commit, rather than uploaded from a laptop.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          # Deliberately no registry-url. It writes an .npmrc whose auth token is NODE_AUTH_TOKEN,
          # and sets that variable to a literal XXXXX-XXXXX-XXXXX-XXXXX when no token is supplied.
          # With trusted publishing there is no token to supply, so the placeholder is sent as the
          # credential and the registry answers 404 on the PUT.

      - run: pnpm install --frozen-lockfile

      # The same gates as ci, because a tag is not a reason to check less.
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build

      # A tag that disagrees with package.json publishes a version nobody can find again from
      # the git history. Cheaper to stop here than to unpublish.
      #
      # Both packages are checked: they are versioned together on purpose, so that the engine a
      # given collector bundles is the engine the control plane can install by the same number.
      - name: Tag matches both package versions
        if: github.event_name == 'push'
        run: |
          cli="v$(node -p "require('./packages/cli/package.json').version")"
          core="v$(node -p "require('./packages/core/package.json').version")"
          for pair in "packages/cli:$cli" "packages/core:$core"; do
            path="${pair%%:*}"; got="${pair##*:}"
            if [ "$got" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match $path/package.json ($got)"
              exit 1
            fi
          done

      # `pnpm publish`, not `npm publish`: the workspace uses catalog: dependencies, and only
      # pnpm rewrites them to real ranges on the way into the tarball. npm would publish a
      # package.json asking for "zod": "catalog:", which installs nowhere. pnpm also applies
      # publishConfig.exports, which is what points the published core at dist rather than src.
      #
      # --no-git-checks because the tag ref is checked out detached, which pnpm otherwise
      # refuses; the version agreement is already asserted above.
      # No NODE_AUTH_TOKEN. Both packages have a trusted publisher pointing at this repository and
      # this workflow, so pnpm exchanges the job's OIDC token for a short-lived registry
      # credential and nothing long-lived exists to leak. Earlier runs show pnpm attempting this
      # on its own and falling back to the token; there is nothing to fall back to now, which is
      # the point.
      #
      # Provenance is set in pnpm-workspace.yaml, not here. `--provenance` is not a documented
      # pnpm flag and is swallowed without error, so passing it would look like a guarantee and
      # not be one.
      # Packed by pnpm, published by npm, for one reason each.
      #
      # pnpm packs: it rewrites `catalog:` ranges into real ones and applies publishConfig, which
      # is what points the published core at dist rather than src. npm would publish a manifest
      # asking for "zod": "catalog:", which installs nowhere.
      #
      # npm publishes: pnpm's OIDC token exchange answers 404 against a package that does have a
      # trusted publisher configured, so it falls back to a credential that is not there. npm's
      # implementation is the one npm documents, and it owns --provenance, which is not a pnpm
      # flag at all.
      - name: Pack both packages
        run: |
          mkdir -p /tmp/dist
          (cd packages/core && pnpm pack --pack-destination /tmp/dist)
          (cd packages/cli  && pnpm pack --pack-destination /tmp/dist)
          ls -la /tmp/dist

      - name: Publish @nulladrift/core
        run: npm publish /tmp/dist/nulladrift-core-*.tgz --provenance --access public

      - name: Publish nulladrift
        run: npm publish /tmp/dist/nulladrift-0*.tgz --provenance --access public

      # The claim, checked. Everything above can succeed and still produce a tarball with no
      # attestation: pnpm 11 has been reported to ignore provenance settings depending on how
      # they are supplied, and a release that quietly loses its provenance is worse than one that
      # fails, because the package page keeps saying what people believe it says.
      #
      # The registry takes a moment to expose attestations after a publish, hence the retry.
      - name: Both packages were published with provenance
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          for pkg in "@nulladrift/core" "nulladrift"; do
            ok=
            for attempt in 1 2 3 4 5 6; do
              if [ -n "$(npm view "$pkg@$version" dist.attestations --json 2>/dev/null)" ]; then
                ok=1; break
              fi
              echo "waiting for $pkg@$version attestation (attempt $attempt)"
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::$pkg@$version published without a provenance attestation"
              exit 1
            fi
            echo "$pkg@$version: provenance attested"
          done
