# Publish to npm from a tag, with provenance. Nothing here is run by hand: a release that a
# person can produce locally is a release nobody can check afterwards, and for a package whose
# whole claim is "you can tell when something changed", that would be the wrong way round.
#
# Two packages, in order. `@nulladrift/core` goes first because the control plane consumes it
# from npm: if the collector ships an engine the server cannot yet install, the two sides are
# briefly reading different rules, which is the one thing this product must never do.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs, with the version in the comment: a tag can be moved to point
# at someone else's code. To update one, resolve the tag with
# `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
jobs:
  publish:
    # Pinned rather than latest: the ubuntu-latest label began moving to Ubuntu 26 on 19 October
    # 2026, and a runner that changes underneath you is a variable nobody chose. Raise this
    # deliberately, with the rest of the matrix green.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what lets npm attest that these tarballs
      # were built by this workflow from this commit, rather than uploaded from a laptop.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The same gates as ci, because a tag is not a reason to check less.
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build

      # A tag that disagrees with package.json publishes a version nobody can find again from
      # the git history. Cheaper to stop here than to unpublish.
      #
      # Both packages are checked: they are versioned together on purpose, so that the engine a
      # given collector bundles is the engine the control plane can install by the same number.
      - name: Tag matches both package versions
        if: github.event_name == 'push'
        run: |
          cli="v$(node -p "require('./packages/cli/package.json').version")"
          core="v$(node -p "require('./packages/core/package.json').version")"
          for pair in "packages/cli:$cli" "packages/core:$core"; do
            path="${pair%%:*}"; got="${pair##*:}"
            if [ "$got" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match $path/package.json ($got)"
              exit 1
            fi
          done

      # `pnpm publish`, not `npm publish`: the workspace uses catalog: dependencies, and only
      # pnpm rewrites them to real ranges on the way into the tarball. npm would publish a
      # package.json asking for "zod": "catalog:", which installs nowhere. pnpm also applies
      # publishConfig.exports, which is what points the published core at dist rather than src.
      #
      # --no-git-checks because the tag ref is checked out detached, which pnpm otherwise
      # refuses; the version agreement is already asserted above.
      - name: Publish @nulladrift/core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Publish nulladrift
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --no-git-checks
