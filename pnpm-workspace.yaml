packages:
  - packages/*

# Supply-chain guard: skip versions published less than 24h ago. A tool whose whole subject is
# dependency drift has no business installing a package nobody has looked at yet.
minimumReleaseAge: 1440

catalog:
  typescript: ^5.9.3
  "@types/node": ^24.19.2
  zod: ^4.6.7

# esbuild is reached through tsup and is build-time only, so it never ships. The advisories are
# still real for anyone building this locally, and a tool whose subject is dependency drift does
# not get to call that someone else's release schedule. Remove once tsup resolves a fixed version.
overrides:
  esbuild: ^0.28.2

# pnpm refuses to run a dependency's install scripts unless it is named here, and errors rather
# than warning, so a package that needs one fails the install instead of failing later in a way
# nobody traces back. Carried over from the monorepo this was split out of.
allowBuilds:
  # tsup's bundler needs its postinstall to place the platform binary.
  esbuild: true
  # eslint's resolver ships a native binary the same way.
  unrs-resolver: true
